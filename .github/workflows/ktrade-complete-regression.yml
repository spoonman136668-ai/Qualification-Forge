name: KTRADE source-pinned complete regression and builds
on:
  push:
    branches: [qualification/ktrade-real-ui-inventory-20261018]
    paths: [.github/workflows/ktrade-complete-regression.yml]
permissions:
  contents: read
jobs:
  regression:
    if: github.repository == 'spoonman136668-ai/Qualification-Forge' && github.actor == 'spoonman136668-ai'
    runs-on: windows-2022
    timeout-minutes: 48
    env:
      EXPECTED_SHA: 'f9dee34b5c4d414478e64cd46ad2a9cd3ea58a0d'
      EXPECTED_TREE: 'dfe8808291f41cc3ebcdbf2f54587054eca42ca8'
      KTRADE_CI_PAPER_ONLY: '1'
      KTRADE_CI_COINBASE_ALLOWED: '0'
      KTRADE_CI_LIVE_AUTHORITY: '0'
      KTRADE_CI_PROMOTION_ALLOWED: '0'
      KTRADE_RECOVERY_ISOLATED: '1'
      KTRADE_USE_LEGACY_CDP_CONFIG: '0'
      GOFLAGS: '-p=2'
      GOMAXPROCS: '2'
      GOWORK: 'off'
    steps:
      - name: Private exact KTRADE checkout
        uses: actions/checkout@v4
        with:
          repository: spoonman136668-ai/ktrade
          ref: f9dee34b5c4d414478e64cd46ad2a9cd3ea58a0d
          path: private
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.KTRADE_SOURCE_READ_TOKEN }}
      - name: Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run focused regressions then precisely one complete Go suite
        id: tests
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:GITHUB_WORKSPACE 'private'
          $log=Join-Path $env:RUNNER_TEMP 'ktrade-complete-private.log'
          if($env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows'){throw 'WRONG_QUALIFICATION_RUNNER'}
          if($env:KTRADE_CI_LIVE_AUTHORITY -cne '0' -or $env:KTRADE_CI_COINBASE_ALLOWED -cne '0' -or $env:KTRADE_CI_PROMOTION_ALLOWED -cne '0'){throw 'LIVE_AUTHORITY_FORBIDDEN'}
          if((& git -C $root rev-parse HEAD).Trim() -cne $env:EXPECTED_SHA -or (& git -C $root rev-parse 'HEAD^{tree}').Trim() -cne $env:EXPECTED_TREE){throw 'IDENTITY_DRIFT'}
          Push-Location $root
          try{
            & go mod download *> $log
            if($LASTEXITCODE -ne 0){throw 'MODULE_DOWNLOAD_FAILED'}
            & go test -mod=readonly -tags=ktrade_full -count=1 -timeout=300s -run '^TestKTradePineLibrary' ./cmd/ktrade *> $log
            if($LASTEXITCODE -ne 0){throw 'PINE_LIBRARY_FOCUSED_FAILED'}
            if((& git -C $root rev-parse HEAD:internal/durableupgrade/installed_inventory_review.go).Trim() -cne 'ee91b19a810c248376628489f6b398107806f339'){throw 'INSTALLED_INVENTORY_PROBE_SOURCE_DRIFT'}
            if((& git -C $root rev-parse HEAD:internal/durableupgrade/installed_inventory_review_test.go).Trim() -cne '908e06b9eee11db92ec0e374888f78c1f1a68af1'){throw 'INSTALLED_INVENTORY_TEST_SOURCE_DRIFT'}
            & go test -mod=readonly -count=1 -timeout=240s -run '^TestInstalledDataSyntheticInventory' ./internal/durableupgrade *> $log
            if($LASTEXITCODE -ne 0){
              $safe=@(Get-Content -LiteralPath $log -ErrorAction SilentlyContinue | Where-Object {$_ -match '^# ktrade/' -or $_ -match '^--- FAIL: Test' -or $_ -match '^FAIL[[:space:]]'}|Select-Object -First 12)
              foreach($line in $safe){Write-Output "KTRADE_SYNTHETIC_INVENTORY_SAFE_DIAGNOSTIC: $line"}
              throw 'KTRADE_SYNTHETIC_PORTABLE_INVENTORY_INCOMPLETE'
            }
            Write-Output 'KTRADE_SOURCE_BACKED_PORTABLE_AND_EXCLUDED_USER_DATA_INVENTORY=PASS'
            Write-Output 'KTRADE_ACTUAL_INSTALLED_PRIVATE_DATA_INVENTORIED=FALSE'
            & go test -mod=readonly -count=1 -timeout=300s ./internal/papertrading ./internal/paperweb *> $log
            if($LASTEXITCODE -ne 0){throw 'PAPER_FOCUSED_FAILED'}
            & node --test tests/historical_pine_editor_chart_wiring.test.cjs tests/pine_library_compat_browser.test.cjs tests/paper_tradeguard_reconciliation.test.cjs *> $log
            if($LASTEXITCODE -ne 0){throw 'SOURCE_JS_FOCUSED_FAILED'}
            Write-Output 'KTRADE_FOCUSED_PINE_PAPER_UI_REGRESSION=PASS'
            & go test -mod=readonly -count=1 -timeout=900s ./... *> $log
            $code=$LASTEXITCODE
            $all=[string](Get-Content -LiteralPath $log -Raw -ErrorAction SilentlyContinue)
            $names=@([regex]::Matches($all,'(?m)^--- FAIL: (Test[A-Za-z0-9_]+)')|ForEach-Object{$_.Groups[1].Value}|Sort-Object -Unique)
            $digest=([Convert]::ToHexString([Security.Cryptography.SHA256]::HashData([Text.Encoding]::UTF8.GetBytes([string]::Join([Environment]::NewLine,$names))))).ToLowerInvariant()
            Write-Output ('KTRADE_COMPLETE_REGRESSION_FAILED_TEST_COUNT='+$names.Count)
            Write-Output ('KTRADE_COMPLETE_REGRESSION_FAILURE_SET_SHA256='+$digest)
            if($code -eq 0){Write-Output 'KTRADE_COMPLETE_REGRESSION=PASS';Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value 'status=pass'}
            else{Write-Output 'KTRADE_COMPLETE_REGRESSION=NEGATIVE_NOT_WAIVED';Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value 'status=negative'}
          }finally{
            Pop-Location
            Remove-Item -LiteralPath $log -Force -ErrorAction SilentlyContinue
          }
      - name: Go vet and three real Windows builds even if historical negatives remain
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:GITHUB_WORKSPACE 'private'
          $out=Join-Path $env:RUNNER_TEMP 'ktrade-complete-private-build'
          $log=Join-Path $env:RUNNER_TEMP 'ktrade-build-private.log'
          New-Item -ItemType Directory -Path $out -Force|Out-Null
          Push-Location $root
          try{
            & go vet -mod=readonly ./... *> $log
            if($LASTEXITCODE -ne 0){throw 'GO_VET_FAILED_PRIVATE_OUTPUT_WITHHELD'}
            Write-Output 'KTRADE_COMPLETE_GO_VET=PASS'
            foreach($cmd in @('ktrade-paper','ktrade-paper-web')){
              & go build -mod=readonly -o (Join-Path $out ($cmd+'.exe')) ('./cmd/'+$cmd) *> $log
              if($LASTEXITCODE -ne 0){throw 'KTRADE_PAPER_WINDOWS_BUILD_FAILED'}
            }
            & go build -mod=readonly -tags=ktrade_full -o (Join-Path $out 'ktrade.exe') ./cmd/ktrade *> $log
            if($LASTEXITCODE -ne 0){throw 'KTRADE_HISTORICAL_FULL_BUILD_FAILED'}
            Write-Output 'KTRADE_THREE_WINDOWS_APP_BINARIES_BUILT=PASS'
            if((& git rev-parse HEAD).Trim() -cne $env:EXPECTED_SHA){throw 'SOURCE_CHANGED_DURING_TEST'}
          }finally{
            Pop-Location
            Remove-Item -LiteralPath $out -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $log -Force -ErrorAction SilentlyContinue
          }
      - name: Full regression must pass for acceptance
        shell: pwsh
        env:
          REGRESSION: ${{ steps.tests.outputs.status }}
        run: |
          if($env:REGRESSION -cne 'pass'){throw 'KTRADE_UNRESOLVED_FULL_REGRESSION_NEGATIVE_NOT_ACCEPTED'}
          Write-Output 'KTRADE_COMPLETE_REGRESSION_ACCEPTED=TRUE'
      - name: Delete confidential checkout
        if: always()
        shell: pwsh
        run: |
          Remove-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'private') -Recurse -Force -ErrorAction SilentlyContinue
          Write-Output 'KTRADE_NO_USER_PROFILE_OR_LIVE_BROKER=TRUE'
          Write-Output 'KTRADE_PRIVATE_SOURCE_ARTIFACTS=NONE'
          Write-Output 'KTRADE_PRODUCTION_PROMOTION=FALSE'
