name: KTRADE W33C P4 original guarded full close and settled risk custody Windows
permissions:
  contents: read
on:
  push:
    branches: [qualification/ktrade-w33c-p4-guarded-close-20261028]
    paths: [.github/workflows/ktrade-w33c-p4-guarded-close-windows.yml]
concurrency:
  group: ktrade-w33c-p4-guarded-close
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      GOWORK: 'off'
      GOFLAGS: '-p=2'
      GOMAXPROCS: '2'
      CGO_ENABLED: '1'
    steps:
      - name: Checkout qualification witness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: witness
          persist-credentials: false
      - name: Checkout pinned private KTRADE candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: spoonman136668-ai/ktrade
          ref: 06e03ab996961b1387474e969b1a2d000a194c36
          path: current
          fetch-depth: 6
          persist-credentials: false
          token: ${{ secrets.KTRADE_SOURCE_READ_TOKEN }}
      - name: Exact qualified P3 ancestry and eight guarded close paths
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows'){throw 'WRONG_RUNNER'}
          $root=Join-Path $env:GITHUB_WORKSPACE 'current'
          if((& git -C $root rev-parse HEAD).Trim() -cne '06e03ab996961b1387474e969b1a2d000a194c36'){throw 'SOURCE_SHA_DRIFT'}
          if((& git -C $root rev-parse 'HEAD^{tree}').Trim() -cne 'f281e59babfa2c317ad8a712e6c1aaf4b980136c'){throw 'SOURCE_TREE_DRIFT'}
          if((& git -C $root merge-base HEAD ecd4d156d4854835a4680a38322c37f861364e08).Trim() -cne 'ecd4d156d4854835a4680a38322c37f861364e08'){throw 'P0_ANCESTRY_DRIFT'}
          $actual=@(& git -C $root diff --name-only ecd4d156d4854835a4680a38322c37f861364e08 HEAD|Sort-Object)
          $expected=@('internal/paperengine/owner.go','internal/paperengine/final_close_review.go','internal/paperengine/final_close_submit.go','internal/paperengine/w33c_p4_close_settlement_test.go','cmd/ktrade/paper_final_close_review_full.go','cmd/ktrade/paper_session_runner_full.go','cmd/ktrade/w33c_p3_native_close_full_test.go','cmd/ktrade/w33c_p4_native_close_full_test.go'|Sort-Object)
          if(Compare-Object $expected $actual){throw 'P4_EIGHT_PATH_DRIFT'}
          if(@(& git -C $root status --porcelain).Count -ne 0){throw 'DIRTY_CHECKOUT'}
          Write-Output '::notice::W33C_P4_EXACT_SOURCE_EIGHT_PATH_GUARDED_CLOSE=PASS'
      - name: Go Windows
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: false
      - name: Original guarded close profit loss dedup risk veto and post-fill custody faults
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:TEMP=$env:RUNNER_TEMP;$env:TMP=$env:RUNNER_TEMP
          Push-Location (Join-Path $env:GITHUB_WORKSPACE 'current')
          try{
            & go test -mod=readonly -count=1 -v -run '^TestW33C' ./internal/paperexit
            if($LASTEXITCODE -ne 0){throw 'P2_SOURCE_BOUND_INERT_SELL_REVIEW_TEST_FAILED'}
            & go test -mod=readonly -count=1 -v -run '^TestW33C' ./pkg
            if($LASTEXITCODE -ne 0){throw 'PINE_PROVENANCE_FAILED'}
            & go test -mod=readonly -count=1 -v -tags ktrade_full -run '^TestW33C' ./internal/paperreconcile ./internal/paperengine
            if($LASTEXITCODE -ne 0){throw 'OLD_SELL_AUTHORITY_REFUSAL_FAILED'}
            & go test -mod=readonly -count=1 -v -tags ktrade_full -run '^TestW33C' ./cmd/ktrade
            if($LASTEXITCODE -ne 0){throw 'P3_CANONICAL_NATIVE_CLOSE_OWNER_BRIDGE_FAILED'}
          }finally{Pop-Location}
          Write-Output '::notice::W33C_P4_ORIGINAL_GUARDED_CLOSE_AND_POSTFILL_CUSTODY=PASS'
      - name: Full root tagged-app and nested Wails regression and vet
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:TEMP=$env:RUNNER_TEMP;$env:TMP=$env:RUNNER_TEMP
          $src=Join-Path $env:GITHUB_WORKSPACE 'current'
          Push-Location $src
          try{
            & go test -mod=readonly -count=1 -tags ktrade_full ./cmd/ktrade
            if($LASTEXITCODE -ne 0){throw 'TAGGED_APP_TEST_FAILED'}
            & go vet -mod=readonly -tags ktrade_full ./cmd/ktrade
            if($LASTEXITCODE -ne 0){throw 'TAGGED_APP_VET_FAILED'}
            & go test -mod=readonly -count=1 ./...
            if($LASTEXITCODE -ne 0){throw 'ROOT_TEST_FAILED'}
            & go vet -mod=readonly ./...
            if($LASTEXITCODE -ne 0){throw 'ROOT_VET_FAILED'}
          }finally{Pop-Location}
          Push-Location (Join-Path $src 'tools/wails-pilot')
          try{
            & go test -mod=readonly -count=1 ./...
            if($LASTEXITCODE -ne 0){throw 'WAILS_TEST_FAILED'}
            & go vet -mod=readonly ./...
            if($LASTEXITCODE -ne 0){throw 'WAILS_VET_FAILED'}
          }finally{Pop-Location}
          Write-Output '::notice::W33C_P4_FULL_GO_AND_WAILS_REGRESSION=PASS'
      - name: Compile original production engine and Wails shell without fixtures
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $src=Join-Path $env:GITHUB_WORKSPACE 'current'
          Push-Location $src
          try{
            & go build -mod=readonly -tags ktrade_full -o (Join-Path $env:RUNNER_TEMP 'ktrade-w33c-p4-engine.exe') ./cmd/ktrade
            if($LASTEXITCODE -ne 0){throw 'P4_PRODUCTION_ENGINE_BUILD_FAILED'}
            $meta=(& go version -m (Join-Path $env:RUNNER_TEMP 'ktrade-w33c-p4-engine.exe')) -join "`n"
            if($meta -notmatch '-tags=ktrade_full' -or $meta -match 'ktrade_w32e_fixture|ktrade_w13_fixture'){throw 'P4_PRODUCTION_TAGS_DRIFT'}
            Write-Output ('P4_ENGINE_SHA256='+(Get-FileHash -LiteralPath (Join-Path $env:RUNNER_TEMP 'ktrade-w33c-p4-engine.exe') -Algorithm SHA256).Hash.ToLowerInvariant())
          }finally{Pop-Location}
          Push-Location (Join-Path $src 'tools/wails-pilot')
          try{
            & go build -mod=readonly -tags desktop,production -o (Join-Path $env:RUNNER_TEMP 'ktrade-w33c-p4-wails.exe') .
            if($LASTEXITCODE -ne 0){throw 'P4_PRODUCTION_WAILS_BUILD_FAILED'}
            Write-Output ('P4_WAILS_SHA256='+(Get-FileHash -LiteralPath (Join-Path $env:RUNNER_TEMP 'ktrade-w33c-p4-wails.exe') -Algorithm SHA256).Hash.ToLowerInvariant())
          }finally{Pop-Location}
          Write-Output '::notice::W33C_P4_ORIGINAL_PRODUCTION_GO_WAILS_BUILD_NO_FIXTURE=PASS'
      - name: Cleanup
        if: always()
        shell: pwsh
        run: |
          Remove-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'current') -Recurse -Force -ErrorAction SilentlyContinue
          foreach($file in @('ktrade-w33c-p4-engine.exe','ktrade-w33c-p4-wails.exe')){Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP $file) -Force -ErrorAction SilentlyContinue}
          Write-Output '::notice::W33C_P4_PROOF_OWNED_PAPER_ONLY_NO_BROKER_NO_OWNER_PROFILE_NO_BINARY_UPLOAD=PASS'
