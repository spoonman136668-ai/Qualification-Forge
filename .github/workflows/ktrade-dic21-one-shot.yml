name: KTRADE DIC-21 fail-closed risk-checkpoint Windows qualification
on:
  push:
    branches: [main]
    paths: [.github/workflows/ktrade-dic21-one-shot.yml]

permissions:
  contents: write

jobs:
  dic21-risk-quarantine:
    if: github.repository == 'spoonman136668-ai/Qualification-Forge' && github.actor == 'spoonman136668-ai'
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      EXPECTED_SHA: 'f5bce13ff9eac2bccee361e85c1d61ed05eddaf4'
      KTRADE_CI_SOURCE_ONLY: '1'
      KTRADE_CI_PAPER_ONLY: '1'
      KTRADE_CI_LIVE_AUTHORITY: '0'
      KTRADE_CI_COINBASE_ALLOWED: '0'
      KTRADE_CI_PROMOTION_ALLOWED: '0'
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
    steps:
      - name: Verify isolated host and zero live authority
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if($env:RUNNER_OS -cne 'Windows' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted'){throw 'DIC21_NOT_HOSTED_WINDOWS'}
          if($env:KTRADE_CI_LIVE_AUTHORITY -cne '0' -or $env:KTRADE_CI_COINBASE_ALLOWED -cne '0' -or $env:KTRADE_CI_PROMOTION_ALLOWED -cne '0'){throw 'DIC21_LIVE_AUTHORITY_ENV_UNSAFE'}
          Write-Host 'DIC21_HOSTED_WINDOWS_PAPER_ONLY=PASS'
      - name: Checkout frozen private review-child source
        uses: actions/checkout@v4
        with:
          repository: spoonman136668-ai/ckb
          ref: f5bce13ff9eac2bccee361e85c1d61ed05eddaf4
          path: checked-private
          persist-credentials: false
          fetch-depth: 1
          token: ${{ secrets.KTRADE_CKB_READ_TOKEN_TEMP }}
      - name: Qualify focused safety controls and exactly one full regression
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $log = Join-Path $env:RUNNER_TEMP 'dic21-source-private.log'
          Push-Location (Join-Path $env:GITHUB_WORKSPACE 'checked-private')
          try {
            $actual = (& git rev-parse HEAD).Trim()
            if($LASTEXITCODE -ne 0 -or $actual -cne $env:EXPECTED_SHA){throw 'DIC21_SOURCE_DRIFT'}
            Write-Host 'DIC21_EXACT_REVIEW_SHA=PASS'
            function RunGo([string]$marker,[string[]]$argv) {
              & go @argv *> $log
              if($LASTEXITCODE -ne 0){throw ('DIC21_'+$marker+'_FAIL_PRIVATE_LOG_WITHHELD')}
              Write-Host ('DIC21_'+$marker+'=PASS')
            }
            RunGo 'FOCUSED_HISTORICAL_CHECKPOINT' @('test','-count=1','-run','^TestDIC(20|21)','./pkg')
            RunGo 'ONE_FULL_REGRESSION' @('test','-count=1','-timeout=420s','./...')
            RunGo 'VET' @('vet','./...')
            RunGo 'GO_BUILD' @('build','./...')
            if(@(& git status --porcelain=v1 --untracked-files=no).Count -ne 0){throw 'DIC21_TRACKED_SOURCE_CHANGED'}
            Write-Host 'DIC21_SOURCE_UNCHANGED=PASS'
          } finally {
            Pop-Location
            Remove-Item -LiteralPath $log -Force -ErrorAction SilentlyContinue
          }
      - name: Build four Windows delivery binaries and verify manifest
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:GITHUB_WORKSPACE 'checked-private'
          $pkg=Join-Path $env:RUNNER_TEMP 'dic21-synthetic-package.zip'
          $stage=Join-Path $env:RUNNER_TEMP 'dic21-package-expanded'
          $log=Join-Path $env:RUNNER_TEMP 'dic21-package-private.log'
          try{
            & (Join-Path $root 'windows/package-clean-windows.ps1') -OutputZip $pkg *> $log
            if($LASTEXITCODE -ne 0 -or -not(Test-Path -LiteralPath $pkg)){throw 'DIC21_PACKAGE_FAILED'}
            Expand-Archive -LiteralPath $pkg -DestinationPath $stage
            $exe=Get-ChildItem -LiteralPath $stage -Recurse -File -Filter 'ktrade.exe'|Select-Object -First 1
            if($null -eq $exe){throw 'DIC21_EXE_MISSING'}
            $dir=Split-Path -Parent $exe.FullName
            $lines=Get-Content -LiteralPath (Join-Path $dir 'MANIFEST.sha256')
            foreach($name in @('ktrade.exe','ktrade-recover.exe','ktrade-schema.exe','ktrade-upgrade.exe')){
              $bin=Join-Path $dir $name
              if(-not(Test-Path -LiteralPath $bin)){throw 'DIC21_FOUR_EXES_MISSING'}
              $digest=(Get-FileHash -LiteralPath $bin -Algorithm SHA256).Hash.ToLowerInvariant()
              if(@($lines|Where-Object{$_ -ceq ($digest+'  '+$name)}).Count -ne 1){throw 'DIC21_MANIFEST_DRIFT'}
            }
            Write-Host 'DIC21_FOUR_WINDOWS_EXES_SHA256=PASS'
          }finally{
            Remove-Item -LiteralPath $log,$pkg -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $stage -Recurse -Force -ErrorAction SilentlyContinue
          }
      - name: Remove private checkout and prohibit artifact upload
        if: always()
        shell: pwsh
        run: |
          $private=Join-Path $env:GITHUB_WORKSPACE 'checked-private'
          if(Test-Path -LiteralPath $private){Remove-Item -LiteralPath $private -Force -Recurse -ErrorAction SilentlyContinue}
          Write-Host 'DIC21_PRIVATE_ARTIFACT_UPLOAD=DISABLED'
      - name: Keep sanitized exact-run receipt only
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          $ErrorActionPreference='Stop'
          $doc=[ordered]@{
            schema='ktrade.dic21.risk-checkpoint-quarantine.v1'
            run_id=$env:GITHUB_RUN_ID
            workflow_sha=$env:GITHUB_SHA
            source_sha=$env:EXPECTED_SHA
            job_status=$env:JOB_STATUS
            source_only=$true
            historic_risk_continuity_storage_restored=$true
            runtime_write_through_qualified=$false
            live_broker_authorized=$false
            historical_signed_v157_installer='NOT_QUALIFIED'
            release_promotion=$false
            private_artifacts=0
          }|ConvertTo-Json -Compress
          $body=@{message='evidence: DIC-21 live authority containment'; content=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($doc+"`n"));branch='main'}|ConvertTo-Json
          $uri='https://api.github.com/repos/spoonman136668-ai/Qualification-Forge/contents/qualification-evidence/dic21-runs/'+$env:GITHUB_RUN_ID+'.json'
          try{
            Invoke-RestMethod -Uri $uri -Method Put -ContentType 'application/json' -Headers @{
              Authorization=('Bearer '+$env:GH_TOKEN)
              Accept='application/vnd.github+json'
              'X-GitHub-Api-Version'='2022-11-28'
            } -Body $body -TimeoutSec 30|Out-Null
          }catch{throw 'DIC21_RUN_RECEIPT_WRITE_FAILED'}
          Write-Host 'DIC21_PUBLIC_RECEIPT=PASS'
