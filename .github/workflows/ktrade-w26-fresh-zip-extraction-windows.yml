name: KTRADE W26 safe fresh candidate ZIP extraction
on:
  push:
    branches: [qualification/ktrade-w26-fresh-zip-extraction-20261027]
    paths: [.github/workflows/ktrade-w26-fresh-zip-extraction-windows.yml]
permissions:
  contents: read
concurrency:
  group: ktrade-w26-fresh-zip-extraction
  cancel-in-progress: false
jobs:
  extract:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Checkout qualified witness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: witness
          persist-credentials: false
      - name: Checkout immutable W26 KTRADE
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: spoonman136668-ai/ktrade
          ref: 494a22f0d78f9f2effd12cabcd8181e07c0631b7
          path: checked-private
          fetch-depth: 2
          persist-credentials: false
          token: ${{ secrets.KTRADE_SOURCE_READ_TOKEN }}
      - name: Verify exact candidate ancestry and three-file delta
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $src=Join-Path $env:GITHUB_WORKSPACE 'checked-private'
          $got=(& git -C $src rev-parse HEAD).Trim()
          $prior=(& git -C $src rev-parse HEAD^).Trim()
          $tree=(& git -C $src rev-parse 'HEAD^{tree}').Trim()
          if($got -cne '494a22f0d78f9f2effd12cabcd8181e07c0631b7' -or $prior -cne '471a04176e4d0d2c14979951aa38ce3e25c67541' -or $tree -cne 'f79bcfd47a5da040404d92ce72487f59f705613c'){throw 'W26_IMMUTABLE_SOURCE_DRIFT'}
          $actual=@(& git -C $src diff --name-only 471a04176e4d0d2c14979951aa38ce3e25c67541 HEAD | Sort-Object -CaseSensitive)
          $expected=@('tools/wails-pilot/backend/release_extract.go','tools/wails-pilot/backend/release_extract_test.go','tools/wails-pilot/cmd/release-extract/main.go' | Sort-Object -CaseSensitive)
          if((Compare-Object -ReferenceObject $expected -DifferenceObject $actual)){throw 'W26_THREE_PATH_BOUNDARY_DRIFT'}
          if(@(& git -C $src status --porcelain=v1 --untracked-files=no).Count -ne 0){throw 'W26_DIRTY_SOURCE'}
          Write-Output '::notice::W26_IMMUTABLE_SOURCE_TREE_AND_THREE_PATH_DELTA=PASS'
      - name: Require exact unchanged W25 native Windows acceptance
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $r=Invoke-RestMethod -Uri 'https://api.github.com/repos/spoonman136668-ai/Qualification-Forge/actions/runs/40465675475' -Headers @{Authorization='Bearer '+$env:GITHUB_TOKEN;Accept='application/vnd.github+json'}
          if($r.status -cne 'completed' -or $r.conclusion -cne 'success' -or $r.head_sha -cne '513491686c3260a72befd69c7233bd5e040d3c11'){throw 'W26_QUALIFIED_W25_PARENT_MISSING'}
          Write-Output '::notice::W26_W25_NATIVE_PAPER_GUI_EVIDENCE_REUSED=PASS'
      - name: Windows Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: true
          cache-dependency-path: |
            checked-private/go.sum
            checked-private/tools/wails-pilot/go.sum
      - name: Focused extractor negative tests and native CLI build
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $src=Join-Path $env:GITHUB_WORKSPACE 'checked-private/tools/wails-pilot'
          Push-Location $src
          try {
            & go test -mod=readonly -count=1 -run '^TestW26' ./backend
            if($LASTEXITCODE -ne 0){throw 'W26_FOCUSED_EXTRACTION_TEST_FAIL'}
            & go vet -mod=readonly ./backend ./cmd/release-extract
            if($LASTEXITCODE -ne 0){throw 'W26_GO_VET_FAIL'}
            & go build -mod=readonly -o (Join-Path $env:GITHUB_WORKSPACE 'release-extract.exe') ./cmd/release-extract
            if($LASTEXITCODE -ne 0){throw 'W26_NATIVE_EXTRACTOR_BUILD_FAIL'}
          }finally{Pop-Location}
          Write-Output '::notice::W26_NATIVE_GO_ZIP_SECURITY_TESTS_AND_BUILD=PASS'
      - name: Node for existing genuine offline editor/chart vendor assets
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build real W23 candidate ZIP and verify cold fresh extraction
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          $env:TMP=$env:RUNNER_TEMP;$env:TEMP=$env:RUNNER_TEMP
          $env:KTRADE_W13_QUALIFICATION_ONLY='0'
          $src=Join-Path $env:GITHUB_WORKSPACE 'checked-private'
          $root=Join-Path $env:GITHUB_WORKSPACE ('ktrade-rc-package-'+[guid]::NewGuid().ToString('N').ToLowerInvariant())
          Push-Location $src
          try {
            & npm ci --ignore-scripts --no-audit --no-fund --silent
            if($LASTEXITCODE -ne 0){throw 'W26_OFFLINE_VENDOR_NPM_FAIL'}
            & node scripts/stage_offline_vendor.cjs
            if($LASTEXITCODE -ne 0){throw 'W26_OFFLINE_VENDOR_ASSETS_FAIL'}
            if(@(& git status --porcelain=v1 --untracked-files=no).Count -ne 0){throw 'W26_BUILD_CHANGED_SOURCE'}
            $lines=@(& './windows/Build-KTRADE-WailsPortable.ps1' -OutputRoot $root -ExpectedSourceSha '494a22f0d78f9f2effd12cabcd8181e07c0631b7' -ReleaseCandidate)
            if($lines -notcontains 'W03_FRESH_PAIRED_PORTABLE_PACKAGE=PASS;NO_APP_START=TRUE;LIVE_DISARMED=TRUE'){throw 'W26_REAL_CANDIDATE_BUILD_FAIL'}
          }finally{Pop-Location}
          $zip=Join-Path $root 'KTRADE-WailsPortable.zip'
          $original=Join-Path $root 'KTRADE-WailsPortable'
          $destination=Join-Path $env:GITHUB_WORKSPACE 'verified-fresh-extract'
          New-Item -ItemType Directory -Path $destination -ErrorAction Stop | Out-Null
          $extract=Join-Path $env:GITHUB_WORKSPACE 'release-extract.exe'
          $receipt=@(& $extract $zip $destination '494a22f0d78f9f2effd12cabcd8181e07c0631b7')
          if($LASTEXITCODE -ne 0){throw 'W26_ORIGINAL_W23_ZIP_NOT_EXTRACTABLE'}
          $report=($receipt -join [Environment]::NewLine)|ConvertFrom-Json
          $fresh=[string]$report.candidate_directory
          if($report.source_sha -cne '494a22f0d78f9f2effd12cabcd8181e07c0631b7' -or $report.live_armed -ne $false -or
             $report.launched -ne $false -or !(Test-Path -LiteralPath $fresh -PathType Container)){
            throw 'W26_EXTRACTED_CANDIDATE_RECEIPT_INVALID'
          }
          foreach($name in @('ktrade.exe','ktrade-engine.exe','release-candidate-proof.json')){
            $before=(Get-FileHash -LiteralPath (Join-Path $original $name) -Algorithm SHA256).Hash
            $after=(Get-FileHash -LiteralPath (Join-Path $fresh $name) -Algorithm SHA256).Hash
            if($before -cne $after){throw ('W26_EXTRACTED_BYTE_DRIFT_'+$name)}
          }
          if(Test-Path -LiteralPath (Join-Path $fresh 'data/webview2-profile')){
            throw 'W26_EXTRACTED_BROWSER_PROFILE_NOT_FRESH'
          }
          $second=@(& $extract $zip $destination '494a22f0d78f9f2effd12cabcd8181e07c0631b7' 2>&1)
          if($LASTEXITCODE -eq 0){throw 'W26_EXISTING_CANDIDATE_OVERWRITE_ALLOWED'}
          Write-Output '::notice::W26_REAL_W23_ZIP_VERIFIED_AND_EXTRACTED_ON_WINDOWS=PASS'
          Write-Output '::notice::W26_FRESH_ONLY_NO_PROFILE_NO_LIVE_NO_APP_START=PASS'
      - name: Purge checked private source
        if: always()
        shell: pwsh
        run: |
          $src=Join-Path $env:GITHUB_WORKSPACE 'checked-private'
          if(Test-Path -LiteralPath $src){Remove-Item -LiteralPath $src -Recurse -Force -ErrorAction SilentlyContinue}
