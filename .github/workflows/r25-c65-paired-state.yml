name: KTRADE R25-C65 paired historical state qualification
on:
  push:
    branches: [qualification/r25-c65-paired-state-20261019]
    paths: [.github/workflows/r25-c65-paired-state.yml]
permissions:
  contents: read
concurrency:
  group: ktrade-r25-c65-hosted-synthetic
  cancel-in-progress: false
jobs:
  qualify:
    if: github.repository == 'spoonman136668-ai/Qualification-Forge'
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      SOURCE_SHA: 'efd9c95149f1a6abde2fb3dd20a94c1a6916f83f'
      SOURCE_TREE: 'eaa8eb11b3c094b5e75f786afbccb6fd544a311a'
      BASE_SHA: 'd05d8c36d62bd6cb30e9ba6dea0213dc39ace73c'
      GOFLAGS: '-p=2'
      GOMAXPROCS: '2'
      KTRADE_CI_PAPER_ONLY: '1'
      KTRADE_CI_LIVE_AUTHORITY: '0'
      KTRADE_CI_COINBASE_ALLOWED: '0'
      KTRADE_CI_PROMOTION_ALLOWED: '0'
    steps:
      - name: Admit isolated GitHub-hosted Windows only
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or
             $env:RUNNER_OS -cne 'Windows' -or
             $env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/Qualification-Forge' -or
             $env:KTRADE_CI_PAPER_ONLY -cne '1' -or
             $env:KTRADE_CI_LIVE_AUTHORITY -cne '0' -or
             $env:KTRADE_CI_COINBASE_ALLOWED -cne '0' -or
             $env:KTRADE_CI_PROMOTION_ALLOWED -cne '0') {
            throw 'R25_C65_HOSTED_PAPER_AUTHORITY_DRIFT'
          }
          Write-Host 'R25_C65_GITHUB_HOSTED_WINDOWS=PASS'
          Write-Host 'R25_C65_SELF_HOSTED_RESEARCH_RUNNERS_USED=FALSE'
      - name: Checkout pinned KTRADE source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: spoonman136668-ai/ktrade
          ref: efd9c95149f1a6abde2fb3dd20a94c1a6916f83f
          fetch-depth: 0
          path: source
          persist-credentials: false
          token: ${{ secrets.KTRADE_SOURCE_READ_TOKEN }}
      - name: Source identity and minimal-diff reuse
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference='Stop'
          if((& git rev-parse HEAD).Trim() -cne $env:SOURCE_SHA -or
             (& git rev-parse 'HEAD^{tree}').Trim() -cne $env:SOURCE_TREE -or
             @(& git status --porcelain=v1 --untracked-files=no).Count -ne 0) {
            throw 'R25_C65_SOURCE_IDENTITY_DRIFT'
          }
          $expected=@(
            'internal/durableupgrade/historic_paired_strategy.go',
            'internal/durableupgrade/historic_paired_strategy_test.go'
          ) | Sort-Object
          $actual=@(& git diff --name-only $env:BASE_SHA $env:SOURCE_SHA | Sort-Object)
          if($actual.Count -ne 2 -or @(Compare-Object $expected $actual).Count -ne 0){
            throw 'R25_C65_SCOPE_EXPANDED'
          }
          foreach($file in @(
            'internal/durableupgrade/historical_document_shape.go',
            'internal/durableupgrade/durable_upgrade.go',
            'internal/durableupgrade/selected_custody_admission.go',
            'cmd/ktrade/main_full.go'
          )) {
            if((& git rev-parse ($env:BASE_SHA+':'+$file)).Trim() -cne
               (& git rev-parse ($env:SOURCE_SHA+':'+$file)).Trim()) {
              throw 'R25_C65_EXISTING_MIGRATION_OR_STARTUP_DRIFT'
            }
          }
          Write-Host 'R25_C65_TWO_FILE_SOURCE_DELTA=PASS'
          Write-Host 'R25_C65_PREVIOUS_QUALIFIED_SOURCE_UNCHANGED=PASS'
      - name: Frozen Go toolchain
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.23.12'
          cache: false
      - name: Cross-document synthetic accounting and rearm negatives
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference='Stop'
          $log=Join-Path $env:RUNNER_TEMP 'r25-c65-go-private.log'
          & go test -mod=readonly -count=1 -run '^TestR25C65' ./internal/durableupgrade *> $log
          if($LASTEXITCODE -ne 0){throw 'R25_C65_TEST_FAIL_RETAINED_NO_PRIVATE_DUMP'}
          & go vet -mod=readonly ./internal/durableupgrade *> $log
          if($LASTEXITCODE -ne 0){throw 'R25_C65_VET_FAIL_RETAINED_NO_PRIVATE_DUMP'}
          Write-Host 'R25_C65_SYNTHETIC_PAIRED_STRATEGY_CONSISTENCY=PASS'
          Write-Host 'R25_C65_CURRENCY_PRODUCT_SCHEMA_MISMATCH_REJECTION=PASS'
          Write-Host 'R25_C65_ENABLED_AND_AUTO_RESUME_NEVER_REARM=PASS'
          Write-Host 'R25_C65_PENDING_ORDERS_RECEIPT_UNVERIFIED=PASS'
          Write-Host 'R25_C65_PNL_NEVER_CERTIFIED_BY_SHAPE=PASS'
          Write-Host 'R25_C65_FOCUSED_GO_TEST_VET=PASS'
          Write-Host 'R25_C65_AUTHENTIC_HISTORICAL_STATE_READ=FALSE'
          Write-Host 'R25_C65_DONOR_ACCOUNTING_VALIDATORS_EXECUTED=FALSE'
          Write-Host 'R25_C65_STRATEGY_RESTART_AUTHORIZED=FALSE'
          Write-Host 'R25_C65_MIGRATION_AUTHORIZED=FALSE'
          Write-Host 'R25_C65_RELEASE_AUTHORIZED=FALSE'
      - name: Check source unchanged and remove ephemeral diagnostic data
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:GITHUB_WORKSPACE 'source'
          if(Test-Path -LiteralPath $root -PathType Container){
            Push-Location $root
            try {
              if((& git rev-parse HEAD).Trim() -cne $env:SOURCE_SHA -or
                 @(& git status --porcelain=v1 --untracked-files=no).Count -ne 0) {
                throw 'R25_C65_TRACKED_SOURCE_DRIFT'
              }
            }finally{Pop-Location}
          }
          $log=Join-Path $env:RUNNER_TEMP 'r25-c65-go-private.log'
          if(Test-Path -LiteralPath $log){Remove-Item -LiteralPath $log -Force}
          Write-Host 'R25_C65_SOURCE_UNCHANGED=PASS'
          Write-Host 'R25_C65_PRIVATE_FILE_ARTIFACT_UPLOAD=FALSE'
          Write-Host 'R25_C65_ORIGINAL_CUSTODY_UNTOUCHED=PASS'
