name: R25-C74F14 original order-status and exact-fill serial latency simulation
on:
  push:
    branches: [qualification/r25-c74f14-original-pending-status-simulation-20261020]
    paths: [.github/workflows/r25-c74f14-original-pending-status.yml]
permissions:
  contents: read
concurrency:
  group: r25-c74f14-original-pending-status
  cancel-in-progress: false
jobs:
  isolated-original-pending-status:
    if: github.repository == 'spoonman136668-ai/Qualification-Forge'
    runs-on: windows-2022
    timeout-minutes: 18
    env:
      DONOR_SHA: '520cfe124fdd7e8dcbf16b6a6f38229b43db7dbc'
      DONOR_TREE: 'b74808f35e798b1b72e8fb31a49a5f4664ca87b5'
      SOURCE_SHA: 'ad6314c87d8d3a8fc916deec95e38695acc7dd8c'
      SOURCE_TREE: '4e9930ecc3e8251f12331cb3794bbe9604b34c9a'
      PARENT_SHA: '69245b3bd1d1c7df3d8ba9b5e8a8c8692d238c6f'
      KTRADE_CI_PAPER_ONLY: '1'
      KTRADE_CI_LIVE_AUTHORITY: '0'
      KTRADE_CI_COINBASE_ALLOWED: '0'
      KTRADE_CI_PROMOTION_ALLOWED: '0'
      GOFLAGS: '-p=2'
      GOMAXPROCS: '2'
      GOWORK: 'off'
    steps:
      - name: Require private GitHub hosted Windows no live authority
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/Qualification-Forge' -or
             $env:RUNNER_OS -cne 'Windows' -or
             $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or
             $env:KTRADE_CI_PAPER_ONLY -cne '1' -or
             $env:KTRADE_CI_LIVE_AUTHORITY -cne '0' -or
             $env:KTRADE_CI_COINBASE_ALLOWED -cne '0' -or
             $env:KTRADE_CI_PROMOTION_ALLOWED -cne '0'){
            throw 'R25_C74F14_NOT_ISOLATED'
          }
          Write-Host 'R25_C74F14_HOSTED_SIMULATION_PAPER_ONLY=PASS'
      - name: Checkout exact original donor without credentials persisted
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: spoonman136668-ai/ckb
          ref: 520cfe124fdd7e8dcbf16b6a6f38229b43db7dbc
          path: donor
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.KTRADE_CKB_READ_TOKEN_TEMP }}
      - name: Checkout exact source-only latency fixture
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: spoonman136668-ai/ktrade
          ref: ad6314c87d8d3a8fc916deec95e38695acc7dd8c
          path: source
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.KTRADE_SOURCE_READ_TOKEN }}
      - name: Verify exact original engine and bounded two-file test delta
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($v in @(
             @{Path='donor';SHA=$env:DONOR_SHA;Tree=$env:DONOR_TREE},
             @{Path='source';SHA=$env:SOURCE_SHA;Tree=$env:SOURCE_TREE}
          )){
            if((& git -C $v.Path rev-parse HEAD).Trim() -cne $v.SHA -or
               (& git -C $v.Path rev-parse 'HEAD^{tree}').Trim() -cne $v.Tree -or
               @(& git -C $v.Path status --porcelain=v1 --untracked-files=all).Count -ne 0){
               throw 'R25_C74F14_SOURCE_DRIFT'
            }
          }
          $expected=@('docs/R25_C74F14_ORIGINAL_PENDING_BROKER_LATENCY.md',
            'tests/donor-native-vwap/c74f14_pending_broker_latency_test.go')|Sort-Object
          $actual=@(& git -C source diff --name-only $env:PARENT_SHA $env:SOURCE_SHA|Sort-Object)
          if(@(Compare-Object $expected $actual).Count -ne 0){throw 'R25_C74F14_NONTEST_DELTA'}
          $donor=Join-Path (Get-Location) 'donor'
          foreach($source in @('pkg/strategy_engine.go','pkg/advanced-orders.go','pkg/auth.go')){
            $blob=(& git -C $donor rev-parse ('HEAD:'+$source)).Trim()
            if($blob.Length -ne 40){throw 'R25_C74F14_ORIGINAL_EXECUTION_CODE_MISSING'}
          }
          Write-Host 'R25_C74F14_EXACT_ORIGINAL_DONOR_AND_TWO_FILE_DELTA=PASS'
      - name: Pinned original Go toolchain
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.23.12'
          cache: false
      - name: Run intercepted original order-read latency simulation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $donor=Join-Path (Get-Location) 'donor'
          $src=Join-Path (Get-Location) 'source/tests/donor-native-vwap/c74f14_pending_broker_latency_test.go'
          $test=Join-Path $donor 'pkg/c74f14_pending_broker_latency_test.go'
          if(Test-Path -LiteralPath $test){throw 'R25_C74F14_TEST_COLLISION'}
          Copy-Item -LiteralPath $src -Destination $test -ErrorAction Stop
          Set-Location $donor
          $log=Join-Path $env:RUNNER_TEMP 'r25-c74f14-pending-latency.log'
          & go test -mod=readonly -tags=ktrade_donor_shadow -count=1 -timeout=6m -v -run '^TestC74F14OriginalPendingOrderStatusAndFillsSerialLatency$' ./pkg *> $log
          if($LASTEXITCODE -ne 0){
            Get-Content -LiteralPath $log | Where-Object {
              $_ -match '^# ' -or $_ -match '^--- FAIL' -or
              $_ -match '^.*\.go:[0-9]+:' -or $_ -match '^FAIL\s'
            }|Select-Object -First 45 | ForEach-Object {Write-Host $_}
            throw 'R25_C74F14_ORIGINAL_BROKER_SIMULATION_FAILED'
          }
          $rows=@(Select-String -LiteralPath $log -Pattern 'R25_C74F14_SYNTHETIC_RPC scenario=')
          $pass=@(Select-String -LiteralPath $log -SimpleMatch 'C74F14_ORIGINAL_DONOR_PENDING_STATUS_AND_FILL_SERIAL_IO=PASS')
          if($rows.Count -ne 7 -or $pass.Count -ne 1){throw 'R25_C74F14_INCOMPLETE_METRIC_RECEIPT'}
          $rows | ForEach-Object {Write-Host $_.Line}
          $pass | ForEach-Object {Write-Host $_.Line}
          Write-Host 'R25_C74F14_EXACT_ORIGINAL_BROKER_GET_AND_FILLLIST_PATH=PASS'
          Write-Host 'R25_C74F14_INSTALLED_OWNER_BROKER_RTT_AND_SQLITE=NOT_MEASURED'
      - name: Prove neither private source nor donor runtime was altered
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($p in @(@{Path='donor';Sha=$env:DONOR_SHA},
                           @{Path='source';Sha=$env:SOURCE_SHA})){
            if(Test-Path -LiteralPath (Join-Path $p.Path '.git')){
              if((& git -C $p.Path rev-parse HEAD).Trim() -cne $p.Sha -or
                 @(& git -C $p.Path status --porcelain=v1 --untracked-files=no).Count -ne 0){
                throw 'R25_C74F14_TRACKED_SOURCE_MUTATION'
              }
            }
          }
          Write-Host 'R25_C74F14_NO_OWNER_FILES_OR_ACTUAL_NETWORK=PASS'
          Write-Host 'R25_C74F14_PAPER_ORDERS_AND_RELEASE_AUTHORIZED=FALSE'
