name: KTRADE DIC-12 exact-SHA Windows acceptance (one shot)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ktrade-dic12-one-shot.yml

permissions:
  contents: write

jobs:
  dic12:
    if: github.repository == 'spoonman136668-ai/Qualification-Forge' && github.actor == 'spoonman136668-ai'
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      KTRADE_CI_SOURCE_ONLY: '1'
      KTRADE_CI_PAPER_ONLY: '1'
      KTRADE_CI_LIVE_AUTHORITY: '0'
      KTRADE_CI_COINBASE_ALLOWED: '0'
      KTRADE_CI_PROMOTION_ALLOWED: '0'
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      EXPECTED_SHA: '1d4d24836c02f042aa01318595e4ac84c58b44fc'
      PARENT_SHA: '12212ba37851d2e6e5c0374884bb9f570618ac71'

    steps:
      - name: Require isolated GitHub-hosted Windows
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows') { throw 'DIC12_RUNNER_IDENTITY_FAIL' }
          Write-Host 'DIC12_EPHEMERAL_WINDOWS=PASS'

      - name: Exact private source checkout
        uses: actions/checkout@v4
        with:
          repository: spoonman136668-ai/ckb
          ref: 1d4d24836c02f042aa01318595e4ac84c58b44fc
          path: checked-private
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.KTRADE_CKB_READ_TOKEN_TEMP }}

      - name: Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false

      - name: Fixed identity and bounded two-file diff
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          Push-Location 'checked-private'
          try {
            $actual = (& git rev-parse HEAD).Trim()
            if ($LASTEXITCODE -ne 0 -or $actual -cne $env:EXPECTED_SHA) { throw 'DIC12_SOURCE_IDENTITY_FAIL' }
            $base = (& git merge-base $env:PARENT_SHA $env:EXPECTED_SHA).Trim()
            if ($LASTEXITCODE -ne 0 -or $base -cne $env:PARENT_SHA) { throw 'DIC12_PARENT_IDENTITY_FAIL' }
            $changed = @(& git diff --name-only $env:PARENT_SHA $env:EXPECTED_SHA)
            if ($LASTEXITCODE -ne 0) { throw 'DIC12_DIFF_READ_FAIL' }
            $expected = @('pkg/ktrade_dic12_support_privacy_test.go', 'pkg/support_bundle.go')
            if (@($changed).Count -ne 2 -or (@(Compare-Object -ReferenceObject $expected -DifferenceObject $changed).Count -ne 0)) {
              throw 'DIC12_PATCH_SCOPE_FAIL'
            }
            if (@(& git status --porcelain=v1 --untracked-files=no).Count -ne 0) { throw 'DIC12_CHECKOUT_DIRTY' }
            Write-Host 'DIC12_EXACT_HEAD_AND_PARENT=PASS'
            Write-Host 'DIC12_TWO_FILE_BOUNDED_DIFF=PASS'
          } finally { Pop-Location }

      - name: Focused privacy plus one regression, vet, and Windows build
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          $log = Join-Path $env:RUNNER_TEMP 'dic12-private-check.log'
          Push-Location 'checked-private'
          try {
            function Invoke-SafeCheck([string]$Label, [string]$Executable, [string[]]$Argv) {
              try {
                & $Executable @Argv *> $log
                if ($LASTEXITCODE -ne 0) { throw 'NONZERO' }
              } catch {
                throw ("DIC12_" + $Label + "_FAILED_PRIVATE_OUTPUT_WITHHELD")
              }
              Write-Host ("DIC12_" + $Label + "=PASS")
            }
            Invoke-SafeCheck 'FOCUSED_PRIVACY' 'go' @('test','-count=1','-run','TestDIC12','./pkg')
            Invoke-SafeCheck 'SUPPORT_FOCUSED' 'go' @('test','-count=1','-run','TestSupportBundle','./pkg')
            Invoke-SafeCheck 'ONE_FULL_REGRESSION' 'go' @('test','-count=1','-timeout=420s','./...')
            Invoke-SafeCheck 'VET' 'go' @('vet','./...')
            Invoke-SafeCheck 'GO_BUILD' 'go' @('build','./...')
            Invoke-SafeCheck 'FOUR_WINDOWS_EXE_BUILD' 'cmd.exe' @('/d','/c','RUN-BUILD-WINDOWS.cmd')
            $out = '.clean-build/Application'
            foreach ($exe in @('ktrade.exe','ktrade-recover.exe','ktrade-schema.exe','ktrade-upgrade.exe')) {
              $item=Get-Item -LiteralPath (Join-Path $out $exe) -ErrorAction Stop
              if ($item.Length -lt 4096) { throw 'DIC12_WINDOWS_EXECUTABLE_SIZE_FAIL' }
              $fh=[IO.File]::OpenRead($item.FullName)
              try {
                if ($fh.ReadByte() -ne 77 -or $fh.ReadByte() -ne 90) { throw 'DIC12_WINDOWS_EXECUTABLE_PE_FAIL' }
              } finally { $fh.Dispose() }
            }
            Write-Host 'DIC12_ALL_FOUR_WINDOWS_PE_FILES=PASS'
            $actual=(& git rev-parse HEAD).Trim()
            if ($actual -cne $env:EXPECTED_SHA) { throw 'DIC12_SOURCE_MOVED' }
            if (@(& git status --porcelain=v1 --untracked-files=no).Count -ne 0) { throw 'DIC12_SOURCE_MUTATED' }
            Write-Host 'DIC12_SOURCE_UNCHANGED=PASS'
            Write-Host 'DIC12_NO_BROKER_NO_PRODUCTION_RUNTIME=PASS'
          } finally {
            Pop-Location
            Remove-Item -LiteralPath $log -Force -ErrorAction SilentlyContinue
          }

      - name: Wipe private checkout
        if: always()
        shell: pwsh
        run: |
          $source=Join-Path $env:GITHUB_WORKSPACE 'checked-private'
          if (Test-Path -LiteralPath $source) { Remove-Item -LiteralPath $source -Recurse -Force -ErrorAction SilentlyContinue }
          Write-Host 'DIC12_NO_PUBLIC_PRIVATE_ARTIFACT=PASS'

      - name: Publish sanitized run identity for independent log lookup
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_STATUS: ${{ job.status }}
        run: |
          $ErrorActionPreference='Stop'
          $data=[ordered]@{
            schema='ktrade.dic12.hosted-windows-run.v1'
            run_id=$env:GITHUB_RUN_ID
            workflow_sha=$env:GITHUB_SHA
            source_sha=$env:EXPECTED_SHA
            parent_sha=$env:PARENT_SHA
            job_status=$env:FINAL_STATUS
            no_private_artifacts=$true
          } | ConvertTo-Json -Compress
          $content=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($data + "`n"))
          $body=@{
            message='evidence: DIC-12 one-shot Windows run reference'
            content=$content
            branch='main'
          } | ConvertTo-Json
          try {
            Invoke-RestMethod -Uri 'https://api.github.com/repos/spoonman136668-ai/Qualification-Forge/contents/qualification-evidence/dic12-last-run.json' -Method Put -ContentType 'application/json' -Headers @{
              Authorization='Bearer ' + $env:GH_TOKEN
              Accept='application/vnd.github+json'
              'X-GitHub-Api-Version'='2022-11-28'
            } -Body $body -TimeoutSec 30 | Out-Null
          } catch { throw 'DIC12_PUBLIC_RUN_ID_ATTESTATION_WRITE_FAILED' }
          Write-Host 'DIC12_RUN_ID_RECORDED_FOR_INDEPENDENT_REVIEW=PASS'
