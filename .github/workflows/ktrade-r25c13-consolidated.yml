            Copy-Item -LiteralPath $fm -Destination $mixed
            $env:R25C12_ORIGINAL_MODE='0'
            $env:R25C12_MIXED_PARENT_MODE='1'
            & go test -vet=off -mod=readonly -count=1 -timeout=10m -v -run '^TestR25C12MixedPhase9HistoricalJSONWire        working-directory: source
