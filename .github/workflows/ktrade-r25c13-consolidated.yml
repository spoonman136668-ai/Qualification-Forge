          $dir=Join-Path $env:GITHUB_WORKSPACE 'evidence'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $receiptPath=Join-Path $dir 'r25c13-receipt.json'
          $receipt|ConvertTo-Json -Depth 8|Set-Content -LiteralPath $receiptPath -Encoding utf8
          $receiptHash=(Get-FileHash -LiteralPath $receiptPath -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Output ('R25C13_ACCEPTANCE_RECEIPT_SHA256='+$receiptHash)
          Write-Output 'R25C13_CONSOLIDATED_WINDOWS_ACCEPTANCE=PASS'
          Write-Output 'R25C13_SIGNED_INSTALLER_AND_REAL_PROFILE=NOT_QUALIFIED'
      - name: Upload bounded acceptance receipt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ktrade-r25c13-consolidated-receipt
          path: evidence/r25c13-receipt.json
          retention-days: 30
      - name: Erase private source and isolated temporary app
        if: always()
        shell: pwsh
        run: |
          Remove-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'source') -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'ktrade-r25c13-cleanstage') -Recurse -Force -ErrorAction SilentlyContinue
          Write-Output 'R25C13_PRIVATE_SOURCE_AND_APP_STAGE_CLEANUP=PASS'
