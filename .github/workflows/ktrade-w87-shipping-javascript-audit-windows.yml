name: KTRADE W87 locked shipping JavaScript advisory and license audit
on:
  push:
    branches: [qualification/ktrade-original-pine-label-response-affinity-20261031]
    paths: [.github/workflows/ktrade-w87-shipping-javascript-audit-windows.yml]
permissions:
  contents: read
concurrency:
  group: ktrade-pr244-shipped-js-license-advisory-20261105
  cancel-in-progress: false
jobs:
  audit:
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: witness
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: spoonman136668-ai/ktrade
          ref: 671198f2336e410c98ef764603455a51c08d16b0
          path: product
          persist-credentials: false
          token: ${{ secrets.KTRADE_SOURCE_READ_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Clean frozen source before generated assets
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $src=Join-Path $env:GITHUB_WORKSPACE 'product'
          if($env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows' -or $env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/Qualification-Forge'){throw 'PR244_W87_HOSTED_WINDOWS_REQUIRED'}
          if((& git -C $src rev-parse HEAD).Trim() -cne '671198f2336e410c98ef764603455a51c08d16b0' -or (& git -C $src rev-parse 'HEAD^{tree}').Trim() -cne 'f75c8d45689e68cf2e582fe4679b841e9c9f352e' -or @(& git -C $src status --porcelain).Count -ne 0){throw 'W87_INITIAL_CLEAN_SOURCE_REQUIRED'}
          $w=Join-Path $env:GITHUB_WORKSPACE 'witness'
          if((& git -C $w rev-parse HEAD).Trim() -cne $env:GITHUB_SHA -or @(& git -C $w status --porcelain).Count -ne 0){throw 'PR244_W87_WITNESS_CHANGED'}
          if(Test-Path (Join-Path $src '.env')){throw 'PR244_W87_OWNER_DOTENV_REFUSED'}
          $cfg=Get-Content (Join-Path $src 'config.json') -Raw|ConvertFrom-Json
          if($cfg.api_key.key_name -or $cfg.api_key.key_secret -or $cfg.account_id -or $cfg.ngrok_authtoken){throw 'PR244_W87_TRACKED_CREDENTIAL_REFUSED'}
          if((Get-Content (Join-Path $src 'pkg/advanced_orders.go') -Raw) -notmatch 'func liveBrokerageAuthorized\(\) bool \{ return false \}'){throw 'PR244_W87_LIVE_GATE_CHANGED'}
          if((& git -C $w rev-parse 'HEAD:qualification-harness/ktrade-w87/Audit-Shipped-Dependencies.cjs').Trim() -cne 'cf93fbe419f0fd04d1525f16a0d15ae9e903eeb0' -or
             (& git -C $src rev-parse 'HEAD:package-lock.json').Trim() -cne '594adf1a84906ddc9d9d5e7000881ca2ce9a414d'){throw 'PR244_W87_FROZEN_REVIEW_OR_LOCK_DRIFT'}
          $sources=@(
           @{path='qualification-receipts/ktrade-pr244-pine-marker-status-source-windows-20261105.json';blob='7eb9024615af7a076611caff6306a4749f46bcb0';expected='PASS_SOURCE_OWNED_EXACT_HEAD_WINDOWS_FULL_REGRESSION';source='source'},
           @{path='qualification-receipts/ktrade-pr244-current-head-wails-rollback-lease-repeatability-windows-20261105.json';blob='6f34de30267f2995346fedff9ae6976c4a2c788a';expected='PASS_EXACT_SHA_SEVEN_ORIGINAL_WAILS_ROLLBACK_LEASE_TESTS_THREE_REPETITIONS';source='product'}
          )
          foreach($it in $sources){
           if((& git -C $w rev-parse ('HEAD:'+$it.path)).Trim() -cne $it.blob){throw 'PR244_W87_INPUT_RECEIPT_BLOB_DRIFT'}
           $data=Get-Content -LiteralPath (Join-Path $w $it.path) -Raw|ConvertFrom-Json
           if($data.verdict -cne $it.expected -or $data.($it.source).head_sha -cne '671198f2336e410c98ef764603455a51c08d16b0'){throw 'PR244_W87_INPUT_RECEIPT_CONTENT_DRIFT'}
          }
          Write-Host '::notice::PR244_W87_EXACT_SOURCE_FROZEN_REVIEW_LICENSE_WAILS_AND_LIVE_DISARM=PASS'
      - name: Locked public asset install with lifecycle scripts disabled
        shell: pwsh
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
        run: |
          $ErrorActionPreference='Stop'
          Push-Location (Join-Path $env:GITHUB_WORKSPACE 'product')
          try{
            & npm.cmd ci --ignore-scripts --no-audit --no-fund
            if($LASTEXITCODE -ne 0){throw 'W87_LOCKED_ASSET_INSTALL_FAILED'}
            if((Get-FileHash scripts/vendor-licenses/fancy-canvas-2.1.0.LICENSE -Algorithm SHA256).Hash.ToLowerInvariant() -cne '52d2ba0c8f8f4532bd524358d679693ff3dd9e40c56fe0c0c63061ed0733aa18'){throw 'W87_UPSTREAM_LICENSE_CHECKOUT_BYTES_DRIFT'}
            & node --test tests/rb3_w88_vendor_staging.test.cjs
            if($LASTEXITCODE -ne 0){throw 'W87_STAGING_REGRESSION_FAILED'}
            & node scripts/stage_offline_vendor.cjs
            if($LASTEXITCODE -ne 0){throw 'W87_FIRST_REAL_ASSET_STAGE_FAILED'}
            $first=(Get-FileHash static/vendor/assets-manifest.json -Algorithm SHA256).Hash
            & node scripts/stage_offline_vendor.cjs
            if($LASTEXITCODE -ne 0 -or (Get-FileHash static/vendor/assets-manifest.json -Algorithm SHA256).Hash -cne $first){throw 'W87_ACTUAL_ASSET_RESTAGE_NOT_IDENTICAL'}
            & node -e "const fs=require('node:fs'),c=require('node:crypto');const m=JSON.parse(fs.readFileSync('static/vendor/assets-manifest.json'));if(m.files.some(f=>f.path==='assets-manifest.json'))throw Error('self inclusion');for(const f of m.files)if(c.createHash('sha256').update(fs.readFileSync('static/vendor/'+f.path)).digest('hex')!==f.sha256)throw Error('asset hash');console.log('W87_REAL_VENDOR_REPEATABLE_HASHED_ASSETS=PASS files='+m.files.length);"
            if($LASTEXITCODE -ne 0){throw 'W87_ACTUAL_ASSET_HASH_INVALID'}
          }finally{Pop-Location}
      - name: Source identity and shipping-only graph audit without install scripts
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $src=Join-Path $env:GITHUB_WORKSPACE 'product'
          if($env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or (& git -C $src rev-parse HEAD).Trim() -cne '671198f2336e410c98ef764603455a51c08d16b0' -or (& git -C $src rev-parse 'HEAD^{tree}').Trim() -cne 'f75c8d45689e68cf2e582fe4679b841e9c9f352e'){throw 'W87_SOURCE_OR_HOST_DRIFT'}
          if(Test-Path (Join-Path $src '.env')){throw 'W87_DOTENV_REFUSED'}
          & node (Join-Path $env:GITHUB_WORKSPACE 'witness/qualification-harness/ktrade-w87/Audit-Shipped-Dependencies.cjs') $src
          if($LASTEXITCODE -ne 0){throw 'W87_LOCKED_SHIPPING_JAVASCRIPT_AUDIT_FAILED'}
          $changes=@(& git -C $src status --porcelain)
          if(@($changes|Where-Object {$_ -cnotin @('?? node_modules/','?? static/vendor/')}).Count -ne 0){throw 'W87_UNEXPECTED_TRACKED_INDEX_OR_UNTRACKED_CHANGE'}
          Write-Host '::notice::W87_TRACKED_SOURCE_UNCHANGED_ONLY_EXPLICIT_GENERATED_ASSETS_NO_INSTALL_SCRIPTS_NO_OWNER_DATA_NO_LIVE=PASS'
