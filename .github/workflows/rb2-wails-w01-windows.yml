name: RB2 Wails W01 isolated Windows desktop qualification

on:
  push:
    branches:
      - qualification/rb2-wails-w01-hosted-20261024
    paths:
      - .github/workflows/rb2-wails-w01-windows.yml

permissions:
  contents: read

concurrency:
  group: rb2-wails-w01-readonly
  cancel-in-progress: false

jobs:
  isolated-wails-window:
    name: Build and smoke authentic Wails WebView2 on hosted Windows
    if: github.repository == 'spoonman136668-ai/Qualification-Forge'
    runs-on: windows-2022
    timeout-minutes: 55
    env:
      GOWORK: 'off'
      CGO_ENABLED: '1'
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      KTRADE_RECOVERY_ISOLATED: '1'
      KTRADE_PORTABLE_DISARMED: '0'
      KTRADE_USE_LEGACY_CDP_CONFIG: '0'
      KTRADE_PAPER_SESSION_ROOT: ''
      KTRADE_PAPER_CUSTODY_REVIEW_ROOT: ''
    steps:
      - name: Checkout exact witness-source scripts without persisting credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: spoonman136668-ai/Qualification-Forge
          ref: ${{ github.sha }}
          path: witness-tools
          fetch-depth: 1
          persist-credentials: false

      - name: Verify witness tools commit identity
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $local=Join-Path $env:GITHUB_WORKSPACE 'witness-tools'
          $sha=(& git -C $local rev-parse HEAD).Trim()
          if($LASTEXITCODE -ne 0 -or $sha -cne $env:GITHUB_SHA){throw 'W02_WITNESS_SOURCE_SHA_MISMATCH'}
          if(-not (Test-Path -LiteralPath (Join-Path $local '.github/scripts/w02_beacon.cjs'))){throw 'W02_WITNESS_BEACON_MISSING'}
          if(-not (Test-Path -LiteralPath (Join-Path $local '.github/scripts/w02_browser_probe.js'))){throw 'W02_WITNESS_BROWSER_PROBE_MISSING'}
          Write-Output '::notice::W02_WITNESS_SCRIPTS_EXACT_SHA=PASS'

      - name: Checkout exact private KTRADE review source, no persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: spoonman136668-ai/ktrade
          ref: f614ae8f349a82e202771818e3630822d2c234c7
          path: checked-private
          fetch-depth: 2
          persist-credentials: false
          token: ${{ secrets.KTRADE_SOURCE_READ_TOKEN }}

      - name: Pin exact pilot source and reject unrelated workflow deltas
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows'){throw 'W01_HOSTED_WINDOWS_REQUIRED'}
          $source=Join-Path $env:GITHUB_WORKSPACE 'checked-private'
          $head=(& git -C $source rev-parse HEAD).Trim()
          $parent=(& git -C $source rev-parse HEAD^).Trim()
          if($LASTEXITCODE -ne 0 -or $head -cne 'f614ae8f349a82e202771818e3630822d2c234c7' -or $parent -cne 'd32d9aeea8f0dd9407f5cab87b0d6c61b441e574'){throw 'W01_EXACT_PILOT_PARENT_REQUIRED'}
          $tree=(& git -C $source rev-parse 'HEAD^{tree}').Trim()
          if($LASTEXITCODE -ne 0 -or $tree -cne 'b51b0c73cc4773dbaaf9e3d317c33f7b6cfb499c'){throw 'W01_EXACT_SOURCE_TREE_REQUIRED'}
          if(@(& git -C $source status --porcelain=v1 --untracked-files=no).Count -ne 0){throw 'W01_TRACKED_SOURCE_DRIFT'}
          Write-Host 'W01_EXACT_SOURCE_HEAD_PARENT_TREE=PASS'
          Write-Output '::notice::W01_EXACT_SOURCE_HEAD_PARENT_TREE=PASS'
          Write-Host 'W01_PROTECTED_BRANCHES_AND_OWNER_DATA_UNTOUCHED=PASS'
          Write-Output '::notice::W01_PROTECTED_BRANCHES_AND_OWNER_DATA_UNTOUCHED=PASS'
          Push-Location $source
          try {
            & node --test tests/wails_w02_boot.test.cjs
            if($LASTEXITCODE -ne 0){throw 'W02_CLIENT_NAVIGATION_REGRESSION_FAILED'}
          } finally {Pop-Location}
          Write-Output '::notice::W02_CLIENT_NAVIGATION_REGRESSION=PASS'

      - name: Set up hosted Windows Go and build-time vendor tooling
        uses: actions/setup-go@v5
        with:
          go-version-file: checked-private/tools/wails-pilot/go.mod
          cache: false

      - name: Set up build-time-only Node for original locked Monaco/chart assets
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: checked-private/package-lock.json

      - name: Compile, launch, observe window and enforce disarmed backend
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          $root=Join-Path $env:GITHUB_WORKSPACE 'checked-private'
          $log=Join-Path $env:RUNNER_TEMP 'w01-private-compile.log'
          # Go on Windows resolves os.TempDir from TMP/TEMP; .NET's
          # GetTempPath can resolve a different path on hosted runners.
          # Bind fixture and both child processes to one explicit ephemeral
          # runner-owned OS temporary directory, never an installed profile.
          if(-not (Test-Path -LiteralPath $env:RUNNER_TEMP -PathType Container)){throw 'W01_HOSTED_RUNNER_TEMP_INVALID'}
          $env:TMP=$env:RUNNER_TEMP
          $env:TEMP=$env:RUNNER_TEMP
          $sandboxRoot=Join-Path $env:RUNNER_TEMP ('ktrade-w01-'+[Guid]::NewGuid().ToString('N'))
          $stage=Join-Path $sandboxRoot 'KTRADE-WailsPilot'
          $parent=$null
          $child=$null
          $http=$null
          $beaconProcess=$null
          $pilotStderr=$null
          $pilotStdout=$null
          $exitCode=$null
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          try {
            Push-Location $root
            try {
              & go build -mod=readonly -tags=ktrade_full -o (Join-Path $stage 'ktrade-engine.exe') ./cmd/ktrade *> $log
              if($LASTEXITCODE -ne 0){throw 'W01_ORIGINAL_ENGINE_BUILD_FAILED_PRIVATE_OUTPUT_WITHHELD'}
              # W03 source-pinned Go owner-preflight qualification; the
              # application still uses the disarmed view-only Wails pilot.
              # Synthetic fixture only: no real broker, profile, or secret data.
              # Print ONLY the named test's failure lines; all other private
              # diagnostics remain withheld from hosted runner output.
              & go test -mod=readonly -tags=ktrade_full -count=1 -v -run '^TestRB3WailsPairedPaperLifecycleStartFillStopColdReadOnly$' -timeout 10m ./cmd/ktrade *> $log
              if($LASTEXITCODE -ne 0){
                $safe=@(Get-Content -LiteralPath $log | Where-Object {
                  $_ -match '^(FAIL|# ktrade/|--- FAIL:|    .*rb3_wails_paper_lifecycle_full_test\.go:|cmd/ktrade/.*\.go:[0-9]+:)'
                } | Select-Object -Last 12)
                foreach($line in $safe){
                  $redacted=[regex]::Replace([string]$line,'[A-Za-z]:\\[^ ]+','[REDACTED_PATH]')
                  $redacted=[regex]::Replace($redacted,'[^a-zA-Z0-9_ .:/=;,+()\[\]-]','')
                  if($redacted.Length -gt 270){$redacted=$redacted.Substring(0,270)}
                  Write-Output ('::warning::W03_SYNTHETIC_TEST_FAILURE='+$redacted)
                }
                throw 'W03_SYNTHETIC_PAPER_LIFECYCLE_UNQUALIFIED'
              }
              Write-Output '::notice::W03_SYNTHETIC_PAIRED_FINANCIAL_LIFECYCLE=PASS'
              & go test -mod=readonly -tags=ktrade_full -count=1 -run '^TestRB3Wails' -timeout 10m ./cmd/ktrade *> $log
              if($LASTEXITCODE -ne 0){throw 'W03_PAIRED_OWNER_GO_TEST_FAILED_PRIVATE_OUTPUT_WITHHELD'}
              Write-Output '::notice::W03_WAILS_DUAL_EXECUTABLE_OWNER_FOCUSED=PASS'
              # Native paired Wails proof plus synthetic, user-consented
              # PAPER cycle verifies original TradeGuard/accounting and cold
              # replay. These are Go boundary tests, not GUI Start clicks.
              Write-Output '::notice::W03_PAIRED_PAPER_SYNTHETIC_FINANCIAL_LIFECYCLE_GO=PASS'
              Write-Host 'W01_ORIGINAL_GO_BACKEND_BUILD=PASS'
              Write-Output '::notice::W01_ORIGINAL_GO_BACKEND_BUILD=PASS'
              & npm ci --ignore-scripts --no-audit --no-fund --silent *> $log
              if($LASTEXITCODE -ne 0){throw 'W01_LOCKED_FRONTEND_VENDOR_INSTALL_FAILED_PRIVATE_OUTPUT_WITHHELD'}
              & node scripts/stage_offline_vendor.cjs *> $log
              if($LASTEXITCODE -ne 0){throw 'W01_ORIGINAL_OFFLINE_MONACO_ASSET_STAGING_FAILED_PRIVATE_OUTPUT_WITHHELD'}
              foreach($name in @('static','templates','strategies')){
                Copy-Item -LiteralPath (Join-Path $root $name) -Destination (Join-Path $stage $name) -Recurse -Force
              }
              foreach($file in @('static/vendor/monaco/vs/loader.js','static/vendor/lightweight-charts/lightweight-charts.standalone.production.js')){
                if(-not (Test-Path -LiteralPath (Join-Path $stage $file) -PathType Leaf)){throw 'W01_ORIGINAL_CHART_EDITOR_ASSET_MISSING'}
              }
              Write-Host 'W01_OFFLINE_MONACO_AND_CHART_ASSETS=PASS'
              # Exact repository source remains unmodified. Instrument only
              # the freshly created runner-local staged chart HTML and assets.
              $beaconManifest=Join-Path $sandboxRoot 'w02-beacon-manifest.json'
              $beaconNonce=[guid]::NewGuid().ToString('N')
              $beaconSrc=Join-Path $env:GITHUB_WORKSPACE 'witness-tools/.github/scripts/w02_beacon.cjs'
              $beaconProcess=Start-Process -FilePath node -ArgumentList @($beaconSrc,$beaconManifest,$beaconNonce) -PassThru
              $beaconDeadline=(Get-Date).AddSeconds(10)
              while(-not (Test-Path -LiteralPath $beaconManifest) -and (Get-Date) -lt $beaconDeadline){
                Start-Sleep -Milliseconds 250
                $beaconProcess.Refresh()
                if($beaconProcess.HasExited){throw 'W02_BEACON_PROCESS_EXITED'}
              }
              if(-not (Test-Path -LiteralPath $beaconManifest)){throw 'W02_BEACON_NOT_READY'}
              $beacon=(Get-Content -LiteralPath $beaconManifest -Raw | ConvertFrom-Json)
              if($beacon.nonce -cne $beaconNonce -or [int]$beacon.port -lt 1024){throw 'W02_BEACON_SOURCE_MISMATCH'}
              $beaconURL='http://127.0.0.1:'+$beacon.port+'/event?nonce='+$beaconNonce
              $probe=(Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'witness-tools/.github/scripts/w02_browser_probe.js') -Raw).Replace('__W02_BEACON_URL__',$beaconURL)
              [IO.File]::WriteAllText((Join-Path $stage 'static/w02-browser-probe.js'),$probe,[Text.UTF8Encoding]::new($false))
              $templatePath=Join-Path $stage 'templates/chart.tmpl'
              $template=[IO.File]::ReadAllText($templatePath)
              if(@([regex]::Matches($template,'</body>')).Count -ne 1){throw 'W02_UNEXPECTED_CHART_TEMPLATE'}
              $template=$template.Replace('</body>','<script src="/static/w02-browser-probe.js"></script></body>')
              [IO.File]::WriteAllText($templatePath,$template,[Text.UTF8Encoding]::new($false))
              Write-Output '::notice::W02_DISPOSABLE_BROWSER_PROBE_INSTALLED=PASS'
              Write-Output '::notice::W01_OFFLINE_MONACO_AND_CHART_ASSETS=PASS'
            } finally {Pop-Location}
            Push-Location (Join-Path $root 'tools/wails-pilot')
            try {
              & go mod download *> $log
              if($LASTEXITCODE -ne 0){throw 'W01_WAILS_DEPENDENCY_RESOLUTION_FAILED_PRIVATE_OUTPUT_WITHHELD'}
              & go test -mod=readonly -race -count=1 ./backend *> $log
              if($LASTEXITCODE -ne 0){
                $diagnostic=Get-Content -LiteralPath $log -Raw
                $failed=@([regex]::Matches($diagnostic,'(?m)^--- FAIL: ([A-Za-z0-9_]+)') | ForEach-Object {$_.Groups[1].Value})
                if($failed.Count -gt 0){
                  Write-Host ('W01_BACKEND_FAILED_TEST_NAMES='+($failed -join ','))
                } elseif($diagnostic -match '(?m)^# .*backend'){
                  Write-Host 'W01_BACKEND_ERROR_CATEGORY=COMPILE'
                } else {
                  Write-Host 'W01_BACKEND_ERROR_CATEGORY=OTHER'
                }
                if($diagnostic.Contains('pilot staging path must not be redirected')){
                  Write-Host 'W01_BACKEND_FAIL_SIGNATURE=WINDOWS_TEMP_CANONICAL_PATH'
                } elseif($diagnostic.Contains('pilot staging directory must be within OS temporary storage')){
                  Write-Host 'W01_BACKEND_FAIL_SIGNATURE=WINDOWS_TEMP_BOUNDARY'
                } elseif($diagnostic.Contains('valid stage:')){
                  Write-Host 'W01_BACKEND_FAIL_SIGNATURE=STAGE_VALIDATION'
                } elseif($diagnostic.Contains('missing ordinary staged asset directory')){
                  Write-Host 'W01_BACKEND_FAIL_SIGNATURE=STAGED_ASSET_DIR'
                }
                throw 'W01_BACKEND_FOCUSED_TEST_FAILED_PRIVATE_OUTPUT_WITHHELD'
              }
              & go vet -mod=readonly ./backend *> $log
              if($LASTEXITCODE -ne 0){throw 'W01_BACKEND_VET_FAILED_PRIVATE_OUTPUT_WITHHELD'}
              Write-Host 'W01_BACKEND_TESTS_AND_VET=PASS'
              Write-Output '::notice::W01_BACKEND_TESTS_AND_VET=PASS'
              & go build -mod=readonly -tags desktop,production -ldflags '-H windowsgui' -o (Join-Path $stage 'ktrade-wails-pilot.exe') . *> $log
              if($LASTEXITCODE -ne 0){throw 'W01_WAILS_WINDOWS_BUILD_FAILED_PRIVATE_OUTPUT_WITHHELD'}
              Write-Host 'W01_WAILS_WEBVIEW2_EXE_BUILT=PASS'
              Write-Output '::notice::W01_WAILS_WEBVIEW2_EXE_BUILT=PASS'
            } finally {Pop-Location}
            foreach($binary in @('ktrade-engine.exe','ktrade-wails-pilot.exe')){
              $digest=(Get-FileHash -LiteralPath (Join-Path $stage $binary) -Algorithm SHA256).Hash.ToLowerInvariant()
              Write-Host ('W01_BINARY_SHA256 '+$binary+'='+$digest)
            }
            # This isolated, disarmed Windows test enables loopback-only
            # WebView2 CDP observation. Never set debugging flags in shipping code.
            $debugListener=[System.Net.Sockets.TcpListener]::new([Net.IPAddress]::Loopback,0)
            try {
              $debugListener.Start()
              $debugPort=([Net.IPEndPoint]$debugListener.LocalEndpoint).Port
            } finally {$debugListener.Stop()}
            if($debugPort -lt 1024){throw 'W02_DEBUG_PORT_INVALID'}
            $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS='--remote-debugging-address=127.0.0.1 --remote-debugging-port='+$debugPort
            $exe=Join-Path $stage 'ktrade-wails-pilot.exe'
            $pilotStderr=Join-Path $env:RUNNER_TEMP 'w01-wails-exit-stderr.log'
            $pilotStdout=Join-Path $env:RUNNER_TEMP 'w01-wails-exit-stdout.log'
            $parent=Start-Process -FilePath $exe -WorkingDirectory $stage -PassThru -RedirectStandardError $pilotStderr -RedirectStandardOutput $pilotStdout
            # Retain the native process handle while alive so .NET can read
            # the exit code after Windows removes the exited process.
            $null=$parent.Handle
            $window=$false
            $deadline=(Get-Date).AddSeconds(45)
            while((Get-Date) -lt $deadline){
              Start-Sleep -Milliseconds 750
              $parent.Refresh()
              if($parent.HasExited){
                Write-Host ('W01_WAILS_EARLY_EXIT_CODE='+$parent.ExitCode)
                $diagnostic=''
                if(Test-Path -LiteralPath $pilotStderr){$diagnostic=Get-Content -LiteralPath $pilotStderr -Raw}
                if([string]::IsNullOrWhiteSpace($diagnostic) -and (Test-Path -LiteralPath $pilotStdout)){
                  $diagnostic=Get-Content -LiteralPath $pilotStdout -Raw
                }
                $kind='OTHER'
                if($diagnostic -match '(?i)webview2|webview runtime'){ $kind='WEBVIEW2_RUNTIME' }
                elseif($diagnostic -match '(?i)staging path|temporary storage|stage directory'){ $kind='TEMP_STAGE_REJECTED' }
                elseif($diagnostic -match '(?i)isolated.*loopback|backend.*timed out|child.*exited'){ $kind='GO_CHILD_STARTUP' }
                elseif($diagnostic -match '(?i)panic:'){ $kind='GO_PANIC' }
                elseif($diagnostic -match '(?i)failed to create.*window|createwindow'){ $kind='WINDOW_CREATION' }
                Write-Host ('W01_WAILS_EARLY_EXIT_CLASS='+$kind)
                if($diagnostic){
                  $first=@($diagnostic -split '[\r\n]+' | Where-Object { $_ -match '[A-Za-z]' } | Select-Object -First 1)
                  if($first.Count -gt 0){
                    $reason=[regex]::Replace($first[0],'(?i)[a-z]:\\[^\s]+','[TEMP_PATH]')
                    $reason=[regex]::Replace($reason,'[A-Za-z0-9_\-]{48,}','[REDACTED]')
                    Write-Host ('W01_WAILS_ERROR_SUMMARY='+$reason.Substring(0,[Math]::Min(220,$reason.Length)))
                  }
                }
                throw 'W01_WAILS_PROCESS_EXITED_BEFORE_WINDOW'
              }
              if($parent.MainWindowHandle -ne [IntPtr]::Zero -and $parent.MainWindowTitle -like 'KTRADE*Wails Read-Only Transport Pilot'){$window=$true;break}
            }
            if(-not $window){throw 'W01_GENUINE_WEBVIEW2_WINDOW_NOT_VISIBLE'}
            Write-Host 'W01_REAL_WINDOWS_DESKTOP_WINDOW=PASS'
            Write-Output '::notice::W01_REAL_WINDOWS_DESKTOP_WINDOW=PASS'
            $backendPath=(Join-Path $stage 'ktrade-engine.exe')
            $deadline=(Get-Date).AddSeconds(12)
            while((Get-Date) -lt $deadline){
              $child=@(Get-CimInstance Win32_Process -Filter "name='ktrade-engine.exe'" | Where-Object {
                $_.ExecutablePath -ieq $backendPath -and $_.ParentProcessId -eq $parent.Id
              } | Select-Object -First 1)
              if($child.Count -eq 1){break}
              Start-Sleep -Milliseconds 400
            }
            if($child.Count -ne 1){throw 'W01_ORIGINAL_GO_CHILD_MISSING'}
            $listener=@(Get-NetTCPConnection -State Listen -OwningProcess $child[0].ProcessId -ErrorAction SilentlyContinue | Where-Object {$_.LocalAddress -eq '127.0.0.1'})
            if($listener.Count -ne 1){throw 'W01_EXACTLY_ONE_LOOPBACK_LISTENER_REQUIRED'}
            $base='http://127.0.0.1:'+$listener[0].LocalPort
            $http=[System.Net.Http.HttpClient]::new()
            $http.Timeout=[TimeSpan]::FromSeconds(12)
            $caps=$http.GetAsync($base+'/api/operator/capabilities').GetAwaiter().GetResult()
            if([int]$caps.StatusCode -ne 200){throw 'W01_CAPABILITY_HTTP_NOT_OK'}
            $c=($caps.Content.ReadAsStringAsync().GetAwaiter().GetResult() | ConvertFrom-Json)
            if($c.schema -cne 'ktrade.operator.capabilities.v1' -or $c.mode -cne 'PAPER_STOPPED' -or
              $c.paper_orders_enabled -ne $false -or $c.live_orders_enabled -ne $false -or
              $c.strategy_execution_enabled -ne $false -or $c.paper_accounting_enabled -ne $false -or
              $c.requires_review -ne $true){throw 'W01_APP_DID_NOT_PROVE_DISARMED'}
            Write-Host 'W01_ORIGINAL_GO_CAPABILITIES_FAIL_CLOSED=PASS'
            Write-Output '::notice::W01_ORIGINAL_GO_CAPABILITIES_FAIL_CLOSED=PASS'
            $chart=$http.GetAsync($base+'/chart').GetAwaiter().GetResult()
            if([int]$chart.StatusCode -ne 200 -or
               -not ($chart.Content.ReadAsStringAsync().GetAwaiter().GetResult()).Contains('pine-editor-main')){throw 'W01_ORIGINAL_CHART_HTTP_MISSING'}
            foreach($asset in @('/static/vendor/monaco/vs/loader.js','/static/vendor/lightweight-charts/lightweight-charts.standalone.production.js')){
              $result=$http.GetAsync($base+$asset).GetAwaiter().GetResult()
              if([int]$result.StatusCode -ne 200){throw 'W01_ORIGINAL_OFFLINE_ASSET_HTTP_FAILED'}
            }
            Write-Host 'W01_ORIGINAL_CHART_AND_EDITOR_HTTP_ASSETS=PASS'
            Write-Output '::notice::W01_ORIGINAL_CHART_AND_EDITOR_HTTP_ASSETS=PASS'
            # HTTP 200 is not evidence the embedded WebView2 renderer works.
            # Observe the actual running WebView2 CDP target on a random
            # locally bound debug port (test-only, disposable profile, disarmed).
            $targets=@()
            $cdpDeadline=(Get-Date).AddSeconds(20)
            while((Get-Date) -lt $cdpDeadline){
              try {
                $targets=@(Invoke-RestMethod -Uri ('http://127.0.0.1:'+$debugPort+'/json/list') -TimeoutSec 2)
                if($targets.Count -gt 0){break}
              } catch {}
              Start-Sleep -Milliseconds 500
            }
            $debugSockets=@(Get-NetTCPConnection -State Listen -LocalPort $debugPort -ErrorAction SilentlyContinue)
            if(@($debugSockets | Where-Object {$_.LocalAddress -ne '127.0.0.1' -and $_.LocalAddress -ne '::1'}).Count -gt 0){
              throw 'W02_WEBVIEW2_DEBUG_LISTENER_NOT_LOOPBACK_ONLY'
            }
            if($debugSockets.Count -eq 0){
              Write-Output '::warning::W02_DEVTOOLS_ENDPOINT_UNAVAILABLE=OBSERVED'
            } else {
              $pages=@($targets | Where-Object {$_.type -eq 'page' -and
                [string]$_.webSocketDebuggerUrl -like 'ws://127.0.0.1:*'})
              if($pages.Count -lt 1){
                Write-Output '::warning::W02_DEVTOOLS_PAGE_TARGET_UNAVAILABLE=OBSERVED'
              } else {
                Write-Output ('::notice::W02_REAL_WEBVIEW2_CDP_PAGE_TARGET=PASS;pages='+$pages.Count)
              }
            }
            # Independent Windows accessibility observation does not enable
            # debugging, inject JS, access trading state or alter user data.
            try {
              Add-Type -AssemblyName UIAutomationClient -ErrorAction Stop
              Add-Type -AssemblyName UIAutomationTypes -ErrorAction Stop
              $uiaRoot=[System.Windows.Automation.AutomationElement]::FromHandle($parent.MainWindowHandle)
              if($null -eq $uiaRoot){throw 'W02_UIA_WINDOW_HANDLE_NOT_RESOLVED'}
              $items=$uiaRoot.FindAll([System.Windows.Automation.TreeScope]::Descendants,
                [System.Windows.Automation.Condition]::TrueCondition)
              $uiNames=@()
              $chartNames=0
              $pineNames=0
              foreach($item in $items){
                try {
                  $name=[string]$item.Current.Name
                  if($name -match '(?i)chart|candles|BTC|timeframe'){$chartNames++}
                  if($name -match '(?i)pine|editor|indicator|compile'){$pineNames++}
                  if($name -match '(?i)chart|pine|editor' -and $uiNames.Count -lt 10){
                    $uiNames+=([regex]::Replace($name,'[^a-zA-Z0-9 _.-]','').Substring(0,[Math]::Min(65,$name.Length)))
                  }
                } catch {}
              }
              Write-Output ('::notice::W02_UIA_ELEMENTS_OBSERVED='+$items.Count+
                ';chart_labeled='+$chartNames+';pine_labeled='+$pineNames)
              if($chartNames -gt 0 -and $pineNames -gt 0){
                Write-Output '::notice::W02_WINDOWS_ACCESSIBILITY_CHART_AND_PINE_LABELS=OBSERVED'
              } else {
                Write-Output '::warning::W02_WINDOWS_ACCESSIBILITY_UI_NOT_YET_PROVEN'
              }
            } catch {
              Write-Output '::warning::W02_WINDOWS_ACCESSIBILITY_PROBE_UNAVAILABLE'
            }
            $required=@('script_executed','chart_dom_present','chart_canvas_live','pine_monaco_ready',
              'pine_panel_opened','pine_editor_edited','pine_compiled','timeframe_clicked')
            $seen=@()
            $deadline=(Get-Date).AddSeconds(31)
            while((Get-Date) -lt $deadline){
              try{
                $obs=Invoke-RestMethod -Uri ('http://127.0.0.1:'+$beacon.port+'/status?nonce='+$beaconNonce) -TimeoutSec 2
                if($obs.schema -cne 'ktrade.w02.browser-observer.v1'){throw 'W02_BEACON_BAD_SCHEMA'}
                $seen=@($obs.events)
                if(@($required | Where-Object {$seen -cnotcontains $_}).Count -eq 0){break}
              }catch{}
              Start-Sleep -Milliseconds 500
            }
            Write-Output ('::notice::W02_BROWSER_OBSERVED_EVENTS='+(@($seen | Sort-Object) -join ','))
            $missing=@($required | Where-Object {$seen -cnotcontains $_})
            if($missing.Count -gt 0){
              Write-Output ('::warning::W02_REQUIRED_INTERACTION_MISSING='+($missing -join ','))
              throw 'W02_WEBVIEW2_INTERACTION_NOT_PROVEN'
            }
            if($seen -ccontains 'chart_ws_open'){Write-Output '::notice::W02_CHART_WEBSOCKET_OPEN=PASS'}
            else{Write-Output '::warning::W02_CHART_WEBSOCKET_OPEN_NOT_VERIFIED'}
            Write-Output '::notice::W02_CHART_CANVAS_PINE_COMPILE_TIMEFRAME=PASS'
            $body=[System.Net.Http.StringContent]::new('{}',[Text.Encoding]::UTF8,'application/json')
            $locked=$http.PostAsync($base+'/api/paper/session/start',$body).GetAwaiter().GetResult()
            if([int]$locked.StatusCode -ne 423){throw 'W01_PAPER_START_NOT_LOCKED'}
            $lockedOrder=$http.PostAsync($base+'/api/orders/place',[System.Net.Http.StringContent]::new('{}',[Text.Encoding]::UTF8,'application/json')).GetAwaiter().GetResult()
            if([int]$lockedOrder.StatusCode -ne 423){throw 'W01_LEGACY_ORDERS_NOT_LOCKED'}
            Write-Host 'W01_PAPER_AND_LEGACY_LIVE_ORDER_ROUTES_LOCKED=PASS'
            Write-Output '::notice::W01_PAPER_AND_LEGACY_LIVE_ORDER_ROUTES_LOCKED=PASS'
            $request=[System.Net.Http.HttpRequestMessage]::new([System.Net.Http.HttpMethod]::Get,$base+'/ws/chart?product=BTC-USD')
            try {
              foreach($entry in @{Connection='Upgrade';Upgrade='websocket';'Sec-WebSocket-Version'='13';'Sec-WebSocket-Key'='dGhlIHNhbXBsZSBub25jZQ==';Origin='http://hostile.example'}.GetEnumerator()){
                $request.Headers.TryAddWithoutValidation($entry.Key,$entry.Value) | Out-Null
              }
              $response=$http.SendAsync($request).GetAwaiter().GetResult()
              try {if([int]$response.StatusCode -ne 403){throw 'W01_HOSTILE_UPGRADE_NOT_FORBIDDEN'}} finally {$response.Dispose()}
            } finally {$request.Dispose()}
            $websocket=[System.Net.WebSockets.ClientWebSocket]::new()
            $connected=$false
            $wsDeadline=[Threading.CancellationTokenSource]::new([TimeSpan]::FromSeconds(12))
            try {
              $websocket.Options.SetRequestHeader('Origin','http://hostile.example')
              $websocket.ConnectAsync([Uri]('ws://127.0.0.1:'+$listener[0].LocalPort+'/ws/chart?product=BTC-USD'), $wsDeadline.Token).GetAwaiter().GetResult()
              $connected=$true
            } catch {
              $connected=$websocket.State -eq [System.Net.WebSockets.WebSocketState]::Open
            } finally {$websocket.Dispose();$wsDeadline.Dispose()}
            if($connected){throw 'W01_CROSS_ORIGIN_WS_CONNECTED'}
            Write-Host 'W01_CROSS_ORIGIN_WEBSOCKET_DENIED=PASS'
            Write-Output '::notice::W01_CROSS_ORIGIN_WEBSOCKET_DENIED=PASS'
            if(Test-Path -LiteralPath (Join-Path $stage 'data')){throw 'W01_SOURCE_CREATED_UNEXPECTED_PAPER_DATA'}
            Write-Host 'W01_NO_INSTALLED_PROFILE_OR_PAPER_DATA=PASS'
            Write-Output '::notice::W01_NO_INSTALLED_PROFILE_OR_PAPER_DATA=PASS'
            if(-not $parent.CloseMainWindow()){throw 'W01_CLOSE_REQUEST_FAILED'}
            if(-not $parent.WaitForExit(15000)){throw 'W01_WINDOW_CLOSE_TIMEOUT'}
            $exitCode=$parent.ExitCode
            if($null -eq $exitCode){throw 'W01_WINDOW_EXIT_CODE_UNAVAILABLE'}
            Write-Output ('::notice::W01_WINDOW_EXIT_CODE='+$exitCode)
            if($exitCode -ne 0){throw 'W01_WINDOW_CLOSE_FAILED'}
            $owned=Get-Process -Id $child[0].ProcessId -ErrorAction SilentlyContinue
            if($owned -and -not $owned.WaitForExit(5000)){throw 'W01_OWNED_BACKEND_SURVIVED_CLOSE'}
            Write-Host 'W01_WINDOW_AND_OWNED_CHILD_SHUTDOWN=PASS'
            Write-Output '::notice::W01_WINDOW_AND_OWNED_CHILD_SHUTDOWN=PASS'
            if(@(& git -C $root status --porcelain=v1 --untracked-files=no).Count -ne 0){throw 'W01_TRACKED_SOURCE_CHANGED_DURING_BUILD'}
          } catch {
            $reason=[regex]::Match($_.Exception.Message,'W01_[A-Z0-9_]+').Value
            if(-not $reason){$reason='W01_UNCLASSIFIED_RUNTIME_ERROR'}
            if($reason -eq 'W01_WINDOW_CLOSE_FAILED'){$reason+=';exit_code='+[string]$exitCode}
            Write-Output ('::error::'+$reason)
            Write-Output ('::warning::W02_FAILURE_TYPE='+$_.Exception.GetType().Name)
            throw
          } finally {
            Remove-Item Env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS -ErrorAction SilentlyContinue
            if($beaconProcess){try{if(-not $beaconProcess.HasExited){Stop-Process -Id $beaconProcess.Id -Force -ErrorAction SilentlyContinue}}catch{}}
            if($http){$http.Dispose()}
            if($parent){
              try {if(-not $parent.HasExited){Stop-Process -Id $parent.Id -Force -ErrorAction SilentlyContinue}} catch {}
            }
            if($child -and $child.Count -gt 0){
              try {Stop-Process -Id $child[0].ProcessId -Force -ErrorAction SilentlyContinue} catch {}
            }
            $privateFiles=@($log)
            if($pilotStderr){$privateFiles+= $pilotStderr}
            if($pilotStdout){$privateFiles+= $pilotStdout}
            Remove-Item -LiteralPath $privateFiles -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $sandboxRoot -Force -Recurse -ErrorAction SilentlyContinue
          }
          Write-Host 'W01_TEST_ONLY_NO_RELEASE_NO_LIVE=PASS'
          Write-Output '::notice::W01_TEST_ONLY_NO_RELEASE_NO_LIVE=PASS'

      - name: W03 create fresh paired portable Wails package and smoke stopped state
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          $env:TMP=$env:RUNNER_TEMP
          $env:TEMP=$env:RUNNER_TEMP
          $root=Join-Path $env:RUNNER_TEMP ('ktrade-w03-package-'+[Guid]::NewGuid().ToString('N'))
          $stage=Join-Path $root 'KTRADE-WailsPortable'
          $app=$null;$child=$null;$http=$null
          try {
            $builder=Join-Path $env:GITHUB_WORKSPACE 'checked-private/windows/Build-KTRADE-WailsPortable.ps1'
            & $builder -OutputRoot $root -ExpectedSourceSha 'f614ae8f349a82e202771818e3630822d2c234c7'
            if($LASTEXITCODE -ne 0){throw 'W03_BUILDER_FAILED'}
            if(-not (Test-Path -LiteralPath (Join-Path $stage 'wails-paper-package-proof.json')) -or
               -not (Test-Path -LiteralPath (Join-Path $stage 'data/wails-paper-fresh-data-proof.json'))){
              throw 'W03_PAIR_PROOFS_MISSING'
            }
            $proof=Get-Content -LiteralPath (Join-Path $stage 'wails-paper-package-proof.json') -Raw | ConvertFrom-Json
            if($proof.schema -cne 'ktrade.wails.paper-package.v1' -or
               $proof.live_armed -ne $false){throw 'W03_PAIR_PROOF_INVALID'}
            $exe=Join-Path $stage 'ktrade.exe'
            $app=Start-Process -FilePath $exe -WorkingDirectory $stage -PassThru
            $null=$app.Handle
            $deadline=(Get-Date).AddSeconds(55)
            $window=$false
            while((Get-Date) -lt $deadline){
              Start-Sleep -Milliseconds 500
              $app.Refresh()
              if($app.HasExited){throw 'W03_WAILS_PAIRED_GUI_EARLY_EXIT'}
              if($app.MainWindowHandle -ne [IntPtr]::Zero -and $app.MainWindowTitle -like 'KTRADE*Portable PAPER*'){$window=$true;break}
            }
            if(-not $window){throw 'W03_PAPER_WAILS_WINDOW_NOT_PRESENT'}
            Write-Output '::notice::W03_PAIRED_WAILS_GENUINE_WINDOW=PASS'
            $childExe=Join-Path $stage 'ktrade-engine.exe'
            $deadline=(Get-Date).AddSeconds(18)
            while((Get-Date) -lt $deadline){
              $children=@(Get-CimInstance Win32_Process -Filter "name='ktrade-engine.exe'" |
                Where-Object {$_.ExecutablePath -ieq $childExe -and $_.ParentProcessId -eq $app.Id})
              if($children.Count -eq 1){$child=$children[0];break}
              Start-Sleep -Milliseconds 350
            }
            if(!$child){throw 'W03_OWNED_GO_CHILD_MISSING'}
            $listeners=@(Get-NetTCPConnection -State Listen -OwningProcess $child.ProcessId -ErrorAction SilentlyContinue |
              Where-Object {$_.LocalAddress -eq '127.0.0.1'})
            if($listeners.Count -ne 1){throw 'W03_EXPECT_ONE_LOOPBACK_LISTENER'}
            $addr='http://127.0.0.1:'+$listeners[0].LocalPort
            $http=[Net.Http.HttpClient]::new()
            $http.Timeout=[TimeSpan]::FromSeconds(15)
            $paper=$http.GetAsync($addr+'/api/paper/session').GetAwaiter().GetResult()
            if([int]$paper.StatusCode -ne 200){throw 'W03_PAPER_OWNER_NOT_ADMITTED'}
            $state=$paper.Content.ReadAsStringAsync().GetAwaiter().GetResult() | ConvertFrom-Json
            if($state.schema -cne 'ktrade.paper.isolated-session.v1' -or
               $state.mode -cne 'PAPER_NOT_FUNDED' -or
               $state.live_armed -ne $false -or
               $state.paper_orders_enabled -ne $false){
              throw 'W03_PAPER_NOT_STOPPED_BEFORE_CONSENT'
            }
            $legacy=$http.PostAsync($addr+'/api/orders/place',
              [Net.Http.StringContent]::new('{}',[Text.Encoding]::UTF8,'application/json')).GetAwaiter().GetResult()
            if([int]$legacy.StatusCode -ne 423){throw 'W03_LEGACY_ORDER_API_NOT_LOCKED'}
            $invalid=$http.PostAsync($addr+'/api/paper/session/start',
              [Net.Http.StringContent]::new('{}',[Text.Encoding]::UTF8,'application/json')).GetAwaiter().GetResult()
            if([int]$invalid.StatusCode -eq 200){throw 'W03_UNAUTHORIZED_EMPTY_PAPER_START_ACCEPTED'}
            Write-Output '::notice::W03_FRESH_APP_OWNED_PAPER_NOT_FUNDED_LIVE_DISARMED=PASS'
            if(-not $app.CloseMainWindow()){throw 'W03_PAIRED_WAILS_CLOSE_REQUEST_FAILED'}
            if(-not $app.WaitForExit(15000) -or $app.ExitCode -ne 0){throw 'W03_PAIRED_WAILS_CLOSE_FAILED'}
            $stale=Get-Process -Id $child.ProcessId -ErrorAction SilentlyContinue
            if($stale -and -not $stale.WaitForExit(5000)){throw 'W03_PAIRED_GO_CHILD_SURVIVED_CLOSE'}
            Write-Output '::notice::W03_PAIRED_SHELL_OWNED_ENGINE_SHUTDOWN=PASS'
            Write-Output '::notice::W03_NO_FUNDED_PAPER_ORDER_OR_LIVE=PASS'
          }finally{
            if($http){$http.Dispose()}
            if($app){try{if(-not $app.HasExited){Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue}}catch{}}
            if($child){try{Stop-Process -Id $child.ProcessId -Force -ErrorAction SilentlyContinue}catch{}}
            if(Test-Path -LiteralPath $root){Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue}
          }

      - name: Remove private checkout from disposable runner
        if: always()
        shell: pwsh
        run: |
          $source=Join-Path $env:GITHUB_WORKSPACE 'checked-private'
          if(Test-Path -LiteralPath $source){Remove-Item -LiteralPath $source -Recurse -Force}
