name: R25-C75D3A stopped paper-session shipping-operator integration qualification
on:
  push:
    branches: [qualification/r25-c75d3-stopped-session-bridge-20261020]
    paths: [.github/workflows/r25-c75d3-stopped-session-bridge.yml]
permissions:
  contents: read
concurrency:
  group: r25-c75d3a-stopped-bridge
  cancel-in-progress: false
jobs:
  ktrade-paper-only-functional:
    if: github.repository == 'spoonman136668-ai/Qualification-Forge'
    runs-on: windows-2022
    timeout-minutes: 55
    env:
      VERIFIED_SHA: '0c4ed855d95c8f746d96bf8259dae8088d4fcb24'
      VERIFIED_TREE: '46d1596bb3d6e919dafe54744ddb5afaf7adb7a3'
      PARENT_SHA: 'bb9ba8a4abc4ad46102168f7f0a5a6b01d82c6c4'
      DONOR_SHA: '520cfe124fdd7e8dcbf16b6a6f38229b43db7dbc'
      DONOR_TREE: 'b74808f35e798b1b72e8fb31a49a5f4664ca87b5'
      ORIGINAL_SHA: 'd892d5902f6c19105c4395bf6b71bfb112b22a62'
      ORIGINAL_TREE: '95846811b88a0cb538dd6d494bb771ef3cd8102b'
      C12_TEST_BLOB: '8813b0db1c5591db5b136dc32b568d8773cbc4e6'
      MIXED_PARENT_SHA: '2af730f8a7bed15370d86d2ce0ced060c56beed2'
      MIXED_PARENT_TREE: '89cc720ff3d6da6cec12d583a23682584f473ac6'
      MIXED_TEST_BLOB: '00d8cabd7077f84e8b9d39d36cd5f8eb9b658206'
      KTRADE_CI_PAPER_ONLY: '1'
      KTRADE_CI_LIVE_AUTHORITY: '0'
      KTRADE_CI_COINBASE_ALLOWED: '0'
      KTRADE_CI_PROMOTION_ALLOWED: '0'
      GOFLAGS: '-p=2'
      GOMAXPROCS: '2'
      GOWORK: 'off'
    steps:
      - name: Pin isolated Windows paper-only authority
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/Qualification-Forge' -or
             $env:RUNNER_OS -cne 'Windows' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or
             $env:GITHUB_REF -cne 'refs/heads/qualification/r25-c75d3-stopped-session-bridge-20261020' -or
             $env:KTRADE_CI_PAPER_ONLY -cne '1' -or $env:KTRADE_CI_LIVE_AUTHORITY -cne '0' -or
             $env:KTRADE_CI_COINBASE_ALLOWED -cne '0' -or $env:KTRADE_CI_PROMOTION_ALLOWED -cne '0'){
            throw 'C75A_UNQUALIFIED_RUNNER_OR_TRADING_AUTHORITY'
          }
          Write-Host 'C75A_KTRADE_WINDOWS_PAPER_ONLY_NO_CONTROLLER=PASS'
      - name: Checkout exact private KTRADE functional candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: spoonman136668-ai/ktrade
          ref: 0c4ed855d95c8f746d96bf8259dae8088d4fcb24
          path: candidate
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.KTRADE_SOURCE_READ_TOKEN }}
      - name: Verify only intended original operator paper status integration
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if((& git -C candidate rev-parse HEAD).Trim() -cne $env:VERIFIED_SHA -or
             (& git -C candidate rev-parse 'HEAD^{tree}').Trim() -cne $env:VERIFIED_TREE -or
             @(& git -C candidate status --porcelain=v1 --untracked-files=all).Count -ne 0){
            throw 'C75A_KTRADE_SOURCE_DRIFT'
          }
          $expected=@(
            'cmd/ktrade/operator_native_evaluator_c75c_full.go',
            'cmd/ktrade/operator_native_evaluator_c75c_full_test.go',
            'cmd/ktrade/operator_recovery_full.go',
            'recovery/operator-bridge/operator-control-review.js',
            'package.json',
            'tests/donor-native-vwap/c75c_native_evaluator_sidecar.go',
            'tests/donor-native-vwap/c75c_replay_asof_patch.ps1',
            'tests/donor-shadow/native_vwap_c75c_sidecar_test.go',
            'internal/paperlifecycle/authority.go',
            'tests/donor-shadow/c75d2_atomic_paper_session_test.go',
            'cmd/ktrade/operator_paper_session_c75d3_full_test.go',
            'cmd/ktrade/operator_paper_session_c75d3_windows_test.go',
            'cmd/ktrade/operator_paper_status_full.go',
            'recovery/operator-bridge/operator-paper-status.js',
            'tests/donor-shadow/c75d3_process_recovery_test.go'
          )|Sort-Object
          $actual=@(& git -C candidate diff --name-only $env:PARENT_SHA $env:VERIFIED_SHA | Sort-Object)
          if($actual.Count -ne 15 -or @(Compare-Object $expected $actual).Count -ne 0){
            throw 'C75C_NATIVE_EXE_SOURCE_SCOPE_DRIFT'
          }
          Write-Host 'C75A_ORIGINAL_OPERATOR_PAPER_STATUS_FUNCTIONAL_DELTA=PASS'
      - name: Pin Windows Go toolchain
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.24.9'
          cache: false
      - name: Checkout exact genuine donor for TradeGuard and native VWAP
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: spoonman136668-ai/ckb
          ref: 520cfe124fdd7e8dcbf16b6a6f38229b43db7dbc
          fetch-depth: 0
          path: donor
          persist-credentials: false
          token: ${{ secrets.KTRADE_CKB_READ_TOKEN_TEMP }}
      - name: Stage only known recovered paper authority and test files
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $source=Join-Path $env:GITHUB_WORKSPACE 'candidate'
          $donor=Join-Path $env:GITHUB_WORKSPACE 'donor'
          $files=@{
            'internal/paperproposal'=@('proposal.go')
            'internal/paperlifecycle'=@('authority.go')
            'internal/paperauthority'=@('authority.go','commit_trial_shadow.go','read_only.go')
            'internal/paperreconcile'=@(
              'reconcile.go','risk_replay.go','settlement_review.go',
              'original_risk_custody.go','commit_protocol_shadow.go',
              'windows_fs_capability_shadow_windows.go'
            )
          }
          foreach($dir in $files.Keys){
            $target=Join-Path $donor $dir
            if(Test-Path -LiteralPath $target){throw ('C75B1_DONOR_COLLISION_'+$dir)}
            New-Item -ItemType Directory -Path $target -Force|Out-Null
            foreach($name in $files[$dir]){
              Copy-Item -LiteralPath (Join-Path (Join-Path $source $dir) $name) -Destination (Join-Path $target $name) -ErrorAction Stop
            }
          }
          $upgrade=Join-Path $donor 'internal/durableupgrade'
          if(!(Test-Path -LiteralPath $upgrade -PathType Container)){throw 'C75B1_DONOR_DURABLE_PACKAGE_MISSING'}
          # Preserve the original donor's durable_upgrade.go; add only the
          # bounded recovered source verifier files to its isolated checkout.
          foreach($name in @(
            'selected_recovery_portability.go','selected_custody_admission.go',
            'historical_document_shape.go','historical_readonly_view.go',
            'historical_candle_review.go','authenticated_native_vwap_source.go',
            'original_canonical_15s_vwap.go'
          )){
            if(Test-Path -LiteralPath (Join-Path $upgrade $name)){throw 'C75B1_EXISTING_DONOR_SOURCE_OVERLAP'}
            Copy-Item -LiteralPath (Join-Path $source ('internal/durableupgrade/'+$name)) -Destination (Join-Path $upgrade $name) -ErrorAction Stop
          }
          Copy-Item -LiteralPath (Join-Path $source 'tests/donor-native-vwap/c74f3_source_fixture.go') -Destination (Join-Path $upgrade 'c74f3_source_fixture_shadow.go') -ErrorAction Stop
          Copy-Item -LiteralPath (Join-Path $source 'tests/donor-native-vwap/c74f8_canonical_fixture.go') -Destination (Join-Path $upgrade 'c74f8_canonical_fixture_shadow.go') -ErrorAction Stop
          $pkg=Join-Path $donor 'pkg/native_vwap_c74f2_shadow.go'
          if(Test-Path -LiteralPath $pkg){throw 'C75B1_NATIVE_BRIDGE_COLLISION'}
          Copy-Item -LiteralPath (Join-Path $source 'tests/donor-native-vwap/native_vwap_bridge_c74f2.go') -Destination $pkg
          $testDir=Join-Path $donor 'internal/shadowqual'
          if(Test-Path -LiteralPath $testDir){throw 'C75B1_TEST_COLLISION'}
          New-Item -ItemType Directory -Path $testDir -Force|Out-Null
          $testFiles=@(
            'shadow_test.go','proposal_test.go','reconcile_test.go',
            'risk_replay_test.go','settlement_review_test.go',
            'original_risk_custody_test.go','commit_order_fault_test.go',
            'commit_protocol_test.go','real_process_kill_test.go',
            'midwrite_process_kill_test.go','windows_fs_capability_test.go',
            'paper_sqlite_commit_test.go','paper_sqlite_commit_windows_test.go',
            'native_vwap_c74f2_test.go','native_vwap_c74f3_test.go',
            'native_vwap_c74f8_test.go','c75b_paper_lifecycle_test.go',
            'native_vwap_c75c_sidecar_test.go','c75d2_atomic_paper_session_test.go',
            'c75d3_process_recovery_test.go'
          )
          foreach($name in $testFiles){
            Copy-Item -LiteralPath (Join-Path $source ('tests/donor-shadow/'+$name)) -Destination (Join-Path $testDir $name) -ErrorAction Stop
          }
          $sidecarDir=Join-Path $donor 'cmd/ktrade-native-vwap'
          if(Test-Path -LiteralPath $sidecarDir){throw 'C75C_DONOR_NATIVE_SIDECAR_COLLISION'}
          New-Item -ItemType Directory -Path $sidecarDir -Force|Out-Null
          Copy-Item -LiteralPath (Join-Path $source 'tests/donor-native-vwap/c75c_native_evaluator_sidecar.go') -Destination (Join-Path $sidecarDir 'main.go') -ErrorAction Stop
          Write-Host 'C75C_EXACT_ORIGINAL_DONOR_NATIVE_SIDECAR_STAGED=PASS'
          Write-Host 'C75B1_TEST_ONLY_STAGING=PASS'
      - name: Authenticated R25-C47 settings and candles to exact original native VWAP
        shell: pwsh
        working-directory: donor
        run: |
          $ErrorActionPreference='Stop'
          $log=Join-Path $env:RUNNER_TEMP 'r25-c75b-native.log'
          $prior=$env:GOFLAGS
          try{
            $env:GOFLAGS=''
            & go get github.com/mattn/go-sqlite3@v1.14.18 *> $log
          }finally{$env:GOFLAGS=$prior}
          if($LASTEXITCODE -ne 0){throw 'C75B1_DISPOSABLE_SQLITE_DEPENDENCY_BLOCKED'}
          & go test -mod=readonly -tags=ktrade_donor_shadow -count=1 -timeout=8m -v -run '^TestC75B' ./internal/shadowqual *> $log
          if($LASTEXITCODE -ne 0){
            Get-Content -LiteralPath $log | Where-Object {
              $_ -match '^# ktrade/' -or $_ -match '^--- FAIL: ' -or
              $_ -match '^.*\.go:[0-9]+(:[0-9]+)?: ' -or $_ -match '^FAIL[\s]'
            } | Select-Object -First 22 | ForEach-Object {Write-Host $_}
            throw 'C75B1_NATIVE_PAPER_TRIAL_FAIL_CLOSED'
          }
          $a=@(Select-String -LiteralPath $log -Pattern 'C75B_.*=PASS')
          if($a.Count -lt 2){throw 'C75B1_TEST_RECEIPT_MISSING'}
          $a | ForEach-Object {Write-Host $_.Line}
          Write-Host 'C75B1_NATIVE_SETTINGS_SIGNAL_TRADEGUARD_STOP_AND_RESTART=PASS'
      - name: Bind stopped read-only historical VWAP replay to immutable candle as-of
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $script=Join-Path $env:GITHUB_WORKSPACE 'candidate/tests/donor-native-vwap/c75c_replay_asof_patch.ps1'
          if(!(Test-Path -LiteralPath $script -PathType Leaf)){throw 'C75C_REPLAY_CLOCK_PATCH_SOURCE_MISSING'}
          & $script -DonorRoot (Join-Path $env:GITHUB_WORKSPACE 'donor')
          Write-Host 'C75C_NATIVE_DONOR_REPLAY_CLOCK_LIVE_GUARD_PRESERVED=PASS'
      - name: C75D2 genuine donor risk to atomic SQLite paper BUY SELL stop and recovery
        shell: pwsh
        working-directory: donor
        run: |
          $ErrorActionPreference='Stop'
          $log=Join-Path $env:RUNNER_TEMP 'c75d2-original-tradeguard-atomic-session.log'
          & go test -mod=readonly -tags=ktrade_donor_shadow -count=1 -timeout=8m -v -run '^TestC75D2' ./internal/shadowqual *> $log
          if($LASTEXITCODE -ne 0){
            Get-Content -LiteralPath $log | Where-Object {
              $_ -match '^# ktrade/' -or $_ -match '^--- FAIL:' -or
              $_ -match '.*_test.go:[0-9]+:' -or $_ -match '^FAIL'
            } | Select-Object -First 48 | ForEach-Object {Write-Host $_}
            throw 'C75D2_GENUINE_TRADEGUARD_SQLITE_SESSION_UNQUALIFIED'
          }
          foreach($marker in @(
            'C75D2_ORIGINAL_TRADEGUARD_ATOMIC_BUY_SELL_FEES_PNL_STOP_RESTART=PASS',
            'C75D2_CHANGED_ORDER_VETO_AND_DONOR_KILL=PASS',
            'C75D2_NO_OWNER_OR_BROKER_ACCESS=PASS',
            'C75D2_ORIGINAL_DONOR_RISK_VETO_NO_PARTIAL_SQLITE_LEDGER=PASS'
          )){
            $proof=@(Select-String -LiteralPath $log -SimpleMatch $marker)
            if($proof.Count -ne 1){throw ('C75D2_REQUIRED_RECEIPT_MISSING_'+$marker)}
            Write-Host $proof[0].Line
          }
          Write-Host 'C75D2_ORIGINAL_RISK_ATOMIC_SESSION_FOCUSED=PASS'
      - name: D3 real Windows process crash authentic paper risk and no automatic rearm
        shell: pwsh
        working-directory: donor
        run: |
          $ErrorActionPreference='Stop'
          $log=Join-Path $env:RUNNER_TEMP 'c75d3-native-process-recovery.log'
          & go test -mod=readonly -tags=ktrade_donor_shadow -count=1 -timeout=8m -v -run '^TestC75D3' ./internal/shadowqual *> $log
          if($LASTEXITCODE -ne 0){
            Get-Content -LiteralPath $log | Where-Object {
              $_ -match '^# ktrade/' -or $_ -match '^--- FAIL:' -or
              $_ -match '.*_test.go:[0-9]+:' -or $_ -match '^FAIL'
            } | Select-Object -First 60 | ForEach-Object {Write-Host $_}
            throw 'C75D3_AUTHENTIC_PROCESS_CRASH_UNQUALIFIED'
          }
          foreach($marker in @(
            'C75D3_UNCLEAN_WINDOWS_PROCESS_PAPER_FILL_RECOVERED_STOPPED=PASS',
            'C75D3_ORIGINAL_DONOR_FRESH_GUARD_REARM_DENIED=PASS',
            'C75D3_UNVERIFIED_CRASH_KILL_NOT_FABRICATED=PASS'
          )){
            $proof=@(Select-String -LiteralPath $log -SimpleMatch $marker)
            if($proof.Count -ne 1){throw ('C75D3_MISSING_PROCESS_RECEIPT_'+$marker)}
            Write-Host $proof[0].Line
          }
          Write-Host 'C75D3_WINDOWS_REAL_SUBPROCESS_RESTART=PASS'
      - name: Compile and invoke exact original native VWAP in separate stopped executable
        shell: pwsh
        working-directory: donor
        run: |
          $ErrorActionPreference='Stop'
          $exe=Join-Path $env:RUNNER_TEMP 'ktrade-native-vwap.exe'
          $fixture=Join-Path $env:RUNNER_TEMP 'c75c-source-synthetic.json'
          & go build -mod=readonly -tags=ktrade_donor_shadow -o $exe ./cmd/ktrade-native-vwap
          if($LASTEXITCODE -ne 0 -or !(Test-Path -LiteralPath $exe)){throw 'C75C_NATIVE_ORIGINAL_EXECUTABLE_BUILD_FAILED'}
          $env:C75C_TEST_NATIVE_EXE=$exe
          $env:C75C_TEST_NATIVE_FIXTURE=$fixture
          $log=Join-Path $env:RUNNER_TEMP 'c75c-original-exe-negative-positive.log'
          & go test -mod=readonly -tags=ktrade_donor_shadow -count=1 -timeout=6m -v -run '^TestC75COriginalNativeEvaluatorExecutable$' ./internal/shadowqual *> $log
          if($LASTEXITCODE -ne 0){
            Get-Content -LiteralPath $log | Where-Object {$_ -match 'FAIL|panic:|\.go:[0-9]+:|# ktrade/'} | Select-Object -First 70 | ForEach-Object {Write-Host $_}
            throw 'C75C_FROZEN_NATIVE_EXECUTABLE_FAILED'
          }
          $proof=@(Select-String -LiteralPath $log -SimpleMatch 'C75C_FROZEN_ORIGINAL_NATIVE_VWAP_EXE_SOURCE_AND_NEGATIVES=PASS')
          if($proof.Count -ne 1 -or !(Test-Path -LiteralPath $fixture)){throw 'C75C_NATIVE_DECISION_OR_SOURCE_FIXTURE_MISSING'}
          $stale=@(Select-String -LiteralPath $log -SimpleMatch 'C75C_STALE_HISTORICAL_REPLAY_SOURCE_NATIVE_PARITY=PASS')
          if($stale.Count -ne 1){throw 'C75C_STALE_HISTORICAL_REPLAY_PARITY_UNQUALIFIED'}
          Write-Host $stale[0].Line
          Add-Content -LiteralPath $env:GITHUB_ENV -Value ('C75C_TEST_NATIVE_EXE='+$exe)
          Add-Content -LiteralPath $env:GITHUB_ENV -Value ('C75C_TEST_NATIVE_FIXTURE='+$fixture)
          $hash=(Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          Add-Content -LiteralPath $env:GITHUB_ENV -Value ('C75C_NATIVE_SHA256='+$hash)
          Write-Host 'C75C_PINNED_ORIGINAL_NATIVE_VWAP_EXECUTABLE_AND_NEGATIVES=PASS'
      - name: Focused actual original-operator to paper-custody HTTP integration
        shell: pwsh
        working-directory: candidate
        run: |
          $ErrorActionPreference='Stop'
          $log=Join-Path $env:RUNNER_TEMP 'c75a-focused-functional.log'
          & go test -mod=readonly -tags=ktrade_full -count=1 -timeout=8m -v -run '^TestR25C75' ./cmd/ktrade *> $log
          $code=$LASTEXITCODE
          if($code -ne 0){
            Get-Content -LiteralPath $log | Where-Object {$_ -match '^# |\.go:[0-9]+:|FAIL|panic:'} | Select-Object -First 60 | ForEach-Object {Write-Host $_}
            Write-Host 'C75A_FOCUSED_FAILED_EVIDENCE_RETAINED_IN_RUN=TRUE'
            throw 'C75A_FUNCTIONAL_UI_AND_PAPER_REVIEW_NOT_QUALIFIED'
          }
          $passes=@(Select-String -LiteralPath $log -Pattern '^--- PASS: TestR25C75')
          $proof=@(Select-String -LiteralPath $log -SimpleMatch 'C75_ORIGINAL_OPERATOR_TO_REAL_STOPPED_PAPER_STATUS_ROUTE=PASS')
          if($passes.Count -ne 8 -or $proof.Count -ne 1){throw 'C75A_FOCUSED_PROOFS_INCOMPLETE'}
          $passes | ForEach-Object {Write-Host $_.Line}
          $proof | ForEach-Object {Write-Host $_.Line}
          $pack=@(Select-String -LiteralPath $log -SimpleMatch 'C75_ORIGINAL_OPERATOR_UI_ASSETS_PACKAGED_NEXT_TO_BACKEND=PASS')
          if($pack.Count -ne 1){throw 'C75A_WINDOWS_PACKAGING_RESOURCE_SCOPE_MISSING'}
          Write-Host $pack[0].Line
          $native=@(Select-String -LiteralPath $log -SimpleMatch 'C75C_SHIPPING_KTRADE_CALLS_PINNED_ORIGINAL_NATIVE_EXE_HISTORICAL_ONLY=PASS')
          $control=@(Select-String -LiteralPath $log -SimpleMatch 'C75C_ORIGINAL_CONTROLS_AND_BROKER_POST_FAIL_CLOSED=PASS')
          if($native.Count -ne 1 -or $control.Count -ne 1){throw 'C75C_REAL_APPLICATION_NATIVE_EVALUATION_NOT_PROVEN'}
          Write-Host $native[0].Line
          Write-Host $control[0].Line
          $typed=@(Select-String -LiteralPath $log -SimpleMatch 'C75D1_SHIPPING_NATIVE_VWAP_TO_TYPED_INERT_PAPER_PROPOSAL=PASS')
          if($typed.Count -ne 1){throw 'C75D1_SOURCE_BOUND_PAPER_PROPOSAL_NOT_PROVEN'}
          Write-Host $typed[0].Line
          $pack=@(Select-String -LiteralPath $log -SimpleMatch 'C75C_WINDOWS_PACKAGING_REQUIRES_PINNED_NATIVE_COMPANION=PASS')
          if($pack.Count -ne 1){throw 'C75C_WINDOWS_NATIVE_COMPANION_PACKAGING_CONTRACT_FAILED'}
          Write-Host $pack[0].Line
          Write-Host 'C75C_SHIPPING_APP_NATIVE_HISTORICAL_EVALUATION=PASS'
          foreach($marker in @(
            'C75D3_SHIPPING_OPERATOR_READS_REAL_STOPPED_SQLITE_ACCOUNTING=PASS',
            'C75D3_NO_START_STOP_SAVE_ORDER_OR_BROKER_AUTHORITY=PASS',
            'C75D3_SOURCELESS_OR_UNQUALIFIED_ACCOUNT_FAIL_CLOSED=PASS'
          )){
            $proof=@(Select-String -LiteralPath $log -SimpleMatch $marker)
            if($proof.Count -ne 1){throw ('C75D3_SHIPPING_OPERATOR_PROOF_MISSING_'+$marker)}
            Write-Host $proof[0].Line
          }
          Write-Host 'C75A_OPERATOR_ORIGINAL_UI_TO_PAPER_STATUS_ROUTE=PASS'
      - name: Real Windows browser renders original operator with stopped SQLite balances
        shell: pwsh
        working-directory: candidate
        env:
          KTRADE_C75D3_REAL_BROWSER_ACCEPT: '1'
        run: |
          $ErrorActionPreference='Stop'
          if($env:KTRADE_CI_PAPER_ONLY -cne '1' -or
             $env:KTRADE_CI_COINBASE_ALLOWED -cne '0'){
            throw 'C75D3_BROWSER_AUTHORITY_DRIFT'
          }
          $log=Join-Path $env:RUNNER_TEMP 'c75d3-real-browser-original-operator.log'
          & go test -mod=readonly -tags=ktrade_full -count=1 -timeout=3m -v -run '^TestR25C75D3OriginalOperatorHeadlessBrowserStoppedPaperAcceptance
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: spoonman136668-ai/ktrade
          ref: d892d5902f6c19105c4395bf6b71bfb112b22a62
          fetch-depth: 0
          path: original
          persist-credentials: false
          token: ${{ secrets.KTRADE_SOURCE_READ_TOKEN }}
      - name: Checkout exact pre-repair mixed Phase9 source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: spoonman136668-ai/ktrade
          ref: 2af730f8a7bed15370d86d2ce0ced060c56beed2
          fetch-depth: 0
          path: mixed-parent
          persist-credentials: false
          token: ${{ secrets.KTRADE_SOURCE_READ_TOKEN }}
      - name: Check two independent immutable source trees and test identity
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($x in @(
            @{Name='original';Sha=$env:ORIGINAL_SHA;Tree=$env:ORIGINAL_TREE},
            @{Name='mixed-parent';Sha=$env:MIXED_PARENT_SHA;Tree=$env:MIXED_PARENT_TREE},
            @{Name='candidate';Sha=$env:VERIFIED_SHA;Tree=$env:VERIFIED_TREE}
          )){
            $p=Join-Path $env:GITHUB_WORKSPACE $x.Name
            if((& git -C $p rev-parse HEAD).Trim() -cne $x.Sha -or
               (& git -C $p rev-parse 'HEAD^{tree}').Trim() -cne $x.Tree -or
               @(& git -C $p status --porcelain=v1 --untracked-files=all).Count -ne 0){
              throw ('C74F5_ORIGINAL_GOVERNANCE_SOURCE_DRIFT_'+$x.Name)
            }
          }
          $p=Join-Path $env:GITHUB_WORKSPACE 'candidate'
          if((& git -C $p rev-parse 'HEAD:pkg/r25c12_governance_wire_compat_test.go').Trim() -cne $env:C12_TEST_BLOB){
            throw 'C74F5_C12_INDEPENDENT_TEST_IDENTITY_DRIFT'
          }
          $old=Join-Path $env:GITHUB_WORKSPACE 'original/pkg/r25c12_governance_wire_compat_test.go'
          if(Test-Path -LiteralPath $old){throw 'C74F5_TEST_ALREADY_PRESENT_IN_ORIGINAL'}
