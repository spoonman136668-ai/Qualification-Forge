          $ErrorActionPreference='Stop'
          $log=Join-Path $env:RUNNER_TEMP 'r25-c75a-full-windows.log'
          & go test -mod=readonly -tags=ktrade_full -count=1 -timeout=15m ./... *> $log
          $code=$LASTEXITCODE
          if($code -ne 0){
            Get-Content -LiteralPath $log | Where-Object {$_ -match 'FAIL|Error:|panic:|\.go:[0-9]+:|# ktrade/' } |
              Select-Object -First 80 | ForEach-Object {Write-Host $_}
            Write-Host 'C75A_FULL_WINDOWS_NEGATIVE_EVIDENCE_RETAINED_IN_RUN=TRUE'
            throw 'C75A_FULL_WINDOWS_REGRESSION_FAILED'
          }
          Write-Host 'C75A_ONE_COMPLETE_WINDOWS_GO_REGRESSION=PASS'
      - name: Go vet entire fully tagged candidate
        shell: pwsh
        working-directory: candidate
        run: |
          $ErrorActionPreference='Stop'
          & go vet -mod=readonly -tags=ktrade_full ./...
          if($LASTEXITCODE -ne 0){throw 'C75A_FULL_WINDOWS_VET_FAILED'}
          Write-Host 'C75A_WINDOWS_VET=PASS'
      - name: Build stopped paper-only Windows executable
        shell: pwsh
        working-directory: candidate
        run: |
          $ErrorActionPreference='Stop'
          $exe=Join-Path $env:RUNNER_TEMP 'c75c-shipping-readonly-NEVER-LAUNCHED.exe'
          $native=$env:C75C_TEST_NATIVE_EXE
          $digest=$env:C75C_NATIVE_SHA256
          if(!(Test-Path -LiteralPath $native) -or $digest -notmatch '^[0-9a-f]{64}$'){
            throw 'C75C_ORIGINAL_EVALUATOR_BINARY_NOT_QUALIFIED_FOR_PACKAGE'
          }
          $actual=(Get-FileHash -LiteralPath $native -Algorithm SHA256).Hash.ToLowerInvariant()
          if($actual -cne $digest){throw 'C75C_EVALUATOR_DIGEST_CHANGED_AFTER_FOCUSED_QUALIFICATION'}
          & go build -mod=readonly -tags=ktrade_full -ldflags "-X main.c75cEvaluatorPinnedSHA256=$digest" -o $exe ./cmd/ktrade
          if($LASTEXITCODE -ne 0 -or !(Test-Path -LiteralPath $exe)){
            throw 'C75C_PINNED_WINDOWS_BACKEND_BUILD_FAILED'
          }
          $companion=Join-Path (Get-Location) 'ktrade-native-vwap.exe'
          if(Test-Path -LiteralPath $companion){throw 'C75C_EXISTING_COMPANION_MUST_NOT_BE_OVERWRITTEN'}
          try{
            Copy-Item -LiteralPath $native -Destination $companion -ErrorAction Stop
            if((Get-FileHash -LiteralPath $companion -Algorithm SHA256).Hash.ToLowerInvariant() -cne $digest){
              throw 'C75C_PACKAGING_STAGED_EXECUTABLE_DIGEST_MISMATCH'
            }
            Write-Host 'C75C_SHIPPING_WINDOWS_BACKEND_PINNED_TO_EXACT_ORIGINAL_NATIVE_COMPANION=PASS'
          }finally{
            if(Test-Path -LiteralPath $companion){Remove-Item -LiteralPath $companion -Force}
          }
          Write-Host 'C75C_WINDOWS_BACKEND_BUILD_ONLY_NO_RUN_OR_INSTALL=PASS'
      - name: Assert no tracked source mutation or release authority
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if((& git -C candidate rev-parse HEAD).Trim() -cne $env:VERIFIED_SHA -or
             @(& git -C candidate diff --name-only HEAD --).Count -ne 0){
            throw 'C75A_KTRADE_TRACKED_MUTATION'
          }
          Write-Host 'C75A_CKB_PLANE_CONTROLLER_USED=FALSE'
          Write-Host 'C75A_OWNER_PROFILE_READ=FALSE'
          Write-Host 'C75A_TRADING_OR_MERGE_AUTHORITY=FALSE'