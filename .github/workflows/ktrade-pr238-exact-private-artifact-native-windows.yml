name: KTRADE PR238 exact private engineering artifact native qualification
on:
  push:
    branches: [qualification/ktrade-original-pine-label-response-affinity-20261031]
    paths: [.github/workflows/ktrade-pr238-exact-private-artifact-native-windows.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: ktrade-pr238-exact-private-artifact-native-20261031
  cancel-in-progress: false
jobs:
  exact-private-native:
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      GOWORK: 'off'
      GOFLAGS: '-p=2'
      GOMAXPROCS: '2'
      CGO_ENABLED: '1'
      GOTOOLCHAIN: 'local'
      KTRADE_LIVE_TRADING: 'false'
      KTRADE_USE_LEGACY_CDP_CONFIG: '0'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: witness
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: spoonman136668-ai/ktrade
          ref: b03dd6e58b6120cae3ffd39a79c6965ab8e91b9a
          path: previous
          persist-credentials: false
          token: ${{ secrets.KTRADE_SOURCE_READ_TOKEN }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: spoonman136668-ai/ktrade
          ref: fcb9bd0066d2aef1c4aef33f95819c5aea368015
          path: product
          persist-credentials: false
          token: ${{ secrets.KTRADE_SOURCE_READ_TOKEN }}
      - name: Read qualified PR236 installer as immutable asset comparison data only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: spoonman136668-ai/ktrade
          ref: 558ab74ffa41338b01543baa0fb0a99471eb68e0
          path: previous-private-installer
          persist-credentials: false
          token: ${{ secrets.KTRADE_SOURCE_READ_TOKEN }}
      - name: Read unchanged installer from exact isolated private artifact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: spoonman136668-ai/ktrade
          ref: cc70d10645fcf66619a813a3447c5dbcae9a4026
          path: private-artifact
          fetch-depth: 2
          persist-credentials: false
          token: ${{ secrets.KTRADE_SOURCE_READ_TOKEN }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /qualification-artifacts/pr238-13064583564/
      - name: Verify original installer hash and isolated data custody without rebuild
        id: artifact
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/Qualification-Forge' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows'){throw 'EXISTING_HOSTED_QUALIFICATION_REQUIRED'}
          $data=Join-Path $env:GITHUB_WORKSPACE 'private-artifact'
          if((& git -C $data rev-parse HEAD).Trim() -cne 'cc70d10645fcf66619a813a3447c5dbcae9a4026' -or (& git -C $data rev-parse HEAD^).Trim() -cne 'fcb9bd0066d2aef1c4aef33f95819c5aea368015' -or @(& git -C $data status --porcelain).Count -ne 0){throw 'PRIVATE_ARTIFACT_DATA_COMMIT_OR_PARENT_DRIFT'}
          $actual=@(& git -C $data diff --name-only HEAD^ HEAD|Sort-Object)
          $allowed=@('qualification-artifacts/pr238-13064583564/.gitattributes','qualification-artifacts/pr238-13064583564/artifact-identity.json','qualification-artifacts/pr238-13064583564/installer.zip')|Sort-Object
          if(($actual -join '|') -cne ($allowed -join '|')){throw 'PRIVATE_ARTIFACT_ONLY_THREE_DATA_PATHS_REQUIRED'}
          $folder=Join-Path $data 'qualification-artifacts/pr238-13064583564'
          if((& git -C $data rev-parse 'HEAD:qualification-artifacts/pr238-13064583564/artifact-identity.json').Trim() -cne '6af70077c587aae7badb876830ed66e41277fcac'){throw 'PRIVATE_ARTIFACT_IDENTITY_BLOB_DRIFT'}
          $id=Get-Content (Join-Path $folder 'artifact-identity.json') -Raw|ConvertFrom-Json
          if($id.schema -cne 'ktrade.private.qualification-artifact-transport.v1' -or $id.source_sha -cne 'fcb9bd0066d2aef1c4aef33f95819c5aea368015' -or $id.source_tree -cne '84b3318a15488ec943dbb39c60ab4a37f0624e1e' -or $id.original_private_run -ne 41260122170 -or $id.original_private_artifact -ne 13064583564 -or $id.original_private_witness -cne 'c3514be3abe1ca258eb0a0a9268d80dbc17829af' -or $id.producer_transport_witness -cne '44304867102e7b2cf90674f3c59041dec68da27a' -or $id.original_outer_sha256 -cne 'ee096094e29b47901cafb51c783365794e01d05ad6a914a914d3dab455c4c0b1' -or $id.installer_sha256 -cne 'a34be54981d1029e58cf7bea938d5b61f595607298ee5010a4754d004751db4c' -or $id.build_repeated -cne $false -or $id.app_executed -cne $false -or $id.owner_data_accessed -cne $false -or $id.live_armed -cne $false -or $id.release_authority -cne 'none'){throw 'ORIGINAL_PRIVATE_ARTIFACT_IDENTITY_OR_AUTHORITY_DRIFT'}
          $inner=Join-Path $folder 'installer.zip'
          if((Get-FileHash $inner -Algorithm SHA256).Hash.ToLowerInvariant() -cne 'a34be54981d1029e58cf7bea938d5b61f595607298ee5010a4754d004751db4c'){throw 'PRIVATE_ACTUAL_INSTALLER_HASH_DRIFT'}
          $delivery=Join-Path $env:RUNNER_TEMP ('pr238-private-exact-'+[guid]::NewGuid().ToString('N'))
          $null=New-Item -ItemType Directory $delivery
          Copy-Item -LiteralPath $inner -Destination (Join-Path $delivery 'KTRADE-SetupBundle.zip')
          if((Get-FileHash (Join-Path $delivery 'KTRADE-SetupBundle.zip') -Algorithm SHA256).Hash.ToLowerInvariant() -cne $id.installer_sha256){throw 'ORIGINAL_PRIVATE_INSTALLER_COPY_CHANGED'}
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT,('bundle_root='+$delivery+[Environment]::NewLine),[Text.UTF8Encoding]::new($false))
          Write-Host '::notice::EXACT_PRIVATE_INSTALLER_EXISTING_CONTENTS_SCOPE_IDENTICAL_BYTES_NO_REBUILD_NO_PUBLIC_UPLOAD=PASS'
      - name: Independent exact private installer CRC pair proofs and all source assets without app execution
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $w=Join-Path $env:GITHUB_WORKSPACE 'witness'
          if((& git -C $w rev-parse 'HEAD:qualification-harness/ktrade-label-response-affinity/Verify-Private-Installer.py').Trim() -cne '88c5dc646a99d8a3b4491130877d15b0395e641b'){throw 'PINNED_INDEPENDENT_PACKAGE_VERIFIER_REQUIRED'}
          $source=Join-Path $env:GITHUB_WORKSPACE 'product'
          if((& git -C $source rev-parse HEAD).Trim() -cne 'fcb9bd0066d2aef1c4aef33f95819c5aea368015' -or (& git -C $source rev-parse 'HEAD^{tree}').Trim() -cne '84b3318a15488ec943dbb39c60ab4a37f0624e1e'){throw 'VERIFIER_EXACT_SOURCE_REQUIRED'}
          $old=Join-Path $env:GITHUB_WORKSPACE 'previous-private-installer'
          if((& git -C $old rev-parse HEAD).Trim() -cne '558ab74ffa41338b01543baa0fb0a99471eb68e0'){throw 'QUALIFIED_PR236_COMPARISON_ARTIFACT_REQUIRED'}
          $current=Join-Path $env:GITHUB_WORKSPACE 'private-artifact/qualification-artifacts/pr238-13064583564/installer.zip'
          $previous=Join-Path $old 'qualification-artifacts/pr236-13063006422/installer.zip'
          & python (Join-Path $w 'qualification-harness/ktrade-label-response-affinity/Verify-Private-Installer.py') --installer $current --expected-hash 'a34be54981d1029e58cf7bea938d5b61f595607298ee5010a4754d004751db4c' --source 'fcb9bd0066d2aef1c4aef33f95819c5aea368015' --source-tree '84b3318a15488ec943dbb39c60ab4a37f0624e1e' --checkout $source --previous-installer $previous
          if($LASTEXITCODE -ne 0){throw 'INDEPENDENT_PRIVATE_INSTALLER_VERIFICATION_FAILED'}
      - name: Exact source full source-owned CI and parent native acceptance
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $src=Join-Path $env:GITHUB_WORKSPACE 'product'
          if((& git -C $src rev-parse HEAD).Trim() -cne 'fcb9bd0066d2aef1c4aef33f95819c5aea368015' -or (& git -C $src rev-parse 'HEAD^{tree}').Trim() -cne '84b3318a15488ec943dbb39c60ab4a37f0624e1e' -or @(& git -C $src status --porcelain).Count -ne 0 -or (Test-Path (Join-Path $src '.env'))){throw 'EXACT_CLEAN_SOURCE_REQUIRED'}
          if((Get-Content (Join-Path $src 'pkg/advanced_orders.go') -Raw) -notmatch 'func liveBrokerageAuthorized\(\) bool \{ return false \}'){throw 'LIVE_AUTHORITY_DRIFT'}
          $run=Invoke-RestMethod -Uri 'https://api.github.com/repos/spoonman136668-ai/Qualification-Forge/actions/runs/41259386111' -Headers @{Authorization=('Bearer '+$env:GITHUB_TOKEN);Accept='application/vnd.github+json'} -TimeoutSec 30
          if($run.status -cne 'completed' -or $run.conclusion -cne 'success' -or $run.head_sha -cne '980b42cd44ae3181a081ab83912495e6624eda02'){throw 'EXACT_FULL_SOURCE_QUALIFICATION_REQUIRED'}
          $parent=Invoke-RestMethod -Uri 'https://api.github.com/repos/spoonman136668-ai/Qualification-Forge/actions/runs/41257723807' -Headers @{Authorization=('Bearer '+$env:GITHUB_TOKEN);Accept='application/vnd.github+json'} -TimeoutSec 30
          if($parent.status -cne 'completed' -or $parent.conclusion -cne 'success' -or $parent.head_sha -cne 'c10f5028773e724eb64b12c38d1d9ef1fc7a70f3'){throw 'EXACT_QUALIFIED_PR237_NATIVE_PARENT_REQUIRED'}
          $w=Join-Path $env:GITHUB_WORKSPACE 'witness'
          if((& git -C $w rev-parse 'HEAD:qualification-receipts/ktrade-pr238-complete-chart-full-source-windows-20261031.json').Trim() -cne 'c124ce8c9dfab0ab04df75fb9b8535e256feb7a3'){throw 'EXACT_CURRENT_FULL_REGRESSION_RECEIPT_REQUIRED'}
          if((& git -C $src rev-parse 'HEAD:templates/chart.tmpl').Trim() -cne 'f73fae79e1bc9942e7877ac0a554ed873cb6a413'){throw 'COMPLETE_CHART_BLOB_REQUIRED'}
          $pins=@(
            @('qualification-harness/ktrade-label-response-affinity/Installed-Label-Lifecycle.ps1','e6832167e8fa0e22a8d21ab6bffe67b2ad685f55'),
            @('qualification-harness/ktrade-label-response-affinity/Build-And-Qualify.ps1','b87f624d26f171ce57b2b45acfe4e67075bf3828'),
            @('qualification-harness/ktrade-w83/Original-W40-Paper.ps1','c69c3c05ff7f4ef933856b036bfa23fbf0a760f1')
          )
          foreach($pin in $pins){
            if((& git -C (Join-Path $env:GITHUB_WORKSPACE 'witness') rev-parse ('HEAD:'+$pin[0])).Trim() -cne $pin[1]){throw 'EXACT_ORIGINAL_NATIVE_FINANCIAL_HARNESS_REQUIRED'}
          }
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Original exact private package real installed native lifecycle
        shell: pwsh
        env:
          CANDIDATE_BUNDLE_ROOT: ${{ steps.artifact.outputs.bundle_root }}
        run: |
          $ErrorActionPreference='Stop'
          $env:TEMP=$env:RUNNER_TEMP;$env:TMP=$env:RUNNER_TEMP
          $h=Join-Path $env:GITHUB_WORKSPACE 'witness/qualification-harness/ktrade-w83'
          $probeLog=Join-Path $env:RUNNER_TEMP 'pr238-exact-private-native-output.txt'
          & (Join-Path $env:GITHUB_WORKSPACE 'witness/qualification-harness/ktrade-label-response-affinity/Build-And-Qualify.ps1') -PreviousCheckout (Join-Path $env:GITHUB_WORKSPACE 'previous') -CandidateCheckout (Join-Path $env:GITHUB_WORKSPACE 'product') -WitnessScript (Join-Path $env:GITHUB_WORKSPACE 'witness/qualification-harness/ktrade-label-response-affinity/Installed-Label-Lifecycle.ps1') -NativeInputsPath (Join-Path $h 'Original-W40-Native-Inputs.ps1') -PaperScenarioPath (Join-Path $h 'Original-W40-Paper.ps1') -CandidateQualifiedBundleRoot $env:CANDIDATE_BUNDLE_ROOT -ExpectedCandidateArchiveSha256 'a34be54981d1029e58cf7bea938d5b61f595607298ee5010a4754d004751db4c' 2>&1 | Tee-Object -FilePath $probeLog
          if($LASTEXITCODE -ne 0 -or !$?){throw 'EXACT_PRIVATE_ARCHIVE_NATIVE_ACCEPTANCE_FAILED'}
          # Actual execution coverage is mandatory. Defined-but-uncalled probes
          # must never turn a green lifecycle run into visual/memory acceptance.
          $observed=@(Get-Content -LiteralPath $probeLog)
          function ProbeJson([string]$prefix,[int]$count){
            $rows=@($observed|Where-Object {$_ -is [string] -and $_.StartsWith($prefix,[StringComparison]::Ordinal)})
            if($rows.Count -ne $count){throw ('W94B_REQUIRED_ACTUAL_PROBE_OUTPUT_MISSING_'+$prefix)}
            return @($rows|ForEach-Object {$_.Substring($prefix.Length)|ConvertFrom-Json -ErrorAction Stop})
          }
          $ready=@(ProbeJson 'W83_NATIVE_READY_MEASUREMENT=' 3)
          $functional=@(ProbeJson 'W83_NATIVE_FUNCTIONAL_PROBES_MEASUREMENT=' 3)
          foreach($phase in @('PREVIOUS','UPDATED','ROLLED_BACK')){
            $r=@($ready|Where-Object {$_.phase -ceq $phase})
            $f=@($functional|Where-Object {$_.phase -ceq $phase})
            if($r.Count -ne 1 -or $f.Count -ne 1 -or $r[0].elapsed_ms -le 0 -or $r[0].elapsed_ms -gt 120000 -or $r[0].startup_budget_ms -ne 120000 -or $r[0].shell_engine_resident_bytes -le 0 -or $r[0].shell_engine_resident_bytes -gt 1073741824 -or $r[0].resident_budget_bytes -ne 1073741824 -or $f[0].elapsed_ms -lt 0){throw 'ALL_THREE_REAL_STARTUP_AND_FULL_FUNCTIONAL_TIMINGS_REQUIRED'}
          }
          $screens=@(ProbeJson 'W94B_PRICE_CHART_SCREEN_DIGEST=' 2)
          if(@($screens|Where-Object {$_.phase -ceq 'BEFORE_SUPERTREND'}).Count -ne 1 -or @($screens|Where-Object {$_.phase -ceq 'AFTER_SUPERTREND'}).Count -ne 1){throw 'W94B_BOTH_REAL_SCREEN_PHASES_REQUIRED'}
          $comparison=@(ProbeJson 'W94B_REAL_PRICE_PANE_COMPARISON=' 1)[0]
          if(!$comparison.identical_bounds -or $comparison.pixel_sample_count -lt 500 -or $comparison.changed_sample_count -lt 15 -or $comparison.before_sha256 -ceq $comparison.after_sha256){throw 'W94B_ACTUAL_PANE_PIXEL_DELTA_REQUIRED'}
          foreach($prefix in @('W94B_PROCESS_TREE_BEFORE=','W94B_PROCESS_TREE_AFTER=')){
            $p=@(ProbeJson $prefix 1)[0]
            if($p.webview2_count -lt 1 -or $p.process_count -ne @($p.members).Count -or $p.total_working_set_bytes -le 0){throw 'W94B_COMPLETE_REAL_PROCESS_MEASUREMENT_REQUIRED'}
            $sum=[long]0;foreach($member in $p.members){$sum+=[long]$member.working_set_bytes}
            if($sum -ne [long]$p.total_working_set_bytes){throw 'W94B_PROCESS_TOTAL_MISMATCH'}
          }
          if(@($observed|Where-Object {$_ -ceq '::notice::W94B_ACTIVE_PIXEL_AND_WEBVIEW_PROCESS_PROBES_EXECUTED=PASS'}).Count -ne 1){throw 'W94B_ACTUAL_PROBE_COMPLETION_REQUIRED'}
          Write-Host '::notice::W94B_ACTUAL_OUTPUT_COVERAGE_ENFORCED_PANE_DIFFERENCE_AND_ALL_OBSERVED_DESCENDANT_MEMORY=PASS'
          $lines=@(Get-Content $probeLog)
          foreach($marker in @('::notice::RSI_REAL_INSTALLED_WEBVIEW2_CONFIRMED_DIVERGENCE_PHYSICAL_APPLY_RSI_PANE_NO_TRADING=PASS','::notice::W94B_ACTIVE_PIXEL_AND_WEBVIEW_PROCESS_PROBES_EXECUTED=PASS','::notice::W83_PREVIOUS_TO_CANDIDATE_REAL_INSTALLED_UPDATE_ROLLBACK=PASS','::notice::W83_NO_OWNER_DATA_NO_LIVE_NO_RELEASE=PASS')){
            if(@($lines|Where-Object{$_ -ceq $marker}).Count -ne 1){throw 'EXACT_PRIVATE_ARTIFACT_ACTUAL_NATIVE_OUTPUT_MISSING'}
          }
          foreach($required in @('::notice::PINE_SETTINGS_NATIVE_PHYSICAL_NUMERIC_APPLY_SAVE_VALIDATION_AND_SOURCE_CUSTODY=PASS','::notice::PINE_SETTINGS_NATIVE_COLD_REOPEN_RESTORE_AND_EXPLICIT_DEFAULT_RESET=PASS')){
            if(@($observed|Where-Object {$_ -ceq $required}).Count -ne 1){throw 'SETTINGS_ACTUAL_NATIVE_PROBE_COMPLETION_REQUIRED'}
          }
          $settings=@(ProbeJson 'PINE_SETTINGS_ACTUAL_NATIVE_COLD_RESTORE_RESET=' 2)
          if(@($settings|Where-Object {$_.name -ceq 'Supertrend' -and $_.restored_values.input_0 -eq 3 -and $_.restored_values.input_1 -eq 2.5 -and $_.explicit_reset_verified -eq $true -and $_.disk_and_original_go_verified -eq $true}).Count -ne 1 -or @($settings|Where-Object {$_.name -ceq 'RSI Divergence' -and $_.restored_values.input_0 -eq 3 -and $_.explicit_reset_verified -eq $true -and $_.disk_and_original_go_verified -eq $true}).Count -ne 1){throw 'BOTH_REAL_SETTINGS_VALUES_AND_COLD_RESET_OUTPUTS_REQUIRED'}
          if(@($observed|Where-Object {$_ -ceq '::notice::PINE_MARKER_NATIVE_ORIGINAL_V5_V6_HTTP_AND_PHYSICAL_BOTH_ARROW_COLOR_OBSERVATION=PASS'}).Count -ne 1){throw 'EXACT_PRIVATE_ACTUAL_MARKER_PROBE_MUST_EXECUTE'}
          $markers=@(ProbeJson 'PINE_MARKER_ACTUAL_NATIVE_COLOR_AND_ORIGINAL_HTTP=' 2)
          foreach($version in @(5,6)){
            $match=@($markers|Where-Object {$_.version -eq $version})
            if($match.Count -ne 1){throw 'EXACT_PRIVATE_BOTH_NATIVE_PINE_VERSIONS_REQUIRED'}
            $m=$match[0]
            if(!$m.identical_bounds -or !$m.physical_editor_compile_and_apply -or $m.baseline_up_pixels -gt 2 -or $m.baseline_down_pixels -gt 2 -or $m.marked_up_pixels -lt 40 -or $m.marked_down_pixels -lt 40 -or $m.baseline_http.shapes -ne 0 -or $m.marked_http.up -lt 1 -or $m.marked_http.down -lt 1 -or !$m.marked_http.actual_response_bar_price_and_style_checked){throw 'EXACT_PRIVATE_ACTUAL_MARKER_HTTP_AND_COLOR_OBSERVATIONS_REQUIRED'}
          }
          if(@($observed|Where-Object {$_ -ceq '::notice::PINE_HLINE_NATIVE_ORIGINAL_V5_V6_RSI_THREE_LEVELS_PHYSICAL_GUIDE_ROWS_AND_REMOVAL=PASS'}).Count -ne 1){throw 'EXACT_PRIVATE_GUIDE_PROBE_MUST_EXECUTE'}
          $guides=@(ProbeJson 'PINE_HLINE_ACTUAL_NATIVE_RSI_GUIDE_ROWS=' 2)
          foreach($version in @(5,6)){
            $match=@($guides|Where-Object {$_.version -eq $version})
            if($match.Count -ne 1){throw 'EXACT_PRIVATE_BOTH_GUIDE_VERSIONS_REQUIRED'}
            $g=$match[0];$levels=@($g.actual_original_go_levels)
            if($levels.Count -ne 3 -or $levels[0] -ne 70 -or $levels[1] -ne 30 -or $levels[2] -ne 50 -or !$g.identical_bounds -or !$g.physical_editor_compile_apply_and_remove -or @($g.baseline_rows).Count -ne 0 -or @($g.applied_rows).Count -ne 3 -or @($g.removed_rows).Count -ne 0){throw 'EXACT_PRIVATE_RSI_GUIDE_ROWS_AND_REMOVAL_REQUIRED'}
          }
          if(@($observed|Where-Object {$_ -ceq '::notice::PINE_GUIDE_ONLY_NATIVE_ORIGINAL_V5_V6_ZERO_PLOTS_THREE_LEVELS_AND_ACTUAL_PANE_CAPTION=PASS'}).Count -ne 1){throw 'EXACT_PRIVATE_GUIDE_ONLY_PROBE_REQUIRED'}
          $guideOnly=@(ProbeJson 'PINE_GUIDE_ONLY_NATIVE_ACTUAL=' 2)
          foreach($version in @(5,6)){
            $g=@($guideOnly|Where-Object {$_.version -eq $version})
            if($g.Count -ne 1 -or $g[0].actual_pane_caption -cne 'Pine: Overbought, Oversold, Middle' -or $g[0].original_go_plot_count -ne 0 -or $g[0].original_go_model_plot_count -ne 0 -or @($g[0].actual_guide_rows).Count -ne 3 -or (@($g[0].original_go_levels) -join '|') -cne '70|30|50' -or !$g[0].physical_editor_compile_and_apply){throw 'EXACT_PRIVATE_GUIDE_ONLY_NATIVE_OUTPUT_REQUIRED'}
          }
          if(@($observed|Where-Object {$_ -ceq '::notice::PINE_LABEL_NATIVE_ORIGINAL_V5_V6_HTTP_AND_PHYSICAL_CYAN_OBSERVATION=PASS'}).Count -ne 1){throw 'EXACT_PRIVATE_LABEL_PROBE_REQUIRED'}
          $labels=@(ProbeJson 'PINE_LABEL_ACTUAL_NATIVE_COLOR_AND_ORIGINAL_HTTP=' 2)
          foreach($version in @(5,6)){
            $m=@($labels|Where-Object {$_.version -eq $version})
            if($m.Count -ne 1 -or !$m[0].identical_bounds -or !$m[0].physical_editor_compile_and_apply -or $m[0].baseline_cyan_pixels -gt 2 -or $m[0].applied_cyan_pixels -lt 40 -or $m[0].baseline_sha256 -ceq $m[0].applied_sha256){throw 'EXACT_PRIVATE_LABEL_NATIVE_OUTPUT_REQUIRED'}
          }
          Write-Host '::notice::EXACT_PRIVATE_PR238_LABEL_GUIDE_CAPTION_AND_PRIOR_NATIVE_PAPER_STOP_COLD_ROLLBACK=PASS'
