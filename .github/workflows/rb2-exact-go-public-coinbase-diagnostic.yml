name: RB2 exact native Go Coinbase public source one-shot diagnosis
on:
  push:
    branches: [qualification/rb2-ci01-cold-recovery-windows-20261023]
    paths: [.github/workflows/rb2-exact-go-public-coinbase-diagnostic.yml]
permissions:
  contents: read
concurrency:
  group: rb2-exact-go-market-diagnostic
  cancel-in-progress: false
jobs:
  source-one-shot:
    if: github.repository == 'spoonman136668-ai/Qualification-Forge'
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      SOURCE_SHA: 'f6b4ce0ceab6573b11a2615dae1b7834e747225d'
      GOWORK: 'off'
      CGO_ENABLED: '1'
      GOFLAGS: '-p=2'
      GOMAXPROCS: '2'
      KTRADE_CI_PAPER_ONLY: '1'
      KTRADE_CI_COINBASE_ALLOWED: '0'
      KTRADE_CI_LIVE_AUTHORITY: '0'
      KTRADE_CI_PROMOTION_ALLOWED: '0'
    steps:
      - name: Independent Windows public-data-only source qualification
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/Qualification-Forge' -or
              $env:RUNNER_OS -cne 'Windows' -or
              $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or
              $env:KTRADE_CI_COINBASE_ALLOWED -cne '0' -or
              $env:KTRADE_CI_LIVE_AUTHORITY -cne '0' -or
              $env:KTRADE_CI_PROMOTION_ALLOWED -cne '0') {
            throw 'RB2_PUBLIC_NATIVE_SOURCE_DIAGNOSTIC_CONTEXT_INVALID'
          }
          Write-Host 'RB2_PUBLIC_GO_ONE_SHOT_NO_ORDER_AUTHORITY=PASS'
      - name: Checkout exact immutable KTRADE source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: spoonman136668-ai/ktrade
          ref: f6b4ce0ceab6573b11a2615dae1b7834e747225d
          path: candidate
          persist-credentials: false
          token: ${{ secrets.KTRADE_SOURCE_READ_TOKEN }}
      - name: Confirm source and clean package before temporary probe
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ((& git -C candidate rev-parse HEAD).Trim() -cne $env:SOURCE_SHA -or
              @(& git -C candidate status --porcelain=v1 --untracked-files=all).Count -ne 0) {
            throw 'RB2_PUBLIC_NATIVE_SOURCE_IDENTITY_DRIFT'
          }
          Write-Host ('RB2_PUBLIC_GO_SOURCE_SHA='+$env:SOURCE_SHA)
      - name: Set up identical Windows Go runtime
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.24.9'
          cache: false
      - name: Execute unchanged Coinbase fetch in an isolated temporary focused test
        shell: pwsh
        working-directory: candidate
        run: |
          $ErrorActionPreference='Stop'
          $test='cmd/ktrade/rb2_one_shot_public_coinbase_diagnostic_full_test.go'
          if (Test-Path -LiteralPath $test) { throw 'RB2_PUBLIC_DIAG_TEST_COLLISION' }
          $source=@'
          //go:build ktrade_full

          package main
          import (
            "encoding/json"
            "fmt"
            "io"
            "net/http"
            "testing"
            "time"
          )
          func TestRB2OneShotGenuineGoCoinbaseSource(t *testing.T) {
            // Forensic observation, NOT an admission gate: do not infer
            // freshness merely from successful HTTP or 300 validated rows.
            for _,product:=range []string{"BTC-USDC","ETH-USDC"} {
              localStart:=time.Now().UTC()
              url:=fmt.Sprintf("https://api.exchange.coinbase.com/products/%s/candles?granularity=60",product)
              req,err:=http.NewRequest(http.MethodGet,url,nil)
              if err!=nil{t.Fatal(err)}
              req.Header.Set("Accept","application/json")
              req.Header.Set("User-Agent","KTRADE-ReadOnly-Market-Qualification/1.0")
              resp,err:=(&http.Client{Timeout:8*time.Second}).Do(req)
              if err!=nil {
                t.Logf("RB2_FRESHNESS_%s_TRANSPORT=ERROR_%v",product,err)
                continue
              }
              var raw [][]float64
              parseErr:=json.NewDecoder(io.LimitReader(resp.Body,256<<10)).Decode(&raw)
              resp.Body.Close()
              observed:=time.Now().UTC()
              providerDate,headerErr:=http.ParseTime(resp.Header.Get("Date"))
              dateSkew:="UNAVAILABLE"
              if headerErr==nil{dateSkew=fmt.Sprintf("%.1f",observed.Sub(providerDate).Seconds())}
              t.Logf("RB2_FRESHNESS_%s_CLOCK=%s_HTTP_%d_ROWS_%d_RTT_SECONDS_%.3f_PROVIDER_DATE_OFFSET_SECONDS_%s_PARSE_%v",product,
                observed.Format(time.RFC3339Nano),resp.StatusCode,len(raw),observed.Sub(localStart).Seconds(),dateSkew,parseErr)
              if resp.StatusCode!=200||parseErr!=nil||len(raw)<1{continue}
              bounded,err:=rb2BoundPublicCoinbaseRows(raw,300)
              if err!=nil{
                t.Logf("RB2_FRESHNESS_%s_AUTHENTIC_ROW_INTEGRITY=FAIL_%v",product,err)
                continue
              }
              lastRaw:=time.Unix(int64(bounded[len(bounded)-1][0]),0).UTC()
              t.Logf("RB2_FRESHNESS_%s_NEWEST_RAW_START=%s_RAW_CLOSE_AGE_SECONDS=%.1f",product,
                lastRaw.Format(time.RFC3339),observed.Sub(lastRaw.Add(time.Minute)).Seconds())
              for i:=len(bounded)-1;i>=0&&i>=len(bounded)-3;i--{
                t.Logf("RB2_FRESHNESS_%s_RECENT_SOURCE_INDEX_%d_START=%s",product,
                  i,time.Unix(int64(bounded[i][0]),0).UTC().Format(time.RFC3339))
              }
              closed,err:=closedCoinbaseCandles(bounded,product,60,300,observed)
              if err!=nil||len(closed)==0{
                t.Logf("RB2_FRESHNESS_%s_FINALITY=REFUSED_%v",product,err)
                continue
              }
              lastClosed:=closed[len(closed)-1].Timestamp.Add(time.Minute)
              age:=observed.Sub(lastClosed)
              t.Logf("RB2_FRESHNESS_%s_LAST_FINALIZED_AT=%s_AGE_SECONDS_%.1f_STALE_THRESHOLD_SECONDS_120_STALE_%t_VERIFIED_BARS_%d",product,
                lastClosed.Format(time.RFC3339),age.Seconds(),age>2*time.Minute,len(closed))
              if product=="BTC-USDC" {
                actual,actualErr:=fetchCandlesFromCoinbase(product,"1m",300)
                if actualErr!=nil||len(actual)==0{
                  t.Logf("RB2_FRESHNESS_EXACT_APP_FETCH=REFUSED_%v",actualErr)
                }else{
                  exactClose:=actual[len(actual)-1].Timestamp.Add(time.Minute)
                  exactAge:=time.Since(exactClose)
                  t.Logf("RB2_FRESHNESS_EXACT_APP_FETCH_LAST_CLOSE=%s_AGE_SECONDS_%.1f_STALE_%t",exactClose.Format(time.RFC3339),exactAge.Seconds(),exactAge>2*time.Minute)
                }
                mark,markErr:=rb2ServerFinalMark(product,fetchCandlesFromCoinbase)
                if markErr!=nil{t.Logf("RB2_FRESHNESS_EXACT_PAPER_MARK=REFUSED_%v",markErr)
                }else{t.Logf("RB2_FRESHNESS_EXACT_PAPER_MARK=ADMISSIBLE_OBSERVATION_ONLY_CONFIRMED_AT_%s",mark.ConfirmedAt.Format(time.RFC3339))}
              }
            }
            t.Log("RB2_FRESHNESS_DIAGNOSTIC_COMPLETE_NO_ORDERS=PASS")
          }
          '@
          [IO.File]::WriteAllText((Join-Path (Get-Location) $test),
            $source,[Text.UTF8Encoding]::new($false))
          try {
            & go test -mod=readonly -count=1 -p=1 -tags=ktrade_full -timeout=8m -v -run '^TestRB2OneShotGenuineGoCoinbaseSource$' ./cmd/ktrade
            $rc=$LASTEXITCODE
          } finally {
            Remove-Item -LiteralPath $test -Force -ErrorAction SilentlyContinue
          }
          if ((& git rev-parse HEAD).Trim() -cne $env:SOURCE_SHA -or
             @(& git status --porcelain=v1 --untracked-files=all).Count -ne 0) {
            throw 'RB2_PUBLIC_NATIVE_GO_PROBE_LEFT_SOURCE_DIRTY'
          }
          if ($rc -ne 0) { throw 'RB2_PUBLIC_NATIVE_GO_COINBASE_SOURCE_NOT_QUALIFIED' }
          Write-Host 'RB2_PUBLIC_NATIVE_GO_COINBASE_QUALIFIED=PASS'
          Write-Host 'RB2_LIVE_DISARMED=TRUE; ORDERS_NONE=TRUE; OWNER_DATA_UNTOUCHED=TRUE'
