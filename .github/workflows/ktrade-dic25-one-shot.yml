name: KTRADE DIC-25 reservation custody Windows qualification
on:
  push:
    branches: [main]
    paths: [.github/workflows/ktrade-dic25-one-shot.yml]

permissions:
  contents: write

jobs:
  dic25-risk-admission:
    if: github.repository == 'spoonman136668-ai/Qualification-Forge' && github.actor == 'spoonman136668-ai'
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      EXPECTED_SHA: '9486b689795162d42ef5eaf04ac33b7fb35129f8'
      KTRADE_CI_SOURCE_ONLY: '1'
      KTRADE_CI_PAPER_ONLY: '1'
      KTRADE_CI_LIVE_AUTHORITY: '0'
      KTRADE_CI_COINBASE_ALLOWED: '0'
      KTRADE_CI_PROMOTION_ALLOWED: '0'
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
    steps:
      - name: Verify hosted isolation and zero live authority
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if($env:RUNNER_OS -cne 'Windows' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted'){throw 'DIC25_NOT_HOSTED_WINDOWS'}
          if($env:KTRADE_CI_LIVE_AUTHORITY -cne '0' -or $env:KTRADE_CI_COINBASE_ALLOWED -cne '0' -or $env:KTRADE_CI_PROMOTION_ALLOWED -cne '0'){throw 'DIC25_UNSAFE_AUTHORITY'}
          Write-Host 'DIC25_HOSTED_WINDOWS_PAPER_ONLY=PASS'
      - name: Checkout immutable private KTRADE candidate
        uses: actions/checkout@v4
        with:
          repository: spoonman136668-ai/ckb
          ref: 9486b689795162d42ef5eaf04ac33b7fb35129f8
          path: checked-private
          persist-credentials: false
          fetch-depth: 1
          token: ${{ secrets.KTRADE_CKB_READ_TOKEN_TEMP }}
      - name: Focused fail-closed risk controls and one full regression
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $log = Join-Path $env:RUNNER_TEMP 'dic25-private.log'
          Push-Location (Join-Path $env:GITHUB_WORKSPACE 'checked-private')
          try {
            $actual = (& git rev-parse HEAD).Trim()
            if($LASTEXITCODE -ne 0 -or $actual -cne $env:EXPECTED_SHA){throw 'DIC25_SOURCE_DRIFT'}
            Write-Host 'DIC25_EXACT_REVIEW_SHA=PASS'
            function RunGo([string]$marker,[string[]]$argv) {
              & go @argv *> $log
              if($LASTEXITCODE -ne 0){throw ('DIC25_'+$marker+'_FAIL_PRIVATE_LOG_WITHHELD')}
              Write-Host ('DIC25_'+$marker+'=PASS')
            }
            RunGo 'FOCUSED_ESCROW_RESTART_NEGATIVES' @('test','-count=1','-run','^TestDIC(20|21|22|23|24|25)','./pkg')
            RunGo 'ONE_FULL_REGRESSION' @('test','-count=1','-timeout=420s','./...')
            RunGo 'VET' @('vet','./...')
            RunGo 'GO_BUILD' @('build','./...')
            if(@(& git status --porcelain=v1 --untracked-files=no).Count -ne 0){throw 'DIC25_TRACKED_SOURCE_CHANGED'}
            Write-Host 'DIC25_SOURCE_UNCHANGED=PASS'
          } finally {
            Pop-Location
            Remove-Item -LiteralPath $log -Force -ErrorAction SilentlyContinue
          }
      - name: Four Windows package executables and hash manifest
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:GITHUB_WORKSPACE 'checked-private'
          $pkg=Join-Path $env:RUNNER_TEMP 'dic25-package.zip'
          $stage=Join-Path $env:RUNNER_TEMP 'dic25-package-expanded'
          $log=Join-Path $env:RUNNER_TEMP 'dic25-package-private.log'
          try{
            & (Join-Path $root 'windows/package-clean-windows.ps1') -OutputZip $pkg *> $log
            if($LASTEXITCODE -ne 0 -or -not(Test-Path -LiteralPath $pkg)){throw 'DIC25_PACKAGE_FAILED'}
            Expand-Archive -LiteralPath $pkg -DestinationPath $stage
            $exe=Get-ChildItem -LiteralPath $stage -Recurse -File -Filter 'ktrade.exe'|Select-Object -First 1
            if($null -eq $exe){throw 'DIC25_EXE_MISSING'}
            $dir=Split-Path -Parent $exe.FullName
            $lines=Get-Content -LiteralPath (Join-Path $dir 'MANIFEST.sha256')
            foreach($name in @('ktrade.exe','ktrade-recover.exe','ktrade-schema.exe','ktrade-upgrade.exe')){
              $bin=Join-Path $dir $name
              if(-not(Test-Path -LiteralPath $bin)){throw 'DIC25_FOUR_EXES_MISSING'}
              $digest=(Get-FileHash -LiteralPath $bin -Algorithm SHA256).Hash.ToLowerInvariant()
              if(@($lines|Where-Object{$_ -ceq ($digest+'  '+$name)}).Count -ne 1){throw 'DIC25_MANIFEST_DRIFT'}
            }
            if(@(& git -C $root status --porcelain=v1 --untracked-files=no).Count -ne 0){throw 'DIC25_PACKAGE_MUTATED_SOURCE'}
            Write-Host 'DIC25_FOUR_WINDOWS_EXES_SHA256=PASS'
          }finally{
            Remove-Item -LiteralPath $log,$pkg -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $stage -Recurse -Force -ErrorAction SilentlyContinue
          }
      - name: Destroy private checkout and withhold private artifacts
        if: always()
        shell: pwsh
        run: |
          $private=Join-Path $env:GITHUB_WORKSPACE 'checked-private'
          if(Test-Path -LiteralPath $private){Remove-Item -LiteralPath $private -Force -Recurse -ErrorAction SilentlyContinue}
          Write-Host 'DIC25_PRIVATE_ARTIFACT_UPLOAD=DISABLED'
      - name: Record successful sanitized immutable qualification receipt
        if: success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $doc=[ordered]@{
            schema='ktrade.dic25.reservation-custody.v1'
            run_id=$env:GITHUB_RUN_ID
            workflow_sha=$env:GITHUB_SHA
            source_sha=$env:EXPECTED_SHA
            job_status='success'
            source_only=$true
            focused_fail_closed_checks_qualified=$true
            reservation_custody_write_through_qualified=$true
            one_full_regression_qualified=$true
            vet_and_build_qualified=$true
            four_windows_executables_sha256_qualified=$true
            all_cross_system_broker_atomicity_qualified=$false
            live_broker_authorized=$false
            historical_signed_v157_installer='BLOCKED_NOT_PROVIDED'
            release_promotion=$false
            private_artifacts=0
          }|ConvertTo-Json -Compress
          $body=@{message='evidence: DIC-25 fail-closed rate-slot write-through';content=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($doc+"`n"));branch='main'}|ConvertTo-Json
          $uri='https://api.github.com/repos/spoonman136668-ai/Qualification-Forge/contents/qualification-evidence/dic25-runs/'+$env:GITHUB_RUN_ID+'.json'
          Invoke-RestMethod -Uri $uri -Method Put -ContentType 'application/json' -Headers @{
            Authorization=('Bearer '+$env:GH_TOKEN)
            Accept='application/vnd.github+json'
            'X-GitHub-Api-Version'='2022-11-28'
          } -Body $body -TimeoutSec 30|Out-Null
          Write-Host 'DIC25_PUBLIC_RECEIPT=PASS'
