name: R25-C74F8 canonical native replay complete Windows regression and Chromium
on:
  push:
    branches: [qualification/r25-c74f8-one-full-windows-20261020]
    paths: [.github/workflows/r25-c74f8-one-full-windows.yml]
permissions:
  contents: read
concurrency:
  group: r25-c74f8-one-full-windows
  cancel-in-progress: false
jobs:
  original-governance:
    if: github.repository == 'spoonman136668-ai/Qualification-Forge'
    runs-on: windows-2022
    timeout-minutes: 55
    env:
      ORIGINAL_SHA: 'd892d5902f6c19105c4395bf6b71bfb112b22a62'
      ORIGINAL_TREE: '95846811b88a0cb538dd6d494bb771ef3cd8102b'
      VERIFIED_SHA: '81f704a32fe1a7f1d414c3300f40a957696d6cac'
      VERIFIED_TREE: 'bac0b1df58da837989c50a04b85b29e232ca833d'
      C12_TEST_BLOB: '8813b0db1c5591db5b136dc32b568d8773cbc4e6'
      MIXED_PARENT_SHA: '2af730f8a7bed15370d86d2ce0ced060c56beed2'
      MIXED_PARENT_TREE: '89cc720ff3d6da6cec12d583a23682584f473ac6'
      MIXED_TEST_BLOB: '00d8cabd7077f84e8b9d39d36cd5f8eb9b658206'
      GOFLAGS: '-p=2'
      GOMAXPROCS: '2'
      KTRADE_CI_PAPER_ONLY: '1'
      KTRADE_CI_LIVE_AUTHORITY: '0'
      KTRADE_CI_COINBASE_ALLOWED: '0'
      KTRADE_CI_PROMOTION_ALLOWED: '0'
    steps:
      - name: Require isolated hosted nonresearch Windows
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows' -or
             $env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/Qualification-Forge' -or
             $env:KTRADE_CI_PAPER_ONLY -cne '1' -or $env:KTRADE_CI_LIVE_AUTHORITY -cne '0' -or
             $env:KTRADE_CI_COINBASE_ALLOWED -cne '0' -or $env:KTRADE_CI_PROMOTION_ALLOWED -cne '0'){
            throw 'C74F5_ORIGINAL_GOVERNANCE_ISOLATION_FAILED'
          }
          Write-Host 'C74F5_INDEPENDENT_HOSTED_WINDOWS=PASS'
      - name: Checkout original pre-repair C12 source exactly
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: spoonman136668-ai/ktrade
          ref: d892d5902f6c19105c4395bf6b71bfb112b22a62
          fetch-depth: 0
          path: original
          persist-credentials: false
          token: ${{ secrets.KTRADE_SOURCE_READ_TOKEN }}
      - name: Checkout exact recovered original UI source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: spoonman136668-ai/ktrade
          ref: 81f704a32fe1a7f1d414c3300f40a957696d6cac
          fetch-depth: 0
          path: candidate
          persist-credentials: false
          token: ${{ secrets.KTRADE_SOURCE_READ_TOKEN }}
      - name: Checkout exact pre-repair mixed Phase9 source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: spoonman136668-ai/ktrade
          ref: 2af730f8a7bed15370d86d2ce0ced060c56beed2
          fetch-depth: 0
          path: mixed-parent
          persist-credentials: false
          token: ${{ secrets.KTRADE_SOURCE_READ_TOKEN }}
      - name: Check two independent immutable source trees and test identity
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($x in @(
            @{Name='original';Sha=$env:ORIGINAL_SHA;Tree=$env:ORIGINAL_TREE},
            @{Name='mixed-parent';Sha=$env:MIXED_PARENT_SHA;Tree=$env:MIXED_PARENT_TREE},
            @{Name='candidate';Sha=$env:VERIFIED_SHA;Tree=$env:VERIFIED_TREE}
          )){
            $p=Join-Path $env:GITHUB_WORKSPACE $x.Name
            if((& git -C $p rev-parse HEAD).Trim() -cne $x.Sha -or
               (& git -C $p rev-parse 'HEAD^{tree}').Trim() -cne $x.Tree -or
               @(& git -C $p status --porcelain=v1 --untracked-files=all).Count -ne 0){
              throw ('C74F5_ORIGINAL_GOVERNANCE_SOURCE_DRIFT_'+$x.Name)
            }
          }
          $p=Join-Path $env:GITHUB_WORKSPACE 'candidate'
          if((& git -C $p rev-parse 'HEAD:pkg/r25c12_governance_wire_compat_test.go').Trim() -cne $env:C12_TEST_BLOB){
            throw 'C74F5_C12_INDEPENDENT_TEST_IDENTITY_DRIFT'
          }
          $old=Join-Path $env:GITHUB_WORKSPACE 'original/pkg/r25c12_governance_wire_compat_test.go'
          if(Test-Path -LiteralPath $old){throw 'C74F5_TEST_ALREADY_PRESENT_IN_ORIGINAL'}
          Write-Host 'C74F5_PRE_REPAIR_ORIGINAL_AND_REPAIRED_SOURCE=PASS'
      - name: Check independently born mixed contract test identity
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $candidate=Join-Path $env:GITHUB_WORKSPACE 'candidate'
          $mixed=Join-Path $env:GITHUB_WORKSPACE 'mixed-parent'
          if((& git -C $candidate rev-parse 'HEAD:pkg/r25c12_mixed_phase9_wire_compat_test.go').Trim() -cne $env:MIXED_TEST_BLOB){
            throw 'C74F5_MIXED_TEST_BLOB_DRIFT'
          }
          if(Test-Path -LiteralPath (Join-Path $mixed 'pkg/r25c12_mixed_phase9_wire_compat_test.go')){
            throw 'C74F5_MIXED_TEST_NOT_FROM_SOURCE_BOUND_CHILD'
          }
          Write-Host 'C74F5_EXACT_MIXED_SOURCE_AND_TEST_IDENTITY=PASS'
      - name: Verify six-file native read-only source and synthetic tests only
        shell: pwsh
        working-directory: candidate
        run: |
          $ErrorActionPreference='Stop'
          $base='5eacd3681156baa564222dd95c6356b9f28fa647'
          $paths=@(
            'cmd/ktrade/operator_native_source_f3_full.go',
            'docs/R25_C74F8_CANONICAL_15S_SOURCE.md',
            'internal/durableupgrade/authenticated_native_vwap_source.go',
            'internal/durableupgrade/original_canonical_15s_vwap.go',
            'tests/donor-native-vwap/c74f8_canonical_fixture.go',
            'tests/donor-shadow/native_vwap_c74f8_test.go'
          )|Sort-Object
          $got=@(& git diff --name-only $base $env:VERIFIED_SHA | Sort-Object)
          if($got.Count -ne $paths.Count -or @(Compare-Object $paths $got).Count -ne 0){
            throw 'C74F8_OUT_OF_SCOPE_SOURCE_DELTA'
          }
          foreach($f in @('electron/main.js','package.json','pkg/r25c12_governance_wire_compat_test.go')){
            if((& git rev-parse ('HEAD:'+$f)).Trim() -cne (& git rev-parse ($base+':'+$f)).Trim()){
              throw 'C74F5_ORIGINAL_LAUNCHER_OR_GOVERNANCE_DRIFT'
            }
          }
          Write-Host 'C74F8_EXACT_REVIEW_ONLY_CANONICAL_HISTORY_DELTA=PASS'
      - name: Pinned original Windows Go toolchain
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.23.12'
          cache: false
      - name: Capture source-born unmodified parent governance evidence
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:GITHUB_WORKSPACE 'original'
          $candidate=Join-Path $env:GITHUB_WORKSPACE 'candidate'
          $dst=Join-Path $root 'pkg/r25c12_governance_wire_compat_test.go'
          Copy-Item -LiteralPath (Join-Path $candidate 'pkg/r25c12_governance_wire_compat_test.go') -Destination $dst
          $content=(Get-Content -LiteralPath $dst -Raw -Encoding utf8)
          if(!$content.Contains('R25C12_ORIGINAL_MODE') -or !$content.Contains('R25C12_PARENT_')){
            throw 'C74F5_PINNED_TEST_NOT_ORIGINAL_EVIDENCE_CAPABLE'
          }
          $env:R25C12_ORIGINAL_MODE='1'
          $log=Join-Path $env:RUNNER_TEMP 'c74f5-original-c12.log'
          Push-Location $root
          try{
            & go test -mod=readonly -tags=ktrade_full -count=1 -timeout=7m -v -run '^TestR25C12HistoricalGovernanceJSONWire$' ./pkg *> $log
            if($LASTEXITCODE -ne 0){
              Get-Content -LiteralPath $log | Where-Object {
                $_ -match '^# ktrade/' -or $_ -match '^--- FAIL:' -or $_ -match '^.*_test.go:[0-9]+'
              } | Select-Object -First 18 | ForEach-Object {Write-Host $_}
              throw 'C74F5_ORIGINAL_GOVERNANCE_TEST_FAILED'
            }
          }finally{Pop-Location}
          $lines=Get-Content -LiteralPath $log
          $records=@{}
          foreach($line in $lines){
            if($line -match 'R25C12_PARENT_(T[0-9]{3})_(COLLISIONS_B64|SHA256)=([A-Za-z0-9+/=]+)'){
              $id=$Matches[1];$kind=$Matches[2];$value=$Matches[3]
              if(!$records.ContainsKey($id)){$records[$id]=@{}}
              if($records[$id].ContainsKey($kind)){throw 'C74F5_DUPLICATE_PARENT_RECEIPT'}
              $records[$id][$kind]=$value
            }
          }
          if($records.Count -ne 55){throw ('C74F5_INCOMPLETE_PARENT_INVENTORY_'+$records.Count)}
          foreach($id in $records.Keys){
            $entry=$records[$id]
            if($entry.Count -ne 2 -or $entry['SHA256'] -cnotmatch '^[a-f0-9]{64}$'){
              throw 'C74F5_PARENT_RECEIPT_MALFORMED'
            }
            $raw=[Convert]::FromBase64String($entry['COLLISIONS_B64'])
            $objects=ConvertFrom-Json -InputObject ([Text.Encoding]::UTF8.GetString($raw))
            if(@($objects).Count -lt 2){throw 'C74F5_EMPTY_PARENT_COLLISIONS'}
            Add-Content -LiteralPath $env:GITHUB_ENV -Value ('R25C12_'+$id+'_COLLISIONS_B64='+$entry['COLLISIONS_B64']) -Encoding utf8
            Add-Content -LiteralPath $env:GITHUB_ENV -Value ('R25C12_'+$id+'_SHA256='+$entry['SHA256']) -Encoding utf8
          }
          Remove-Item Env:R25C12_ORIGINAL_MODE -ErrorAction SilentlyContinue
          Write-Host 'C74F5_55_INDEPENDENT_PRE_REPAIR_PARENT_RECEIPTS=PASS'
      - name: Validate same 55 receipts against repaired C74F3 source
        shell: pwsh
        working-directory: candidate
        run: |
          $ErrorActionPreference='Stop'
          if($env:R25C12_ORIGINAL_MODE -eq '1'){throw 'C74F5_CANDIDATE_IN_ORIGINAL_MODE'}
          $log=Join-Path $env:RUNNER_TEMP 'c74f5-repaired-c12.log'
          & go test -mod=readonly -tags=ktrade_full -count=1 -timeout=7m -run '^TestR25C12HistoricalGovernanceJSONWire$' ./pkg *> $log
          if($LASTEXITCODE -ne 0){
            Get-Content -LiteralPath $log | Where-Object {
              $_ -match '^# ktrade/' -or $_ -match '^--- FAIL:' -or $_ -match '^.*_test.go:[0-9]+'
            } | Select-Object -First 24 | ForEach-Object {Write-Host $_}
            throw 'C74F5_CANDIDATE_ORIGINAL_JSON_GOVERNANCE_FAILURE'
          }
          Write-Host 'C74F5_ALL_55_AUTHENTIC_PARENT_WIRE_AND_COLLISION_CONTRACTS=PASS'
      - name: Originate 17 original mixed Boolean and slice field inventories
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $base=Join-Path $env:GITHUB_WORKSPACE 'mixed-parent'
          $candidate=Join-Path $env:GITHUB_WORKSPACE 'candidate'
          $target=Join-Path $base 'pkg/r25c12_mixed_phase9_wire_compat_test.go'
          Copy-Item -LiteralPath (Join-Path $candidate 'pkg/r25c12_mixed_phase9_wire_compat_test.go') -Destination $target -ErrorAction Stop
          $env:R25C12_MIXED_PARENT_MODE='1'
          $log=Join-Path $env:RUNNER_TEMP 'c74f5-mixed-parent.log'
          Push-Location $base
          try {
            & go test -mod=readonly -tags=ktrade_full -count=1 -timeout=6m -v -run 'TestR25C12MixedPhase9HistoricalJSONWire' ./pkg *> $log
            if($LASTEXITCODE -ne 0){
              Get-Content -LiteralPath $log | Where-Object {
                $_ -match 'FAIL:' -or $_ -match '_test.go:' -or $_ -match '^# ktrade/'
              } | Select-Object -First 30 | ForEach-Object {Write-Host $_}
              throw 'C74F5_AUTHENTIC_MIXED_PARENT_NOT_QUALIFIED'
            }
          }finally{Pop-Location}
          $records=@{}
          foreach($line in (Get-Content -LiteralPath $log)){
            if($line -match 'R25C12_MIXED_PARENT_(T[0-9]{2})_(FIELDS_B64|SHA256)=([A-Za-z0-9+/=]+)'){
              $id=$Matches[1];$kind=$Matches[2];$value=$Matches[3]
              if(!$records.ContainsKey($id)){$records[$id]=@{}}
              if($records[$id].ContainsKey($kind)){throw 'C74F5_DUPLICATE_MIXED_PARENT_EVIDENCE'}
              $records[$id][$kind]=$value
            }
          }
          if($records.Count -ne 17){throw ('C74F5_MIXED_PARENT_COUNT_'+$records.Count)}
          foreach($id in $records.Keys){
            $v=$records[$id]
            if($v.Count -ne 2 -or $v['SHA256'] -cnotmatch '^[a-f0-9]{64}$'){
              throw 'C74F5_INCOMPLETE_MIXED_PARENT_RECORD'
            }
            $objects=ConvertFrom-Json -InputObject ([Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($v['FIELDS_B64'])))
            if(@($objects).Count -ne 2){throw 'C74F5_MIXED_PARENT_FIELD_COUNT_DRIFT'}
            Add-Content -LiteralPath $env:GITHUB_ENV -Value ('R25C12_MIXED_'+$id+'_FIELDS_B64='+$v['FIELDS_B64']) -Encoding utf8
            Add-Content -LiteralPath $env:GITHUB_ENV -Value ('R25C12_MIXED_'+$id+'_SHA256='+$v['SHA256']) -Encoding utf8
          }
          Remove-Item Env:R25C12_MIXED_PARENT_MODE -ErrorAction SilentlyContinue
          Write-Host 'C74F5_17_SOURCE_ORIGINATED_MIXED_PARENT_RECEIPTS=PASS'
      - name: Qualify repaired source with all 17 authentic mixed receipts
        shell: pwsh
        working-directory: candidate
        run: |
          $ErrorActionPreference='Stop'
          if($env:R25C12_MIXED_PARENT_MODE -eq '1'){throw 'C74F5_CANDIDATE_IN_MIXED_PARENT_MODE'}
          & go test -mod=readonly -tags=ktrade_full -count=1 -timeout=6m -run 'TestR25C12MixedPhase9HistoricalJSONWire' ./pkg
          if($LASTEXITCODE -ne 0){throw 'C74F5_MIXED_CANDIDATE_PRESERVATION_FAILED'}
          Write-Host 'C74F5_17_AUTHENTIC_MIXED_PHASE9_JSON_WIRE_CONTRACTS=PASS'
      - name: Focused P19 P20 P21 and stronger isolated desktop safety assertions
        shell: pwsh
        working-directory: candidate
        run: |
          $ErrorActionPreference='Stop'
          $testnames='TestR25C74F5|TestPhase19_P19A_Closeout_DeterministicRuntimeSurfacePinned|TestPhase19_P19A_Integration_T06_DeterministicBackendLaunchPathPinned|TestPhase20_P20A_Closeout_RouteRegistrationAndHandlerSurface|TestPhase20_P20A_Closeout_RequestResponseContractSurface|TestPhase20_P20A_Closeout_DeterministicRuntimeSurfacePinned|TestPhase20_P20A_Integration_T04_PackageScriptsAndBuildSurface|TestPhase20_P20A_Integration_T06_PackagedAndDevelopmentExecutableResolutionPinned|TestPhase20_P20A_Integration_T06_DeterministicBackendLaunchAndShutdownPinned|TestPhase21_P21A_Closeout_DeterministicRuntimeSurfacePinned|TestPhase21_P21A_Integration_T04_EntryAndMetadataSurface|TestPhase21_P21A_Integration_T06_DeterministicRuntimeAndExecutableSurface'
          & go test -mod=readonly -tags=ktrade_full -count=1 -timeout=5m -run $testnames ./pkg
          if($LASTEXITCODE -ne 0){throw 'C74F5_RECONCILED_LEGACY_AND_MODERN_SAFETY_FOCUSED_FAILED'}
          Write-Host 'C74F5_ALL_RECONCILED_ELECTRON_CONTRACTS=PASS'
      - name: Verify owner-only PowerShell acceptance is syntactically valid and cannot access hosted user data
        shell: pwsh
        working-directory: candidate
        run: |
          $ErrorActionPreference='Stop'
          $script=Join-Path (Get-Location) 'qualification/R25_C74F6_Owner_ReadOnly_Acceptance.ps1'
          $tokens=$null
          $parseErrors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile($script,[ref]$tokens,[ref]$parseErrors)
          if(@($parseErrors).Count -ne 0){throw 'C74F6_WINDOWS_OWNER_SCRIPT_PARSE_FAILURE'}
          $code=Get-Content -LiteralPath $script -Raw -Encoding utf8
          if(!$code.Contains("Get-Process -Name 'ckb','ktrade'") -or
             !$code.Contains("ExpectedSourceSha") -or
             !$code.Contains("C74F6_OWNER_ORIGINAL_INSTALLED_DATA_MATCHES_RETAINED_SELECTED_SOURCE=PASS")){
            throw 'C74F6_OWNER_STOPPED_PROFILE_SOURCE_GUARD_MISSING'
          }
          $prior=$ErrorActionPreference
          try{
            $ErrorActionPreference='Continue'
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script -ExpectedSourceSha $env:VERIFIED_SHA *> $null
            $childExit=$LASTEXITCODE
          }finally{$ErrorActionPreference=$prior}
          if($childExit -eq 0){throw 'C74F6_HOSTED_OWNER_SCRIPT_INCORRECTLY_ADMITTED'}
          if($childExit -ne 1){throw 'C74F6_OWNER_SCRIPT_UNEXPECTED_EXIT'}

          Write-Host 'C74F6_POWER_SHELL_OWNER_GUARD_AND_REDACTED_RECEIPTS=PASS'
          # GitHub pwsh wraps native process exit code. This child is
          # EXPECTED to deny hosted owner-data access with exit 1; after
          # verifying that exact denial, return a successful check result.
          exit 0
      - name: Consolidated owner-only wrapper and scanner syntax/invariant checks
        shell: pwsh
        working-directory: candidate
        run: |
          $ErrorActionPreference='Stop'
          $wrapper=Join-Path (Get-Location) 'qualification/R25_C74F6_Owner_ReadOnly_Acceptance.ps1'
          $scanner=Join-Path (Get-Location) 'scripts/r25-c74f7-owner-integrity.ps1'
          foreach($name in @($wrapper,$scanner)){
            if(!(Test-Path -LiteralPath $name -PathType Leaf)){throw 'C74F7_QUALIFIED_SOURCE_MISSING'}
            $tokens=$null;$parseErrors=$null
            [void][System.Management.Automation.Language.Parser]::ParseFile($name,[ref]$tokens,[ref]$parseErrors)
            if(@($parseErrors).Count -ne 0){throw 'C74F7_OWNER_ONLY_SOURCE_HAS_SYNTAX_ERROR'}
          }
          $content=Get-Content -LiteralPath $wrapper -Raw
          $scanText=Get-Content -LiteralPath $scanner -Raw
          if(!$content.Contains('r25-c74f7-owner-integrity.ps1') -or
             !$content.Contains('R25_C74F7_ALL_695_ORIGINAL_INSTALLED_FILES_MATCH_SNAPSHOT=PASS') -or
             !$scanText.Contains('ORIGINAL_INSTALL_DIFFERS_FROM_PRESERVED_CUSTODY') -or
             !$scanText.Contains('NOT_REAL_OWNING_WINDOWS_PROFILE') -or
             !$scanText.Contains('SYNTHETIC_FIXTURE_PATH_OUTSIDE_TEMP')){
              throw 'C74F7_OWNER_COMBINED_SOURCE_CONTRACT_NOT_BOUND'
          }
          Write-Host 'C74F7_OWNER_COMBINED_SOURCE_SYNTAX_AND_FAILCLOSED=PASS'
      - name: Owner acceptance is forbidden on hosted runner
        shell: pwsh
        working-directory: candidate
        run: |
          $ErrorActionPreference='Stop'
          $env:KTRADE_C74F6_READONLY_OWNER_ACCEPT='0'
          & go test -mod=readonly -tags=ktrade_full -count=1 -timeout=4m -v -run 'TestR25C74F6' ./cmd/ktrade
          if($LASTEXITCODE -ne 0){throw 'C74F6_HOSTED_OWNER_GUARD_FAILED'}
          Write-Host 'C74F6_HOSTED_NO_PRIVATE_ACCOUNT_ACCESS=PASS'
      - name: One complete Windows regression with authentic original C12 fingerprints
        shell: pwsh
        working-directory: candidate
        run: |
          $ErrorActionPreference='Stop'
          if($env:R25C12_T298_SHA256.Length -ne 64 -or
             $env:R25C12_T373_SHA256.Length -ne 64 -or
             $env:R25C12_MIXED_T24_SHA256.Length -ne 64 -or
             $env:R25C12_MIXED_T40_SHA256.Length -ne 64){
             throw 'C74F5_ORIGINAL_PARENT_EVIDENCE_MISSING'
          }
          $log=Join-Path $env:RUNNER_TEMP 'r25c74f5-full.log'
          & go test -mod=readonly -tags=ktrade_full -count=1 -timeout=15m ./... *> $log
          if($LASTEXITCODE -ne 0){
            Get-Content -LiteralPath $log | Where-Object {
              $_ -match 'FAIL:' -or $_ -match 'FAIL ' -or $_ -match 'go: ' -or
              $_ -match '_test.go:'
            } | Select-Object -First 60 | ForEach-Object {Write-Host $_}
            throw 'C74F5_FULL_WINDOWS_REGRESSION_NOT_ACCEPTED'
          }
          Write-Host 'C74F5_COMPLETE_WINDOWS_REGRESSION_AND_PARENT_C12=PASS'
          Remove-Item -LiteralPath $log -Force
      - name: Go vet original fully tagged application
        shell: pwsh
        working-directory: candidate
        run: |
          $ErrorActionPreference='Stop'
          & go vet -mod=readonly -tags=ktrade_full ./...
          if($LASTEXITCODE -ne 0){throw 'C74F5_COMPLETE_WINDOWS_VET_FAILED'}
          Write-Host 'C74F5_COMPLETE_WINDOWS_VET=PASS'
      - name: Isolated Windows executable and original UI packaging
        shell: pwsh
        working-directory: candidate
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP 'r25c74f5-original-app'
          if(Test-Path -LiteralPath $out){throw 'C74F5_BUILD_OUTPUT_COLLISION'}
          New-Item -ItemType Directory -Path $out | Out-Null
          & go build -mod=readonly -tags=ktrade_full -o (Join-Path $out 'ktrade.exe') ./cmd/ktrade
          if($LASTEXITCODE -ne 0){throw 'C74F5_WINDOWS_EXE_FAILED'}
          foreach($folder in @('static','templates','strategies','recovery')){
            Copy-Item -LiteralPath $folder -Destination $out -Recurse -ErrorAction Stop
          }
          foreach($name in @(
            'static/recovery_history.html',
            'recovery/operator-donor-v11110/strategy.html',
            'recovery/operator-donor-v11110/app.js',
            'recovery/operator-bridge/historical-review.js',
            'recovery/operator-bridge/operator-navigation-acceptance.js',
            'recovery/operator-bridge/operator-chart-navigation.js',
            'recovery/operator-bridge/operator-control-review.js'
          )){
            if(!(Test-Path -LiteralPath (Join-Path $out $name) -PathType Leaf)){
              throw 'C74F5_ORIGINAL_BROWSER_ASSET_MISSING'
            }
          }
          Write-Host 'C74F5_WINDOWS_EXE_ORIGINAL_OPERATOR=PASS'
      - name: Chromium original interaction and blocked trading controls
        shell: pwsh
        working-directory: candidate
        run: |
          $ErrorActionPreference='Stop'
          $env:KTRADE_R25C74D_APP_EXE=Join-Path (Join-Path $env:RUNNER_TEMP 'r25c74f5-original-app') 'ktrade.exe'
          & go test -mod=readonly -tags=ktrade_full -count=1 -timeout=6m -run 'TestR25C74DPackagedRealBrowserChartGestures' ./cmd/ktrade
          if($LASTEXITCODE -ne 0){throw 'C74F5_ORIGINAL_CHROMIUM_FAILED'}
          Write-Host 'C74F5_GENUINE_ORIGINAL_CHROMIUM=PASS'
          Write-Host 'C74F5_OWNER_DATA_PRESENT=FALSE'
          Write-Host 'C74F5_PAPER_AND_LIVE_ORDER_AUTHORITY=FALSE'
      - name: Verify only untracked test staged on frozen original
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($item in @(
            @{Name='original';Sha=$env:ORIGINAL_SHA},
            @{Name='mixed-parent';Sha=$env:MIXED_PARENT_SHA},
            @{Name='candidate';Sha=$env:VERIFIED_SHA}
          )){
            $path=Join-Path $env:GITHUB_WORKSPACE $item.Name
            if(Test-Path -LiteralPath $path){
              if((& git -C $path rev-parse HEAD).Trim() -cne $item.Sha -or
                 @(& git -C $path diff --name-only HEAD --).Count -ne 0){
                throw ('C74F5_ORIGINAL_SOURCE_MUTATED_'+$item.Name)
              }
            }
          }
          Write-Host 'C74F5_NO_OWNER_DATA_AND_NO_TRADING_ACCESS=PASS'
