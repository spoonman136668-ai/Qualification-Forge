            $out=@(& go test -race -json -mod=readonly -tags=ktrade_full -count=1 -timeout 15m -run '^TestPineOverlayTransportsOriginalConfirmedShapes
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
