            $exit=$LASTEXITCODE
            foreach($line in $out){Write-Host $line}
            if($exit -ne 0){throw 'ACTUAL_ORIGINAL_SETTINGS_API_STORAGE_TEST_FAILED'}
            $events=@($out|ForEach-Object {try{$_|ConvertFrom-Json -ErrorAction Stop}catch{}})
            foreach($root in @('TestPineInputSettingsPersistCASAndSourceIsolation','TestPineInputSettingsRejectsBadRequestsAndPreservesCorruption','TestPineInputSettingsUnavailableRootIsReadOnly','TestPineOverlayTransportsOriginalConfirmedShapes')){
              if(@($events|Where-Object {$_.Test -ceq $root -and $_.Action -ceq 'pass'}).Count -ne 1){throw 'SETTINGS_API_TEST_NOT_EXECUTED'}
            }
            if(@($events|Where-Object {$_.Action -in @('fail','skip')}).Count -ne 0){throw 'API_FAILURE_OR_SKIP'}
            & go vet -mod=readonly -tags=ktrade_full ./cmd/ktrade
            if($LASTEXITCODE -ne 0){throw 'TAGGED_APP_VET_FAILED'}
          }finally{Pop-Location}
          Write-Host '::notice::PR235_ACTUAL_LOCAL_ORIGIN_SETTINGS_API_WINDOWS_REPEAT_REPLACE_COLD_READ_CAS_CORRUPTION_RESET=PASS'
      - name: Actual HTTP response through original chart marker method plus prior controls
        shell: pwsh
