            $old=(& git show 'db79330ffee632b66c5e17b4a60d29c421febbab:cmd/ktrade/main_full.go') -join "`n"
            if($LASTEXITCODE -ne 0){throw 'QUALIFIED_PARENT_HANDLER_UNAVAILABLE'}
