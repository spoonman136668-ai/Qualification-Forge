name: KTRADE DIC-09 historical-parity admission audit
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ktrade-dic09-historical-parity-audit.yml

permissions:
  contents: read

jobs:
  audit:
    if: github.repository == 'spoonman136668-ai/Qualification-Forge'
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      KTRADE_EXPECTED_SOURCE_SHA: '05cc1136847ce7708319ed25689593aad7981265'
      KTRADE_CI_SOURCE_ONLY: '1'
      KTRADE_CI_PAPER_ONLY: '1'
      KTRADE_CI_LIVE_AUTHORITY: '0'
      KTRADE_CI_COINBASE_ALLOWED: '0'
      KTRADE_CI_PROMOTION_ALLOWED: '0'
      GOFLAGS: '-p=2'
      GOMAXPROCS: '2'
    steps:
      - name: Verify ephemeral Windows and no authority
        shell: pwsh
        run: |
          if($env:RUNNER_OS -cne 'Windows' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted'){throw 'DIC09_NOT_ISOLATED_WINDOWS'}
          Write-Host 'DIC09_HOSTED_WINDOWS=PASS'
      - name: Checkout exact private source without saving credential
        uses: actions/checkout@v4
        with:
          repository: spoonman136668-ai/ckb
          ref: ${{ env.KTRADE_EXPECTED_SOURCE_SHA }}
          path: checked-private
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.KTRADE_CKB_READ_TOKEN_TEMP }}
      - name: Go setup without cache
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Run exact-source read-only contract audit and focused regression
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:GITHUB_WORKSPACE 'checked-private'
          $auditPath=Join-Path $env:RUNNER_TEMP 'dic09-private-audit.json'
          $auditLog=Join-Path $env:RUNNER_TEMP 'dic09-private-audit.log'
          $testLog=Join-Path $env:RUNNER_TEMP 'dic09-private-tests.log'
          Push-Location $root
          try{
            $identity=(& git rev-parse HEAD).Trim()
            if($LASTEXITCODE -ne 0 -or $identity -cne $env:KTRADE_EXPECTED_SOURCE_SHA){throw 'DIC09_SOURCE_IDENTITY_DRIFT'}
            Write-Host 'DIC09_SOURCE_IDENTITY=PASS'
            & pwsh -NoProfile -File 'windows/ktrade-dic09-historical-parity-audit.ps1' -RepositoryRoot $root -OutputPath $auditPath *> $auditLog
            if($LASTEXITCODE -ne 0){throw 'DIC09_AUDIT_FAILED_PRIVATE_OUTPUT_WITHHELD'}
            $allowed=@(
              'DIC07_PORTABLE_INSTALLED_RUNTIME_PROOF_SOURCE',
              'DIC08_REAL_OFFLINE_UPDATER_PROOF_SOURCE',
              'DIC06_INCIDENT_SAVE_EXPORT_ROUTED',
              'LEGACY_DIAGNOSTIC_ZIP_HANDLER_PRESENT',
              'LEGACY_SUPPORT_ZIP_HANDLER_PRESENT',
              'OPERATOR_INCIDENT_INTERFACE_PRESENT',
              'STRATEGY_STATE_SETTINGS_FILE_CONTRACT',
              'DEDICATED_BRAVE_SOURCE_CONTRACT',
              'R10_PINE_CONTRACT_EXPLICITLY_UNVERIFIED',
              'HISTORICAL_PATH_INVENTORY_BLOCKS_UNVERIFIED_PATHS',
              'R10_INSTALLER_REQUIRES_SYNTHETIC_ONLY',
              'HISTORICAL_BROWSER_CONTRACT_PINNED_TO_CKB_EXE',
              'SOURCE_CONTRACT_AUDIT'
            )
            $output=@(Get-Content -LiteralPath $auditLog)
            foreach($check in $allowed){
              if(@($output|Where-Object{$_ -ceq ('DIC09_'+$check+'=PASS')}).Count -ne 1){
                throw ('DIC09_MISSING_REQUIRED_AUDIT_CHECK_'+$check)
              }
              Write-Host ('DIC09_'+$check+'=PASS')
            }
            $obj=Get-Content -LiteralPath $auditPath -Raw|ConvertFrom-Json
            if($obj.overall -cne 'BLOCKED_HISTORICAL_PARITY_NOT_CERTIFIED' -or
              $obj.production_mutation -ne $false -or
              $obj.real_profile_inspected -ne $false -or
              $obj.release_or_cutover_authorized -ne $false -or
              $obj.feature_gates.Count -ne 10){throw 'DIC09_AUDIT_OVERCLAIMS_ADMISSION'}
            Write-Host 'DIC09_AUDIT_COMPLETED=PASS'
            Write-Host 'DIC09_HISTORICAL_PARITY=BLOCKED'
            & go test -count=1 -timeout=180s ./internal/durableupgrade ./internal/incidentcapsule *> $testLog
            if($LASTEXITCODE -ne 0){throw 'DIC09_FOCUSED_SOURCE_TESTS_FAILED_PRIVATE_OUTPUT_WITHHELD'}
            Write-Host 'DIC09_FOCUSED_SOURCE_TESTS=PASS'
            if(@(& git status --porcelain=v1 --untracked-files=no).Count -ne 0){throw 'DIC09_SOURCE_MUTATED'}
            Write-Host 'DIC09_SOURCE_UNCHANGED=PASS'
          }finally{
            Pop-Location
            foreach($p in @($auditPath,$auditLog,$testLog)){
              Remove-Item -LiteralPath $p -Force -ErrorAction SilentlyContinue
            }
          }
      - name: Remove source and forbid public artifacts
        if: always()
        shell: pwsh
        run: |
          $source=Join-Path $env:GITHUB_WORKSPACE 'checked-private'
          if(Test-Path -LiteralPath $source){Remove-Item -LiteralPath $source -Recurse -Force -ErrorAction SilentlyContinue}
          Write-Host 'DIC09_PUBLIC_ARTIFACT_UPLOAD=DISABLED'
