name: KTRADE read-only regression failure classification

on:
  push:
    branches:
      - qualification/ktrade-p16-contract-reconcile-20261018
    paths: [.github/workflows/ktrade-regression-diagnose.yml]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.repository == 'spoonman136668-ai/Qualification-Forge' && github.actor == 'spoonman136668-ai'
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      EXPECTED_KTRADE_SHA: '61dd5022d31f21a4d241635ddc00f64ecc309996'
      EXPECTED_TREE: '955ee0e724c952ffbf79da9ed27f59cd57b91d53'
      KTRADE_CI_PAPER_ONLY: '1'
      KTRADE_CI_COINBASE_ALLOWED: '0'
      KTRADE_CI_LIVE_AUTHORITY: '0'
      KTRADE_CI_PROMOTION_ALLOWED: '0'
      GOFLAGS: '-p=2'
      GOMAXPROCS: '2'
    steps:
      - name: Checkout fixed recovery commit without persisted credentials
        uses: actions/checkout@v4
        with:
          repository: spoonman136668-ai/ktrade
          ref: 61dd5022d31f21a4d241635ddc00f64ecc309996
          path: checked-private
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.KTRADE_SOURCE_READ_TOKEN }}
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Categorize repository regression without disclosing private logs
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:GITHUB_WORKSPACE 'checked-private'
          $log=Join-Path $env:RUNNER_TEMP 'ktrade-regression-private-diagnostics.log'
          Push-Location $root
          try {
            if((& git rev-parse HEAD).Trim() -cne $env:EXPECTED_KTRADE_SHA -or (& git rev-parse 'HEAD^{tree}').Trim() -cne $env:EXPECTED_TREE) {
              throw 'KTRADE_REGRESSION_DIAGNOSIS_SOURCE_DRIFT'
            }
            if($env:KTRADE_CI_LIVE_AUTHORITY -cne '0' -or $env:KTRADE_CI_COINBASE_ALLOWED -cne '0' -or $env:KTRADE_CI_PROMOTION_ALLOWED -cne '0'){throw 'UNSAFE_AUTHORITY'}
            function TestPrivate([string]$area,[string[]]$paths) {
              & go test -mod=readonly -count=1 -timeout=600s @paths *> $log
              if($LASTEXITCODE -eq 0) {
                Write-Output ('KTRADE_FOCUSED_REGRESSION_'+$area+'=PASS')
                return
              }
              $all=[string](Get-Content -LiteralPath $log -Raw -ErrorAction SilentlyContinue)
              $tests=[regex]::Matches($all,'(?m)^--- FAIL: (Test[A-Za-z0-9_]+)')
              $family=[System.Collections.Generic.SortedSet[string]]::new([StringComparer]::Ordinal)
              foreach($test in $tests) {
                $name=$test.Groups[1].Value
                $label='OTHER'
                if($name -match '^TestPhase(\d+)'){$label='Phase'+$Matches[1]}
                elseif($name -match '^TestP(\d+)'){$label='P'+$Matches[1]}
                elseif($name -match '^TestDIC(\d+)'){$label='DIC'+$Matches[1]}
                elseif($name -match '^TestPine'){$label='PINE'}
                elseif($name -match '^TestKTRADE'){$label='KTRADE'}
                $null=$family.Add($label)
              }
              $kind='UNKNOWN'
              if($tests.Count -gt 0){$kind='TEST_FAILURE'}
              elseif($all -match '(?m)^# ktrade/'){$kind='GO_COMPILATION'}
              elseif($all -match '(?m)^panic:'){$kind='PANIC'}
              Write-Output ('KTRADE_FAILING_AREA='+$area)
              Write-Output ('KTRADE_FAILURE_KIND='+$kind)
              Write-Output ('KTRADE_FAILURE_TEST_COUNT='+$tests.Count)
              Write-Output ('KTRADE_FAILURE_FAMILIES='+([string]::Join(',',$family)))
              throw ('KTRADE_FOCUSED_REGRESSION_'+$area+'_FAILED_PRIVATE_OUTPUT_WITHHELD')
            }
            & go mod download *> $log
            if($LASTEXITCODE -ne 0){throw 'KTRADE_GO_MODULE_DOWNLOAD_FAILED_PRIVATE_OUTPUT_WITHHELD'}
            foreach($pin in @(
              @('cmd/ktrade/pine_codeactions_full.go','50827a5f4c60a9df32ea352ec69765ba42acbbf2'),
              @('pkg/p16b_t05_codeactions_http_request_response_contract_test.go','4725a9bba8b48223cf947a7c0efb33dcd41ef93b'),
              @('pkg/p16b_closeout_codeactions_http_acceptance_gate_test.go','6ee7a2c39e2c036fd3d6baf86f5c6c3a829679ed')
            )){
              if((& git rev-parse "HEAD:$($pin[0])").Trim() -cne $pin[1]){throw 'KTRADE_P16_AUTHENTIC_SOURCE_OR_TEST_DRIFT'}
            }
            & go test -vet=off -mod=readonly -count=1 -timeout=180s -run '^(TestPhase16_P16B_Integration_T05_RequestResponseContractSurface|TestPhase16_P16B_Closeout_RequestResponseContractSurface)
          }finally{
            Pop-Location
            Remove-Item -LiteralPath $log -Force -ErrorAction SilentlyContinue
          }
      - name: Wipe private checkout
        if: always()
        shell: pwsh
        run: |
          Remove-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'checked-private') -Recurse -Force -ErrorAction SilentlyContinue
          Write-Output 'KTRADE_PRIVATE_DIAGNOSTIC_OUTPUT=WITHHELD'
 ./pkg *> $log
            if($LASTEXITCODE -ne 0){
              $safe=@(Get-Content -LiteralPath $log -ErrorAction SilentlyContinue |
                Where-Object {$_ -match '^# ktrade/' -or $_ -match '^--- FAIL: Test'}|Select-Object -First 8)
              foreach($line in $safe){Write-Output "KTRADE_P16_SAFE_FAILURE: $line"}
              throw 'KTRADE_P16_TWO_TARGETED_SOURCE_CONTRACT_TESTS_FAILED'
            }
            Write-Output 'KTRADE_P16_ORIGINAL_PINE_HANDLER_BYTE_IDENTICAL=TRUE'
            Write-Output 'KTRADE_P16_TWO_TARGETED_CONTRACT_TESTS=PASS'
            Write-Output 'KTRADE_INHERITED_FULL_REGRESSION_AND_VET_REMAIN_UNQUALIFIED=TRUE'
          }finally{
            Pop-Location
            Remove-Item -LiteralPath $log -Force -ErrorAction SilentlyContinue
          }
      - name: Wipe private checkout
        if: always()
        shell: pwsh
        run: |
          Remove-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'checked-private') -Recurse -Force -ErrorAction SilentlyContinue
          Write-Output 'KTRADE_PRIVATE_DIAGNOSTIC_OUTPUT=WITHHELD'
