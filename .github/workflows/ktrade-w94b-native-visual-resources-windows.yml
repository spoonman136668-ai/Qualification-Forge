name: KTRADE W94B actual Windows Supertrend pane pixels and complete WebView2 process memory
on:
  push:
    branches: [qualification/ktrade-w94b-native-visual-resources-20261030]
    paths: [.github/workflows/ktrade-w94b-native-visual-resources-windows.yml, qualification-harness/ktrade-w94b/Installed-Supertrend-Visual-Resources.ps1]
permissions:
  contents: read
  actions: read
concurrency:
  group: ktrade-w94b-native-visual-resources-20261030
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: windows-2022
    timeout-minutes: 85
    env:
      GOWORK: 'off'
      GOFLAGS: '-p=2'
      GOMAXPROCS: '2'
      CGO_ENABLED: '1'
      GOTOOLCHAIN: 'local'
      KTRADE_LIVE_TRADING: 'false'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: witness
          persist-credentials: false
      - name: Previously Windows-qualified PR223 predecessor
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: spoonman136668-ai/ktrade
          ref: b03dd6e58b6120cae3ffd39a79c6965ab8e91b9a
          path: previous
          persist-credentials: false
          token: ${{ secrets.KTRADE_SOURCE_READ_TOKEN }}
      - name: Exact W90 catalog action candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: spoonman136668-ai/ktrade
          ref: cea559a5abc0136d1ca0dff16c313f8dac0477f2
          fetch-depth: 40
          path: candidate
          persist-credentials: false
          token: ${{ secrets.KTRADE_SOURCE_READ_TOKEN }}
      - name: Source custody prior W82 security regression and original harness AST
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows'){throw 'W83_HOSTED_WINDOWS_REQUIRED'}
          foreach($pin in @(@('previous','b03dd6e58b6120cae3ffd39a79c6965ab8e91b9a'),@('candidate','cea559a5abc0136d1ca0dff16c313f8dac0477f2'),@('witness',$env:GITHUB_SHA))){
            $p=Join-Path $env:GITHUB_WORKSPACE $pin[0]
            if((& git -C $p rev-parse HEAD).Trim() -cne $pin[1] -or @(& git -C $p status --porcelain).Count -ne 0){throw 'W83_SHA_OR_CLEAN_CUSTODY_DRIFT'}
          }
          if((& git -C (Join-Path $env:GITHUB_WORKSPACE 'candidate') rev-parse 'HEAD^{tree}').Trim() -cne 'a6076bc3c1e2bcae6b21c10a4ea810105a05bd7e'){throw 'W83_TREE_DRIFT'}
          foreach($dir in @('previous','candidate')){
            $p=Join-Path $env:GITHUB_WORKSPACE $dir
            if(Test-Path (Join-Path $p '.env')){throw 'W83_DOTENV_REFUSED'}
            $cfg=Get-Content (Join-Path $p 'config.json') -Raw|ConvertFrom-Json
            if($cfg.api_key.key_name -or $cfg.api_key.key_secret -or $cfg.account_id -or $cfg.ngrok_authtoken){throw 'W83_TRACKED_CREDENTIALS_REFUSED'}
            if((Get-Content (Join-Path $p 'pkg/advanced_orders.go') -Raw) -notmatch 'func liveBrokerageAuthorized\(\) bool \{ return false \}'){throw 'W83_LIVE_AUTHORITY_DRIFT'}
          }
          $run=Invoke-RestMethod -Uri 'https://api.github.com/repos/spoonman136668-ai/Qualification-Forge/actions/runs/41071548527' -Headers @{Authorization=('Bearer '+$env:GITHUB_TOKEN);Accept='application/vnd.github+json'} -TimeoutSec 30
          if($run.status -cne 'completed' -or $run.conclusion -cne 'success' -or $run.head_sha -cne 'fa0a90b503a95b4422251c27a7d2ea19b4671a6e'){throw 'W83_W82_REPAIRED_CANDIDATE_NOT_ACCEPTED'}
          $dir=Join-Path $env:GITHUB_WORKSPACE 'witness/qualification-harness/ktrade-w83'
          foreach($file in Get-ChildItem $dir -Filter '*.ps1' -File){
            $tokens=$null;$errs=$null
            [void][Management.Automation.Language.Parser]::ParseFile($file.FullName,[ref]$tokens,[ref]$errs)
            if($errs.Count -ne 0){throw ('W83_HARNESS_AST_FAILED_'+$file.Name)}
          }
          if(@(Get-ChildItem $dir -Filter '*.ps1' -File).Count -ne 4){throw 'W83_FOUR_HARNESSES_REQUIRED'}
          if((& git hash-object (Join-Path $dir 'Original-W40-Paper.ps1')).Trim() -cne 'c69c3c05ff7f4ef933856b036bfa23fbf0a760f1'){throw 'W83_ORIGINAL_W40_FINANCIAL_ASSERTIONS_DRIFT'}

          if((& git -C (Join-Path $env:GITHUB_WORKSPACE 'candidate') rev-parse HEAD~9).Trim() -cne '365a7085ccd86c3f917206fe2569aba51f00d8d0'){throw 'W93_EXACT_ACCEPTED_PR228_BASE_REQUIRED'}
          $allowed=@('templates/chart.tmpl','pkg/catalog_supertrend_numeric_test.go','tests/rb3_w90_catalog_actions.test.cjs')
          $changed=@(& git -C (Join-Path $env:GITHUB_WORKSPACE 'candidate') diff --name-only '365a7085ccd86c3f917206fe2569aba51f00d8d0' HEAD)
          if($changed.Count -ne 3 -or @($changed|Where-Object {$_ -cnotin $allowed}).Count -ne 0){throw 'W93_EXACT_THREE_PATH_PINE_UI_ONLY_DELTA_REQUIRED'}
          $accepted=Join-Path $env:GITHUB_WORKSPACE 'witness/qualification-receipts/ktrade-w92-supertrend-numeric-windows-20261030.json'
          if((& git hash-object $accepted).Trim() -cne '767d0be06984b8859dd50401d604cfb4ca5f751e'){throw 'W93_W92_NUMERIC_RECEIPT_BLOB_DRIFT'}
          $numeric=Get-Content $accepted -Raw|ConvertFrom-Json
          if($numeric.verdict -cne 'PASS_SCOPED_PINNED_WINDOWS_SUPERTREND_PINE_V5_V6_NUMERICAL' -or
             $numeric.source_sha -cne '12dee92974b526bf2996f4d1eee3bef6d1badd78' -or
             $numeric.verified_results.numeric_pass -ne 10){throw 'W93_W92_NUMERIC_SOURCE_NOT_ACCEPTED'}
          $proof=Invoke-RestMethod -Uri 'https://api.github.com/repos/spoonman136668-ai/Qualification-Forge/actions/runs/41154205327' -Headers @{Authorization=('Bearer '+$env:GITHUB_TOKEN);Accept='application/vnd.github+json'} -TimeoutSec 30
          if($proof.status -cne 'completed' -or $proof.conclusion -cne 'success' -or $proof.head_sha -cne 'a58ae38fd77ab47b3985945fb3f93d79ec4c38cc'){throw 'W93_W92_RAW_WINDOWS_PROOF_DRIFT'}
          # Require immutable previously accepted W94A renderer proof and exact source.
          $w94AReceipt=Join-Path $env:GITHUB_WORKSPACE 'witness/qualification-receipts/ktrade-w94a-supertrend-renderer-windows-20261030.json'
          if((& git -C (Join-Path $env:GITHUB_WORKSPACE 'witness') rev-parse 'HEAD:qualification-receipts/ktrade-w94a-supertrend-renderer-windows-20261030.json').Trim() -cne '926ae5b11ee53eb0e9c522edffe5ea51418d9dd2'){throw 'W94B_W94A_RECEIPT_BLOB_DRIFT'}
          $w94A=Get-Content $w94AReceipt -Raw|ConvertFrom-Json
          if($w94A.verdict -cne 'PASS_SCOPED_PINNED_WINDOWS_RENDERER_DATA_ALIGNMENT' -or
             $w94A.source_sha -cne 'cea559a5abc0136d1ca0dff16c313f8dac0477f2'){throw 'W94B_W94A_SOURCE_GATE_DRIFT'}
          $w94AProof=Invoke-RestMethod -Uri 'https://api.github.com/repos/spoonman136668-ai/Qualification-Forge/actions/runs/41159034883' -Headers @{Authorization=('Bearer '+$env:GITHUB_TOKEN);Accept='application/vnd.github+json'} -TimeoutSec 30
          if($w94AProof.status -cne 'completed' -or $w94AProof.conclusion -cne 'success' -or $w94AProof.head_sha -cne '04b6ca4aa5186ffe8bb99b731416e07cfa55111d'){throw 'W94B_W94A_RAW_RUN_NOT_ACCEPTED'}
          if((& git -C (Join-Path $env:GITHUB_WORKSPACE 'witness') rev-parse 'HEAD:qualification-harness/ktrade-w94b/Installed-Supertrend-Visual-Resources.ps1').Trim() -cne '84ba54cbd430e72c749d9d3eeeb9b15886cd0afe'){throw 'W94B_EXACT_NATIVE_VISUAL_HARNESS_DRIFT'}
          $w93Proof=Invoke-RestMethod -Uri 'https://api.github.com/repos/spoonman136668-ai/Qualification-Forge/actions/runs/41157406050' -Headers @{Authorization=('Bearer '+$env:GITHUB_TOKEN);Accept='application/vnd.github+json'} -TimeoutSec 30
          if($w93Proof.status -cne 'completed' -or $w93Proof.conclusion -cne 'success' -or $w93Proof.head_sha -cne '4a4cccae79904ebfe9eae0838799bcfbaeb23ea2'){throw 'W94B_EXACT_W93_FULL_REGRESSION_NOT_ACCEPTED'}
          $w93Receipt=Join-Path $env:GITHUB_WORKSPACE 'witness/qualification-receipts/ktrade-w93-supertrend-native-windows-20261030.json'
          if((& git -C (Join-Path $env:GITHUB_WORKSPACE 'witness') rev-parse 'HEAD:qualification-receipts/ktrade-w93-supertrend-native-windows-20261030.json').Trim() -cne '77539dc43016887b9c7cb2340d310cdc1e7e9cbc'){throw 'W94B_W93_FULL_RECEIPT_DRIFT'}
          $w93=Get-Content $w93Receipt -Raw|ConvertFrom-Json
          if($w93.source_sha -cne 'cea559a5abc0136d1ca0dff16c313f8dac0477f2'){throw 'W94B_W93_FULL_SOURCE_DRIFT'}
          if((& git -C (Join-Path $env:GITHUB_WORKSPACE 'witness') rev-parse 'HEAD:qualification-harness/ktrade-w93/Build-And-Qualify.ps1').Trim() -cne 'da7555e19149b29fb9f393da616509c903015039'){throw 'W94B_SOURCE_OWNED_BUILDER_DRIFT'}
          Write-Host '::notice::W94B_IDENTICAL_SOURCE_W93_FULL_GO_NODE_NATIVE_REGRESSION_REUSED_NO_PRODUCT_CHANGE=PASS'
          Write-Host '::notice::W94B_W94A_PINNED_SOURCE_AND_NATIVE_HARNESS=PASS'
          $native=Join-Path $env:GITHUB_WORKSPACE 'witness/qualification-harness/ktrade-w94b/Installed-Supertrend-Visual-Resources.ps1'
          $tokens=$null;$errors=$null
          [void][Management.Automation.Language.Parser]::ParseFile($native,[ref]$tokens,[ref]$errors)
          if($errors.Count -ne 0){throw 'W93_NATIVE_HARNESS_AST_INVALID'}
          Write-Host '::notice::W93_EXACT_PR228_THREE_CHANGED_PATHS_W92_PINNED_NUMERIC_AND_NATIVE_AST=PASS'
          $pins=@(
            @('static/watchlist_manager.js','36b1eb163d245ce98510d2a2376c4612a0e4faf5'),
            @('static/layout_manager.js','35b892974e73257393c0b5e523d564f519056d40'),
            @('static/indicator_library.js','b1272eb9a6f54ec1e40b019788a1e0a202fd09ab'),
            @('static/indicator_browser.js','278729c39feadea7b3ec0d51659c9f7ad9211ed0')
          )
          foreach($pin in $pins){foreach($root in @('previous','candidate')){
            if((& git -C (Join-Path $env:GITHUB_WORKSPACE $root) rev-parse ('HEAD:'+$pin[0])).Trim() -cne $pin[1]){throw 'W90_ORIGINAL_BROWSER_READER_DRIFT'}
          }}
          Write-Host '::notice::W90_EXACT_PRESENTATION_PACKAGING_ONLY_DELTA_ORIGINAL_ENGINE_AND_MODULES_W82_REUSE=PASS'
          Write-Host '::notice::W83_EXACT_SOURCES_W82_ACCEPTED_ORIGINAL_SCENARIO_AST_LIVE_DISABLED=PASS'
      - name: Windows PowerShell installer core module boundary preflight
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $ps51=Join-Path $env:WINDIR 'System32/WindowsPowerShell/v1.0/powershell.exe'
          $saved=$env:PSModulePath
          try{
            $env:PSModulePath=Join-Path (Split-Path -Parent $ps51) 'Modules'
            & $ps51 -NoProfile -NonInteractive -Command 'Get-Command Get-FileHash -ErrorAction Stop|Out-Null'
            if($LASTEXITCODE -ne 0){throw 'W83_NATIVE_PS51_FILE_HASH_UNAVAILABLE'}
          }finally{$env:PSModulePath=$saved}
          Write-Host '::notice::W83_PS7_PS51_SCOPED_CORE_MODULE_BOUNDARY=PASS'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Real unsigned install upgrade native paper Stop cold and rollback
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:TEMP=$env:RUNNER_TEMP;$env:TMP=$env:RUNNER_TEMP
          $h=Join-Path $env:GITHUB_WORKSPACE 'witness/qualification-harness/ktrade-w83'
          $probeLog=Join-Path $env:RUNNER_TEMP 'w94b-actual-native-output.txt'
          & (Join-Path $env:GITHUB_WORKSPACE 'witness/qualification-harness/ktrade-w93/Build-And-Qualify.ps1') -PreviousCheckout (Join-Path $env:GITHUB_WORKSPACE 'previous') -CandidateCheckout (Join-Path $env:GITHUB_WORKSPACE 'candidate') -WitnessScript (Join-Path $env:GITHUB_WORKSPACE 'witness/qualification-harness/ktrade-w94b/Installed-Supertrend-Visual-Resources.ps1') -NativeInputsPath (Join-Path $h 'Original-W40-Native-Inputs.ps1') -PaperScenarioPath (Join-Path $h 'Original-W40-Paper.ps1') 2>&1 | Tee-Object -FilePath $probeLog
          if($LASTEXITCODE -ne 0 -or !$?){throw 'W83_REAL_INSTALLED_CURRENT_MARKET_PAPER_AND_ROLLBACK_FAILED'}
          # Actual execution coverage is mandatory. Defined-but-uncalled probes
          # must never turn a green lifecycle run into visual/memory acceptance.
          $observed=@(Get-Content -LiteralPath $probeLog)
          function ProbeJson([string]$prefix,[int]$count){
            $rows=@($observed|Where-Object {$_ -is [string] -and $_.StartsWith($prefix,[StringComparison]::Ordinal)})
            if($rows.Count -ne $count){throw ('W94B_REQUIRED_ACTUAL_PROBE_OUTPUT_MISSING_'+$prefix)}
            return @($rows|ForEach-Object {$_.Substring($prefix.Length)|ConvertFrom-Json -ErrorAction Stop})
          }
          $screens=@(ProbeJson 'W94B_PRICE_CHART_SCREEN_DIGEST=' 2)
          if(@($screens|Where-Object {$_.phase -ceq 'BEFORE_SUPERTREND'}).Count -ne 1 -or @($screens|Where-Object {$_.phase -ceq 'AFTER_SUPERTREND'}).Count -ne 1){throw 'W94B_BOTH_REAL_SCREEN_PHASES_REQUIRED'}
          $comparison=@(ProbeJson 'W94B_REAL_PRICE_PANE_COMPARISON=' 1)[0]
          if(!$comparison.identical_bounds -or $comparison.pixel_sample_count -lt 500 -or $comparison.changed_sample_count -lt 15 -or $comparison.before_sha256 -ceq $comparison.after_sha256){throw 'W94B_ACTUAL_PANE_PIXEL_DELTA_REQUIRED'}
          foreach($prefix in @('W94B_PROCESS_TREE_BEFORE=','W94B_PROCESS_TREE_AFTER=')){
            $p=@(ProbeJson $prefix 1)[0]
            if($p.webview2_count -lt 1 -or $p.process_count -ne @($p.members).Count -or $p.total_working_set_bytes -le 0){throw 'W94B_COMPLETE_REAL_PROCESS_MEASUREMENT_REQUIRED'}
            $sum=[long]0;foreach($member in $p.members){$sum+=[long]$member.working_set_bytes}
            if($sum -ne [long]$p.total_working_set_bytes){throw 'W94B_PROCESS_TOTAL_MISMATCH'}
          }
          if(@($observed|Where-Object {$_ -ceq '::notice::W94B_ACTIVE_PIXEL_AND_WEBVIEW_PROCESS_PROBES_EXECUTED=PASS'}).Count -ne 1){throw 'W94B_ACTUAL_PROBE_COMPLETION_REQUIRED'}
          Write-Host '::notice::W94B_ACTUAL_OUTPUT_COVERAGE_ENFORCED_PANE_DIFFERENCE_AND_ALL_OBSERVED_DESCENDANT_MEMORY=PASS'
          Write-Host '::notice::W83_REAL_INSTALLED_UPGRADE_FOUR_CURRENT_NATIVE_PAPER_FILLS_STOP_COLD_ACCOUNT_ROLLBACK_HISTORY_RETAINED=PASS'
      - name: Source custody and no production authority final
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($dir in @('previous','candidate')){
            $p=Join-Path $env:GITHUB_WORKSPACE $dir
            if(@(& git -C $p status --porcelain --untracked-files=no).Count -ne 0){throw 'W83_TRACKED_SOURCE_CHANGED'}
          }
          Write-Host '::notice::W83_HOSTED_EPHEMERAL_SYNTHETIC_DATA_PUBLIC_CANDLES_ONLY_NO_OWNER_INSTALL_NO_REAL_ORDERS_NO_LIVE_NO_RELEASE'
