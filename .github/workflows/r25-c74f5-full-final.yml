        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($item in @(
            @{Name='original';Sha=$env:ORIGINAL_SHA},
            @{Name='candidate';Sha=$env:VERIFIED_SHA}
          )){
            $path=Join-Path $env:GITHUB_WORKSPACE $item.Name
            if(Test-Path -LiteralPath $path){
              if((& git -C $path rev-parse HEAD).Trim() -cne $item.Sha -or
                 @(& git -C $path diff --name-only HEAD --).Count -ne 0){
                throw ('C74F5_ORIGINAL_SOURCE_MUTATED_'+$item.Name)
              }
            }
          }
          Write-Host 'C74F5_NO_OWNER_DATA_AND_NO_TRADING_ACCESS=PASS'
 ./cmd/ktrade
          if($LASTEXITCODE -ne 0){throw 'C74F5_ORIGINAL_GENUINE_CHROMIUM_FAILED'}
          Write-Host 'C74F5_REAL_ORIGINAL_OPERATOR_CHROMIUM=PASS'
          Write-Host 'C74F5_ACCOUNT_SOURCE_IN_CI=FALSE'
          Write-Host 'C74F5_PAPER_AND_LIVE_BROKER_ACTIVATION=FALSE'
      - name: Verify only untracked test staged on frozen original
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($item in @(
            @{Name='original';Sha=$env:ORIGINAL_SHA},
            @{Name='candidate';Sha=$env:VERIFIED_SHA}
          )){
            $path=Join-Path $env:GITHUB_WORKSPACE $item.Name
            if(Test-Path -LiteralPath $path){
              if((& git -C $path rev-parse HEAD).Trim() -cne $item.Sha -or
                 @(& git -C $path diff --name-only HEAD --).Count -ne 0){
                throw ('C74F5_ORIGINAL_SOURCE_MUTATED_'+$item.Name)
              }
            }
          }
          Write-Host 'C74F5_NO_OWNER_DATA_AND_NO_TRADING_ACCESS=PASS'
