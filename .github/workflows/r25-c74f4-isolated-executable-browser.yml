name: R25-C74F4 Isolated original executable and Chromium acceptance
on:
  push:
    branches:
      - qualification/r25-c74f4-isolated-executable-browser-20261020
    paths:
      - .github/workflows/r25-c74f4-isolated-executable-browser.yml
permissions:
  contents: read
concurrency:
  group: r25-c74f4-diagnostic-original-browser
  cancel-in-progress: false
jobs:
  original-browser:
    if: github.repository == 'spoonman136668-ai/Qualification-Forge'
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      SOURCE_SHA: 798be4d4650afd04125c3c70e26b19c8024e10ea
      SOURCE_TREE: 6c7fad1f690ba7738891ab76282b3ba7de195414
      GOFLAGS: -p=2
      GOMAXPROCS: '2'
      KTRADE_CI_PAPER_ONLY: '1'
      KTRADE_CI_LIVE_AUTHORITY: '0'
      KTRADE_CI_COINBASE_ALLOWED: '0'
      KTRADE_CI_PROMOTION_ALLOWED: '0'
    steps:
      - name: Enforce GitHub-hosted Windows and paper-only review
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/Qualification-Forge' -or
             $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows' -or
             $env:KTRADE_CI_PAPER_ONLY -cne '1' -or $env:KTRADE_CI_LIVE_AUTHORITY -cne '0' -or
             $env:KTRADE_CI_COINBASE_ALLOWED -cne '0' -or $env:KTRADE_CI_PROMOTION_ALLOWED -cne '0'){
            throw 'R25_C74F4_UNQUALIFIED_HOST_OR_TRADING_AUTHORITY'
          }
          Write-Host 'R25_C74F4_ISOLATED_HOST=PASS'
      - name: Read-only exact KTRADE candidate checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: spoonman136668-ai/ktrade
          ref: 798be4d4650afd04125c3c70e26b19c8024e10ea
          fetch-depth: 1
          path: source
          token: ${{ secrets.KTRADE_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - name: Verify original source identity
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference='Stop'
          if((& git rev-parse HEAD).Trim() -cne $env:SOURCE_SHA -or
             (& git rev-parse 'HEAD^{tree}').Trim() -cne $env:SOURCE_TREE -or
             @(& git status --porcelain=v1 --untracked-files=all).Count -ne 0){
            throw 'R25_C74F4_SOURCE_IDENTITY_DRIFT'
          }
          Write-Host 'R25_C74F4_EXACT_SOURCE_TREE=PASS'
      - name: Pinned Go 1.23.12 toolchain
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.23.12'
          cache: false
      - name: Focused recovered operator and source binding checks
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference='Stop'
          & go test -mod=readonly -tags=ktrade_full -count=1 -timeout=6m -run '^TestR25C74F3' ./cmd/ktrade
          if($LASTEXITCODE -ne 0){throw 'R25_C74F4_OPERATOR_SOURCE_GATES_FAILED'}
          Write-Host 'R25_C74F4_FOCUSED_SOURCE_AND_HTTP_ACCEPTANCE=PASS'
      - name: Focused app and custody vet
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference='Stop'
          & go vet -mod=readonly -tags=ktrade_full ./cmd/ktrade ./internal/durableupgrade
          if($LASTEXITCODE -ne 0){throw 'R25_C74F4_FOCUSED_VET_FAILED'}
          Write-Host 'R25_C74F4_FOCUSED_VET=PASS'
      - name: Build isolated ktrade exe with authentic recovered assets
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP 'r25c74f4-original-app'
          if(Test-Path -LiteralPath $out){throw 'R25_C74F4_UNEXPECTED_ARTIFACT_COLLISION'}
          New-Item -ItemType Directory -Path $out | Out-Null
          & go build -mod=readonly -tags=ktrade_full -o (Join-Path $out 'ktrade.exe') ./cmd/ktrade
          if($LASTEXITCODE -ne 0){throw 'R25_C74F4_EXE_BUILD_FAILED'}
          foreach($folder in @('static','templates','strategies','recovery')){
            Copy-Item -LiteralPath $folder -Destination $out -Recurse -ErrorAction Stop
          }
          foreach($rel in @(
            'static/recovery_history.html',
            'recovery/operator-donor-v11110/strategy.html',
            'recovery/operator-donor-v11110/app.js',
            'recovery/operator-bridge/historical-review.js',
            'recovery/operator-bridge/operator-navigation-acceptance.js',
            'recovery/operator-bridge/operator-chart-navigation.js',
            'recovery/operator-bridge/operator-control-review.js'
          )){
            if(!(Test-Path -LiteralPath (Join-Path $out $rel) -PathType Leaf)){
              throw 'R25_C74F4_ORIGINAL_RECOVERED_ASSET_MISSING'
            }
          }
          Write-Host 'R25_C74F4_ISOLATED_WINDOWS_EXE_AND_ORIGINAL_ASSETS=PASS'
      - name: Genuine browser engine chart interactions and workspace
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference='Stop'
          $env:KTRADE_R25C74D_APP_EXE=Join-Path (Join-Path $env:RUNNER_TEMP 'r25c74f4-original-app') 'ktrade.exe'
          & go test -mod=readonly -tags=ktrade_full -count=1 -timeout=6m -run '^TestR25C74DPackagedRealBrowserChartGestures$' ./cmd/ktrade
          if($LASTEXITCODE -ne 0){throw 'R25_C74F4_ORIGINAL_CHROMIUM_INTERACTIONS_FAILED'}
          Write-Host 'R25_C74F4_GENUINE_CHROMIUM_ORIGINAL_UI=PASS'
      - name: Assert zero product mutation and no release admission
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $repo=Join-Path $env:GITHUB_WORKSPACE 'source'
          if(Test-Path -LiteralPath (Join-Path $repo '.git')){
            if((& git -C $repo rev-parse HEAD).Trim() -cne $env:SOURCE_SHA -or
               @(& git -C $repo status --porcelain=v1 --untracked-files=no).Count -ne 0){
              throw 'R25_C74F4_PRODUCT_SOURCE_MUTATED'
            }
          }
          Write-Host 'R25_C74F4_OWNER_PROFILE_ACCESSED=FALSE'
          Write-Host 'R25_C74F4_FULL_REGRESSION_REMAINS_BLOCKED=TRUE'
          Write-Host 'R25_C74F4_PAPER_START_STOP_SAVE_AUTHORIZED=FALSE'
          Write-Host 'R25_C74F4_RELEASE_AUTHORIZED=FALSE'
