name: KTRADE DIC-13 real Brave browser and ZIP privacy acceptance
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ktrade-dic13-one-shot.yml
permissions:
  contents: write

jobs:
  dic13-brave:
    if: github.repository == 'spoonman136668-ai/Qualification-Forge' && github.actor == 'spoonman136668-ai'
    runs-on: windows-2022
    timeout-minutes: 65
    env:
      EXPECTED_SHA: '117d2dea5e7c348c196c97aca2e947e8c1ce0f6a'
      KTRADE_CI_SOURCE_ONLY: '1'
      KTRADE_CI_PAPER_ONLY: '1'
      KTRADE_CI_LIVE_AUTHORITY: '0'
      KTRADE_CI_COINBASE_ALLOWED: '0'
      KTRADE_CI_PROMOTION_ALLOWED: '0'
      GOFLAGS: '-p=2'
      GOMAXPROCS: '2'

    steps:
      - name: Require isolated Windows worker
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_OS -cne 'Windows' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted'){throw 'DIC13_NOT_HOSTED_WINDOWS'}
          Write-Host 'DIC13_HOSTED_WINDOWS=PASS'

      - name: Read public qualification harness only
        uses: actions/checkout@v4
        with:
          path: qual-public
          persist-credentials: false

      - name: Checkout exact private KTRADE draft-review source
        uses: actions/checkout@v4
        with:
          repository: spoonman136668-ai/ckb
          ref: 117d2dea5e7c348c196c97aca2e947e8c1ce0f6a
          path: checked-private
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.KTRADE_CKB_READ_TOKEN_TEMP }}

      - name: Install disposable Brave and Playwright without public test data
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $log=Join-Path $env:RUNNER_TEMP 'dic13-private-install.log'
          try{
            & choco install brave --yes --no-progress --limit-output *> $log
            if($LASTEXITCODE -ne 0){throw 'CHOCOLATEY_BRAVE_INSTALL_FAILED'}
            $paths=@(
              (Join-Path $env:ProgramFiles 'BraveSoftware/Brave-Browser/Application/brave.exe'),
              (Join-Path ${env:ProgramFiles(x86)} 'BraveSoftware/Brave-Browser/Application/brave.exe'),
              (Join-Path $env:LOCALAPPDATA 'BraveSoftware/Brave-Browser/Application/brave.exe')
            )
            $match=@($paths|Where-Object{Test-Path -LiteralPath $_})|Select-Object -First 1
            if(-not $match){throw 'BRAVE_EXE_NOT_INSTALLED'}
            $sign=Get-AuthenticodeSignature -FilePath $match
            if($sign.Status -ne 'Valid' -or $sign.SignerCertificate.Subject -notmatch 'Brave Software'){throw 'BRAVE_BINARY_SIGNATURE_INVALID'}
            'DIC13_BRAVE_PATH=' + $match >> $env:GITHUB_ENV
            Write-Host 'DIC13_SIGNED_BRAVE_INSTALLED=PASS'
            & python -m pip install --disable-pip-version-check --no-input 'playwright==1.56.0' *> $log
            if($LASTEXITCODE -ne 0){throw 'PLAYWRIGHT_INSTALL_FAILED'}
            & python -m py_compile (Join-Path $env:GITHUB_WORKSPACE 'qual-public/qualification/dic13_browser.py') *> $log
            if($LASTEXITCODE -ne 0){throw 'DIC13_PYTHON_PARSE_FAILED'}
            Write-Host 'DIC13_BROWSER_HARNESS_READY=PASS'
          }catch{throw 'DIC13_BROWSER_DEPENDENCY_SETUP_FAILED_OUTPUT_WITHHELD'}
          finally{Remove-Item -LiteralPath $log -Force -ErrorAction SilentlyContinue}

      - name: Run real Brave actions inside existing synthetic firewall-gated package
        shell: pwsh
        env:
          DIC13_BRAVE_PATH: ${{ env.DIC13_BRAVE_PATH }}
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          $root=Join-Path $env:GITHUB_WORKSPACE 'checked-private'
          $privateLog=Join-Path $env:RUNNER_TEMP 'dic13-private-run.log'
          $harness=Join-Path $root 'windows/ktrade-dic10-synthetic-installed-combined.ps1'
          $tempHarness=Join-Path $root 'windows/ktrade-dic13-temp-harness.ps1'
          $scratch=Join-Path $env:RUNNER_TEMP 'dic13-disposable-runtime'
          $env:DIC13_PY=Join-Path $env:GITHUB_WORKSPACE 'qual-public/qualification/dic13_browser.py'
          $env:DIC13_BRAVE=$env:DIC13_BRAVE_PATH
          $env:DIC13_PROFILE=Join-Path $env:RUNNER_TEMP 'dic13-disposable-brave-profile'
          $env:DIC13_SCRATCH=Join-Path $env:RUNNER_TEMP 'dic13-disposable-downloads'
          Push-Location $root
          try{
            $sha=(& git rev-parse HEAD).Trim()
            if($LASTEXITCODE -ne 0 -or $sha -cne $env:EXPECTED_SHA){throw 'DIC13_PINNED_SHA_INVALID'}
            if(@(& git status --porcelain=v1 --untracked-files=no).Count -ne 0){throw 'DIC13_SOURCE_DIRTY_PRE'}
            Write-Host 'DIC13_EXACT_REVIEW_SHA=PASS'
            $original=[IO.File]::ReadAllText($harness)
            $needle="  Mark 'COMBINED_PINE_IMPORT_AND_FAVORITES_SAVED'"
            if($original.IndexOf($needle,[StringComparison]::Ordinal) -lt 0){throw 'DIC13_QUALIFIED_HARNESS_ANCHOR_MISSING'}
            $injection=@'
          $Phase='DIC13_REAL_BRAVE'
          $canaryPath=Join-Path $App 'data/logs/ktrade.log'
          New-Item -ItemType Directory -Path (Split-Path -Parent $canaryPath) -Force|Out-Null
          [IO.File]::AppendAllText($canaryPath,("api_key: DIC13_PRIVATE_CANARY_NEVER_EXPORT" + [Environment]::NewLine))
          & python $env:DIC13_PY $env:DIC13_BRAVE $env:DIC13_PROFILE $env:DIC13_SCRATCH
          Assert ($LASTEXITCODE -eq 0) 'DIC13_BRAVE_OR_PRIVACY_NEGATIVE'
          '@
            $injection=($injection -split "\r?\n"|ForEach-Object{$_.TrimStart()}) -join "`n"
            $injection="  "+($injection -replace "`n","`n  ")
            $patched=$original.Replace($needle,$needle+"`n"+$injection)
            if($patched -ceq $original){throw 'DIC13_PATCH_INJECTION_FAILED'}
            [IO.File]::WriteAllText($tempHarness,$patched,[Text.Encoding]::UTF8)
            $tokens=$null;$errors=$null
            $null=[Management.Automation.Language.Parser]::ParseFile($tempHarness,[ref]$tokens,[ref]$errors)
            if(@($errors).Count -gt 0){throw 'DIC13_TEMP_HARNESS_PARSE_FAILED'}
            Write-Host 'DIC13_UNMODIFIED_QUALIFIED_HARNESS_REUSED=PASS'
            & pwsh -NoLogo -NoProfile -File $tempHarness -ScratchRoot $scratch *> $privateLog
            $code=$LASTEXITCODE
            $lines=@(Get-Content -LiteralPath $privateLog -ErrorAction SilentlyContinue)
            $required=@(
              'DIC13_REAL_BRAVE_PAGE=PASS',
              'DIC13_BRAVE_INSPECT_CLICK=PASS',
              'DIC13_BRAVE_INCIDENT_SAVE_CLICK=PASS',
              'DIC13_BRAVE_INCIDENT_LIST_CLICK=PASS',
              'DIC13_BRAVE_INCIDENT_EXPORT_CLICK=PASS',
              'DIC13_BRAVE_SYNTHETIC_PRODUCT_SELECTED=PASS',
              'DIC13_ZIP_MANIFEST_HASHES_AND_PRIVACY=PASS',
              'DIC13_BRAVE_SUPPORT_EXPORT_CLICK=PASS',
              'DIC13_BRAVE_LOOPBACK_ONLY=PASS',
              'DIC07_DIC07_FULL_SYNTHETIC_OFFLINE_ACCEPTANCE=PASS'
            )
            foreach($marker in $required){
              if(@($lines|Where-Object{$_ -ceq $marker}).Count -eq 1){Write-Host $marker}
            }
            $allowedDIC07=@(
              'PACKAGED_FOUR_EXES_AND_MANIFEST','SYNTHETIC_SENTINELS','SYNTHETIC_CONFIG',
              'SYNTHETIC_KEY','FIREWALL_PROFILE','NO_BROKER_EGRESS_FIREWALL',
              'PACKAGED_EXE_LOCAL_OPERATOR_READY','INSTALLED_OPERATOR_PANEL',
              'INSTALLED_CSRF_REJECTS_UNAUTHORIZED_SAVE','INSTALLED_SAVE_LIST_EXPORT',
              'COMBINED_OPERATOR_PINE_AND_INCIDENT_UI','COMBINED_PINE_LIST_FETCHED',
              'COMBINED_PINE_IMPORT_AND_FAVORITES_SAVED',
              'INSTALLED_RESTART_PRESERVES_REPORT','COMBINED_PINE_AND_INCIDENT_RESTART_CONTINUITY'
            )
            foreach($name in $allowedDIC07){
              $line='DIC07_'+$name+'=PASS'
              if(@($lines|Where-Object{$_ -ceq $line}).Count -eq 1){Write-Host $line}
            }
            foreach($phase in @('INIT','SYNTHETIC_SENTINELS','SYNTHETIC_CONFIG','SYNTHETIC_KEY','FIREWALL_PROFILE','FIREWALL_RULE','APP_STARTUP','INSTALLED_CSRF_AND_UI','INSTALLED_INCIDENT_SAVE','DIC13_REAL_BRAVE','INSTALLED_RESTART','INSTALLED_TAMPER')){
              $line='DIC07_FAILURE_PHASE_'+$phase+'=FAIL'
              if(@($lines|Where-Object{$_ -ceq $line}).Count -eq 1){Write-Host $line}
            }
            if($code -ne 0){throw 'DIC13_REAL_BRAVE_ACCEPTANCE_FAILED_PRIVATE_DETAILS_WITHHELD'}
            foreach($marker in $required){
              if(@($lines|Where-Object{$_ -ceq $marker}).Count -ne 1){throw 'DIC13_REQUIRED_MARKER_MISSING'}
            }
            Write-Host 'DIC13_REAL_BRAVE_AND_SYNTHETIC_ZIP_ACCEPTED=PASS'
            if((& git rev-parse HEAD).Trim() -cne $env:EXPECTED_SHA){throw 'DIC13_HEAD_DRIFT'}
            if(@(& git status --porcelain=v1 --untracked-files=no).Count -ne 0){throw 'DIC13_TRACKED_SOURCE_MUTATED'}
            Write-Host 'DIC13_SOURCE_UNCHANGED=PASS'
          }finally{
            Pop-Location
            Remove-Item -LiteralPath $privateLog -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $tempHarness -Force -ErrorAction SilentlyContinue
            foreach($p in @($scratch,$env:DIC13_SCRATCH,$env:DIC13_PROFILE)){
              Remove-Item -LiteralPath $p -Recurse -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Purge private source with no artifact upload
        if: always()
        shell: pwsh
        run: |
          foreach($path in @('checked-private','qual-public')){
            $p=Join-Path $env:GITHUB_WORKSPACE $path
            if(Test-Path -LiteralPath $p){Remove-Item -LiteralPath $p -Recurse -Force -ErrorAction SilentlyContinue}
          }
          Write-Host 'DIC13_PRIVATE_ARTIFACT_UPLOAD=DISABLED'

      - name: Record public run ID without private output
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_STATUS: ${{ job.status }}
        run: |
          $ErrorActionPreference='Stop'
          $data=[ordered]@{
            schema='ktrade.dic13.brave-windows-run.v1'
            run_id=$env:GITHUB_RUN_ID
            workflow_sha=$env:GITHUB_SHA
            source_sha=$env:EXPECTED_SHA
            job_status=$env:FINAL_STATUS
            no_private_artifacts=$true
          }|ConvertTo-Json -Compress
          $encoded=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($data+"`n"))
          $body=@{message='evidence: DIC-13 Brave acceptance run';content=$encoded;branch='main'}|ConvertTo-Json
          try{
            Invoke-RestMethod -Method Put -Uri 'https://api.github.com/repos/spoonman136668-ai/Qualification-Forge/contents/qualification-evidence/dic13-last-run.json' -ContentType 'application/json' -Headers @{
              Authorization=('Bearer '+$env:GH_TOKEN)
              Accept='application/vnd.github+json'
              'X-GitHub-Api-Version'='2022-11-28'
            } -Body $body -TimeoutSec 30|Out-Null
          }catch{throw 'DIC13_PUBLIC_RUN_REFERENCE_FAILED'}
          Write-Host 'DIC13_RUN_REFERENCE_RECORDED=PASS'
