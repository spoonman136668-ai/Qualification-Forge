name: KTRADE full recovery isolated Windows source qualification

on:
  push:
    branches:
      - qualification/ktrade-full-recovery-win-20261017
    paths:
      - .github/workflows/ktrade-full-recovery-windows.yml

permissions:
  contents: read

jobs:
  historical-full-app:
    if: >-
      github.repository == 'spoonman136668-ai/Qualification-Forge' &&
      github.actor == 'spoonman136668-ai' &&
      github.ref == 'refs/heads/qualification/ktrade-full-recovery-win-20261017'
    runs-on: windows-2022
    timeout-minutes: 55
    env:
      EXPECTED_SOURCE_SHA: '2ff2d4fc8de8287e8dc588b9f36e24bce77ee06a'
      EXPECTED_SOURCE_TREE: 'f39d26e13a1d7da440b239dcc4f59dd9dca74a13'
      KTRADE_CI_SOURCE_ONLY: '1'
      KTRADE_CI_PAPER_ONLY: '1'
      KTRADE_CI_LIVE_AUTHORITY: '0'
      KTRADE_CI_COINBASE_ALLOWED: '0'
      KTRADE_CI_PROMOTION_ALLOWED: '0'
      KTRADE_USE_LEGACY_CDP_CONFIG: '0'
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
    steps:
      - name: Verify isolated GitHub-hosted Windows and private source access
        shell: pwsh
        env:
          KTRADE_READ_TOKEN: ${{ secrets.KTRADE_SOURCE_READ_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_OS -cne 'Windows' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted') {
            throw 'KTRADE_WRONG_QUALIFICATION_ENVIRONMENT'
          }
          if ($env:KTRADE_CI_COINBASE_ALLOWED -cne '0' -or $env:KTRADE_CI_LIVE_AUTHORITY -cne '0' -or $env:KTRADE_CI_PROMOTION_ALLOWED -cne '0') {
            throw 'KTRADE_LIVE_AUTHORITY_UNSAFE'
          }
          if ([string]::IsNullOrWhiteSpace($env:KTRADE_READ_TOKEN)) {
            throw 'KTRADE_SOURCE_READ_TOKEN_SECRET_MISSING'
          }
          $h = @{
            Authorization = ('Bearer ' + $env:KTRADE_READ_TOKEN)
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          # KTRADE-only read token. Do not probe unrelated private repositories.
          try {
            $uri = 'https://api.github.com/repos/spoonman136668-ai/ktrade/git/commits/' + $env:EXPECTED_SOURCE_SHA
            $v = Invoke-RestMethod -Method Get -Uri $uri -Headers $h -TimeoutSec 30
          } catch {
            throw 'QUALIFICATION_FORGE_KTRADE_REPOSITORY_READ_ACCESS_UNAVAILABLE'
          } finally {
            Remove-Variable h -ErrorAction SilentlyContinue
          }
          if ($v.sha -cne $env:EXPECTED_SOURCE_SHA -or $v.tree.sha -cne $env:EXPECTED_SOURCE_TREE) {
            throw 'QUALIFICATION_FORGE_KTRADE_SOURCE_IDENTITY_MISMATCH'
          }
          Remove-Variable v -ErrorAction SilentlyContinue
          Write-Output 'KTRADE_SOURCE_ACCESS_AND_TREE_IDENTITY=PASS'
          Write-Output 'PRIVATE_SOURCE_OUTPUT=WITHHELD'

      - name: Checkout exact private KTRADE source with ephemeral credentials
        uses: actions/checkout@v4
        with:
          repository: spoonman136668-ai/ktrade
          ref: 2ff2d4fc8de8287e8dc588b9f36e24bce77ee06a
          path: checked-private
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.KTRADE_SOURCE_READ_TOKEN }}

      - name: Set up pinned Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Run exact-source guard tests and full backend compilation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:GITHUB_WORKSPACE 'checked-private'
          $log = Join-Path $env:RUNNER_TEMP 'ktrade-private-qualification.log'
          $exe = Join-Path $env:RUNNER_TEMP 'ktrade-full-qualified.exe'
          Push-Location $root
          try {
            $actual = (& git rev-parse HEAD).Trim()
            $tree = (& git rev-parse 'HEAD^{tree}').Trim()
            if ($LASTEXITCODE -ne 0 -or $actual -cne $env:EXPECTED_SOURCE_SHA -or $tree -cne $env:EXPECTED_SOURCE_TREE) {
              throw 'KTRADE_EXACT_CHECKOUT_DRIFT'
            }
            if (@(& git status --porcelain=v1 --untracked-files=no).Count -ne 0) {
              throw 'KTRADE_CHECKOUT_DIRTY'
            }
            Write-Output 'KTRADE_EXACT_CHECKOUT=PASS'
            function RunPrivate([string]$label, [string[]]$argsList) {
              try {
                & go @argsList *> $log
                if ($LASTEXITCODE -ne 0) { throw 'private step failed' }
              } catch {
                throw ('KTRADE_' + $label + '_FAILED_PRIVATE_OUTPUT_WITHHELD')
              }
              Write-Output ('KTRADE_' + $label + '=PASS')
            }
            RunPrivate 'MODULE_DOWNLOAD' @('mod','download')
            RunPrivate 'PAPER_BROKERAGE_FOCUSED_TEST' @('test','-mod=readonly','-count=1','-timeout=600s','-run','^TestHistoricalAdvancedOrderManagerFailsClosedWithoutBrokerNetwork$','./pkg')
            RunPrivate 'FULL_WINDOWS_TAGGED_BUILD' @('build','-mod=readonly','-tags=ktrade_full','-o',$exe,'./cmd/ktrade')
            if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
              throw 'KTRADE_FULL_WINDOWS_EXE_MISSING'
            }
            $digest = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Output ("KTRADE_WINDOWS_FULL_EXE_SHA256=" + $digest)
            if (@(& git status --porcelain=v1 --untracked-files=no).Count -ne 0) {
              throw 'KTRADE_TRACKED_SOURCE_MUTATED'
            }
            Write-Output 'KTRADE_TRACKED_SOURCE_UNCHANGED=PASS'
            Write-Output 'KTRADE_BINARY_NOT_YET_EXECUTED=TRUE'
          } finally {
            Pop-Location
            Remove-Item -LiteralPath $log -Force -ErrorAction SilentlyContinue
          }

      - name: Launch packaged-layout historical backend on isolated loopback and verify real routes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:GITHUB_WORKSPACE 'checked-private'
          $exe = Join-Path $env:RUNNER_TEMP 'ktrade-full-qualified.exe'
          $stage = Join-Path $env:RUNNER_TEMP ('ktrade-isolated-' + $env:GITHUB_RUN_ID)
          $binary = Join-Path $stage 'ktrade.exe'
          $stdout = Join-Path $env:RUNNER_TEMP 'ktrade-isolated-stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'ktrade-isolated-stderr.log'
          $proc = $null
          $oldEnv = @{}
          foreach ($key in @('USERPROFILE','HOME','APPDATA','LOCALAPPDATA','KTRADE_RECOVERY_ISOLATED','KTRADE_USE_LEGACY_CDP_CONFIG')) {
            $oldEnv[$key] = [Environment]::GetEnvironmentVariable($key, 'Process')
          }
          try {
            if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'KTRADE_QUALIFIED_BINARY_MISSING' }
            New-Item -ItemType Directory -Path $stage -Force | Out-Null
            Copy-Item -LiteralPath $exe -Destination $binary
            foreach ($name in @('static','templates','strategies')) {
              $source = Join-Path $root $name
              if (-not (Test-Path -LiteralPath $source -PathType Container)) { throw 'KTRADE_HISTORIC_RESOURCE_MISSING' }
              Copy-Item -LiteralPath $source -Destination (Join-Path $stage $name) -Recurse -Force
            }
            foreach ($name in @('home','appdata','localappdata')) {
              New-Item -ItemType Directory -Path (Join-Path $stage $name) -Force | Out-Null
            }
            $env:USERPROFILE = Join-Path $stage 'home'
            $env:HOME = $env:USERPROFILE
            $env:APPDATA = Join-Path $stage 'appdata'
            $env:LOCALAPPDATA = Join-Path $stage 'localappdata'
            $env:KTRADE_USE_LEGACY_CDP_CONFIG = '0'
            $env:KTRADE_RECOVERY_ISOLATED = '1'
            $proc = Start-Process -FilePath $binary -WorkingDirectory $stage -PassThru -WindowStyle Hidden -RedirectStandardError $stderr -RedirectStandardOutput $stdout
            $addr = ''
            for ($i = 0; $i -lt 120; $i++) {
              if ($proc.HasExited) { throw 'KTRADE_ISOLATED_BACKEND_EXITED_BEFORE_READY' }
              if (Test-Path -LiteralPath $stderr -PathType Leaf) {
                $logText = Get-Content -LiteralPath $stderr -Raw -ErrorAction SilentlyContinue
                if ($logText -match 'KTRADE_ISOLATED_LISTEN=(127\.0\.0\.1:\d+)') {
                  $addr = $Matches[1]
                  break
                }
              }
              Start-Sleep -Milliseconds 500
            }
            if ([string]::IsNullOrWhiteSpace($addr)) { throw 'KTRADE_ISOLATED_BACKEND_READINESS_TIMEOUT' }
            $base = 'http://' + $addr
            Write-Output 'KTRADE_ISOLATED_LOOPBACK_STARTUP=PASS'
            foreach ($route in @('/','/ide','/chart')) {
              $resp = Invoke-WebRequest -Uri ($base + $route) -TimeoutSec 8
              if ([int]$resp.StatusCode -ne 200 -or -not ([string]$resp.Content -match 'KTRADE')) {
                throw 'KTRADE_HISTORIC_HTML_ROUTE_INVALID'
              }
            }
            Write-Output 'KTRADE_HISTORIC_UI_ROUTE_CONTENT=PASS'
            $static = Invoke-WebRequest -Uri ($base + '/static/pine_engine_ckb.js') -TimeoutSec 8
            if ([int]$static.StatusCode -ne 200 -or ([string]$static.Content).Length -lt 100) {
              throw 'KTRADE_PACKAGED_STATIC_PINE_ASSET_MISSING'
            }
            Write-Output 'KTRADE_PACKAGED_STATIC_ASSETS=PASS'
            $metrics = Invoke-RestMethod -Uri ($base + '/api/pine/metrics') -TimeoutSec 8
            $symbols = Invoke-RestMethod -Uri ($base + '/api/pine/symbols') -TimeoutSec 8
            if ($null -eq $metrics -or @($symbols.keywords).Count -lt 5) {
              throw 'KTRADE_PINE_DIAGNOSTICS_API_INVALID'
            }
            $sourceCode = "//@version=5" + [Environment]::NewLine + 'indicator("Synthetic Recovery")'
            $lintBody = @{code=$sourceCode} | ConvertTo-Json -Compress
            $lint = Invoke-RestMethod -Uri ($base + '/api/pine/lint') -Method Post -ContentType 'application/json' -Body $lintBody -TimeoutSec 8
            if ($null -eq $lint -or -not ($lint.PSObject.Properties.Name -contains 'diagnostics')) {
              throw 'KTRADE_PINE_LINT_API_INVALID'
            }
            Write-Output 'KTRADE_PINE_DIAGNOSTICS_AND_LINT=PASS'
            $body = @{workspace=@{symbol='BTC-USD';timeframe='1m';code=$sourceCode}} | ConvertTo-Json -Depth 5 -Compress
            $load = Invoke-RestMethod -Uri ($base + '/api/workspace/load') -Method Post -Body $body -ContentType 'application/json' -TimeoutSec 8
            $save = Invoke-RestMethod -Uri ($base + '/api/workspace/save') -Method Post -Body '{}' -ContentType 'application/json' -TimeoutSec 8
            if ($load.success -ne $true -or $save.success -ne $true -or $save.workspace.code -cne $sourceCode) {
              throw 'KTRADE_SYNTHETIC_WORKSPACE_ROUNDTRIP_FAILED'
            }
            Write-Output 'KTRADE_SYNTHETIC_WORKSPACE_ROUNDTRIP=PASS'
            $orderBody = @{product_id='BTC-USD'; side='BUY'; size='1'} | ConvertTo-Json -Compress
            $order = Invoke-WebRequest -Uri ($base + '/api/orders/place') -Method Post -Body $orderBody -ContentType 'application/json' -SkipHttpErrorCheck -TimeoutSec 8
            $orderJson = $order.Content | ConvertFrom-Json
            if ([int]$order.StatusCode -lt 400 -or [bool]$orderJson.success) {
              throw 'KTRADE_BROKERAGE_ENDPOINT_NOT_FAIL_CLOSED'
            }
            Write-Output 'KTRADE_LIVE_ORDER_ENDPOINT_REJECTED=PASS'
            if ($proc.HasExited) { throw 'KTRADE_ISOLATED_BACKEND_CRASHED' }
            Write-Output 'KTRADE_ISOLATED_RUNTIME_FUNCTIONAL_SMOKE=PASS'
          } finally {
            if ($null -ne $proc) {
              try { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue } catch {}
              try { $proc.WaitForExit(5000) | Out-Null } catch {}
              $proc.Dispose()
            }
            foreach ($key in $oldEnv.Keys) {
              [Environment]::SetEnvironmentVariable($key, $oldEnv[$key], 'Process')
            }
            Remove-Item -LiteralPath $stage -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $stdout,$stderr -Force -ErrorAction SilentlyContinue
          }

      - name: Validate historical desktop JavaScript syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:GITHUB_WORKSPACE 'checked-private'
          $log = Join-Path $env:RUNNER_TEMP 'ktrade-private-electron-check.log'
          try {
            & node --check (Join-Path $root 'electron/main.js') *> $log
            if ($LASTEXITCODE -ne 0) { throw 'Electron main failed' }
            & node --check (Join-Path $root 'electron/preload.js') *> $log
            if ($LASTEXITCODE -ne 0) { throw 'Electron preload failed' }
            Write-Output 'KTRADE_ELECTRON_SYNTAX=PASS'
          } catch {
            throw 'KTRADE_ELECTRON_SYNTAX_FAILED_PRIVATE_OUTPUT_WITHHELD'
          } finally {
            Remove-Item -LiteralPath $log -Force -ErrorAction SilentlyContinue
          }

      - name: Remove private checkout and prevent publication
        if: always()
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE 'checked-private'
          if (Test-Path -LiteralPath $source) {
            Remove-Item -LiteralPath $source -Force -Recurse -ErrorAction SilentlyContinue
          }
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'ktrade-full-qualified.exe') -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP ('ktrade-isolated-' + $env:GITHUB_RUN_ID)) -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'ktrade-isolated-stdout.log'),(Join-Path $env:RUNNER_TEMP 'ktrade-isolated-stderr.log') -Force -ErrorAction SilentlyContinue
          Write-Output 'KTRADE_PRIVATE_SOURCE_REMOVAL_ATTEMPTED=TRUE'
          Write-Output 'KTRADE_PUBLIC_BUILD_ARTIFACTS=DISABLED'
          Write-Output 'KTRADE_RELEASE_PROMOTION=FALSE'
