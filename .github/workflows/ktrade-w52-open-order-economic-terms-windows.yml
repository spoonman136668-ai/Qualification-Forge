name: KTRADE W52 bind OPEN-order quantity price and post-only amendments Windows
# W52 rejects stale/timed-out signed W52 double-read inventory without enabling LIVE.
permissions:
  contents: read
  actions: read
concurrency:
  group: ktrade-w52-open-order-economic-terms
  cancel-in-progress: true
on:
  push:
    branches: [qualification/ktrade-w52-open-order-economic-terms-20261029]
    paths: [.github/workflows/ktrade-w52-open-order-economic-terms-windows.yml]
jobs:
  qualify:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      GOWORK: 'off'
      GOFLAGS: '-p=2'
      GOMAXPROCS: '2'
      CGO_ENABLED: '1'
    steps:
      - name: Checkout qualification witness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: witness
          persist-credentials: false
      - name: Checkout exact private KTRADE candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: spoonman136668-ai/ktrade
          ref: 14cce5ba4ea8287622c3eba6e1286c72c34f28e1
          path: current
          fetch-depth: 32
          persist-credentials: false
          token: ${{ secrets.KTRADE_SOURCE_READ_TOKEN }}
      - name: Fail closed on source identity scope and clean custody
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows'){throw 'W32E_WRONG_RUNNER'}
          $src=Join-Path $env:GITHUB_WORKSPACE 'current'
          if((& git -C $src rev-parse HEAD).Trim() -cne '14cce5ba4ea8287622c3eba6e1286c72c34f28e1' -or (& git -C $src rev-parse 'HEAD^{tree}').Trim() -cne 'cc7dafc785ad4f43b56406eea1a5bc3923b8b3ba'){throw 'W32E_EXACT_SOURCE_DRIFT'}
          if(@(& git -C $src status --porcelain).Count -ne 0){throw 'W32E_DIRTY_SOURCE'}
          if((& git -C $src merge-base 14cce5ba4ea8287622c3eba6e1286c72c34f28e1 ca7c784fad7992f12907b5cf6086b6c0b7ac7da1).Trim() -cne 'ca7c784fad7992f12907b5cf6086b6c0b7ac7da1'){throw 'W52_W49_PARENT_DRIFT'}
          $diff=@(& git -C $src diff --name-only ca7c784fad7992f12907b5cf6086b6c0b7ac7da1 HEAD|Sort-Object)
          $expect=@('pkg/advanced_order_open_inventory.go','pkg/advanced_order_open_inventory_test.go','pkg/advanced_order_open_stability.go','pkg/advanced_order_open_stability_test.go','pkg/advanced_order_open_terms.go','pkg/advanced_order_open_terms_test.go'|Sort-Object)
          if(Compare-Object $diff $expect){throw 'W52_SIX_TERMS_BINDING_PATHS_DRIFT'}
          foreach($path in @('cmd','internal','static','templates','tests','tools','windows','go.mod','go.sum','package.json','package-lock.json','pkg/advanced_order_readiness.go','pkg/advanced_order_readiness_test.go','pkg/advanced_order_funding_screen.go','pkg/advanced_order_funding_screen_test.go','pkg/advanced_orders.go','pkg/advanced_order_once.go','pkg/advanced_order_auth.go','pkg/advanced_order_wire.go','pkg/advanced_order_exposure_screen.go','pkg/advanced_order_exposure_screen_test.go','pkg/advanced_order_open_reconciliation.go','pkg/advanced_order_open_reconciliation_test.go','pkg/advanced_order_bounded_open_inventory.go','pkg/advanced_order_bounded_open_inventory_test.go')){
            $current=(& git -C $src rev-parse ('HEAD:'+$path)).Trim()
            $prior=(& git -C $src rev-parse ('ca7c784fad7992f12907b5cf6086b6c0b7ac7da1:'+$path)).Trim()
            if($LASTEXITCODE -ne 0 -or $current -cne $prior){throw ('W52_FINANCIAL_AUTH_MAIN_OR_DEPENDENCY_DRIFT_'+$path)}
          }
          $broker=Get-Content -LiteralPath (Join-Path $src 'pkg/advanced_orders.go') -Raw
          if($broker -notmatch 'func liveBrokerageAuthorized\(\) bool \{ return false \}'){throw 'W52_SOURCE_LIVE_GATE_NOT_LOCKED'}
          Write-Output '::notice::W52_EXACT_SIX_TERMS_BINDING_FILES_AND_LIVE_SOURCE_FALSE=PASS'

      - name: Native Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: false
      - name: Frozen W51 negative control records the original same-ID terms blind spot
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $src=Join-Path $env:GITHUB_WORKSPACE 'current'
          $previous=Join-Path $env:RUNNER_TEMP ('ktrade-w52-predecessor-'+[guid]::NewGuid().ToString('N'))
          & git -C $src worktree add --detach $previous 'ca7c784fad7992f12907b5cf6086b6c0b7ac7da1'
          if($LASTEXITCODE -ne 0){throw 'W52_PREDECESSOR_CHECKOUT_FAILED'}
          try{
            if((& git -C $previous rev-parse HEAD).Trim() -cne 'ca7c784fad7992f12907b5cf6086b6c0b7ac7da1' -or (& git -C $previous rev-parse 'HEAD^{tree}').Trim() -cne 'c19e8bdce596d97b3beaa8c20dfaee0cd94dcf5a' -or @(& git -C $previous status --porcelain).Count -ne 0){throw 'W52_PREDECESSOR_NOT_CLEAN_PIN'}
            Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'witness/qualification-harness/w52-frozen-w51-terms-probe.go.txt') -Destination (Join-Path $previous 'pkg/w52_frozen_terms_probe_test.go')
            $dirty=@(& git -C $previous status --porcelain)
            if($dirty.Count -ne 1 -or $dirty[0] -cne '?? pkg/w52_frozen_terms_probe_test.go'){throw 'W52_UNEXPECTED_BASELINE_MUTATION'}
            Push-Location $previous
            try{
              & go test -mod=readonly -count=1 -v -run '^TestW52FrozenW51TermsBlindSpotObserved$' ./pkg
              if($LASTEXITCODE -ne 0){throw 'W52_SPECIFIC_FROZEN_BLIND_SPOT_NOT_REPRODUCED'}
            }finally{Pop-Location}
          }finally{
            & git -C $src worktree remove --force $previous
            if($LASTEXITCODE -ne 0){throw 'W52_PREDECESSOR_CLEANUP_FAILED'}
          }
          Write-Output '::notice::W52_FROZEN_W51_NEGATIVE_CONTROL_TERMS_BLIND_SPOT=OBSERVED'
      - name: Compile and run W52 same-ID quantity price and post-only amendment regressions
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Push-Location (Join-Path $env:GITHUB_WORKSPACE 'current')
          try{
            & gofmt -e pkg/advanced_order_open_inventory.go pkg/advanced_order_open_inventory_test.go pkg/advanced_order_open_stability.go pkg/advanced_order_open_stability_test.go pkg/advanced_order_open_terms.go pkg/advanced_order_open_terms_test.go | Out-Null
            if($LASTEXITCODE -ne 0){throw 'W52_GO_SOURCE_SYNTAX_FAILED'}
            & go test -mod=readonly -count=1 -run '^TestW52' ./pkg
            if($LASTEXITCODE -ne 0){throw 'W52_FOCUSED_COMPILER_OR_AUTHENTICATED_INVENTORY_FAILED'}
          }finally{Pop-Location}
          Write-Output '::notice::W52_FOCUSED_REPEAT_SIGNED_INVENTORY_TESTS=PASS'
      - name: Native Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Stage identical locked offline original chart and Monaco vendor
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $src=Join-Path $env:GITHUB_WORKSPACE 'current'
          Push-Location $src
          try{
            & npm ci --ignore-scripts --no-audit --no-fund --silent
            if($LASTEXITCODE -ne 0){throw 'W32E_VENDOR_LOCK_FAILURE'}
            & node scripts/stage_offline_vendor.cjs
            if($LASTEXITCODE -ne 0){throw 'W32E_VENDOR_STAGE_FAILURE'}
          }finally{Pop-Location}
          Write-Output '::notice::W52_IDENTICAL_LOCKED_FRONTEND_VENDOR_STAGE=PASS'
      - name: Signed order terms and W41-W52 affected-interface and race regressions
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:TEMP=$env:RUNNER_TEMP;$env:TMP=$env:RUNNER_TEMP
          Push-Location (Join-Path $env:GITHUB_WORKSPACE 'current')
          try{
            & go test -mod=readonly -count=1 -v -run '^Test(W41Advanced|W42Advanced|W43|W44|W45|W46|W47|W48|W49|W50|W51|W52|HistoricalAdvancedOrderManager)' ./internal/brokerintent ./internal/brokerprecision ./pkg
            if($LASTEXITCODE -ne 0){throw 'W52_REPEAT_INVENTORY_OR_PRIOR_DISARM_REGRESSION'}
            & go test -race -mod=readonly -count=1 -run '^TestW(4[1-9]|5[0-2])' ./internal/brokerintent ./internal/brokerprecision ./pkg
            if($LASTEXITCODE -ne 0){throw 'W52_REPEAT_INVENTORY_RACE_OR_DISARM_REGRESSION'}
          }finally{Pop-Location}
          Write-Output '::notice::W52_SIGNED_DOUBLE_INVENTORY_NEGATIVES_AND_PUBLIC_LIVE_DISABLED=PASS'
      - name: Fresh exact W52 full tagged app root Wails regression and vet
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:TEMP=$env:RUNNER_TEMP;$env:TMP=$env:RUNNER_TEMP
          $src=Join-Path $env:GITHUB_WORKSPACE 'current'
          Push-Location $src
          try{
            & go test -mod=readonly -count=1 -tags ktrade_full ./cmd/ktrade
            if($LASTEXITCODE -ne 0){throw 'P6_FULL_APP_REGRESSION_FAILED'}
            & go vet -mod=readonly -tags ktrade_full ./cmd/ktrade
            if($LASTEXITCODE -ne 0){throw 'P6_FULL_APP_VET_FAILED'}
            & go test -mod=readonly -count=1 ./...
            if($LASTEXITCODE -ne 0){throw 'P6_FULL_ROOT_REGRESSION_FAILED'}
            & go vet -mod=readonly ./...
            if($LASTEXITCODE -ne 0){throw 'P6_FULL_ROOT_VET_FAILED'}
          }finally{Pop-Location}
          Push-Location (Join-Path $src 'tools/wails-pilot')
          try{
            & go test -mod=readonly -count=1 ./...
            if($LASTEXITCODE -ne 0){throw 'P6_FULL_WAILS_REGRESSION_FAILED'}
            & go vet -mod=readonly ./...
            if($LASTEXITCODE -ne 0){throw 'P6_FULL_WAILS_VET_FAILED'}
          }finally{Pop-Location}
          Write-Output '::notice::W52_FRESH_FULL_GO_TAGGED_ROOT_WAILS_TEST_AND_VET=PASS'
      - name: Build original production pair with every synthetic tag excluded
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:TEMP=$env:RUNNER_TEMP;$env:TMP=$env:RUNNER_TEMP
          Remove-Item Env:KTRADE_W32E_QUALIFICATION_ONLY -ErrorAction SilentlyContinue
          Remove-Item Env:KTRADE_W13_QUALIFICATION_ONLY -ErrorAction SilentlyContinue
          $src=Join-Path $env:GITHUB_WORKSPACE 'current'
          $build=Join-Path $env:RUNNER_TEMP ('ktrade-w03-package-'+[guid]::NewGuid().ToString('N'))
          Push-Location $src
          try{
            $files=(& go list -mod=readonly -tags ktrade_full -f '{{join .GoFiles " "}}' ./cmd/ktrade) -join ' '
            if($LASTEXITCODE -ne 0 -or $files -notmatch 'main_full.go' -or $files -match 'w32e_webview_fixture|w13_fixture'){throw 'W32E_P2_SYNTHETIC_SOURCE_INCLUDED'}
          }finally{Pop-Location}
          & (Join-Path $src 'windows/Build-KTRADE-WailsPortable.ps1') -OutputRoot $build -ExpectedSourceSha '14cce5ba4ea8287622c3eba6e1286c72c34f28e1'
          if($LASTEXITCODE -ne 0){throw 'W52_PRODUCTION_PAIR_BUILD_FAILED'}
          $manifest=Get-Content -LiteralPath (Join-Path $build 'source-manifest.json') -Raw|ConvertFrom-Json
          if($manifest.source_sha -cne '14cce5ba4ea8287622c3eba6e1286c72c34f28e1' -or $manifest.fixture_mode -cne 'none' -or $manifest.live_armed -or $manifest.release_candidate){throw 'W52_PRODUCTION_IDENTITY_DRIFT'}
          $stage=Join-Path $build 'KTRADE-WailsPortable'
          $engineInfo=(& go version -m (Join-Path $stage 'ktrade-engine.exe')) -join "`n"
          if($LASTEXITCODE -ne 0 -or $engineInfo -notmatch '-tags=ktrade_full' -or $engineInfo -match 'ktrade_w32e_fixture|ktrade_w13_fixture'){throw 'W32E_P2_PRODUCTION_TAGS_DRIFT'}
          Write-Output $engineInfo
          [IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'w32e-package.txt'),$build)
          Write-Output '::notice::W52_ORIGINAL_PRODUCTION_PAIR_NO_SYNTHETIC_TAGS_OR_TRANSPORT=PASS'
      - name: Cleanup isolated production PAPER qualification package
        if: always()
        shell: pwsh
        run: |
          $marker=Join-Path $env:RUNNER_TEMP 'w32e-package.txt'
          if(Test-Path -LiteralPath $marker){
            $root=[IO.File]::ReadAllText($marker)
            if($root.StartsWith($env:RUNNER_TEMP) -and [IO.Path]::GetFileName($root) -match '^ktrade-w03-package-[a-f0-9]{32}$'){
              Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction Stop
              if(Test-Path -LiteralPath $root){throw 'W33_PACKAGE_CLEANUP_INCOMPLETE'}
            }
          }
          $paperMarker=Join-Path $env:RUNNER_TEMP 'w33-paper-source.txt'
          if(Test-Path -LiteralPath $paperMarker){
            $id=[IO.File]::ReadAllText($paperMarker)
            if($id -cnotmatch '^ktrade-reconcile-[a-z0-9]{12,48}$'){throw 'W33_CLEANUP_SOURCE_ID_INVALID'}
            $suffix=$id.Substring('ktrade-reconcile-'.Length)
            foreach($name in @($id,('ktrade-paper-partition-'+$suffix+'-btc-usdc'))){
              $path=Join-Path $env:RUNNER_TEMP $name
              if(Test-Path -LiteralPath $path){Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction Stop}
            }
          }
          Remove-Item (Join-Path $env:GITHUB_WORKSPACE 'current') -Recurse -Force -ErrorAction SilentlyContinue
          Write-Output '::notice::W52_SOURCE_PROOF_ONLY_PRODUCTION_PAIR_DISPOSED_NO_BROKER_OR_OWNER_DATA=PASS'
