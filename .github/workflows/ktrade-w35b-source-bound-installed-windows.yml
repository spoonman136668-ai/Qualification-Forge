name: KTRADE W35B pinned installed cross-version Windows qualification
permissions:
  contents: read
on:
  push:
    branches:
      - qualification/ktrade-w35b-cross-version-source-20261028
    paths:
      - .github/workflows/ktrade-w35b-source-bound-installed-windows.yml
concurrency:
  group: ktrade-w35b-source-bound-installed-windows-20261028
  cancel-in-progress: false
jobs:
  qualify:
    name: Verify source, syntax and native installed W31 to W34 rollback
    runs-on: windows-2022
    timeout-minutes: 80
    env:
      GOWORK: 'off'
      GOFLAGS: '-p=2'
      GOMAXPROCS: '2'
      CGO_ENABLED: '1'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact immutable qualification witness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: witness
          persist-credentials: false
      - name: Checkout exact W31 previous source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: spoonman136668-ai/ktrade
          ref: e51e03c22f906704295a24138ac1ceba5d9ea0d4
          path: previous
          persist-credentials: false
          token: ${{ secrets.KTRADE_SOURCE_READ_TOKEN }}
      - name: Checkout exact W34 candidate source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: spoonman136668-ai/ktrade
          ref: 0059d4b794552818b3f32798da7df27c75e21c5c
          path: candidate
          persist-credentials: false
          token: ${{ secrets.KTRADE_SOURCE_READ_TOKEN }}
      - name: Verify actual witness SHA and original PowerShell AST of both scripts
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_ENVIRONMENT -cne 'github-hosted'){throw 'W35B_HOST_NOT_EPHEMERAL'}
          $src=Join-Path $env:GITHUB_WORKSPACE 'witness'
          if((& git -C $src rev-parse HEAD).Trim() -cne $env:GITHUB_SHA){throw 'W35B_WITNESS_SOURCE_DRIFT'}
          foreach($relative in @('qualification-harness/ktrade-w35b/Build-And-Qualify.ps1','qualification-harness/ktrade-w35b/Installed-CrossVersion.ps1')){
            $tokens=$null;$parseErrors=$null
            [void][Management.Automation.Language.Parser]::ParseFile((Join-Path $src $relative),[ref]$tokens,[ref]$parseErrors)
            if($parseErrors.Count -ne 0){throw ('W35B_POWERSHELL_AST_INVALID_'+$relative+': '+(($parseErrors|ForEach-Object {$_.ToString()}) -join '; '))}
          }
          Write-Output '::notice::W35B_BOTH_POWERSHELL_SCRIPTS_AST=PASS'
      - name: Measure immutable source and tree identity before installing build tools
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($item in @(@{path='previous';sha='e51e03c22f906704295a24138ac1ceba5d9ea0d4';tree='5526682f7efafe4cd328fbac77ebb97e58dc7b9'},@{path='candidate';sha='0059d4b794552818b3f32798da7df27c75e21c5c';tree='9f1e559560ac14f4e6fc823dac9150e3a95f2c4d'})){
            $path=Join-Path $env:GITHUB_WORKSPACE $item.path
            $actualSHA=(& git -C $path rev-parse HEAD).Trim()
            $actualTree=(& git -C $path rev-parse 'HEAD^{tree}').Trim()
            Write-Output ('W35B_EARLY_SOURCE_'+$item.path+' SHA='+$actualSHA+' TREE='+$actualTree+' GIT_EXIT='+$LASTEXITCODE)
            if($LASTEXITCODE -ne 0 -or $actualSHA -cne $item.sha -or $actualTree -cne $item.tree){throw ('W35B_EARLY_EXACT_SOURCE_DRIFT_'+$item.path)}
          }
          Write-Output '::notice::W35B_EARLY_TWO_EXACT_GIT_IDENTITIES=PASS'
      - name: Install pinned Go and Node build-only toolchains
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: false
      - name: Install Node 24 for original offline chart/editor asset staging
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Execute source-pinned native Windows cross-version package and lifecycle witness
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=$env:GITHUB_WORKSPACE
          $build=Join-Path $root 'witness/qualification-harness/ktrade-w35b/Build-And-Qualify.ps1'
          $lifecycle=Join-Path $root 'witness/qualification-harness/ktrade-w35b/Installed-CrossVersion.ps1'
          & $build -PreviousCheckout (Join-Path $root 'previous') -CandidateCheckout (Join-Path $root 'candidate') -WitnessScript $lifecycle
          if(!$?){throw 'W35B_EXACT_NATIVE_WINDOWS_EXECUTION_NOT_QUALIFIED'}
          Write-Output '::notice::W35B_PINNED_INSTALLED_CROSS_VERSION_WINDOWS=PASS'
      - name: Confirm no runtime/owner release changes from this witness
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $src=Join-Path $env:GITHUB_WORKSPACE 'witness'
          if((& git -C $src rev-parse HEAD).Trim() -cne $env:GITHUB_SHA){throw 'W35B_WITNESS_MUTATED'}
          Write-Output '::notice::W35B_NO_MERGE_NO_BROKER_NO_OWNER_DATA_NO_RELEASE'
