name: R25-C75D3E native current input focused Windows qualification
on:
  push:
    branches: [qualification/r25-c75d3e-bound-native-current-input-20261021]
    paths: [.github/workflows/r25-c75d3e-bound-native-current-input.yml]
permissions:
  contents: read
concurrency:
  group: r25-c75d3e-native-input
  cancel-in-progress: false
jobs:
  source-only:
    if: github.repository == 'spoonman136668-ai/Qualification-Forge'
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      SOURCE_SHA: 'c1375aee7d87b24ce494eaf40c050c42f8e27384'
      PARENT_SHA: 'd29c4fc3cfc0bea8cfa02dc200f135fed7bdd187'
      SOURCE_BLOB: 'd4dd045bc879fd68582bec93f17d0061165f560d'
      TEST_BLOB: 'eb9b900bf3118e05f80d76d17e6d49c27d7028f1'
      KTRADE_CI_PAPER_ONLY: '1'
      KTRADE_CI_COINBASE_ALLOWED: '0'
      KTRADE_CI_LIVE_AUTHORITY: '0'
      KTRADE_CI_PROMOTION_ALLOWED: '0'
      GOFLAGS: '-p=2'
      GOMAXPROCS: '2'
      GOWORK: 'off'
    steps:
      - name: Pin paper-only hosted Windows source boundary
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/Qualification-Forge' -or
             $env:GITHUB_REF -cne 'refs/heads/qualification/r25-c75d3e-bound-native-current-input-20261021' -or
             $env:RUNNER_OS -cne 'Windows' -or
             $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or
             $env:KTRADE_CI_PAPER_ONLY -cne '1' -or
             $env:KTRADE_CI_COINBASE_ALLOWED -cne '0' -or
             $env:KTRADE_CI_LIVE_AUTHORITY -cne '0' -or
             $env:KTRADE_CI_PROMOTION_ALLOWED -cne '0'){
            throw 'C75D3E_UNQUALIFIED_RUNNER_OR_AUTHORITY'
          }
          Write-Host 'C75D3E_PAPER_SOURCE_BOUNDARY=PASS'
      - name: Read exact source candidate using existing KTRADE access
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: spoonman136668-ai/ktrade
          ref: c1375aee7d87b24ce494eaf40c050c42f8e27384
          path: candidate
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.KTRADE_SOURCE_READ_TOKEN }}
      - name: Assert immutable two-file source and strict original parent
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:GITHUB_WORKSPACE 'candidate'
          if((& git -C $root rev-parse HEAD).Trim() -cne $env:SOURCE_SHA){throw 'C75D3E_COMMIT_DRIFT'}
          $got=@(& git -C $root diff --name-only $env:PARENT_SHA $env:SOURCE_SHA | Sort-Object)
          $want=@('internal/paperlifecycle/native_current_input.go','internal/paperlifecycle/native_current_input_test.go')|Sort-Object
          if($got.Count -ne 2 -or @(Compare-Object $want $got).Count -ne 0){
            throw 'C75D3E_TWO_FILE_SCOPE_DRIFT'
          }
          $src=(& git -C $root rev-parse 'HEAD:internal/paperlifecycle/native_current_input.go').Trim()
          $tests=(& git -C $root rev-parse 'HEAD:internal/paperlifecycle/native_current_input_test.go').Trim()
          if($src -cne $env:SOURCE_BLOB -or $tests -cne $env:TEST_BLOB){throw 'C75D3E_GIT_BLOB_DRIFT'}
          if(@(& git -C $root status --porcelain=v1 --untracked-files=all).Count -ne 0){
            throw 'C75D3E_DIRTY_SOURCE_CHECKOUT'
          }
          Write-Host 'C75D3E_EXACT_ORIGINAL_NATIVE_INPUT_BINDING_SOURCE=PASS'
      - name: Go Windows 1.24.9
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.24.9'
          cache: false
      - name: Focused current source closed-bar tests
        shell: pwsh
        working-directory: candidate
        run: |
          $ErrorActionPreference='Stop'
          & go test -mod=readonly -count=1 -timeout=5m ./internal/papersource
          if($LASTEXITCODE -ne 0){throw 'C75D3E_CURRENT_SOURCE_FOCUSED_FAILURE'}
          Write-Host 'C75D3E_CURRENT_SOURCE=PASS'
      - name: Focused current original native input boundary and negatives
        shell: pwsh
        working-directory: candidate
        run: |
          $ErrorActionPreference='Stop'
          & go test -mod=readonly -count=1 -timeout=6m -v -run '^TestC75D3E' ./internal/paperlifecycle
          if($LASTEXITCODE -ne 0){throw 'C75D3E_NATIVE_BINDING_FOCUSED_FAILURE'}
          Write-Host 'C75D3E_AUTHENTIC_SETTINGS_CURRENT_BARS_INERT=PASS'
      - name: Full compilation vet (not full source regression)
        shell: pwsh
        working-directory: candidate
        run: |
          $ErrorActionPreference='Stop'
          & go vet -mod=readonly -tags=ktrade_full ./...
          if($LASTEXITCODE -ne 0){throw 'C75D3E_WINDOWS_VET_FAILED'}
          Write-Host 'C75D3E_WINDOWS_VET=PASS'
      - name: Stopped Windows build without broker credentials
        shell: pwsh
        working-directory: candidate
        run: |
          $ErrorActionPreference='Stop'
          $exe=Join-Path $env:RUNNER_TEMP 'ktrade-c75d3e-stopped.exe'
          & go build -mod=readonly -tags=ktrade_full -o $exe ./cmd/ktrade
          if($LASTEXITCODE -ne 0 -or !(Test-Path -LiteralPath $exe -PathType Leaf)){
            throw 'C75D3E_STOPPED_EXE_BUILD_FAILED'
          }
          Write-Host 'C75D3E_STOPPED_WINDOWS_EXE=PASS'
      - name: Seal source-only result without promotion
        shell: pwsh
        working-directory: candidate
        run: |
          $ErrorActionPreference='Stop'
          if(@(& git status --porcelain=v1 --untracked-files=all).Count -ne 0){
            throw 'C75D3E_QUALIFIED_SOURCE_MUTATED'
          }
          Write-Host 'C75D3E_NATIVE_CURRENT_DECISION_IMPLEMENTED=FALSE'
          Write-Host 'C75D3E_GUARD_OR_PAPER_ORDER_ADMITTED=FALSE'
          Write-Host 'C75D3E_FULL_WINDOWS_DONOR_INTEGRATION=NOT_RUN'
          Write-Host 'C75D3E_SOURCE_ONLY_WINDOWS_FOCUSED=PASS'
