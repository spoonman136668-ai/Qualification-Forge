name: KTRADE PR244 exact-source PAPER race and mock broker faults
on:
  push:
    branches: [qualification/ktrade-original-pine-label-response-affinity-20261031]
    paths: [.github/workflows/ktrade-pr244-exact-risk-matrix-windows.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: ktrade-pr244-exact-risk-matrix-20261103
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: windows-2022
    timeout-minutes: 55
    env:
      GOWORK: 'off'
      GOFLAGS: '-p=2'
      GOMAXPROCS: '2'
      CGO_ENABLED: '1'
      GOTOOLCHAIN: 'local'
      KTRADE_LIVE_TRADING: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: witness
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: spoonman136668-ai/ktrade
          ref: 671198f2336e410c98ef764603455a51c08d16b0
          path: product
          persist-credentials: false
          token: ${{ secrets.KTRADE_SOURCE_READ_TOKEN }}
      - name: Exact source disarmed original test matrix and verified native acceptance preflight
        shell: pwsh
        env:
          PR244_RISK_WITNESS_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows'){throw 'PR244_RISK_HOSTED_WINDOWS_REQUIRED'}
          $src=Join-Path $env:GITHUB_WORKSPACE 'product'
          if((& git -C $src rev-parse HEAD).Trim() -cne '671198f2336e410c98ef764603455a51c08d16b0' -or (& git -C $src rev-parse 'HEAD^{tree}').Trim() -cne 'f75c8d45689e68cf2e582fe4679b841e9c9f352e' -or @(& git -C $src status --porcelain).Count -ne 0){throw 'PR244_RISK_SOURCE_DRIFT'}
          if(Test-Path (Join-Path $src '.env')){throw 'PR244_RISK_DOTENV_REFUSED'}
          if((Get-Content (Join-Path $src 'pkg/advanced_orders.go') -Raw) -notmatch 'func liveBrokerageAuthorized\(\) bool \{ return false \}'){throw 'PR244_RISK_LIVE_AUTHORITY_DRIFT'}
          $q=Join-Path $env:GITHUB_WORKSPACE 'witness'
          if((& git -C $q rev-parse HEAD).Trim() -cne $env:GITHUB_SHA){throw 'PR244_RISK_QUALIFIER_HEAD_DRIFT'}
          $native='qualification-receipts/ktrade-pr244-pine-cold-reopen-repeatability-windows-20261105.json'
          $source='qualification-receipts/ktrade-pr244-pine-marker-status-source-windows-20261105.json'
          if((& git -C $q rev-parse ('HEAD:'+$native)).Trim() -cne '6d9d69001c40b2999fb4095652ae55393d2ff70a' -or
             (& git -C $q rev-parse ('HEAD:'+$source)).Trim() -cne '7eb9024615af7a076611caff6306a4749f46bcb0'){throw 'PR244_RISK_PINNED_RECEIPTS_CHANGED'}
          $nativeReceipt=Get-Content (Join-Path $q $native) -Raw|ConvertFrom-Json
          $sourceReceipt=Get-Content (Join-Path $q $source) -Raw|ConvertFrom-Json
          $cross='qualification-receipts/ktrade-pr244-pine-cross-windows-2025-native-windows-20261105.json'
          if((& git -C $q rev-parse ('HEAD:'+$cross)).Trim() -cne 'e06c0d6613de323480b9b2abc7dbdde709d8b9b2'){throw 'PR244_RISK_CROSS_WINDOWS_RECEIPT_BLOB_DRIFT'}
          $crossReceipt=Get-Content (Join-Path $q $cross) -Raw|ConvertFrom-Json
          if($nativeReceipt.verdict -cne 'PASS_TWO_NATIVE_CANDIDATE_SESSIONS_WITH_STRICT_PINE_V5_V6_PHYSICAL_MARKERS' -or
             $nativeReceipt.source.head_sha -cne '671198f2336e410c98ef764603455a51c08d16b0' -or
             $nativeReceipt.source.tree_sha -cne 'f75c8d45689e68cf2e582fe4679b841e9c9f352e' -or
             $nativeReceipt.qualifier.job_conclusion -cne 'success' -or
             $nativeReceipt.qualifier.run_id -ne 42006368574 -or
             $sourceReceipt.verdict -cne 'PASS_SOURCE_OWNED_EXACT_HEAD_WINDOWS_FULL_REGRESSION' -or
             $sourceReceipt.qualification.run_conclusion -cne 'success' -or
             $sourceReceipt.qualification.workflow_run_id -ne 41994140128 -or
             $sourceReceipt.qualification.node_tests.passed -ne 199 -or
             $sourceReceipt.source.head_sha -cne '671198f2336e410c98ef764603455a51c08d16b0' -or
             $sourceReceipt.source.tree -cne 'f75c8d45689e68cf2e582fe4679b841e9c9f352e' -or
             $crossReceipt.verdict -cne 'PASS_EXACT_HEAD_WINDOWS_SERVER_2025_TWO_NATIVE_SESSIONS' -or
             $crossReceipt.product.head_sha -cne '671198f2336e410c98ef764603455a51c08d16b0' -or
             $crossReceipt.qualifier.run_id -ne 42009974415 -or
             $crossReceipt.host.system_dpi -ne 96){throw 'PR244_RISK_EXACT_SOURCE_AND_NATIVE_RECEIPTS_REQUIRED'}
          $headers=@{Authorization=('Bearer '+$env:PR244_RISK_WITNESS_TOKEN);Accept='application/vnd.github+json'}
          foreach($evidence in @(
            @{id=42006368574;head='440c7f3e6f0ef818827cd196bbd3e5b2c64f1612'},
            @{id=42009974415;head='d61165ba58b96e9cdc77ff0dccc7266b856274c3'}
          )){
            $run=Invoke-RestMethod -Headers $headers -Uri ('https://api.github.com/repos/spoonman136668-ai/Qualification-Forge/actions/runs/'+$evidence.id) -TimeoutSec 30
            if($run.status -cne 'completed' -or $run.conclusion -cne 'success' -or $run.head_sha -cne $evidence.head){throw ('PR244_RISK_EXACT_NATIVE_ACCEPTANCE_REQUIRED_'+$evidence.id)}
          }
          Write-Host '::notice::PR244_RISK_EXACT_CURRENT_SOURCE_NATIVE_AND_FULL_CI_REUSED_LIVE_DISABLED=PASS'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: false
      - name: Original PAPER cold restart ledger and TradeGuard targeted race tests
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:TEMP=$env:RUNNER_TEMP;$env:TMP=$env:RUNNER_TEMP
          Push-Location (Join-Path $env:GITHUB_WORKSPACE 'product')
          try {
            function Qualify([string]$pkg,[string[]]$names,[int]$n){
              $pattern='^('+($names -join '|')+')$'
              $raw=@(& go test -json -race -mod=readonly "-count=$n" -timeout 18m -run $pattern $pkg)
              if($LASTEXITCODE -ne 0){
                $raw|Select-Object -Last 100|ForEach-Object {Write-Host $_}
                throw ('PR244_RISK_ORIGINAL_GO_RACE_FAILED_'+$pkg)
              }
              $events=@($raw|ForEach-Object {$_|ConvertFrom-Json -ErrorAction Stop})
              if(@($events|Where-Object {$_.Action -in @('fail','skip')}).Count -gt 0){throw 'PR244_RISK_ORIGINAL_TEST_FAILURE_OR_SKIP'}
              $full='ktrade/'+$pkg.TrimStart('.','/')
              foreach($name in $names){
                $matches=@($events|Where-Object {$_.Action -ceq 'pass' -and $_.Package -ceq $full -and $_.Test -ceq $name})
                if($matches.Count -ne $n){throw ('PR244_RISK_RACE_NAMED_TEST_NOT_REPEATED_'+$name)}
              }
              Write-Host ('::notice::PR244_RISK_ORIGINAL_RACE_REPEAT=PASS package='+$full+' cases='+$names.Count+' repetitions='+$n)
            }
            Qualify './internal/papertrading' @(
              'TestKTRADER10RealOfflinePaperFIFOFeesAndRestart',
              'TestKTRADER10PaperRiskRefusalsNeverMutateLedger',
              'TestKTRADER10PaperLedgerTamperRefused',
              'TestW56OriginalFIFOPartialCloseAndFinalResidualAtExactScale',
              'TestW56SharedCashSeparateProductLotsAndNoInventedOpening'
            ) 4
            Qualify './internal/papercustody' @(
              'TestDurableJournalSnapshotsReplayAndNeverRearm',
              'TestDurableCheckpointTamperAndPendingAreNotHidden',
              'TestApplicationOwnedSingleWriterAcrossDifferentPaperSessions'
            ) 4
            Qualify './internal/paperengine' @(
              'TestOwnerStartSubmitStopAndColdRestartNeverRearms',
              'TestOwnerRejectsUnverifiedFeeMarketAndAlteredPineOrder',
              'TestNativeOriginalTradeGuardAndCoordinatorPaperLifecycle',
              'TestNativeOriginalRiskPostFillFailureKillsAndNeverRearms'
            ) 3
          }finally{Pop-Location}
      - name: Exact-current original W41-W73 mock broker and custody test roots under race
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:TEMP=$env:RUNNER_TEMP;$env:TMP=$env:RUNNER_TEMP
          Push-Location (Join-Path $env:GITHUB_WORKSPACE 'product')
          try{
            if((& go env GOVERSION).Trim() -cne 'go1.26.10'){throw 'PR244_RISK_TOOLCHAIN_DRIFT'}
            $pattern='^TestW(4[1-9]|5[0-9]|6[0-9]|7[0-3]|82)'
            $list=@(& go test -mod=readonly -list $pattern ./pkg)
            if($LASTEXITCODE -ne 0){throw 'PR244_RISK_ORIGINAL_MATRIX_DISCOVERY_FAILED'}
            $names=@($list|Where-Object {$_ -cmatch $pattern})
            $required=@('TestW41AdvancedCreateUsesDocumentedJSONAndOnlyAcknowledges','TestW41AdvancedCreateAcknowledgementBindsSentSnapshot','TestW42AdvancedRESTJWTExactContract','TestW42AdvancedRESTFreshNonceAndNoTokenCache','TestW42AdvancedRESTRejectsInvalidKeysAndEntropyFailure','TestW73CandidateHistoryPreservesPrecisionWithoutGrantingCashAuthority','TestW73RefusesForeignCursorsIdentitiesAliasesAndMalformedPages','TestW73CancellationAndHTTPRefusalsHaveOnlySanitizedStatus','TestW82SupportedCryptoKeepsNonceAndSecureSignatureContract')
            foreach($name in $required){if($names -cnotcontains $name){throw ('PR244_RISK_REQUIRED_ORIGINAL_MATRIX_CASE_MISSING_'+$name)}}
            if($names.Count -eq 0 -or @($names|Select-Object -Unique).Count -ne $names.Count){throw 'PR244_RISK_MATRIX_DISCOVERY_INVALID'}
            if(@($names|Where-Object {$_ -match 'OwnerNative|OwnerReadOnly'}).Count -ne 0){throw 'PR244_RISK_ORIGINAL_OWNER_REAL_PROVIDER_TAGS_REFUSED'}
            Write-Host ('PR244_RISK_ORIGINAL_MOCK_MATRIX_DISCOVERED_ROOTS='+$names.Count)
            $raw=@(& go test -json -mod=readonly -race -count=1 -timeout 18m -run $pattern ./pkg)
            $exit=$LASTEXITCODE
            $events=@($raw|ForEach-Object {$_|ConvertFrom-Json -ErrorAction Stop})
            if($exit -ne 0){$raw|Select-Object -Last 50|ForEach-Object {Write-Host $_};throw 'PR244_RISK_ORIGINAL_BROKER_FAULT_MATRIX_FAILED'}
            if(@($events|Where-Object {$_.Action -in @('fail','skip')}).Count -ne 0){throw 'PR244_RISK_FAULT_MATRIX_FAILURE_OR_SKIP'}
            foreach($name in $names){
              if(@($events|Where-Object {$_.Action -ceq 'pass' -and $_.Package -ceq 'ktrade/pkg' -and $_.Test -ceq $name}).Count -ne 1){throw ('PR244_RISK_ORIGINAL_MATRIX_ROOT_NOT_EXECUTED_'+$name)}
            }
            Write-Host ('::notice::PR244_RISK_ALL_ORIGINAL_MOCK_BROKER_CUSTODY_AUTH_HISTORY_ROOTS_RACE=PASS roots='+$names.Count)
          }finally{Pop-Location}
      - name: Final exact source and disarmed authority
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $src=Join-Path $env:GITHUB_WORKSPACE 'product'
          if((& git -C $src rev-parse HEAD).Trim() -cne '671198f2336e410c98ef764603455a51c08d16b0' -or @(& git -C $src status --porcelain --untracked-files=no).Count -ne 0){throw 'PR244_RISK_FINAL_SOURCE_DRIFT'}
          Write-Host '::notice::PR244_RISK_CURRENT_SUPPORTED_RUNTIME_ORIGINAL_TESTS_NO_REAL_KEYS_NO_OWNER_DATA_NO_BROKER_ORDERS_NO_LIVE_NO_RELEASE'

