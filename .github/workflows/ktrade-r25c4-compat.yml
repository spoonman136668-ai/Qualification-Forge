name: KTRADE R25-C4 pre-remediation compatibility baseline
on:
  push:
    branches: [qualification/ktrade-r25c4-compat-baseline-20261018]
    paths: [.github/workflows/ktrade-r25c4-compat.yml]
permissions:
  contents: read
jobs:
  original-contracts:
    if: github.repository == 'spoonman136668-ai/Qualification-Forge' && github.actor == 'spoonman136668-ai'
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      GOFLAGS: '-p=2'
      GOMAXPROCS: '2'
      KTRADE_CI_COINBASE_ALLOWED: '0'
      KTRADE_CI_LIVE_AUTHORITY: '0'
      KTRADE_CI_PROMOTION_ALLOWED: '0'
    steps:
      - name: Checkout exact KTRADE source
        uses: actions/checkout@v4
        with:
          repository: spoonman136668-ai/ktrade
          ref: 4aefd8eeea9d0a9fe4007cf80e4fa7d0ea583d24
          path: source
          persist-credentials: false
          token: ${{ secrets.KTRADE_SOURCE_READ_TOKEN }}
      - name: Setup pinned Go version
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Verify source and run newly added baseline tests
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:GITHUB_WORKSPACE 'source'
          $log=Join-Path $env:RUNNER_TEMP 'r25c4-private-test.log'
          try {
            if($env:RUNNER_OS -cne 'Windows' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted'){throw 'R25C4_HOST_INVALID'}
            if($env:KTRADE_CI_COINBASE_ALLOWED -cne '0' -or $env:KTRADE_CI_LIVE_AUTHORITY -cne '0' -or $env:KTRADE_CI_PROMOTION_ALLOWED -cne '0'){throw 'R25C4_UNSAFE_AUTHORITY'}
            if((& git -C $root rev-parse HEAD).Trim() -cne '4aefd8eeea9d0a9fe4007cf80e4fa7d0ea583d24' -or
               (& git -C $root rev-parse 'HEAD^{tree}').Trim() -cne '92801b1068e63c2d2a752dada9c16c9e760a140f'){throw 'R25C4_SOURCE_DRIFT'}
            if((& git -C $root rev-parse HEAD:pkg/pine_phasef_f4_perf.go).Trim() -cne 'a41a6ee516d5fe5eeb7762f2a7e35ac4d7fcfdd0'){throw 'R25C4_PERF_SOURCE_DRIFT'}
            Push-Location $root
            try {
              & go mod download *> $log
              if($LASTEXITCODE -ne 0){throw 'R25C4_MODULE_FAILURE'}
              & go test -vet=off -mod=readonly -count=1 -timeout=180s -v -run '^TestR25C4' ./pkg *> $log
              if($LASTEXITCODE -ne 0){
                $raw=[string](Get-Content $log -Raw -ErrorAction SilentlyContinue)
                $fails=@([regex]::Matches($raw,'(?m)^--- FAIL: ([^\s]+)') | ForEach-Object {$_.Groups[1].Value} | Sort-Object -Unique)
                $build=@([regex]::Matches($raw,'(?m)^# (ktrade/[^\r\n]+)') | ForEach-Object {$_.Groups[1].Value} | Sort-Object -Unique)
                Write-Output ('R25C4_BASELINE_FAILED_NAMES='+($fails -join ','))
                Write-Output ('R25C4_BASELINE_BUILD_PACKAGES='+($build -join ','))
                throw 'R25C4_ORIGINAL_COMPATIBILITY_TESTS_FAILED'
              }
              $text=[string](Get-Content -LiteralPath $log -Raw)
              foreach($part in @('P11B_T297','P11B_T407')){
                $match=[regex]::Match($text,('R25C4_HISTORICAL_JSON_WIRE_'+$part+'_SHA256=([0-9a-f]{64})'))
                if(-not $match.Success){throw ('R25C4_BASELINE_WIRE_DIGEST_NOT_EMITTED_'+$part)}
                Write-Output ('R25C4_BASELINE_WIRE_SHA256_'+$part+'='+$match.Groups[1].Value)
              }
              Write-Output 'R25C4_ORIGINAL_SERIALIZATION_AND_CACHE_TESTS=PASS'
              Write-Output 'R25C4_FULL_VET_NOT_ATTEMPTED=TRUE'
              Write-Output 'R25C4_FULL_REGRESSION_NOT_REPEATED=TRUE'
            } finally {Pop-Location}
          } finally {Remove-Item -LiteralPath $log -Force -ErrorAction SilentlyContinue}
      - name: Remove private checkout
        if: always()
        shell: pwsh
        run: |
          Remove-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'source') -Force -Recurse -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'r25c4-private-test.log') -Force -ErrorAction SilentlyContinue
          Write-Output 'R25C4_PRIVATE_DATA_NOT_USED=TRUE'
