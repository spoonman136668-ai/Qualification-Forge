name: KTRADE DIC-11 local account capability preflight
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ktrade-dic11-local-account-preflight.yml
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'spoonman136668-ai/Qualification-Forge'
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - name: Check disposable local-account API with no private source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_OS -cne 'Windows' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted'){throw 'DIC11_NOT_DISPOSABLE_HOST'}
          $name='d11'+[guid]::NewGuid().ToString('N').Substring(0,10)
          $password=ConvertTo-SecureString ('D11!'+[guid]::NewGuid().ToString('N')+'Aa2') -AsPlainText -Force
          $created=$false
          try{
            $cmd=Get-Command New-LocalUser -ErrorAction Stop
            Write-Host 'DIC11_LOCAL_ACCOUNT_CMDLET=AVAILABLE'
            New-LocalUser -Name $name -Password $password -Description 'ephemeral DIC11 CI only' -PasswordNeverExpires | Out-Null
            $created=$true
            Write-Host 'DIC11_LOCAL_ACCOUNT_CREATION=PASS'
          }catch{
            $type=$_.Exception.GetType().Name
            $reason=[string]$_.FullyQualifiedErrorId
            $h=('{0:X8}' -f [uint32]($_.Exception.HResult -band 0xffffffffL))
            $safeTypes=@('RuntimeException','InvalidOperationException',
             'SecurityException','UnauthorizedAccessException','Win32Exception',
             'LocalAccountsException','ParameterBindingException',
             'CommandNotFoundException','MethodInvocationException','ArgumentException')
            $safeReasons=@('UserExists','AccessDenied','InvalidPassword','InvalidUserName',
             'InvalidOperation','InvalidParameter','PasswordTooShort','PasswordTooLong',
             'NewLocalUserFailed','NotSupported')
            if($type -notin $safeTypes){$type='OTHER_EXCEPTION'}
            if($reason -notin $safeReasons){$reason='OTHER_ERROR_ID'}
            Write-Host ('DIC11_PREFLIGHT_EXCEPTION_TYPE_'+$type+'=FAIL')
            Write-Host ('DIC11_PREFLIGHT_EXCEPTION_HRESULT_'+$h+'=FAIL')
            Write-Host ('DIC11_PREFLIGHT_REASON_'+$reason+'=FAIL')
            throw 'DIC11_HOSTED_LOCAL_ACCOUNT_CAPABILITY_UNAVAILABLE'
          }finally{
            if($created){Remove-LocalUser -Name $name -ErrorAction SilentlyContinue}
          }
