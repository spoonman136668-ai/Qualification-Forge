name: KTRADE R25-C6 frozen original JSON wire baseline
on:
  push:
    branches: [qualification/ktrade-r25c6-wire-baseline-20261018]
    paths: [.github/workflows/ktrade-r25c6-wire-baseline.yml]
permissions:
  contents: read
jobs:
  historical-wire:
    if: github.repository == 'spoonman136668-ai/Qualification-Forge' && github.actor == 'spoonman136668-ai'
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      GOFLAGS: '-p=2'
      GOMAXPROCS: '2'
      KTRADE_CI_COINBASE_ALLOWED: '0'
      KTRADE_CI_LIVE_AUTHORITY: '0'
      KTRADE_CI_PROMOTION_ALLOWED: '0'
    steps:
      - name: Checkout exact preserved R25-C5 KTRADE source
        uses: actions/checkout@v4
        with:
          repository: spoonman136668-ai/ktrade
          ref: 26df2f7cf1079a4849c1f0ed431613505d72edff
          path: private-source
          persist-credentials: false
          token: ${{ secrets.KTRADE_SOURCE_READ_TOKEN }}
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Independently capture original T410 T411 T412 T413 JSON wire fingerprints
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_OS -cne 'Windows' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted'){throw 'R25C6_BAD_RUNNER'}
          if($env:KTRADE_CI_COINBASE_ALLOWED -cne '0' -or $env:KTRADE_CI_LIVE_AUTHORITY -cne '0' -or $env:KTRADE_CI_PROMOTION_ALLOWED -cne '0'){throw 'R25C6_UNSAFE_AUTHORITY'}
          $root=Join-Path $env:GITHUB_WORKSPACE 'private-source'
          $log=Join-Path $env:RUNNER_TEMP 'r25c5-wire.private.log'
          try {
            if((& git -C $root rev-parse HEAD).Trim() -cne '26df2f7cf1079a4849c1f0ed431613505d72edff' -or (& git -C $root rev-parse 'HEAD^{tree}').Trim() -cne 'a53fbf300b9853e79d17d544080f2dcce6539af8'){throw 'R25C6_BASELINE_SOURCE_DRIFT'}
            if((& git -C $root rev-parse 'HEAD:pkg/p11b_t410_explicit_new_repro_only_release_readiness_governance_closeout_wakening_pin.go').Trim() -cne 'd47eca6fb5b33d6bc419ad5839c30186c3230bc1'){throw 'R25C6_T410_BLOB_DRIFT'}
            if((& git -C $root rev-parse 'HEAD:pkg/p11b_t411_explicit_new_repro_only_release_readiness_governance_closeout_renewal_pin.go').Trim() -cne '10cd55df53ec4e376c3ffc8878433d675a1b4f10'){throw 'R25C6_T411_BLOB_DRIFT'}
            if((& git -C $root rev-parse 'HEAD:pkg/p11b_t412_explicit_new_repro_only_release_readiness_governance_closeout_revival_pin.go').Trim() -cne 'b413988b9b39cee28baede752c80527e4d1d0579'){throw 'R25C6_T412_BLOB_DRIFT'}
            if((& git -C $root rev-parse 'HEAD:pkg/p11b_t413_explicit_new_repro_only_release_readiness_governance_closeout_reawakening_pin.go').Trim() -cne 'ea0e75cb52eea5dd8caf8296ead856f7f3fd6c82'){throw 'R25C6_T413_BLOB_DRIFT'}
            $testFile=Join-Path $root 'pkg/r25c5_wire_baseline_ephemeral_test.go'
            @'
          package pkg
          import ("crypto/sha256";"encoding/json";"testing")
          func TestR25C6WireBaseline(t *testing.T) {
           cases:=[]struct{name string;build func() any}{
           {"T410",func() any {v:=BuildPhase11P11BT410ExplicitNewReproOnlyReleaseReadinessGovernanceCloseoutWakeningPinV1();return v}},
           {"T411",func() any {v:=BuildPhase11P11BT411ExplicitNewReproOnlyReleaseReadinessGovernanceCloseoutRenewalPinV1();return v}},
           {"T412",func() any {v:=BuildPhase11P11BT412ExplicitNewReproOnlyReleaseReadinessGovernanceCloseoutRevivalPinV1();return v}},
           {"T413",func() any {v:=BuildPhase11P11BT413ExplicitNewReproOnlyReleaseReadinessGovernanceCloseoutReawakeningPinV1();return v}},
           }
           for _,tc:=range cases{
            t.Run(tc.name,func(t *testing.T){data,err:=json.Marshal(tc.build());if err!=nil{t.Fatal(err)};sum:=sha256.Sum256(data);t.Logf("R25C6_HISTORICAL_JSON_WIRE_%s_SHA256=%x",tc.name,sum)})
           }
          }
          '@ | Set-Content -LiteralPath $testFile -Encoding utf8
            Push-Location $root
            try {
              & go mod download *> $log
              if($LASTEXITCODE -ne 0){throw 'R25C6_MODULE_DOWNLOAD_FAILED'}
              & go test -mod=readonly -vet=off -count=1 -run '^TestR25C6WireBaseline$' -v ./pkg *> $log
              if($LASTEXITCODE -ne 0){throw 'R25C6_BASELINE_TEST_FAILED'}
            } finally {Pop-Location}
            $output=[string](Get-Content -LiteralPath $log -Raw)
            foreach($n in @('T410','T411','T412','T413')){
              $match=[regex]::Match($output,('R25C6_HISTORICAL_JSON_WIRE_'+$n+'_SHA256=([0-9a-f]{64})'))
              if(-not $match.Success){throw ('R25C6_MISSING_JSON_WIRE_DIGEST_'+$n)}
              Write-Output ('R25C6_ORIGINAL_WIRE_'+$n+'_SHA256='+$match.Groups[1].Value)
            }
            Write-Output 'R25C6_PRE_REMEDIATION_HISTORICAL_WIRE_BASELINE=PASS'
            Write-Output 'R25C6_FULL_REGRESSION=NOT_RUN'
            Write-Output 'R25C6_FULL_VET=NOT_RUN'
          } finally {
            Remove-Item -LiteralPath $log -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath (Join-Path $root 'pkg/r25c5_wire_baseline_ephemeral_test.go') -Force -ErrorAction SilentlyContinue
          }
      - name: Remove private source and ephemeral tests
        if: always()
        shell: pwsh
        run: |
          Remove-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'private-source') -Recurse -Force -ErrorAction SilentlyContinue
          Write-Output 'R25C6_PRIVATE_USER_DATA_TOUCHED=FALSE'
