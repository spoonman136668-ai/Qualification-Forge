name: K-Terminal PR76 pinned native Go Windows regression

# Single bounded push on a private-source read-only qualification branch.
# No application launch, broker credentials, trading, merge or promotion.
on:
  push:
    branches:
      - qualification/kt-pr76-native-go-20261028
    paths:
      - '.github/workflows/kterminal-pr76-native-go.yml'

permissions:
  contents: read

jobs:
  native-go:
    if: >-
      github.repository == 'spoonman136668-ai/Qualification-Forge' &&
      github.actor == 'spoonman136668-ai' &&
      github.ref == 'refs/heads/qualification/kt-pr76-native-go-20261028'
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      EXPECTED_SHA: '5eda7b770b17b7c4e43b5911997058b1e15d496c'
      KTERMINAL_READ_TOKEN: ${{ secrets.KTERMINAL_READ_TOKEN }}
      KTERMINAL_LIVE_AUTHORITY: '0'
      KTERMINAL_BROKER_ACCESS: '0'
      KTERMINAL_PROMOTION: '0'
      CI: 'true'
      GOFLAGS: '-mod=readonly'
      GOTOOLCHAIN: 'local'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Verify private source read authority without revealing private data
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows') { throw 'KTERMINAL_WRONG_RUNNER' }
          if ([string]::IsNullOrWhiteSpace($env:KTERMINAL_READ_TOKEN)) { throw 'KTERMINAL_READ_SECRET_MISSING' }
          $headers = @{ Accept='application/vnd.github+json'; Authorization=('Bearer ' + $env:KTERMINAL_READ_TOKEN) }
          try {
            $data = Invoke-RestMethod -Method Get -Uri ('https://api.github.com/repos/Kboomllc/K-Terminal/commits/' + $env:EXPECTED_SHA) -Headers $headers -TimeoutSec 25
            if ($data.sha -cne $env:EXPECTED_SHA) { throw 'KTERMINAL_SOURCE_DRIFT' }
          } catch {
            throw 'KTERMINAL_PRIVATE_READ_UNAVAILABLE'
          } finally {
            Remove-Variable headers,data -ErrorAction SilentlyContinue
          }
          Write-Host 'KTERMINAL_PRIVATE_PINNED_READ=PASS'

      - name: Checkout exactly reviewed K-Terminal revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Kboomllc/K-Terminal
          ref: '5eda7b770b17b7c4e43b5911997058b1e15d496c'
          token: ${{ secrets.KTERMINAL_READ_TOKEN }}
          path: private-checkout
          persist-credentials: false
          fetch-depth: 1

      - name: Run native Go unit and integration suite, vet and compile without launching product
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:GITHUB_WORKSPACE 'private-checkout'
          $log = Join-Path $env:RUNNER_TEMP 'kterminal-native-go-private.log'
          Push-Location -LiteralPath $root
          try {
            if ((& git rev-parse HEAD).Trim() -cne $env:EXPECTED_SHA) { throw 'KTERMINAL_HEAD_MISMATCH' }
            if (@(& git status --porcelain --untracked-files=all).Count -ne 0) { throw 'KTERMINAL_INITIAL_DIRTY' }
            Write-Host ('KTERMINAL_GO_TOOLCHAIN=' + (& go version))
            & go test -count=1 -timeout 30m ./... *> $log
            if ($LASTEXITCODE -ne 0) { throw 'KTERMINAL_FULL_GO_TESTS_FAILED_PRIVATE_DETAILS_WITHHELD' }
            Write-Host ('KTERMINAL_FULL_GO_TESTS=PASS EXACT_SHA=' + $env:EXPECTED_SHA)
            & go vet ./... *> $log
            if ($LASTEXITCODE -ne 0) { throw 'KTERMINAL_GO_VET_FAILED_PRIVATE_DETAILS_WITHHELD' }
            Write-Host 'KTERMINAL_GO_VET=PASS'
            & go build ./... *> $log
            if ($LASTEXITCODE -ne 0) { throw 'KTERMINAL_GO_BUILD_FAILED_PRIVATE_DETAILS_WITHHELD' }
            Write-Host 'KTERMINAL_GO_BUILD=PASS'
            if (@(& git status --porcelain --untracked-files=all).Count -ne 0) { throw 'KTERMINAL_DIRTY_AFTER_TESTS' }
            if ((& git rev-parse HEAD).Trim() -cne $env:EXPECTED_SHA) { throw 'KTERMINAL_HEAD_CHANGED' }
            Write-Host 'KTERMINAL_SOURCE_UNCHANGED=PASS'
            Write-Host 'KTERMINAL_WPF_DESKTOP_GUI=NOT_TESTED'
            Write-Host 'KTERMINAL_REAL_PARTNER_ZIP=NOT_TESTED'
            Write-Host 'KTERMINAL_FULL_APPLICATION_ACCEPTANCE=NOT_GRANTED'
            Write-Host 'KTERMINAL_NO_TRADING_OR_PROMOTION=TRUE'
          } finally {
            Pop-Location
            Remove-Item -LiteralPath $log -Force -ErrorAction SilentlyContinue
          }

      - name: Remove private source before ephemeral runner disposal
        if: always()
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE 'private-checkout'
          if (Test-Path -LiteralPath $source) {
            Remove-Item -LiteralPath $source -Recurse -Force -ErrorAction SilentlyContinue
          }
          Write-Host 'KTERMINAL_PRIVATE_SOURCE_ARTIFACTS=NONE'
