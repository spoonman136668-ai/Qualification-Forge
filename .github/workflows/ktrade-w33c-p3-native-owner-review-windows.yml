name: KTRADE W33C P3 native finalized close and original owner review Windows
permissions:
  contents: read
on:
  push:
    branches: [qualification/ktrade-w33c-p3-native-owner-review-20261028]
    paths: [.github/workflows/ktrade-w33c-p3-native-owner-review-windows.yml]
concurrency:
  group: ktrade-w33c-p3-native-owner-review
  cancel-in-progress: true
jobs:
  qualify:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      GOWORK: 'off'
      GOFLAGS: '-p=2'
      GOMAXPROCS: '2'
      CGO_ENABLED: '1'
    steps:
      - name: Checkout qualification witness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: witness
          persist-credentials: false
      - name: Checkout pinned private KTRADE candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: spoonman136668-ai/ktrade
          ref: ecd4d156d4854835a4680a38322c37f861364e08
          path: current
          fetch-depth: 6
          persist-credentials: false
          token: ${{ secrets.KTRADE_SOURCE_READ_TOKEN }}
      - name: Exact qualified P2 ancestry and fourteen native owner review paths
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows'){throw 'WRONG_RUNNER'}
          $root=Join-Path $env:GITHUB_WORKSPACE 'current'
          if((& git -C $root rev-parse HEAD).Trim() -cne 'ecd4d156d4854835a4680a38322c37f861364e08'){throw 'SOURCE_SHA_DRIFT'}
          if((& git -C $root rev-parse 'HEAD^{tree}').Trim() -cne '20aa0733f9907c4492eb90b3afb21e3026bebd8f'){throw 'SOURCE_TREE_DRIFT'}
          if((& git -C $root merge-base HEAD 9914fe83db8fb76f9e0bd2beddb0a6a6d4daa46c).Trim() -cne '9914fe83db8fb76f9e0bd2beddb0a6a6d4daa46c'){throw 'P0_ANCESTRY_DRIFT'}
          $actual=@(& git -C $root diff --name-only 9914fe83db8fb76f9e0bd2beddb0a6a6d4daa46c HEAD|Sort-Object)
          $expected=@('pkg/pine_compiler.go','pkg/pine_strategy.go','pkg/pine_compile_v2.go','pkg/pine_finalized_close.go','pkg/w33c_p3_finalized_close_test.go','internal/paperengine/owner.go','internal/paperengine/final_close_review.go','internal/paperengine/w33c_p3_owner_review_test.go','internal/papercustody/verify_review.go','cmd/ktrade/paper_strategy_preview_full.go','cmd/ktrade/paper_final_close_review_full.go','cmd/ktrade/w33c_p3_native_close_full_test.go','cmd/ktrade/paper_session_full.go','cmd/ktrade/paper_session_runner_full.go'|Sort-Object)
          if(Compare-Object $expected $actual){throw 'P3_FOURTEEN_PATH_DRIFT'}
          if(@(& git -C $root status --porcelain).Count -ne 0){throw 'DIRTY_CHECKOUT'}
          Write-Output '::notice::W33C_P3_EXACT_SOURCE_FOURTEEN_PATH_NATIVE_REVIEW=PASS'
      - name: Go Windows
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: false
      - name: Native finalized compiler original owner custody and saved-source controller proof
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:TEMP=$env:RUNNER_TEMP;$env:TMP=$env:RUNNER_TEMP
          Push-Location (Join-Path $env:GITHUB_WORKSPACE 'current')
          try{
            & go test -mod=readonly -count=1 -v -run '^TestW33C' ./internal/paperexit
            if($LASTEXITCODE -ne 0){throw 'P2_SOURCE_BOUND_INERT_SELL_REVIEW_TEST_FAILED'}
            & go test -mod=readonly -count=1 -v -run '^TestW33C' ./pkg
            if($LASTEXITCODE -ne 0){throw 'PINE_PROVENANCE_FAILED'}
            & go test -mod=readonly -count=1 -v -tags ktrade_full -run '^TestW33C' ./internal/paperreconcile ./internal/paperengine
            if($LASTEXITCODE -ne 0){throw 'OLD_SELL_AUTHORITY_REFUSAL_FAILED'}
            & go test -mod=readonly -count=1 -v -tags ktrade_full -run '^TestW33CP3' ./cmd/ktrade
            if($LASTEXITCODE -ne 0){throw 'P3_CANONICAL_NATIVE_CLOSE_OWNER_BRIDGE_FAILED'}
          }finally{Pop-Location}
          Write-Output '::notice::W33C_P3_NATIVE_FINALIZED_CLOSE_ORIGINAL_OWNER_RISK_CUSTODY_NO_SELL_ADMISSION=PASS'
      - name: Full root tagged-app and nested Wails regression and vet
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:TEMP=$env:RUNNER_TEMP;$env:TMP=$env:RUNNER_TEMP
          $src=Join-Path $env:GITHUB_WORKSPACE 'current'
          Push-Location $src
          try{
            & go test -mod=readonly -count=1 -tags ktrade_full ./cmd/ktrade
            if($LASTEXITCODE -ne 0){throw 'TAGGED_APP_TEST_FAILED'}
            & go vet -mod=readonly -tags ktrade_full ./cmd/ktrade
            if($LASTEXITCODE -ne 0){throw 'TAGGED_APP_VET_FAILED'}
            & go test -mod=readonly -count=1 ./...
            if($LASTEXITCODE -ne 0){throw 'ROOT_TEST_FAILED'}
            & go vet -mod=readonly ./...
            if($LASTEXITCODE -ne 0){throw 'ROOT_VET_FAILED'}
          }finally{Pop-Location}
          Push-Location (Join-Path $src 'tools/wails-pilot')
          try{
            & go test -mod=readonly -count=1 ./...
            if($LASTEXITCODE -ne 0){throw 'WAILS_TEST_FAILED'}
            & go vet -mod=readonly ./...
            if($LASTEXITCODE -ne 0){throw 'WAILS_VET_FAILED'}
          }finally{Pop-Location}
          Write-Output '::notice::W33C_P3_FULL_GO_AND_WAILS_REGRESSION=PASS'
      - name: Cleanup
        if: always()
        shell: pwsh
        run: |
          Remove-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'current') -Recurse -Force -ErrorAction SilentlyContinue
          Write-Output '::notice::W33C_P3_NO_BROKER_NO_SELL_ADMISSION_NO_OWNER_PROFILE_NO_BINARY_UPLOAD=PASS'
