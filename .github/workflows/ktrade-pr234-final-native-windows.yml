name: KTRADE PR234 native input settings current API race full Windows and same scanned package lifecycle
on:
  push:
    branches: [qualification/ktrade-native-pine-input-settings-20261031]
    paths: [.github/workflows/ktrade-pr234-final-native-windows.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: ktrade-pr234-final-native-20261031
  cancel-in-progress: false
jobs:
  final-native:
    runs-on: windows-2022
    timeout-minutes: 80
    env:
      GOWORK: 'off'
      GOFLAGS: '-p=2'
      GOMAXPROCS: '2'
      CGO_ENABLED: '1'
      GOTOOLCHAIN: 'local'
      KTRADE_LIVE_TRADING: 'false'
      KTRADE_USE_LEGACY_CDP_CONFIG: '0'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      KTRADE_EXPECTED_SOURCE: 'db79330ffee632b66c5e17b4a60d29c421febbab'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: witness
          persist-credentials: false
      - name: Qualified previous native source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: spoonman136668-ai/ktrade
          ref: b03dd6e58b6120cae3ffd39a79c6965ab8e91b9a
          path: previous
          persist-credentials: false
          token: ${{ secrets.KTRADE_SOURCE_READ_TOKEN }}
      - name: Exact PR234 final source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: spoonman136668-ai/ktrade
          ref: db79330ffee632b66c5e17b4a60d29c421febbab
          path: product
          fetch-depth: 20
          persist-credentials: false
          token: ${{ secrets.KTRADE_SOURCE_READ_TOKEN }}
      - name: Four sparse original baseline readers only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: spoonman136668-ai/ktrade
          ref: a359e86d05e5ba24b71a1f4bdd8a5e36ebd31b58
          path: browser-baseline
          persist-credentials: false
          token: ${{ secrets.KTRADE_SOURCE_READ_TOKEN }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /static/watchlist_manager.js
            /static/layout_manager.js
            /static/indicator_library.js
            /static/indicator_browser.js
      - name: Actual source custody focused original failure proof and unchanged financial scenario
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/Qualification-Forge' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows'){throw 'EXISTING_QUALIFICATION_HOST_REQUIRED'}
          $src=Join-Path $env:GITHUB_WORKSPACE 'product'
          if((& git -C $src rev-parse HEAD).Trim() -cne 'db79330ffee632b66c5e17b4a60d29c421febbab' -or (& git -C $src rev-parse 'HEAD^{tree}').Trim() -cne '4568f1fddd8494f0bdeafd09b642b580a0ff85eb'){throw 'EXACT_FINAL_SOURCE_REQUIRED'}
          & git -C $src merge-base --is-ancestor 42bf2c698d15da43632540959f9a5eea3999158b HEAD
          if($LASTEXITCODE -ne 0){throw 'EXACT_QUALIFIED_PR232_BASE_REQUIRED'}
          if((& git -C $src rev-parse 'HEAD:internal/originaltradeguard').Trim() -cne '1f894b0a6f8115b8a9d3882fa16fdb289eba510a' -or (& git -C $src rev-parse 'HEAD:internal/paperreconcile').Trim() -cne '9507b1f181b9a82ebbc4fa63f4bc05b27613e25e'){throw 'ORIGINAL_GUARD_OR_LEDGER_TREE_DRIFT'}
          if((& git -C $src rev-parse 'HEAD:pkg/pine_compiler.go').Trim() -cne '846f9f7f73d801fcb9d71b3da626143dade8e721'){throw 'EXACT_CAUSAL_RSI_COMPILER_REQUIRED'}
          $delta=@(& git -C $src diff --name-only 42bf2c698d15da43632540959f9a5eea3999158b HEAD)
          if($delta.Count -ne 8 -or @($delta|Where-Object {$_ -cnotin @('pkg/pine_input_overrides_v2.go','pkg/pine_input_overrides_v2_test.go','cmd/ktrade/main_full.go','cmd/ktrade/pine_input_settings_full.go','cmd/ktrade/pine_input_settings_full_test.go','static/pine_input_settings.js','templates/chart.tmpl','tests/rb3_pine_input_settings.test.cjs')}).Count -ne 0){throw 'EXACT_INPUT_SETTINGS_EIGHT_PATH_DELTA_REQUIRED'}
          foreach($dir in @('previous','product')){
            $p=Join-Path $env:GITHUB_WORKSPACE $dir
            if(@(& git -C $p status --porcelain).Count -ne 0 -or (Test-Path (Join-Path $p '.env'))){throw 'EXACT_CLEAN_CREDENTIAL_FREE_SOURCE_REQUIRED'}
            $cfg=Get-Content (Join-Path $p 'config.json') -Raw|ConvertFrom-Json
            if($cfg.api_key.key_name -or $cfg.api_key.key_secret -or $cfg.account_id -or $cfg.ngrok_authtoken){throw 'TRACKED_CREDENTIALS_REFUSED'}
            if((Get-Content (Join-Path $p 'pkg/advanced_orders.go') -Raw) -notmatch 'func liveBrokerageAuthorized\(\) bool \{ return false \}'){throw 'LIVE_AUTHORITY_DRIFT'}
          }
          if((& git -C $src rev-parse 'HEAD:.github/workflows/ktrade-native-windows.yml').Trim() -cne 'b971da1a5721dc43839dc0e99b22df3ee4e2fa10'){throw 'SOURCE_OWNED_CI_WORKFLOW_DRIFT'}
          $proof=Invoke-RestMethod -Uri 'https://api.github.com/repos/spoonman136668-ai/Qualification-Forge/actions/runs/41225972238' -Headers @{Authorization=('Bearer '+$env:GITHUB_TOKEN);Accept='application/vnd.github+json'} -TimeoutSec 30
          if($proof.status -cne 'completed' -or $proof.conclusion -cne 'success' -or $proof.head_sha -cne '590858d0519dc6e400aaf6f75449c4a22c9044c6'){throw 'ACTUAL_RAW_RSI_DIVERGENCE_GOLDEN_CAUSALITY_RACE_NEGATIVE_CONTROLS_REQUIRED'}
          $parent=Invoke-RestMethod -Uri 'https://api.github.com/repos/spoonman136668-ai/Qualification-Forge/actions/runs/41218814380' -Headers @{Authorization=('Bearer '+$env:GITHUB_TOKEN);Accept='application/vnd.github+json'} -TimeoutSec 30
          if($parent.status -cne 'completed' -or $parent.conclusion -cne 'success' -or $parent.head_sha -cne '0289a36f6d61794488a4be139f1247c527fb6858'){throw 'QUALIFIED_PR232_PARENT_FULL_SOURCE_AND_ACTUAL_NATIVE_ACCEPTANCE_REQUIRED'}
          $w=Join-Path $env:GITHUB_WORKSPACE 'witness'
          $receipt=Join-Path $w 'qualification-receipts/ktrade-pr234-focused-input-settings-windows-20261031.json'
          if((& git -C $w rev-parse 'HEAD:qualification-receipts/ktrade-pr234-focused-input-settings-windows-20261031.json').Trim() -cne 'c9bf6e2788314e8dce2963d8d7bcd11544bf2530'){throw 'FOCUSED_RECEIPT_DRIFT'}
          $r=Get-Content $receipt -Raw|ConvertFrom-Json
          if($r.source_sha -cne '5acb8d637d0add7b508089c82909591328ca840b' -or $r.verdict -cne 'PASS_SCOPED_FOCUSED_ORIGINAL_TYPED_INPUT_NUMERICS_AND_API_STORAGE_ON_5ACB' -or $r.reuse_boundary.current_candidate -cne 'db79330ffee632b66c5e17b4a60d29c421febbab'){throw 'FOCUSED_SCOPED_REUSE_NOT_ACCEPTED'}
          & git -C $src merge-base --is-ancestor 5acb8d637d0add7b508089c82909591328ca840b HEAD
          if($LASTEXITCODE -ne 0){throw 'FOCUSED_SOURCE_ANCESTRY_REQUIRED'}
          $changed=@(& git -C $src diff --name-only 5acb8d637d0add7b508089c82909591328ca840b HEAD|Sort-Object)
          $allowed=@('cmd/ktrade/pine_input_settings_full.go','cmd/ktrade/pine_input_settings_full_test.go','templates/chart.tmpl')|Sort-Object
          if(($changed -join '|') -cne ($allowed -join '|') -or (& git -C $src rev-parse 'HEAD:pkg').Trim() -cne (& git -C $src rev-parse '5acb8d637d0add7b508089c82909591328ca840b:pkg').Trim()){throw 'IDENTICAL_PKG_RUNTIME_MODULES_AND_TESTS_REQUIRED_FOR_FOCUSED_REUSE'}
          # Current API race tests below must cover both modified files and the
          # added no-storage-root path before any candidate-wide acceptance.
          $pins=@(
            @('qualification-harness/ktrade-pine-input-settings/Installed-Settings-Lifecycle.ps1','5f0d119fa4d7bc6749ce78c1e0253a02d1a147af'),
            @('qualification-harness/ktrade-pine-input-settings/Build-And-Qualify.ps1','904bc3b46afe70e8ec8ea0f75b0743d75c316776'),
            @('qualification-harness/ktrade-w83/Original-W40-Paper.ps1','c69c3c05ff7f4ef933856b036bfa23fbf0a760f1')
          )
          foreach($pin in $pins){
            if((& git -C $w rev-parse ('HEAD:'+$pin[0])).Trim() -cne $pin[1]){throw 'IMMUTABLE_NATIVE_OR_ORIGINAL_FINANCIAL_HARNESS_DRIFT'}
            $tokens=$null;$errors=$null
            [void][Management.Automation.Language.Parser]::ParseFile((Join-Path $w $pin[0]),[ref]$tokens,[ref]$errors)
            if($errors.Count -ne 0){throw 'NATIVE_HARNESS_AST_INVALID'}
          }
          Write-Host '::notice::PR234_EXACT_INPUT_SETTINGS_ORIGINAL_COMPILER_FINANCIAL_CUSTODY_LIVE_FALSE=PASS'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Current exact API race tests including no admitted storage root
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:TEMP=$env:RUNNER_TEMP;$env:TMP=$env:RUNNER_TEMP
          Push-Location (Join-Path $env:GITHUB_WORKSPACE 'product')
          try{
            $out=@(& go test -race -json -mod=readonly -tags=ktrade_full -count=1 -timeout 15m -run '^TestPineInputSettings' ./cmd/ktrade)
            $exit=$LASTEXITCODE
            foreach($line in $out){Write-Host $line}
            if($exit -ne 0){throw 'CURRENT_EXACT_SETTINGS_API_RACE_FAILED'}
            $events=@($out|ForEach-Object {try{$_|ConvertFrom-Json -ErrorAction Stop}catch{}})
            foreach($root in @('TestPineInputSettingsPersistCASAndSourceIsolation','TestPineInputSettingsRejectsBadRequestsAndPreservesCorruption','TestPineInputSettingsUnavailableRootIsReadOnly')){
              if(@($events|Where-Object {$_.Test -ceq $root -and $_.Action -ceq 'pass'}).Count -ne 1){throw 'CURRENT_EXACT_API_ROOT_NOT_EXECUTED'}
            }
            if(@($events|Where-Object {$_.Action -in @('fail','skip')}).Count -ne 0){throw 'CURRENT_API_FAILURE_OR_SKIP'}
            & go vet -mod=readonly -tags=ktrade_full ./cmd/ktrade
            if($LASTEXITCODE -ne 0){throw 'CURRENT_API_VET_FAILED'}
          }finally{Pop-Location}
          Write-Host '::notice::PR234_CURRENT_API_RACE_CAS_CORRUPTION_COLD_RESET_AND_VIEW_ONLY_NO_STORAGE_FALLBACK=PASS'
      - name: Exact source-owned complete Go tagged app and Wails final regression
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $meta=((& node (Join-Path $env:GITHUB_WORKSPACE 'witness/qualification-harness/ktrade-final-ci/Extract-Step.cjs') go) -join '')|ConvertFrom-Json
          if($LASTEXITCODE -ne 0 -or $meta.shell -cne 'pwsh' -or $meta.script_sha256 -cne '7e2782e1049b8d8bd297ebccab761c67be95049c237bbb33b311865938b1e054'){throw 'SOURCE_OWNED_FINAL_CI_BODY_DRIFT'}
          Write-Host ('SOURCE_OWNED_CI_STEP='+($meta|ConvertTo-Json -Compress))
          Push-Location (Join-Path $env:GITHUB_WORKSPACE 'product')
          try{
            & $meta.path
            if($LASTEXITCODE -ne 0){throw 'SOURCE_OWNED_FINAL_CI_EXECUTION_FAILED'}
          }finally{Pop-Location}
      - name: Exact source-owned complete Node and browser compatibility
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $meta=((& node (Join-Path $env:GITHUB_WORKSPACE 'witness/qualification-harness/ktrade-final-ci/Extract-Step.cjs') node) -join '')|ConvertFrom-Json
          if($LASTEXITCODE -ne 0 -or $meta.shell -cne 'pwsh' -or $meta.script_sha256 -cne '3ba16ab998f391a42c9879de1f1f94f071e526e819078200c5c4657472c7a6a7'){throw 'SOURCE_OWNED_FINAL_CI_BODY_DRIFT'}
          Write-Host ('SOURCE_OWNED_CI_STEP='+($meta|ConvertTo-Json -Compress))
          Push-Location (Join-Path $env:GITHUB_WORKSPACE 'product')
          try{
            & $meta.path
            if($LASTEXITCODE -ne 0){throw 'SOURCE_OWNED_FINAL_CI_EXECUTION_FAILED'}
          }finally{Pop-Location}
      - name: Exact source-owned real assets licenses and shipping advisory audit
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $meta=((& node (Join-Path $env:GITHUB_WORKSPACE 'witness/qualification-harness/ktrade-final-ci/Extract-Step.cjs') assets) -join '')|ConvertFrom-Json
          if($LASTEXITCODE -ne 0 -or $meta.shell -cne 'pwsh' -or $meta.script_sha256 -cne '1b29ef7108a4a46b2b5384dab5334cca99a65403c5c43efe166f24d8a0e035ab'){throw 'SOURCE_OWNED_FINAL_CI_BODY_DRIFT'}
          Write-Host ('SOURCE_OWNED_CI_STEP='+($meta|ConvertTo-Json -Compress))
          Push-Location (Join-Path $env:GITHUB_WORKSPACE 'product')
          try{
            & $meta.path
            if($LASTEXITCODE -ne 0){throw 'SOURCE_OWNED_FINAL_CI_EXECUTION_FAILED'}
          }finally{Pop-Location}
      - name: Exact source-owned unsigned six-binary package and actual binary scans
        id: package
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $env:PSModulePath=Join-Path $PSHOME 'Modules'
          $meta=((& node (Join-Path $env:GITHUB_WORKSPACE 'witness/qualification-harness/ktrade-final-ci/Extract-Step.cjs') build) -join '')|ConvertFrom-Json
          if($LASTEXITCODE -ne 0 -or $meta.shell -cne 'powershell' -or $meta.script_sha256 -cne '98eaa9753ac0addeea61d27ccc638868c255b0e47b359221b74da8a2ba8762be'){throw 'SOURCE_OWNED_FINAL_CI_BODY_DRIFT'}
          Write-Host ('SOURCE_OWNED_CI_STEP='+($meta|ConvertTo-Json -Compress))
          Push-Location (Join-Path $env:GITHUB_WORKSPACE 'product')
          try{
            . $meta.path
            if($LASTEXITCODE -ne 0){throw 'SOURCE_OWNED_FINAL_CI_EXECUTION_FAILED'}
            if(!$root -or !(Test-Path (Join-Path $root 'KTRADE-SetupBundle.zip'))){throw 'EXACT_SOURCE_CI_PACKAGE_ROOT_MISSING'}
            $hash=(Get-FileHash (Join-Path $root 'KTRADE-SetupBundle.zip') -Algorithm SHA256).Hash.ToLowerInvariant()
            [IO.File]::AppendAllText($env:GITHUB_OUTPUT,('bundle_root='+$root+[Environment]::NewLine+'archive_sha256='+$hash+[Environment]::NewLine),[Text.UTF8Encoding]::new($false))
          }finally{Pop-Location}
      - name: Install and test the same original scanned current archive with native UI PAPER cold and rollback
        shell: pwsh
        env:
          CANDIDATE_BUNDLE_ROOT: ${{ steps.package.outputs.bundle_root }}
          CANDIDATE_ARCHIVE_SHA256: ${{ steps.package.outputs.archive_sha256 }}
        run: |
          $ErrorActionPreference='Stop'
          $env:TEMP=$env:RUNNER_TEMP;$env:TMP=$env:RUNNER_TEMP
          $h=Join-Path $env:GITHUB_WORKSPACE 'witness/qualification-harness/ktrade-w83'
          $probeLog=Join-Path $env:RUNNER_TEMP 'pr234-native-output.txt'
          & (Join-Path $env:GITHUB_WORKSPACE 'witness/qualification-harness/ktrade-pine-input-settings/Build-And-Qualify.ps1') -PreviousCheckout (Join-Path $env:GITHUB_WORKSPACE 'previous') -CandidateCheckout (Join-Path $env:GITHUB_WORKSPACE 'product') -WitnessScript (Join-Path $env:GITHUB_WORKSPACE 'witness/qualification-harness/ktrade-pine-input-settings/Installed-Settings-Lifecycle.ps1') -NativeInputsPath (Join-Path $h 'Original-W40-Native-Inputs.ps1') -PaperScenarioPath (Join-Path $h 'Original-W40-Paper.ps1') -CandidateQualifiedBundleRoot $env:CANDIDATE_BUNDLE_ROOT -ExpectedCandidateArchiveSha256 $env:CANDIDATE_ARCHIVE_SHA256 2>&1 | Tee-Object -FilePath $probeLog
          if($LASTEXITCODE -ne 0 -or !$?){throw 'ORIGINAL_SAME_ARCHIVE_NATIVE_LIFECYCLE_FAILED'}
          # Actual execution coverage is mandatory. Defined-but-uncalled probes
          # must never turn a green lifecycle run into visual/memory acceptance.
          $observed=@(Get-Content -LiteralPath $probeLog)
          function ProbeJson([string]$prefix,[int]$count){
            $rows=@($observed|Where-Object {$_ -is [string] -and $_.StartsWith($prefix,[StringComparison]::Ordinal)})
            if($rows.Count -ne $count){throw ('W94B_REQUIRED_ACTUAL_PROBE_OUTPUT_MISSING_'+$prefix)}
            return @($rows|ForEach-Object {$_.Substring($prefix.Length)|ConvertFrom-Json -ErrorAction Stop})
          }
          $screens=@(ProbeJson 'W94B_PRICE_CHART_SCREEN_DIGEST=' 2)
          if(@($screens|Where-Object {$_.phase -ceq 'BEFORE_SUPERTREND'}).Count -ne 1 -or @($screens|Where-Object {$_.phase -ceq 'AFTER_SUPERTREND'}).Count -ne 1){throw 'W94B_BOTH_REAL_SCREEN_PHASES_REQUIRED'}
          $comparison=@(ProbeJson 'W94B_REAL_PRICE_PANE_COMPARISON=' 1)[0]
          if(!$comparison.identical_bounds -or $comparison.pixel_sample_count -lt 500 -or $comparison.changed_sample_count -lt 15 -or $comparison.before_sha256 -ceq $comparison.after_sha256){throw 'W94B_ACTUAL_PANE_PIXEL_DELTA_REQUIRED'}
          foreach($prefix in @('W94B_PROCESS_TREE_BEFORE=','W94B_PROCESS_TREE_AFTER=')){
            $p=@(ProbeJson $prefix 1)[0]
            if($p.webview2_count -lt 1 -or $p.process_count -ne @($p.members).Count -or $p.total_working_set_bytes -le 0){throw 'W94B_COMPLETE_REAL_PROCESS_MEASUREMENT_REQUIRED'}
            $sum=[long]0;foreach($member in $p.members){$sum+=[long]$member.working_set_bytes}
            if($sum -ne [long]$p.total_working_set_bytes){throw 'W94B_PROCESS_TOTAL_MISMATCH'}
          }
          if(@($observed|Where-Object {$_ -ceq '::notice::W94B_ACTIVE_PIXEL_AND_WEBVIEW_PROCESS_PROBES_EXECUTED=PASS'}).Count -ne 1){throw 'W94B_ACTUAL_PROBE_COMPLETION_REQUIRED'}
          Write-Host '::notice::W94B_ACTUAL_OUTPUT_COVERAGE_ENFORCED_PANE_DIFFERENCE_AND_ALL_OBSERVED_DESCENDANT_MEMORY=PASS'
          if(@($observed|Where-Object {$_ -ceq '::notice::RSI_REAL_INSTALLED_WEBVIEW2_CONFIRMED_DIVERGENCE_PHYSICAL_APPLY_RSI_PANE_NO_TRADING=PASS'}).Count -ne 1){throw 'RSI_ACTUAL_PHYSICAL_APPLY_OUTPUT_REQUIRED'}
          foreach($required in @('::notice::PINE_SETTINGS_NATIVE_PHYSICAL_NUMERIC_APPLY_SAVE_VALIDATION_AND_SOURCE_CUSTODY=PASS','::notice::PINE_SETTINGS_NATIVE_COLD_REOPEN_RESTORE_AND_EXPLICIT_DEFAULT_RESET=PASS')){
            if(@($observed|Where-Object {$_ -ceq $required}).Count -ne 1){throw 'SETTINGS_ACTUAL_NATIVE_PROBE_COMPLETION_REQUIRED'}
          }
          $settings=@(ProbeJson 'PINE_SETTINGS_ACTUAL_NATIVE_COLD_RESTORE_RESET=' 2)
          if(@($settings|Where-Object {$_.name -ceq 'Supertrend' -and $_.restored_values.input_0 -eq 3 -and $_.restored_values.input_1 -eq 2.5 -and $_.explicit_reset_verified -eq $true -and $_.disk_and_original_go_verified -eq $true}).Count -ne 1 -or @($settings|Where-Object {$_.name -ceq 'RSI Divergence' -and $_.restored_values.input_0 -eq 3 -and $_.explicit_reset_verified -eq $true -and $_.disk_and_original_go_verified -eq $true}).Count -ne 1){throw 'BOTH_REAL_SETTINGS_VALUES_AND_COLD_RESET_OUTPUTS_REQUIRED'}
          Write-Host '::notice::PR234_ACTUAL_NUMERIC_SETTINGS_PHYSICAL_SAVE_INVALID_VALUE_COLD_DISK_RESTORE_DEFAULT_RESET_OUTPUT_COVERAGE=PASS'
          Write-Host '::notice::W83_REAL_INSTALLED_UPGRADE_FOUR_CURRENT_NATIVE_PAPER_FILLS_STOP_COLD_ACCOUNT_ROLLBACK_HISTORY_RETAINED=PASS'
      - name: Final source custody no owner data or production authority
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($dir in @('previous','product')){
            if(@(& git -C (Join-Path $env:GITHUB_WORKSPACE $dir) status --porcelain --untracked-files=no).Count -ne 0){throw 'FINAL_TRACKED_SOURCE_CHANGED'}
          }
          Write-Host '::notice::NO_OWNER_DATA_NO_REAL_BROKER_NO_SIGNING_NO_PROMOTION_NO_LIVE'
