name: G45 private offline compiler-qualified dependency navigator acceptance
on:
  push:
    branches: [qualification/g45-offline-browser-20261019]
    paths: [.github/workflows/g45-offline-browser-windows.yml]
permissions:
  contents: read
concurrency:
  group: g45-offline-browser-20261019
  cancel-in-progress: false
jobs:
  qualification:
    if: github.repository == 'spoonman136668-ai/Qualification-Forge'
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      SOURCE: '5ab492676eadd74dad242c4b5d09caee4db65712'
      TREE: '7951b17a3c3f168b6d94ddb90c3ffa0e18d72ebb'
      BASE: '4c767e79fedb60a38862ba98917d97bc70dd0984'
      GOFLAGS: '-p=2'
      GOMAXPROCS: '2'
      CGO_ENABLED: '1'
      KTRADE_CI_PAPER_ONLY: '1'
      KTRADE_CI_LIVE_AUTHORITY: '0'
      KTRADE_CI_COINBASE_ALLOWED: '0'
      KTRADE_CI_PROMOTION_ALLOWED: '0'
    steps:
      - name: Checkout exact private source without retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: spoonman136668-ai/KTRADE
          ref: 5ab492676eadd74dad242c4b5d09caee4db65712
          fetch-depth: 0
          path: source
          persist-credentials: false
          token: ${{ secrets.KTRADE_SOURCE_READ_TOKEN }}
      - name: Verify exact source and three added navigator-only paths
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_OS -cne 'Windows' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or
             $env:KTRADE_CI_PAPER_ONLY -cne '1' -or $env:KTRADE_CI_LIVE_AUTHORITY -cne '0' -or
             $env:KTRADE_CI_COINBASE_ALLOWED -cne '0' -or $env:KTRADE_CI_PROMOTION_ALLOWED -cne '0'){
            throw 'G45_UNSAFE_PLATFORM_OR_AUTHORITY'
          }
          if((git rev-parse HEAD).Trim() -cne $env:SOURCE -or
             (git rev-parse 'HEAD^{tree}').Trim() -cne $env:TREE -or
             @(git status --porcelain).Count -ne 0){throw 'G45_SOURCE_DRIFT'}
          $expected=@(
            'tools/graphify/g45_browser/main.go',
            'tools/graphify/g45_browser/main_test.go',
            'tools/graphify/g45_browser/README.md'
          )|Sort-Object
          $actual=@(git diff --name-only $env:BASE $env:SOURCE)|Sort-Object
          if($actual.Count -ne 3 -or @(Compare-Object $expected $actual).Count -ne 0){throw 'G45_SCOPE_DRIFT'}
          $srcMod=(git rev-parse ($env:SOURCE+':go.mod')).Trim()
          $baseMod=(git rev-parse ($env:BASE+':go.mod')).Trim()
          if($srcMod -cne $baseMod){throw 'G45_GO_MOD_DRIFT'}
          if((git rev-parse ($env:SOURCE+':go.sum')).Trim() -cne '69585a34b570b18b077a232985e0bd116adaecd3'){
            throw 'G45_GO_SUM_DRIFT'
          }
          $g35files=@(
            'tools/graphify/g35_typecalls/main.go',
            'tools/graphify/g35_typecalls/main_test.go',
            'tools/graphify/g35_typecalls/sqlite_external.go',
            'tools/graphify/g35_typecalls/sqlite_external_test.go',
            'tools/graphify/g35_typecalls/g39_closure_test.go',
            'tools/graphify/g35_typecalls/g41_initializers_test.go',
            'tools/graphify/g35_typecalls/g43_method_receiver_test.go',
            'tools/graphify/g35_typecalls/G43.md'
          )
          foreach($f in $g35files){
            if((git rev-parse ($env:BASE+':'+$f)).Trim() -cne (git rev-parse ($env:SOURCE+':'+$f)).Trim()){
              throw 'G45_UNCHANGED_G35_FOUNDATION_DRIFT'
            }
          }
          Write-Host 'G45_EXACT_THREE_NAVIGATOR_FILES_ONLY=PASS'
      - name: Use frozen Go 1.23 Windows toolchain
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Authenticate pinned SQLite module in disposable Go cache
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference='Stop'
          $p=& go mod download -json github.com/mattn/go-sqlite3@v1.14.18 | ConvertFrom-Json
          if($LASTEXITCODE -ne 0 -or $p.Path -cne 'github.com/mattn/go-sqlite3' -or
             $p.Version -cne 'v1.14.18' -or
             $p.Sum -cne 'h1:JL0eqdCOq6DJVNPSvArO/bIV9/P7fbGrV00LZHc+5aI=' -or
             $p.GoModSum -cne 'h1:2eHXhiwb8IkHr+BDWZGa96P6+rkvnG63S2DGjv9HUNg='){
            throw 'G45_SQLITE_GO_MODULE_AUTH_FAILURE'
          }
          & go mod verify
          if($LASTEXITCODE -ne 0){throw 'G45_DEPENDENCY_CACHE_VERIFY_FAILED'}
          Write-Host 'G45_SQLITE_EXACT_MODULE_SOURCE_VERIFIED=PASS'
      - name: Qualify bounded new compiler concurrency and affected tool interfaces
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference='Stop'
          $v=(& go version)
          if($LASTEXITCODE -ne 0 -or $v -cne 'go version go1.23.12 windows/amd64'){
            throw 'G45_TOOLCHAIN_DRIFT'
          }
          # Source changed at SQLite compiler-concurrency boundary; never reuse
          # focused evidence from the previous, different SHA.
          & go test -mod=readonly -count=1 ./tools/graphify/g45_browser
          if($LASTEXITCODE -ne 0){throw 'G45_FOCUSED_TEST_FAILURE'}
          & go vet -mod=readonly ./tools/graphify/g45_browser
          if($LASTEXITCODE -ne 0){throw 'G45_VET_FAILURE'}
          & go build -mod=readonly -o (Join-Path $env:RUNNER_TEMP 'g45.exe') ./tools/graphify/g35_typecalls
          if($LASTEXITCODE -ne 0){throw 'G45_BUILD_FAILURE'}
          & go build -mod=readonly -o (Join-Path $env:RUNNER_TEMP 'g45-browser.exe') ./tools/graphify/g45_browser
          if($LASTEXITCODE -ne 0){throw 'G45_BROWSER_BUILD_FAILURE'}
          Write-Host 'G45_NEW_SHA_BROWSER_TEST_VET_BUILD=PASS'
      - name: Measure bounded authenticated type-resolution experiment
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference='Stop'
          $raw=Join-Path $env:RUNNER_TEMP ('g45-private-'+$env:GITHUB_RUN_ID+'.json')
          if(Test-Path -LiteralPath $raw){throw 'G45_RAW_COLLISION'}
          $exe=Join-Path $env:RUNNER_TEMP 'g45.exe'
          $psi=[System.Diagnostics.ProcessStartInfo]::new($exe)
          $psi.WorkingDirectory=(Get-Location).Path
          $psi.UseShellExecute=$false
          $psi.RedirectStandardOutput=$true
          $psi.RedirectStandardError=$true
          [void]$psi.ArgumentList.Add('--repo=.')
          [void]$psi.ArgumentList.Add(('--base='+$env:BASE))
          [void]$psi.ArgumentList.Add(('--source='+$env:SOURCE))
          [void]$psi.ArgumentList.Add('--packages=internal/paperauthority,internal/paperapp')
          [void]$psi.ArgumentList.Add(('--out='+$raw))
          if($psi.ArgumentList.Count -ne 5){throw 'G45_ARGUMENT_VECTOR_FAILED'}
          # A Windows Job Object constrains all descendants (including
          # go list, compile and cgo) to the existing 512 MiB budget, and
          # accounts CPU across exited child processes. No increased limits.
          $jobCSharp=@'
          using System;
          using System.Runtime.InteropServices;
          public static class G45ProcessTreeBudget {
            [StructLayout(LayoutKind.Sequential)] public struct BasicLimit {
              public long PerProcessUserTimeLimit, PerJobUserTimeLimit;
              public uint LimitFlags;
              public UIntPtr MinimumWorkingSetSize, MaximumWorkingSetSize;
              public uint ActiveProcessLimit;
              public UIntPtr Affinity;
              public uint PriorityClass, SchedulingClass;
            }
            [StructLayout(LayoutKind.Sequential)] public struct IoCounters {
              public ulong ReadOperations, WriteOperations, OtherOperations;
              public ulong ReadBytes, WriteBytes, OtherBytes;
            }
            [StructLayout(LayoutKind.Sequential)] public struct ExtendedLimit {
              public BasicLimit BasicLimitInformation;
              public IoCounters IoInfo;
              public UIntPtr ProcessMemoryLimit, JobMemoryLimit;
              public UIntPtr PeakProcessMemoryUsed, PeakJobMemoryUsed;
            }
            [StructLayout(LayoutKind.Sequential)] public struct Accounting {
              public long TotalUserTime, TotalKernelTime;
              public long ThisPeriodTotalUserTime, ThisPeriodTotalKernelTime;
              public uint TotalPageFaultCount, TotalProcesses;
              public uint ActiveProcesses, TotalTerminatedProcesses;
            }
            [DllImport("kernel32.dll", SetLastError=true)]
            static extern IntPtr CreateJobObject(IntPtr attributes, string name);
            [DllImport("kernel32.dll", SetLastError=true)]
            static extern bool SetInformationJobObject(IntPtr job,int kind,ref ExtendedLimit data,uint size);
            [DllImport("kernel32.dll", SetLastError=true)]
            static extern bool QueryInformationJobObject(IntPtr job,int kind,out ExtendedLimit data,uint size,out uint result);
            [DllImport("kernel32.dll", SetLastError=true)]
            static extern bool QueryInformationJobObject(IntPtr job,int kind,out Accounting data,uint size,out uint result);
            [DllImport("kernel32.dll", SetLastError=true)]
            static extern bool AssignProcessToJobObject(IntPtr job,IntPtr process);
            [DllImport("kernel32.dll", SetLastError=true)]
            static extern bool CloseHandle(IntPtr handle);
            static Exception Fail(string s){return new InvalidOperationException(s+": "+Marshal.GetLastWin32Error());}
            public static IntPtr Create(ulong limit){
              IntPtr job=CreateJobObject(IntPtr.Zero,null);
              if(job==IntPtr.Zero)throw Fail("G45_JOB_CREATE");
              var x=new ExtendedLimit();
              x.BasicLimitInformation.LimitFlags=0x00000200|0x00002000;
              x.JobMemoryLimit=new UIntPtr(limit);
              if(!SetInformationJobObject(job,9,ref x,(uint)Marshal.SizeOf<ExtendedLimit>())){
                CloseHandle(job);throw Fail("G45_JOB_SET_LIMIT");
              }
              return job;
            }
            public static void Attach(IntPtr job,IntPtr process){
              if(!AssignProcessToJobObject(job,process))throw Fail("G45_JOB_ATTACH");
            }
            public static double[] Read(IntPtr job){
              ExtendedLimit x;
              Accounting a;
              uint returned;
              if(!QueryInformationJobObject(job,9,out x,(uint)Marshal.SizeOf<ExtendedLimit>(),out returned))
                throw Fail("G45_JOB_MEMORY_READ");
              if(!QueryInformationJobObject(job,1,out a,(uint)Marshal.SizeOf<Accounting>(),out returned))
                throw Fail("G45_JOB_CPU_READ");
              return new double[]{(a.TotalUserTime+a.TotalKernelTime)/10000.0,
                  x.PeakJobMemoryUsed.ToUInt64(),a.TotalProcesses};
            }
            public static void Close(IntPtr job){if(job!=IntPtr.Zero)CloseHandle(job);}
          }
          '@
          Add-Type -TypeDefinition $jobCSharp -ErrorAction Stop
          $job=[G45ProcessTreeBudget]::Create([ulong]536870912)
          $watch=[System.Diagnostics.Stopwatch]::StartNew()
          $p=[System.Diagnostics.Process]::Start($psi)
          if($null -eq $p){[G45ProcessTreeBudget]::Close($job);throw 'G45_EXEC_START_FAILURE'}
          [G45ProcessTreeBudget]::Attach($job,$p.Handle)
          $stdout=$p.StandardOutput.ReadToEndAsync()
          $stderr=$p.StandardError.ReadToEndAsync()
          $rss=[long]0
          while(-not $p.HasExited){
            try{$m=[long]$p.PeakWorkingSet64;if($m -gt $rss){$rss=$m}}catch{}
            if($watch.Elapsed.TotalSeconds -gt 120){$p.Kill();throw 'G45_120_SECOND_WALL_LIMIT'}
            Start-Sleep -Milliseconds 50
          }
          $p.WaitForExit()
          $cpu=[long]$p.TotalProcessorTime.TotalMilliseconds
          $treeMetrics=[G45ProcessTreeBudget]::Read($job)
          [G45ProcessTreeBudget]::Close($job)
          $treeCpuMs=[long][Math]::Ceiling($treeMetrics[0])
          $treePeakBytes=[long]$treeMetrics[1]
          $treeProcesses=[long]$treeMetrics[2]
          Write-Host ('G45_JOB_OBSERVED_PROCESSES='+$treeProcesses)
          Write-Host ('G45_JOB_OBSERVED_CPU_MS='+$treeCpuMs)
          Write-Host ('G45_JOB_OBSERVED_PEAK_COMMIT='+$treePeakBytes)
          if($treeProcesses -lt 2 -or $treeCpuMs -gt 120000 -or
             $treePeakBytes -le 0 -or $treePeakBytes -gt 536870912){
             throw 'G45_TREE_CPU_MEMORY_HARD_LIMIT_OR_ACCOUNTING_FAILED'
          }
          $out=$stdout.GetAwaiter().GetResult()
          $err=$stderr.GetAwaiter().GetResult()
          $watch.Stop()
          if($p.ExitCode -ne 0){throw ('G45_GENERATOR_FAILED_'+$p.ExitCode+': '+$err)}
          if($cpu -gt 120000 -or $rss -le 0 -or $rss -gt 536870912 -or
             $watch.Elapsed.TotalSeconds -gt 120){throw 'G45_CPU_RSS_WALL_CAP'}
          $d=Get-Content -LiteralPath $raw -Raw|ConvertFrom-Json
          if($d.SourceCommit -cne $env:SOURCE -or $d.SourceTree -cne $env:TREE -or
             $d.Schema -cne 'graphify.g43.receiver-qualified-static-methods.v1' -or
             $d.CallSites -ne 1015 -or
             $d.PackageInitializerCallSites -ne 12 -or
             $d.PackageInitializerStaticEdges -ne 12 -or
             $d.NestedClosureCallSites -ne 276 -or $d.ClosureStaticEdges -ne 220 -or
             $d.CrossPackageStaticEdges -ne 18 -or $d.Unresolved -ne 206 -or
             $d.ReceiverQualifiedMethodEdges -le 0 -or
             $d.ReceiverQualifiedMethodEdges -ne $d.ResolvedConcreteMethods -or
             $d.SourceFileCount -gt 36 -or $d.SelectedSourceBytes -gt 3145728 -or
             $d.CallSites -ne ($d.ResolvedDirect+$d.ResolvedConcreteMethods+$d.ResolvedExternal+$d.Unresolved) -or
             @($d.TypeCheckedEdges).Count -ne ($d.CallSites-$d.Unresolved)){
            throw 'G45_CONSERVATION_OR_SOURCE_BOUNDARY_FAILED'
          }
          $expected=@('ktrade/internal/paperauthority','ktrade/internal/paperapp')
          foreach($pkg in $expected){if(@($d.Packages|Where-Object {$_.Package -ceq $pkg}).Count -ne 1){
             throw ('G45_NEW_PACKAGE_ABSENT_'+$pkg)
          }}
          # G45 repairs an ambiguous callee label while conserving the frozen
          # G41 caller/site, unresolved, initializer and closure boundaries.
          $receiverMethods=@($d.TypeCheckedEdges|Where-Object {$_.Kind -ceq 'concrete_method'})
          $qualifiedMethods=0
          foreach($edge in $receiverMethods){
            if([string]::IsNullOrWhiteSpace($edge.CalleePackage) -or
               -not $edge.Callee.StartsWith($edge.CalleePackage+'.(') -or
               $edge.Callee -notmatch '\)\.[A-Za-z_][A-Za-z0-9_]*$'){
              throw 'G45_METHOD_DECLARING_RECEIVER_UNQUALIFIED'
            }
            $qualifiedMethods++
          }
          if($receiverMethods.Count -ne $d.ReceiverQualifiedMethodEdges -or
             $qualifiedMethods -lt 1){
            throw 'G45_METHOD_CONSERVATION_OR_NO_REAL_METHODS'
          }
          foreach($edge in $d.TypeCheckedEdges){
            if([string]::IsNullOrWhiteSpace($edge.CalleePackage)){
              throw 'G45_MISSING_COMPILER_CALLEE_PACKAGE'
            }
          }
          $previewInit=@($d.TypeCheckedEdges|Where-Object {
            $_.Caller -like 'ktrade/internal/paperapp::package_init@*' -and
            $_.Callee -ceq 'regexp.MustCompile'
          })
          $authorityInit=@($d.TypeCheckedEdges|Where-Object {
            $_.Caller -like 'ktrade/internal/paperauthority::package_init@*' -and
            $_.Callee -ceq 'regexp.MustCompile'
          })
          $falseAlias=@($d.TypeCheckedEdges|Where-Object {
            $_.Caller -like '*::package_init@*' -and
            $_.Callee -like '*ErrRecoveryRequiresReview*'
          })
          $closureEdges=@($d.TypeCheckedEdges|Where-Object {
            $_.Caller -like 'ktrade/internal/paperapp::closure@*' -and
            $_.CalleePackage -ceq 'ktrade/internal/paperauthority'
          })
          if($previewInit.Count -ne 1 -or $authorityInit.Count -ne 1 -or
             $falseAlias.Count -ne 0 -or $d.SourceFileCount -ne 11 -or
             $closureEdges.Count -lt 6){
            throw 'G45_FROZEN_G41_SOURCE_WITNESS_DRIFT'
          }
          Write-Host ('G45_RECEIVER_QUALIFIED_METHOD_EDGES='+$qualifiedMethods)
          Write-Host ('G45_PAPERAPP_REGEXP_INITIALIZER='+$previewInit.Count)
          Write-Host ('G45_PAPERAUTHORITY_REGEXP_INITIALIZER='+$authorityInit.Count)
          Write-Host ('G45_NONCALL_ALIAS_FALSE_POSITIVES='+$falseAlias.Count)
          Write-Host ('G45_G41_CLOSURE_EDGE_WITNESSES='+$closureEdges.Count)
          Write-Host 'G45_G41_FROZEN_CONTROL=1015_CALLS_12_INITIALIZERS_276_CLOSURE_220_CLOSURE_STATIC_18_CROSS_206_UNRESOLVED'
          foreach($edge in $d.TypeCheckedEdges){
            if($edge.Confidence -cne 'go_types_static_object'){throw 'G45_FABRICATED_CONFIDENCE'}
          }
          Write-Host ('G45_NEW_PACKAGE_CALL_SITES='+$d.CallSites)
          Write-Host ('G45_STATIC_CROSS_PACKAGE_EDGES='+$d.CrossPackageStaticEdges)
          Write-Host ('G45_UNRESOLVED='+$d.Unresolved)
          Write-Host ('G45_SOURCE_FILE_COUNT='+$d.SourceFileCount)
          Write-Host ('G45_PROCESS_CPU_MS='+$cpu)
          Write-Host ('G45_PROCESS_RSS_BYTES='+$rss)
          Write-Host ('G45_WALL_MS='+([long]$watch.Elapsed.TotalMilliseconds))
          Write-Host ('G45_TREE_PROCESS_COUNT='+$treeProcesses)
          Write-Host ('G45_TREE_TOTAL_CPU_MS='+$treeCpuMs)
          Write-Host ('G45_TREE_PEAK_COMMITTED_BYTES='+$treePeakBytes)
          Write-Host 'G45_WINDOWS_JOB_MEMORY_LIMIT_512M=ENFORCED'
          Write-Host 'G45_PINNED_SQLITE_BOUNDARY_QUALIFIED=PASS'

          # G45 is a separate source-bound read-only consumer of the exact
          # private G43 report. The page itself remains local and is deleted.
          $htmlPath=Join-Path $env:RUNNER_TEMP ('g45-private-'+$env:GITHUB_RUN_ID+'.html')
          if(Test-Path -LiteralPath $htmlPath){throw 'G45_PRIVATE_HTML_COLLISION'}
          $rawSHA=(Get-FileHash -LiteralPath $raw -Algorithm SHA256).Hash.ToLowerInvariant()
          $browser=Join-Path $env:RUNNER_TEMP 'g45-browser.exe'
          $browserInfo=[System.Diagnostics.ProcessStartInfo]::new($browser)
          $browserInfo.WorkingDirectory=(Get-Location).Path
          $browserInfo.UseShellExecute=$false
          $browserInfo.RedirectStandardOutput=$true
          $browserInfo.RedirectStandardError=$true
          foreach($arg in @('--repo=.',('--in='+$raw),('--out='+$htmlPath),
              ('--source='+$env:SOURCE),('--tree='+$env:TREE),
              ('--base='+$env:BASE),('--input-sha256='+$rawSHA))){
            [void]$browserInfo.ArgumentList.Add($arg)
          }
          $bjob=[G45ProcessTreeBudget]::Create([ulong]536870912)
          $bwatch=[System.Diagnostics.Stopwatch]::StartNew()
          $bp=[System.Diagnostics.Process]::Start($browserInfo)
          if($null -eq $bp){[G45ProcessTreeBudget]::Close($bjob);throw 'G45_BROWSER_START_FAILED'}
          [G45ProcessTreeBudget]::Attach($bjob,$bp.Handle)
          $bstdout=$bp.StandardOutput.ReadToEndAsync()
          $bstderr=$bp.StandardError.ReadToEndAsync()
          while(-not $bp.HasExited){
            if($bwatch.Elapsed.TotalSeconds -gt 120){$bp.Kill();throw 'G45_BROWSER_WALL_CAP'}
            Start-Sleep -Milliseconds 50
          }
          $bp.WaitForExit()
          $browserMetrics=[G45ProcessTreeBudget]::Read($bjob)
          [G45ProcessTreeBudget]::Close($bjob)
          $bwatch.Stop()
          if($bp.ExitCode -ne 0){throw ('G45_BROWSER_FAILED_'+$bp.ExitCode+': '+$bstderr.GetAwaiter().GetResult())}
          $bCpuMs=[long][Math]::Ceiling($browserMetrics[0])
          $bMemory=[long]$browserMetrics[1]
          if($bCpuMs -lt 0 -or ($treeCpuMs+$bCpuMs) -gt 120000 -or
             $bMemory -le 0 -or $bMemory -gt 536870912 -or
             ($watch.Elapsed.TotalMilliseconds+$bwatch.Elapsed.TotalMilliseconds) -gt 120000){
             throw 'G45_COMBINED_PROCESS_TREE_CPU_MEMORY_WALL_CAP'
          }
          if(!(Test-Path -LiteralPath $htmlPath)){throw 'G45_PRIVATE_HTML_MISSING'}
          $htmlBytes=[long](Get-Item -LiteralPath $htmlPath).Length
          if($htmlBytes -le 1024 -or $htmlBytes -gt 25165824){throw 'G45_PRIVATE_HTML_SIZE_BOUNDARY'}
          $privateHtml=(Get-Content -LiteralPath $htmlPath -Raw)
          if(-not $privateHtml.Contains('Content-Security-Policy') -or
             (-not $privateHtml.Contains('connect-src &#39;none&#39;') -and
              -not $privateHtml.Contains("connect-src 'none'")) -or
             -not $privateHtml.Contains('compiler-qualified') -or
             -not $privateHtml.Contains('::package_init@')){
             throw 'G45_PRIVATE_NAVIGATOR_SEMANTIC_BOUNDARY'
          }
          $htmlSHA=(Get-FileHash -LiteralPath $htmlPath -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host ('G45_NAVIGATOR_HTML_SHA256='+$htmlSHA)
          Write-Host ('G45_NAVIGATOR_HTML_BYTES='+$htmlBytes)
          Write-Host ('G45_NAVIGATOR_QUALIFIED_EDGES='+@($d.TypeCheckedEdges).Count)
          Write-Host ('G45_NAVIGATOR_CPU_MS='+$bCpuMs)
          Write-Host 'G45_PRIVATE_HTML_AND_RAW_REPORT_UPLOAD=FALSE'
          $receipt=[ordered]@{
            schema='graphify.g45.offline-navigation-qualified.v1'
            source_sha=$env:SOURCE; source_tree=$env:TREE; source_parent=$env:BASE
            g43_source_schema='graphify.g43.receiver-qualified-static-methods.v1'
            private_input_sha256=$rawSHA; private_html_sha256=$htmlSHA
            private_html_bytes=$htmlBytes; qualified_navigator_edges=@($d.TypeCheckedEdges).Count
            browser_tree_cpu_ms=$bCpuMs; private_html_uploaded=$false
            runner_workflow_sha=$env:GITHUB_SHA; run_id=$env:GITHUB_RUN_ID
            sqlite_module='github.com/mattn/go-sqlite3'; sqlite_version='v1.14.18'
            sqlite_sum='h1:JL0eqdCOq6DJVNPSvArO/bIV9/P7fbGrV00LZHc+5aI='
            selected_packages=$d.SelectedPackages
            source_files=$d.SourceFileCount; source_bytes=$d.SelectedSourceBytes
            call_sites=$d.CallSites; static_cross_package=$d.CrossPackageStaticEdges
            nested_closure_sites=$d.NestedClosureCallSites
            closure_static_edges=$d.ClosureStaticEdges
            initializer_sites=$d.PackageInitializerCallSites
            initializer_static_edges=$d.PackageInitializerStaticEdges
            paperapp_initializer_witnesses=$previewInit.Count
            paperauthority_initializer_witnesses=$authorityInit.Count
            noncall_alias_false_positives=$falseAlias.Count
            g41_paperapp_to_authority_closure_edges=$closureEdges.Count
            receiver_qualified_method_edges=$qualifiedMethods
            frozen_g41_calls=1015; frozen_g41_initializer_sites=12
            frozen_g41_closure_sites=276; frozen_g41_closure_edges=220
            frozen_g41_unknown=206; frozen_g41_cross_package=18
            unresolved=$d.Unresolved; cpu_ms=$cpu; rss_bytes=$rss
            wall_ms=[long]$watch.Elapsed.TotalMilliseconds
            process_tree_count=$treeProcesses
            process_tree_total_cpu_ms=$treeCpuMs
            process_tree_peak_committed_bytes=$treePeakBytes
            process_tree_memory_cap_enforced=$true
            private_report_sha256=(Get-FileHash -LiteralPath $raw -Algorithm SHA256).Hash.ToLowerInvariant()
            user_data_touched=$false; full_app_regression_repeated=$false
            trading_or_release_authorized=$false; private_edges_uploaded=$false
          }
          $dir=Join-Path $env:GITHUB_WORKSPACE 'evidence'
          New-Item -ItemType Directory -Path $dir -Force|Out-Null
          $receipt|ConvertTo-Json -Depth 7|Set-Content -LiteralPath (Join-Path $dir 'g45-sanitized.json') -Encoding utf8
          Write-Host ('G45_SANITIZED_SHA256='+(Get-FileHash -LiteralPath (Join-Path $dir 'g45-sanitized.json') -Algorithm SHA256).Hash.ToLowerInvariant())
      - name: Check immutable source and upload sanitized receipt only
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference='Stop'
          if((git rev-parse HEAD).Trim() -cne $env:SOURCE -or
             (git rev-parse 'HEAD^{tree}').Trim() -cne $env:TREE -or
             @(git status --porcelain).Count -ne 0){throw 'G45_POST_QUAL_SOURCE_MUTATION'}
          Write-Host 'G45_SOURCE_IMMUTABLE=PASS'
      - name: Upload sanitized qualification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g45-sqlite-qualified-sanitized
          path: evidence/g45-sanitized.json
          retention-days: 90
          if-no-files-found: error
      - name: Remove private source and generated reports
        if: always()
        shell: pwsh
        run: |
          Remove-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'source') -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem -LiteralPath $env:RUNNER_TEMP -File -Filter 'g45-*' -ErrorAction SilentlyContinue|Remove-Item -Force
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'g45.exe') -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'g45-browser.exe') -Force -ErrorAction SilentlyContinue
          if(Test-Path -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'source')){throw 'G45_CLEANUP_FAILED'}
          Write-Host 'G45_PRIVATE_CLEANUP=PASS'
