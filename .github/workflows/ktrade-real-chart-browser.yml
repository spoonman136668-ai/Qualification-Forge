name: KTRADE genuine Windows chart editor browser qualification
on:
  push:
    branches: [qualification/ktrade-native-browser-pipe-20261018]
    paths: [.github/workflows/ktrade-real-chart-browser.yml]
permissions:
  contents: read
jobs:
  browser:
    if: github.repository == 'spoonman136668-ai/Qualification-Forge' && github.actor == 'spoonman136668-ai'
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      EXPECTED_KTRADE_SHA: '8967d0b4ebb845199dcd584bde194a125ae5ecbc'
      EXPECTED_TREE: '8156335d81b00063c3d006bb009a19a9f34e10fb'
      KTRADE_RECOVERY_ISOLATED: '1'
      KTRADE_USE_LEGACY_CDP_CONFIG: '0'
      KTRADE_CI_LIVE_AUTHORITY: '0'
      KTRADE_CI_COINBASE_ALLOWED: '0'
      KTRADE_CI_PROMOTION_ALLOWED: '0'
      GOFLAGS: '-p=2'
      GOMAXPROCS: '2'
    steps:
      - name: Checkout exact KTRADE source without persistent credential
        uses: actions/checkout@v4
        with:
          repository: spoonman136668-ai/ktrade
          ref: 8967d0b4ebb845199dcd584bde194a125ae5ecbc
          path: ktrade-private
          persist-credentials: false
          token: ${{ secrets.KTRADE_SOURCE_READ_TOKEN }}
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Setup Node with native WebSocket
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Prove historical source identity and browser test syntax
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:GITHUB_WORKSPACE 'ktrade-private'
          if($env:RUNNER_OS -cne 'Windows' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted'){throw 'KTRADE_REAL_BROWSER_WRONG_RUNNER'}
          if($env:KTRADE_CI_LIVE_AUTHORITY -cne '0' -or $env:KTRADE_CI_COINBASE_ALLOWED -cne '0' -or $env:KTRADE_CI_PROMOTION_ALLOWED -cne '0'){throw 'KTRADE_LIVE_AUTHORITY_NOT_DISABLED'}
          if((& git -C $root rev-parse HEAD).Trim() -cne $env:EXPECTED_KTRADE_SHA -or
             (& git -C $root rev-parse 'HEAD^{tree}').Trim() -cne $env:EXPECTED_TREE){throw 'KTRADE_SOURCE_DRIFT'}
          Push-Location $root
          try{
            & node --check tests/ktrade_real_browser_chart_cdp.cjs
            if($LASTEXITCODE -ne 0){throw 'KTRADE_BROWSER_CDP_TEST_SYNTAX_ERROR'}
          }finally{Pop-Location}
          Write-Output 'KTRADE_REAL_BROWSER_TEST_SOURCE_PIN=PASS'
          if((& git -C $root rev-parse HEAD:tests/ktrade_real_browser_chart_cdp.cjs).Trim() -cne '322bf5fc0a3ecbe924f057f0f55e11eb75166a82'){throw 'KTRADE_ORIGINAL_REAL_TRADE_BROWSER_TEST_DRIFT'}
          Write-Output 'KTRADE_REAL_BROWSER_CDP_JAVASCRIPT_SYNTAX=PASS'
      - name: Real isolated Chromium original Monaco Save favorite and reopen
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $checkout=Join-Path $env:GITHUB_WORKSPACE 'ktrade-private'
          $stage=Join-Path $env:RUNNER_TEMP ('ktrade-browser-'+$env:GITHUB_RUN_ID)
          $profile=Join-Path $stage 'browser-profile'
          $app=Join-Path $stage 'app'
          $lib=Join-Path $stage 'library'
          $stdout=Join-Path $env:RUNNER_TEMP 'ktrade-original-browser.stdout.log'
          $stderr=Join-Path $env:RUNNER_TEMP 'ktrade-original-browser.stderr.log'
          $log=Join-Path $env:RUNNER_TEMP 'ktrade-original-browser-results.private.log'
          $backend=$null;$browser=$null
          $prior=@{}
          foreach($name in @('KTRADE_PINE_LIBRARY_ROOT','APPDATA','LOCALAPPDATA','HOME','USERPROFILE')){
            $prior[$name]=[Environment]::GetEnvironmentVariable($name,'Process')
          }
          try{
            New-Item -ItemType Directory -Path $app,$profile,(Join-Path $stage 'appdata'),(Join-Path $stage 'home') -Force|Out-Null
            Push-Location $checkout
            try{
              & go mod download *> $log
              if($LASTEXITCODE -ne 0){throw 'KTRADE_REAL_BROWSER_GO_MODULES_UNAVAILABLE'}
              & go build -mod=readonly -tags=ktrade_full -o (Join-Path $app 'ktrade.exe') ./cmd/ktrade *> $log
              if($LASTEXITCODE -ne 0){throw 'KTRADE_REAL_BROWSER_ORIGINAL_BACKEND_BUILD_FAILED'}
            }finally{Pop-Location}
            foreach($folder in @('static','templates','strategies')){
              Copy-Item -LiteralPath (Join-Path $checkout $folder) -Destination (Join-Path $app $folder) -Recurse -Force
            }
            $env:KTRADE_PINE_LIBRARY_ROOT=$lib
            $env:APPDATA=Join-Path $stage 'appdata'
            $env:LOCALAPPDATA=Join-Path $stage 'appdata'
            $env:HOME=Join-Path $stage 'home'
            $env:USERPROFILE=$env:HOME
            $backend=Start-Process -FilePath (Join-Path $app 'ktrade.exe') -WorkingDirectory $app -PassThru -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            $address=''
            for($i=0;$i -lt 100;$i++){
              if($backend.HasExited){throw 'KTRADE_REAL_BROWSER_BACKEND_EXITED'}
              $txt=[string](Get-Content -LiteralPath $stderr -Raw -ErrorAction SilentlyContinue)
              if($txt -match 'KTRADE_ISOLATED_LISTEN=(127\.0\.0\.1:\d+)'){$address=$Matches[1];break}
              Start-Sleep -Milliseconds 400
            }
            if(!$address){throw 'KTRADE_REAL_BROWSER_BACKEND_NOT_READY'}
            $base='http://'+$address
            $page=Invoke-WebRequest -Uri ($base+'/chart') -TimeoutSec 10
            if($page.StatusCode -ne 200 -or -not ($page.Content -match '/static/pine_library_compat.js')){throw 'KTRADE_REAL_BROWSER_CHART_PAGE_WRONG'}
            Write-Output 'KTRADE_REAL_BROWSER_ORIGINAL_CHART_HTTP=PASS'
            $candidates=@(
              'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe',
              'C:\Program Files\Microsoft\Edge\Application\msedge.exe',
              'C:\Program Files\Google\Chrome\Application\chrome.exe',
              'C:\Program Files (x86)\Google\Chrome\Application\chrome.exe'
            )
            $browserExe=$candidates|Where-Object {Test-Path -LiteralPath $_ -PathType Leaf}|Select-Object -First 1
            if(!$browserExe){throw 'KTRADE_REAL_BROWSER_BINARY_NOT_INSTALLED_ON_HOST'}
            Write-Output ('KTRADE_REAL_BROWSER_SELECTED_BINARY='+[IO.Path]::GetFileName($browserExe))
            # CDP over native inherited Windows pipes. No DevToolsActivePort,
            # firewall/debug TCP port, wildcard remote origins, or HTML shim.
            Push-Location $checkout
            try{
              & node tests/ktrade_real_browser_chart_cdp.cjs $base pipe $browserExe $profile *> $log
              if($LASTEXITCODE -ne 0){
                $diagnostic=@(Get-Content -LiteralPath $log -ErrorAction SilentlyContinue |
                  Where-Object {$_ -match '^KTRADE_REAL_BROWSER_(NATIVE_CDP_PIPE_ATTACHED=PASS|CHECK_FAILED)' -or
                                $_ -match '^KTRADE_REAL_BROWSER_(MONACO|SAVE|EDITOR|ORIGINAL)' } |Select-Object -First 6)
                # Only publish tagged test state, never private browser stdout.
                foreach($line in $diagnostic){
                  if($line -match '^KTRADE_REAL_BROWSER_NATIVE_CDP_PIPE_ATTACHED=PASS$'){
                    Write-Output $line
                  }
                }
                throw 'KTRADE_REAL_BROWSER_NATIVE_PIPE_OR_ORIGINAL_UI_ACCEPTANCE_FAILED'
              }
            }finally{Pop-Location}
            Write-Output 'KTRADE_REAL_CHROMIUM_NATIVE_CDP_PIPE_ORIGINAL_CHART=PASS'
            Write-Output 'KTRADE_REAL_CHROMIUM_EDITOR_SAVE_FAVORITE_RELOAD_REOPEN=PASS'
            Write-Output 'KTRADE_REAL_CHROMIUM_EXISTING_BROWSER_KEYS_PRESERVED=PASS'
            Write-Output 'KTRADE_BROWSER_DID_NOT_DISPATCH_BROKER_ORDER_UNTIL_EXPLICIT_TEST_CLICK=PASS'
            Write-Output 'KTRADE_ACTUAL_TRADE_PANEL_BROWSER_CLICK_INCOMPLETE_DTO_REJECTED=PASS'
            Write-Output 'KTRADE_ACTUAL_FULL_APP_ORDER_TRANSPORT_REMAINS_BROKER_DISABLED=TRUE'
            Write-Output 'KTRADE_BROWSER_FRESH_EPHEMERAL_PROFILE=TRUE'
          }finally{
            if($null -ne $browser){try{& taskkill.exe /PID $browser.Id /T /F *> $null}catch{}}
            if($null -ne $backend){try{Stop-Process -Id $backend.Id -Force -ErrorAction SilentlyContinue}catch{};$backend.Dispose()}
            foreach($key in $prior.Keys){[Environment]::SetEnvironmentVariable($key,$prior[$key],'Process')}
            Remove-Item -LiteralPath $stage -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $stdout,$stderr,$log -Force -ErrorAction SilentlyContinue
          }
      - name: Remove private source without artifacts
        if: always()
        shell: pwsh
        run: |
          Remove-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'ktrade-private') -Recurse -Force -ErrorAction SilentlyContinue
          Write-Output 'KTRADE_REAL_USER_BROWSER_PROFILE_UNTOUCHED=TRUE'
          Write-Output 'KTRADE_PRODUCTION_PROMOTION=FALSE'
