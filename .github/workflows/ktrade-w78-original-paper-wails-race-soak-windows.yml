name: KTRADE PR244 current exact-source Wails update rollback and process lease repeated
on:
  push:
    branches: [qualification/ktrade-original-pine-label-response-affinity-20261031]
    paths: [.github/workflows/ktrade-w78-original-paper-wails-race-soak-windows.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: ktrade-pr244-wails-original-rollback-lease-20261105
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: windows-2022
    timeout-minutes: 55
    env:
      GOWORK: 'off'
      GOFLAGS: '-p=2'
      GOMAXPROCS: '2'
      CGO_ENABLED: '1'
      KTRADE_LIVE_TRADING: 'false'
    steps:
      - name: Exact independent W78 witness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: witness
          persist-credentials: false
      - name: Exact current KTRADE PR244 source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: spoonman136668-ai/ktrade
          ref: 671198f2336e410c98ef764603455a51c08d16b0
          fetch-depth: 1
          path: product
          persist-credentials: false
          token: ${{ secrets.KTRADE_SOURCE_READ_TOKEN }}
      - name: Exact current-source, risk, security, native and crash receipts; synthetic-only protection
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          function Need([bool]$ok,[string]$label){if(!$ok){throw $label}}
          Need ($env:GITHUB_REPOSITORY -ceq 'spoonman136668-ai/Qualification-Forge' -and $env:RUNNER_ENVIRONMENT -ceq 'github-hosted' -and $env:RUNNER_OS -ceq 'Windows') 'PR244_WAILS_ISOLATED_HOSTED_WINDOWS_REQUIRED'
          $w=Join-Path $env:GITHUB_WORKSPACE 'witness'
          $p=Join-Path $env:GITHUB_WORKSPACE 'product'
          Need ((& git -C $w rev-parse HEAD).Trim() -ceq $env:GITHUB_SHA -and
                (& git -C $p rev-parse HEAD).Trim() -ceq '671198f2336e410c98ef764603455a51c08d16b0' -and
                (& git -C $p rev-parse 'HEAD^{tree}').Trim() -ceq 'f75c8d45689e68cf2e582fe4679b841e9c9f352e' -and
                @(& git -C $w status --porcelain).Count -eq 0 -and
                @(& git -C $p status --porcelain).Count -eq 0) 'PR244_WAILS_SOURCE_OR_WITNESS_DRIFT'
          Need (!(Test-Path (Join-Path $p '.env')) -and
            (Get-Content (Join-Path $p 'pkg/advanced_orders.go') -Raw) -match 'func liveBrokerageAuthorized\(\) bool \{ return false \}') 'PR244_WAILS_CREDENTIAL_OR_LIVE_DISARM_DRIFT'
          $config=Get-Content (Join-Path $p 'config.json') -Raw|ConvertFrom-Json
          Need (!$config.api_key.key_name -and !$config.api_key.key_secret -and !$config.account_id -and !$config.ngrok_authtoken) 'PR244_WAILS_TRACKED_CREDENTIALS_REFUSED'
          # These seven regression functions are unchanged from W78; the
          # overall Wails backend gained new orphan-custody code, so retest.
          foreach($a in @(
            @{path='tools/wails-pilot/backend/installed_update_test.go';blob='ea8f47a188f832e8dc14d41cab2ec5396801644e'},
            @{path='tools/wails-pilot/backend/release_process_lease_test.go';blob='2fbeeec2e8eeca94831771294d995098a118040c'}
          )){
            Need ((& git -C $p rev-parse ('HEAD:'+$a.path)).Trim() -ceq $a.blob) ('PR244_WAILS_FROZEN_ORIGINAL_TEST_SOURCE_DRIFT_'+$a.path)
          }
          foreach($a in @(
            @{path='qualification-receipts/ktrade-pr244-pine-marker-status-source-windows-20261105.json';blob='7eb9024615af7a076611caff6306a4749f46bcb0';verdict='PASS_SOURCE_OWNED_EXACT_HEAD_WINDOWS_FULL_REGRESSION';source='source'},
            @{path='qualification-receipts/ktrade-pr244-current-head-risk-matrix-windows-20261105.json';blob='94e07ed49197869f77ab9b8ee7933f654c85011f';verdict='PASS_EXACT_HEAD_ORIGINAL_PAPER_AND_MOCK_BROKER_RACE_MATRIX';source='source'},
            @{path='qualification-receipts/ktrade-pr244-current-head-go-reachability-security-20261105.json';blob='99f4b3b3b31be09a4817f58feb8c3e1f669fc7e2';verdict='PASS_EXACT_CURRENT_SHA_GO_ENGINE_AND_WAILS_ZERO_KNOWN_REACHABLE_SYMBOLS';source='source'},
            @{path='qualification-receipts/ktrade-pr244-pine-cold-reopen-repeatability-windows-20261105.json';blob='6d9d69001c40b2999fb4095652ae55393d2ff70a';verdict='PASS_TWO_NATIVE_CANDIDATE_SESSIONS_WITH_STRICT_PINE_V5_V6_PHYSICAL_MARKERS';source='source'},
            @{path='qualification-receipts/ktrade-pr244-pine-cross-windows-2025-native-windows-20261105.json';blob='e06c0d6613de323480b9b2abc7dbdde709d8b9b2';verdict='PASS_EXACT_HEAD_WINDOWS_SERVER_2025_TWO_NATIVE_SESSIONS';source='product'},
            @{path='qualification-receipts/ktrade-pr244-current-head-funded-paper-crash-quarantine-windows-20261105.json';blob='8a3470d33a7413fa5e4270ad94b1d18183fb560e';verdict='PASS_EXACT_SHA_FUNDED_PAPER_FORCE_KILL_ORPHAN_QUARANTINE_NO_REARM';source='product'}
          )){
            Need ((& git -C $w rev-parse ('HEAD:'+$a.path)).Trim() -ceq $a.blob) ('PR244_WAILS_RECEIPT_BLOB_DRIFT_'+$a.path)
            $receipt=Get-Content -LiteralPath (Join-Path $w $a.path) -Raw|ConvertFrom-Json
            $sourceSha=if($a.source -ceq 'source'){$receipt.source.head_sha}else{$receipt.product.head_sha}
            Need ($receipt.verdict -ceq $a.verdict -and $sourceSha -ceq '671198f2336e410c98ef764603455a51c08d16b0') ('PR244_WAILS_RECEIPT_SOURCE_OR_VERDICT_DRIFT_'+$a.path)
          }
          Write-Host '::notice::PR244_WAILS_CURRENT_SHA_NATIVE_RISK_SECURITY_CRASH_RECEIPTS_REUSED=PASS'
      - name: Exact source Go 1.26.10 Windows runtime
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: false
      - name: Repeated original Wails rollback, selection and process lease refusals on exact PR244 source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:TEMP=$env:RUNNER_TEMP;$env:TMP=$env:RUNNER_TEMP
          if((& go env GOVERSION).Trim() -cne 'go1.26.10'){throw 'PR244_WAILS_REPEATED_TEST_TOOLCHAIN_DRIFT'}
          Push-Location (Join-Path $env:GITHUB_WORKSPACE 'product/tools/wails-pilot')
          try {
            $names=@(
              'TestW30InstalledUpdateAndRollbackRetainVersionsDataAndOriginalReceipts',
              'TestW30InstalledUpdateRefusalsPreserveCurrentSelection',
              'TestW30InterruptedCommitKeepsLaunchQuarantineAndOwnerBytes',
              'TestW30RollbackRejectsAlteredPriorDataAndBackup',
              'TestW30RollbackRejectsCoordinatedReceiptRewrite',
              'TestW28CRunningProcessBlocksReleaseSelectionAndRollback',
              'TestW28CRejectsUnselectedAndOrphanedLease'
            )
            $pattern='^('+($names -join '|')+')$'
            $raw=@(& go test -json -mod=readonly -count=3 -timeout 18m -run $pattern ./backend)
            if($LASTEXITCODE -ne 0){
              $raw|Select-Object -Last 100|ForEach-Object {Write-Host $_}
              throw 'W78_ORIGINAL_WAILS_ROLLBACK_REPEAT_FAILED'
            }
            $events=@($raw|ForEach-Object {$_|ConvertFrom-Json -ErrorAction Stop})
            if(@($events|Where-Object {$_.Action -in @('fail','skip')}).Count -gt 0){throw 'W78_WAILS_FAILURE_OR_SKIP'}
            foreach($name in $names){
              $ok=@($events|Where-Object {$_.Action -ceq 'pass' -and $_.Package -ceq 'ktrade-wails-pilot/backend' -and $_.Test -ceq $name})
              if($ok.Count -ne 3){throw ('W78_WAILS_NAMED_TEST_NOT_REPEATED_'+$name)}
            }
            Write-Host ('::notice::W78_ORIGINAL_WAILS_ROLLBACK_LEASE_REPEAT=PASS cases='+$names.Count+' repetitions=3')
          }finally{Pop-Location}
      - name: Fail-closed exact candidate source and user/broker isolation final
        if: always()
        shell: pwsh
        run: |
          $src=Join-Path $env:GITHUB_WORKSPACE 'product'
          if((& git -C $src rev-parse HEAD).Trim() -cne '671198f2336e410c98ef764603455a51c08d16b0' -or (& git -C $src rev-parse 'HEAD^{tree}').Trim() -cne 'f75c8d45689e68cf2e582fe4679b841e9c9f352e'){throw 'PR244_WAILS_EXACT_SOURCE_CHANGED'}
          if(@(& git -C $src status --porcelain --untracked-files=no).Count -ne 0){throw 'W78_TRACKED_PRODUCT_CHANGED'}
          Write-Host '::notice::PR244_WAILS_ISOLATED_WINDOWS_NO_OWNER_INSTALL_NO_BROKER_NO_LIVE_NO_RELEASE_NO_MERGE'
