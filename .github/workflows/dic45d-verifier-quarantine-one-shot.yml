name: DIC-45D exact private-source focused Windows qualification
on:
  push:
    branches: [qualification/dic45d-private-scope-windows-r1]
    paths: [.github/workflows/dic45d-verifier-quarantine-one-shot.yml]

permissions:
  contents: write
concurrency:
  group: dic45d-private-scope-exact-once
  cancel-in-progress: false

jobs:
  dic45d-verifier:
    if: github.repository == 'spoonman136668-ai/Qualification-Forge' && github.actor == 'spoonman136668-ai' && github.run_attempt == 1
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      QUARANTINE_SHA: '558e425f1a20edad78a26800abd2883bd88ad0b1'
      KTRADE_SUBJECT_SHA: '3cabbdb30fd772e7c730e0089f82ed71168f46b9'
      PLANE_VERIFIER_SOURCE_SHA: '8f4046174191898850b59b136e230303fd73a3ac'
      KTRADE_CI_SOURCE_ONLY: '1'
      KTRADE_CI_PAPER_ONLY: '1'
      KTRADE_CI_LIVE_AUTHORITY: '0'
      KTRADE_CI_COINBASE_ALLOWED: '0'
      KTRADE_CI_PROMOTION_ALLOWED: '0'
      GOWORK: 'off'
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
    steps:
      - name: Verify ephemeral Windows, no live authority
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if($env:RUNNER_OS -cne 'Windows' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted'){throw 'DIC45D_NOT_EPHEMERAL_WINDOWS'}
          if($env:KTRADE_CI_LIVE_AUTHORITY -cne '0' -or $env:KTRADE_CI_COINBASE_ALLOWED -cne '0' -or $env:KTRADE_CI_PROMOTION_ALLOWED -cne '0'){throw 'DIC45D_LIVE_AUTHORITY_DENIED'}
          Write-Host 'DIC45D_INDEPENDENT_HOSTED_WINDOWS=PASS'
      - name: Checkout private quarantined qualifier by exact commit
        uses: actions/checkout@v4
        with:
          repository: spoonman136668-ai/ckb
          ref: 558e425f1a20edad78a26800abd2883bd88ad0b1
          path: checked-private
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.KTRADE_CKB_READ_TOKEN_TEMP }}
      - name: Set up isolated Go toolchain without cache upload
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Verify quarantined source and original exact verifier blobs
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          $repo=Join-Path $env:GITHUB_WORKSPACE 'checked-private'
          $head=(& git -C $repo rev-parse HEAD).Trim()
          if($LASTEXITCODE -ne 0 -or $head -cne $env:QUARANTINE_SHA){throw 'DIC45D_QUARANTINE_COMMIT_DRIFT'}
          $origin=(& git -C $repo rev-parse "$($env:QUARANTINE_SHA)^").Trim()
          if($LASTEXITCODE -ne 0 -or $origin -cne $env:KTRADE_SUBJECT_SHA){throw 'DIC45D_KTRADE_CANDIDATE_DRIFT'}
          $expected=[ordered]@{
            'verifier.go'='1142389a124d4655178552cfb0e62b48d13a7607'
            'verifier_test.go'='4a8b8142b59eee23a743c7a4e4916bf6c0c108e6'
            'go.mod'='6c8f972637248472c242d23e822b4c24afdde397'
            'testdata/38827824609.json'='fd449b16f753492758da705d9f037e5879288662'
          }
          # Windows checkout may hydrate LF Git blobs as CRLF. Rehydrate only
          # the four qualification-only files directly from the pinned index.
          # No source commit, production file, or controller is changed.
          & git -C $repo config --local core.autocrlf false
          if($LASTEXITCODE -ne 0){throw 'DIC45D_GIT_EOLOPTION_FAILED'}
          foreach($name in $expected.Keys){
            $path='qualification/dic45d-verifier-r1/'+$name
            & git -C $repo -c core.autocrlf=false checkout-index --force -- $path
            if($LASTEXITCODE -ne 0){throw 'DIC45D_EXACT_BLOB_REHYDRATION_FAILED'}
          }
          Write-Host 'DIC45D_EXACT_GIT_BLOB_REHYDRATION=PASS'
          foreach($name in $expected.Keys){
            $path='qualification/dic45d-verifier-r1/'+$name
            $blob=(& git -C $repo rev-parse "$($env:QUARANTINE_SHA):$path").Trim()
            if($LASTEXITCODE -ne 0 -or $blob -cne [string]$expected[$name]){throw 'DIC45D_ORIGINAL_PRIVATE_BLOB_DRIFT'}
            $disk=Join-Path $repo ($path -replace '/', [IO.Path]::DirectorySeparatorChar)
            $worktree=(& git -C $repo hash-object --no-filters -- $disk).Trim()
            if($LASTEXITCODE -ne 0 -or $worktree -cne [string]$expected[$name]){throw 'DIC45D_WORKTREE_BLOB_DRIFT'}
          }
          Write-Host 'DIC45D_BLOB_IDENTICAL_TO_CKB_PLANE_PR576=PASS'
          Write-Host 'DIC45D_KTRADE_SOURCE_QUARANTINED_UNCHANGED=PASS'
      - name: Run real Git subject validation and standalone full focused suite
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $repo=Join-Path $env:GITHUB_WORKSPACE 'checked-private'
          $module=Join-Path $repo 'qualification/dic45d-verifier-r1'
          $log=Join-Path $env:RUNNER_TEMP 'dic45d-private.log'
          $injected=Join-Path $module 'hosted_real_git_test.go'
          $env:DIC45_KTRADE_GIT_ROOT=$repo
          try{
            @'
          package dic45
          import ("context";"os";"testing")
          func TestHostWindowsRealPinnedGitCandidate(t *testing.T){
            raw,e:=os.ReadFile("testdata/38827824609.json");if e!=nil{t.Fatal(e)}
            result,e:=Verify(context.Background(),LocalGit("git",os.Getenv("DIC45_KTRADE_GIT_ROOT")),raw)
            if e!=nil{t.Fatal(e)}
            if result.Disposition!=PendingAuthority||result.ControllerAdmission||result.RefMutation||len(result.CheckedPaths)!=3{t.Fatalf("invalid verification report: %+v",result)}
          }
          '@ | Set-Content -LiteralPath $injected -Encoding utf8
            Push-Location $module
            try{
              & go test -count=1 -timeout=180s ./... *> $log
              if($LASTEXITCODE -ne 0){throw 'DIC45D_WINDOWS_REAL_GIT_OR_FOCUSED_TEST_FAILED_PRIVATE_LOG_WITHHELD'}
              Write-Host 'DIC45D_WINDOWS_REAL_GIT_AND_SEVEN_FOCUSED_TESTS=PASS'
              & go vet ./... *> $log
              if($LASTEXITCODE -ne 0){throw 'DIC45D_WINDOWS_FOCUSED_VET_FAILED_PRIVATE_LOG_WITHHELD'}
              Write-Host 'DIC45D_WINDOWS_VET=PASS'
              & go build ./... *> $log
              if($LASTEXITCODE -ne 0){throw 'DIC45D_WINDOWS_FOCUSED_BUILD_FAILED_PRIVATE_LOG_WITHHELD'}
              Write-Host 'DIC45D_WINDOWS_BUILD=PASS'
            }finally{Pop-Location}
          }finally{
            Remove-Item -LiteralPath $injected,$log -Force -ErrorAction SilentlyContinue
            Remove-Item Env:DIC45_KTRADE_GIT_ROOT -ErrorAction SilentlyContinue
          }
      - name: Verify all original private source blobs untouched
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $repo=Join-Path $env:GITHUB_WORKSPACE 'checked-private'
          if(@(& git -C $repo status --porcelain=v1 --untracked-files=no).Count -ne 0){throw 'DIC45D_TRACKED_SOURCE_CHANGED'}
          Write-Host 'DIC45D_TRACKED_SOURCE_UNCHANGED=PASS'
          Write-Host 'DIC45D_CONTROLLER_ACCEPTANCE=FALSE'
          Write-Host 'DIC45D_ACCEPTED_REF_MUTATION=FALSE'
          Write-Host 'DIC45D_PRODUCTION_PROMOTION=FALSE'
          Write-Host 'DIC45D_REAL_BROKER_AUTHORITY=FALSE'
      - name: Destroy private checkout with no artifact upload
        if: always()
        shell: pwsh
        run: |
          Remove-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'checked-private') -Force -Recurse -ErrorAction SilentlyContinue
          Write-Host 'DIC45D_PRIVATE_SOURCE_ARTIFACT_UPLOAD=DISABLED'
      - name: Publish sanitized bounded qualification evidence
        if: success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $doc=[ordered]@{
            schema='ktrade.dic45d.readonly-verifier-focused-windows.v1'
            qualification_run_id=$env:GITHUB_RUN_ID
            workflow_source_sha=$env:GITHUB_SHA
            verifier_source_commit=$env:PLANE_VERIFIER_SOURCE_SHA
            private_quarantine_sha=$env:QUARANTINE_SHA
            ktrade_original_sha=$env:KTRADE_SUBJECT_SHA
            verifier_go_blob='1142389a124d4655178552cfb0e62b48d13a7607'
            verifier_test_blob='4a8b8142b59eee23a743c7a4e4916bf6c0c108e6'
            go_mod_blob='6c8f972637248472c242d23e822b4c24afdde397'
            receipt_blob='fd449b16f753492758da705d9f037e5879288662'
            hosted_windows_focused_real_git_test=$true
            windows_vet=$true
            windows_build=$true
            full_controller_regression_qualified=$false
            source_only=$true
            controller_admitted=$false
            accepted_ref_mutated=$false
            broker_authorized=$false
            production_promotion=$false
            private_artifacts=0
          }|ConvertTo-Json -Compress
          $body=@{message='evidence: DIC45D authentic private-blobs focused Windows qualification';content=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($doc+"`n"));branch='main'}|ConvertTo-Json
          $uri='https://api.github.com/repos/spoonman136668-ai/Qualification-Forge/contents/qualification-evidence/dic45d-focused-runs/'+$env:GITHUB_RUN_ID+'.json'
          Invoke-RestMethod -Uri $uri -Method Put -ContentType 'application/json' -Headers @{
            Authorization=('Bearer '+$env:GH_TOKEN)
            Accept='application/vnd.github+json'
            'X-GitHub-Api-Version'='2022-11-28'
          } -Body $body -TimeoutSec 30|Out-Null
          Write-Host 'DIC45D_SANITIZED_FOCUSED_RECEIPT=PASS'
