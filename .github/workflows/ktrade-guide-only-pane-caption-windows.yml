name: KTRADE guide-only pane caption original Go HTTP and native presentation
on:
  push:
    branches: [qualification/ktrade-guide-only-pane-caption-20261031]
    paths: [.github/workflows/ktrade-guide-only-pane-caption-windows.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: ktrade-guide-only-pane-caption-20261031
  cancel-in-progress: false
jobs:
  focused:
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      GOWORK: 'off'
      GOFLAGS: '-p=2'
      GOMAXPROCS: '2'
      CGO_ENABLED: '1'
      GOTOOLCHAIN: 'local'
      KTRADE_LIVE_TRADING: 'false'
      KTRADE_USE_LEGACY_CDP_CONFIG: '0'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: witness
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: spoonman136668-ai/ktrade
          ref: 56b9036f48e4783d846b7e00d650d7d4b96dd7fc
          path: product
          fetch-depth: 10
          persist-credentials: false
          token: ${{ secrets.KTRADE_SOURCE_READ_TOKEN }}
      - name: Exact caption source three paths and identical original Go package custody
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $p=Join-Path $env:GITHUB_WORKSPACE 'product'
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/Qualification-Forge' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows'){throw 'ISOLATED_EXISTING_WINDOWS_QUALIFICATION_REQUIRED'}
          if((& git -C $p rev-parse HEAD).Trim() -cne '56b9036f48e4783d846b7e00d650d7d4b96dd7fc' -or (& git -C $p rev-parse 'HEAD^{tree}').Trim() -cne '6f956e8eb095b577de8e4a79f3327a70097dc986' -or @(& git -C $p status --porcelain).Count -ne 0 -or (Test-Path (Join-Path $p '.env'))){throw 'EXACT_CLEAN_SOURCE_REQUIRED'}
          & git -C $p merge-base --is-ancestor 504b28f07a24882470b847ff014391104f78bd66 HEAD
          if($LASTEXITCODE -ne 0){throw 'QUALIFIED_PR236_SOURCE_PARENT_REQUIRED'}
          $delta=@(& git -C $p diff --name-only 504b28f07a24882470b847ff014391104f78bd66 HEAD|Sort-Object)
          $expected=@('cmd/ktrade/pine_guide_only_full_test.go','static/pine_plot_renderer.js','tests/rb3_pine_hline_transport.test.cjs')|Sort-Object
          if(($delta -join '|') -cne ($expected -join '|')){throw 'EXACT_THREE_PATH_CAPTION_DELTA_REQUIRED'}
          if((& git -C $p rev-parse 'HEAD:pkg').Trim() -cne (& git -C $p rev-parse '504b28f07a24882470b847ff014391104f78bd66:pkg').Trim()){throw 'IDENTICAL_QUALIFIED_ORIGINAL_GO_PACKAGE_REQUIRED'}
          foreach($pin in @(@('pkg/pine_compiler.go','846f9f7f73d801fcb9d71b3da626143dade8e721'),@('pkg/pine_plotting_advanced.go','f5b52befb522a260289af0177dfd0c9eda1d4d6b'),@('internal/originaltradeguard','1f894b0a6f8115b8a9d3882fa16fdb289eba510a'),@('internal/paperreconcile','9507b1f181b9a82ebbc4fa63f4bc05b27613e25e'))){if((& git -C $p rev-parse ('HEAD:'+$pin[0])).Trim() -cne $pin[1]){throw 'ORIGINAL_RUNTIME_GUARD_LEDGER_DRIFT'}}
          if((Get-Content (Join-Path $p 'pkg/advanced_orders.go') -Raw) -notmatch 'func liveBrokerageAuthorized\(\) bool \{ return false \}'){throw 'LIVE_AUTHORITY_DRIFT'}
          $run=Invoke-RestMethod -Uri 'https://api.github.com/repos/spoonman136668-ai/Qualification-Forge/actions/runs/41254118077' -Headers @{Authorization=('Bearer '+$env:GITHUB_TOKEN);Accept='application/vnd.github+json'} -TimeoutSec 30
          if($run.status -cne 'completed' -or $run.conclusion -cne 'success' -or $run.head_sha -cne 'ab6f73989777d51350e8c0906992bd117501b65f'){throw 'QUALIFIED_ACTUAL_PARENT_FULL_SOURCE_NATIVE_REQUIRED'}
          $w=Join-Path $env:GITHUB_WORKSPACE 'witness'
          if((& git -C $w rev-parse 'HEAD:qualification-receipts/ktrade-pr236-full-source-owned-native-windows-20261031.json').Trim() -cne '82d0958fa6897286529fff7c2a0f976c00523b07'){throw 'PARENT_FULL_RECEIPT_DRIFT'}
          Write-Host '::notice::PR237_EXACT_THREE_PATH_SOURCE_IDENTICAL_ORIGINAL_PKG_PARENT_REAL_FULL_NATIVE_QUALIFICATION=PASS'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Current original Go guide-only HTTP plus all prior settings marker and NA API cases
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:TEMP=$env:RUNNER_TEMP;$env:TMP=$env:RUNNER_TEMP
          $env:KTRADE_PINE_MARKER_FIXTURE_FILE=Join-Path $env:RUNNER_TEMP 'ktrade-pine-marker-http.json'
          $env:KTRADE_PINE_HLINE_FIXTURE_FILE=Join-Path $env:RUNNER_TEMP 'ktrade-pine-hline-http.json'
          $env:KTRADE_PINE_HLINE_NONFINITE_FIXTURE_FILE=Join-Path $env:RUNNER_TEMP 'ktrade-pine-hline-nonfinite-http.json'
          $env:KTRADE_PINE_GUIDE_ONLY_FIXTURE_FILE=Join-Path $env:RUNNER_TEMP 'ktrade-pine-guide-only-http.json'
          Push-Location (Join-Path $env:GITHUB_WORKSPACE 'product')
          try{
            $out=@(& go test -race -json -mod=readonly -tags=ktrade_full -count=1 -timeout 18m -run '^TestPineInputSettings|^TestPineOverlayTransportsOriginalConfirmedShapes$|^TestPineOverlayTransportsOriginalRSIHorizontalGuides$|^TestPineOverlayNonfiniteHorizontalGuidesPreserveOriginalNAPlots$|^TestPineGuideOnlyOverlayPreservesOriginalLevelsWithoutInventingPlots$' ./cmd/ktrade)
            $exit=$LASTEXITCODE
            foreach($line in $out){Write-Host $line}
            if($exit -ne 0){throw 'ACTUAL_ORIGINAL_GO_GUIDE_ONLY_OR_PRIOR_API_FAILED'}
            $events=@($out|ForEach-Object {try{$_|ConvertFrom-Json -ErrorAction Stop}catch{}})
            foreach($root in @('TestPineInputSettingsPersistCASAndSourceIsolation','TestPineInputSettingsRejectsBadRequestsAndPreservesCorruption','TestPineInputSettingsUnavailableRootIsReadOnly','TestPineOverlayTransportsOriginalConfirmedShapes','TestPineOverlayTransportsOriginalRSIHorizontalGuides','TestPineOverlayNonfiniteHorizontalGuidesPreserveOriginalNAPlots','TestPineGuideOnlyOverlayPreservesOriginalLevelsWithoutInventingPlots')){if(@($events|Where-Object {$_.Test -ceq $root -and $_.Action -ceq 'pass'}).Count -ne 1){throw 'REQUIRED_ACTUAL_API_ROOT_NOT_EXECUTED'}}
            if(@($events|Where-Object {$_.Action -in @('fail','skip')}).Count -ne 0){throw 'CURRENT_API_FAILURE_OR_SKIP'}
            & go vet -mod=readonly -tags=ktrade_full ./cmd/ktrade
            if($LASTEXITCODE -ne 0){throw 'CURRENT_TAGGED_APP_VET_FAILED'}
          }finally{Pop-Location}
          Write-Host '::notice::PR237_ACTUAL_ORIGINAL_GO_V5_V6_GUIDE_ONLY_AND_ALL_PRIOR_API_RACE_VET=PASS'
      - name: Actual HTTP fixtures through original chart caption with original empty-caption defect reproduced
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:KTRADE_PINE_MARKER_FIXTURE_FILE=Join-Path $env:RUNNER_TEMP 'ktrade-pine-marker-http.json'
          $env:KTRADE_PINE_HLINE_FIXTURE_FILE=Join-Path $env:RUNNER_TEMP 'ktrade-pine-hline-http.json'
          $env:KTRADE_PINE_HLINE_NONFINITE_FIXTURE_FILE=Join-Path $env:RUNNER_TEMP 'ktrade-pine-hline-nonfinite-http.json'
          $env:KTRADE_PINE_GUIDE_ONLY_FIXTURE_FILE=Join-Path $env:RUNNER_TEMP 'ktrade-pine-guide-only-http.json'
          foreach($file in @($env:KTRADE_PINE_MARKER_FIXTURE_FILE,$env:KTRADE_PINE_HLINE_FIXTURE_FILE,$env:KTRADE_PINE_HLINE_NONFINITE_FIXTURE_FILE,$env:KTRADE_PINE_GUIDE_ONLY_FIXTURE_FILE)){if(!(Test-Path -LiteralPath $file)){throw 'ALL_ACTUAL_ORIGINAL_HTTP_FIXTURES_REQUIRED'}}
          $p=Join-Path $env:GITHUB_WORKSPACE 'product'
          $target=Join-Path $p 'static/pine_plot_renderer.js'
          $current=[IO.File]::ReadAllBytes($target)
          Push-Location $p
          try{
            try{
              $old=(& git show '504b28f07a24882470b847ff014391104f78bd66:static/pine_plot_renderer.js') -join "`n"
              if($LASTEXITCODE -ne 0){throw 'EXACT_ORIGINAL_PARENT_RENDERER_REQUIRED'}
              [IO.File]::WriteAllText($target,$old,[Text.UTF8Encoding]::new($false))
              $proof=@'
          const fs=require('node:fs'),vm=require('node:vm'),render=require('./static/pine_plot_renderer.js');
          const html=fs.readFileSync('templates/chart.tmpl','utf8'),a=html.indexOf('setPinePaneCaption(titles){'),b=html.indexOf('\nhlineMessage(',a);
          const fn=html.slice(a,b).trim().replace(/,$/,'').replace(/^setPinePaneCaption/,'function');
          const cases=JSON.parse(fs.readFileSync(process.env.KTRADE_PINE_GUIDE_ONLY_FIXTURE_FILE,'utf8'));if(cases.length!==2)throw Error('Both original HTTP cases required');
          for(const c of cases){let caption='';const setter=vm.runInNewContext('('+fn+')',{document:{getElementById:()=>({set textContent(v){caption=v;}})}});const chart={addLineSeries(){return{setData(){},createPriceLine(){}}},removeSeries(){}};const app={s:{pchart:chart,_indicatorSeries:[]},setPinePaneCaption:t=>setter(t)};render.apply(app,c.response);if(caption!=='No Pine plots applied.')throw Error('Original empty-caption defect not reproduced');}
          console.log('PR237_ORIGINAL_ACTUAL_V5_V6_GUIDE_ONLY_HTTP_EMPTY_CAPTION_DEFECT_REPRODUCED=PASS');
          '@
              & node -e $proof
              if($LASTEXITCODE -ne 0){throw 'ACTUAL_PARENT_CAPTION_DEFECT_NOT_REPRODUCED'}
            }finally{[IO.File]::WriteAllBytes($target,$current)}
            & node --test tests/rb3_pine_hline_transport.test.cjs tests/rb3_pine_shape_transport.test.cjs tests/rb3_pine_input_settings.test.cjs tests/rb3_w32b_pine_compile.test.cjs tests/rb3_w32c_pine_renderer.test.cjs tests/rb3_w90_catalog_actions.test.cjs
            if($LASTEXITCODE -ne 0){throw 'CURRENT_ACTUAL_GUIDE_ONLY_CAPTION_OR_PRIOR_PRESENTATION_FAILED'}
          }finally{Pop-Location}
          Write-Host '::notice::PR237_REAL_CHART_GUIDE_ONLY_CAPTION_APPLY_CLEAR_ACTUAL_HTTP_AND_PRIOR_CONTROLS=PASS'
      - name: Final source and authority custody
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if(@(& git -C (Join-Path $env:GITHUB_WORKSPACE 'product') status --porcelain --untracked-files=no).Count -ne 0){throw 'TRACKED_SOURCE_CHANGED'}
          Write-Host '::notice::NO_OWNER_DATA_NO_REAL_BROKER_NO_LIVE_NO_SIGNING_NO_PROMOTION'
