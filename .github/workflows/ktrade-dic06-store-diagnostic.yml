name: KTRADE DIC-06 bounded store diagnostic
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ktrade-dic06-store-diagnostic.yml
permissions:
  contents: read
jobs:
  diagnose:
    if: github.repository == 'spoonman136668-ai/Qualification-Forge'
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      KTRADE_EXPECTED_SOURCE_SHA: 'f113b96d45d39d29bc9ceef582834544c94c1b1e'
      KTRADE_CI_SOURCE_ONLY: '1'
      KTRADE_CI_PAPER_ONLY: '1'
      KTRADE_CI_LIVE_AUTHORITY: '0'
      KTRADE_CI_COINBASE_ALLOWED: '0'
      KTRADE_CI_PROMOTION_ALLOWED: '0'
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
    steps:
      - name: Require Windows
        shell: pwsh
        run: |
          if ($env:RUNNER_OS -cne 'Windows' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted') { throw 'DIC06_INVALID_RUNNER' }
      - name: Read exact private commit without caching tokens
        uses: actions/checkout@v4
        with:
          repository: spoonman136668-ai/ckb
          ref: ${{ env.KTRADE_EXPECTED_SOURCE_SHA }}
          path: checked-private
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.KTRADE_CKB_READ_TOKEN_TEMP }}
      - name: Go runtime without cache
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Classify allowlisted synthetic test case failures without emitting private output
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $logPath = Join-Path $env:RUNNER_TEMP 'ktrade-dic06-private-test-json.log'
          Push-Location (Join-Path $env:GITHUB_WORKSPACE 'checked-private')
          try {
            $sha = (& git rev-parse HEAD).Trim()
            if ($LASTEXITCODE -ne 0 -or $sha -cne $env:KTRADE_EXPECTED_SOURCE_SHA) { throw 'DIC06_DIAGNOSTIC_SOURCE_DRIFT' }
            & go test -json -count=1 -timeout=180s ./internal/incidentcapsule -run '^TestDIC06' *> $logPath
            $resultCode = $LASTEXITCODE
            $known = @(
              'TestDIC06DurableWriteRestartLoadAndInventory',
              'TestDIC06CorruptionRejectAndNeverOverwrite',
              'TestDIC06OrphanedStagingFileSurvivesAndIsReported',
              'TestDIC06RejectTraversalAndSymlinkedRecord',
              'TestDIC06BoundedPolicyAndAuthorityTamper',
              'TestDIC06RetentionCapNeverAutoDeletesEvidence'
            )
            $parsed = @()
            foreach ($line in (Get-Content -LiteralPath $logPath)) {
              try {
                $v = $line | ConvertFrom-Json
                if ($v.Test -in $known -and $v.Action -in @('pass','fail','run')) {
                  $parsed += [pscustomobject]@{Test=[string]$v.Test; Action=[string]$v.Action}
                }
              } catch {}
            }
            foreach ($name in $known) {
              $matches = @($parsed | Where-Object { $_.Test -ceq $name })
              $failed = @($matches | Where-Object { $_.Action -ceq 'fail' }).Count -gt 0
              $passed = @($matches | Where-Object { $_.Action -ceq 'pass' }).Count -gt 0
              $state = if ($failed) { 'FAIL' } elseif ($passed) { 'PASS' } else { 'NOT_EXECUTED' }
              Write-Host ('DIC06_CASE_' + $name.Replace('TestDIC06','').ToUpperInvariant() + '=' + $state)
            }
            if ($resultCode -ne 0) { throw 'DIC06_STORE_DIAGNOSTIC_FOUND_FAILURE' }
          } finally {
            Pop-Location
            Remove-Item -LiteralPath $logPath -Force -ErrorAction SilentlyContinue
          }
      - name: Purge private checkout
        if: always()
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE 'checked-private'
          if (Test-Path -LiteralPath $source) { Remove-Item -LiteralPath $source -Recurse -Force -ErrorAction SilentlyContinue }
          Write-Host 'DIC06_NO_PRIVATE_ARTIFACTS=PASS'
