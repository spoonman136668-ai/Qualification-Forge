name: G43 declaring receiver-qualified method dependency acceptance
on:
  push:
    branches: [qualification/g43-method-identity-20261019]
    paths: [.github/workflows/g43-method-identity-windows.yml]
permissions:
  contents: read
concurrency:
  group: g43-method-identity-20261019
  cancel-in-progress: false
jobs:
  qualification:
    if: github.repository == 'spoonman136668-ai/Qualification-Forge'
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      SOURCE: '170bdd82f123a9b77f868a06df0b38f47a4882f9'
      TREE: '8376131cb65664fd65b773435ae5d77eca8f50d6'
      BASE: 'fcd00819e50e934573c947481a76c8c233d7bba9'
      GOFLAGS: '-p=2'
      GOMAXPROCS: '2'
      CGO_ENABLED: '1'
      KTRADE_CI_PAPER_ONLY: '1'
      KTRADE_CI_LIVE_AUTHORITY: '0'
      KTRADE_CI_COINBASE_ALLOWED: '0'
      KTRADE_CI_PROMOTION_ALLOWED: '0'
    steps:
      - name: Checkout exact private source without retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: spoonman136668-ai/KTRADE
          ref: 170bdd82f123a9b77f868a06df0b38f47a4882f9
          fetch-depth: 0
          path: source
          persist-credentials: false
          token: ${{ secrets.KTRADE_SOURCE_READ_TOKEN }}
      - name: Verify exact source and narrow four-file tooling delta
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_OS -cne 'Windows' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or
             $env:KTRADE_CI_PAPER_ONLY -cne '1' -or $env:KTRADE_CI_LIVE_AUTHORITY -cne '0' -or
             $env:KTRADE_CI_COINBASE_ALLOWED -cne '0' -or $env:KTRADE_CI_PROMOTION_ALLOWED -cne '0'){
            throw 'G43_UNSAFE_PLATFORM_OR_AUTHORITY'
          }
          if((git rev-parse HEAD).Trim() -cne $env:SOURCE -or
             (git rev-parse 'HEAD^{tree}').Trim() -cne $env:TREE -or
             @(git status --porcelain).Count -ne 0){throw 'G43_SOURCE_DRIFT'}
          $expected=@(
            'tools/graphify/g35_typecalls/main.go',
            'tools/graphify/g35_typecalls/g39_closure_test.go',
            'tools/graphify/g35_typecalls/g43_method_receiver_test.go',
            'tools/graphify/g35_typecalls/G43.md'
          )|Sort-Object
          $actual=@(git diff --name-only $env:BASE $env:SOURCE)|Sort-Object
          if($actual.Count -ne 4 -or @(Compare-Object $expected $actual).Count -ne 0){throw 'G43_SCOPE_DRIFT'}
          $srcMod=(git rev-parse ($env:SOURCE+':go.mod')).Trim()
          $baseMod=(git rev-parse ($env:BASE+':go.mod')).Trim()
          if($srcMod -cne $baseMod){throw 'G43_GO_MOD_DRIFT'}
          if((git rev-parse ($env:SOURCE+':go.sum')).Trim() -cne '69585a34b570b18b077a232985e0bd116adaecd3'){
            throw 'G43_GO_SUM_DRIFT'
          }
          $g35files=@('tools/graphify/g35_typecalls/main_test.go','tools/graphify/g35_typecalls/README.md',
            'tools/graphify/g35_typecalls/sqlite_external.go','tools/graphify/g35_typecalls/sqlite_external_test.go',
            'tools/graphify/g35_typecalls/G39.md','tools/graphify/g35_typecalls/g41_initializers_test.go',
            'tools/graphify/g35_typecalls/G41.md')
          foreach($f in $g35files){
            if((git rev-parse ($env:BASE+':'+$f)).Trim() -cne (git rev-parse ($env:SOURCE+':'+$f)).Trim()){
              throw 'G43_UNCHANGED_G35_FOUNDATION_DRIFT'
            }
          }
          Write-Host 'G43_EXACT_FOUR_TOOLING_FILES_ONLY=PASS'
      - name: Use frozen Go 1.23 Windows toolchain
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Authenticate pinned SQLite module in disposable Go cache
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference='Stop'
          $p=& go mod download -json github.com/mattn/go-sqlite3@v1.14.18 | ConvertFrom-Json
          if($LASTEXITCODE -ne 0 -or $p.Path -cne 'github.com/mattn/go-sqlite3' -or
             $p.Version -cne 'v1.14.18' -or
             $p.Sum -cne 'h1:JL0eqdCOq6DJVNPSvArO/bIV9/P7fbGrV00LZHc+5aI=' -or
             $p.GoModSum -cne 'h1:2eHXhiwb8IkHr+BDWZGa96P6+rkvnG63S2DGjv9HUNg='){
            throw 'G43_SQLITE_GO_MODULE_AUTH_FAILURE'
          }
          & go mod verify
          if($LASTEXITCODE -ne 0){throw 'G43_DEPENDENCY_CACHE_VERIFY_FAILED'}
          Write-Host 'G43_SQLITE_EXACT_MODULE_SOURCE_VERIFIED=PASS'
      - name: Qualify bounded new compiler concurrency and affected tool interfaces
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference='Stop'
          $v=(& go version)
          if($LASTEXITCODE -ne 0 -or $v -cne 'go version go1.23.12 windows/amd64'){
            throw 'G43_TOOLCHAIN_DRIFT'
          }
          # Source changed at SQLite compiler-concurrency boundary; never reuse
          # focused evidence from the previous, different SHA.
          & go test -mod=readonly -count=1 ./tools/graphify/g35_typecalls ./internal/paperauthority ./internal/paperapp
          if($LASTEXITCODE -ne 0){throw 'G43_FOCUSED_TEST_FAILURE'}
          & go vet -mod=readonly ./tools/graphify/g35_typecalls ./internal/paperauthority ./internal/paperapp
          if($LASTEXITCODE -ne 0){throw 'G43_VET_FAILURE'}
          & go build -mod=readonly -o (Join-Path $env:RUNNER_TEMP 'g43.exe') ./tools/graphify/g35_typecalls
          if($LASTEXITCODE -ne 0){throw 'G43_BUILD_FAILURE'}
          Write-Host 'G43_NEW_SHA_FOCUSED_TEST_VET_BUILD=PASS'
      - name: Measure bounded authenticated type-resolution experiment
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference='Stop'
          $raw=Join-Path $env:RUNNER_TEMP ('g43-private-'+$env:GITHUB_RUN_ID+'.json')
          if(Test-Path -LiteralPath $raw){throw 'G43_RAW_COLLISION'}
          $exe=Join-Path $env:RUNNER_TEMP 'g43.exe'
          $psi=[System.Diagnostics.ProcessStartInfo]::new($exe)
          $psi.WorkingDirectory=(Get-Location).Path
          $psi.UseShellExecute=$false
          $psi.RedirectStandardOutput=$true
          $psi.RedirectStandardError=$true
          [void]$psi.ArgumentList.Add('--repo=.')
          [void]$psi.ArgumentList.Add(('--base='+$env:BASE))
          [void]$psi.ArgumentList.Add(('--source='+$env:SOURCE))
          [void]$psi.ArgumentList.Add('--packages=internal/paperauthority,internal/paperapp')
          [void]$psi.ArgumentList.Add(('--out='+$raw))
          if($psi.ArgumentList.Count -ne 5){throw 'G43_ARGUMENT_VECTOR_FAILED'}
          # A Windows Job Object constrains all descendants (including
          # go list, compile and cgo) to the existing 512 MiB budget, and
          # accounts CPU across exited child processes. No increased limits.
          $jobCSharp=@'
          using System;
          using System.Runtime.InteropServices;
          public static class G43ProcessTreeBudget {
            [StructLayout(LayoutKind.Sequential)] public struct BasicLimit {
              public long PerProcessUserTimeLimit, PerJobUserTimeLimit;
              public uint LimitFlags;
              public UIntPtr MinimumWorkingSetSize, MaximumWorkingSetSize;
              public uint ActiveProcessLimit;
              public UIntPtr Affinity;
              public uint PriorityClass, SchedulingClass;
            }
            [StructLayout(LayoutKind.Sequential)] public struct IoCounters {
              public ulong ReadOperations, WriteOperations, OtherOperations;
              public ulong ReadBytes, WriteBytes, OtherBytes;
            }
            [StructLayout(LayoutKind.Sequential)] public struct ExtendedLimit {
              public BasicLimit BasicLimitInformation;
              public IoCounters IoInfo;
              public UIntPtr ProcessMemoryLimit, JobMemoryLimit;
              public UIntPtr PeakProcessMemoryUsed, PeakJobMemoryUsed;
            }
            [StructLayout(LayoutKind.Sequential)] public struct Accounting {
              public long TotalUserTime, TotalKernelTime;
              public long ThisPeriodTotalUserTime, ThisPeriodTotalKernelTime;
              public uint TotalPageFaultCount, TotalProcesses;
              public uint ActiveProcesses, TotalTerminatedProcesses;
            }
            [DllImport("kernel32.dll", SetLastError=true)]
            static extern IntPtr CreateJobObject(IntPtr attributes, string name);
            [DllImport("kernel32.dll", SetLastError=true)]
            static extern bool SetInformationJobObject(IntPtr job,int kind,ref ExtendedLimit data,uint size);
            [DllImport("kernel32.dll", SetLastError=true)]
            static extern bool QueryInformationJobObject(IntPtr job,int kind,out ExtendedLimit data,uint size,out uint result);
            [DllImport("kernel32.dll", SetLastError=true)]
            static extern bool QueryInformationJobObject(IntPtr job,int kind,out Accounting data,uint size,out uint result);
            [DllImport("kernel32.dll", SetLastError=true)]
            static extern bool AssignProcessToJobObject(IntPtr job,IntPtr process);
            [DllImport("kernel32.dll", SetLastError=true)]
            static extern bool CloseHandle(IntPtr handle);
            static Exception Fail(string s){return new InvalidOperationException(s+": "+Marshal.GetLastWin32Error());}
            public static IntPtr Create(ulong limit){
              IntPtr job=CreateJobObject(IntPtr.Zero,null);
              if(job==IntPtr.Zero)throw Fail("G43_JOB_CREATE");
              var x=new ExtendedLimit();
              x.BasicLimitInformation.LimitFlags=0x00000200|0x00002000;
              x.JobMemoryLimit=new UIntPtr(limit);
              if(!SetInformationJobObject(job,9,ref x,(uint)Marshal.SizeOf<ExtendedLimit>())){
                CloseHandle(job);throw Fail("G43_JOB_SET_LIMIT");
              }
              return job;
            }
            public static void Attach(IntPtr job,IntPtr process){
              if(!AssignProcessToJobObject(job,process))throw Fail("G43_JOB_ATTACH");
            }
            public static double[] Read(IntPtr job){
              ExtendedLimit x;
              Accounting a;
              uint returned;
              if(!QueryInformationJobObject(job,9,out x,(uint)Marshal.SizeOf<ExtendedLimit>(),out returned))
                throw Fail("G43_JOB_MEMORY_READ");
              if(!QueryInformationJobObject(job,1,out a,(uint)Marshal.SizeOf<Accounting>(),out returned))
                throw Fail("G43_JOB_CPU_READ");
              return new double[]{(a.TotalUserTime+a.TotalKernelTime)/10000.0,
                  x.PeakJobMemoryUsed.ToUInt64(),a.TotalProcesses};
            }
            public static void Close(IntPtr job){if(job!=IntPtr.Zero)CloseHandle(job);}
          }
          '@
          Add-Type -TypeDefinition $jobCSharp -ErrorAction Stop
          $job=[G43ProcessTreeBudget]::Create([ulong]536870912)
          $watch=[System.Diagnostics.Stopwatch]::StartNew()
          $p=[System.Diagnostics.Process]::Start($psi)
          if($null -eq $p){[G43ProcessTreeBudget]::Close($job);throw 'G43_EXEC_START_FAILURE'}
          [G43ProcessTreeBudget]::Attach($job,$p.Handle)
          $stdout=$p.StandardOutput.ReadToEndAsync()
          $stderr=$p.StandardError.ReadToEndAsync()
          $rss=[long]0
          while(-not $p.HasExited){
            try{$m=[long]$p.PeakWorkingSet64;if($m -gt $rss){$rss=$m}}catch{}
            if($watch.Elapsed.TotalSeconds -gt 120){$p.Kill();throw 'G43_120_SECOND_WALL_LIMIT'}
            Start-Sleep -Milliseconds 50
          }
          $p.WaitForExit()
          $cpu=[long]$p.TotalProcessorTime.TotalMilliseconds
          $treeMetrics=[G43ProcessTreeBudget]::Read($job)
          [G43ProcessTreeBudget]::Close($job)
          $treeCpuMs=[long][Math]::Ceiling($treeMetrics[0])
          $treePeakBytes=[long]$treeMetrics[1]
          $treeProcesses=[long]$treeMetrics[2]
          Write-Host ('G43_JOB_OBSERVED_PROCESSES='+$treeProcesses)
          Write-Host ('G43_JOB_OBSERVED_CPU_MS='+$treeCpuMs)
          Write-Host ('G43_JOB_OBSERVED_PEAK_COMMIT='+$treePeakBytes)
          if($treeProcesses -lt 2 -or $treeCpuMs -gt 120000 -or
             $treePeakBytes -le 0 -or $treePeakBytes -gt 536870912){
             throw 'G43_TREE_CPU_MEMORY_HARD_LIMIT_OR_ACCOUNTING_FAILED'
          }
          $out=$stdout.GetAwaiter().GetResult()
          $err=$stderr.GetAwaiter().GetResult()
          $watch.Stop()
          if($p.ExitCode -ne 0){throw ('G43_GENERATOR_FAILED_'+$p.ExitCode+': '+$err)}
          if($cpu -gt 120000 -or $rss -le 0 -or $rss -gt 536870912 -or
             $watch.Elapsed.TotalSeconds -gt 120){throw 'G43_CPU_RSS_WALL_CAP'}
          $d=Get-Content -LiteralPath $raw -Raw|ConvertFrom-Json
          if($d.SourceCommit -cne $env:SOURCE -or $d.SourceTree -cne $env:TREE -or
             $d.Schema -cne 'graphify.g43.receiver-qualified-static-methods.v1' -or
             $d.CallSites -ne 1015 -or
             $d.PackageInitializerCallSites -ne 12 -or
             $d.PackageInitializerStaticEdges -ne 12 -or
             $d.NestedClosureCallSites -ne 276 -or $d.ClosureStaticEdges -ne 220 -or
             $d.CrossPackageStaticEdges -ne 18 -or $d.Unresolved -ne 206 -or
             $d.ReceiverQualifiedMethodEdges -le 0 -or
             $d.ReceiverQualifiedMethodEdges -ne $d.ResolvedConcreteMethods -or
             $d.SourceFileCount -gt 36 -or $d.SelectedSourceBytes -gt 3145728 -or
             $d.CallSites -ne ($d.ResolvedDirect+$d.ResolvedConcreteMethods+$d.ResolvedExternal+$d.Unresolved) -or
             @($d.TypeCheckedEdges).Count -ne ($d.CallSites-$d.Unresolved)){
            throw 'G43_CONSERVATION_OR_SOURCE_BOUNDARY_FAILED'
          }
          $expected=@('ktrade/internal/paperauthority','ktrade/internal/paperapp')
          foreach($pkg in $expected){if(@($d.Packages|Where-Object {$_.Package -ceq $pkg}).Count -ne 1){
             throw ('G43_NEW_PACKAGE_ABSENT_'+$pkg)
          }}
          # G43 repairs an ambiguous callee label while conserving the frozen
          # G41 caller/site, unresolved, initializer and closure boundaries.
          $receiverMethods=@($d.TypeCheckedEdges|Where-Object {$_.Kind -ceq 'concrete_method'})
          $qualifiedMethods=0
          foreach($edge in $receiverMethods){
            if([string]::IsNullOrWhiteSpace($edge.CalleePackage) -or
               -not $edge.Callee.StartsWith($edge.CalleePackage+'.(') -or
               $edge.Callee -notmatch '\)\.[A-Za-z_][A-Za-z0-9_]*$'){
              throw 'G43_METHOD_DECLARING_RECEIVER_UNQUALIFIED'
            }
            $qualifiedMethods++
          }
          if($receiverMethods.Count -ne $d.ReceiverQualifiedMethodEdges -or
             $qualifiedMethods -lt 1){
            throw 'G43_METHOD_CONSERVATION_OR_NO_REAL_METHODS'
          }
          foreach($edge in $d.TypeCheckedEdges){
            if([string]::IsNullOrWhiteSpace($edge.CalleePackage)){
              throw 'G43_MISSING_COMPILER_CALLEE_PACKAGE'
            }
          }
          $previewInit=@($d.TypeCheckedEdges|Where-Object {
            $_.Caller -like 'ktrade/internal/paperapp::package_init@*' -and
            $_.Callee -ceq 'regexp.MustCompile'
          })
          $authorityInit=@($d.TypeCheckedEdges|Where-Object {
            $_.Caller -like 'ktrade/internal/paperauthority::package_init@*' -and
            $_.Callee -ceq 'regexp.MustCompile'
          })
          $falseAlias=@($d.TypeCheckedEdges|Where-Object {
            $_.Caller -like '*::package_init@*' -and
            $_.Callee -like '*ErrRecoveryRequiresReview*'
          })
          $closureEdges=@($d.TypeCheckedEdges|Where-Object {
            $_.Caller -like 'ktrade/internal/paperapp::closure@*' -and
            $_.CalleePackage -ceq 'ktrade/internal/paperauthority'
          })
          if($previewInit.Count -ne 1 -or $authorityInit.Count -ne 1 -or
             $falseAlias.Count -ne 0 -or $d.SourceFileCount -ne 11 -or
             $closureEdges.Count -lt 6){
            throw 'G43_FROZEN_G41_SOURCE_WITNESS_DRIFT'
          }
          Write-Host ('G43_RECEIVER_QUALIFIED_METHOD_EDGES='+$qualifiedMethods)
          Write-Host ('G43_PAPERAPP_REGEXP_INITIALIZER='+$previewInit.Count)
          Write-Host ('G43_PAPERAUTHORITY_REGEXP_INITIALIZER='+$authorityInit.Count)
          Write-Host ('G43_NONCALL_ALIAS_FALSE_POSITIVES='+$falseAlias.Count)
          Write-Host ('G43_G41_CLOSURE_EDGE_WITNESSES='+$closureEdges.Count)
          Write-Host 'G43_G41_FROZEN_CONTROL=1015_CALLS_12_INITIALIZERS_276_CLOSURE_220_CLOSURE_STATIC_18_CROSS_206_UNRESOLVED'
          foreach($edge in $d.TypeCheckedEdges){
            if($edge.Confidence -cne 'go_types_static_object'){throw 'G43_FABRICATED_CONFIDENCE'}
          }
          Write-Host ('G43_NEW_PACKAGE_CALL_SITES='+$d.CallSites)
          Write-Host ('G43_STATIC_CROSS_PACKAGE_EDGES='+$d.CrossPackageStaticEdges)
          Write-Host ('G43_UNRESOLVED='+$d.Unresolved)
          Write-Host ('G43_SOURCE_FILE_COUNT='+$d.SourceFileCount)
          Write-Host ('G43_PROCESS_CPU_MS='+$cpu)
          Write-Host ('G43_PROCESS_RSS_BYTES='+$rss)
          Write-Host ('G43_WALL_MS='+([long]$watch.Elapsed.TotalMilliseconds))
          Write-Host ('G43_TREE_PROCESS_COUNT='+$treeProcesses)
          Write-Host ('G43_TREE_TOTAL_CPU_MS='+$treeCpuMs)
          Write-Host ('G43_TREE_PEAK_COMMITTED_BYTES='+$treePeakBytes)
          Write-Host 'G43_WINDOWS_JOB_MEMORY_LIMIT_512M=ENFORCED'
          Write-Host 'G43_PINNED_SQLITE_BOUNDARY_QUALIFIED=PASS'
          $receipt=[ordered]@{
            schema='graphify.g43.receiver-qualified-methods.v1'
            source_sha=$env:SOURCE; source_tree=$env:TREE; source_parent=$env:BASE
            runner_workflow_sha=$env:GITHUB_SHA; run_id=$env:GITHUB_RUN_ID
            sqlite_module='github.com/mattn/go-sqlite3'; sqlite_version='v1.14.18'
            sqlite_sum='h1:JL0eqdCOq6DJVNPSvArO/bIV9/P7fbGrV00LZHc+5aI='
            selected_packages=$d.SelectedPackages
            source_files=$d.SourceFileCount; source_bytes=$d.SelectedSourceBytes
            call_sites=$d.CallSites; static_cross_package=$d.CrossPackageStaticEdges
            nested_closure_sites=$d.NestedClosureCallSites
            closure_static_edges=$d.ClosureStaticEdges
            initializer_sites=$d.PackageInitializerCallSites
            initializer_static_edges=$d.PackageInitializerStaticEdges
            paperapp_initializer_witnesses=$previewInit.Count
            paperauthority_initializer_witnesses=$authorityInit.Count
            noncall_alias_false_positives=$falseAlias.Count
            g41_paperapp_to_authority_closure_edges=$closureEdges.Count
            receiver_qualified_method_edges=$qualifiedMethods
            frozen_g41_calls=1015; frozen_g41_initializer_sites=12
            frozen_g41_closure_sites=276; frozen_g41_closure_edges=220
            frozen_g41_unknown=206; frozen_g41_cross_package=18
            unresolved=$d.Unresolved; cpu_ms=$cpu; rss_bytes=$rss
            wall_ms=[long]$watch.Elapsed.TotalMilliseconds
            process_tree_count=$treeProcesses
            process_tree_total_cpu_ms=$treeCpuMs
            process_tree_peak_committed_bytes=$treePeakBytes
            process_tree_memory_cap_enforced=$true
            private_report_sha256=(Get-FileHash -LiteralPath $raw -Algorithm SHA256).Hash.ToLowerInvariant()
            user_data_touched=$false; full_app_regression_repeated=$false
            trading_or_release_authorized=$false; private_edges_uploaded=$false
          }
          $dir=Join-Path $env:GITHUB_WORKSPACE 'evidence'
          New-Item -ItemType Directory -Path $dir -Force|Out-Null
          $receipt|ConvertTo-Json -Depth 7|Set-Content -LiteralPath (Join-Path $dir 'g43-sanitized.json') -Encoding utf8
          Write-Host ('G43_SANITIZED_SHA256='+(Get-FileHash -LiteralPath (Join-Path $dir 'g43-sanitized.json') -Algorithm SHA256).Hash.ToLowerInvariant())
      - name: Check immutable source and upload sanitized receipt only
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference='Stop'
          if((git rev-parse HEAD).Trim() -cne $env:SOURCE -or
             (git rev-parse 'HEAD^{tree}').Trim() -cne $env:TREE -or
             @(git status --porcelain).Count -ne 0){throw 'G43_POST_QUAL_SOURCE_MUTATION'}
          Write-Host 'G43_SOURCE_IMMUTABLE=PASS'
      - name: Upload sanitized qualification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g43-sqlite-qualified-sanitized
          path: evidence/g43-sanitized.json
          retention-days: 90
          if-no-files-found: error
      - name: Remove private source and generated reports
        if: always()
        shell: pwsh
        run: |
          Remove-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'source') -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem -LiteralPath $env:RUNNER_TEMP -File -Filter 'g43-*' -ErrorAction SilentlyContinue|Remove-Item -Force
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'g43.exe') -Force -ErrorAction SilentlyContinue
          if(Test-Path -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'source')){throw 'G43_CLEANUP_FAILED'}
          Write-Host 'G43_PRIVATE_CLEANUP=PASS'
