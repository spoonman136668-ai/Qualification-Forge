name: KTRADE DIC-10 Pine and incident integration qualification
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ktrade-dic10-pine-dic-integration.yml

permissions:
  contents: read

jobs:
  qualify:
    if: github.repository == 'spoonman136668-ai/Qualification-Forge'
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      KTRADE_EXPECTED_SOURCE_SHA: '37a60ef649b627f0b8923278b39495f92292a8a0'
      KTRADE_CI_SOURCE_ONLY: '1'
      KTRADE_CI_PAPER_ONLY: '1'
      KTRADE_CI_LIVE_AUTHORITY: '0'
      KTRADE_CI_COINBASE_ALLOWED: '0'
      KTRADE_CI_PROMOTION_ALLOWED: '0'
      GOFLAGS: '-p=2'
      GOMAXPROCS: '2'
    steps:
      - name: Require no-authority isolated hosted Windows
        shell: pwsh
        run: |
          if($env:RUNNER_OS -cne 'Windows' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted'){throw 'DIC10_NOT_HOSTED_WINDOWS'}
          Write-Host 'DIC10_HOSTED_WINDOWS=PASS'
      - name: Fetch private exact KTRADE review source
        uses: actions/checkout@v4
        with:
          repository: spoonman136668-ai/ckb
          ref: ${{ env.KTRADE_EXPECTED_SOURCE_SHA }}
          path: checked-private
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.KTRADE_CKB_READ_TOKEN_TEMP }}
      - name: Isolated Go without public cache
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Verify donor integration and DIC coexistence
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:GITHUB_WORKSPACE 'checked-private'
          $private=Join-Path $env:RUNNER_TEMP 'dic10-private-source.log'
          Push-Location $root
          try{
            $head=(& git rev-parse HEAD).Trim()
            if($LASTEXITCODE -ne 0 -or $head -cne $env:KTRADE_EXPECTED_SOURCE_SHA){throw 'DIC10_SOURCE_IDENTITY_DRIFT'}
            Write-Host 'DIC10_SOURCE_IDENTITY=PASS'
            function Check([string]$name,[string]$exe,[string[]]$arguments){
              try{& $exe @arguments *> $private;if($LASTEXITCODE -ne 0){throw 'nonzero'}}
              catch{throw ('DIC10_'+$name+'_PRIVATE_FAILURE')}
              Write-Host ('DIC10_'+$name+'=PASS')
            }
            Check 'R12_STARTUP' 'go' @('test','-count=1','-timeout=180s','.','-run','^TestKTRADERecoveryR12')
            Check 'R13_PINE_MANAGEMENT' 'go' @('test','-count=1','-timeout=180s','./pkg','-run','^TestKTRADERecoveryR13')
            Check 'PINE_UPGRADE' 'go' @('test','-count=1','-timeout=180s','./internal/durableupgrade','-run','^TestPineLibrary')
            Check 'DIC08_INCIDENT_UPGRADE' 'go' @('test','-count=1','-timeout=180s','./internal/durableupgrade','-run','^TestDIC08')
            Check 'DIC_CAPSULE' 'go' @('test','-count=1','-timeout=180s','./internal/incidentcapsule','-run','^TestDIC0')
            Check 'DIC_OPERATOR' 'go' @('test','-count=1','-timeout=180s','./pkg','-run','^TestDIC0')
            Check 'FULL_REGRESSION' 'go' @('test','-count=1','-timeout=420s','./...')
            Check 'VET' 'go' @('vet','./...')
            Check 'GO_BUILD' 'go' @('build','./...')
            Check 'JS_PARSE' 'node' @('--check','pkg/web/app.js')
            Check 'FOUR_WINDOWS_EXES' 'cmd.exe' @('/d','/c','RUN-BUILD-WINDOWS.cmd')
            if((& git rev-parse HEAD).Trim() -cne $env:KTRADE_EXPECTED_SOURCE_SHA){throw 'DIC10_SOURCE_CHANGED'}
            if(@(& git status --porcelain=v1 --untracked-files=no).Count -ne 0){throw 'DIC10_TRACKED_SOURCE_CHANGED'}
            Write-Host 'DIC10_SOURCE_UNCHANGED=PASS'
            Write-Host 'DIC10_NO_INSTALLED_PARITY_CLAIM=PASS'
          }finally{
            Pop-Location
            Remove-Item -LiteralPath $private -Force -ErrorAction SilentlyContinue
          }
      - name: Run actual packaged offline KTRADE combined Pine and DIC continuity
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $private=Join-Path $env:RUNNER_TEMP 'dic10-private-combined-installed.log'
          $scratch=Join-Path $env:RUNNER_TEMP 'dic10-isolated-installed'
          Push-Location (Join-Path $env:GITHUB_WORKSPACE 'checked-private')
          try{
            $testFile=Join-Path (Get-Location) 'windows/ktrade-dic10-synthetic-installed-combined.ps1'
            $parseTokens=$null
            $parseErrors=$null
            $null=[System.Management.Automation.Language.Parser]::ParseFile($testFile,[ref]$parseTokens,[ref]$parseErrors)
            if($null -ne $parseErrors -and @($parseErrors).Count -gt 0){throw 'DIC10_INSTALLED_HARNESS_PARSE_INVALID'}
            Write-Host 'DIC10_INSTALLED_HARNESS_PARSE=PASS'
            & pwsh -NoProfile -File 'windows/ktrade-dic10-synthetic-installed-combined.ps1' -ScratchRoot $scratch *> $private
            $exit=$LASTEXITCODE
            $lines=@(Get-Content -LiteralPath $private -ErrorAction SilentlyContinue)
            $required=@(
              'PACKAGED_FOUR_EXES_AND_MANIFEST',
              'NO_BROKER_EGRESS_FIREWALL',
              'PACKAGED_EXE_LOCAL_OPERATOR_READY',
              'INSTALLED_OPERATOR_PANEL',
              'INSTALLED_CSRF_REJECTS_UNAUTHORIZED_SAVE',
              'INSTALLED_SAVE_LIST_EXPORT',
              'COMBINED_OPERATOR_PINE_AND_INCIDENT_UI',
              'COMBINED_BUILTINS_DISCOVERY_METADATA_ONLY',
              'COMBINED_PINE_CSRF_DENIAL',
              'COMBINED_PINE_IMPORT_AND_FAVORITES_SAVED',
              'INSTALLED_RESTART_PRESERVES_REPORT',
              'COMBINED_PINE_AND_INCIDENT_RESTART_CONTINUITY',
              'INSTALLED_TAMPER_REJECTED',
              'SYNTHETIC_PREFERENCES_PNL_PINE_UNCHANGED',
              'DIC07_FULL_SYNTHETIC_OFFLINE_ACCEPTANCE'
            )
            foreach($name in $required){
              if(@($lines|Where-Object{$_ -ceq ('DIC07_'+$name+'=PASS')}).Count -eq 1){
                Write-Host ('DIC10_'+$name+'=PASS')
              }elseif($exit -eq 0){
                throw ('DIC10_MISSING_RUNTIME_GATE_'+$name)
              }
            }
            if($exit -ne 0){
              foreach($phase in @('INIT','SYNTHETIC_CONFIG','SYNTHETIC_KEY','FIREWALL_PROFILE','FIREWALL_RULE','APP_STARTUP','INSTALLED_CSRF_AND_UI','INSTALLED_INCIDENT_SAVE','INSTALLED_RESTART','INSTALLED_TAMPER')){
                if(@($lines|Where-Object{$_ -ceq ('DIC07_FAILURE_PHASE_'+$phase+'=FAIL')}).Count -gt 0){
                  Write-Host ('DIC10_FAILURE_PHASE_'+$phase+'=FAIL')
                }
              }
              $known=@(
                'COMBINED_PINE_UI_NOT_RENDERED',
                'COMBINED_BUILTIN_PINE_CATALOG_UNAVAILABLE',
                'COMBINED_PINE_DISCOVERY_LEAKS_SOURCE',
                'COMBINED_BUILTIN_PINE_ID_INVALID',
                'COMBINED_PINE_FAVORITES_CSRF_BYPASS',
                'COMBINED_PINE_FAVORITE_NOT_SAVED',
                'COMBINED_PINE_IMPORT_INVALID',
                'COMBINED_PINE_SOURCE_READBACK_FAILED',
                'COMBINED_RESTART_LOST_PINE_OR_FAVORITES',
                'COMBINED_RESTART_LOST_INCIDENT'
              )
              $categorized=$false
              foreach($code in $known){
                if(@($lines|Where-Object{$_.Contains('DIC07_'+$code)}).Count -gt 0){
                  Write-Host ('DIC10_FAILURE_CLASS_'+$code+'=FAIL')
                  $categorized=$true
                }
              }
              if(-not $categorized){
                foreach($status in @(400,401,403,404,409,422,500,503)){
                  if(@($lines|Where-Object{$_.Contains('Response status code: '+$status)}).Count -gt 0){
                    Write-Host ('DIC10_FAILURE_HTTP_'+$status+'=FAIL')
                    $categorized=$true
                  }
                }
              }
              if(-not $categorized){Write-Host 'DIC10_FAILURE_CLASS_OTHER=FAIL'}
              throw 'DIC10_COMBINED_INSTALLED_PRIVATE_FAILURE'
            }
            Write-Host 'DIC10_ACTUAL_OFFLINE_INSTALLED_COEXISTENCE=PASS'
          }finally{
            Pop-Location
            Remove-Item -LiteralPath $private -Force -ErrorAction SilentlyContinue
            if(Test-Path -LiteralPath $scratch){Remove-Item -LiteralPath $scratch -Recurse -Force -ErrorAction SilentlyContinue}
          }
      - name: Purge checkout no uploads
        if: always()
        shell: pwsh
        run: |
          $root=Join-Path $env:GITHUB_WORKSPACE 'checked-private'
          if(Test-Path -LiteralPath $root){Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue}
          Write-Host 'DIC10_PUBLIC_ARTIFACT_UPLOAD=DISABLED'
