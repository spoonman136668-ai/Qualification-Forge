name: KTRADE DIC-11 standard-user ACL acceptance
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ktrade-dic11-standard-user-acl.yml

permissions:
  contents: read

jobs:
  qualify:
    if: github.repository == 'spoonman136668-ai/Qualification-Forge'
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      KTRADE_EXPECTED_SOURCE_SHA: '342d2b6fcb432d0846c8347eb73f7e9155a326e0'
      KTRADE_CI_SOURCE_ONLY: '1'
      KTRADE_CI_PAPER_ONLY: '1'
      KTRADE_CI_LIVE_AUTHORITY: '0'
      KTRADE_CI_COINBASE_ALLOWED: '0'
      KTRADE_CI_PROMOTION_ALLOWED: '0'
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
    steps:
      - name: Require ephemeral GitHub-hosted Windows
        shell: pwsh
        run: |
          if($env:RUNNER_OS -cne 'Windows' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted'){throw 'DIC11_NOT_HOSTED_WINDOWS'}
          Write-Host 'DIC11_HOSTED_WINDOWS=PASS'
      - name: Checkout exact private KTRADE SHA without persisted credentials
        uses: actions/checkout@v4
        with:
          repository: spoonman136668-ai/ckb
          ref: ${{ env.KTRADE_EXPECTED_SOURCE_SHA }}
          path: checked-private
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.KTRADE_CKB_READ_TOKEN_TEMP }}
      - name: Configure Go without public cache
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Focused sealed incident regression and real user account ACL test
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $temp=Join-Path $env:RUNNER_TEMP 'dic11-private-output.log'
          $root=Join-Path $env:GITHUB_WORKSPACE 'checked-private'
          Push-Location $root
          try{
            $sha=(& git rev-parse HEAD).Trim()
            if($LASTEXITCODE -ne 0 -or $sha -cne $env:KTRADE_EXPECTED_SOURCE_SHA){throw 'DIC11_SOURCE_IDENTITY_DRIFT'}
            Write-Host 'DIC11_SOURCE_IDENTITY=PASS'
            & go test -count=1 -timeout=180s ./internal/incidentcapsule ./internal/durableupgrade *> $temp
            if($LASTEXITCODE -ne 0){throw 'DIC11_FOCUSED_GO_TESTS_PRIVATE_FAILURE'}
            Write-Host 'DIC11_FOCUSED_INCIDENT_TESTS=PASS'
            & pwsh -NoProfile -File 'windows/ktrade-dic11-standard-user-incident-acl.ps1' *> $temp
            $exit=$LASTEXITCODE
            $allow=@('REAL_INCIDENT_STORE_FIXTURE_BUILT','TWO_REAL_STANDARD_USER_IDENTITIES',
              'REAL_WINDOWS_PRIVATE_DIRECTORY_ACL','STANDARD_USER_SEALED_WRITE',
              'STANDARD_USER_VERIFIED_REOPEN','UNRELATED_STANDARD_USER_READ_WRITE_DENIED',
              'EVIDENCE_INTEGRITY_AFTER_DENIAL','NO_BROKER_NO_REAL_PROFILE',
              'DIC11_SYNTHETIC_STANDARD_USER_ACL')
            $lines=@(Get-Content -LiteralPath $temp -ErrorAction SilentlyContinue)
            foreach($label in $allow){
              if(@($lines | Where-Object{$_ -ceq ('DIC11_'+$label+'=PASS')}).Count -eq 1){
                Write-Host ('DIC11_'+$label+'=PASS')
              }
            }
            if($exit -ne 0){
              $phases=@('INIT','CREATE_USER_A','CREATE_USER_B','GROUP_MEMBERSHIP',
                'DIRECTORY_ACL','STANDARD_USER_WRITE','STANDARD_USER_READ',
                'UNRELATED_USER_DENIAL','INTEGRITY_AFTER_DENIAL')
              foreach($phase in $phases){
                if(@($lines|Where-Object{$_ -ceq ('DIC11_FAILURE_PHASE_'+$phase+'=FAIL')}).Count -gt 0){
                  Write-Host ('DIC11_FAILURE_PHASE_'+$phase+'=FAIL')
                }
              }
              foreach($code in @('LOCAL_ACCOUNT_CMDLET_MISSING','ACCOUNT_CREATION_DENIED',
                'ACCOUNT_PASSWORD_POLICY','ACCOUNT_COLLISION','OTHER_ACCOUNT_SETUP')){
                if(@($lines|Where-Object{$_ -ceq ('DIC11_ACCOUNT_FAILURE_CLASS_'+$code+'=FAIL')}).Count -gt 0){
                  Write-Host ('DIC11_ACCOUNT_FAILURE_CLASS_'+$code+'=FAIL')
                }
              }
              throw 'DIC11_STANDARD_USER_ACL_PRIVATE_FAILURE'
            }
            Write-Host 'DIC11_NONADMIN_ACL_ACCEPTANCE=PASS'
            if((& git rev-parse HEAD).Trim() -cne $env:KTRADE_EXPECTED_SOURCE_SHA){throw 'DIC11_SOURCE_CHANGED'}
            if(@(& git status --porcelain=v1 --untracked-files=no).Count -ne 0){throw 'DIC11_TRACKED_SOURCE_CHANGED'}
            Write-Host 'DIC11_SOURCE_UNCHANGED=PASS'
          }finally{
            Pop-Location
            Remove-Item -LiteralPath $temp -Force -ErrorAction SilentlyContinue
          }
      - name: Purge private source with no public artifacts
        if: always()
        shell: pwsh
        run: |
          $p=Join-Path $env:GITHUB_WORKSPACE 'checked-private'
          if(Test-Path -LiteralPath $p){Remove-Item -LiteralPath $p -Force -Recurse -ErrorAction SilentlyContinue}
          Write-Host 'DIC11_PUBLIC_PRIVATE_ARTIFACT_UPLOAD=DISABLED'
