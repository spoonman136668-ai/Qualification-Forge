name: KTRADE PR236 exact private engineering artifact native qualification
on:
  push:
    branches: [qualification/ktrade-original-pine-hline-transport-20261031]
    paths: [.github/workflows/ktrade-pr236-exact-private-artifact-native-windows.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: ktrade-pr236-exact-private-artifact-native-20261031
  cancel-in-progress: false
jobs:
  exact-private-native:
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      GOWORK: 'off'
      GOFLAGS: '-p=2'
      GOMAXPROCS: '2'
      CGO_ENABLED: '1'
      GOTOOLCHAIN: 'local'
      KTRADE_LIVE_TRADING: 'false'
      KTRADE_USE_LEGACY_CDP_CONFIG: '0'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: witness
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: spoonman136668-ai/ktrade
          ref: b03dd6e58b6120cae3ffd39a79c6965ab8e91b9a
          path: previous
          persist-credentials: false
          token: ${{ secrets.KTRADE_SOURCE_READ_TOKEN }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: spoonman136668-ai/ktrade
          ref: 504b28f07a24882470b847ff014391104f78bd66
          path: product
          persist-credentials: false
          token: ${{ secrets.KTRADE_SOURCE_READ_TOKEN }}
      - name: Read qualified PR235 installer as immutable asset comparison data only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: spoonman136668-ai/ktrade
          ref: 673b1171d19790f422acdd33f4199f8d4d8589ad
          path: previous-private-installer
          persist-credentials: false
          token: ${{ secrets.KTRADE_SOURCE_READ_TOKEN }}
      - name: Read unchanged installer from exact isolated private artifact commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: spoonman136668-ai/ktrade
          ref: 558ab74ffa41338b01543baa0fb0a99471eb68e0
          path: private-artifact
          fetch-depth: 2
          persist-credentials: false
          token: ${{ secrets.KTRADE_SOURCE_READ_TOKEN }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /qualification-artifacts/pr236-13063006422/
      - name: Verify original installer hash and isolated data custody without rebuild
        id: artifact
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/Qualification-Forge' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows'){throw 'EXISTING_HOSTED_QUALIFICATION_REQUIRED'}
          $data=Join-Path $env:GITHUB_WORKSPACE 'private-artifact'
          if((& git -C $data rev-parse HEAD).Trim() -cne '558ab74ffa41338b01543baa0fb0a99471eb68e0' -or (& git -C $data rev-parse HEAD^).Trim() -cne '504b28f07a24882470b847ff014391104f78bd66' -or @(& git -C $data status --porcelain).Count -ne 0){throw 'PRIVATE_ARTIFACT_DATA_COMMIT_OR_PARENT_DRIFT'}
          $actual=@(& git -C $data diff --name-only HEAD^ HEAD|Sort-Object)
          $allowed=@('qualification-artifacts/pr236-13063006422/.gitattributes','qualification-artifacts/pr236-13063006422/artifact-identity.json','qualification-artifacts/pr236-13063006422/installer.zip')|Sort-Object
          if(($actual -join '|') -cne ($allowed -join '|')){throw 'PRIVATE_ARTIFACT_ONLY_THREE_DATA_PATHS_REQUIRED'}
          $folder=Join-Path $data 'qualification-artifacts/pr236-13063006422'
          if((& git -C $data rev-parse 'HEAD:qualification-artifacts/pr236-13063006422/artifact-identity.json').Trim() -cne 'ca0891b5afa374e4e610b2b732d75af6e1c78d71'){throw 'PRIVATE_ARTIFACT_IDENTITY_BLOB_DRIFT'}
          $id=Get-Content (Join-Path $folder 'artifact-identity.json') -Raw|ConvertFrom-Json
          if($id.schema -cne 'ktrade.private.qualification-artifact-transport.v1' -or $id.source_sha -cne '504b28f07a24882470b847ff014391104f78bd66' -or $id.source_tree -cne 'bc516c9c38128949cf19bbcb784a88e29dd08685' -or $id.original_private_run -ne 41255531568 -or $id.original_private_artifact -ne 13063006422 -or $id.original_private_witness -cne '62f7c25e59919f65e5ddd1d4c21be8352a3d7a62' -or $id.producer_transport_witness -cne '3c9c42633e70cbb1d17db2b42242b2d04afe84ce' -or $id.original_outer_sha256 -cne 'b5911536699210f42dc22a0e6fe7ce469f0584a70df4aab2e6660b619cbe211e' -or $id.installer_sha256 -cne '88883361b778b35c837b8d2078de88b4845937e07ef822060662f6d8e9b91fa5' -or $id.build_repeated -cne $false -or $id.app_executed -cne $false -or $id.owner_data_accessed -cne $false -or $id.live_armed -cne $false -or $id.release_authority -cne 'none'){throw 'ORIGINAL_PRIVATE_ARTIFACT_IDENTITY_OR_AUTHORITY_DRIFT'}
          $inner=Join-Path $folder 'installer.zip'
          if((Get-FileHash $inner -Algorithm SHA256).Hash.ToLowerInvariant() -cne '88883361b778b35c837b8d2078de88b4845937e07ef822060662f6d8e9b91fa5'){throw 'PRIVATE_ACTUAL_INSTALLER_HASH_DRIFT'}
          $delivery=Join-Path $env:RUNNER_TEMP ('pr236-private-exact-'+[guid]::NewGuid().ToString('N'))
          $null=New-Item -ItemType Directory $delivery
          Copy-Item -LiteralPath $inner -Destination (Join-Path $delivery 'KTRADE-SetupBundle.zip')
          if((Get-FileHash (Join-Path $delivery 'KTRADE-SetupBundle.zip') -Algorithm SHA256).Hash.ToLowerInvariant() -cne $id.installer_sha256){throw 'ORIGINAL_PRIVATE_INSTALLER_COPY_CHANGED'}
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT,('bundle_root='+$delivery+[Environment]::NewLine),[Text.UTF8Encoding]::new($false))
          Write-Host '::notice::EXACT_PRIVATE_INSTALLER_EXISTING_CONTENTS_SCOPE_IDENTICAL_BYTES_NO_REBUILD_NO_PUBLIC_UPLOAD=PASS'
      - name: Independent exact private installer CRC pair proofs and all source assets without app execution
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $w=Join-Path $env:GITHUB_WORKSPACE 'witness'
          if((& git -C $w rev-parse 'HEAD:qualification-harness/ktrade-pine-hline-transport/Verify-Private-Installer.py').Trim() -cne 'b7b92384abd87ca6eecfd38b200d39192a3358c0'){throw 'PINNED_INDEPENDENT_PACKAGE_VERIFIER_REQUIRED'}
          $source=Join-Path $env:GITHUB_WORKSPACE 'product'
          if((& git -C $source rev-parse HEAD).Trim() -cne '504b28f07a24882470b847ff014391104f78bd66' -or (& git -C $source rev-parse 'HEAD^{tree}').Trim() -cne 'bc516c9c38128949cf19bbcb784a88e29dd08685'){throw 'VERIFIER_EXACT_SOURCE_REQUIRED'}
          $old=Join-Path $env:GITHUB_WORKSPACE 'previous-private-installer'
          if((& git -C $old rev-parse HEAD).Trim() -cne '673b1171d19790f422acdd33f4199f8d4d8589ad'){throw 'QUALIFIED_PR235_COMPARISON_ARTIFACT_REQUIRED'}
          $current=Join-Path $env:GITHUB_WORKSPACE 'private-artifact/qualification-artifacts/pr236-13063006422/installer.zip'
          $previous=Join-Path $old 'qualification-artifacts/pr235-13056452434/installer.zip'
          & python (Join-Path $w 'qualification-harness/ktrade-pine-hline-transport/Verify-Private-Installer.py') --installer $current --expected-hash '88883361b778b35c837b8d2078de88b4845937e07ef822060662f6d8e9b91fa5' --source '504b28f07a24882470b847ff014391104f78bd66' --source-tree 'bc516c9c38128949cf19bbcb784a88e29dd08685' --checkout $source --previous-installer $previous
          if($LASTEXITCODE -ne 0){throw 'INDEPENDENT_PRIVATE_INSTALLER_VERIFICATION_FAILED'}
      - name: Exact source and full source-owned CI plus actual native hosted acceptance
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $src=Join-Path $env:GITHUB_WORKSPACE 'product'
          if((& git -C $src rev-parse HEAD).Trim() -cne '504b28f07a24882470b847ff014391104f78bd66' -or (& git -C $src rev-parse 'HEAD^{tree}').Trim() -cne 'bc516c9c38128949cf19bbcb784a88e29dd08685' -or @(& git -C $src status --porcelain).Count -ne 0 -or (Test-Path (Join-Path $src '.env'))){throw 'EXACT_CLEAN_SOURCE_REQUIRED'}
          if((Get-Content (Join-Path $src 'pkg/advanced_orders.go') -Raw) -notmatch 'func liveBrokerageAuthorized\(\) bool \{ return false \}'){throw 'LIVE_AUTHORITY_DRIFT'}
          $run=Invoke-RestMethod -Uri 'https://api.github.com/repos/spoonman136668-ai/Qualification-Forge/actions/runs/41254118077' -Headers @{Authorization=('Bearer '+$env:GITHUB_TOKEN);Accept='application/vnd.github+json'} -TimeoutSec 30
          if($run.status -cne 'completed' -or $run.conclusion -cne 'success' -or $run.head_sha -cne 'ab6f73989777d51350e8c0906992bd117501b65f'){throw 'EXACT_FULL_SOURCE_AND_NATIVE_ACCEPTANCE_REQUIRED'}
          $pins=@(
            @('qualification-harness/ktrade-pine-hline-transport/Installed-HLine-Lifecycle.ps1','bebb636b42795b53d1241ee787938d55649153f6'),
            @('qualification-harness/ktrade-pine-hline-transport/Build-And-Qualify.ps1','41eb02bc69eb4558928d0b6b50831dad7c98b0ae'),
            @('qualification-harness/ktrade-w83/Original-W40-Paper.ps1','c69c3c05ff7f4ef933856b036bfa23fbf0a760f1')
          )
          foreach($pin in $pins){
            if((& git -C (Join-Path $env:GITHUB_WORKSPACE 'witness') rev-parse ('HEAD:'+$pin[0])).Trim() -cne $pin[1]){throw 'EXACT_ORIGINAL_NATIVE_FINANCIAL_HARNESS_REQUIRED'}
          }
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Original exact private package real installed native lifecycle
        shell: pwsh
        env:
          CANDIDATE_BUNDLE_ROOT: ${{ steps.artifact.outputs.bundle_root }}
        run: |
          $ErrorActionPreference='Stop'
          $env:TEMP=$env:RUNNER_TEMP;$env:TMP=$env:RUNNER_TEMP
          $h=Join-Path $env:GITHUB_WORKSPACE 'witness/qualification-harness/ktrade-w83'
          $probeLog=Join-Path $env:RUNNER_TEMP 'pr236-exact-private-native-output.txt'
          & (Join-Path $env:GITHUB_WORKSPACE 'witness/qualification-harness/ktrade-pine-hline-transport/Build-And-Qualify.ps1') -PreviousCheckout (Join-Path $env:GITHUB_WORKSPACE 'previous') -CandidateCheckout (Join-Path $env:GITHUB_WORKSPACE 'product') -WitnessScript (Join-Path $env:GITHUB_WORKSPACE 'witness/qualification-harness/ktrade-pine-hline-transport/Installed-HLine-Lifecycle.ps1') -NativeInputsPath (Join-Path $h 'Original-W40-Native-Inputs.ps1') -PaperScenarioPath (Join-Path $h 'Original-W40-Paper.ps1') -CandidateQualifiedBundleRoot $env:CANDIDATE_BUNDLE_ROOT -ExpectedCandidateArchiveSha256 '88883361b778b35c837b8d2078de88b4845937e07ef822060662f6d8e9b91fa5' 2>&1 | Tee-Object -FilePath $probeLog
          if($LASTEXITCODE -ne 0 -or !$?){throw 'EXACT_PRIVATE_ARCHIVE_NATIVE_ACCEPTANCE_FAILED'}
          # Actual execution coverage is mandatory. Defined-but-uncalled probes
          # must never turn a green lifecycle run into visual/memory acceptance.
          $observed=@(Get-Content -LiteralPath $probeLog)
          function ProbeJson([string]$prefix,[int]$count){
            $rows=@($observed|Where-Object {$_ -is [string] -and $_.StartsWith($prefix,[StringComparison]::Ordinal)})
            if($rows.Count -ne $count){throw ('W94B_REQUIRED_ACTUAL_PROBE_OUTPUT_MISSING_'+$prefix)}
            return @($rows|ForEach-Object {$_.Substring($prefix.Length)|ConvertFrom-Json -ErrorAction Stop})
          }
          $screens=@(ProbeJson 'W94B_PRICE_CHART_SCREEN_DIGEST=' 2)
          if(@($screens|Where-Object {$_.phase -ceq 'BEFORE_SUPERTREND'}).Count -ne 1 -or @($screens|Where-Object {$_.phase -ceq 'AFTER_SUPERTREND'}).Count -ne 1){throw 'W94B_BOTH_REAL_SCREEN_PHASES_REQUIRED'}
          $comparison=@(ProbeJson 'W94B_REAL_PRICE_PANE_COMPARISON=' 1)[0]
          if(!$comparison.identical_bounds -or $comparison.pixel_sample_count -lt 500 -or $comparison.changed_sample_count -lt 15 -or $comparison.before_sha256 -ceq $comparison.after_sha256){throw 'W94B_ACTUAL_PANE_PIXEL_DELTA_REQUIRED'}
          foreach($prefix in @('W94B_PROCESS_TREE_BEFORE=','W94B_PROCESS_TREE_AFTER=')){
            $p=@(ProbeJson $prefix 1)[0]
            if($p.webview2_count -lt 1 -or $p.process_count -ne @($p.members).Count -or $p.total_working_set_bytes -le 0){throw 'W94B_COMPLETE_REAL_PROCESS_MEASUREMENT_REQUIRED'}
            $sum=[long]0;foreach($member in $p.members){$sum+=[long]$member.working_set_bytes}
            if($sum -ne [long]$p.total_working_set_bytes){throw 'W94B_PROCESS_TOTAL_MISMATCH'}
          }
          if(@($observed|Where-Object {$_ -ceq '::notice::W94B_ACTIVE_PIXEL_AND_WEBVIEW_PROCESS_PROBES_EXECUTED=PASS'}).Count -ne 1){throw 'W94B_ACTUAL_PROBE_COMPLETION_REQUIRED'}
          Write-Host '::notice::W94B_ACTUAL_OUTPUT_COVERAGE_ENFORCED_PANE_DIFFERENCE_AND_ALL_OBSERVED_DESCENDANT_MEMORY=PASS'
          $lines=@(Get-Content $probeLog)
          foreach($marker in @('::notice::RSI_REAL_INSTALLED_WEBVIEW2_CONFIRMED_DIVERGENCE_PHYSICAL_APPLY_RSI_PANE_NO_TRADING=PASS','::notice::W94B_ACTIVE_PIXEL_AND_WEBVIEW_PROCESS_PROBES_EXECUTED=PASS','::notice::W83_PREVIOUS_TO_CANDIDATE_REAL_INSTALLED_UPDATE_ROLLBACK=PASS','::notice::W83_NO_OWNER_DATA_NO_LIVE_NO_RELEASE=PASS')){
            if(@($lines|Where-Object{$_ -ceq $marker}).Count -ne 1){throw 'EXACT_PRIVATE_ARTIFACT_ACTUAL_NATIVE_OUTPUT_MISSING'}
          }
          foreach($required in @('::notice::PINE_SETTINGS_NATIVE_PHYSICAL_NUMERIC_APPLY_SAVE_VALIDATION_AND_SOURCE_CUSTODY=PASS','::notice::PINE_SETTINGS_NATIVE_COLD_REOPEN_RESTORE_AND_EXPLICIT_DEFAULT_RESET=PASS')){
            if(@($observed|Where-Object {$_ -ceq $required}).Count -ne 1){throw 'SETTINGS_ACTUAL_NATIVE_PROBE_COMPLETION_REQUIRED'}
          }
          $settings=@(ProbeJson 'PINE_SETTINGS_ACTUAL_NATIVE_COLD_RESTORE_RESET=' 2)
          if(@($settings|Where-Object {$_.name -ceq 'Supertrend' -and $_.restored_values.input_0 -eq 3 -and $_.restored_values.input_1 -eq 2.5 -and $_.explicit_reset_verified -eq $true -and $_.disk_and_original_go_verified -eq $true}).Count -ne 1 -or @($settings|Where-Object {$_.name -ceq 'RSI Divergence' -and $_.restored_values.input_0 -eq 3 -and $_.explicit_reset_verified -eq $true -and $_.disk_and_original_go_verified -eq $true}).Count -ne 1){throw 'BOTH_REAL_SETTINGS_VALUES_AND_COLD_RESET_OUTPUTS_REQUIRED'}
          if(@($observed|Where-Object {$_ -ceq '::notice::PINE_MARKER_NATIVE_ORIGINAL_V5_V6_HTTP_AND_PHYSICAL_BOTH_ARROW_COLOR_OBSERVATION=PASS'}).Count -ne 1){throw 'EXACT_PRIVATE_ACTUAL_MARKER_PROBE_MUST_EXECUTE'}
          $markers=@(ProbeJson 'PINE_MARKER_ACTUAL_NATIVE_COLOR_AND_ORIGINAL_HTTP=' 2)
          foreach($version in @(5,6)){
            $match=@($markers|Where-Object {$_.version -eq $version})
            if($match.Count -ne 1){throw 'EXACT_PRIVATE_BOTH_NATIVE_PINE_VERSIONS_REQUIRED'}
            $m=$match[0]
            if(!$m.identical_bounds -or !$m.physical_editor_compile_and_apply -or $m.baseline_up_pixels -gt 2 -or $m.baseline_down_pixels -gt 2 -or $m.marked_up_pixels -lt 40 -or $m.marked_down_pixels -lt 40 -or $m.baseline_http.shapes -ne 0 -or $m.marked_http.up -lt 1 -or $m.marked_http.down -lt 1 -or !$m.marked_http.actual_response_bar_price_and_style_checked){throw 'EXACT_PRIVATE_ACTUAL_MARKER_HTTP_AND_COLOR_OBSERVATIONS_REQUIRED'}
          }
          if(@($observed|Where-Object {$_ -ceq '::notice::PINE_HLINE_NATIVE_ORIGINAL_V5_V6_RSI_THREE_LEVELS_PHYSICAL_GUIDE_ROWS_AND_REMOVAL=PASS'}).Count -ne 1){throw 'EXACT_PRIVATE_GUIDE_PROBE_MUST_EXECUTE'}
          $guides=@(ProbeJson 'PINE_HLINE_ACTUAL_NATIVE_RSI_GUIDE_ROWS=' 2)
          foreach($version in @(5,6)){
            $match=@($guides|Where-Object {$_.version -eq $version})
            if($match.Count -ne 1){throw 'EXACT_PRIVATE_BOTH_GUIDE_VERSIONS_REQUIRED'}
            $g=$match[0];$levels=@($g.actual_original_go_levels)
            if($levels.Count -ne 3 -or $levels[0] -ne 70 -or $levels[1] -ne 30 -or $levels[2] -ne 50 -or !$g.identical_bounds -or !$g.physical_editor_compile_apply_and_remove -or @($g.baseline_rows).Count -ne 0 -or @($g.applied_rows).Count -ne 3 -or @($g.removed_rows).Count -ne 0){throw 'EXACT_PRIVATE_RSI_GUIDE_ROWS_AND_REMOVAL_REQUIRED'}
          }
          Write-Host '::notice::EXACT_PRIVATE_ENGINEERING_INSTALLER_NATIVE_UI_PAPER_STOP_COLD_ROLLBACK_OBSERVED_PIXELS_PROCESSES=PASS'
