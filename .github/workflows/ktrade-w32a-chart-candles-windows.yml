name: KTRADE W32A chart candle validation and renderer Windows
permissions:
  contents: read
concurrency:
  group: ktrade-w32a-chart-candles
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: windows-2022
    timeout-minutes: 55
    env:
      GOWORK: 'off'
      GOFLAGS: -p=2
      GOMAXPROCS: '2'
      CGO_ENABLED: '1'
    steps:
    - name: Checkout immutable qualification witness
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: ${{ github.sha }}
        path: witness
        persist-credentials: false
    - name: Checkout exact KTRADE installed-update-rollback candidate
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        repository: spoonman136668-ai/ktrade
        ref: 4e1ff0a3c483865f277ebf708484c436a14b6067
        path: current
        fetch-depth: 4
        persist-credentials: false
        token: ${{ secrets.KTRADE_SOURCE_READ_TOKEN }}
    - name: Verify immutable source and completed native foundations
      shell: pwsh
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        $ErrorActionPreference='Stop'
        $src=Join-Path $env:GITHUB_WORKSPACE 'current'
        if((& git -C $src rev-parse HEAD).Trim() -cne '4e1ff0a3c483865f277ebf708484c436a14b6067' -or
           (& git -C $src rev-parse 'HEAD^{tree}').Trim() -cne '2ac175a501d22c8fa714d60937a6bc97b7243208'){throw 'W30A_SOURCE_IDENTITY_DRIFT'}
        foreach($pin in @(
          @{run=40615926800;sha='5c2a6200f54b4a9e50c05e00ffe45f42a2b5b413'}
        )){
          $r=Invoke-RestMethod -Uri ('https://api.github.com/repos/spoonman136668-ai/Qualification-Forge/actions/runs/'+$pin.run) -Headers @{Authorization='Bearer '+$env:GITHUB_TOKEN;Accept='application/vnd.github+json'}
          if($r.status -cne 'completed' -or $r.conclusion -cne 'success' -or $r.head_sha -cne $pin.sha){throw 'W30A_EXACT_QUALIFICATION_FOUNDATION_ABSENT'}
        }
        if((& git -C $src rev-parse HEAD~3).Trim() -cne 'e51e03c22f906704295a24138ac1ceba5d9ea0d4'){throw 'W30A_PARENT_DRIFT'}
        $delta=@(& git -C $src diff --name-only e51e03c22f906704295a24138ac1ceba5d9ea0d4 HEAD|Sort-Object)
        $want=@('templates/chart.tmpl','tests/rb3_w32a_original_chart_candles.test.cjs'|Sort-Object)
        if(Compare-Object $delta $want){throw 'W30A_FIVE_PATH_SCOPE_DRIFT'}
        Write-Output '::notice::W32A_EXACT_SOURCE_TWO_PATH_DELTA_AND_NATIVE_FOUNDATIONS=PASS'
        if(@(& git -C $src status --porcelain).Count -ne 0){throw 'W32A_UNEXPECTED_SOURCE_WORKTREE_STATE'}
    - name: Native Windows Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.25.0
        cache: false
        cache-dependency-path: |
          current/go.sum
          current/tools/wails-pilot/go.sum
    - name: Native Windows Node
      uses: actions/setup-node@v4
      with:
        node-version: '24'
    - name: Stage unchanged assets parse shell script and run affected interfaces
      shell: pwsh
      run: |
        $ErrorActionPreference='Stop'
        $env:TEMP=$env:RUNNER_TEMP;$env:TMP=$env:RUNNER_TEMP
        $src=Join-Path $env:GITHUB_WORKSPACE 'current'
        foreach($name in @('Install-KTRADE-Fresh.ps1','Manage-KTRADE-FreshInstall.ps1','Build-KTRADE-FreshInstaller.ps1')){
          $tokens=$null;$parseErrors=$null
          [void][Management.Automation.Language.Parser]::ParseFile((Join-Path $src ('windows/'+$name)),[ref]$tokens,[ref]$parseErrors)
          if($parseErrors.Count -ne 0){throw 'W30_SOURCE_SETUP_SCRIPT_SYNTAX_FAILED'}
        }
        Push-Location $src
        try{
          & npm ci --ignore-scripts --no-audit --no-fund --silent
          if($LASTEXITCODE -ne 0){throw 'W30_NPM_FAILED'}
          & node scripts/stage_offline_vendor.cjs
          if($LASTEXITCODE -ne 0){throw 'W30_VENDOR_STAGE_FAILED'}
        }finally{Pop-Location}
        Push-Location $src
        try{
         & node --test tests/rb3_w32a_original_chart_candles.test.cjs
         if($LASTEXITCODE -ne 0){throw 'W32A_FOCUSED_ORIGINAL_CHART_LOADER_FAILED'}
        }finally{Pop-Location}
        $browserTools=Join-Path $env:RUNNER_TEMP 'ktrade-w32-browser-tools'
        & npm install --prefix $browserTools --ignore-scripts --no-audit --no-fund --save-exact playwright-core@1.56.1
        if($LASTEXITCODE -ne 0){throw 'W32A_BROWSER_HARNESS_DEPENDENCY_FAILED'}
        $module=Join-Path $browserTools 'node_modules/playwright-core'
        $pkg=Get-Content -LiteralPath (Join-Path $module 'package.json') -Raw|ConvertFrom-Json
        if($pkg.version -cne '1.56.1'){throw 'W32A_BROWSER_HARNESS_IDENTITY_DRIFT'}
        ('W32_PLAYWRIGHT_MODULE='+$module)|Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        ('W32_NODE_EXE='+(Get-Command node.exe).Source)|Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        Write-Output ('W32A_BROWSER_TOOL_LOCK_SHA256='+(Get-FileHash -LiteralPath (Join-Path $browserTools 'package-lock.json')).Hash)
        Write-Output '::notice::W32A_FOCUSED_ORIGINAL_LOADER_AND_TAGGED_CANDLE_INTERFACES=PASS'
    - name: Reuse exact successful final-source regression vet and candle interface proof
      shell: pwsh
      run: |
        $ErrorActionPreference='Stop'
        $headers=@{Authorization='Bearer '+$env:GITHUB_TOKEN;Accept='application/vnd.github+json'}
        $base='https://api.github.com/repos/spoonman136668-ai/Qualification-Forge/actions/runs/40651438994'
        $r=Invoke-RestMethod -Uri $base -Headers $headers
        if($r.status -cne 'completed' -or $r.head_sha -cne 'c3044b4359f4fd48289f51cda6cf754c0ea73532'){throw 'W32A_EXACT_PROOF_RUN_ABSENT'}
        $j=Invoke-RestMethod -Uri ($base+'/jobs') -Headers $headers
        $job=@($j.jobs|Where-Object {$_.id -eq 122692191977 -and $_.name -ceq 'qualify'})
        if($job.Count -ne 1){throw 'W32A_EXACT_PROOF_JOB_ABSENT'}
        foreach($name in @('Verify immutable source and completed native foundations','Stage unchanged assets parse shell script and run affected interfaces','Final frozen-source full Go and Wails regression vet before build')){
         $step=@($job[0].steps|Where-Object {$_.name -ceq $name})
         if($step.Count -ne 1 -or $step[0].conclusion -cne 'success'){throw ('W32A_EXACT_SOURCE_STEP_NOT_SUCCESSFUL_'+$name)}
        }
        # Same immutable source/tree, dependency locks, staged assets, Go 1.25.0,
        # Node 24, Windows-2022 and Go test/vet commands. Only the external browser
        # fixture was strengthened; no failed native/renderer result is reused.
        Write-Output '::notice::W32A_EXACT_SOURCE_FULL_REGRESSION_VET_AND_TAGGED_CANDLE_TESTS_REUSED=PASS'
        if($r.conclusion -cne 'success'){throw 'W32A_FULL_INSTALLED_LIFECYCLE_PROOF_NOT_SUCCESSFUL'}
        $native=@($job[0].steps|Where-Object {$_.name -ceq 'Real installed previous update and rollback cold Windows lifecycle'})
        if($native.Count -ne 1 -or $native[0].conclusion -cne 'success'){throw 'W32A_EXACT_INSTALLED_WAILS_NATIVE_PROOF_ABSENT'}
        Write-Output '::notice::W32A_EXACT_SOURCE_COMPLETE_INSTALLED_WAILS_LIFECYCLE_REUSED=PASS'
      env:
        GITHUB_TOKEN: ${{ github.token }}
    - name: Build exact current source-bound renderer package
      shell: pwsh
      run: |
        $ErrorActionPreference='Stop'
        $env:TEMP=$env:RUNNER_TEMP;$env:TMP=$env:RUNNER_TEMP
        $src=Join-Path $env:GITHUB_WORKSPACE 'current'
        $build=Join-Path $env:GITHUB_WORKSPACE ('ktrade-setup-package-'+[guid]::NewGuid().ToString('N'))
        & (Join-Path $src 'windows/Build-KTRADE-FreshInstaller.ps1') -OutputRoot $build -ExpectedSourceSha '4e1ff0a3c483865f277ebf708484c436a14b6067'
        if($LASTEXITCODE -ne 0){throw 'W32A_EXACT_PACKAGE_BUILD_FAILED'}
        [IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'w32-final-build.txt'),$build)
    - name: Exact installed assets final real Windows renderer and cleanup
      shell: pwsh
      run: |
        $ErrorActionPreference='Stop'
        $env:TEMP=$env:RUNNER_TEMP;$env:TMP=$env:RUNNER_TEMP
        if($env:RUNNER_ENVIRONMENT -cne 'github-hosted'){throw 'W32A_EPHEMERAL_HOST_REQUIRED'}
        $build=[IO.File]::ReadAllText((Join-Path $env:RUNNER_TEMP 'w32-final-build.txt'))
        $bundle=Join-Path $build 'KTRADE-SetupBundle'
        $target=Join-Path $env:GITHUB_WORKSPACE 'w32 final renderer installed'
        $ps51=Join-Path $env:WINDIR 'System32/WindowsPowerShell/v1.0/powershell.exe'
        $out=@(& $ps51 -NoProfile -ExecutionPolicy Bypass -File (Join-Path $bundle 'KTRADE-Setup.ps1') -Action Install -InstallRoot $target)
        if($LASTEXITCODE -ne 0){throw 'W32A_FRESH_INSTALL_FAILED'}
        $r=($out -join [Environment]::NewLine)|ConvertFrom-Json
        if($r.source_sha -cne '4e1ff0a3c483865f277ebf708484c436a14b6067' -or $r.app_launched -or $r.live_armed){throw 'W32A_FRESH_INSTALL_IDENTITY_DRIFT'}
        $sentinel=Join-Path $r.candidate_directory 'data/unknown-renderer-owner-data'
        [IO.File]::WriteAllText($sentinel,'PRESERVE EXACT RENDERER TEST DATA')
        $map=@{};foreach($f in Get-ChildItem -LiteralPath (Join-Path $r.candidate_directory 'data') -Recurse -File -Force){$map[$f.FullName]=(Get-FileHash -LiteralPath $f.FullName).Hash}
        & $env:W32_NODE_EXE (Join-Path $env:GITHUB_WORKSPACE 'witness/qualification-harness/ktrade-w32a-renderer.cjs') $r.candidate_directory
        if($LASTEXITCODE -ne 0){throw 'W32A_FINAL_RENDERER_OR_CLEANUP_FAILED'}
        if(Test-Path -LiteralPath (Join-Path $target '.ktrade-w28c-active-process.lock')){throw 'W32A_FIXTURE_STARTED_A_TRADING_APP'}
        & $ps51 -NoProfile -ExecutionPolicy Bypass -File (Join-Path $target 'maintenance/KTRADE-Setup.ps1') -Action Uninstall -InstallRoot $target
        if($LASTEXITCODE -ne 0){throw 'W32A_FINAL_NATIVE_UNINSTALL_FAILED'}
        foreach($p in $map.Keys){if(!(Test-Path -LiteralPath $p) -or (Get-FileHash -LiteralPath $p).Hash -cne $map[$p]){throw 'W32A_RENDERER_DATA_CHANGED'}}
        foreach($name in @('ktrade.exe','ktrade-engine.exe','static','templates','strategies')){if(Test-Path -LiteralPath (Join-Path $r.candidate_directory $name)){throw 'W32A_RENDERER_INSTALL_CODE_REMAINED'}}
        Write-Output '::notice::W32A_FINAL_RENDERER_EXIT_ZERO_NATIVE_DATA_PRESERVING_CLEANUP=PASS'
    - name: Purge private source and disposable installed launch candidate
      if: always()
      shell: pwsh
      run: |
        $target=Join-Path $env:GITHUB_WORKSPACE 'w32 final renderer installed'
        $receipt=Join-Path $target '.ktrade-w29-install.json'
        if(Test-Path -LiteralPath $receipt){
         $r=Get-Content -LiteralPath $receipt -Raw|ConvertFrom-Json
         $folder=Join-Path ([Environment]::GetFolderPath('Programs')) ('KTRADE-'+$r.selection_digest.Substring(0,16))
         foreach($name in @('KTRADE.lnk','.ktrade-shortcut-receipt.json')){Remove-Item -LiteralPath (Join-Path $folder $name) -Force -ErrorAction SilentlyContinue}
         if((Test-Path -LiteralPath $folder) -and @(Get-ChildItem -LiteralPath $folder -Force).Count -eq 0){[IO.Directory]::Delete($folder,$false)}
        }
        foreach($dir in @('current','w32 final renderer installed')){Remove-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE $dir) -Recurse -Force -ErrorAction SilentlyContinue}
        Get-ChildItem -LiteralPath $env:GITHUB_WORKSPACE -Directory -Filter 'ktrade-setup-package-*'|Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
        Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'ktrade-w32-browser-tools') -Recurse -Force -ErrorAction SilentlyContinue
'on':
  push:
    branches:
    - qualification/ktrade-w32a-chart-candles-20261028
    paths:
    - .github/workflows/ktrade-w32a-chart-candles-windows.yml
    - qualification-harness/ktrade-w32a-renderer.cjs
