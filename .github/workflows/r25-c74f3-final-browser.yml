name: R25-C74F3 exact full Windows and Chromium operator acceptance
on:
  push:
    branches: [qualification/r25-c74f3-final-browser-20261019]
    paths: [.github/workflows/r25-c74f3-final-browser.yml]
permissions:
  contents: read
concurrency:
  group: r25-c74f3-final-browser
  cancel-in-progress: false
jobs:
  full-acceptance:
    if: github.repository == 'spoonman136668-ai/Qualification-Forge'
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      SOURCE_SHA: '798be4d4650afd04125c3c70e26b19c8024e10ea'
      SOURCE_TREE: '6c7fad1f690ba7738891ab76282b3ba7de195414'
      BASE_SHA: 'a2cfce8d1aead08d3251ae461e6dc66d57892ea4'
      GOFLAGS: '-p=2'
      GOMAXPROCS: '2'
      KTRADE_CI_PAPER_ONLY: '1'
      KTRADE_CI_LIVE_AUTHORITY: '0'
      KTRADE_CI_COINBASE_ALLOWED: '0'
      KTRADE_CI_PROMOTION_ALLOWED: '0'
    steps:
      - name: Enforce exact hosted Windows and no trading authority
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_OS -cne 'Windows' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or
             $env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/Qualification-Forge' -or
             $env:KTRADE_CI_PAPER_ONLY -cne '1' -or $env:KTRADE_CI_LIVE_AUTHORITY -cne '0' -or
             $env:KTRADE_CI_COINBASE_ALLOWED -cne '0' -or $env:KTRADE_CI_PROMOTION_ALLOWED -cne '0'){
            throw 'R25_C74F3_HOSTED_APP_SCOPE_BROKEN'
          }
          Write-Host 'R25_C74F3_FULL_HOSTED_PAPER_ISOLATION=PASS'
      - name: Exact KTRADE source at reviewed PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: spoonman136668-ai/ktrade
          ref: 798be4d4650afd04125c3c70e26b19c8024e10ea
          fetch-depth: 0
          path: source
          token: ${{ secrets.KTRADE_SOURCE_READ_TOKEN }}
          persist-credentials: false
      - name: Enforce exact immutable commit tree and 7-file bounded change
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference='Stop'
          if((& git rev-parse HEAD).Trim() -cne $env:SOURCE_SHA -or
             (& git rev-parse 'HEAD^{tree}').Trim() -cne $env:SOURCE_TREE -or
             @(& git status --porcelain=v1 --untracked-files=all).Count -ne 0){
            throw 'R25_C74F3_FULL_APP_SOURCE_IDENTITY_DRIFT'
          }
          $expected=@(
            'cmd/ktrade/operator_native_source_f3_full.go',
            'cmd/ktrade/operator_native_source_f3_full_test.go',
            'cmd/ktrade/operator_recovery_full.go',
            'docs/R25_C74F3_AUTHENTICATED_NATIVE_SOURCE.md',
            'internal/durableupgrade/authenticated_native_vwap_source.go',
            'tests/donor-native-vwap/c74f3_source_fixture.go',
            'tests/donor-shadow/native_vwap_c74f3_test.go'
          ) | Sort-Object
          $got=@(& git diff --name-only $env:BASE_SHA $env:SOURCE_SHA | Sort-Object)
          if(@(Compare-Object $expected $got).Count -ne 0){throw 'R25_C74F3_UNQUALIFIED_SOURCE_DELTA'}
          Write-Host 'R25_C74F3_FULL_APP_EXACT_SOURCE=PASS'
      - name: Pinned Go version
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.23.12'
          cache: false
      - name: Exactly one full tagged Windows Go regression
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference='Stop'
          $log=Join-Path $env:RUNNER_TEMP 'c74f3-full-regression.log'
          & go test -mod=readonly -tags=ktrade_full -count=1 -timeout=12m ./... *> $log
          if($LASTEXITCODE -ne 0){
            Get-Content -LiteralPath $log | Where-Object {
              $_ -match '^# ktrade/' -or $_ -match '^--- FAIL: Test' -or $_ -match '^FAIL\s' -or
              $_ -match '^.*_test\.go:[0-9]+:'
            } | Select-Object -First 45 | ForEach-Object {Write-Host $_}
            throw 'R25_C74F3_ONE_FULL_REGRESSION_FAILED'
          }
          Write-Host 'R25_C74F3_ONE_FULL_WINDOWS_REGRESSION=PASS'
      - name: Original application complete tagged vet
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference='Stop'
          & go vet -mod=readonly -tags=ktrade_full ./...
          if($LASTEXITCODE -ne 0){throw 'R25_C74F3_FULL_VET_FAILED'}
          Write-Host 'R25_C74F3_FULL_GO_VET=PASS'
      - name: Build isolated original operator executable and assets
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference='Stop'
          $out=Join-Path $env:RUNNER_TEMP 'c74f3-isolated-original-app'
          if(Test-Path -LiteralPath $out){throw 'R25_C74F3_ARTIFACT_OUTPUT_ALREADY_EXISTS'}
          New-Item -ItemType Directory -Path $out | Out-Null
          & go build -mod=readonly -tags=ktrade_full -o (Join-Path $out 'ktrade.exe') ./cmd/ktrade
          if($LASTEXITCODE -ne 0){throw 'R25_C74F3_WINDOWS_EXECUTABLE_BUILD_FAILED'}
          foreach($folder in @('static','templates','strategies','recovery')){
            Copy-Item -LiteralPath $folder -Destination $out -Recurse -ErrorAction Stop
          }
          foreach($name in @(
            'static/recovery_history.html',
            'recovery/operator-donor-v11110/strategy.html',
            'recovery/operator-donor-v11110/app.js',
            'recovery/operator-bridge/historical-review.js',
            'recovery/operator-bridge/operator-navigation-acceptance.js',
            'recovery/operator-bridge/operator-chart-navigation.js',
            'recovery/operator-bridge/operator-control-review.js'
          )){
            if(!(Test-Path -LiteralPath (Join-Path $out $name) -PathType Leaf)){
              throw 'R25_C74F3_ORIGINAL_UI_ASSET_MISSING'
            }
          }
          Write-Host 'R25_C74F3_ISOLATED_EXE_AND_ORIGINAL_UI=PASS'
      - name: Actual Chromium original chart navigation and blocked trading controls
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference='Stop'
          $env:KTRADE_R25C74D_APP_EXE=Join-Path (Join-Path $env:RUNNER_TEMP 'c74f3-isolated-original-app') 'ktrade.exe'
          & go test -mod=readonly -tags=ktrade_full -count=1 -timeout=6m -run '^TestR25C74DPackagedRealBrowserChartGestures$' ./cmd/ktrade
          if($LASTEXITCODE -ne 0){throw 'R25_C74F3_GENUINE_CHROMIUM_ORIGINAL_OPERATOR_FAILED'}
          Write-Host 'R25_C74F3_REAL_CHROMIUM_CHART_GESTURES=PASS'
          Write-Host 'R25_C74F3_OWNER_DATA_PRESENT=FALSE'
          Write-Host 'R25_C74F3_TRADE_START_STOP_SAVE_ACTIVATION=FALSE'
      - name: Verify original private source unchanged, release prohibited
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $src=Join-Path $env:GITHUB_WORKSPACE 'source'
          if(Test-Path -LiteralPath $src){
            if((& git -C $src rev-parse HEAD).Trim() -cne $env:SOURCE_SHA -or
               @(& git -C $src status --porcelain=v1 --untracked-files=no).Count -ne 0){
              throw 'R25_C74F3_PRIVATE_SOURCE_MUTATED'
            }
          }
          Write-Host 'R25_C74F3_NO_OWNER_PROFILE_COPY=PASS'
          Write-Host 'R25_C74F3_PRODUCT_PROMOTION_AND_BROKER_ACCESS=FALSE'
