name: KTRADE donor TradeGuard isolated paper shadow
on:
  push:
    branches: [qualification/ktrade-original-risk-custody-20261017]
    paths: [.github/workflows/ktrade-tradeguard-paper-shadow.yml]
permissions:
  contents: read
jobs:
  shadow:
    if: github.repository == 'spoonman136668-ai/Qualification-Forge' && github.actor == 'spoonman136668-ai'
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      EXPECTED_KTRADE: '493836a4b07ffad77558067a9686afc5022d5ca6'
      EXPECTED_TREE: '9d37ac65e2b454b37452eb329fb7cbcd02941f4b'
      EXPECTED_DONOR: '520cfe124fdd7e8dcbf16b6a6f38229b43db7dbc'
      EXPECTED_RISK_BLOB: '8469df654777548266448d1bf02192e780c8ebad'
      EXPECTED_PAPER_BLOB: 'd44341253e7d4b51d31b03cea26a77cbbb534f7b'
      EXPECTED_PROPOSAL_BLOB: 'b0c41b3bb69a51ef1528b52aa33245a11c4d0d3e'
      EXPECTED_PROPOSAL_TEST_BLOB: '12d2a8004e46cb3922314a1eb8eff265999d4d0f'
      EXPECTED_RECONCILE_BLOB: '3719c8fd65962f5573bd86f0948d758439db4333'
      EXPECTED_RECONCILE_TEST_BLOB: '4e02b1a44a69a94bcb45f266e4952461e8b7df11'
      EXPECTED_REPLAY_SOURCE: '5c0b07ace7dc7789d4aa8d20f0661dd9eee92dac'
      EXPECTED_REPLAY_DONOR_TEST: 'b865d7963c59fa55bc8e7a23032f392f3d788a44'
      EXPECTED_SETTLEMENT_SOURCE: '09de943e8a95834790bc8f7803bdf261a9dce844'
      EXPECTED_SETTLEMENT_TEST: '81d537e6547ade66b1bae024880170d106b9b38e'
      EXPECTED_CUSTODY_SOURCE: 'f834dd7f61e9ce1f4c4b6ff181778dd732dba30e'
      EXPECTED_CUSTODY_DONOR_TEST: '04314e5aa7ea2c575ade83ddc3f9e0c46e6843e4'
      KTRADE_CI_PAPER_ONLY: '1'
      KTRADE_CI_COINBASE_ALLOWED: '0'
      KTRADE_CI_LIVE_AUTHORITY: '0'
      KTRADE_CI_PROMOTION_ALLOWED: '0'
      KTRADE_USE_LEGACY_CDP_CONFIG: '0'
      GOFLAGS: '-p=2'
      GOMAXPROCS: '2'
      GOWORK: 'off'
    steps:
      - name: Checkout exact consolidated source
        uses: actions/checkout@v4
        with:
          repository: spoonman136668-ai/ktrade
          ref: 493836a4b07ffad77558067a9686afc5022d5ca6
          path: ktrade-private
          persist-credentials: false
          token: ${{ secrets.KTRADE_SOURCE_READ_TOKEN }}
      - name: Checkout authentic pinned donor for actual TradeGuard
        uses: actions/checkout@v4
        with:
          repository: spoonman136668-ai/ckb
          ref: 520cfe124fdd7e8dcbf16b6a6f38229b43db7dbc
          path: donor-private
          persist-credentials: false
          token: ${{ secrets.KTRADE_CKB_READ_TOKEN_TEMP }}
      - name: Go toolchain
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Verify original donor and recovery source birth before shadow test
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $ktrade=Join-Path $env:GITHUB_WORKSPACE 'ktrade-private'
          $donor=Join-Path $env:GITHUB_WORKSPACE 'donor-private'
          if($env:RUNNER_OS -cne 'Windows' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted'){throw 'KTRADE_WRONG_QUALIFICATION_RUNNER'}
          if($env:KTRADE_CI_LIVE_AUTHORITY -cne '0' -or $env:KTRADE_CI_COINBASE_ALLOWED -cne '0' -or $env:KTRADE_CI_PROMOTION_ALLOWED -cne '0'){throw 'KTRADE_LIVE_EXECUTION_NOT_AUTHORIZED'}
          if((& git -C $ktrade rev-parse HEAD).Trim() -cne $env:EXPECTED_KTRADE -or (& git -C $ktrade rev-parse 'HEAD^{tree}').Trim() -cne $env:EXPECTED_TREE){throw 'KTRADE_SOURCE_SHA_OR_TREE_DRIFT'}
          if((& git -C $donor rev-parse HEAD).Trim() -cne $env:EXPECTED_DONOR){throw 'KTRADE_AUTHENTIC_DONOR_COMMIT_DRIFT'}
          foreach($root in @($ktrade,$donor)){
            if((& git -C $root rev-parse HEAD:internal/papertrading/ledger.go).Trim() -cne $env:EXPECTED_PAPER_BLOB){throw 'KTRADE_PAPER_LEDGER_DONOR_SOURCE_DRIFT'}
          }
          if((& git -C $donor rev-parse HEAD:pkg/risk.go).Trim() -cne $env:EXPECTED_RISK_BLOB){throw 'KTRADE_TRADEGUARD_SOURCE_DRIFT'}
          if(Test-Path -LiteralPath (Join-Path $ktrade 'pkg/risk.go')){throw 'KTRADE_SHADOW_INCORRECTLY_SHIPPED_RISK_TO_APPLICATION'}
          if((& git -C $ktrade rev-parse HEAD:internal/paperproposal/proposal.go).Trim() -cne $env:EXPECTED_PROPOSAL_BLOB){throw 'KTRADE_PROPOSAL_SOURCE_BLOB_DRIFT'}
          if((& git -C $ktrade rev-parse HEAD:tests/donor-shadow/proposal_test.go).Trim() -cne $env:EXPECTED_PROPOSAL_TEST_BLOB){throw 'KTRADE_PROPOSAL_DONOR_TEST_BLOB_DRIFT'}
          if((& git -C $ktrade rev-parse HEAD:internal/paperreconcile/reconcile.go).Trim() -cne $env:EXPECTED_RECONCILE_BLOB){throw 'KTRADE_RECONCILE_SOURCE_BLOB_DRIFT'}
          if((& git -C $ktrade rev-parse HEAD:tests/donor-shadow/reconcile_test.go).Trim() -cne $env:EXPECTED_RECONCILE_TEST_BLOB){throw 'KTRADE_RECONCILE_DONOR_TEST_BLOB_DRIFT'}
          if((& git -C $ktrade rev-parse HEAD:internal/paperreconcile/risk_replay.go).Trim() -cne $env:EXPECTED_REPLAY_SOURCE){throw 'KTRADE_REPLAY_SOURCE_BLOB_DRIFT'}
          if((& git -C $ktrade rev-parse HEAD:tests/donor-shadow/risk_replay_test.go).Trim() -cne $env:EXPECTED_REPLAY_DONOR_TEST){throw 'KTRADE_REPLAY_DONOR_TEST_BLOB_DRIFT'}
          if((& git -C $ktrade rev-parse HEAD:internal/paperreconcile/settlement_review.go).Trim() -cne $env:EXPECTED_SETTLEMENT_SOURCE){throw 'KTRADE_SETTLEMENT_SOURCE_BLOB_DRIFT'}
          if((& git -C $ktrade rev-parse HEAD:tests/donor-shadow/settlement_review_test.go).Trim() -cne $env:EXPECTED_SETTLEMENT_TEST){throw 'KTRADE_SETTLEMENT_DONOR_TEST_BLOB_DRIFT'}
          if((& git -C $ktrade rev-parse HEAD:internal/paperreconcile/original_risk_custody.go).Trim() -cne $env:EXPECTED_CUSTODY_SOURCE){throw 'KTRADE_CUSTODY_SOURCE_BLOB_DRIFT'}
          if((& git -C $ktrade rev-parse HEAD:tests/donor-shadow/original_risk_custody_test.go).Trim() -cne $env:EXPECTED_CUSTODY_DONOR_TEST){throw 'KTRADE_CUSTODY_DONOR_TEST_BLOB_DRIFT'}
          Write-Output 'KTRADE_AUTHENTIC_RISK_CUSTODY_SOURCE_IDENTITY=PASS'
          Write-Output 'KTRADE_SETTLEMENT_EXACT_SOURCE=PASS'
          Write-Output 'KTRADE_RISK_REPLAY_EXACT_SOURCE=PASS'
          Write-Output 'KTRADE_RECONCILE_SOURCE_IDENTITY=PASS'
          Write-Output 'KTRADE_PROPOSAL_SOURCE_IDENTITY=PASS'
          Write-Output 'KTRADE_DONOR_TRADEGUARD_SOURCE_SHA=PASS'
          Write-Output 'KTRADE_PAPER_LEDGER_EXACT_SHARED_BLOB=PASS'
          Write-Output 'KTRADE_TRADEGUARD_SHADOW_HAS_NO_APPLICATION_EXECUTION_AUTHORITY=PASS'
      - name: Independently execute genuine donor TradeGuard beside TEMP paper ledger
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $ktrade=Join-Path $env:GITHUB_WORKSPACE 'ktrade-private'
          $donor=Join-Path $env:GITHUB_WORKSPACE 'donor-private'
          $scratch=Join-Path $donor 'internal/shadowqual'
          $proposalScratch=Join-Path $donor 'internal/paperproposal'
          $reconcileScratch=Join-Path $donor 'internal/paperreconcile'
          $log=Join-Path $env:RUNNER_TEMP 'ktrade-shadow-private-tests.log'
          try{
            New-Item -ItemType Directory -Path $scratch -Force|Out-Null
            New-Item -ItemType Directory -Path $proposalScratch -Force|Out-Null
            New-Item -ItemType Directory -Path $reconcileScratch -Force|Out-Null
            Copy-Item -LiteralPath (Join-Path $ktrade 'internal/paperreconcile/reconcile.go') -Destination (Join-Path $reconcileScratch 'reconcile.go') -Force
            Copy-Item -LiteralPath (Join-Path $ktrade 'internal/paperreconcile/reconcile_test.go') -Destination (Join-Path $reconcileScratch 'reconcile_test.go') -Force
            Copy-Item -LiteralPath (Join-Path $ktrade 'internal/paperreconcile/risk_replay.go') -Destination (Join-Path $reconcileScratch 'risk_replay.go') -Force
            Copy-Item -LiteralPath (Join-Path $ktrade 'internal/paperreconcile/risk_replay_test.go') -Destination (Join-Path $reconcileScratch 'risk_replay_test.go') -Force
            Copy-Item -LiteralPath (Join-Path $ktrade 'internal/paperreconcile/settlement_review.go') -Destination (Join-Path $reconcileScratch 'settlement_review.go') -Force
            Copy-Item -LiteralPath (Join-Path $ktrade 'internal/paperreconcile/settlement_review_test.go') -Destination (Join-Path $reconcileScratch 'settlement_review_test.go') -Force
            Copy-Item -LiteralPath (Join-Path $ktrade 'internal/paperreconcile/original_risk_custody.go') -Destination (Join-Path $reconcileScratch 'original_risk_custody.go') -Force
            Copy-Item -LiteralPath (Join-Path $ktrade 'internal/paperproposal/proposal.go') -Destination (Join-Path $proposalScratch 'proposal.go') -Force
            Copy-Item -LiteralPath (Join-Path $ktrade 'tests/donor-shadow/shadow_test.go') -Destination (Join-Path $scratch 'shadow_test.go') -Force
            Copy-Item -LiteralPath (Join-Path $ktrade 'tests/donor-shadow/proposal_test.go') -Destination (Join-Path $scratch 'proposal_test.go') -Force
            Copy-Item -LiteralPath (Join-Path $ktrade 'tests/donor-shadow/reconcile_test.go') -Destination (Join-Path $scratch 'reconcile_test.go') -Force
            Copy-Item -LiteralPath (Join-Path $ktrade 'tests/donor-shadow/risk_replay_test.go') -Destination (Join-Path $scratch 'risk_replay_test.go') -Force
            Copy-Item -LiteralPath (Join-Path $ktrade 'tests/donor-shadow/settlement_review_test.go') -Destination (Join-Path $scratch 'settlement_review_test.go') -Force
            Copy-Item -LiteralPath (Join-Path $ktrade 'tests/donor-shadow/original_risk_custody_test.go') -Destination (Join-Path $scratch 'original_risk_custody_test.go') -Force
            Push-Location $donor
            try{
              & go mod download *> $log
              if($LASTEXITCODE -ne 0){throw 'KTRADE_DONOR_DEPENDENCIES_FAILED'}
              & go test -mod=readonly -tags=ktrade_donor_shadow -count=1 -timeout=300s ./internal/shadowqual *> $log
              if($LASTEXITCODE -ne 0){
                # Only compile diagnostics and test identities are permitted.
                # Never print private source, test payloads, credentials, or the full log.
                $safe=@(Get-Content -LiteralPath $log -ErrorAction SilentlyContinue | Where-Object {
                  $_ -match '^# ktrade/' -or
                  $_ -match '^[^ ]+\.go:[0-9]+:[0-9]+: ' -or
                  $_ -match '^--- FAIL: Test[A-Za-z0-9_./-]+' -or
                  $_ -match '^FAIL[[:space:]]'
                } | Select-Object -First 12)
                foreach($line in $safe){
                  $line=$line -replace [regex]::Escape($env:GITHUB_WORKSPACE),'[private]'
                  Write-Output "KTRADE_SANITIZED_FAILURE: $line"
                }
                throw 'KTRADE_ACTUAL_DONOR_TRADEGUARD_SHADOW_TEST_FAILED_PRIVATE_OUTPUT_WITHHELD'
              }
            }finally{Pop-Location}
            Write-Output 'KTRADE_AUTHENTIC_DONOR_TRADEGUARD_SHADOW_PROPOSED_BUY_RETRY=PASS'
            Write-Output 'KTRADE_SHADOW_POLICY_VETO_PAPER_STILL_FILLS_NEGATIVE=PASS'
            Write-Output 'KTRADE_SHADOW_KILL_RESTART_DISAGREEMENT_NEGATIVE=PASS'
            Write-Output 'KTRADE_DONOR_PRODUCT_EXPOSURE_PAPER_IDENTITY_GAP=CONFIRMED'
            Push-Location $ktrade
            try{
              & go test -mod=readonly -count=1 ./internal/paperproposal ./internal/paperreconcile ./internal/papertrading ./internal/paperweb *> $log
              if($LASTEXITCODE -ne 0){throw 'KTRADE_CONSOLIDATED_PAPER_BASELINE_REGRESSED'}
              & node --test tests/paper_tradeguard_reconciliation.test.cjs *> $log
              if($LASTEXITCODE -ne 0){throw 'KTRADE_PAPER_SHADOW_BOUNDARY_REGRESSED'}
            }finally{Pop-Location}
            Write-Output 'KTRADE_CONSOLIDATED_PAPER_UNMODIFIED_GO_AND_JS_GATES=PASS'
            Write-Output 'KTRADE_AUTHENTIC_DONOR_RATE_PNL_EQUITY_EXPOSURE_AND_KILL_CUSTODY_WINDOWS=PASS'
          }finally{
            Remove-Item -LiteralPath $log -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $scratch -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $proposalScratch -Recurse -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $reconcileScratch -Recurse -Force -ErrorAction SilentlyContinue
          }
      - name: Confidential checkout cleanup without upload
        if: always()
        shell: pwsh
        run: |
          foreach($name in @('ktrade-private','donor-private')){
            Remove-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE $name) -Recurse -Force -ErrorAction SilentlyContinue
          }
          Write-Output 'KTRADE_PRIVATE_SOURCE_PUBLISHED=FALSE'
          Write-Output 'KTRADE_REAL_USER_DATA_TOUCHED=FALSE'
          Write-Output 'KTRADE_PRODUCTION_OR_LIVE_TRADE=FALSE'
