name: KTRADE Pine donor source evidence DIC-10
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ktrade-dic10-pine-donor-evidence.yml

permissions:
  contents: read

jobs:
  qualify:
    if: github.repository == 'spoonman136668-ai/Qualification-Forge'
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      KTRADE_EXPECTED_SOURCE_SHA: 'dfb13f8974feda48b20c8c2c7c8ac09c4339f1c0'
      KTRADE_CI_SOURCE_ONLY: '1'
      KTRADE_CI_PAPER_ONLY: '1'
      KTRADE_CI_LIVE_AUTHORITY: '0'
      KTRADE_CI_COINBASE_ALLOWED: '0'
      KTRADE_CI_PROMOTION_ALLOWED: '0'
      GOFLAGS: '-p=2'
      GOMAXPROCS: '2'
    steps:
      - name: Require disposable hosted Windows no-authority worker
        shell: pwsh
        run: |
          if($env:RUNNER_OS -cne 'Windows' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted'){throw 'DIC10_NOT_HOSTED_WINDOWS'}
          Write-Host 'DIC10_HOSTED_WINDOWS=PASS'
      - name: Checkout frozen existing private Pine donor without modifying its branch
        uses: actions/checkout@v4
        with:
          repository: spoonman136668-ai/ckb
          ref: ${{ env.KTRADE_EXPECTED_SOURCE_SHA }}
          path: donor-private
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.KTRADE_CKB_READ_TOKEN_TEMP }}
      - name: Go setup no public cache
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Focused cross-lineage Pine source checks and one full regression
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $private=Join-Path $env:RUNNER_TEMP 'dic10-private-pine-tests.log'
          Push-Location (Join-Path $env:GITHUB_WORKSPACE 'donor-private')
          try{
            $sha=(& git rev-parse HEAD).Trim()
            if($LASTEXITCODE -ne 0 -or $sha -cne $env:KTRADE_EXPECTED_SOURCE_SHA){throw 'DIC10_SOURCE_IDENTITY_DRIFT'}
            Write-Host 'DIC10_DONOR_IDENTITY=PASS'
            function Check([string]$name,[string]$program,[string[]]$arguments){
              try{& $program @arguments *> $private;if($LASTEXITCODE -ne 0){throw 'nonzero'}}
              catch{throw ('DIC10_'+$name+'_PRIVATE_FAILURE')}
              Write-Host ('DIC10_'+$name+'=PASS')
            }
            Check 'R12_RUNTIME_WIRING' 'go' @('test','-count=1','-timeout=180s','.','-run','^TestKTRADERecoveryR12')
            Check 'R13_MANAGEMENT_AND_FAVORITES' 'go' @('test','-count=1','-timeout=180s','./pkg','-run','^TestKTRADERecoveryR13')
            Check 'PINE_UPDATER_PORTABILITY' 'go' @('test','-count=1','-timeout=180s','./internal/durableupgrade','-run','^TestPineLibrary')
            Check 'FULL_REGRESSION' 'go' @('test','-count=1','-timeout=420s','./...')
            Check 'VET' 'go' @('vet','./...')
            Check 'GO_BUILD' 'go' @('build','./...')
            Check 'FOUR_WINDOWS_EXES' 'cmd.exe' @('/d','/c','RUN-BUILD-WINDOWS.cmd')
            if((& git rev-parse HEAD).Trim() -cne $env:KTRADE_EXPECTED_SOURCE_SHA){throw 'DIC10_SOURCE_CHANGED'}
            if(@(& git status --porcelain=v1 --untracked-files=no).Count -ne 0){throw 'DIC10_TRACKED_SOURCE_CHANGED'}
            Write-Host 'DIC10_DONOR_UNCHANGED=PASS'
            Write-Host 'DIC10_NO_INSTALLED_OR_LIVE_PARITY_CLAIM=PASS'
          }finally{
            Pop-Location
            Remove-Item -LiteralPath $private -Force -ErrorAction SilentlyContinue
          }
      - name: Purge read-only private donor and upload no artifacts
        if: always()
        shell: pwsh
        run: |
          $p=Join-Path $env:GITHUB_WORKSPACE 'donor-private'
          if(Test-Path -LiteralPath $p){Remove-Item -LiteralPath $p -Recurse -Force -ErrorAction SilentlyContinue}
          Write-Host 'DIC10_PUBLIC_PRIVATE_ARTIFACT_UPLOAD=DISABLED'
