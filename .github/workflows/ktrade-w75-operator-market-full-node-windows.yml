name: KTRADE W75 complete original operator market safety Node Windows regression
on:
  push:
    branches: [qualification/ktrade-w75-operator-market-full-node-regression-20261030]
    paths: [.github/workflows/ktrade-w75-operator-market-full-node-windows.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: ktrade-w75-original-operator-market-suite-20261030
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      GIT_TERMINAL_PROMPT: '0'
      KTRADE_LIVE_TRADING: 'false'
    steps:
      - name: Checkout exact independent W75 witness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: witness
          persist-credentials: false
      - name: Checkout W74 accepted exact Windows installed foundation
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: abc7c154e320e34797912f951dea415ae0992fa6
          path: accepted
          persist-credentials: false
      - name: Checkout exact original W73 whole-product source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: spoonman136668-ai/ktrade
          ref: 7dfec71777730f744e1749b8bd741fbd01f0d2f6
          path: product
          persist-credentials: false
          token: ${{ secrets.KTRADE_SOURCE_READ_TOKEN }}
      - name: Validate original candidate identity, W74 acceptance reuse and LIVE disarm
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows'){throw 'W75_EPHEMERAL_WINDOWS_ONLY'}
          $root=$env:GITHUB_WORKSPACE
          foreach($pair in @(
             @('witness',$env:GITHUB_SHA),
             @('accepted','abc7c154e320e34797912f951dea415ae0992fa6'),
             @('product','7dfec71777730f744e1749b8bd741fbd01f0d2f6')
          )){
            $p=Join-Path $root $pair[0]
            $head=(& git -C $p rev-parse HEAD).Trim()
            if($LASTEXITCODE -ne 0 -or $head -cne $pair[1]){throw 'W75_SOURCE_SHA_DRIFT'}
            if(@(& git -C $p status --porcelain).Count -ne 0){throw 'W75_SOURCE_DIRTY'}
          }
          $src=Join-Path $root 'product'
          $tree=(& git -C $src rev-parse 'HEAD^{tree}').Trim()
          if($tree -cne '666239a1893a17b8e7984d2b28fbd3b23c7c15cf'){throw 'W75_W73_TREE_DRIFT'}
          $p=Join-Path $root 'accepted/qualification-receipts/ktrade-w74-final-installed-native-fourth-sell-windows-20261030.json'
          if((& git hash-object $p).Trim() -cne '71ace41011b02341592d45dc2db343ca481e4f12'){throw 'W75_ORIGINAL_W74_RECEIPT_BLOB_DRIFT'}
          $receipt=Get-Content -LiteralPath $p -Raw|ConvertFrom-Json
          if($receipt.verdict -cne 'PASS_SCOPED_INSTALLED_W31_TO_W73_TO_W31_AND_P10_QUARANTINE' -or
             $receipt.candidate_sha -cne '7dfec71777730f744e1749b8bd741fbd01f0d2f6' -or
             $receipt.candidate_tree -cne $tree -or $receipt.exact_workflow_witness_sha -cne '3d55dab1c52c1bbf296cbc279601fd4748c7f245' -or
             $receipt.run_id -ne 41048262607 -or $receipt.run_conclusion -cne 'success' -or
             !$receipt.named_test.actual_pass){throw 'W75_ORIGINAL_W74_WITNESS_NOT_ACCEPTED'}
          $broker=Get-Content -LiteralPath (Join-Path $src 'pkg/advanced_orders.go') -Raw
          if($broker -notmatch 'func liveBrokerageAuthorized\(\) bool \{ return false \}'){throw 'W75_ORIGINAL_LIVE_BROKER_ENABLED'}
          if(Test-Path -LiteralPath (Join-Path $src '.env')){throw 'W75_PRODUCT_WORKSPACE_DOTENV_PRESENT'}
          if(@(& git -C $src ls-files '.env' '*/.env').Count -ne 0){throw 'W75_TRACKED_DOTENV'}
          $cfg=Get-Content -LiteralPath (Join-Path $src 'config.json') -Raw|ConvertFrom-Json
          if($cfg.api_key.key_name -or $cfg.api_key.key_secret -or $cfg.account_id -or $cfg.ngrok_authtoken){throw 'W75_TRACKED_CONFIG_SECRETS'}
          Write-Host '::notice::W75_W73_EXACT_TREE_W74_ACCEPTED_BLOB_AND_LIVE_DISARMED=PASS'
      - name: Node 24 actual original operator and market suite
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Execute every original checked-in Node test with required coverage
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $src=Join-Path $env:GITHUB_WORKSPACE 'product'
          Push-Location $src
          try{
            $tests=@(Get-ChildItem -LiteralPath (Join-Path $src 'tests') -Filter '*.test.cjs' -File |
               Sort-Object Name | ForEach-Object { 'tests/'+$_.Name })
            if($tests.Count -lt 25){throw 'W75_NODE_TEST_FILE_COVERAGE_BELOW_FROZEN_MINIMUM'}
            $required=@(
             'tests/w17d9_market_context.test.cjs',
             'tests/w21_market_readout_integrity.test.cjs',
             'tests/w19_paper_failure_feedback.test.cjs',
             'tests/rb3_w33a_operator_paper_state.test.cjs',
             'tests/rb3_w39_paper_operator_accessibility.test.cjs',
             'tests/rb3_w32b_pine_compile.test.cjs',
             'tests/rb3_w32c_pine_renderer.test.cjs',
             'tests/rb3_w32d_pine_pane.test.cjs',
             'tests/w17d1a_original_chart_uia.test.cjs',
             'tests/w17d1_chart_favorite_continuity.test.cjs',
             'tests/w33c_p7_paper_valuation.test.cjs',
             'tests/paper_tradeguard_reconciliation.test.cjs',
             'tests/historical_pine_editor_chart_wiring.test.cjs',
             'tests/wails_w02_boot.test.cjs'
            )
            foreach($name in $required){if($tests -cnotcontains $name){throw ('W75_REQUIRED_TEST_PATH_MISSING_'+$name)}}
            Write-Host ('W75_ALL_ORIGINAL_NODE_TEST_FILES_DISCOVERED='+$tests.Count)
            & node --version
            if($LASTEXITCODE -ne 0){throw 'W75_NODE_NOT_AVAILABLE'}
            $tap=@(& node --test --test-reporter=tap @tests)
            $testExit=$LASTEXITCODE
            $tap|ForEach-Object { Write-Host $_ }
            if($testExit -ne 0){throw 'W75_ORIGINAL_NODE_TEST_SUITE_FAILED'}
            $summary=@($tap|Where-Object {$_ -match '^# tests (\d+)$'})
            $pass=@($tap|Where-Object {$_ -match '^# pass (\d+)$'})
            $failed=@($tap|Where-Object {$_ -match '^# fail 0$'})
            $skipped=@($tap|Where-Object {$_ -match '^# skipped 0$'})
            $cancelled=@($tap|Where-Object {$_ -match '^# cancelled 0$'})
            if($summary.Count -ne 1 -or $pass.Count -ne 1 -or $failed.Count -ne 1 -or
               $skipped.Count -ne 1 -or $cancelled.Count -ne 1){throw 'W75_NODE_TAP_SUMMARY_UNVERIFIED'}
            $n=[int]([regex]::Match($summary[0],'\d+$').Value)
            $ok=[int]([regex]::Match($pass[0],'\d+$').Value)
            if($n -lt $tests.Count -or $ok -ne $n){throw 'W75_NODE_CASES_NOT_ALL_EXECUTED'}
            Write-Host ('::notice::W75_ALL_ORIGINAL_OPERATOR_MARKET_PINE_SECURITY_NODE_CASES=PASS files='+$tests.Count+' cases='+$n)
          }finally{Pop-Location}
      - name: Assert read-only scoped acceptance identity and no production side effects
        if: always()
        shell: pwsh
        run: |
          $src=Join-Path $env:GITHUB_WORKSPACE 'product'
          if((& git -C $src rev-parse HEAD).Trim() -cne '7dfec71777730f744e1749b8bd741fbd01f0d2f6'){throw 'W75_FINAL_PRODUCT_SOURCE_DRIFT'}
          if(@(& git -C $src status --porcelain --untracked-files=no).Count -ne 0){throw 'W75_FINAL_TRACKED_PRODUCT_MUTATION'}
          Write-Host '::notice::W75_NO_OWNER_PROFILE_NO_BROKER_NO_TRADE_NO_LIVE_NO_MERGE_NO_RELEASE'
