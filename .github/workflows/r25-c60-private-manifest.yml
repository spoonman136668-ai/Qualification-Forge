name: R25-C60 private receipt admission on hosted Windows synthetic fixtures
on:
  push:
    branches: [qualification/r25-c60-manifest-admission-20261019]
    paths: [.github/workflows/r25-c60-private-manifest.yml]
permissions:
  contents: read
concurrency:
  group: r25-c60-private-manifest-review
  cancel-in-progress: false
jobs:
  admission:
    if: github.repository == 'spoonman136668-ai/Qualification-Forge'
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      SOURCE: 'cfbc8b279d5672fb87d2bc5fea63e26b3c18e1df'
      TREE: '719ba2eb787c9d9c4b1ace0e69f861171199eb25'
      BASE: '3dd0c45f0e480af02f4d5f746c8d0ca7eccbbab6'
      GOFLAGS: '-p=2'
      GOMAXPROCS: '2'
      KTRADE_CI_PAPER_ONLY: '1'
      KTRADE_CI_LIVE_AUTHORITY: '0'
      KTRADE_CI_COINBASE_ALLOWED: '0'
      KTRADE_CI_PROMOTION_ALLOWED: '0'
    steps:
      - name: Refuse local runners and unsafe modes
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_OS -cne 'Windows' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or
              $env:KTRADE_CI_PAPER_ONLY -cne '1' -or $env:KTRADE_CI_LIVE_AUTHORITY -cne '0' -or
              $env:KTRADE_CI_COINBASE_ALLOWED -cne '0' -or $env:KTRADE_CI_PROMOTION_ALLOWED -cne '0') {
            throw 'R25_C60_RUNNER_OR_AUTHORITY_DRIFT'
          }
          Write-Host 'R25_C60_GITHUB_HOSTED_WINDOWS=PASS'
      - name: Checkout pinned KTRADE source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: spoonman136668-ai/ktrade
          ref: cfbc8b279d5672fb87d2bc5fea63e26b3c18e1df
          fetch-depth: 0
          persist-credentials: false
          path: source
          token: ${{ secrets.KTRADE_SOURCE_READ_TOKEN }}
      - name: Authenticate exact three-file delta and unchanged R25-C59
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference='Stop'
          if ((& git rev-parse HEAD).Trim() -cne $env:SOURCE -or
              (& git rev-parse 'HEAD^{tree}').Trim() -cne $env:TREE -or
              @(& git status --porcelain=v1 --untracked-files=no).Count -ne 0) {
            throw 'R25_C60_SOURCE_OR_TREE_DRIFT'
          }
          $expected=@(
            'internal/durableupgrade/selected_custody_admission.go',
            'internal/durableupgrade/selected_custody_admission_test.go',
            'cmd/ktrade-custody-review/main.go'
          ) | Sort-Object
          $actual=@(& git diff --name-only $env:BASE $env:SOURCE | Sort-Object)
          if ($actual.Count -ne 3 -or @(Compare-Object $expected $actual).Count -ne 0) {
            throw 'R25_C60_THREE_FILE_SCOPE_DRIFT'
          }
          foreach($f in @(
             'internal/durableupgrade/durable_upgrade.go',
             'internal/durableupgrade/selected_recovery_portability.go',
             'internal/durableupgrade/selected_recovery_portability_test.go'
          )){
            if ((& git rev-parse ($env:BASE+':'+$f)).Trim() -cne
                (& git rev-parse ($env:SOURCE+':'+$f)).Trim()) {
              throw 'R25_C60_EXISTING_PORTABLE_POLICY_DRIFT'
            }
          }
          Write-Host 'R25_C60_EXACT_SOURCE_AND_THREE_FILE_DELTA=PASS'
          Write-Host 'R25_C60_EXISTING_PORTABLE_CLASSIFIER_UNCHANGED=PASS'
      - name: Frozen Windows Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.23.12'
          cache: false
      - name: Test synthetic receipt semantics and build local-only CLI
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference='Stop'
          $private=Join-Path $env:RUNNER_TEMP 'r25c60-test-output-private.log'
          & go test -mod=readonly -count=1 -run '^TestR25C60' ./internal/durableupgrade *> $private
          if ($LASTEXITCODE -ne 0){throw 'R25_C60_FOCUSED_TEST_FAILED_PRIVATE_OUTPUT_WITHHELD'}
          & go vet -mod=readonly ./internal/durableupgrade ./cmd/ktrade-custody-review *> $private
          if ($LASTEXITCODE -ne 0){throw 'R25_C60_VET_FAILED_PRIVATE_OUTPUT_WITHHELD'}
          & go build -mod=readonly -o (Join-Path $env:RUNNER_TEMP 'r25c60.exe') ./cmd/ktrade-custody-review *> $private
          if ($LASTEXITCODE -ne 0){throw 'R25_C60_CLI_BUILD_FAILED_PRIVATE_OUTPUT_WITHHELD'}
          Write-Host 'R25_C60_SYNTHETIC_RECEIPT_TAMPER_MATRIX=PASS'
          Write-Host 'R25_C60_FOCUSED_TEST_VET_BUILD=PASS'
      - name: Exercise bounded CLI with synthetic 695-file manifest only
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $sandbox=Join-Path ([IO.Path]::GetTempPath()) ('ktrade-r25c60-synthetic-'+$env:GITHUB_RUN_ID)
          if(Test-Path -LiteralPath $sandbox){throw 'R25_C60_SYNTHETIC_TEMP_COLLISION'}
          $null=New-Item -ItemType Directory -Path $sandbox
          try{
            $paths=[Collections.Generic.List[string]]::new()
            for($i=0;$i -lt 552;$i++){[void]$paths.Add(('Application/data/browser/synthetic-{0:d3}.dat' -f $i))}
            for($i=0;$i -lt 137;$i++){[void]$paths.Add(('Application/data/history/synthetic-{0:d3}.dat' -f $i))}
            foreach($p in @(
              'Application/INSTALLATION_IDENTITY.json','Application/MANIFEST.sha256',
              'Application/data/config.json','Application/data/trading_pairs.json',
              'Application/data/tradeguard-risk-continuity.json',
              'Application/data/broker-order-observations.json')){[void]$paths.Add($p)}
            if($paths.Count -ne 695){throw 'R25_C60_SYNTHETIC_ENTRY_COUNT'}
            $entries=[Collections.Generic.List[object]]::new()
            foreach($p in $paths){
              $entries.Add(@{path=$p; bytes=1; sha256=('a'*64);last_write_utc='2026-10-19T00:00:00.1234567Z'})
            }
            $entries[$entries.Count-1].bytes=[long](164194320-($entries.Count-1))
            $m=@{
              schema='ktrade.r25-c47.selected-user-data-snapshot.v1'
              application_version='1.5.7'
              source='CKB/Application'
              copied_file_count=695
              copied_bytes=164194320
              excluded_directories=@('CKB/Application/data/logs','CKB/Application/data/runtime')
              excluded_application_executables=$true
              complete_historical_preservation=$false
              migration_authorized=$false
              source_files=$entries.ToArray()
            }
            $manifest=Join-Path $sandbox 'R25-C47-private-manifest.json'
            [IO.File]::WriteAllText($manifest,($m|ConvertTo-Json -Depth 8 -Compress),[Text.UTF8Encoding]::new($false))
            $hash=(Get-FileHash -LiteralPath $manifest -Algorithm SHA256).Hash.ToLowerInvariant()
            $r=@{
              schema='ktrade.r25-c47.selected-receipt.v1'
              source_inventory_files=708; source_inventory_bytes=197522226
              snapshot_file_count=695; snapshot_bytes=164194320
              manifest_sha256=$hash
              snapshot_sha256_file_verification='PASS'
              scope='selected Application/data files excluding logs and runtime, plus identity sidecars'
              complete_historical_preservation=$false
              isolated_restore_verified=$false
              migration_authorized=$false
              release_authorized=$false
            }
            [IO.File]::WriteAllText(
              (Join-Path $sandbox 'R25-C47-receipt.json'),
              ($r|ConvertTo-Json -Depth 5 -Compress),
              [Text.UTF8Encoding]::new($false)
            )
            $exe=Join-Path $env:RUNNER_TEMP 'r25c60.exe'
            $output=@(& $exe --mode synthetic --root $sandbox --app-stopped)
            if($LASTEXITCODE -ne 0 -or $output.Count -lt 4){throw 'R25_C60_SYNTHETIC_CLI_REJECTED'}
            $summary=$output[0]|ConvertFrom-Json
            if($summary.selected_files -ne 695 -or $summary.selected_bytes -ne 164194320 -or
               $summary.portability.browser_files -ne 552 -or
               $summary.portability.identity_sidecar_files -ne 2 -or
               $summary.migration_authorized -or $summary.installed_account_recovery_verified -or
               !$summary.snapshot_manifest_receipt_match){
              throw 'R25_C60_SYNTHETIC_CLI_OUTPUT_DRIFT'
            }
            Write-Host 'R25_C60_END_TO_END_SYNTHETIC_MANIFEST_CLI=PASS'
            Write-Host 'R25_C60_PRIVATE_FILENAMES_EXPORTED=FALSE'
            Write-Host 'R25_C60_REAL_USER_CONTENTS_READ=FALSE'
            Write-Host 'R25_C60_OWNER_CONTEXT_ADMITTED=FALSE'
            Write-Host 'R25_C60_APPLICATION_RESTART_VERIFIED=FALSE'
            Write-Host 'R25_C60_MIGRATION_AUTHORIZED=FALSE'
            Write-Host 'R25_C60_RELEASE_AUTHORIZED=FALSE'
          }finally{
            if(Test-Path -LiteralPath $sandbox){
              Remove-Item -LiteralPath $sandbox -Force -Recurse -ErrorAction Stop
            }
          }
      - name: Verify tracked source unchanged and no private artifacts
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $source=Join-Path $env:GITHUB_WORKSPACE 'source'
          if(Test-Path -LiteralPath $source -PathType Container){
            Push-Location $source
            try{
              if((& git rev-parse HEAD).Trim() -cne $env:SOURCE -or
                 @(& git status --porcelain=v1 --untracked-files=no).Count -ne 0) {
                throw 'R25_C60_TRACKED_SOURCE_CHANGED'
              }
            }finally{Pop-Location}
          }
          $log=Join-Path $env:RUNNER_TEMP 'r25c60-test-output-private.log'
          if(Test-Path -LiteralPath $log){Remove-Item -LiteralPath $log -Force}
          Write-Host 'R25_C60_SOURCE_TRACKED_FILES_UNCHANGED=PASS'
          Write-Host 'R25_C60_WORKSTATION_RUNNER_USED=FALSE'
          Write-Host 'R25_C60_RESEARCH_RUNNER_USED=FALSE'
          Write-Host 'R25_C60_PRIVATE_ARTIFACT_UPLOAD=FALSE'
