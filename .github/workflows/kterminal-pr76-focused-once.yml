name: K-Terminal PR76 single-use pinned focused Windows qualification

# One isolated branch-push only. No dispatch and no promotion.
on:
  push:
    branches:
      - qualification/kt-pr76-focused-once-20261027
    paths:
      - '.github/workflows/kterminal-pr76-focused-once.yml'

permissions:
  contents: read

jobs:
  focused:
    if: >-
      github.repository == 'spoonman136668-ai/Qualification-Forge' &&
      github.actor == 'spoonman136668-ai' &&
      github.ref == 'refs/heads/qualification/kt-pr76-focused-once-20261027'
    runs-on: windows-2022
    timeout-minutes: 12
    env:
      EXPECTED_SHA: '5fdf19a6f8a02cc61b6b38bf4eace7fe13cddfcf'
      KTERMINAL_READ_TOKEN: ${{ secrets.KTERMINAL_READ_TOKEN }}
      PYTHONDONTWRITEBYTECODE: '1'
      KTERMINAL_LIVE_AUTHORITY: '0'
      KTERMINAL_BROKER_ACCESS: '0'
      KTERMINAL_PROMOTION: '0'
    steps:
      - name: Verify trusted ephemeral Windows and private-read access
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows') { throw 'KTERMINAL_WRONG_RUNNER' }
          if ([string]::IsNullOrWhiteSpace($env:KTERMINAL_READ_TOKEN)) { throw 'KTERMINAL_READ_SECRET_MISSING' }
          $headers = @{ Accept='application/vnd.github+json'; Authorization=('Bearer ' + $env:KTERMINAL_READ_TOKEN) }
          try {
            $data = Invoke-RestMethod -Method Get -Uri ('https://api.github.com/repos/Kboomllc/K-Terminal/commits/' + $env:EXPECTED_SHA) -Headers $headers -TimeoutSec 25
            if ($data.sha -cne $env:EXPECTED_SHA) { throw 'SHA_DRIFT' }
          } catch {
            throw 'KTERMINAL_READ_PROBE_FAILED_PRIVATE_DETAILS_WITHHELD'
          } finally {
            Remove-Variable headers,data -ErrorAction SilentlyContinue
          }
          Write-Host 'KTERMINAL_PRIVATE_PINNED_READ=PASS'

      - name: Checkout immutable private K-Terminal candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: Kboomllc/K-Terminal
          ref: '5fdf19a6f8a02cc61b6b38bf4eace7fe13cddfcf'
          token: ${{ secrets.KTERMINAL_READ_TOKEN }}
          path: private-checkout
          persist-credentials: false
          fetch-depth: 1

      - name: Run exact-head ICE and Graphify validator and focused tests privately
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'private-checkout'
          $log = Join-Path $env:RUNNER_TEMP 'kterminal-focused.log'
          Push-Location $source
          try {
            if ((& git rev-parse HEAD).Trim() -cne $env:EXPECTED_SHA) { throw 'KTERMINAL_HEAD_MISMATCH' }
            if (@(& git status --porcelain --untracked-files=all).Count -ne 0) { throw 'KTERMINAL_INITIAL_DIRTY' }
            & python -B tools/source_intake/validate_intake.py --root . --sha $env:EXPECTED_SHA *> $log
            if ($LASTEXITCODE -ne 0) { throw 'KTERMINAL_ICE_GRAPHIFY_PREFLIGHT_FAILED_WITHHELD' }
            Write-Host 'KTERMINAL_ICE_GRAPHIFY_PREFLIGHT=PASS'
            & python -B -m unittest discover -s tools/source_intake -p test_validate_intake.py -v *> $log
            if ($LASTEXITCODE -ne 0) { throw 'KTERMINAL_11_FOCUSED_TESTS_FAILED_WITHHELD' }
            Write-Host 'KTERMINAL_11_FOCUSED_TESTS=PASS'
            if (@(& git status --porcelain --untracked-files=all).Count -ne 0) { throw 'KTERMINAL_SOURCE_MUTATED' }
            if ((& git rev-parse HEAD).Trim() -cne $env:EXPECTED_SHA) { throw 'KTERMINAL_FINAL_SHA_DRIFT' }
            Write-Host ('KTERMINAL_FOCUSED_WINDOWS=PASS EXACT_SHA=' + $env:EXPECTED_SHA)
            Write-Host 'KTERMINAL_FULL_APP_REGRESSION=NOT_EXECUTED'
            Write-Host 'KTERMINAL_LIVE_TRADING=NOT_EXECUTED'
          } finally {
            Pop-Location
            Remove-Item -LiteralPath $log -Force -ErrorAction SilentlyContinue
          }

      - name: Remove private checkout from ephemeral Windows workspace
        if: always()
        shell: pwsh
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE 'private-checkout'
          if (Test-Path -LiteralPath $source) {
            Remove-Item -LiteralPath $source -Recurse -Force -ErrorAction SilentlyContinue
          }
          Write-Host 'KTERMINAL_PRIVATE_SOURCE_ARTIFACTS=NONE'
