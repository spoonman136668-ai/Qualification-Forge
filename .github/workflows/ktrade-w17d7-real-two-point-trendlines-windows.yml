            function Get-W17D1AAccessibleButton([object]$process,[string]$name) {
              $process.Refresh()
              if($process.HasExited -or $process.MainWindowHandle -eq [IntPtr]::Zero){return $null}
              $root=[System.Windows.Automation.AutomationElement]::FromHandle($process.MainWindowHandle)
              if($null -eq $root){return $null}
              $all=$root.FindAll([System.Windows.Automation.TreeScope]::Descendants,
                [System.Windows.Automation.Condition]::TrueCondition)
              for($i=0;$i -lt [Math]::Min($all.Count,6500);$i++){
                try {
                  $e=$all.Item($i)
                  if($e.Current.IsOffscreen -eq $false -and
                    $e.Current.ControlType -eq [System.Windows.Automation.ControlType]::Button -and
                    $e.Current.Name -ceq $name){return $e}
                } catch {}
              }
              return $null
            }
            function Wait-W17D1AButton([object]$process,[string]$name,[int]$seconds=18) {
              $deadline=(Get-Date).AddSeconds($seconds)
