name: KTRADE W17D7 original chart two-click trendlines cold Windows
on:
  push:
    branches: [qualification/ktrade-w17d7-real-two-point-trendlines-20261025]
    paths: [.github/workflows/ktrade-w17d7-real-two-point-trendlines-windows.yml]
permissions:
  contents: read
concurrency:
  group: ktrade-w17d7-native-chart-two-click-trendlines
  cancel-in-progress: false
jobs:
  qualify:
    name: Native original chart two-point trendline create, cold restore, delete
    if: github.repository == 'spoonman136668-ai/Qualification-Forge'
    runs-on: windows-2022
    timeout-minutes: 75
    env:
      CGO_ENABLED: '1'
      GOWORK: 'off'
      GOFLAGS: '-p=2'
      GOMAXPROCS: '2'
      KTRADE_RECOVERY_ISOLATED: '1'
      KTRADE_PORTABLE_DISARMED: '0'
      KTRADE_WAILS_OWNED: '0'
      KTRADE_USE_LEGACY_CDP_CONFIG: '0'
      KTRADE_PAPER_SESSION_ROOT: ''
      KTRADE_PAPER_CUSTODY_REVIEW_ROOT: ''
    steps:
      - name: Checkout immutable qualification witness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: witness
          persist-credentials: false
      - name: Checkout immutable private source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: spoonman136668-ai/ktrade
          ref: 896bc22e87e3748b706399ff02386499f557b304
          path: checked-private
          fetch-depth: 10
          persist-credentials: false
          token: ${{ secrets.KTRADE_SOURCE_READ_TOKEN }}
      - name: Verify immutable W17D7 source and exact four-path delta
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $src=Join-Path $env:GITHUB_WORKSPACE 'checked-private'
          $wit=Join-Path $env:GITHUB_WORKSPACE 'witness'
          if($env:RUNNER_OS -cne 'Windows' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted'){throw 'W17D4_HOSTED_WINDOWS_REQUIRED'}
          $head=(& git -C $src rev-parse HEAD).Trim()
          $tree=(& git -C $src rev-parse 'HEAD^{tree}').Trim()
          $witness=(& git -C $wit rev-parse HEAD).Trim()
          if($LASTEXITCODE -ne 0 -or $head -cne '896bc22e87e3748b706399ff02386499f557b304' -or
             $tree -cne '38dd15ee2153a5213fd675ebadab4db929f875a3' -or $witness -cne $env:GITHUB_SHA){throw 'W17D7_SOURCE_OR_WITNESS_DRIFT'}
          $actual=@(& git -C $src diff --name-only 4bd4217b2870f3e9eebbabc6fe99aa09ea099fe6 HEAD | Sort-Object)
          $expected=@('static/w17d7_trendlines.js','templates/chart.tmpl',
                      'tests/w17d7_original_trendlines.test.cjs',
                      'tests/w17d6_chart_horizontal_lines.test.cjs') | Sort-Object
          if($LASTEXITCODE -ne 0 -or ($actual -join '|') -cne ($expected -join '|')){
            throw 'W17D7_THREE_FILE_BOUNDARY_DRIFT'
          }
          if(@(& git -C $src status --porcelain=v1 --untracked-files=no).Count -ne 0){throw 'W17D7_DIRTY_SOURCE'}
          Write-Output '::notice::W17D7_IMMUTABLE_HEAD_TREE_AND_FOUR_FILE_DELTA=PASS'
      - name: Native Windows Go 1.25 and Node 24
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: false
      - name: Set up Node 24 for frontend contract tests
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require exact existing W17C6 green Windows regression witness
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $response=Invoke-RestMethod -Uri 'https://api.github.com/repos/spoonman136668-ai/Qualification-Forge/actions/runs/40214120059' -Headers @{
            Authorization='Bearer '+$env:GITHUB_TOKEN
            Accept='application/vnd.github+json'
            'X-GitHub-Api-Version'='2022-11-28'
          }
          if($response.conclusion -cne 'success' -or $response.status -cne 'completed' -or
             $response.head_sha -cne 'aaee1ed5d3bc74d4202f9b7e8b65353bd7da6154'){
            throw 'W17D0_W17C6_ORIGINAL_FULL_WINDOWS_ACCEPTANCE_NOT_REUSABLE'
          }
          Write-Output '::notice::W17D0_W17C6_EXACT_SHA_REGRESSION_REUSED=PASS'
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Reuse unchanged W17D0 exact full Go and Wails qualification
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $run=Invoke-RestMethod -Uri 'https://api.github.com/repos/spoonman136668-ai/Qualification-Forge/actions/runs/40226971742' -Headers @{
            Authorization='Bearer '+$env:GITHUB_TOKEN
            Accept='application/vnd.github+json'
          }
          if($run.status -cne 'completed' -or $run.conclusion -cne 'success' -or
            $run.head_sha -cne '895619630ca9cbc695518afbe91ebeafcdb3f0a5'){
            throw 'W17D1_UNCHANGED_GO_WAILS_NATIVE_EVIDENCE_NOT_REUSABLE'
          }
          $jobs=Invoke-RestMethod -Uri 'https://api.github.com/repos/spoonman136668-ai/Qualification-Forge/actions/runs/40226971742/jobs?per_page=100' -Headers @{
            Authorization='Bearer '+$env:GITHUB_TOKEN
            Accept='application/vnd.github+json'
          }
          foreach($name in @('W17D0 focused Go and Wails safety tests',
              'One full original Go Windows regression',
              'Verify Go modules and build original engine and actual Wails shell',
              'Real Wails desktop hosted Windows synthetic restored preview rehearsal')){
            $step=@($jobs.jobs[0].steps|Where-Object{$_.name -eq $name})
            if($step.Count -ne 1 -or $step[0].conclusion -cne 'success'){
              throw ('W17D1_UNCHANGED_GO_REGRESSION_NOT_REUSABLE_'+$name)
            }
          }
          Write-Output '::notice::W17D1_GO_AND_WAILS_NATIVE_FULL_EVIDENCE=REUSED_EXACT_TREE'
      - name: Test original chart favorite storage with bounded collision veto
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Push-Location (Join-Path $env:GITHUB_WORKSPACE 'checked-private')
          try{
            & node --test tests/w17d1_chart_favorite_continuity.test.cjs tests/w17d1a_original_chart_uia.test.cjs tests/w17d2_legacy_favorite_import.test.cjs tests/w17d3_old_origin_fixture.test.cjs tests/w17d4_chart_timeframe_continuity.test.cjs tests/w17d5_chart_pane_layout.test.cjs tests/w17d6_chart_horizontal_lines.test.cjs tests/w17d7_original_trendlines.test.cjs
            if($LASTEXITCODE -ne 0){throw 'W17D1_CHART_BROWSER_STORAGE_FOCUSED_RED'}
            Write-Output '::notice::W17D3_OLD_WEBVIEW2_SOURCE_UI_AND_NO_CLOBBER_CONTRACTS=PASS'
          }finally{Pop-Location}
      - name: Reuse unchanged W17D3 backend evidence with exact source-only delta
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $r=Invoke-RestMethod -Uri 'https://api.github.com/repos/spoonman136668-ai/Qualification-Forge/actions/runs/40235573427' -Headers @{
            Authorization='Bearer '+$env:GITHUB_TOKEN
            Accept='application/vnd.github+json'
          }
          if($r.status -cne 'completed' -or $r.conclusion -cne 'success' -or
             $r.head_sha -cne '280444a435b329b18e3bea7b1621d75813b70c7c'){throw 'W17D4_PREVIOUS_W17D3_PROOF_UNAVAILABLE'}
          Write-Output '::notice::W17D4_UNCHANGED_NATIVE_BACKEND_EVIDENCE_REUSED=PASS'
      - name: Reuse immutable W17D4 completed real native Windows qualification
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $r=Invoke-RestMethod -Uri 'https://api.github.com/repos/spoonman136668-ai/Qualification-Forge/actions/runs/40241232019' -Headers @{
            Authorization='Bearer '+$env:GITHUB_TOKEN
            Accept='application/vnd.github+json'
          }
          if($r.status -cne 'completed' -or $r.conclusion -cne 'success' -or
             $r.head_sha -cne 'cea9c16efd100cb483372890f81d704f72ea0e8b'){
            throw 'W17D5_W17D4_EXACT_WINDOWS_WITNESS_NOT_REUSABLE'
          }
          Write-Output '::notice::W17D5_W17D4_EXACT_NATIVE_WAILS_SOURCE_EVIDENCE=REUSED'
      - name: Reuse immutable W17D5 real Windows three-launch qualification
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $r=Invoke-RestMethod -Uri 'https://api.github.com/repos/spoonman136668-ai/Qualification-Forge/actions/runs/40242145574' -Headers @{
            Authorization='Bearer '+$env:GITHUB_TOKEN
            Accept='application/vnd.github+json'
          }
          if($r.status -cne 'completed' -or $r.conclusion -cne 'success' -or
             $r.head_sha -cne 'b101ac30e56d70e7683e0ef497ae209103fb8d38'){
            throw 'W17D6_W17D5_EXACT_WINDOWS_WITNESS_NOT_REUSABLE'
          }
          Write-Output '::notice::W17D6_W17D5_UNCHANGED_NATIVE_WINDOWS_FOUNDATION_REUSED=PASS'
      - name: Reuse W17D6 exact-hosted-native-Wails qualification
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $r=Invoke-RestMethod -Uri 'https://api.github.com/repos/spoonman136668-ai/Qualification-Forge/actions/runs/40244101689' -Headers @{
            Authorization='Bearer '+$env:GITHUB_TOKEN
            Accept='application/vnd.github+json'
          }
          if($r.status -cne 'completed' -or $r.conclusion -cne 'success' -or
             $r.head_sha -cne '3af5b4123e3473c6971360a81ca699f27a7355f5'){
            throw 'W17D7_W17D6_EXACT_NATIVE_WAILS_QUALIFICATION_MISSING'
          }
          Write-Output '::notice::W17D7_W17D6_EXACT_NATIVE_WAILS_FOUNDATION=PASS'
      - name: Verify Go modules and build original engine and actual Wails shell
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $env:TEMP=$env:RUNNER_TEMP;$env:TMP=$env:RUNNER_TEMP
          $src=Join-Path $env:GITHUB_WORKSPACE 'checked-private'
          $dir=Join-Path $env:RUNNER_TEMP 'w17c6-build'
          New-Item -ItemType Directory -Path $dir -Force|Out-Null
          $log=Join-Path $env:RUNNER_TEMP 'w17c6-build.log'
          Push-Location $src
          try {
            & go vet -mod=readonly ./... *> $log
            if($LASTEXITCODE -ne 0){throw 'W17C6_GO_VET_FAILED'}
            & go build -mod=readonly -tags ktrade_full -o (Join-Path $dir 'ktrade-engine.exe') ./cmd/ktrade *> $log
            if($LASTEXITCODE -ne 0){throw 'W17C6_ORIGINAL_ENGINE_BUILD_FAILED'}
            & npm ci --ignore-scripts --no-audit --no-fund --silent *> $log
            if($LASTEXITCODE -ne 0){throw 'W17C6_OFFLINE_VENDOR_INSTALL_FAILED'}
            & node scripts/stage_offline_vendor.cjs *> $log
            if($LASTEXITCODE -ne 0){throw 'W17C6_OFFLINE_VENDOR_STAGING_FAILED'}
            foreach($part in @('static','templates','strategies')){
              Copy-Item -LiteralPath (Join-Path $src $part) -Destination (Join-Path $dir $part) -Recurse -Force
            }
            Write-Output '::notice::W17C6_ORIGINAL_ENGINE_AND_OFFLINE_EDITOR_ASSETS=PASS'
          } finally {Pop-Location}
          Push-Location (Join-Path $src 'tools/wails-pilot')
          try {
            & go mod verify *> $log
            if($LASTEXITCODE -ne 0){throw 'W17C6_WAILS_GO_MODULES_FAILED'}
            & go vet -mod=readonly ./... *> $log
            if($LASTEXITCODE -ne 0){throw 'W17C6_WAILS_GO_VET_FAILED'}
            & go build -mod=readonly -tags desktop,production -ldflags '-H windowsgui' -o (Join-Path $dir 'ktrade.exe') . *> $log
            if($LASTEXITCODE -ne 0){throw 'W17C6_WAILS_NATIVE_WINDOWS_BUILD_FAILED'}
            & go build -mod=readonly -tags desktop,production -ldflags '-H windowsgui' -o (Join-Path $dir 'w17d3-old-webview2.exe') ./cmd/w17d3-legacy-seed *> $log
            if($LASTEXITCODE -ne 0){throw 'W17D3_GENUINE_OLD_WEBVIEW2_SEEDER_BUILD_FAILED'}
            Write-Output '::notice::W17D3_REAL_WAILS_WEBVIEW2_SEEDER_NATIVE_WINDOWS_BUILD=PASS'
          } finally {Pop-Location}
          Write-Output '::notice::W17C6_WINDOWS_GO_VET_WAILS_NATIVE_BUILD=PASS'
      - name: Real Wails desktop hosted Windows synthetic restored preview rehearsal
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          $env:TEMP=$env:RUNNER_TEMP;$env:TMP=$env:RUNNER_TEMP
          $src=Join-Path $env:GITHUB_WORKSPACE 'checked-private'
          $build=Join-Path $env:RUNNER_TEMP 'w17c6-build'
          $nonce=[Guid]::NewGuid().ToString('N').ToLowerInvariant()
          $root=Join-Path $env:RUNNER_TEMP ('ktrade-w06-install-'+$nonce)
          $rel=Join-Path $root 'releases\v1'
          $data=Join-Path $root 'app-data'
          $preview=Join-Path $data 'w17c6-restored-preview'
          $parent=$null
          $child=@()
          $http=$null
          $legacyServer=$null
          $legacySeeder=$null
          # No WebView2 debugger or script injection. Original chart control
          # must appear as a native Windows accessibility Button.
          try{
            New-Item -ItemType Directory -Path $rel,$data -Force|Out-Null
            foreach($name in @('ktrade.exe','ktrade-engine.exe','static','templates','strategies')){
              Copy-Item -LiteralPath (Join-Path $build $name) -Destination (Join-Path $rel $name) -Recurse -Force
            }
            $wh=(Get-FileHash -LiteralPath (Join-Path $rel 'ktrade.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
            $eh=(Get-FileHash -LiteralPath (Join-Path $rel 'ktrade-engine.exe') -Algorithm SHA256).Hash.ToLowerInvariant()
            function Write-Proof([string]$p,[object]$obj){
              if(Test-Path -LiteralPath $p){throw 'W17C6_EXISTING_PROOF'}
              $raw=($obj|ConvertTo-Json -Depth 12 -Compress)+[Environment]::NewLine
              [IO.File]::WriteAllText($p,$raw,[Text.UTF8Encoding]::new($false))
            }
            Write-Proof (Join-Path $rel 'w06-readonly-release.json') ([ordered]@{
              schema='ktrade.wails.w06.synthetic-readonly-release.v1'; install_id=$nonce;version='v1'
              wails_exe_sha256=$wh;engine_exe_sha256=$eh;live_armed=$false;paper_orders_enabled=$false
            })
            Write-Proof (Join-Path $data 'w06-readonly-data.json') ([ordered]@{
              schema='ktrade.wails.w06.synthetic-readonly-data.v1';install_id=$nonce;generation=1
              live_armed=$false;paper_orders_enabled=$false
            })
            New-Item -ItemType Directory -Path $preview -Force|Out-Null
            Write-Proof (Join-Path $preview 'config.json') ([ordered]@{paper_only=$true;chart=@{theme='dark'}})
            Write-Proof (Join-Path $preview 'trading_pairs.json') ([ordered]@{pairs=@('BTC-USDC')})
            $v5='aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa';$v6='bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb'
            $r5='cccccccccccccccccccccccccccccccc';$r6='dddddddddddddddddddddddddddddddd'
            $index=[ordered]@{schema_version=1;scripts=@{}}
            $index.scripts[$v5]=@{metadata=@{id=$v5;display_name='Restored Pine v5';kind='indicator'
              ownership='user';favorite=$true};revision=$r5}
            $index.scripts[$v6]=@{metadata=@{id=$v6;display_name='Restored Pine v6';kind='strategy'
              ownership='user';favorite=$false};revision=$r6}
            $library=Join-Path $preview 'pine-library'
            New-Item -ItemType Directory -Path $library -Force|Out-Null
            Write-Proof (Join-Path $library 'index.json') $index
            foreach($pair in @(@($r5,'5'),@($r6,'6'))){
              $folder=Join-Path $library ('revisions\'+$pair[0])
              New-Item -ItemType Directory -Path $folder -Force|Out-Null
              [IO.File]::WriteAllText((Join-Path $folder 'source.pine'),
                ('//@version='+$pair[1]+"`nplot(close)"),[Text.UTF8Encoding]::new($false))
            }
            Push-Location (Join-Path $src 'tools/wails-pilot')
            try{
              $digest=@(& go run -mod=readonly ./cmd/w17c6-preview-digest $preview)
              if($LASTEXITCODE -ne 0 -or $digest.Count -ne 1 -or $digest[0] -cnotmatch '^[a-f0-9]{64}$'){
                throw 'W17C6_PREVIEW_DIGEST_STAMP_FAILED'
              }
            }finally{Pop-Location}
            Write-Proof (Join-Path $data 'w17c6-restored-preview-proof.json') ([ordered]@{
              schema='ktrade.w17c6.synthetic-wails-restored-preview.v1';install_id=$nonce
              source_full_sha256=('1'*64);preview_sha256=$digest[0]
              live_armed=$false;paper_orders_enabled=$false
            })
            # Explicit synthetic original-port receipt, not a user profile.
            $probe=[System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback,0)
            $probe.Start()
            $legacyPort=([System.Net.IPEndPoint]$probe.LocalEndpoint).Port
            $probe.Stop()
            Write-Proof (Join-Path $data 'w17d2-legacy-favorites-origin.json') ([ordered]@{
              schema='ktrade.w17d2.w06.synthetic-old-origin.v1'
              install_id=$nonce
              legacy_port=$legacyPort
              source_full_sha256=('a'*64)
              live_armed=$false
              paper_orders_enabled=$false
            })
            Write-Output '::notice::W17D2_SYNTHETIC_EXPLICIT_OLD_ORIGIN_CREATED=PASS'

            # W17D3: prove a real, populated OLD Chromium origin using native
            # Wails v2 and the exact same verified W06 WebView2 user-data path.
            # The page's localStorage.setItem runs ONLY after a real UIA click
            # on its visible "Save historical RSI favorite" button.
            $oldURL='http://127.0.0.1:'+$legacyPort+'/seed-old-favorite'
            $legacyLog=Join-Path $env:RUNNER_TEMP 'w17d3-old-http.stdout.log'
            $legacyErr=Join-Path $env:RUNNER_TEMP 'w17d3-old-http.stderr.log'
            $node=(Get-Command node).Source
            $legacyServer=Start-Process -FilePath $node -ArgumentList @(
              (Join-Path $src 'tests/w17d3_prior_origin_http.cjs'),[string]$legacyPort
            ) -WorkingDirectory $src -RedirectStandardOutput $legacyLog -RedirectStandardError $legacyErr -PassThru
            $deadline=(Get-Date).AddSeconds(20)
            while((Get-Date) -lt $deadline){
              if($legacyServer.HasExited){throw 'W17D3_GENUINE_OLD_PORT_SERVER_EXITED'}
              try{
                $r=Invoke-WebRequest -Uri $oldURL -TimeoutSec 2
                if([int]$r.StatusCode -eq 200){break}
              }catch{}
              Start-Sleep -Milliseconds 200
            }
            if(-not $r -or [int]$r.StatusCode -ne 200){throw 'W17D3_REAL_OLD_ORIGIN_NOT_SERVED'}
            $legacySeeder=Start-Process -FilePath (Join-Path $build 'w17d3-old-webview2.exe') -ArgumentList @($rel,$oldURL) -WorkingDirectory $rel -PassThru
            $deadline=(Get-Date).AddSeconds(35)
            $seedWindow=$false
            while((Get-Date) -lt $deadline){
              $legacySeeder.Refresh()
              if($legacySeeder.HasExited){throw 'W17D3_REAL_WAILS_WEBVIEW2_SEEDER_EXITED'}
              if($legacySeeder.MainWindowHandle -ne [IntPtr]::Zero){$seedWindow=$true;break}
              Start-Sleep -Milliseconds 300
            }
            if(-not $seedWindow){throw 'W17D3_OLD_WEBVIEW2_SEED_WINDOW_NOT_VISIBLE'}
            Add-Type -AssemblyName UIAutomationClient -ErrorAction Stop
            Add-Type -AssemblyName System.Windows.Forms -ErrorAction Stop
            $w17d3Mouse=@(
              'using System;',
              'using System.Runtime.InteropServices;',
              'public static class W17D3Mouse {',
              ' [DllImport("user32.dll")] public static extern bool SetForegroundWindow(IntPtr hWnd);',
              ' [DllImport("user32.dll")] public static extern IntPtr GetForegroundWindow();',
              ' [DllImport("user32.dll")] public static extern bool SetCursorPos(int x,int y);',
              ' [DllImport("user32.dll")] public static extern void mouse_event(uint flags,uint dx,uint dy,uint data,UIntPtr info);',
              '}'
            ) -join [Environment]::NewLine
            Add-Type -TypeDefinition $w17d3Mouse -ErrorAction Stop
            function Find-W17D3Node([string]$name,[string]$type,[object]$process) {
              $process.Refresh()
              if($process.HasExited -or $process.MainWindowHandle -eq [IntPtr]::Zero){return $null}
              $rootEl=[System.Windows.Automation.AutomationElement]::FromHandle($process.MainWindowHandle)
              $all=$rootEl.FindAll([System.Windows.Automation.TreeScope]::Descendants,[System.Windows.Automation.Condition]::TrueCondition)
              for($i=0;$i -lt [Math]::Min($all.Count,5000);$i++){
                try{
                  $e=$all.Item($i)
                  if(-not $e.Current.IsOffscreen -and $e.Current.Name -ceq $name -and
                    ($type -eq '' -or $e.Current.ControlType.ProgrammaticName -eq $type)){return $e}
                }catch{}
              }
              return $null
            }
            $seedButton=$null
            $deadline=(Get-Date).AddSeconds(30)
            while((Get-Date) -lt $deadline){
              $seedButton=Find-W17D3Node 'Save historical RSI favorite' 'ControlType.Button' $legacySeeder
              if($seedButton){break}
              Start-Sleep -Milliseconds 350
            }
            if(-not $seedButton){throw 'W17D3_ACTUAL_OLD_WEBVIEW2_BUTTON_NOT_ACCESSIBLE'}
            try{
              $invoke=$seedButton.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern)
              $invoke.Invoke()
            }catch{
              # Physical mouse event at the exact identified UIA button.
              $rect=$seedButton.Current.BoundingRectangle
              $win=[System.Windows.Automation.AutomationElement]::FromHandle($legacySeeder.MainWindowHandle).Current.BoundingRectangle
              if($rect.IsEmpty -or $rect.Width -lt 16 -or $rect.Height -lt 16 -or
                $rect.Left -lt $win.Left -or $rect.Top -lt $win.Top -or
                $rect.Right -gt $win.Right -or $rect.Bottom -gt $win.Bottom){
                throw 'W17D3_OLD_ORIGIN_BUTTON_OUTSIDE_WAILS_WINDOW'
              }
              $x=[int]($rect.Left+$rect.Width/2);$y=[int]($rect.Top+$rect.Height/2)
              if(-not [W17D3Mouse]::SetForegroundWindow($legacySeeder.MainWindowHandle)){
                throw 'W17D3_OLD_SEEDER_NOT_FOREGROUND'
              }
              Start-Sleep -Milliseconds 200
              if([W17D3Mouse]::GetForegroundWindow() -ne $legacySeeder.MainWindowHandle){
                throw 'W17D3_FOREIGN_WINDOW_REFUSED'
              }
              if(-not [W17D3Mouse]::SetCursorPos($x,$y)){throw 'W17D3_OLD_WEBVIEW_MOUSE_REFUSED'}
              [W17D3Mouse]::mouse_event(0x0002,0,0,0,[UIntPtr]::Zero)
              [W17D3Mouse]::mouse_event(0x0004,0,0,0,[UIntPtr]::Zero)
            }
            $saved=$null
            $deadline=(Get-Date).AddSeconds(20)
            while((Get-Date) -lt $deadline){
              $saved=Find-W17D3Node 'Historical RSI favorite saved in genuine WebView2' '' $legacySeeder
              if($saved){break}
              Start-Sleep -Milliseconds 350
            }
            if(-not $saved){throw 'W17D3_REAL_OLD_BROWSER_LOCALSTORAGE_CLICK_NOT_CONFIRMED'}
            Write-Output '::notice::W17D3_REAL_OLD_PORT_WEBVIEW2_FAVORITE_CLICKED_AND_STORED=PASS'
