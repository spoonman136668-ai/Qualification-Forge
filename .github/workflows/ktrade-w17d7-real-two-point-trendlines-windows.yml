                $found=Get-W17D1AAccessibleButton $process $name
                if($null -ne $found){return $found}
                Start-Sleep -Milliseconds 350
              } while((Get-Date) -lt $deadline)
              # Report metadata only from this synthetic fixture, no
              # browser profile, storage keys, trading actions or credentials.
              $root=[System.Windows.Automation.AutomationElement]::FromHandle($process.MainWindowHandle)
              $all=$root.FindAll([System.Windows.Automation.TreeScope]::Descendants,
                [System.Windows.Automation.Condition]::TrueCondition)
              $sample=@()
              for($i=0;$i -lt [Math]::Min($all.Count,3500);$i++){
                try{
                  $e=$all.Item($i)
                  $n=$e.Current.Name
                  if($n -and $n -match '^(Indicators|Technicals|Add Relative Strength Index|Remove Relative Strength Index)' -and
                    $sample.Count -lt 8){$sample+=($e.Current.ControlType.ProgrammaticName+':'+$n)}
                }catch{}
              }
              Write-Output ('::warning::W17D1A_NATIVE_UIA_VISIBLE_BUTTON_MISSING='+$name+' NODE_COUNT='+$all.Count+
                ' MATCHING_SYNTHETIC_LABELS='+($sample -join ','))
              throw 'W17D1A_ORIGINAL_WEBVIEW2_CHART_ACCESSIBILITY_NOT_EXPOSED'
            }
            function Invoke-W17D1AButton([object]$element,[string]$description,[object]$process) {
              try{
                $pattern=$element.GetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern)
                $pattern.Invoke()
                return
              }catch{
                # Native WebView2 can expose HTML buttons to accessibility
                # without supporting InvokePattern on every nested iframe.
                # The fallback is an actual user keyboard action on the
                # precisely identified, visible and focusable UIA control.
                if($description -ceq 'ORIGINAL_FAVORITE_STAR' -and
                   $null -ne (Get-W17D1AAccessibleButton $process 'Remove Relative Strength Index from favorites')){
                  return
                }
                try{
                  if($element.Current.IsOffscreen -or -not $element.Current.IsKeyboardFocusable){
                    throw 'UIA_TARGET_NOT_KEYBOARD_FOCUSABLE'
                  }
                  $element.SetFocus()
                  [System.Windows.Forms.SendKeys]::SendWait(' ')
                  Start-Sleep -Milliseconds 150
                  Write-Output ('::notice::W17D1A_REAL_UIA_FOCUSED_KEYBOARD_BUTTON='+$description)
                  if($description -ceq 'ORIGINAL_FAVORITE_STAR' -and
                     $null -eq (Get-W17D1AAccessibleButton $process 'Remove Relative Strength Index from favorites')){
                    # The exact native UIA browser button is visible but
                    # WebView2 did not accept either InvokePattern or SPACE.
                    # Fall back to a *real Windows mouse* at its bounded
                    # UIA rectangle, never DOM eval, JavaScript or storage
                    # mutation. The following asserted state still decides.
                    $rect=$element.Current.BoundingRectangle
                    $outer=[System.Windows.Automation.AutomationElement]::FromHandle(
                      $process.MainWindowHandle).Current.BoundingRectangle
                    if($rect.IsEmpty -or $rect.Width -lt 10 -or $rect.Height -lt 10 -or
                       $rect.Width -gt 160 -or $rect.Height -gt 160 -or
                       $rect.Left -lt $outer.Left -or $rect.Top -lt $outer.Top -or
                       $rect.Right -gt $outer.Right -or $rect.Bottom -gt $outer.Bottom){
                       throw 'W17D1A_MOUSE_CLICK_OUTSIDE_ORIGINAL_UIA_BUTTON'
                    }
                    $x=[int]($rect.Left+$rect.Width/2)
                    $y=[int]($rect.Top+$rect.Height/2)
                    if(-not [W17D1ANativeClick]::SetForegroundWindow($process.MainWindowHandle)){
                       throw 'W17D1A_DISPOSABLE_WAILS_NOT_FOREGROUND'
                    }
                    Start-Sleep -Milliseconds 120
                    if([W17D1ANativeClick]::GetForegroundWindow() -ne $process.MainWindowHandle){
                       throw 'W17D1A_FOREIGN_WINDOWS_WINDOW_REFUSED'
                    }
                    if(-not [W17D1ANativeClick]::SetCursorPos($x,$y)){
                       throw 'W17D1A_NATIVE_POINTER_TARGET_REFUSED'
                    }
                    [W17D1ANativeClick]::mouse_event(0x0002,0,0,0,[UIntPtr]::Zero)
                    [W17D1ANativeClick]::mouse_event(0x0004,0,0,0,[UIntPtr]::Zero)
                    Start-Sleep -Milliseconds 300
                    Write-Output '::notice::W17D1A_NATIVE_WAILS_EXACT_UIA_BUTTON_MOUSE_ACTIVATION=EXECUTED'
                  }
                }catch{
                  throw ('W17D1A_NATIVE_BUTTON_INVOKE_AND_KEYBOARD_NOT_SUPPORTED_'+$description)
                }
              }
            }
