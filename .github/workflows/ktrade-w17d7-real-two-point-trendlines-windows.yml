                }
              }
              Write-Output ('::notice::W17D6_NATIVE_SAVED_ORIGINAL_LINE_PRESENT_'+$exists+'=PASS')
            }
            function W17D6OpenDrawingEditor([object]$process) {
              Click-W17D6Button $process 'Horizontal Line'
              if($null -eq (Wait-W17D1AButton $process 'Save horizontal line')){
                throw 'W17D6_ORIGINAL_CHART_DRAWING_EDITOR_NOT_VISIBLE'
              }
            }
            function W17D6CreateLine([object]$process) {
              W17D6OpenDrawingEditor $process
              $rootEl=[System.Windows.Automation.AutomationElement]::FromHandle(
                 $process.MainWindowHandle)
              $nodes=$rootEl.FindAll([System.Windows.Automation.TreeScope]::Descendants,
                [System.Windows.Automation.Condition]::TrueCondition)
              $edit=$null
              for($i=0;$i -lt [Math]::Min($nodes.Count,6500);$i++){
                try{
                  $el=$nodes.Item($i)
                  if(-not $el.Current.IsOffscreen -and
                     $el.Current.ControlType -eq [System.Windows.Automation.ControlType]::Edit -and
                     $el.Current.Name -ceq 'Horizontal line price'){$edit=$el;break}
                }catch{}
              }
              if(!$edit){throw 'W17D6_REAL_PRICE_EDIT_NOT_EXPOSED'}
              if(!$edit.Current.IsKeyboardFocusable){throw 'W17D6_PRICE_EDIT_NOT_FOCUSABLE'}
              if(-not [W17D1ANativeClick]::SetForegroundWindow($process.MainWindowHandle)){
                throw 'W17D6_WAILS_PRICE_ENTRY_FOREGROUND_REQUIRED'
              }
              Start-Sleep -Milliseconds 150
              if([W17D1ANativeClick]::GetForegroundWindow() -ne $process.MainWindowHandle){
                throw 'W17D6_PRICE_ENTRY_FOREIGN_WINDOW_REFUSED'
              }
              $value=$edit.GetCurrentPattern([System.Windows.Automation.ValuePattern]::Pattern)
              if(-not $value.Current.IsReadOnly){
                # SetValue targets the real WebView2 accessible Edit control,
                # never JavaScript/DOM/localStorage injection.
                try{$value.SetValue('42500')}catch{}
              }
              if($value.Current.Value -cne '42500'){
                $edit.SetFocus()
                [System.Windows.Forms.SendKeys]::SendWait('^a')
                [System.Windows.Forms.SendKeys]::SendWait('42500')
                Start-Sleep -Milliseconds 250
              }
              if($value.Current.Value -cne '42500'){
                throw 'W17D6_NATIVE_PRICE_INPUT_NOT_CONFIRMED'
              }
              Write-Output '::notice::W17D6_REAL_NATIVE_WEBVIEW2_PRICE_EDIT_42500=PASS'
              Click-W17D6Button $process 'Save horizontal line'
              Assert-W17D6Drawing $process $true
              Write-Output '::notice::W17D6_GENUINE_ORIGINAL_CHART_PRICE_LINE_USER_CREATED=PASS'
            }
            # W17D7: actual original Wails Windows UIA price-chart click points.
            # Two native pointer events, no DOM, CDP, canvas JS or localStorage writes.
            function Click-W17D7Named([object]$process,[string]$name) {
              $button=Wait-W17D1AButton $process $name
              $r=$button.Current.BoundingRectangle
              $outer=[System.Windows.Automation.AutomationElement]::FromHandle(
                $process.MainWindowHandle).Current.BoundingRectangle
              $min=if($name -ceq 'Close trendlines'){4}else{12}
              $max=if($name -ceq 'Remove trendline 1'){450}else{250}
              if($r.IsEmpty -or $r.Width -lt $min -or $r.Height -lt $min -or
                 $r.Width -gt $max -or $r.Height -gt 125 -or
                 $r.Left -lt $outer.Left -or $r.Top -lt $outer.Top -or
                 $r.Right -gt $outer.Right -or $r.Bottom -gt $outer.Bottom){
                throw ('W17D7_NATIVE_BUTTON_OUTSIDE_WAILS_'+$name)
              }
              if(-not [W17D1ANativeClick]::SetForegroundWindow($process.MainWindowHandle)){
                throw 'W17D7_ORIGINAL_WAILS_FOREGROUND_REQUIRED'
              }
              Start-Sleep -Milliseconds 125
              if([W17D1ANativeClick]::GetForegroundWindow() -ne $process.MainWindowHandle){
                throw 'W17D7_FOREIGN_WINDOW_FOCUS_REFUSED'
              }
              if(-not [W17D1ANativeClick]::SetCursorPos(
                [int]($r.Left+$r.Width/2),[int]($r.Top+$r.Height/2))){
                throw 'W17D7_MOUSE_POINTER_REFUSED'
              }
              [W17D1ANativeClick]::mouse_event(0x0002,0,0,0,[UIntPtr]::Zero)
              [W17D1ANativeClick]::mouse_event(0x0004,0,0,0,[UIntPtr]::Zero)
              Start-Sleep -Milliseconds 260
            }
            function W17D7OpenManager([object]$process) {
              Click-W17D7Named $process 'Manage trendlines'
              if($null -eq (Wait-W17D1AButton $process 'Close trendlines')){
                throw 'W17D7_ORIGINAL_DRAWINGS_MODAL_NOT_VISIBLE'
              }
            }
            function W17D7CloseManager([object]$process) {
              Click-W17D7Named $process 'Close trendlines'
              Start-Sleep -Milliseconds 120
              if($null -ne (Get-W17D1AAccessibleButton $process 'Close trendlines')){
                throw 'W17D7_REAL_NATIVE_DRAWINGS_MANAGER_STILL_OPEN'
              }
            }
            function W17D7AssertLine([object]$process,[bool]$exists) {
              if($exists){
                if($null -eq (Wait-W17D1AButton $process 'Remove trendline 1')){
                  throw 'W17D7_SAVED_REAL_TRENDLINE_NOT_PRESENT'
                }
              } else {
                Start-Sleep -Milliseconds 250
                if($null -ne (Get-W17D1AAccessibleButton $process 'Remove trendline 1')){
                  throw 'W17D7_DELETED_TRENDLINE_WAS_RESTORED'
                }
              }
              Write-Output ('::notice::W17D7_REAL_ORIGINAL_CHART_TRENDLINE_PRESENT_'+$exists+'=PASS')
            }
            function W17D7DrawUsingOriginalPriceChart([object]$process) {
              Click-W17D7Named $process 'Trend Line'
              $root=[System.Windows.Automation.AutomationElement]::FromHandle(
                $process.MainWindowHandle)
              $nodes=$root.FindAll([System.Windows.Automation.TreeScope]::Descendants,
                [System.Windows.Automation.Condition]::TrueCondition)
              $surface=$null
              for($i=0;$i -lt [Math]::Min($nodes.Count,6500);$i++){
                try{
                  $el=$nodes.Item($i)
                  if(-not $el.Current.IsOffscreen -and
                     $el.Current.Name -ceq 'Price chart drawing surface'){
                    $surface=$el;break
                  }
                }catch{}
              }
              if($null -eq $surface){throw 'W17D7_REAL_CHART_DRAWING_SURFACE_NOT_EXPOSED'}
              $r=$surface.Current.BoundingRectangle
              $outer=$root.Current.BoundingRectangle
              if($r.IsEmpty -or $r.Width -lt 320 -or $r.Height -lt 150 -or
                 $r.Left -lt $outer.Left -or $r.Top -lt $outer.Top -or
                 $r.Right -gt $outer.Right -or $r.Bottom -gt $outer.Bottom){
                throw 'W17D7_REAL_CANDLE_SURFACE_OUTSIDE_ORIGINAL_WAILS'
              }
              if(-not [W17D1ANativeClick]::SetForegroundWindow($process.MainWindowHandle)){
                throw 'W17D7_WAILS_CHART_CLICK_NOT_FOREGROUND'
              }
              Start-Sleep -Milliseconds 150
              if([W17D1ANativeClick]::GetForegroundWindow() -ne $process.MainWindowHandle){
                throw 'W17D7_CHART_CLICK_FOREIGN_FOCUS'
              }
              foreach($at in @(@(0.34,0.36),@(0.66,0.60))){
                $x=[int]($r.Left+$r.Width*$at[0])
                $y=[int]($r.Top+$r.Height*$at[1])
                if(-not [W17D1ANativeClick]::SetCursorPos($x,$y)){
                  throw 'W17D7_PRICE_CHART_POINTER_REFUSED'
                }
                [W17D1ANativeClick]::mouse_event(0x0002,0,0,0,[UIntPtr]::Zero)
                [W17D1ANativeClick]::mouse_event(0x0004,0,0,0,[UIntPtr]::Zero)
                Start-Sleep -Milliseconds 350
              }
              W17D7OpenManager $process
              W17D7AssertLine $process $true
              Write-Output '::notice::W17D7_ORIGINAL_WAILS_CHART_TWO_NATIVE_CANDLE_POINT_CLICKS=PASS'
              W17D7CloseManager $process
            }
            Assert-W17D4Selected $parent '1m'
            Close-W17D4Indicators $parent
            Click-W17D4NativeButton $parent '5m'
            Assert-W17D5Pane $parent 28
            Click-W17D5Pane $parent 28 40
            Write-Output '::notice::W17D5_FIRST_NATIVE_VOLUME_EXPANSION=PASS'
            W17D7DrawUsingOriginalPriceChart $parent
            W17D6CreateLine $parent
            Write-Output '::notice::W17D4_FIRST_WAILS_USER_CLICK_5M=PASS'
            Write-Output '::notice::W17D0_WINDOWS_UIA_ACCESSIBLE_PREVIEW=VERIFIED'
            if(-not $parent.CloseMainWindow()){throw 'W17C6_WINDOW_CLOSE_FAILED'}
            if(-not $parent.WaitForExit(15000)){throw 'W17C6_WINDOW_SHUTDOWN_TIMEOUT'}
            Write-Output '::notice::W17D0_REAL_WINDOW_FIRST_CLOSE=PASS'
            # A real second OS process must reopen the same persisted
            # synthetic release and WebView2 profile, not merely reconstruct
            # an in-memory mock. The exact v5/v6 preview must remain visible.
            $parent=Start-Process -FilePath (Join-Path $rel 'ktrade.exe') -WorkingDirectory $rel -PassThru
            $deadline=(Get-Date).AddSeconds(50)
            $window=$false
            while((Get-Date) -lt $deadline){
              Start-Sleep -Milliseconds 700
              $parent.Refresh()
              if($parent.HasExited){throw 'W17D0_WAILS_COLD_START_EXITED'}
              if($parent.MainWindowHandle -ne [IntPtr]::Zero){$window=$true;break}
            }
            if(!$window){throw 'W17D0_WAILS_COLD_WINDOW_MISSING'}
            Assert-VisibleRecoveredScripts $parent 'COLD_RESTART'
            $coldChild=@()
            $deadline=(Get-Date).AddSeconds(20)
            while((Get-Date) -lt $deadline){
              $coldChild=@(Get-CimInstance Win32_Process -Filter "name='ktrade-engine.exe'"|Where-Object{
                $_.ExecutablePath -ieq $engine -and $_.ParentProcessId -eq $parent.Id
              })
              if($coldChild.Count -eq 1){break}
              Start-Sleep -Milliseconds 250
            }
            if($coldChild.Count -ne 1){throw 'W17D0_COLD_GO_CHILD_UNAVAILABLE'}
            $coldListeners=@(Get-NetTCPConnection -State Listen -OwningProcess $coldChild[0].ProcessId -ErrorAction SilentlyContinue)
            if($coldListeners.Count -ne 1 -or $coldListeners[0].LocalAddress -cne '127.0.0.1' -or
               [int]$coldListeners[0].LocalPort -ne $firstPort){
              throw 'W17D0_ORIGIN_CHANGED_ACROSS_WAILS_COLD_RESTART'
            }
            Write-Output '::notice::W17D0_REAL_WAILS_GO_IFRAME_ORIGIN_SAME_AFTER_COLD_RESTART=PASS'
            $rebound=@(Get-NetTCPConnection -LocalPort $legacyPort -State Listen -ErrorAction SilentlyContinue|
               Where-Object{$_.LocalAddress -eq '127.0.0.1' -and $_.OwningProcess -eq $parent.Id})
            if($rebound.Count -ne 1){throw 'W17D2_SINGLE_HISTORICAL_LISTENER_MISSING_ON_COLD_WAILS'}
            Write-Output '::notice::W17D2_REAL_WAILS_HISTORICAL_ORIGIN_REBINDS_ON_COLD_RESTART=PASS'
            Assert-W17D1AChartFavorite $parent 'REOPEN'
            Write-Output '::notice::W17D1A_ACTUAL_WEBVIEW2_UIA_COLD_FAVORITE_ACTIVE=PASS'
            Assert-W17D4Selected $parent '5m'
            Close-W17D4Indicators $parent
            Click-W17D4NativeButton $parent '15m'
            Assert-W17D5Pane $parent 40
            Click-W17D5Pane $parent 40 28
            Write-Output '::notice::W17D5_SECOND_NATIVE_COLD_RESTART_EXPANDED_LAYOUT_RESTORED_AND_STANDARD_SAVED=PASS'
            Write-Output '::notice::W17D4_REAL_SECOND_LAUNCH_5M_PERSISTED_THEN_15M_SET=PASS'
            $indicator=Wait-W17D1AButton $parent 'Indicators'
            Invoke-W17D1AButton $indicator 'OPEN_INDICATORS' $parent
            $category=Wait-W17D1AButton $parent 'Technicals'
            Invoke-W17D1AButton $category 'TECHNICALS_CATEGORY' $parent
            # Real browser conflict test: the user removes the imported RSI
            # and chooses a DIFFERENT, newer catalog favorite (MACD). A
            # third cold KTRADE startup must retain MACD and MUST NOT
            # overwrite it with the still-present OLD-origin RSI value.
            function Invoke-W17D3ExactChartStar([object]$process,[string]$label) {
              $button=Wait-W17D1AButton $process $label
              if($null -eq $button){throw ('W17D3_STAR_NOT_VISIBLE_'+$label)}
              # WebView2 exposes the star as a real UIA Button, but hosted
              # InvokePattern may return without triggering the web click.
              # Use the exact physically visible UIA bounds as W17D1A's
              # already qualified real Windows pointer path.
              $rect=$button.Current.BoundingRectangle
              $outer=[System.Windows.Automation.AutomationElement]::FromHandle(
                $process.MainWindowHandle).Current.BoundingRectangle
              if($rect.IsEmpty -or $rect.Width -lt 10 -or $rect.Height -lt 10 -or
                 $rect.Width -gt 160 -or $rect.Height -gt 160 -or
                 $rect.Left -lt $outer.Left -or $rect.Top -lt $outer.Top -or
                 $rect.Right -gt $outer.Right -or $rect.Bottom -gt $outer.Bottom){
                throw 'W17D3_CONFLICT_UIA_STAR_BOUNDARY_REFUSED'
              }
              # The qualified W17D1A control sequence first focuses the
              # exact accessibility button and sends SPACE; only then
              # falls back to a physical pointer when necessary.
              if($button.Current.IsKeyboardFocusable){
                try{
                  $button.SetFocus()
                  [System.Windows.Forms.SendKeys]::SendWait(' ')
                  Start-Sleep -Milliseconds 250
                  if($label -ceq 'Add MACD to favorites' -and
                     $null -ne (Get-W17D1AAccessibleButton $process 'Remove MACD from favorites')){
                    Write-Output '::notice::W17D3_NATIVE_WEBVIEW2_FOCUSED_KEYBOARD_NEWER_MACD=PASS'
                    return
                  }
                }catch{
                  Write-Output '::warning::W17D3_FOCUSED_WEBVIEW2_BUTTON_NOT_INVOKABLE'
                }
              }
              if(-not [W17D1ANativeClick]::SetForegroundWindow($process.MainWindowHandle)){
                throw 'W17D3_CONFLICT_WAILS_NOT_FOREGROUND'
              }
              Start-Sleep -Milliseconds 150
              if([W17D1ANativeClick]::GetForegroundWindow() -ne $process.MainWindowHandle){
                throw 'W17D3_FOREIGN_FOCUS_REFUSED'
              }
              $x=[int]($rect.Left+$rect.Width/2);$y=[int]($rect.Top+$rect.Height/2)
              if(-not [W17D1ANativeClick]::SetCursorPos($x,$y)){
                throw 'W17D3_CONFLICT_NATIVE_POINTER_REFUSED'
              }
              [W17D1ANativeClick]::mouse_event(0x0002,0,0,0,[UIntPtr]::Zero)
              [W17D1ANativeClick]::mouse_event(0x0004,0,0,0,[UIntPtr]::Zero)
              Start-Sleep -Milliseconds 250
              Write-Output '::notice::W17D3_CONFLICT_REAL_ORIGINAL_CHART_UIA_MOUSE_CLICK=PASS'
            }
            # User ADDS a newer MACD favorite to historical RSI. If the
            # cold W17D2 bridge ever blindly reimports its old RSI-only list,
            # the new MACD disappears. No need to remove historical RSI.
            Invoke-W17D3ExactChartStar $parent 'Add MACD to favorites'
            $newSelected=Wait-W17D1AButton $parent 'Remove MACD from favorites'
            if($null -eq $newSelected){throw 'W17D3_NEWER_DIFFERENT_FAVORITE_NOT_SAVED'}
            Write-Output '::notice::W17D3_REAL_WEBVIEW2_USER_ADDS_NEWER_MACD_AFTER_OLD_RSI=PASS'
            Close-W17D4Indicators $parent
            W17D7OpenManager $parent
            W17D7AssertLine $parent $true
            Write-Output '::notice::W17D7_REAL_WAILS_COLD_RESTART_TRENDLINE_RETAINED=PASS'
            Click-W17D7Named $parent 'Remove trendline 1'
            W17D7AssertLine $parent $false
            Write-Output '::notice::W17D7_GENUINE_ORIGINAL_CHART_USER_DELETED_TRENDLINE=PASS'
            W17D7CloseManager $parent
            W17D6OpenDrawingEditor $parent
            Assert-W17D6Drawing $parent $true
            Write-Output '::notice::W17D6_REAL_WAILS_COLD_RESTART_HLINE_PERSISTED=PASS'
            Click-W17D6Button $parent 'Remove horizontal line at 42500'
            Assert-W17D6Drawing $parent $false
            Write-Output '::notice::W17D6_REAL_ORIGINAL_CHART_USER_DELETES_LINE=PASS'
            if(-not $parent.CloseMainWindow()){throw 'W17D0_COLD_WINDOW_CLOSE_FAILED'}
            if(-not $parent.WaitForExit(15000)){throw 'W17D0_COLD_WINDOW_SHUTDOWN_FAILED'}
            Write-Output '::notice::W17D0_REAL_WAILS_COLD_RESTART_AND_CLEAN_SHUTDOWN=PASS'
            # Third ORIGINAL Wails process, same source identity and browser
            # directory, legacy RSI source still present. User's NEWER MACD
            # preference must win; never reimport RSI at cold start.
            $parent=Start-Process -FilePath (Join-Path $rel 'ktrade.exe') -WorkingDirectory $rel -PassThru
            $window=$false
            $deadline=(Get-Date).AddSeconds(50)
            while((Get-Date) -lt $deadline){
              Start-Sleep -Milliseconds 500
              $parent.Refresh()
              if($parent.HasExited){throw 'W17D3_NEWER_PREFERENCE_COLD_START_EXITED'}
              if($parent.MainWindowHandle -ne [IntPtr]::Zero){$window=$true;break}
            }
            if(-not $window){throw 'W17D3_NEWER_PREFERENCE_WAILS_WINDOW_MISSING'}
            Assert-VisibleRecoveredScripts $parent 'NEWER_FAVORITE_COLD'
            Assert-W17D4Selected $parent '15m'
            Assert-W17D5Pane $parent 28
            Write-Output '::notice::W17D5_THIRD_REAL_WAILS_WEBVIEW2_COLD_RESTART_STANDARD_LAYOUT=PASS'
            Write-Output '::notice::W17D4_THIRD_REAL_WAILS_WEBVIEW2_COLD_RESTART_15M=PASS'
            $indicator=Wait-W17D1AButton $parent 'Indicators'
            Invoke-W17D1AButton $indicator 'OPEN_INDICATORS' $parent
            $category=Wait-W17D1AButton $parent 'Technicals'
            Invoke-W17D1AButton $category 'TECHNICALS_CATEGORY' $parent
            $newFav=Wait-W17D1AButton $parent 'Remove MACD from favorites'
            $oldRetained=Wait-W17D1AButton $parent 'Remove Relative Strength Index from favorites'
            if($null -eq $newFav -or $null -eq $oldRetained){
              throw 'W17D3_HISTORICAL_RSI_REIMPORT_CLOBBERED_NEWER_WEBVIEW2_MACD'
            }
            Write-Output '::notice::W17D3_REAL_WEBVIEW2_THIRD_COLD_RESTART_NEWER_MACD_NOT_CLOBBERED=PASS'
            Close-W17D4Indicators $parent
            W17D7OpenManager $parent
            W17D7AssertLine $parent $false
            Write-Output '::notice::W17D7_THIRD_REAL_WAILS_COLD_RESTART_DELETION_RETAINED=PASS'
            W17D7CloseManager $parent
            W17D6OpenDrawingEditor $parent
            Assert-W17D6Drawing $parent $false
            Write-Output '::notice::W17D6_THIRD_REAL_WAILS_COLD_RESTART_DELETION_PERSISTED=PASS'
            if(-not $parent.CloseMainWindow()){throw 'W17D3_THIRD_WAILS_CLOSE_REFUSED'}
            if(-not $parent.WaitForExit(15000)){throw 'W17D3_THIRD_WAILS_SHUTDOWN_REFUSED'}
            Write-Output '::notice::W17D0_NO_LIVE_NO_PAPER_NO_USER_DATA_NO_INSTALLED_MIGRATION=PASS'
          } finally {
            if($legacySeeder -and -not $legacySeeder.HasExited){Stop-Process -Id $legacySeeder.Id -Force -ErrorAction SilentlyContinue}
            if($legacyServer -and -not $legacyServer.HasExited){Stop-Process -Id $legacyServer.Id -Force -ErrorAction SilentlyContinue}
            if($http){$http.Dispose()}
            if($parent -and -not $parent.HasExited){Stop-Process -Id $parent.Id -Force -ErrorAction SilentlyContinue}
            foreach($p in $child){
              Stop-Process -Id $p.ProcessId -Force -ErrorAction SilentlyContinue
            }
            if(Test-Path -LiteralPath $root){Remove-Item -LiteralPath $root -Force -Recurse -ErrorAction SilentlyContinue}
          }
      - name: Scrub all private candidate and scratch files
        if: always()
        shell: pwsh
        run: |
          foreach($path in @((Join-Path $env:GITHUB_WORKSPACE 'checked-private'),(Join-Path $env:RUNNER_TEMP 'w17c6-build'))){
            if(Test-Path -LiteralPath $path){Remove-Item -LiteralPath $path -Force -Recurse -ErrorAction SilentlyContinue}
          }
