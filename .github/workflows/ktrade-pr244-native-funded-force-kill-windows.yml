name: KTRADE PR244 installed funded PAPER force-kill orphan-quarantine negative gate
on:
  push:
    branches: [qualification/ktrade-original-pine-label-response-affinity-20261031]
    paths: [.github/workflows/ktrade-pr244-native-funded-force-kill-windows.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: ktrade-pr244-native-funded-force-kill-20261104
  cancel-in-progress: false
jobs:
  native-forced-kill:
    runs-on: windows-2022
    timeout-minutes: 44
    env:
      GOWORK: 'off'
      GOFLAGS: '-p=2'
      GOMAXPROCS: '2'
      CGO_ENABLED: '1'
      GOTOOLCHAIN: 'local'
      KTRADE_LIVE_TRADING: 'false'
      KTRADE_USE_LEGACY_CDP_CONFIG: '0'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      KTRADE_EXPECTED_SOURCE: 1b96c7a39d90a3bcc0485ce39bb6ab3269ab1664
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: witness
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: spoonman136668-ai/ktrade
          ref: b03dd6e58b6120cae3ffd39a79c6965ab8e91b9a
          path: previous
          persist-credentials: false
          token: ${{ secrets.KTRADE_SOURCE_READ_TOKEN }}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: spoonman136668-ai/ktrade
          ref: 1b96c7a39d90a3bcc0485ce39bb6ab3269ab1664
          path: product
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.KTRADE_SOURCE_READ_TOKEN }}
      - name: Exact-head source and immutable inherited native witness
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          function Need([bool]$x,[string]$s){if(!$x){throw $s}}
          Need ($env:GITHUB_REPOSITORY -ceq 'spoonman136668-ai/Qualification-Forge' -and $env:RUNNER_OS -ceq 'Windows' -and $env:RUNNER_ENVIRONMENT -ceq 'github-hosted') 'PR244_ISOLATED_WINDOWS_REQUIRED'
          $p=Join-Path $env:GITHUB_WORKSPACE 'product'
          $w=Join-Path $env:GITHUB_WORKSPACE 'witness'
          Need ((& git -C $p rev-parse HEAD).Trim() -ceq $env:KTRADE_EXPECTED_SOURCE -and (& git -C $p rev-parse 'HEAD^{tree}').Trim() -ceq '7143f2fa49b2027bb60d8d5106c632b2aa0c230d') 'PR244_EXACT_TREE_DRIFT'
          Need (@(& git -C $p status --porcelain).Count -eq 0 -and @(& git -C $w status --porcelain).Count -eq 0 -and !(Test-Path (Join-Path $p '.env'))) 'PR244_DIRTY_OR_CREDENTIAL_SOURCE'
          $config=Get-Content (Join-Path $p 'config.json') -Raw|ConvertFrom-Json
          Need (!$config.api_key.key_name -and !$config.api_key.key_secret -and !$config.account_id -and !$config.ngrok_authtoken) 'PR244_TRACKED_CREDENTIALS_REFUSED'
          Need ((Get-Content (Join-Path $p 'pkg/advanced_orders.go') -Raw).Contains('func liveBrokerageAuthorized() bool { return false }')) 'PR244_LIVE_DISARM_REQUIRED'
          $paths=@(& git -C $p diff --name-only 4b401d5f9c3a571c5ad61c4df33a7814120a3a4b HEAD | Sort-Object)
          $wanted=@('cmd/ktrade/main_full.go','cmd/ktrade/rb3_workspace_http_ingress_full_test.go','pkg/p18a_closeout_workspace_http_route_acceptance_gate_test.go','pkg/p18a_closeout_workspace_http_surface_gate_test.go','pkg/p18a_t05_workspace_http_request_response_contract_test.go','pkg/p18a_t06_workspace_http_deterministic_state_contract_test.go')|Sort-Object
          Need (($paths -join '|') -ceq ($wanted -join '|')) 'PR244_SIX_PATH_DRIFT'
          $receiptPath='qualification-receipts/ktrade-pr244-source-windows-verification-20261103.json'
          Need ((& git -C $w rev-parse ('HEAD:'+$receiptPath)).Trim() -ceq '1913e555ab83e49a26a754758011daef17ecb758') 'PR244_SOURCE_RECEIPT_BLOB_DRIFT'
          $receipt=Get-Content (Join-Path $w $receiptPath) -Raw|ConvertFrom-Json
          Need ($receipt.verdict -ceq 'PASS_SOURCE_OWNED_EXACT_HEAD_WINDOWS_FULL_REGRESSION' -and $receipt.source.head_sha -ceq $env:KTRADE_EXPECTED_SOURCE -and $receipt.qualification.workflow_run_id -eq 41755443367 -and $receipt.qualification.job_id -eq 126330475781 -and $receipt.qualification.run_conclusion -ceq 'success' -and $receipt.qualification.node_tests.passed -eq 193) 'PR244_SOURCE_CI_NOT_VERIFIED'
          $builderRel='qualification-harness/ktrade-pine-viewport/Build-And-Qualify-PR243.ps1'
          $nativeRel='qualification-harness/ktrade-pine-viewport/Installed-Viewport-Lifecycle-PR243.ps1'
          Need ((& git -C $w rev-parse ('HEAD:'+$builderRel)).Trim() -ceq '57adfe95974b14d0be92b1a7f354e119ce44044c' -and (& git -C $w rev-parse ('HEAD:'+$nativeRel)).Trim() -ceq '6bbe4cb1cdc1c14417fbde22d42ec1a1b52d40a4') 'PR244_INHERITED_HARNESS_BLOB_DRIFT'
          $b=Get-Content (Join-Path $w $builderRel) -Raw
          $oldPair="sha='4b401d5f9c3a571c5ad61c4df33a7814120a3a4b';tree='0d8257297d53a8edd4a40b4099f102106619b2a2'"
          $newPair="sha='1b96c7a39d90a3bcc0485ce39bb6ab3269ab1664';tree='7143f2fa49b2027bb60d8d5106c632b2aa0c230d'"
          Need ($b.Contains($oldPair)) 'PR244_BUILDER_PIN_MISSING'
          $b=$b.Replace($oldPair,$newPair)
          $n=Get-Content (Join-Path $w $nativeRel) -Raw
          $oldPin='$NewSHA=''4b401d5f9c3a571c5ad61c4df33a7814120a3a4b'''
          $newPin='$NewSHA=''1b96c7a39d90a3bcc0485ce39bb6ab3269ab1664'''
          $start='function StartInstalled([string]$maintenance,[object]$receipt,[string]$phase){'
          $insert='  SettingsWarm $shell $origin'
          Need ($n.Contains($oldPin) -and $n.Contains($start) -and $n.Contains($insert)) 'PR244_NATIVE_ANCHORS_MISSING'
          $probe=@'
          function PR244InstalledIngress([string]$origin){
            $load=$origin+'/api/workspace/load'
            $save=$origin+'/api/workspace/save'
            $trusted=@{Origin=$origin}
            $before=Invoke-RestMethod -Method Post -Uri $save -Headers $trusted -ContentType 'application/json' -Body '{}' -TimeoutSec 12
            Require ($before.success -eq $true -and ![string]::IsNullOrWhiteSpace([string]$before.workspace.code)) 'PR244_INSTALLED_STATE_REQUIRED'
            $code=[string]$before.workspace.code
            $valid='{"workspace":{"code":"pr244-trusted-wrapped"}}'
            $bad=@(
              @{name='missing-origin';headers=@{};body=$valid;type='application/json';method='Post';want=403},
              @{name='foreign-origin';headers=@{Origin='https://attacker.invalid'};body=$valid;type='application/json';method='Post';want=403},
              @{name='cross-site';headers=@{Origin=$origin;'Sec-Fetch-Site'='cross-site'};body=$valid;type='application/json';method='Post';want=403},
              @{name='non-json';headers=$trusted;body=$valid;type='text/plain';method='Post';want=403},
              @{name='wrong-method';headers=$trusted;body=$valid;type='application/json';method='Put';want=405},
              @{name='malformed';headers=$trusted;body='{';type='application/json';method='Post';want=400},
              @{name='trailing-json';headers=$trusted;body='{"code":"bad"} {"code":"second"}';type='application/json';method='Post';want=400},
              @{name='oversized';headers=$trusted;body=((' ' * ((1 -shl 20)+1))+'{"code":"bad"}');type='application/json';method='Post';want=413}
            )
            foreach($case in $bad){
              $status=0
              try {
                $response=Invoke-WebRequest -UseBasicParsing -Method $case.method -Uri $load -Headers $case.headers -ContentType $case.type -Body $case.body -TimeoutSec 20
                $status=[int]$response.StatusCode
              }catch{
                if($_.Exception.Response){$status=[int]$_.Exception.Response.StatusCode}else{throw}
              }
              Require ($status -eq $case.want) ('PR244_INSTALLED_HTTP_REFUSAL_'+$case.name+'_'+$status)
              $after=Invoke-RestMethod -Method Post -Uri $save -Headers $trusted -ContentType 'application/json' -Body '{}' -TimeoutSec 12
              Require ($after.success -eq $true -and $after.workspace.code -ceq $code) ('PR244_INSTALLED_MUTATED_STATE_'+$case.name)
            }
            $wrapped=Invoke-RestMethod -Method Post -Uri $load -Headers $trusted -ContentType 'application/json' -Body $valid -TimeoutSec 12
            Require ($wrapped.success -eq $true -and $wrapped.workspace.code -ceq 'pr244-trusted-wrapped') 'PR244_INSTALLED_WRAPPED_REFUSED'
            $raw=Invoke-RestMethod -Method Post -Uri $load -Headers $trusted -ContentType 'application/json' -Body '{"code":"pr244-trusted-raw"}' -TimeoutSec 12
            Require ($raw.success -eq $true -and $raw.workspace.code -ceq 'pr244-trusted-raw') 'PR244_INSTALLED_RAW_REFUSED'
            SettingsDisarmed $origin
            Write-Host '::notice::PR244_INSTALLED_WORKSPACE_ORIGIN_LIMIT_STATE_AND_VALID_FORMS=PASS'
          }
          '@
          $n=$n.Replace($oldPin,$newPin).Replace($start,($probe+[Environment]::NewLine+$start)).Replace($insert,($insert+[Environment]::NewLine+'  PR244InstalledIngress $origin'))
          $buildPath=Join-Path $env:RUNNER_TEMP 'Build-And-Qualify-PR244.ps1'
          $nativePath=Join-Path $env:RUNNER_TEMP 'Installed-Viewport-Lifecycle-PR244.ps1'
          [IO.File]::WriteAllText($buildPath,$b,[Text.UTF8Encoding]::new($false))
          [IO.File]::WriteAllText($nativePath,$n,[Text.UTF8Encoding]::new($false))
          foreach($file in @($buildPath,$nativePath)){
            $tokens=$null;$errors=$null
            [void][Management.Automation.Language.Parser]::ParseFile($file,[ref]$tokens,[ref]$errors)
            Need ($errors.Count -eq 0) ('PR244_GENERATED_WITNESS_SYNTAX '+(($errors|ForEach-Object {$_.ToString()}) -join '; '))
          }
          $helper='qualification-harness/ktrade-pr244-crash/Prepare-Funded-Force-Kill.ps1'
          Need ((& git -C $w rev-parse ('HEAD:'+$helper)).Trim() -ceq 'f4c027ff9ff8aeaa2053e0855e4656b340511cf8') 'PR244_CRASH_DERIVATION_HELPER_DRIFT'
          foreach($r in @(
            @{path='qualification-receipts/ktrade-pr244-exact-risk-matrix-windows-20261104.json';sha='9a630db7c0f258588f01923688a1f4341a4e233c'},
            @{path='qualification-receipts/ktrade-pr244-current-go-security-scan-windows-20261104.json';sha='6c8c08909a005c3a35cbb9b8b287fb7b5e7ff66b'},
            @{path='qualification-receipts/ktrade-pr244-original-pine-performance-windows-20261104.json';sha='72bbc1cb5294b062a2b168872cb048464bd311ed'}
          )){
            Need ((& git -C $w rev-parse ('HEAD:'+$r.path)).Trim() -ceq $r.sha) ('PR244_CRASH_FINAL_CI_RECEIPT_DRIFT_'+$r.path)
          }
          & (Join-Path $w $helper) -WitnessRoot $w -OutputRoot $env:RUNNER_TEMP
          if($LASTEXITCODE -ne 0 -or !$?){throw 'PR244_CRASH_ORIGINAL_WITNESS_DERIVATION_FAILED'}
          Write-Host '::notice::PR244_CRASH_PINNED_PR244_NATIVE_SOURCE_AND_BASELINE_RECEIPTS=PASS'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Original unsigned installer from exact source
        id: package
        shell: powershell
        working-directory: product
        run: |
          $ErrorActionPreference='Stop'
          $env:PSModulePath=Join-Path $PSHOME 'Modules'
          $env:TEMP=$env:RUNNER_TEMP; $env:TMP=$env:RUNNER_TEMP
          & npm.cmd ci --ignore-scripts --no-audit --no-fund
          if($LASTEXITCODE -ne 0){throw 'PR244_NPM_LOCKED_INSTALL_FAILED'}
          & node scripts/stage_offline_vendor.cjs
          if($LASTEXITCODE -ne 0){throw 'PR244_OFFLINE_ASSETS_FAILED'}
          $root=Join-Path $env:RUNNER_TEMP ('ktrade-setup-package-'+[guid]::NewGuid().ToString('N'))
          & ./windows/Build-KTRADE-FreshInstaller.ps1 -OutputRoot $root -ExpectedSourceSha $env:KTRADE_EXPECTED_SOURCE
          if($LASTEXITCODE -ne 0){throw 'PR244_ORIGINAL_INSTALLER_BUILD_FAILED'}
          $m=Get-Content (Join-Path $root 'KTRADE-SetupBundle/installer-manifest.json') -Raw|ConvertFrom-Json
          if($m.source_sha -cne $env:KTRADE_EXPECTED_SOURCE -or $m.signature_status -cne 'unsigned' -or $m.live_armed -or $m.release_authority -cne 'none'){throw 'PR244_PACKAGE_AUTHORITY_DRIFT'}
          $executables=@(Get-ChildItem $root -Filter '*.exe' -Recurse -File)
          if($executables.Count -ne 6){throw 'PR244_SIX_SHIPPING_BINARIES_REQUIRED'}
          foreach($exe in $executables){if((Get-AuthenticodeSignature $exe.FullName).Status -cne 'NotSigned'){throw 'PR244_UNEXPECTED_SIGNATURE'}}
          $hash=(Get-FileHash (Join-Path $root 'KTRADE-SetupBundle.zip') -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT,('bundle_root='+$root+[Environment]::NewLine+'archive_sha256='+$hash+[Environment]::NewLine),[Text.UTF8Encoding]::new($false))
          Write-Host '::notice::PR244_EXACT_UNSIGNED_SOURCE_BUILT_DISARMED=PASS'
      - name: Native verified WebView2 real first PAPER BUY then forced shell crash and quarantine
        shell: pwsh
        env:
          BUNDLE_ROOT: ${{ steps.package.outputs.bundle_root }}
          BUNDLE_SHA: ${{ steps.package.outputs.archive_sha256 }}
        run: |
          $ErrorActionPreference='Stop'
          $h=Join-Path $env:GITHUB_WORKSPACE 'witness/qualification-harness/ktrade-w83'
          $out=Join-Path $env:RUNNER_TEMP 'pr244-installed-native.log'
          & (Join-Path $env:RUNNER_TEMP 'Build-And-Qualify-PR244-Crash.ps1') -PreviousCheckout (Join-Path $env:GITHUB_WORKSPACE 'previous') -CandidateCheckout (Join-Path $env:GITHUB_WORKSPACE 'product') -WitnessScript (Join-Path $env:RUNNER_TEMP 'Installed-PR244-Funded-Crash.ps1') -NativeInputsPath (Join-Path $h 'Original-W40-Native-Inputs.ps1') -PaperScenarioPath (Join-Path $env:RUNNER_TEMP 'Original-W40-Paper-Crash.ps1') -CandidateQualifiedBundleRoot $env:BUNDLE_ROOT -ExpectedCandidateArchiveSha256 $env:BUNDLE_SHA *>&1 | Tee-Object -FilePath $out
          if($LASTEXITCODE -ne 0 -or !$?){throw 'PR244_REAL_FUNDED_CRASH_WITNESS_FAILED'}
          $lines=@(Get-Content $out)
          foreach($marker in @('::notice::PR244_CRASH_ONE_SETTLED_PAPER_BUY_CHILD_TERMINATED_STALE_LEASE_QUARANTINED_NO_REARM=PASS','::notice::PR244_NATIVE_FUNDED_FORCE_KILL_QUARANTINE=PASS')){
            if(@($lines|Where-Object {$_ -ceq $marker}).Count -ne 1){throw ('PR244_FUNDED_CRASH_WITNESS_REQUIRED_'+$marker)}
          }
          Write-Host '::notice::PR244_EXACT_NATIVE_FUNDED_FORCE_KILL_QUARANTINE=PASS'
