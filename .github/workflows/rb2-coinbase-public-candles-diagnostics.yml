name: RB2 public Coinbase candle source boundary diagnostics
on:
  push:
    branches: [qualification/rb2-ci01-cold-recovery-windows-20261023]
    paths: [.github/workflows/rb2-coinbase-public-candles-diagnostics.yml]
permissions:
  contents: read
concurrency:
  group: rb2-coinbase-public-candles-diagnostics
  cancel-in-progress: false
jobs:
  read-only-market-diagnostics:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Qualify only public anonymous GET, no authentication or orders
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_OS -cne 'Windows' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted') {
            throw 'RB2_MARKET_DIAG_NEEDS_INDEPENDENT_WINDOWS'
          }
          $at=[DateTime]::UtcNow
          $start=$at.AddMinutes(-300).ToString('yyyy-MM-ddTHH:mm:ssZ')
          $end=$at.ToString('yyyy-MM-ddTHH:mm:ssZ')
          $items=@(
            @('BTC-USDC_no_range','https://api.exchange.coinbase.com/products/BTC-USDC/candles?granularity=60'),
            @('BTC-USDC_exact_300','https://api.exchange.coinbase.com/products/BTC-USDC/candles?granularity=60&start='+$start+'&end='+$end),
            @('BTC-USD_no_range','https://api.exchange.coinbase.com/products/BTC-USD/candles?granularity=60'),
            @('ETH-USDC_no_range','https://api.exchange.coinbase.com/products/ETH-USDC/candles?granularity=60'),
            @('BTC-USDC_product','https://api.exchange.coinbase.com/products/BTC-USDC')
          )
          foreach($item in $items) {
            $label=[string]$item[0]
            try{
              $res=Invoke-WebRequest -Uri ([string]$item[1]) -Method Get -TimeoutSec 10 -Headers @{'Accept'='application/json';'User-Agent'='KTRADE-ReadOnly-Market-Qualification/1.0'}
              $json=$null
              try{$json=$res.Content|ConvertFrom-Json}catch{}
              $rowCount=if($null -ne $json -and $json -is [array]){$json.Count}else{-1}
              Write-Host ('RB2_PUBLIC_SOURCE_'+$label+'=HTTP_'+[int]$res.StatusCode+'_ROWS_'+$rowCount)
            }catch{
              $status=$_.Exception.Response.StatusCode.value__
              if(!$status){$status='TRANSPORT_FAILURE'}
              $reason=($_.Exception.Message -replace '[\r\n]',' ')
              Write-Host ('RB2_PUBLIC_SOURCE_'+$label+'=HTTP_'+$status+'_REASON_'+$reason.Substring(0,[Math]::Min(120,$reason.Length)))
            }
          }
          Write-Host 'RB2_PUBLIC_SOURCE_DIAGNOSTIC=OBSERVED_NO_TRADING_AUTHORITY'

      - name: Observe official unauthenticated Advanced Trade public candle freshness
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_OS -cne 'Windows' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted') {
            throw 'RB2_ADVANCED_SOURCE_UNQUALIFIED_WINDOWS'
          }
          $now=[DateTimeOffset]::UtcNow
          $end=$now.ToUnixTimeSeconds().ToString()
          $start=$now.AddMinutes(-301).ToUnixTimeSeconds().ToString()
          foreach($product in @('BTC-USDC','ETH-USDC')) {
            $uri='https://api.coinbase.com/api/v3/brokerage/market/products/'+$product+'/candles?start='+$start+'&end='+$end+'&granularity=ONE_MINUTE&limit=300'
            try {
              $response=Invoke-WebRequest -Uri $uri -Method Get -TimeoutSec 12 -Headers @{'Accept'='application/json';'User-Agent'='KTRADE-ReadOnly-Market-Qualification/1.0'}
              $observed=[DateTimeOffset]::UtcNow
              $result=$response.Content | ConvertFrom-Json
              $candles=@($result.candles)
              if($null -eq $result.candles) {
                Write-Host ('RB2_ADVANCED_'+$product+'_HTTP_'+[int]$response.StatusCode+'_SCHEMA_NOT_CANDLES')
                continue
              }
              $epochs=@($candles|ForEach-Object {if($_.start -match '^\d{9,11}$'){[long]$_.start}})
              if($epochs.Count -ne $candles.Count -or !$epochs.Count) {
                Write-Host ('RB2_ADVANCED_'+$product+'_INVALID_TIMESTAMP_SHAPE_ROWS_'+$candles.Count)
                continue
              }
              $max=($epochs|Measure-Object -Maximum).Maximum
              $min=($epochs|Measure-Object -Minimum).Minimum
              $last=[DateTimeOffset]::FromUnixTimeSeconds([long]$max)
              $freshness=($observed-$last.AddMinutes(1)).TotalSeconds
              $valid=($freshness -ge 0 -and $freshness -le 120)
              Write-Host ('RB2_ADVANCED_'+$product+'_HTTP_'+[int]$response.StatusCode+
                '_ROWS_'+$candles.Count+'_OLDEST_START_'+[DateTimeOffset]::FromUnixTimeSeconds([long]$min).ToString('o')+
                '_NEWEST_START_'+$last.ToString('o')+'_OBSERVED_'+$observed.ToString('o')+
                '_LAST_CLOSE_AGE_SECONDS_'+[math]::Round($freshness,1)+'_FRESH_'+$valid)
            } catch {
              $status='TRANSPORT_FAILURE'
              if($_.Exception.Response -and $_.Exception.Response.StatusCode) {
                $status=[string][int]$_.Exception.Response.StatusCode
              }
              Write-Host ('RB2_ADVANCED_'+$product+'_HTTP_'+$status+'_NO_AUTHENTIC_FRESHNESS_PROVEN')
            }
          }
          Write-Host 'RB2_ADVANCED_PUBLIC_CANDLES_DIAGNOSTIC=READ_ONLY_NO_BROKER_AUTHORITY'
