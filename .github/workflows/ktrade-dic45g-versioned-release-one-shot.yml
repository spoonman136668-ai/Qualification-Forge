name: DIC-45G sealed release guard source-identical Windows qualification
on:
  push:
    branches: [qualification/dic45g-release-identity-windows-r1]
    paths: [.github/workflows/ktrade-dic45g-versioned-release-one-shot.yml]
permissions:
  contents: write
concurrency:
  group: dic45g-source-identical-release-guard
  cancel-in-progress: false
jobs:
  release-guard-windows:
    if: github.repository == 'spoonman136668-ai/Qualification-Forge' && github.run_attempt == 1
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      PRIVATE_QUALIFIER_SHA: 'd0354561a7a12f4e444cea9a2c3b28eb9bbb8113'
      ORIGINAL_KTRADE_SHA: '3cabbdb30fd772e7c730e0089f82ed71168f46b9'
      DIC45G_PLANE_SHA: '4a88a8006be8fb3d83d682610ad8841345f57d5a'
      GOWORK: 'off'
      GOFLAGS: '-p=2'
      GOMAXPROCS: '2'
      KTRADE_CI_SOURCE_ONLY: '1'
      KTRADE_CI_PAPER_ONLY: '1'
      KTRADE_CI_LIVE_AUTHORITY: '0'
      KTRADE_CI_COINBASE_ALLOWED: '0'
      KTRADE_CI_PROMOTION_ALLOWED: '0'
      CKB_PLANE_ACCEPTED_REF_MUTATION: '0'
    steps:
      - name: Isolated GitHub-hosted Windows only, zero broker/production authority
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_OS -cne 'Windows' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted'){throw 'DIC45G_HOSTED_WIN_REQUIRED'}
          if($env:KTRADE_CI_LIVE_AUTHORITY -cne '0' -or $env:KTRADE_CI_COINBASE_ALLOWED -cne '0' -or $env:KTRADE_CI_PROMOTION_ALLOWED -cne '0'){throw 'DIC45G_AUTHORITY_BOUNDARY_BROKEN'}
          Write-Host 'DIC45G_NO_TRADING_OR_RELEASE_AUTHORITY=PASS'
      - name: Checkout frozen source-identical private qualification fixture
        uses: actions/checkout@v4
        with:
          repository: spoonman136668-ai/ckb
          ref: d0354561a7a12f4e444cea9a2c3b28eb9bbb8113
          path: private
          fetch-depth: 5
          persist-credentials: false
          token: ${{ secrets.KTRADE_CKB_READ_TOKEN_TEMP }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false
      - name: Verify original subject, exact controller source blobs and isolation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:GITHUB_WORKSPACE 'private'
          if((& git -C $root rev-parse HEAD).Trim() -cne $env:PRIVATE_QUALIFIER_SHA -or $LASTEXITCODE -ne 0){throw 'DIC45G_QUALIFIER_HEAD_DRIFT'}
          $source=(& git -C $root rev-parse 'HEAD^^^^').Trim()
          if($LASTEXITCODE -ne 0 -or $source -cne $env:ORIGINAL_KTRADE_SHA){throw 'DIC45G_KTRADE_ORIGINAL_DRIFT'}
          $expected=[ordered]@{
            'autonomy_dic45_review.go'='065972d4a37e0be0c60b073c6c5240a64e4e7327'
            'autonomy_dic45_review_test.go'='83bdd91c0715f1cf9974eba6a772859df073bda9'
            'gate_harness.go'='de7bec8fd18a03dc5f53267b52eb2d0fcd89bc4d'
          }
          foreach($name in $expected.Keys){
            $p='qualification/dic45f-gate-r1/'+$name
            $blob=(& git -C $root rev-parse "$($env:PRIVATE_QUALIFIER_SHA):$p").Trim()
            if($LASTEXITCODE -ne 0 -or $blob -cne [string]$expected[$name]){throw 'DIC45G_SOURCE_BLOB_DRIFT'}
          }
          Write-Host 'DIC45G_EXACT_CONTROLLER_RELEASE_GUARD_SOURCE=PASS'
      - name: Versioned release positive/negative tests plus durable review ledger
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $module=Join-Path $env:GITHUB_WORKSPACE 'private/qualification/dic45f-gate-r1'
          $log=Join-Path $env:RUNNER_TEMP 'dic45g-qualifier-private.log'
          Push-Location $module
          try{
            & go mod tidy *> $log
            if($LASTEXITCODE -ne 0){throw 'DIC45G_GO_DEPENDENCIES_MISSING'}
            & go test -count=1 -timeout=240s ./... *> $log
            if($LASTEXITCODE -ne 0){throw 'DIC45G_WINDOWS_RELEASE_GUARD_TESTS_FAILED_PRIVATE_LOG_WITHHELD'}
            Write-Host 'DIC45G_WINDOWS_RELEASE_IDENTITY_AND_LEDGER_TESTS=PASS'
            & go vet ./... *> $log
            if($LASTEXITCODE -ne 0){throw 'DIC45G_WINDOWS_VET_FAILED_PRIVATE_LOG_WITHHELD'}
            Write-Host 'DIC45G_WINDOWS_GO_VET=PASS'
            & go build ./... *> $log
            if($LASTEXITCODE -ne 0){throw 'DIC45G_WINDOWS_BUILD_FAILED_PRIVATE_LOG_WITHHELD'}
            Write-Host 'DIC45G_WINDOWS_GO_BUILD=PASS'
          }finally{
            Pop-Location
            Remove-Item -LiteralPath $log -Force -ErrorAction SilentlyContinue
          }
      - name: KTRADE tracked files untouched, no authority or new installation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:GITHUB_WORKSPACE 'private'
          $product=@(& git -C $root status --porcelain=v1 --untracked-files=no -- . ':(exclude)qualification/dic45f-gate-r1')
          if($LASTEXITCODE -ne 0 -or $product.Count -ne 0){throw 'DIC45G_KTRADE_PRODUCT_CHANGED'}
          Write-Host 'DIC45G_PRODUCT_SOURCE_UNMODIFIED=PASS'
          Write-Host 'DIC45G_FULL_CONTROLLER_WINDOWS_REGRESSION=NOT_EXECUTED'
          Write-Host 'DIC45G_VERSIONED_RELEASE_INSTALLED=FALSE'
          Write-Host 'DIC45G_NATIVE_CONTROLLER_ADMITTED=FALSE'
          Write-Host 'DIC45G_BROKER_AUTHORITY=FALSE'
      - name: Destroy private source; never upload code
        if: always()
        shell: pwsh
        run: |
          Remove-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'private') -Recurse -Force -ErrorAction SilentlyContinue
          Write-Host 'DIC45G_PRIVATE_ARTIFACT_UPLOAD=DISABLED'
      - name: Store sanitized qualification receipt
        if: success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $doc=[ordered]@{
            schema='ktrade.dic45g.versioned-release-focused-windows.v1'
            run_id=$env:GITHUB_RUN_ID
            workflow_source_sha=$env:GITHUB_SHA
            dic45g_controller_source_sha=$env:DIC45G_PLANE_SHA
            quarantine_sha=$env:PRIVATE_QUALIFIER_SHA
            original_ktrade_sha=$env:ORIGINAL_KTRADE_SHA
            release_gate_blob='065972d4a37e0be0c60b073c6c5240a64e4e7327'
            release_gate_test_blob='83bdd91c0715f1cf9974eba6a772859df073bda9'
            hosted_windows_tests_vet_build=$true
            full_controller_windows_regression_qualified=$false
            versioned_release_installed=$false
            controller_admitted=$false
            accepted_ref_mutation=$false
            broker_or_production_authorized=$false
            private_artifacts=0
          }|ConvertTo-Json -Compress
          $body=@{message='evidence: DIC45G versioned release guard Windows focused';content=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($doc+"`n"));branch='main'}|ConvertTo-Json
          $uri='https://api.github.com/repos/spoonman136668-ai/Qualification-Forge/contents/qualification-evidence/dic45g-runs/'+$env:GITHUB_RUN_ID+'.json'
          Invoke-RestMethod -Uri $uri -Method Put -ContentType 'application/json' -Headers @{Authorization=('Bearer '+$env:GH_TOKEN);Accept='application/vnd.github+json';'X-GitHub-Api-Version'='2022-11-28'} -Body $body -TimeoutSec 30|Out-Null
          Write-Host 'DIC45G_SANITIZED_WINDOWS_RECEIPT=PASS'
