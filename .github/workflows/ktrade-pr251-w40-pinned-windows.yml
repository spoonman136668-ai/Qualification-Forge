          public static class W40NativeMouse {
            [System.Runtime.InteropServices.DllImport("user32.dll")]
            static extern void mouse_event(uint flags,uint x,uint y,uint data,System.UIntPtr extra);
            [System.Runtime.InteropServices.DllImport("user32.dll")]
            public static extern bool SetCursorPos(int x,int y);
            public static bool Wheel(int x,int y){
              if(!SetCursorPos(x,y))return false;
              System.Threading.Thread.Sleep(120);
              // Multiple genuine Windows wheel detents after cursor settles.
              for(int i=0;i<3;i++){
                mouse_event(0x0800,0,0,120,System.UIntPtr.Zero);
                System.Threading.Thread.Sleep(85);
              }
              return true;
            }
            public static bool Drag(int x,int y,int toX){
              if(!SetCursorPos(x,y))return false;
              System.Threading.Thread.Sleep(100);
              mouse_event(0x0002,0,0,0,System.UIntPtr.Zero);
              for(int i=1;i<=14;i++){
                SetCursorPos(x+(toX-x)*i/14,y);
                System.Threading.Thread.Sleep(25);
              }
              mouse_event(0x0004,0,0,0,System.UIntPtr.Zero);
              return true;
            }
          }
          '@
              function Wait-W40([string]$path,[string]$expected,[int]$seconds=10){
                $deadline=(Get-Date).AddSeconds($seconds)
                while((Get-Date) -lt $deadline){
                  if(Test-Path -LiteralPath $path -PathType Leaf){
                    $value=(Get-Content -LiteralPath $path -Raw).Trim()
                    if(-not $expected -or $value -ceq $expected){return $value}
                    throw 'W40_UNEXPECTED_RECEIPT'
                  }
                  $parent.Refresh()
                  if($parent.HasExited){throw 'W40_WAILS_EXITED'}
                  Start-Sleep -Milliseconds 100
                }
                if(Test-Path -LiteralPath $env:KTRADE_W40_DIAG_RECEIPT -PathType Leaf){
                  $safe=@(Get-Content -LiteralPath $env:KTRADE_W40_DIAG_RECEIPT |
                    Where-Object {$_ -cmatch '^W40_DIAG_[A-Z_]{3,48}$'} | Select-Object -Unique -Last 16)
                  if($safe.Count){Write-Host ('W40_DIAGNOSTIC_STAGES='+($safe -join ','))}
                }
                $receiptName=[IO.Path]::GetFileName($path)
                if($receiptName -cnotmatch '^w40-(?:chart-(?:geometry|zoomed|panned)|editor-(?:geometry|focused))\.txt$'){
                  throw 'W40_UNEXPECTED_RECEIPT_PATH'
                }
                throw ('W40_EXPECTED_OBSERVER_RECEIPT_MISSING_'+$receiptName)
              }
              function Read-W40Point([string]$path){
                $raw=Wait-W40 $path '' 14
                $fields=@($raw.Split(','))
                if($fields.Count -ne 4){throw 'W40_BAD_GEOMETRY_RECEIPT'}
                $nums=@()
                foreach($field in $fields){
                  [int]$v=0
                  if(-not [int]::TryParse($field,[ref]$v)){throw 'W40_BAD_GEOMETRY_RECEIPT'}
                  $nums+=$v
                }
                $cssX=$nums[0];$cssY=$nums[1];$cssW=$nums[2];$cssH=$nums[3]
                if($cssW -lt 200 -or $cssH -lt 200 -or $cssX -lt 18 -or $cssX -ge $cssW-18 -or
                   $cssY -lt 18 -or $cssY -ge $cssH-18){throw 'W40_GEOMETRY_OFFSCREEN'}
                $pt=New-Object W39NativeMouse+POINT
                $pt.X=[int][Math]::Round($cssX*$clientW/$cssW)
                $pt.Y=[int][Math]::Round($cssY*$clientH/$cssH)
                if(-not [W39NativeMouse]::ClientToScreen($handle,[ref]$pt)){
                  throw 'W40_NATIVE_CLIENT_SCREEN_MAPPING_FAILED'
                }
                if($pt.X -lt 18 -or $pt.Y -lt 18 -or
                   $pt.X -ge [W39NativeMouse]::GetSystemMetrics(0)-18 -or
                   $pt.Y -ge [W39NativeMouse]::GetSystemMetrics(1)-18){
                  throw 'W40_NATIVE_INPUT_OFFSCREEN'
                }
                return $pt
              }
              $chartTarget=Read-W40Point $env:KTRADE_W40_CHART_GEOMETRY_RECEIPT
              # Focus the real chart with an OS click; never use script-click.
              if(-not [W39NativeMouse]::Click($chartTarget.X,$chartTarget.Y)){
                throw 'W40_NATIVE_CHART_FOCUS_CLICK_FAILED'
              }
              Start-Sleep -Milliseconds 200
              if(-not [W40NativeMouse]::Wheel($chartTarget.X,$chartTarget.Y)){
                throw 'W40_NATIVE_CHART_WHEEL_INJECTION_FAILED'
              }
              Wait-W40 $env:KTRADE_W40_CHART_ZOOMED_RECEIPT 'W40_NATIVE_CHART_WHEEL_ZOOM=PASS' 10 | Out-Null
              Start-Sleep -Milliseconds 950
              $dragTo=$chartTarget.X+85
              if($dragTo -ge [W39NativeMouse]::GetSystemMetrics(0)-18){$dragTo=$chartTarget.X-85}
              if($dragTo -lt 18 -or -not [W40NativeMouse]::Drag($chartTarget.X,$chartTarget.Y,$dragTo)){
                throw 'W40_NATIVE_CHART_DRAG_INJECTION_FAILED'
              }
              Wait-W40 $env:KTRADE_W40_CHART_PANNED_RECEIPT 'W40_NATIVE_CHART_DRAG_PAN=PASS' 10 | Out-Null
              $editorTarget=Read-W40Point $env:KTRADE_W40_EDITOR_GEOMETRY_RECEIPT
              if(-not [W39NativeMouse]::Click($editorTarget.X,$editorTarget.Y)){
                throw 'W40_NATIVE_EDITOR_CLICK_FAILED'
              }
              Wait-W40 $env:KTRADE_W40_EDITOR_FOCUSED_RECEIPT 'W40_NATIVE_MONACO_EDITOR_FOCUS=PASS' 10 | Out-Null
              Write-Host 'W40_NATIVE_CHART_WHEEL_ZOOM=PASS'
              Write-Host 'W40_NATIVE_CHART_DRAG_PAN=PASS'
              Write-Host 'W40_NATIVE_MONACO_EDITOR_FOCUS=PASS'
              Write-Host 'W40_DISARMED_REAL_WEBVIEW2_INPUT=PASS'
            }
            Write-Host 'W01_PHYSICAL_MOUSE_PINE_COMPILE_CANDLE_PIXELS_AND_DPI_MATRIX_UNVERIFIED'
            if(Test-Path -LiteralPath (Join-Path $stage 'data')){throw 'W01_REAL_DOM_PROBE_CREATED_PAPER_DATA'}
            if(-not $parent.CloseMainWindow()){throw 'W01_WINDOW_CLOSE_REQUEST_FAILED'}
            if(-not $parent.WaitForExit(15000)){throw 'W01_WAILS_GRACEFUL_SHUTDOWN_TIMEOUT'}
            if($parent.ExitCode -ne 0){throw 'W01_WAILS_SHUTDOWN_FAILED'}
            $ownedChild=Get-Process -Id $child[0].ProcessId -ErrorAction SilentlyContinue
            if($ownedChild -and -not $ownedChild.WaitForExit(5000)){throw 'W01_BACKEND_SURVIVED_WINDOW_CLOSE'}
            Write-Host 'W01_WINDOW_CLOSE_AND_OWNED_BACKEND_SHUTDOWN=PASS'
            Push-Location $root
            try {
              & node scripts/wails_w01_source_provenance.cjs
              if($LASTEXITCODE -ne 0){throw 'W01_POST_BUILD_SOURCE_DRIFT'}
            } finally {Pop-Location}
          } finally {
            if($http){$http.Dispose()}
            if($parent){
              try {if(-not $parent.HasExited){Stop-Process -Id $parent.Id -Force -ErrorAction SilentlyContinue}} catch {}
            }
