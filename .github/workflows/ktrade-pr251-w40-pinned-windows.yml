            Remove-Item Env:\KTRADE_W35_COMPILE_RECEIPT -ErrorAction SilentlyContinue
            Remove-Item Env:\KTRADE_W36_RENDER_PROBE -ErrorAction SilentlyContinue
            Remove-Item Env:\KTRADE_W36_RENDER_RECEIPT -ErrorAction SilentlyContinue
            Remove-Item Env:\KTRADE_W40_DIAG_RECEIPT -ErrorAction SilentlyContinue
            Remove-Item Env:\KTRADE_W40_NATIVE_CHART_PROBE -ErrorAction SilentlyContinue
            Remove-Item Env:\KTRADE_W40_CHART_GEOMETRY_RECEIPT -ErrorAction SilentlyContinue
            Remove-Item Env:\KTRADE_W40_CHART_ZOOMED_RECEIPT -ErrorAction SilentlyContinue
            Remove-Item Env:\KTRADE_W40_CHART_PANNED_RECEIPT -ErrorAction SilentlyContinue
            Remove-Item Env:\KTRADE_W40_EDITOR_GEOMETRY_RECEIPT -ErrorAction SilentlyContinue
            Remove-Item Env:\KTRADE_W40_EDITOR_FOCUSED_RECEIPT -ErrorAction SilentlyContinue
            Remove-Item Env:\KTRADE_W39_NATIVE_INPUT_PROBE -ErrorAction SilentlyContinue
            Remove-Item Env:\KTRADE_W39_GEOMETRY_RECEIPT -ErrorAction SilentlyContinue
            Remove-Item Env:\KTRADE_W39_CLOSED_RECEIPT -ErrorAction SilentlyContinue
            Remove-Item Env:\KTRADE_W39_REOPENED_RECEIPT -ErrorAction SilentlyContinue
            Remove-Item Env:\KTRADE_W01_DOM_PROBE -ErrorAction SilentlyContinue
            Remove-Item Env:\KTRADE_W01_DOM_RECEIPT -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $log -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $sandboxRoot -Force -Recurse -ErrorAction SilentlyContinue
          }
          Write-Host 'W01_TEST_ONLY_NO_RELEASE_NO_LIVE=PASS'

      - name: Retain source provenance independently of runtime outcome
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w01-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/w01-source.json
          if-no-files-found: warn
          retention-days: 14
  native-windows:
    name: native-windows
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      GOWORK: 'off'
      GOFLAGS: '-p=2'
      GOMAXPROCS: '2'
      CGO_ENABLED: '1'
      GOTOOLCHAIN: 'local'
      KTRADE_LIVE_TRADING: 'false'
      KTRADE_USE_LEGACY_CDP_CONFIG: '0'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      KTRADE_EXPECTED_SOURCE: '9f3b809c86603af9ca432db85c7c19c8cacdd0dd'
      KTRADE_HEAD_REPOSITORY: 'spoonman136668-ai/ktrade'
      KTRADE_REPOSITORY_PRIVATE: 'true'
    steps:
      - name: Exact PR source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: spoonman136668-ai/ktrade
          ref: 9f3b809c86603af9ca432db85c7c19c8cacdd0dd
          path: product
          persist-credentials: false
          token: ${{ secrets.KTRADE_SOURCE_READ_TOKEN }}
      - name: Only four original browser readers from the PR baseline
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: spoonman136668-ai/ktrade
          ref: 7ded42d92ff0d0808ada5202b5a3282d0d9ddd53
          token: ${{ secrets.KTRADE_SOURCE_READ_TOKEN }}
          path: browser-baseline
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /static/watchlist_manager.js
            /static/layout_manager.js
            /static/indicator_library.js
            /static/indicator_browser.js
      - name: Source identity private repository and disarmed authority
        shell: pwsh
        working-directory: product
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/Qualification-Forge' -or $env:KTRADE_HEAD_REPOSITORY -cne 'spoonman136668-ai/ktrade' -or $env:KTRADE_REPOSITORY_PRIVATE -cne 'true'){throw 'NATIVE_CI_REPOSITORY_OR_RUNNER_REFUSED'}
          if($env:KTRADE_EXPECTED_SOURCE -cnotmatch '^[0-9a-f]{40}$' -or (& git rev-parse HEAD).Trim() -cne $env:KTRADE_EXPECTED_SOURCE -or @(& git status --porcelain).Count -ne 0){throw 'NATIVE_CI_EXACT_CLEAN_HEAD_REQUIRED'}
          if(Test-Path '.env'){throw 'NATIVE_CI_DOTENV_REFUSED'}
          $cfg=Get-Content config.json -Raw|ConvertFrom-Json
          if($cfg.api_key.key_name -or $cfg.api_key.key_secret -or $cfg.account_id -or $cfg.ngrok_authtoken){throw 'NATIVE_CI_TRACKED_CREDENTIALS_REFUSED'}
          if((Get-Content pkg/advanced_orders.go -Raw) -notmatch 'func liveBrokerageAuthorized\(\) bool \{ return false \}'){throw 'NATIVE_CI_LIVE_AUTHORITY_DRIFT'}
          if((Get-Content windows/Go-Toolchain.version -Raw).Trim() -cne 'go1.26.10'){throw 'NATIVE_CI_REVIEWED_TOOLCHAIN_PIN_CHANGED'}
          $baseline=Join-Path $env:GITHUB_WORKSPACE 'browser-baseline'
          $files=@(Get-ChildItem (Join-Path $baseline 'static') -File)
          if($files.Count -ne 4 -or (Test-Path (Join-Path $baseline 'config.json')) -or (Test-Path (Join-Path $baseline '.env'))){throw 'NATIVE_CI_BROWSER_BASELINE_SCOPE_DRIFT'}
          Write-Host ('NATIVE_CI_SOURCE_SHA='+$env:KTRADE_EXPECTED_SOURCE)
          Write-Host ('NATIVE_CI_SOURCE_TREE='+(& git rev-parse 'HEAD^{tree}').Trim())
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Full original Go engine app and Wails tests and vet
        shell: pwsh
        working-directory: product
        run: |
          $ErrorActionPreference='Stop'
          $env:TEMP=$env:RUNNER_TEMP;$env:TMP=$env:RUNNER_TEMP
          if((& go env GOVERSION).Trim() -cne 'go1.26.10'){throw 'NATIVE_CI_COMPILER_DRIFT'}
          & go test -mod=readonly -count=1 ./...
          if($LASTEXITCODE -ne 0){throw 'NATIVE_CI_ROOT_TESTS_FAILED'}
          & go vet -mod=readonly ./...
          if($LASTEXITCODE -ne 0){throw 'NATIVE_CI_ROOT_VET_FAILED'}
          & go test -mod=readonly -count=1 -tags ktrade_full ./cmd/ktrade
          if($LASTEXITCODE -ne 0){throw 'NATIVE_CI_FULL_APP_TESTS_FAILED'}
          & go vet -mod=readonly -tags ktrade_full ./cmd/ktrade
          if($LASTEXITCODE -ne 0){throw 'NATIVE_CI_FULL_APP_VET_FAILED'}
          Push-Location tools/wails-pilot
          try{
            & go test -mod=readonly -count=1 ./...
            if($LASTEXITCODE -ne 0){throw 'NATIVE_CI_WAILS_TESTS_FAILED'}
            & go vet -mod=readonly ./...
            if($LASTEXITCODE -ne 0){throw 'NATIVE_CI_WAILS_VET_FAILED'}
          }finally{Pop-Location}
          Write-Host '::notice::NATIVE_CI_FULL_ROOT_TAGGED_WAILS_TEST_VET=PASS'
      - name: All current Node cases and original two-root browser compatibility
        shell: pwsh
        working-directory: product
        run: |
          $ErrorActionPreference='Stop'
          $files=@(Get-ChildItem tests -Filter '*.test.cjs' -File|Sort-Object Name|ForEach-Object{$_.FullName})
          if($files.Count -lt 35){throw 'NATIVE_CI_CURRENT_NODE_FILE_COVERAGE_MISSING'}
          $special=Join-Path (Get-Location) 'tests/rb3_w28f_original_browser_state.test.cjs'
          if($files -cnotcontains $special){throw 'NATIVE_CI_ORIGINAL_BROWSER_TEST_MISSING'}
          & node $special (Join-Path $env:GITHUB_WORKSPACE 'browser-baseline') (Get-Location).Path
          if($LASTEXITCODE -ne 0){throw 'NATIVE_CI_ORIGINAL_TWO_ROOT_BROWSER_COMPAT_FAILED'}
          $batch=@($files|Where-Object{$_ -cne $special})
          $tap=@(& node --test --test-reporter=tap @batch)
          $exit=$LASTEXITCODE;$tap|ForEach-Object{Write-Host $_}
          $counts=@($tap|Where-Object{$_ -match '^# tests (\d+)$'})
          $passed=@($tap|Where-Object{$_ -match '^# pass (\d+)$'})
          if($exit -ne 0 -or $counts.Count -ne 1 -or $passed.Count -ne 1){throw 'NATIVE_CI_NODE_SUITE_FAILED'}
          $n=[int]([regex]::Match($counts[0],'\d+$').Value);$ok=[int]([regex]::Match($passed[0],'\d+$').Value)
          if($n -lt 158 -or $ok -ne $n){throw 'NATIVE_CI_NODE_CASE_COVERAGE_MISSING'}
          foreach($line in @('# fail 0','# skipped 0','# cancelled 0')){if($tap -cnotcontains $line){throw 'NATIVE_CI_NODE_FAILURE_SKIP_OR_CANCEL'}}
          Write-Host ('::notice::NATIVE_CI_ALL_NODE=PASS files='+$files.Count+' cases='+$n)
      - name: Locked assets repeatability shipping advisories and exact notices
        shell: pwsh
        working-directory: product
        run: |
          $ErrorActionPreference='Stop'
          & npm.cmd ci --ignore-scripts --no-audit --no-fund
          if($LASTEXITCODE -ne 0){throw 'NATIVE_CI_LOCKED_ASSET_INSTALL_FAILED'}
          & node scripts/stage_offline_vendor.cjs
          if($LASTEXITCODE -ne 0){throw 'NATIVE_CI_FIRST_ASSET_STAGE_FAILED'}
          $first=(Get-FileHash static/vendor/assets-manifest.json -Algorithm SHA256).Hash
          & node scripts/stage_offline_vendor.cjs
          if($LASTEXITCODE -ne 0 -or (Get-FileHash static/vendor/assets-manifest.json -Algorithm SHA256).Hash -cne $first){throw 'NATIVE_CI_ASSET_RESTAGE_CHANGED'}
          & node -e "const fs=require('node:fs'),c=require('node:crypto');const m=JSON.parse(fs.readFileSync('static/vendor/assets-manifest.json'));if(m.files.some(f=>f.path==='assets-manifest.json'))throw Error('self inclusion');for(const f of m.files)if(c.createHash('sha256').update(fs.readFileSync('static/vendor/'+f.path)).digest('hex')!==f.sha256)throw Error('asset hash');console.log('NATIVE_CI_VENDOR_PAYLOAD_HASHES=PASS files='+m.files.length);"
          if($LASTEXITCODE -ne 0){throw 'NATIVE_CI_VENDOR_PAYLOAD_HASH_INVALID'}
          & node scripts/audit_shipped_dependencies.cjs .
          if($LASTEXITCODE -ne 0){throw 'NATIVE_CI_SHIPPED_ADVISORY_OR_NOTICE_AUDIT_FAILED'}
          Write-Host '::notice::NATIVE_CI_REPEATABLE_LICENSED_SHIPPING_ASSETS=PASS'
      - name: Fresh original unsigned Windows installer and actual shipping binary scans
        shell: powershell
        working-directory: product
        run: |
          $ErrorActionPreference='Stop'
          $env:PSModulePath=Join-Path $PSHOME 'Modules'
          $env:TEMP=$env:RUNNER_TEMP;$env:TMP=$env:RUNNER_TEMP
          $root=Join-Path $env:RUNNER_TEMP ('ktrade-setup-package-'+[guid]::NewGuid().ToString('N'))
          & ./windows/Build-KTRADE-FreshInstaller.ps1 -OutputRoot $root -ExpectedSourceSha $env:KTRADE_EXPECTED_SOURCE
          if($LASTEXITCODE -ne 0){throw 'NATIVE_CI_ORIGINAL_UNSIGNED_SETUP_BUILD_FAILED'}
          $manifest=Get-Content (Join-Path $root 'KTRADE-SetupBundle/installer-manifest.json') -Raw|ConvertFrom-Json
          if($manifest.source_sha -cne $env:KTRADE_EXPECTED_SOURCE -or $manifest.signature_status -cne 'unsigned' -or $manifest.live_armed -or $manifest.release_authority -cne 'none'){throw 'NATIVE_CI_PACKAGE_AUTHORITY_DRIFT'}
          $exes=@(Get-ChildItem $root -Filter '*.exe' -Recurse -File)
          if($exes.Count -ne 6){throw 'NATIVE_CI_SIX_ORIGINAL_BINARIES_REQUIRED'}
          foreach($exe in $exes){
            $version=(& go version $exe.FullName)-join ''
            if($LASTEXITCODE -ne 0 -or !$version.Trim().EndsWith(': go1.26.10',[StringComparison]::Ordinal) -or (Get-AuthenticodeSignature $exe.FullName).Status -cne 'NotSigned'){throw 'NATIVE_CI_BINARY_COMPILER_OR_SIGNATURE_DRIFT'}
          }
          & go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          if($LASTEXITCODE -ne 0){throw 'NATIVE_CI_PINNED_SCANNER_UNAVAILABLE'}
          $scanner=Join-Path ((& go env GOPATH).Trim()) 'bin/govulncheck.exe'
          $payload=@(Get-ChildItem $root -Filter 'KTRADE-WailsPortable' -Directory -Recurse)
          if($payload.Count -ne 1){throw 'NATIVE_CI_PAYLOAD_AMBIGUOUS'}
          foreach($name in @('ktrade.exe','ktrade-engine.exe')){
            & $scanner -mode=binary (Join-Path $payload[0].FullName $name)
            if($LASTEXITCODE -ne 0){throw 'NATIVE_CI_SHIPPING_BINARY_VULNERABILITY_FOUND'}
          }
          $changes=@(& git status --porcelain)
          if(@($changes|Where-Object{$_ -cnotin @('?? node_modules/','?? static/vendor/')}).Count -ne 0){throw 'NATIVE_CI_UNEXPECTED_SOURCE_OR_OUTPUT_CHANGE'}
          Write-Host ('NATIVE_CI_UNSIGNED_INSTALLER_SHA256='+((Get-FileHash (Join-Path $root 'KTRADE-SetupBundle.zip') -Algorithm SHA256).Hash.ToLowerInvariant()))
          Write-Host '::notice::NATIVE_CI_ORIGINAL_UNSIGNED_PACKAGE_ACTUAL_BINARY_SCANS_NO_APP_NO_INSTALL_NO_RELEASE=PASS'
