name: KTRADE PR251 W40 exact-source isolated Windows qualification

on:
  push:
    branches:
      - qualification/ktrade-pr251-w40-pinned-20261107
    paths:
      - .github/workflows/ktrade-pr251-w40-pinned-windows.yml

permissions:
  contents: read

concurrency:
  group: ktrade-pr251-w40-qforge-exact-source-20261107
  cancel-in-progress: false

jobs:
  isolated-wails-window:
    name: Build and smoke authentic Wails WebView2 on hosted Windows
    if: github.repository == 'spoonman136668-ai/Qualification-Forge' && github.ref == 'refs/heads/qualification/ktrade-pr251-w40-pinned-20261107'
    runs-on: windows-2022
    timeout-minutes: 55
    env:
      CGO_ENABLED: '1'
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      KTRADE_RECOVERY_ISOLATED: '1'
      KTRADE_PORTABLE_DISARMED: '0'
      KTRADE_USE_LEGACY_CDP_CONFIG: '0'
      KTRADE_PAPER_SESSION_ROOT: ''
      KTRADE_PAPER_CUSTODY_REVIEW_ROOT: ''
      W01_EXPECTED_SHA: '9f3b809c86603af9ca432db85c7c19c8cacdd0dd'
      W01_EXPECTED_TREE: ''
      KTRADE_QFORGE_W40_PINNED: '1'
    steps:
      - name: Checkout immutable private KTRADE source without persisting credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: spoonman136668-ai/ktrade
          ref: 9f3b809c86603af9ca432db85c7c19c8cacdd0dd
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.KTRADE_SOURCE_READ_TOKEN }}

      - name: Set up build-time-only Node for original locked Monaco/chart assets
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Verify exact event source, tree and immutable pilot ancestry
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows'){throw 'W01_HOSTED_WINDOWS_REQUIRED'}
          & node --test tests/wails_w01_source_provenance.test.cjs
          if($LASTEXITCODE -ne 0){throw 'W01_SOURCE_PROVENANCE_TEST_FAILED'}
          & node --test tests/wails_w02_boot.test.cjs
          if($LASTEXITCODE -ne 0){throw 'W02_NAVIGATION_STATE_UNIT_REGRESSION_FAILED'}
          Write-Host 'W02_NAVIGATION_STATE_UNIT_REGRESSION=PASS'
          $receipt=@(& node scripts/wails_w01_source_provenance.cjs)
          if($LASTEXITCODE -ne 0){throw 'W01_EXACT_SOURCE_PROVENANCE_FAILED'}
          $receipt | Write-Output
          $receipt | Set-Content -LiteralPath (Join-Path $env:RUNNER_TEMP 'w01-source.json') -Encoding utf8
          $receipt | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Write-Host 'W01_EXACT_SOURCE_SHA_TREE_AND_PILOT_ANCESTRY=PASS'
          Write-Host 'W01_PROTECTED_BRANCHES_AND_OWNER_DATA_UNTOUCHED=PASS'

      - name: Set up hosted Windows Go and build-time vendor tooling
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: false

      - name: Compile, launch, observe window and enforce disarmed backend
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          if((& go env GOVERSION).Trim() -cne 'go1.26.10'){throw 'W01_REVIEWED_WINDOWS_GO_TOOLCHAIN_DRIFT'}
          # Match the successful native-Windows test's temporary fixture root.
          # These paths are ephemeral and contain no owner-installed profile.
          $env:TEMP=$env:RUNNER_TEMP
          $env:TMP=$env:RUNNER_TEMP
          $root=$env:GITHUB_WORKSPACE
          $log=Join-Path $env:RUNNER_TEMP 'w01-private-compile.log'
          $sandboxRoot=Join-Path ([IO.Path]::GetTempPath()) ('ktrade-w01-'+[Guid]::NewGuid().ToString('N'))
          $stage=Join-Path $sandboxRoot 'KTRADE-WailsPilot'
          $buildRoot=Join-Path $sandboxRoot 'source'
          $archive=Join-Path $sandboxRoot 'source.tar'
          $parent=$null
          $child=$null
          $http=$null
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          New-Item -ItemType Directory -Path $buildRoot -Force | Out-Null
          try {
            Push-Location $root
            try {
              & node scripts/wails_w01_source_provenance.cjs
              if($LASTEXITCODE -ne 0){throw 'W01_PRE_BUILD_SOURCE_DRIFT'}
              & git archive --format=tar --output $archive $env:W01_EXPECTED_SHA
              if($LASTEXITCODE -ne 0){throw 'W01_PINNED_SOURCE_ARCHIVE_FAILED'}
              & tar -xf $archive -C $buildRoot
              if($LASTEXITCODE -ne 0){throw 'W01_PINNED_SOURCE_EXTRACT_FAILED'}
            } finally {Pop-Location}
            Push-Location $buildRoot
            try {
              & go build -mod=readonly -tags=ktrade_full -o (Join-Path $stage 'ktrade-engine.exe') ./cmd/ktrade *> $log
              if($LASTEXITCODE -ne 0){throw 'W01_ORIGINAL_ENGINE_BUILD_FAILED_PRIVATE_OUTPUT_WITHHELD'}
              Write-Host 'W01_ORIGINAL_GO_BACKEND_BUILD=PASS'
              & npm ci --ignore-scripts --no-audit --no-fund --silent *> $log
              if($LASTEXITCODE -ne 0){throw 'W01_LOCKED_FRONTEND_VENDOR_INSTALL_FAILED_PRIVATE_OUTPUT_WITHHELD'}
              & node scripts/stage_offline_vendor.cjs *> $log
              if($LASTEXITCODE -ne 0){throw 'W01_ORIGINAL_OFFLINE_MONACO_ASSET_STAGING_FAILED_PRIVATE_OUTPUT_WITHHELD'}
              foreach($name in @('static','templates','strategies')){
                Copy-Item -LiteralPath (Join-Path $buildRoot $name) -Destination (Join-Path $stage $name) -Recurse -Force
              }
              foreach($file in @('static/vendor/monaco/vs/loader.js','static/vendor/lightweight-charts/lightweight-charts.standalone.production.js')){
                if(-not (Test-Path -LiteralPath (Join-Path $stage $file) -PathType Leaf)){throw 'W01_ORIGINAL_CHART_EDITOR_ASSET_MISSING'}
              }
              Write-Host 'W01_OFFLINE_MONACO_AND_CHART_ASSETS=PASS'
              # W36 is staging-only and restricted to this exact PR head.
              if($env:GITHUB_EVENT_NAME -ceq 'pull_request' -and
                 $env:GITHUB_HEAD_REF -ceq 'feature/rb3-w36-wails-candle-pine-render-20261106') {
                & node --check tests/w36_wails_render_bridge.js
                if($LASTEXITCODE -ne 0){throw 'W36_STAGED_RENDER_SCRIPT_SYNTAX_INVALID'}
                $source=Join-Path $buildRoot 'tests/w36_wails_render_bridge.js'
                $target=Join-Path $stage 'static/w36_wails_render_bridge.js'
                if(-not (Test-Path -LiteralPath $source -PathType Leaf) -or
                   (Test-Path -LiteralPath $target)){throw 'W36_SOURCE_COLLISION'}
                Copy-Item -LiteralPath $source -Destination $target
                $chartPath=Join-Path $stage 'templates/chart.tmpl'
                $chartText=[IO.File]::ReadAllText($chartPath)
                if(([regex]::Matches($chartText,'</body>')).Count -ne 1 -or
                   $chartText.Contains('w36_wails_render_bridge')){throw 'W36_STAGED_CHART_DRIFT'}
                $tag='<script src="/static/w36_wails_render_bridge.js"></script>'
                [IO.File]::WriteAllText($chartPath,
                   $chartText.Replace('</body>',$tag+[Environment]::NewLine+'</body>'),
                   [Text.UTF8Encoding]::new($false))
                Write-Host 'W36_TEST_ONLY_STAGED_ORIGINAL_CHART=PASS'
              }
              # W37 test-only stage of original chart; never shipping source.
              if($env:KTRADE_QFORGE_W40_PINNED -ceq '1') {
                & node --check tests/w37_wails_sync_bridge.js
                if($LASTEXITCODE -ne 0){throw 'W37_SCRIPT_SYNTAX_INVALID'}
                $w37Source=Join-Path $buildRoot 'tests/w37_wails_sync_bridge.js'
                $w37Target=Join-Path $stage 'static/w37_wails_sync_bridge.js'
                if(-not (Test-Path -LiteralPath $w37Source -PathType Leaf) -or
                   (Test-Path -LiteralPath $w37Target)){throw 'W37_STAGED_SCRIPT_COLLISION'}
                Copy-Item -LiteralPath $w37Source -Destination $w37Target
                $w37Path=Join-Path $stage 'templates/chart.tmpl'
                $w37Chart=[IO.File]::ReadAllText($w37Path)
                # Exact shipping navigation guard (W38 Pine allocation fence).
                # Fail closed on source drift rather than accepting arbitrary matching text.
                $syncAnchor='    if(syncing||this._chartSyncSuspended>0||!r) return;'
                if($w37Chart.Split([string[]]@($syncAnchor),[StringSplitOptions]::None).Count -ne 2 -or
                   ([regex]::Matches($w37Chart,'</body>')).Count -ne 1 -or
                   $w37Chart.Contains('w37_wails_sync_bridge')){throw 'W37_ORIGINAL_CHART_SYNC_ANCHOR_DRIFT'}
                $w37Guard="    if(window.__KTRADE_W37_SYNC_MODE==='all_off' || " +
                  "(window.__KTRADE_W37_SYNC_MODE==='follower_off' && src!==this.s.chart))return;"
                $w37Chart=$w37Chart.Replace($syncAnchor,$w37Guard+[Environment]::NewLine+$syncAnchor)
                $w37Tag='<script src="/static/w37_wails_sync_bridge.js"></script>'
                # W40: synthetic-only real chart observer, never shipped.
                & node --check tests/w40_wails_native_chart_bridge.js
                if($LASTEXITCODE -ne 0){throw 'W40_STAGED_OBSERVER_SYNTAX_FAILED'}
                $w40Source=Join-Path $buildRoot 'tests/w40_wails_native_chart_bridge.js'
                $w40Target=Join-Path $stage 'static/w40_wails_native_chart_bridge.js'
                if(-not (Test-Path -LiteralPath $w40Source -PathType Leaf) -or
                   (Test-Path -LiteralPath $w40Target)){throw 'W40_STAGED_OBSERVER_SOURCE_COLLISION'}
                Copy-Item -LiteralPath $w40Source -Destination $w40Target
                $w40Tag='<script src="/static/w40_wails_native_chart_bridge.js"></script>'
                $w37Chart=$w37Chart.Replace('</body>',$w40Tag+[Environment]::NewLine+'</body>')
                [IO.File]::WriteAllText($w37Path,
                  $w37Chart.Replace('</body>',$w37Tag+[Environment]::NewLine+'</body>'),
                  [Text.UTF8Encoding]::new($false))
                Write-Host 'W37_DISPOSABLE_ORIGINAL_SYNC_INSTRUMENTATION=PASS'
              }
              # W35 runs only for the exact PR branch in a disposable
              # staged copy. It does not alter the shipping chart template.
              if($env:GITHUB_EVENT_NAME -ceq 'pull_request' -and
                 $env:GITHUB_HEAD_REF -ceq 'feature/rb3-w35-real-wails-iframe-compile-20261106') {
                & node --check tests/w35_wails_compile_bridge.js
                if($LASTEXITCODE -ne 0){throw 'W35_STAGED_SCRIPT_SYNTAX_INVALID'}
                $sourceScript=Join-Path $buildRoot 'tests/w35_wails_compile_bridge.js'
                $stagedScript=Join-Path $stage 'static/w35_wails_compile_bridge.js'
                if(-not (Test-Path -LiteralPath $sourceScript -PathType Leaf) -or
                   (Test-Path -LiteralPath $stagedScript)){throw 'W35_STAGED_SCRIPT_SOURCE_DRIFT'}
                Copy-Item -LiteralPath $sourceScript -Destination $stagedScript
                $chartFile=Join-Path $stage 'templates/chart.tmpl'
                $chartText=[IO.File]::ReadAllText($chartFile)
                if(([regex]::Matches($chartText,'</body>')).Count -ne 1 -or
                   $chartText.Contains('w35_wails_compile_bridge')){throw 'W35_STAGED_CHART_IDENTITY_DRIFT'}
                $insert='<script src="/static/w35_wails_compile_bridge.js"></script>'
                [IO.File]::WriteAllText($chartFile,$chartText.Replace('</body>',$insert+[Environment]::NewLine+'</body>'),[Text.UTF8Encoding]::new($false))
                Write-Host 'W35_ORIGINAL_CHART_TEST_ONLY_STAGE=PASS'
              }
            } finally {Pop-Location}
            Push-Location (Join-Path $buildRoot 'tools/wails-pilot')
            try {
              & go mod verify *> $log
              if($LASTEXITCODE -ne 0){throw 'W01_WAILS_DEPENDENCY_VERIFICATION_FAILED_PRIVATE_OUTPUT_WITHHELD'}
              & go test -mod=readonly -count=1 ./backend *> $log
              if($LASTEXITCODE -ne 0){
                # Only deterministic Go test identifiers are public. Keep
                # private compiler/test output out of Actions logs and artifacts.
                $failedNames=@(Get-Content -LiteralPath $log | ForEach-Object {
                  if($_ -match '^--- FAIL: ([A-Za-z][A-Za-z0-9_]{0,120}) '){$Matches[1]}
                } | Sort-Object -Unique)
                if($failedNames.Count -gt 0){
                  Write-Host ('W01_FAILED_TEST_NAMES='+($failedNames -join ','))
                }else{Write-Host 'W01_BACKEND_FAILURE_DETAIL_WITHHELD'}
                throw 'W01_BACKEND_FOCUSED_TEST_FAILED_PRIVATE_OUTPUT_WITHHELD'
              }
              & go vet -mod=readonly ./backend *> $log
              if($LASTEXITCODE -ne 0){throw 'W01_BACKEND_VET_FAILED_PRIVATE_OUTPUT_WITHHELD'}
              Write-Host 'W01_BACKEND_TESTS_AND_VET=PASS'
              & go build -mod=readonly -tags desktop,production,w01probe -o (Join-Path $stage 'ktrade-wails-pilot.exe') . *> $log
              if($LASTEXITCODE -ne 0){throw 'W01_WAILS_WINDOWS_BUILD_FAILED_PRIVATE_OUTPUT_WITHHELD'}
              Write-Host 'W01_WAILS_WEBVIEW2_EXE_BUILT=PASS'
            } finally {Pop-Location}
            foreach($binary in @('ktrade-engine.exe','ktrade-wails-pilot.exe')){
              $hash=(Get-FileHash -LiteralPath (Join-Path $stage $binary) -Algorithm SHA256).Hash.ToLowerInvariant()
              Write-Host ('W01_BINARY_SHA256 '+$binary+'='+$hash)
            }
            $exe=Join-Path $stage 'ktrade-wails-pilot.exe'
            # W01-only binary receives an explicit disarmed test admission
            # and writes one fixed receipt under the isolated runner TEMP.
            # Normal production Wails build excludes this probe completely.
            if($env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS){throw 'W01_WEBVIEW2_PREEXISTING_FLAGS_REFUSED'}
            if($env:KTRADE_W01_DOM_PROBE -or $env:KTRADE_W01_DOM_RECEIPT){throw 'W01_PREEXISTING_PROBE_ENV_REFUSED'}
            $env:KTRADE_W01_DOM_PROBE='1'
            $env:KTRADE_W01_DOM_RECEIPT=Join-Path $env:RUNNER_TEMP 'w01-runtime-probe.txt'
            if(Test-Path -LiteralPath $env:KTRADE_W01_DOM_RECEIPT){throw 'W01_PREEXISTING_PROBE_RECEIPT_REFUSED'}
            if($env:GITHUB_EVENT_NAME -ceq 'pull_request' -and
               $env:GITHUB_HEAD_REF -ceq 'feature/rb3-w36-wails-candle-pine-render-20261106') {
              if($env:KTRADE_W36_RENDER_PROBE -or $env:KTRADE_W36_RENDER_RECEIPT) {
                throw 'W36_PREEXISTING_TEST_ENV_REFUSED'
              }
              $env:KTRADE_W36_RENDER_PROBE='1'
              $env:KTRADE_W36_RENDER_RECEIPT=Join-Path $env:RUNNER_TEMP 'w36-runtime-render.txt'
              if(Test-Path -LiteralPath $env:KTRADE_W36_RENDER_RECEIPT) {
                throw 'W36_PREEXISTING_RECEIPT_REFUSED'
              }
            }
            # W37 reuses the W01 disarmed native pilot and nonce receipt.
            if($env:KTRADE_QFORGE_W40_PINNED -ceq '1') {
              if($env:KTRADE_W36_RENDER_PROBE -or $env:KTRADE_W36_RENDER_RECEIPT){throw 'W37_PREEXISTING_ENV_REFUSED'}
              $env:KTRADE_W36_RENDER_PROBE='1'
              $env:KTRADE_W36_RENDER_RECEIPT=Join-Path $env:RUNNER_TEMP 'w36-runtime-render.txt'
              if(Test-Path -LiteralPath $env:KTRADE_W36_RENDER_RECEIPT){throw 'W37_PREEXISTING_RECEIPT_REFUSED'}
              # Single-use native mouse observer. All receipts live in the disposable runner TEMP.
              if($env:KTRADE_W39_NATIVE_INPUT_PROBE -or $env:KTRADE_W39_GEOMETRY_RECEIPT -or
                 $env:KTRADE_W39_CLOSED_RECEIPT -or $env:KTRADE_W39_REOPENED_RECEIPT){
                throw 'W39_PREEXISTING_TEST_ENV_REFUSED'
              }
              $env:KTRADE_W39_NATIVE_INPUT_PROBE='1'
              if($env:KTRADE_W40_DIAG_RECEIPT){throw 'W40_PREEXISTING_DIAGNOSTIC_REFUSED'}
              $env:KTRADE_W40_DIAG_RECEIPT=Join-Path $env:RUNNER_TEMP 'w40-diagnostic.txt'
              if(Test-Path -LiteralPath $env:KTRADE_W40_DIAG_RECEIPT){throw 'W40_EXISTING_DIAGNOSTIC_REFUSED'}
              if($env:KTRADE_W40_NATIVE_CHART_PROBE -or $env:KTRADE_W40_CHART_GEOMETRY_RECEIPT -or
                 $env:KTRADE_W40_CHART_ZOOMED_RECEIPT -or $env:KTRADE_W40_CHART_PANNED_RECEIPT -or
                 $env:KTRADE_W40_EDITOR_GEOMETRY_RECEIPT -or $env:KTRADE_W40_EDITOR_FOCUSED_RECEIPT){
                throw 'W40_PREEXISTING_TEST_ENV_REFUSED'
              }
              $env:KTRADE_W40_NATIVE_CHART_PROBE='1'
              $env:KTRADE_W40_CHART_GEOMETRY_RECEIPT=Join-Path $env:RUNNER_TEMP 'w40-chart-geometry.txt'
              $env:KTRADE_W40_CHART_ZOOMED_RECEIPT=Join-Path $env:RUNNER_TEMP 'w40-chart-zoomed.txt'
              $env:KTRADE_W40_CHART_PANNED_RECEIPT=Join-Path $env:RUNNER_TEMP 'w40-chart-panned.txt'
              $env:KTRADE_W40_EDITOR_GEOMETRY_RECEIPT=Join-Path $env:RUNNER_TEMP 'w40-editor-geometry.txt'
              $env:KTRADE_W40_EDITOR_FOCUSED_RECEIPT=Join-Path $env:RUNNER_TEMP 'w40-editor-focused.txt'
              foreach($receipt in @($env:KTRADE_W40_CHART_GEOMETRY_RECEIPT,
                  $env:KTRADE_W40_CHART_ZOOMED_RECEIPT,$env:KTRADE_W40_CHART_PANNED_RECEIPT,
                  $env:KTRADE_W40_EDITOR_GEOMETRY_RECEIPT,$env:KTRADE_W40_EDITOR_FOCUSED_RECEIPT)){
                if(Test-Path -LiteralPath $receipt){throw 'W40_RECEIPT_ALREADY_EXISTS'}
              }
              $env:KTRADE_W39_GEOMETRY_RECEIPT=Join-Path $env:RUNNER_TEMP 'w39-native-geometry.txt'
              $env:KTRADE_W39_CLOSED_RECEIPT=Join-Path $env:RUNNER_TEMP 'w39-native-closed.txt'
              $env:KTRADE_W39_REOPENED_RECEIPT=Join-Path $env:RUNNER_TEMP 'w39-native-reopened.txt'
              foreach($file in @($env:KTRADE_W39_GEOMETRY_RECEIPT,$env:KTRADE_W39_CLOSED_RECEIPT,$env:KTRADE_W39_REOPENED_RECEIPT)){
                if(Test-Path -LiteralPath $file){throw 'W39_PREEXISTING_RECEIPT_REFUSED'}
              }
            }
            if($env:GITHUB_EVENT_NAME -ceq 'pull_request' -and
               $env:GITHUB_HEAD_REF -ceq 'feature/rb3-w35-real-wails-iframe-compile-20261106') {
              if($env:KTRADE_W35_COMPILE_PROBE -or $env:KTRADE_W35_COMPILE_RECEIPT) {
                throw 'W35_PREEXISTING_TEST_ENV_REFUSED'
              }
              $env:KTRADE_W35_COMPILE_PROBE='1'
              $env:KTRADE_W35_COMPILE_RECEIPT=Join-Path $env:RUNNER_TEMP 'w35-runtime-compile.txt'
              if(Test-Path -LiteralPath $env:KTRADE_W35_COMPILE_RECEIPT) {
                throw 'W35_PREEXISTING_RECEIPT_REFUSED'
              }
            }
            $parent=Start-Process -FilePath $exe -WorkingDirectory $stage -PassThru
            $window=$false
            $deadline=(Get-Date).AddSeconds(45)
            while((Get-Date) -lt $deadline){
              Start-Sleep -Milliseconds 750
              $parent.Refresh()
              if($parent.HasExited){throw 'W01_WAILS_PROCESS_EXITED_BEFORE_WINDOW'}
              if($parent.MainWindowHandle -ne [IntPtr]::Zero){$window=$true;break}
            }
            if(-not $window){throw 'W01_GENUINE_WEBVIEW2_WINDOW_NOT_VISIBLE'}
            Write-Host 'W01_REAL_WINDOWS_DESKTOP_WINDOW=PASS'
            # Read the actual native Wails window DPI without modifying host
            # display settings. This does NOT qualify the 125/150/200% matrix.
            Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; public static class W01NativeDisplay { [DllImport("user32.dll")] public static extern uint GetDpiForWindow(IntPtr hWnd); }'
            $windowDpi=[W01NativeDisplay]::GetDpiForWindow($parent.MainWindowHandle)
            if($windowDpi -lt 96 -or $windowDpi -gt 384){throw 'W01_NATIVE_WINDOW_DPI_INVALID'}
            Write-Host ('W01_NATIVE_WINDOW_REPORTED_DPI='+$windowDpi)
            Write-Host 'W01_INTERACTIVE_EDITOR_CHART_AND_DPI_MATRIX_NOT_YET_QUALIFIED'
            $backendPath=(Join-Path $stage 'ktrade-engine.exe')
            $deadline=(Get-Date).AddSeconds(12)
            while((Get-Date) -lt $deadline){
              $child=@(Get-CimInstance Win32_Process -Filter "name='ktrade-engine.exe'" | Where-Object {
                $_.ExecutablePath -ieq $backendPath -and $_.ParentProcessId -eq $parent.Id
              })
              if($child.Count -eq 1){break}
              Start-Sleep -Milliseconds 400
            }
            if($child.Count -ne 1){throw 'W01_ORIGINAL_GO_CHILD_MISSING'}
            $listener=@(Get-NetTCPConnection -State Listen -OwningProcess $child[0].ProcessId -ErrorAction SilentlyContinue)
            if($listener.Count -ne 1 -or $listener[0].LocalAddress -cne '127.0.0.1'){throw 'W01_EXACTLY_ONE_LOOPBACK_LISTENER_REQUIRED'}
            $base='http://127.0.0.1:'+$listener[0].LocalPort
            $http=[System.Net.Http.HttpClient]::new()
            $http.Timeout=[TimeSpan]::FromSeconds(12)
            $caps=$http.GetAsync($base+'/api/operator/capabilities').GetAwaiter().GetResult()
            if([int]$caps.StatusCode -ne 200){throw 'W01_CAPABILITY_HTTP_NOT_OK'}
            $c=($caps.Content.ReadAsStringAsync().GetAwaiter().GetResult() | ConvertFrom-Json)
            if($c.schema -cne 'ktrade.operator.capabilities.v1' -or $c.mode -cne 'PAPER_STOPPED' -or
              $c.paper_orders_enabled -ne $false -or $c.live_orders_enabled -ne $false -or
              $c.strategy_execution_enabled -ne $false -or $c.paper_accounting_enabled -ne $false -or
              $c.requires_review -ne $true){throw 'W01_APP_DID_NOT_PROVE_DISARMED'}
            Write-Host 'W01_ORIGINAL_GO_CAPABILITIES_FAIL_CLOSED=PASS'
            $chart=$http.GetAsync($base+'/chart').GetAwaiter().GetResult()
            if([int]$chart.StatusCode -ne 200 -or
               -not ($chart.Content.ReadAsStringAsync().GetAwaiter().GetResult()).Contains('pine-editor-main')){throw 'W01_ORIGINAL_CHART_HTTP_MISSING'}
            foreach($asset in @('/static/vendor/monaco/vs/loader.js','/static/vendor/lightweight-charts/lightweight-charts.standalone.production.js')){
              $result=$http.GetAsync($base+$asset).GetAwaiter().GetResult()
              if([int]$result.StatusCode -ne 200){throw 'W01_ORIGINAL_OFFLINE_ASSET_HTTP_FAILED'}
            }
            Write-Host 'W01_ORIGINAL_CHART_AND_EDITOR_HTTP_ASSETS=PASS'
            $body=[System.Net.Http.StringContent]::new('{}',[Text.Encoding]::UTF8,'application/json')
            $locked=$http.PostAsync($base+'/api/paper/session/start',$body).GetAwaiter().GetResult()
            if([int]$locked.StatusCode -ne 423){throw 'W01_PAPER_START_NOT_LOCKED'}
            $lockedOrder=$http.PostAsync($base+'/api/orders/place',[System.Net.Http.StringContent]::new('{}',[Text.Encoding]::UTF8,'application/json')).GetAwaiter().GetResult()
            if([int]$lockedOrder.StatusCode -ne 423){throw 'W01_LEGACY_ORDERS_NOT_LOCKED'}
            Write-Host 'W01_PAPER_AND_LEGACY_LIVE_ORDER_ROUTES_LOCKED=PASS'
            # W34 uses an independent disposable installed Chromium profile
            # against the exact already-disarmed original Go /chart listener.
