name: KTRADE DIC-15 offline downgrade source admission
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ktrade-dic15-one-shot.yml

permissions:
  contents: read

jobs:
  qualify:
    if: github.repository == 'spoonman136668-ai/Qualification-Forge'
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      KTRADE_EXPECTED_SOURCE_SHA: 'e5d6d45ef7334daf2f0dc7572897e1aacedcd7d0'
      KTRADE_CI_SOURCE_ONLY: '1'
      KTRADE_CI_PAPER_ONLY: '1'
      KTRADE_CI_LIVE_AUTHORITY: '0'
      KTRADE_CI_COINBASE_ALLOWED: '0'
      KTRADE_CI_PROMOTION_ALLOWED: '0'
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
    steps:
      - name: Require isolated hosted Windows and no live authority
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_OS -cne 'Windows' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted'){throw 'DIC15_UNTRUSTED_VM'}
          if($env:KTRADE_CI_LIVE_AUTHORITY -cne '0' -or $env:KTRADE_CI_PROMOTION_ALLOWED -cne '0'){throw 'DIC15_AUTHORITY_ENABLED'}
          Write-Host 'DIC15_HOSTED_WINDOWS=PASS'
      - name: Checkout immutable private draft source with no token persistence
        uses: actions/checkout@v4
        with:
          repository: spoonman136668-ai/ckb
          ref: ${{ env.KTRADE_EXPECTED_SOURCE_SHA }}
          path: checked-private
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.KTRADE_CKB_READ_TOKEN_TEMP }}
      - name: Configure Go without private source cache
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Run exact-source negative version tests and full Windows regression
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $log=Join-Path $env:RUNNER_TEMP 'dic15-private.log'
          Push-Location (Join-Path $env:GITHUB_WORKSPACE 'checked-private')
          try{
            $actual=(& git rev-parse HEAD).Trim()
            if($LASTEXITCODE -ne 0 -or $actual -cne $env:KTRADE_EXPECTED_SOURCE_SHA){throw 'DIC15_HEAD_MISMATCH'}
            Write-Host 'DIC15_SOURCE_IDENTITY=PASS'
            function Check([string]$name,[string]$program,[string[]]$arguments) {
              try{
                & $program @arguments *> $log
                if($LASTEXITCODE -ne 0){throw 'NONZERO'}
              }catch{throw ('DIC15_'+$name+'_FAILED_PRIVATE_OUTPUT_WITHHELD')}
              Write-Host ('DIC15_'+$name+'=PASS')
            }
            Check 'FOCUSED_DOWNGRADE_NEGATIVES' 'go' @('test','-count=1','-timeout=180s','./internal/durableupgrade','-run','^TestDIC15')
            Check 'FULL_REGRESSION' 'go' @('test','-count=1','-timeout=420s','./...')
            Check 'VET' 'go' @('vet','./...')
            Check 'GO_BUILD' 'go' @('build','./...')
            Check 'FOUR_WINDOWS_EXES' 'cmd.exe' @('/d','/c','RUN-BUILD-WINDOWS.cmd')
            if((& git rev-parse HEAD).Trim() -cne $env:KTRADE_EXPECTED_SOURCE_SHA){throw 'DIC15_SOURCE_MOVED'}
            if(@(& git status --porcelain=v1 --untracked-files=no).Count -ne 0){throw 'DIC15_TRACKED_SOURCE_CHANGED'}
            Write-Host 'DIC15_SOURCE_UNCHANGED=PASS'
            Write-Host 'DIC15_NO_INSTALLED_PRODUCTION_OR_BROKER_ACCESS=PASS'
            Write-Host 'DIC15_HISTORICAL_SIGNATURE=BLOCKED_PREDECESSOR_NOT_AVAILABLE'
          }finally{
            Pop-Location
            Remove-Item -LiteralPath $log -Force -ErrorAction SilentlyContinue
          }
      - name: Purge private source without publishing artifacts
        if: always()
        shell: pwsh
        run: |
          $path=Join-Path $env:GITHUB_WORKSPACE 'checked-private'
          if(Test-Path -LiteralPath $path){Remove-Item -LiteralPath $path -Recurse -Force -ErrorAction SilentlyContinue}
          Write-Host 'DIC15_PUBLIC_PRIVATE_ARTIFACT_UPLOAD=DISABLED'
