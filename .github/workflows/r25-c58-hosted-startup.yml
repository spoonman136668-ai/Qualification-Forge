name: R25-C58 isolated KTRADE full-app startup on hosted Windows
on:
  push:
    branches: [qualification/r25-c58-hosted-startup-20261019]
    paths: [.github/workflows/r25-c58-hosted-startup.yml]
permissions:
  contents: read
concurrency:
  group: r25-c58-hosted-isolated
  cancel-in-progress: false
jobs:
  isolated-startup:
    if: github.repository == 'spoonman136668-ai/Qualification-Forge'
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      SOURCE_SHA: '4f5bff348b8d3fcd4b1bc8b48f129b517fa66512'
      SOURCE_TREE: 'd5570245197e86fdf2c64b2b89a0c8b59e5cd94e'
      KTRADE_CI_PAPER_ONLY: '1'
      KTRADE_CI_LIVE_AUTHORITY: '0'
      KTRADE_CI_COINBASE_ALLOWED: '0'
      KTRADE_CI_PROMOTION_ALLOWED: '0'
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
    steps:
      - name: Assert dedicated disposable hosted runner
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or
              $env:RUNNER_OS -cne 'Windows' -or
              $env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/Qualification-Forge' -or
              $env:KTRADE_CI_PAPER_ONLY -cne '1' -or
              $env:KTRADE_CI_LIVE_AUTHORITY -cne '0' -or
              $env:KTRADE_CI_COINBASE_ALLOWED -cne '0' -or
              $env:KTRADE_CI_PROMOTION_ALLOWED -cne '0') {
            throw 'R25_C58_EXECUTION_CONTEXT_OR_AUTHORITY_DRIFT'
          }
          Write-Host 'R25_C58_GITHUB_HOSTED_WINDOWS=PASS'
          Write-Host 'R25_C58_LOCAL_WORKSTATION_USED=FALSE'
      - name: Checkout exact KTRADE source using existing read token
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: spoonman136668-ai/ktrade
          ref: 4f5bff348b8d3fcd4b1bc8b48f129b517fa66512
          fetch-depth: 1
          path: source
          persist-credentials: false
          token: ${{ secrets.KTRADE_SOURCE_READ_TOKEN }}
      - name: Verify source and build prerequisites
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference='Stop'
          if ((& git rev-parse HEAD).Trim() -cne $env:SOURCE_SHA -or
              (& git rev-parse 'HEAD^{tree}').Trim() -cne $env:SOURCE_TREE -or
              @(& git status --porcelain=v1 --untracked-files=no).Count -ne 0) {
            throw 'R25_C58_PINNED_SOURCE_DRIFT'
          }
          foreach($path in @('cmd/ktrade/main_full.go','cmd/ktrade/pine_library_compat_full.go','templates/chart.tmpl','static/trading.html')){
            if(-not(Test-Path -LiteralPath $path -PathType Leaf)){throw 'R25_C58_SOURCE_SURFACE_ABSENT'}
          }
          Write-Host 'R25_C58_SOURCE_COMMIT_AND_TREE=PASS'
      - name: Configure frozen Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.23.12'
          cache: false
      - name: Focused tests against the full historical entrypoint
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference='Stop'
          & go test -mod=readonly -tags=ktrade_full -count=1 ./cmd/ktrade -run '^(TestKTradePineLibraryIsolatedRootOnly|TestFullApplicationCannotPostPaperOrdersThroughReviewRoute)$' *> (Join-Path $env:RUNNER_TEMP 'r25-c58-focused-private.log')
          if($LASTEXITCODE -ne 0){throw 'R25_C58_FOCUSED_PRIVATE_FAILURE'}
          Write-Host 'R25_C58_FOCUSED_ISOLATION_AND_NO_ORDER_TESTS=PASS'
      - name: Build exact full historical application
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference='Stop'
          & go build -mod=readonly -tags=ktrade_full -o ktrade-r25c58.exe ./cmd/ktrade *> (Join-Path $env:RUNNER_TEMP 'r25-c58-build-private.log')
          if($LASTEXITCODE -ne 0 -or -not(Test-Path -LiteralPath 'ktrade-r25c58.exe' -PathType Leaf)){
            throw 'R25_C58_FULL_APP_BUILD_PRIVATE_FAILURE'
          }
          Write-Host 'R25_C58_AUTHENTIC_FULL_APP_BUILD=PASS'
      - name: Run loopback-only startup with redirected writable storage
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference='Stop'
          $sandbox=Join-Path $env:RUNNER_TEMP ('r25-c58-'+$env:GITHUB_RUN_ID)
          if(Test-Path -LiteralPath $sandbox){throw 'R25_C58_TEMP_COLLISION'}
          $null=New-Item -Path $sandbox -ItemType Directory
          $pine=Join-Path $sandbox 'pine'
          $roaming=Join-Path $sandbox 'Roaming'
          $local=Join-Path $sandbox 'Local'
          $null=New-Item -ItemType Directory -Path $roaming,$local
          $exe=Join-Path (Get-Location).Path 'ktrade-r25c58.exe'
          $psi=[Diagnostics.ProcessStartInfo]::new($exe)
          $psi.WorkingDirectory=(Get-Location).Path
          $psi.UseShellExecute=$false
          $psi.RedirectStandardOutput=$true
          $psi.RedirectStandardError=$true
          $psi.Environment['KTRADE_RECOVERY_ISOLATED']='1'
          $psi.Environment['KTRADE_USE_LEGACY_CDP_CONFIG']='0'
          $psi.Environment['KTRADE_PINE_LIBRARY_ROOT']=$pine
          $psi.Environment['APPDATA']=$roaming
          $psi.Environment['LOCALAPPDATA']=$local
          $psi.Environment['HTTP_PROXY']='http://127.0.0.1:9'
          $psi.Environment['HTTPS_PROXY']='http://127.0.0.1:9'
          $psi.Environment['ALL_PROXY']='http://127.0.0.1:9'
          $psi.Environment['NO_PROXY']='localhost,127.0.0.1,::1'
          $process=$null
          try{
            $process=[Diagnostics.Process]::Start($psi)
            if(!$process){throw 'R25_C58_PROCESS_START_FAILED'}
            $errorRead=$process.StandardError.ReadToEndAsync()
            $outputRead=$process.StandardOutput.ReadToEndAsync()
            $clock=[Diagnostics.Stopwatch]::StartNew()
            $port=$null
            while($clock.Elapsed.TotalSeconds -lt 45){
              if($process.HasExited){throw 'R25_C58_PREMATURE_EXIT'}
              $ports=@(Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue | Where-Object {
                $_.OwningProcess -eq $process.Id -and $_.LocalAddress -ceq '127.0.0.1' -and $_.LocalPort -ge 1024
              })
              if($ports.Count -gt 1){throw 'R25_C58_MULTIPLE_LISTENERS'}
              if($ports.Count -eq 1){$port=[int]$ports[0].LocalPort;break}
              Start-Sleep -Milliseconds 250
            }
            if(!$port){throw 'R25_C58_ISOLATED_LISTEN_TIMEOUT'}
            foreach($endpoint in @('/chart','/api/pine/metrics','/api/pine-library')){
              $response=Invoke-WebRequest -UseBasicParsing -NoProxy -TimeoutSec 10 -Uri ("http://127.0.0.1:"+$port+$endpoint)
              if([int]$response.StatusCode -ne 200){throw 'R25_C58_HTTP_SMOKE_FAILURE'}
            }
            if(!(Test-Path -LiteralPath $pine -PathType Container) -or
               !(Test-Path -LiteralPath (Join-Path $pine 'index.json') -PathType Leaf)){
              throw 'R25_C58_ISOLATED_PINE_STORAGE_NOT_WRITTEN'
            }
            if((Test-Path -LiteralPath (Join-Path $roaming 'KTRADE') -PathType Container) -or
               (Test-Path -LiteralPath (Join-Path $local 'KTRADE') -PathType Container)){
              throw 'R25_C58_UNEXPECTED_DEFAULT_KTRADE_STATE'
            }
            Write-Host 'R25_C58_EPHEMERAL_LOOPBACK_APP_STARTED=PASS'
            Write-Host 'R25_C58_CHART_PINE_METRICS_LIBRARY_HTTP=PASS'
            Write-Host 'R25_C58_WRITABLE_PINE_STATE_ISOLATED=PASS'
            Write-Host 'R25_C58_BROKER_ORDERS_SUBMITTED=FALSE'
            Write-Host 'R25_C58_ORIGINAL_INSTALLED_STATE_ACCESSED=FALSE'
            Write-Host 'R25_C58_APPLICATION_RESTORE_VERIFIED=FALSE'
          }finally{
            if($process){
              if(!$process.HasExited){
                $process.Kill($true)
                [void]$process.WaitForExit(10000)
              }
              $process.Dispose()
            }
          }
      - name: Retain only sanitized classification markers
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $source=Join-Path $env:GITHUB_WORKSPACE 'source'
          if(Test-Path -LiteralPath $source){
            Push-Location $source
            try{
              if((& git rev-parse HEAD).Trim() -cne $env:SOURCE_SHA -or
                 @(& git status --porcelain=v1 --untracked-files=no).Count -ne 0){
                throw 'R25_C58_TRACKED_SOURCE_DRIFT'
              }
            }finally{Pop-Location}
          }
          foreach($name in @('r25-c58-focused-private.log','r25-c58-build-private.log')){
            $file=Join-Path $env:RUNNER_TEMP $name
            if(Test-Path -LiteralPath $file){Remove-Item -LiteralPath $file -Force}
          }
          Write-Host 'R25_C58_SOURCE_TRACKED_FILES_UNCHANGED=PASS'
          Write-Host 'R25_C58_PRIVATE_SOURCE_ARTIFACT_UPLOAD=FALSE'
          Write-Host 'R25_C58_LOCAL_RESEARCH_RUNNERS_USED=FALSE'
          Write-Host 'R25_C58_RELEASE_AUTHORIZED=FALSE'
