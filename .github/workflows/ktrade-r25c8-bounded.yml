name: KTRADE R25-C8 exact-parent wire and vet differential
on:
  push:
    branches: [qualification/ktrade-r25c8-bounded-20261018]
    paths: [.github/workflows/ktrade-r25c8-bounded.yml]
permissions:
  contents: read
jobs:
  qualify-parent-and-candidate:
    if: github.repository == 'spoonman136668-ai/Qualification-Forge'
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      GOFLAGS: '-p=2'
      GOMAXPROCS: '2'
      KTRADE_CI_COINBASE_ALLOWED: '0'
      KTRADE_CI_LIVE_AUTHORITY: '0'
      KTRADE_CI_PROMOTION_ALLOWED: '0'
    steps:
      - name: Checkout exact private KTRADE candidate and immutable parent
        uses: actions/checkout@v4
        with:
          repository: spoonman136668-ai/ktrade
          ref: a35fe1188fc24614bd1a1cdd2b11289eb553afb8
          path: source
          persist-credentials: false
          fetch-depth: 2
          token: ${{ secrets.KTRADE_SOURCE_READ_TOKEN }}
      - name: Setup pinned Go version
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Check pre-remediation fingerprints, patched wire, and focused vet
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $original = '3b7cb115614cbc2ab04a929e0fcba820022054b3'
          $candidate = 'a35fe1188fc24614bd1a1cdd2b11289eb553afb8'
          $originalTree = 'feae39a8e236a7d1485ce416b1b1b143521fbf00'
          $candidateTree = '7c1026b4ee2e8f57c0923ba75320738f99f9f7c6'
          $root = Join-Path $env:GITHUB_WORKSPACE 'source'
          $testFile = Join-Path $root 'pkg/r25c8_governance_wire_compat_test.go'
          $frozenTest = Join-Path $env:RUNNER_TEMP 'r25c8_exact_test.go'
          $log = Join-Path $env:RUNNER_TEMP 'r25c8_focused.log'
          try {
            if ($env:RUNNER_OS -cne 'Windows' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted') { throw 'R25C8_HOST_INVALID' }
            if ($env:KTRADE_CI_COINBASE_ALLOWED -cne '0' -or $env:KTRADE_CI_LIVE_AUTHORITY -cne '0' -or $env:KTRADE_CI_PROMOTION_ALLOWED -cne '0') { throw 'R25C8_UNSAFE_AUTHORITY' }
            $gotHead = (& git -C $root rev-parse HEAD).Trim()
            $gotParent = (& git -C $root rev-parse HEAD^).Trim()
            $gotTree = (& git -C $root rev-parse 'HEAD^{tree}').Trim()
            if ($gotHead -cne $candidate -or $gotParent -cne $original -or $gotTree -cne $candidateTree) { throw 'R25C8_SOURCE_IDENTITY_DRIFT' }
            $expectedFiles = @(
              'pkg/p11b_t418_explicit_new_repro_only_release_readiness_governance_closeout_homecoming_pin.go',
              'pkg/p11b_t419_explicit_new_repro_only_release_readiness_governance_closeout_arrival_pin.go',
              'pkg/p11b_t420_explicit_new_repro_only_release_readiness_governance_closeout_landing_pin.go',
              'pkg/p11b_t421_explicit_new_repro_only_release_readiness_governance_closeout_berthing_pin.go',
              'pkg/p11b_t422_explicit_new_repro_only_release_readiness_governance_closeout_mooring_pin.go',
              'pkg/p11b_t423_explicit_new_repro_only_release_readiness_governance_closeout_docking_pin.go',
              'pkg/p11b_t424_explicit_new_repro_only_release_readiness_governance_closeout_harboring_pin.go',
              'pkg/p11b_t425_explicit_new_repro_only_release_readiness_governance_closeout_refuge_pin.go',
              'pkg/p11b_t426_explicit_new_repro_only_release_readiness_governance_closeout_sheltering_pin.go',
              'pkg/p11b_t427_explicit_new_repro_only_release_readiness_governance_closeout_sanctuary_pin.go',
              'pkg/p11b_t428_explicit_new_repro_only_release_readiness_governance_closeout_safehouse_pin.go',
              'pkg/p11b_t429_explicit_new_repro_only_release_readiness_governance_closeout_redoubt_pin.go',
              'pkg/p11b_t430_explicit_new_repro_only_release_readiness_governance_closeout_bulwark_pin.go',
              'pkg/p11b_t431_explicit_new_repro_only_release_readiness_governance_closeout_breakwater_pin.go',
              'pkg/p11b_t432_explicit_new_repro_only_release_readiness_governance_closeout_anchorage_pin.go',
              'pkg/p11b_t433_explicit_new_repro_only_release_readiness_governance_closeout_haven_pin.go',
              'pkg/r25c8_governance_wire_compat_test.go'
            )
            $changed = @(& git -C $root diff --name-only HEAD^ HEAD | Sort-Object)
            if ($LASTEXITCODE -ne 0 -or (Compare-Object $changed ($expectedFiles | Sort-Object))) { throw 'R25C8_SCOPE_DRIFT' }
            $expectedBlobs = @('ee4b462ca8d2524895f48a00ea7d0274be18f533','639f77f902d06b049d0e12a7d5d5212ae70720f9','0b7f9ad2c4915ccbc24700f22c91a955bde067ac','f48795097ce8561c9270a455385c442c598ea199','4ebd7b1b8d0156ac3e5e96c7962d074a7fd9955d','8cd4e52542b614de2d23bd31c7626f9b4c85ad70','661794dae98bb45ce0c450d5426094dfe5373d2d','08109df9d7ff93e0a7b752e5f0c65c2fceb892d3','30d7641bbb497e551db46353e7fb5b4209f45997','9dbf30455391052586b05b38fa3232ff30922eb4','7b9a29ca8203d08e3d4a74ba05878058b885088a','ca99561307fe1851bd609c8c9fe7d4d6b4f0ca5a','415f3579a2a630a9429de3d6976f773891d5ffc2','6ead7b386abd8fe7d62e7149b1cbf6a9d196690a','0207e2e8f9afc31d1e2f770492aeaf41cffd73d6','9e2b1e5478c4e59574d4595eda1af8350e88a3cc')
            for ($i=0; $i -lt 16; $i++) {
              $got = (& git -C $root rev-parse "HEAD^:$($expectedFiles[$i])").Trim()
              if ($LASTEXITCODE -ne 0 -or $got -cne $expectedBlobs[$i]) { throw "R25C8_PARENT_BLOB_DRIFT_$i" }
            }
            Copy-Item -LiteralPath $testFile -Destination $frozenTest
            Push-Location $root
            try {
              & go mod download *> $log
              if ($LASTEXITCODE -ne 0) { throw 'R25C8_MODULE_DOWNLOAD_FAILED' }
              & git checkout --detach $original *> $log
              if ($LASTEXITCODE -ne 0 -or (& git rev-parse 'HEAD^{tree}').Trim() -cne $originalTree) { throw 'R25C8_ORIGINAL_CHECKOUT_FAILED' }
              Copy-Item -LiteralPath $frozenTest -Destination $testFile
              $env:R25C8_ORIGINAL_MODE = '1'
              & go test -vet=off -mod=readonly -count=1 -timeout=300s -v -run '^TestR25C8HistoricalGovernanceJSONWire$' ./pkg *> $log
              if ($LASTEXITCODE -ne 0) {
                Write-Output ('R25C8_PARENT_DIAGNOSTICS='+(Get-Content $log -Tail 30 | Out-String))
                throw 'R25C8_PARENT_WIRE_BASELINE_FAILED'
              }
              $baseline = [string](Get-Content -LiteralPath $log -Raw)
              foreach ($part in @('T418','T419','T420','T421','T422','T423','T424','T425','T426','T427','T428','T429','T430','T431','T432','T433')) {
                $match = [regex]::Match($baseline, ('R25C8_WIRE_'+$part+'_SHA256=([0-9a-f]{64})'))
                if (-not $match.Success) { throw ('R25C8_BASELINE_FINGERPRINT_MISSING_'+$part) }
                [Environment]::SetEnvironmentVariable(('R25C8_EXPECTED_'+$part+'_SHA256'), $match.Groups[1].Value)
                Write-Output ('R25C8_BASELINE_'+$part+'_SHA256='+$match.Groups[1].Value)
              }
              Remove-Item -LiteralPath $testFile -Force
              & git checkout --detach $candidate *> $log
              if ($LASTEXITCODE -ne 0 -or (& git rev-parse 'HEAD^{tree}').Trim() -cne $candidateTree) { throw 'R25C8_RESTORE_FAILED' }
              $env:R25C8_ORIGINAL_MODE = '0'
              & go test -vet=off -mod=readonly -count=1 -timeout=300s -v -run '^TestR25C8HistoricalGovernanceJSONWire$' ./pkg *> $log
              if ($LASTEXITCODE -ne 0) {
                Write-Output ('R25C8_CANDIDATE_DIAGNOSTICS='+(Get-Content $log -Tail 30 | Out-String))
                throw 'R25C8_CANDIDATE_WIRE_FAILED'
              }
              Write-Output 'R25C8_JSON_WIRE_IDENTITY_AND_INBOUND_IGNORE=PASS'
              & go vet -mod=readonly -unsafeptr ./pkg *> $log
              if ($LASTEXITCODE -ne 0) { throw 'R25C8_UNSAFEPTR_FAILED' }
              Write-Output 'R25C8_UNSAFEPTR_ANALYZER=PASS'
              & go vet -mod=readonly -structtag ./pkg *> $log
              $vetExit = $LASTEXITCODE
              $remaining = @(Get-Content -LiteralPath $log -ErrorAction SilentlyContinue | Where-Object {$_ -match '\.go:\d+:\d+:'}).Count
              Write-Output "R25C8_REMAINING_STRUCTTAG_DIAGNOSTICS=$remaining"
              if ($vetExit -eq 0 -or $remaining -ne 3136) { throw 'R25C8_STRUCTTAG_DIFFERENTIAL_MISMATCH' }
              Write-Output 'R25C8_STRUCTTAG_REDUCED_BY=624'
              Write-Output 'R25C8_FOCUSED_WINDOWS_QUALIFICATION=PASS'
              Write-Output 'R25C8_FULL_VET_NOT_PASSED=TRUE'
              Write-Output 'R25C8_FINAL_REGRESSION_NOT_RUN=TRUE'
              $global:LASTEXITCODE = 0
            } finally { Pop-Location }
          } finally {
            Remove-Item -LiteralPath $frozenTest -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $log -Force -ErrorAction SilentlyContinue
          }
      - name: Delete private checkout
        if: always()
        shell: pwsh
        run: |
          Remove-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'source') -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'r25c8_focused.log') -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'r25c8_exact_test.go') -Force -ErrorAction SilentlyContinue
          Write-Output 'R25C8_PRIVATE_CHECKOUT_REMOVED=TRUE'
