name: KTRADE DIC-15 ICE Graphify Obsidian independent qualification
on:
  push:
    branches: [main]
    paths: [.github/workflows/ktrade-dic15-knowledge-one-shot.yml]

permissions:
  contents: write

jobs:
  ktrade-knowledge-inclusion:
    if: github.repository == 'spoonman136668-ai/Qualification-Forge' && github.actor == 'spoonman136668-ai'
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      KTRADE_KNOWLEDGE_EXACT_SHA: '7fcecd9c2e6e2e372f303f86fa98c504aea0e398'
      KTRADE_SOURCE_ONLY: '1'
      KTRADE_LIVE_AUTHORITY: '0'

    steps:
      - name: Require independent hosted source-only Windows
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_OS -cne 'Windows' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted'){throw 'DIC15_NOT_INDEPENDENT_HOSTED_WINDOWS'}
          Write-Host 'DIC15_QUAL_HOSTED_WINDOWS=PASS'

      - name: Checkout original public run receipts
        uses: actions/checkout@v4
        with:
          path: qual-public
          persist-credentials: false

      - name: Checkout pinned private KTRADE knowledge source only
        uses: actions/checkout@v4
        with:
          repository: spoonman136668-ai/ktrade-knowledge
          ref: 7fcecd9c2e6e2e372f303f86fa98c504aea0e398
          path: knowledge-private
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.KTRADE_CKB_READ_TOKEN_TEMP }}
          sparse-checkout: |
            .ice
            README.md
            Graphify/README.md
            Graphify/Source/LAST-BUILD.json
            Graphify/Obsidian/002865cd06_test.go.md
            KTRADE-Knowledge-Vault/CI/DIC-Qualification-Status.md
            tools/verify_ktrade_ice.py
          sparse-checkout-cone-mode: false

      - name: Verify immutable KTRADE knowledge source and fail-closed ICE contract
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:GITHUB_WORKSPACE 'knowledge-private'
          Push-Location $root
          try{
            if((& git rev-parse HEAD).Trim() -cne $env:KTRADE_KNOWLEDGE_EXACT_SHA){throw 'DIC15_KNOWLEDGE_HEAD_IDENTITY'}
            Write-Host 'DIC15_KNOWLEDGE_SHA_PINNED=PASS'
            $log=Join-Path $env:RUNNER_TEMP 'dic15-private-index-check.log'
            try{
              & python tools/verify_ktrade_ice.py *> $log
              if($LASTEXITCODE -ne 0){throw 'DIC15_ICE_INDEX_VALIDATION_FAILED'}
              $lines=@(Get-Content -LiteralPath $log)
              $markers=@('KTRADE_ICE_INDEX_RETRIEVABLE=PASS',
                'KTRADE_GRAPHIFY_PROVENANCE_EXPLICITLY_STALE=PASS',
                'KTRADE_OBSIDIAN_DIC_GATE_LINKS=PASS',
                'KTRADE_HISTORICAL_UPGRADE_STILL_BLOCKED=PASS',
                'KTRADE_RELEASE_AUTHORITY_DISABLED=PASS',
                'KTRADE_ICE_FALSE_PASS_NEGATIVE_CONTROLS=PASS')
              foreach($m in $markers){
                if(@($lines|Where-Object{$_ -ceq $m}).Count -ne 1){throw 'DIC15_MISSING_REQUIRED_INDEX_MARKER'}
                Write-Host $m
              }
            }finally{Remove-Item -LiteralPath $log -Force -ErrorAction SilentlyContinue}
            Write-Host 'DIC15_STATIC_ICE_SELFTEST=PASS'
          }finally{Pop-Location}

      - name: Independently bind index to DIC-13 and DIC-14 original run receipts
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          $qual=Join-Path $env:GITHUB_WORKSPACE 'qual-public'
          $private=Join-Path $env:GITHUB_WORKSPACE 'knowledge-private'
          $lines=@(Get-Content -LiteralPath (Join-Path $private '.ice/remote-index.ndjson')|Where-Object{$_.Trim()})
          $records=@($lines|ForEach-Object{$_|ConvertFrom-Json})
          if($records.Count -ne 4){throw 'DIC15_BAD_RECORD_COUNT'}
          $index=@{}
          foreach($record in $records){$index[[string]$record.id]=$record}
          $c13=Get-Content -LiteralPath (Join-Path $qual 'qualification-evidence/dic13-runs/38713522354.json') -Raw|ConvertFrom-Json
          $c14=Get-Content -LiteralPath (Join-Path $qual 'qualification-evidence/dic14-runs/38715919436.json') -Raw|ConvertFrom-Json
          if($c13.job_status -cne 'success' -or $c13.no_private_artifacts -ne $true){throw 'DIC15_DIC13_ORIGINAL_WITNESS_INVALID'}
          if($c14.synthetic_job_status -cne 'success' -or $c14.historical_version_compatibility -cne 'NOT_QUALIFIED' -or $c14.authentic_historical_predecessor -cne 'NOT_PROVIDED' -or $c14.release_approval -ne $false){throw 'DIC15_DIC14_ORIGINAL_WITNESS_INVALID'}
          $r13=$index['ktrade/dic13/brave-incident-and-support-zip']
          $r14=$index['ktrade/dic14/synthetic-upgrade-rollback']
          $historical=$index['ktrade/historical/installed-1.5.7-upgrade']
          if($r13.witness.run_id -ne [long]$c13.run_id -or $r13.source.sha -cne $c13.source_sha -or $r13.witness.workflow_sha -cne $c13.workflow_sha){throw 'DIC15_DIC13_IDENTITY_DRIFT'}
          if($r14.witness.run_id -ne [long]$c14.run_id -or $r14.source.sha -cne $c14.ktrade_source_sha -or $r14.witness.workflow_sha -cne $c14.workflow_sha){throw 'DIC15_DIC14_IDENTITY_DRIFT'}
          if($historical.status -cne 'BLOCKED' -or $historical.release_authority -ne $false){throw 'DIC15_HISTORICAL_FALSE_PASS'}
          Write-Host 'DIC15_CROSS_REPO_DIC13_RUN_RECEIPT_BINDING=PASS'
          Write-Host 'DIC15_CROSS_REPO_DIC14_RUN_RECEIPT_BINDING=PASS'
          Write-Host 'DIC15_HISTORICAL_V157_STILL_BLOCKED=PASS'
          Write-Host 'DIC15_NO_PRODUCTION_OR_RESEARCH_RUNTIME=PASS'

      - name: Remove private KTRADE knowledge source without uploading artifacts
        if: always()
        shell: pwsh
        run: |
          foreach($p in @('knowledge-private','qual-public')){
            $full=Join-Path $env:GITHUB_WORKSPACE $p
            if(Test-Path -LiteralPath $full){Remove-Item -LiteralPath $full -Force -Recurse -ErrorAction SilentlyContinue}
          }
          Write-Host 'DIC15_PRIVATE_ARTIFACT_UPLOAD=DISABLED'

      - name: Record public run identity only
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_STATUS: ${{ job.status }}
        run: |
          $ErrorActionPreference='Stop'
          $safe=[ordered]@{
            schema='ktrade.dic15.knowledge-acceptance.v1'
            run_id=$env:GITHUB_RUN_ID
            knowledge_sha=$env:KTRADE_KNOWLEDGE_EXACT_SHA
            workflow_sha=$env:GITHUB_SHA
            synthetic_knowledge_verdict=$env:FINAL_STATUS
            historical_v157_admission='BLOCKED'
            private_artifacts_uploaded=0
            production_change=$false
            broker_access=$false
          }|ConvertTo-Json -Compress
          $body=@{
            message='evidence: KTRADE DIC15 knowledge inclusion acceptance'
            content=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($safe+"`n"))
            branch='main'
          }|ConvertTo-Json
          try{
            $uri='https://api.github.com/repos/spoonman136668-ai/Qualification-Forge/contents/qualification-evidence/dic15-knowledge-runs/'+$env:GITHUB_RUN_ID+'.json'
            Invoke-RestMethod -Method Put -Uri $uri -ContentType 'application/json' -Headers @{
              Authorization='Bearer '+$env:GH_TOKEN
              Accept='application/vnd.github+json'
              'X-GitHub-Api-Version'='2022-11-28'
            } -Body $body -TimeoutSec 30|Out-Null
          }catch{throw 'DIC15_EVIDENCE_RECEIPT_WRITE_FAILED'}
          Write-Host 'DIC15_RUN_REFERENCE_RECORDED=PASS'
