name: KTRADE W06A synthetic installed read-only hosted Windows acceptance

on:
  push:
    branches:
      - qualification/rb2-wails-w01-hosted-20261024
    paths:
      - .github/workflows/ktrade-w06a-installed-readonly-windows.yml

permissions:
  contents: read

concurrency:
  group: ktrade-w06a-source-pinned-windows
  cancel-in-progress: false

jobs:
  w06a-windows:
    name: Exact-source W06A Wails WebView2 installed read-only, cold restart
    if: github.repository == 'spoonman136668-ai/Qualification-Forge'
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      GOWORK: 'off'
      CGO_ENABLED: '1'
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      KTRADE_RECOVERY_ISOLATED: '1'
      KTRADE_PORTABLE_DISARMED: '0'
      KTRADE_USE_LEGACY_CDP_CONFIG: '0'
      KTRADE_PAPER_SESSION_ROOT: ''
      KTRADE_PAPER_CUSTODY_REVIEW_ROOT: ''
    steps:
      - name: Checkout independent witness workflow, exact source ref
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: spoonman136668-ai/Qualification-Forge
          ref: ${{ github.sha }}
          path: witness-tools
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact KTRADE W06A candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: spoonman136668-ai/ktrade
          ref: 87405293f93c0826144b84c7943c4442a846d2f9
          path: checked-private
          fetch-depth: 2
          persist-credentials: false
          token: ${{ secrets.KTRADE_SOURCE_READ_TOKEN }}

      - name: Verify private source head, parent, tree and no mutation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_OS -cne 'Windows' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted'){throw 'W06A_HOSTED_WINDOWS_REQUIRED'}
          $s=Join-Path $env:GITHUB_WORKSPACE 'checked-private'
          $w=Join-Path $env:GITHUB_WORKSPACE 'witness-tools'
          $witness=(& git -C $w rev-parse HEAD).Trim()
          if($LASTEXITCODE -ne 0 -or $witness -cne $env:GITHUB_SHA){throw 'W06A_WITNESS_HEAD_MISMATCH'}
          $head=(& git -C $s rev-parse HEAD).Trim()
          $parent=(& git -C $s rev-parse HEAD^).Trim()
          $tree=(& git -C $s rev-parse 'HEAD^{tree}').Trim()
          if($LASTEXITCODE -ne 0 -or $head -cne '87405293f93c0826144b84c7943c4442a846d2f9' -or
             $parent -cne '30be03de962f00bc320f91ab6572ff16d870e24f' -or
             $tree -cne 'af3cc9d62d782687b08e6aad9c29e5328faefa3e'){throw 'W06A_SOURCE_IDENTITY_MISMATCH'}
          if(@(& git -C $s status --porcelain=v1 --untracked-files=no).Count -ne 0){throw 'W06A_SOURCE_DIRTY'}
          Write-Output '::notice::W06A_EXACT_SOURCE_HEAD_PARENT_TREE=PASS'

      - name: Set up Windows native Go
        uses: actions/setup-go@v5
        with:
          go-version-file: checked-private/tools/wails-pilot/go.mod
          cache: false

      - name: Set up locked frontend asset build tooling
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: checked-private/package-lock.json

      - name: Focused W06A custody tests, race, vet, real Windows build and synthetic installation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          $src=Join-Path $env:GITHUB_WORKSPACE 'checked-private'
          $log=Join-Path $env:RUNNER_TEMP 'w06a-private-build.log'
          if(-not (Test-Path -LiteralPath $env:RUNNER_TEMP -PathType Container)){throw 'W06A_RUNNER_TEMP_REQUIRED'}
          $env:TMP=$env:RUNNER_TEMP
          $env:TEMP=$env:RUNNER_TEMP
          $pkg=Join-Path $env:RUNNER_TEMP ('ktrade-w03-package-'+[guid]::NewGuid().ToString('N').ToLowerInvariant())
          $fixtureRoot=$null
          $release=$null
          $data=$null
          try {
            Push-Location (Join-Path $src 'tools/wails-pilot')
            try {
              & go mod verify *> $log
              if($LASTEXITCODE -ne 0){throw 'W06A_GO_MODULES_VERIFY_FAILED'}
              & go test -mod=readonly -race -count=1 -timeout=15m ./backend *> $log
              if($LASTEXITCODE -ne 0){throw 'W06A_WINDOWS_BACKEND_RACE_TEST_FAILED'}
              & go test -mod=readonly -count=1 -v -run '^TestW06A' ./backend *> $log
              if($LASTEXITCODE -ne 0){throw 'W06A_WINDOWS_FOCUSED_TEST_FAILED'}
              $passed=@(Get-Content -LiteralPath $log | Where-Object {$_ -match '^--- PASS: TestW06A'}).Count
              if($passed -ne 7){throw 'W06A_FOCUSED_TEST_COUNT_UNEXPECTED'}
              & go vet -mod=readonly ./backend *> $log
              if($LASTEXITCODE -ne 0){throw 'W06A_WINDOWS_BACKEND_VET_FAILED'}
              Write-Output '::notice::W06A_WINDOWS_GO_FOCUSED_7_AND_RACE_VET=PASS'
            }finally{Pop-Location}

            Push-Location $src
            try {
              & npm ci --ignore-scripts --no-audit --no-fund --silent *> $log
              if($LASTEXITCODE -ne 0){throw 'W06A_LOCKED_NPM_VENDOR_FAILED'}
              & node scripts/stage_offline_vendor.cjs *> $log
              if($LASTEXITCODE -ne 0){throw 'W06A_OFFLINE_EDITOR_ASSETS_FAILED'}
              $before=@(& git status --porcelain=v1 --untracked-files=no)
              if($before.Count -ne 0){throw 'W06A_SOURCE_DIRTY_AFTER_ASSET_STAGING'}
            }finally{Pop-Location}
            $builder=Join-Path $src 'windows/Build-KTRADE-WailsPortable.ps1'
            $built=@(& $builder -OutputRoot $pkg -ExpectedSourceSha '87405293f93c0826144b84c7943c4442a846d2f9')
            if(@($built|Where-Object {$_ -match '^W03_FRESH_PAIRED_PORTABLE_PACKAGE=PASS'}).Count -ne 1){
              throw 'W06A_SOURCE_PAIRED_WAILS_PACKAGE_FAILED'
            }
            Write-Output '::notice::W06A_EXACT_SOURCE_WAILS_GO_BINARIES=PASS'
            $stage=Join-Path $pkg 'KTRADE-WailsPortable'
            $stageScript=Join-Path $src 'windows/Stage-KTRADE-W06A-ReadOnlyFixture.ps1'
            $result=@(& $stageScript -QualifiedW03Stage $stage -ExpectedSourceSha '87405293f93c0826144b84c7943c4442a846d2f9')
            if(@($result|Where-Object {$_ -match '^W06A_SYNTHETIC_READONLY_STAGED=PASS'}).Count -ne 1){
              throw 'W06A_INSTALLED_FIXTURE_NOT_STAGED'
            }
            $release=(@($result|Where-Object {$_ -match '^W06A_SYNTHETIC_RELEASE='})[0] -replace '^W06A_SYNTHETIC_RELEASE=','')
            $data=(@($result|Where-Object {$_ -match '^W06A_SYNTHETIC_APP_DATA='})[0] -replace '^W06A_SYNTHETIC_APP_DATA=','')
            $fixtureRoot=Split-Path (Split-Path $release -Parent) -Parent
            if(-not $release.StartsWith($fixtureRoot,[StringComparison]::OrdinalIgnoreCase) -or
               !(Test-Path -LiteralPath (Join-Path $release 'ktrade.exe') -PathType Leaf)){throw 'W06A_RELEASE_ROOT_MISSING'}
            if((Join-Path $fixtureRoot 'app-data') -ine $data){throw 'W06A_APP_DATA_ROOT_MISMATCH'}
            if(Test-Path -LiteralPath (Join-Path $release 'data')){throw 'W06A_EXE_ADJACENT_DATA_FORBIDDEN'}
            $unknown=Join-Path $data 'nonstandard.unknown'
            [IO.File]::WriteAllText($unknown,'W06A nonstandard state preserved across real Wails cold restart',[Text.UTF8Encoding]::new($false))
            Write-Output '::notice::W06A_SYNTHETIC_INSTALLED_SEPARATE_DATA=PASS'
            $exe=Join-Path $release 'ktrade.exe'
            $engineExe=Join-Path $release 'ktrade-engine.exe'
            $expectedTitle='KTRADE*W06 Synthetic Installed Read-Only*'
            $profile=Join-Path $data 'webview2-profile'
            $marker=Join-Path $profile 'w06-cold-ui.test'
            $expectedMarker='original W06A WebView2 application profile preserved'
            $expectedUnknown='W06A nonstandard state preserved across real Wails cold restart'

            for($cycle=1;$cycle -le 2;$cycle++){
              $app=$null;$child=$null;$http=$null
              try {
                $app=Start-Process -FilePath $exe -WorkingDirectory $release -PassThru
                $null=$app.Handle
                $deadline=(Get-Date).AddSeconds(65)
                $ready=$false
                while((Get-Date) -lt $deadline){
                  Start-Sleep -Milliseconds 500
                  $app.Refresh()
                  if($app.HasExited){throw 'W06A_WAILS_GUI_EARLY_EXIT'}
                  if($app.MainWindowHandle -ne [IntPtr]::Zero -and $app.MainWindowTitle -like $expectedTitle){$ready=$true;break}
                }
                if(!$ready){throw 'W06A_GENUINE_WEBVIEW_WINDOW_NOT_SEEN'}
                Write-Output ('::notice::W06A_GENUINE_WAILS_WINDOW_CYCLE_'+$cycle+'=PASS')
                $deadline=(Get-Date).AddSeconds(20)
                while((Get-Date) -lt $deadline){
                  $children=@(Get-CimInstance Win32_Process -Filter "name='ktrade-engine.exe'" |
                    Where-Object {$_.ExecutablePath -ieq $engineExe -and $_.ParentProcessId -eq $app.Id})
                  if($children.Count -eq 1){$child=$children[0];break}
                  Start-Sleep -Milliseconds 350
                }
                if(!$child){throw 'W06A_CHILD_PROCESS_NOT_OWNED_BY_WAILS'}
                $listeners=@(Get-NetTCPConnection -State Listen -OwningProcess $child.ProcessId -ErrorAction SilentlyContinue |
                  Where-Object {$_.LocalAddress -eq '127.0.0.1'})
                if($listeners.Count -ne 1){throw 'W06A_SINGLE_LOOPBACK_CHILD_REQUIRED'}
                $base='http://127.0.0.1:'+$listeners[0].LocalPort
                $http=[Net.Http.HttpClient]::new()
                $http.Timeout=[TimeSpan]::FromSeconds(12)
                $caps=$http.GetAsync($base+'/api/operator/capabilities').GetAwaiter().GetResult()
                if([int]$caps.StatusCode -ne 200){throw 'W06A_READONLY_CAPABILITY_HTTP_FAILED'}
                $cap=$caps.Content.ReadAsStringAsync().GetAwaiter().GetResult()|ConvertFrom-Json
                if($cap.schema -cne 'ktrade.operator.capabilities.v1' -or $cap.mode -cne 'PAPER_STOPPED' -or
                   $cap.paper_orders_enabled -ne $false -or $cap.live_orders_enabled -ne $false -or
                   $cap.strategy_execution_enabled -ne $false -or $cap.paper_accounting_enabled -ne $false -or
                   $cap.requires_review -ne $true){throw 'W06A_APP_CAPABILITIES_NOT_DISARMED'}
                $paper=$http.GetAsync($base+'/api/paper/session').GetAwaiter().GetResult()
                if([int]$paper.StatusCode -ne 423){throw 'W06A_UNAUTHORIZED_PAPER_OWNER_ADMITTED'}
                $start=$http.PostAsync($base+'/api/paper/session/start',
                  [Net.Http.StringContent]::new('{}',[Text.Encoding]::UTF8,'application/json')).GetAwaiter().GetResult()
                if([int]$start.StatusCode -ne 423){throw 'W06A_PAPER_START_NOT_LOCKED'}
                $order=$http.PostAsync($base+'/api/orders/place',
                  [Net.Http.StringContent]::new('{}',[Text.Encoding]::UTF8,'application/json')).GetAwaiter().GetResult()
                if([int]$order.StatusCode -ne 423){throw 'W06A_LEGACY_ORDER_ROUTE_NOT_LOCKED'}
                $chart=$http.GetAsync($base+'/chart').GetAwaiter().GetResult()
                if([int]$chart.StatusCode -ne 200 -or
                   -not ($chart.Content.ReadAsStringAsync().GetAwaiter().GetResult()).Contains('pine-editor-main')){
                  throw 'W06A_ORIGINAL_CHART_HTML_UNAVAILABLE'
                }
                if(!(Test-Path -LiteralPath $profile -PathType Container)){throw 'W06A_STABLE_BROWSER_PROFILE_MISSING'}
                if($cycle -eq 1){
                  if(Test-Path -LiteralPath $marker){throw 'W06A_PROFILE_MARKER_PREEXISTING'}
                  [IO.File]::WriteAllText($marker,$expectedMarker,[Text.UTF8Encoding]::new($false))
                }else{
                  if(!(Test-Path -LiteralPath $marker -PathType Leaf) -or
                     [IO.File]::ReadAllText($marker) -cne $expectedMarker){throw 'W06A_PROFILE_CHANGED_AFTER_RESTART'}
                }
                if([IO.File]::ReadAllText($unknown) -cne $expectedUnknown){throw 'W06A_UNKNOWN_APP_DATA_CHANGED'}
                if(Test-Path -LiteralPath (Join-Path $release 'data')){throw 'W06A_EXE_ADJACENT_DATA_CREATED'}
                Write-Output ('::notice::W06A_READONLY_HTTP_LOCK_AND_STABLE_DATA_CYCLE_'+$cycle+'=PASS')
                if(-not $app.CloseMainWindow()){throw 'W06A_WAILS_CLOSE_REQUEST_FAILED'}
                if(-not $app.WaitForExit(20000) -or $app.ExitCode -ne 0){throw 'W06A_WAILS_GUI_EXIT_FAILED'}
                $left=Get-Process -Id $child.ProcessId -ErrorAction SilentlyContinue
                if($left -and -not $left.WaitForExit(5000)){throw 'W06A_NATIVE_CHILD_SURVIVED_GUI_CLOSE'}
                Write-Output ('::notice::W06A_PARENT_CHILD_CLEAN_SHUTDOWN_'+$cycle+'=PASS')
              }finally{
                if($http){$http.Dispose()}
                if($app){try{if(-not $app.HasExited){Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue}}catch{}}
                if($child){try{Stop-Process -Id $child.ProcessId -Force -ErrorAction SilentlyContinue}catch{}}
              }
            }
            Write-Output '::notice::W06A_INSTALLED_READONLY_WAILS_COLD_PROFILE=PASS'
            Write-Output '::notice::W06A_SYNTHETIC_ONLY_NO_INSTALL_NO_PAPER_NO_LIVE=PASS'
          }finally{
            if($fixtureRoot -and (Test-Path -LiteralPath $fixtureRoot)){
              Remove-Item -LiteralPath $fixtureRoot -Recurse -Force -ErrorAction SilentlyContinue
            }
            if(Test-Path -LiteralPath $pkg){Remove-Item -LiteralPath $pkg -Recurse -Force -ErrorAction SilentlyContinue}
            Remove-Item -LiteralPath $log -Force -ErrorAction SilentlyContinue
          }
