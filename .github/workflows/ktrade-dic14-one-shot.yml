name: DIC-14 offline Windows durable upgrade and historical predecessor gate
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ktrade-dic14-one-shot.yml

permissions:
  contents: write

jobs:
  offline-synthetic-not-historical:
    if: github.repository == 'spoonman136668-ai/Qualification-Forge' && github.actor == 'spoonman136668-ai'
    runs-on: windows-2022
    timeout-minutes: 70
    env:
      KTRADE_EXPECTED_SOURCE_SHA: '7db6ed7f27270d2a254ddce7041bc0f77fcee944'
      KTRADE_CI_SOURCE_ONLY: '1'
      KTRADE_CI_PAPER_ONLY: '1'
      KTRADE_CI_LIVE_AUTHORITY: '0'
      KTRADE_CI_COINBASE_ALLOWED: '0'
      KTRADE_CI_PROMOTION_ALLOWED: '0'
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'

    steps:
      - name: Require independent disposable Windows
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_OS -cne 'Windows' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted'){throw 'DIC14_NOT_HOSTED_WINDOWS'}
          Write-Host 'DIC14_DISPOSABLE_WINDOWS=PASS'

      - name: Checkout public test harness
        uses: actions/checkout@v4
        with:
          path: qual-public
          persist-credentials: false

      - name: Checkout exact private draft KTRADE source
        uses: actions/checkout@v4
        with:
          repository: spoonman136668-ai/ckb
          ref: 7db6ed7f27270d2a254ddce7041bc0f77fcee944
          path: checked-private
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.KTRADE_CKB_READ_TOKEN_TEMP }}

      - name: Fixed source identity, focused upgrade tests, one regression and vet
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          $privateLog=Join-Path $env:RUNNER_TEMP 'dic14-source-private.log'
          Push-Location 'checked-private'
          try{
            $identity=(& git rev-parse HEAD).Trim()
            if($LASTEXITCODE -ne 0 -or $identity -cne $env:KTRADE_EXPECTED_SOURCE_SHA){throw 'DIC14_SOURCE_IDENTITY_FAIL'}
            Write-Host 'DIC14_EXACT_SOURCE_IDENTITY=PASS'
            function CheckGo([string]$name,[string[]]$arguments){
              try{
                & go @arguments *> $privateLog
                if($LASTEXITCODE -ne 0){throw 'NONZERO'}
              }catch{throw ('DIC14_'+$name+'_FAILED_PRIVATE_OUTPUT_WITHHELD')}
              Write-Host ('DIC14_'+$name+'=PASS')
            }
            CheckGo 'FOCUSED_UPGRADE' @('test','-count=1','./internal/durableupgrade','./cmd/ktrade-upgrade')
            CheckGo 'ONE_FULL_REGRESSION' @('test','-count=1','-timeout=420s','./...')
            CheckGo 'VET' @('vet','./...')
            CheckGo 'GO_BUILD' @('build','./...')
          }finally{
            Pop-Location
            Remove-Item -LiteralPath $privateLog -Force -ErrorAction SilentlyContinue
          }

      - name: Independent offline synthetic migration and rollback
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          $root=Join-Path $env:GITHUB_WORKSPACE 'checked-private'
          $test=Join-Path $env:GITHUB_WORKSPACE 'qual-public/qualification/dic14_synthetic_upgrade.ps1'
          $scratch=Join-Path $env:RUNNER_TEMP 'dic14-synthetic-acceptance'
          $privateLog=Join-Path $env:RUNNER_TEMP 'dic14-private-acceptance.log'
          try{
            $tokens=$null;$parse=$null
            $null=[Management.Automation.Language.Parser]::ParseFile($test,[ref]$tokens,[ref]$parse)
            if(@($parse).Count -gt 0){throw 'DIC14_HARNESS_SYNTAX_INVALID'}
            Write-Host 'DIC14_HARNESS_POWERSHELL_SYNTAX=PASS'
            & pwsh -NoProfile -File $test -SourceRoot $root -ScratchRoot $scratch *> $privateLog
            $code=$LASTEXITCODE
            $lines=@(Get-Content -LiteralPath $privateLog -ErrorAction SilentlyContinue)
            $must=@(
              'DIC14_FOUR_EXES_AND_MANIFEST=PASS',
              'DIC14_SYNTHETIC_PREFS_PNL_HISTORY_PINE_SEEDED=PASS',
              'DIC14_COMPLETE_DURABLE_PINE_PREFS_PNL_HISTORY_INVENTORY=PASS',
              'DIC14_ALTERED_SNAPSHOT_REJECTED=PASS',
              'DIC14_HASH_IDENTICAL_PREFS_PNL_HISTORY_PINE_AND_BROWSER_ISOLATION=PASS',
              'DIC14_DUPLICATE_INSTALL_REJECTED=PASS',
              'DIC14_ROLLBACK_BASELINE_SEALED=PASS',
              'DIC14_NEW_PNL_PREVENTS_DESTRUCTIVE_ROLLBACK=PASS',
              'DIC14_SAFE_ROLLBACK_EXACT_DATA_AND_BROWSER_PRESERVED=PASS',
              'DIC14_RUNNING_SOURCE_REJECTED=PASS',
              'DIC14_NO_REAL_PREDECESSOR_NO_REAL_PROFILE_NO_LIVE_BROKER=PASS',
              'DIC14_SYNTHETIC_UPGRADE_ROLLBACK_QUALIFIED=PASS',
              'DIC14_HISTORICAL_1_5_7_COMPATIBILITY=BLOCKED_AUTHENTIC_SIGNED_PREDECESSOR_NOT_AVAILABLE',
              'DIC14_RELEASE_PROMOTION=PROHIBITED'
            )
            foreach($line in $must){
              if(@($lines|Where-Object{$_ -ceq $line}).Count -eq 1){Write-Host $line}
            }
            if($code -ne 0){throw 'DIC14_PRIVATE_SYNTHETIC_QUALIFICATION_FAILED'}
            foreach($line in $must){
              if(@($lines|Where-Object{$_ -ceq $line}).Count -ne 1){throw 'DIC14_REQUIRED_VERDICT_MISSING'}
            }
            Push-Location $root
            try{
              if((& git rev-parse HEAD).Trim() -cne $env:KTRADE_EXPECTED_SOURCE_SHA){throw 'DIC14_SOURCE_MOVED'}
              if(@(& git status --porcelain=v1 --untracked-files=no).Count -ne 0){throw 'DIC14_TRACKED_SOURCE_CHANGED'}
            }finally{Pop-Location}
            Write-Host 'DIC14_SOURCE_UNCHANGED=PASS'
            Write-Host 'DIC14_NO_HISTORICAL_RELEASE_APPROVAL=PASS'
          }finally{
            Remove-Item -LiteralPath $privateLog -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $scratch -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Remove private source and synthetic state without artifact uploads
        if: always()
        shell: pwsh
        run: |
          foreach($rel in @('checked-private','qual-public')){
            $p=Join-Path $env:GITHUB_WORKSPACE $rel
            if(Test-Path -LiteralPath $p){Remove-Item -LiteralPath $p -Recurse -Force -ErrorAction SilentlyContinue}
          }
          Write-Host 'DIC14_PRIVATE_ARTIFACT_UPLOAD=DISABLED'

      - name: Publish only signed-out run identity and synthetic-versus-historical verdict
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          FINAL_STATUS: ${{ job.status }}
        run: |
          $ErrorActionPreference='Stop'
          $data=[ordered]@{
            schema='ktrade.dic14.historical-gate.v1'
            run_id=$env:GITHUB_RUN_ID
            workflow_sha=$env:GITHUB_SHA
            ktrade_source_sha=$env:KTRADE_EXPECTED_SOURCE_SHA
            synthetic_job_status=$env:FINAL_STATUS
            authentic_historical_predecessor='NOT_PROVIDED'
            historical_version_compatibility='NOT_QUALIFIED'
            real_profile_visited=$false
            broker_access=$false
            release_approval=$false
            private_artifact_uploads=0
          }|ConvertTo-Json -Compress
          $body=@{
            message='evidence: DIC-14 synthetic upgrade result (historical blocked)'
            content=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($data+"`n"))
            branch='main'
          }|ConvertTo-Json
          try{
            $uri='https://api.github.com/repos/spoonman136668-ai/Qualification-Forge/contents/qualification-evidence/dic14-runs/'+$env:GITHUB_RUN_ID+'.json'
            Invoke-RestMethod -Method Put -Uri $uri -ContentType 'application/json' -Headers @{
              Authorization='Bearer '+$env:GH_TOKEN
              Accept='application/vnd.github+json'
              'X-GitHub-Api-Version'='2022-11-28'
            } -Body $body -TimeoutSec 30|Out-Null
          }catch{throw 'DIC14_RUN_RECEIPT_WRITE_FAILED'}
          Write-Host 'DIC14_PUBLIC_SYNTHETIC_AND_BLOCKED_VERDICT_RECORDED=PASS'
