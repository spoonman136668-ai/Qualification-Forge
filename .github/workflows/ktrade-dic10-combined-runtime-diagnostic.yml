name: KTRADE DIC-10 combined offline runtime diagnostic
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ktrade-dic10-combined-runtime-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    if: github.repository == 'spoonman136668-ai/Qualification-Forge'
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      KTRADE_EXPECTED_SOURCE_SHA: '6fc5ccf642edc2e33a9ada01afdd8c3250aecc35'
      KTRADE_CI_SOURCE_ONLY: '1'
      KTRADE_CI_PAPER_ONLY: '1'
      KTRADE_CI_LIVE_AUTHORITY: '0'
      KTRADE_CI_COINBASE_ALLOWED: '0'
      KTRADE_CI_PROMOTION_ALLOWED: '0'
      GOFLAGS: '-p=2'
      GOMAXPROCS: '2'
    steps:
      - name: Require ephemeral hosted Windows and disabled broker authority
        shell: pwsh
        run: |
          if($env:RUNNER_OS -cne 'Windows' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted'){throw 'DIC10_BAD_RUNNER'}
          Write-Host 'DIC10_HOSTED_WINDOWS=PASS'
      - name: Read exact private candidate without persisting token
        uses: actions/checkout@v4
        with:
          repository: spoonman136668-ai/ckb
          ref: ${{ env.KTRADE_EXPECTED_SOURCE_SHA }}
          path: checked-private
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.KTRADE_CKB_READ_TOKEN_TEMP }}
      - name: Isolated Go environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Actual firewall-gated portable KTRADE with Pine and DIC in one process
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $private=Join-Path $env:RUNNER_TEMP 'dic10-private-offline-runtime.log'
          $scratch=Join-Path $env:RUNNER_TEMP 'dic10-runtime-diagnostic'
          Push-Location (Join-Path $env:GITHUB_WORKSPACE 'checked-private')
          try{
            $actual=(& git rev-parse HEAD).Trim()
            if($LASTEXITCODE -ne 0 -or $actual -cne $env:KTRADE_EXPECTED_SOURCE_SHA){throw 'DIC10_SOURCE_DRIFT'}
            Write-Host 'DIC10_SOURCE_IDENTITY=PASS'
            $path=Join-Path (Get-Location) 'windows/ktrade-dic10-synthetic-installed-combined.ps1'
            $tokens=$null;$errors=$null
            $null=[System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)
            if($null -ne $errors -and @($errors).Count -gt 0){throw 'DIC10_HARNESS_PARSE_INVALID'}
            Write-Host 'DIC10_HARNESS_PARSE=PASS'
            & pwsh -NoProfile -File $path -ScratchRoot $scratch *> $private
            $exit=$LASTEXITCODE
            $lines=@(Get-Content -LiteralPath $private -ErrorAction SilentlyContinue)
            $milestones=@(
              'PACKAGED_FOUR_EXES_AND_MANIFEST',
              'NO_BROKER_EGRESS_FIREWALL',
              'PACKAGED_EXE_LOCAL_OPERATOR_READY',
              'INSTALLED_OPERATOR_PANEL',
              'INSTALLED_CSRF_REJECTS_UNAUTHORIZED_SAVE',
              'INSTALLED_SAVE_LIST_EXPORT',
              'COMBINED_OPERATOR_PINE_AND_INCIDENT_UI',
              'COMBINED_PINE_LIST_FETCHED',
              'COMBINED_BUILTIN_PINE_CATALOG',
              'COMBINED_PINE_NO_SOURCE_LEAK',
              'COMBINED_PINE_BUILTIN_ID_VALID',
              'COMBINED_BUILTINS_DISCOVERY_METADATA_ONLY',
              'COMBINED_PINE_CSRF_DENIAL',
              'COMBINED_PINE_IMPORT_AND_FAVORITES_SAVED',
              'INSTALLED_RESTART_PRESERVES_REPORT',
              'COMBINED_PINE_AND_INCIDENT_RESTART_CONTINUITY',
              'INSTALLED_TAMPER_REJECTED',
              'SYNTHETIC_PREFERENCES_PNL_PINE_UNCHANGED',
              'DIC07_FULL_SYNTHETIC_OFFLINE_ACCEPTANCE'
            )
            $passed=@()
            foreach($name in $milestones){
              if(@($lines|Where-Object{$_ -ceq ('DIC07_'+$name+'=PASS')}).Count -eq 1){
                Write-Host ('DIC10_'+$name+'=PASS')
                $passed+= $name
              }
            }
            if($exit -ne 0){
              foreach($status in @(400,401,403,404,409,422,429,500,503)){
                if(@($lines|Where-Object{$_ -ceq ('DIC07_COMBINED_PINE_LIST_HTTP_'+$status+'=FAIL')}).Count -gt 0){
                  Write-Host ('DIC10_PINE_LIST_HTTP_'+$status+'=FAIL')
                }
              }
              if(@($lines|Where-Object{$_ -ceq 'DIC07_COMBINED_PINE_LIST_REQUEST_FAILED=FAIL'}).Count -gt 0){
                Write-Host 'DIC10_PINE_LIST_REQUEST_FAILED=FAIL'
              }
              foreach($phase in @('INIT','SYNTHETIC_CONFIG','SYNTHETIC_KEY','FIREWALL_PROFILE','FIREWALL_RULE','APP_STARTUP','INSTALLED_CSRF_AND_UI','INSTALLED_INCIDENT_SAVE','INSTALLED_RESTART','INSTALLED_TAMPER')){
                if(@($lines|Where-Object{$_ -ceq ('DIC07_FAILURE_PHASE_'+$phase+'=FAIL')}).Count -gt 0){
                  Write-Host ('DIC10_FAILURE_PHASE_'+$phase+'=FAIL')
                }
              }
              throw 'DIC10_RUNTIME_FAILED_PRIVATE_OUTPUT_WITHHELD'
            }
            foreach($required in $milestones){
              if($required -notin $passed){throw ('DIC10_MISSING_REQUIRED_MILESTONE_'+$required)}
            }
            Write-Host 'DIC10_COMBINED_INSTALLED_COEXISTENCE=PASS'
            if((& git rev-parse HEAD).Trim() -cne $env:KTRADE_EXPECTED_SOURCE_SHA){throw 'DIC10_SOURCE_CHANGED'}
            if(@(& git status --porcelain=v1 --untracked-files=no).Count -ne 0){throw 'DIC10_TRACKED_SOURCE_CHANGED'}
            Write-Host 'DIC10_SOURCE_UNCHANGED=PASS'
          }finally{
            Pop-Location
            Remove-Item -LiteralPath $private -Force -ErrorAction SilentlyContinue
            if(Test-Path -LiteralPath $scratch){Remove-Item -LiteralPath $scratch -Recurse -Force -ErrorAction SilentlyContinue}
          }
      - name: Purge private source without publishing artifacts
        if: always()
        shell: pwsh
        run: |
          $root=Join-Path $env:GITHUB_WORKSPACE 'checked-private'
          if(Test-Path -LiteralPath $root){Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue}
          Write-Host 'DIC10_PUBLIC_PRIVATE_ARTIFACT_UPLOAD=DISABLED'
