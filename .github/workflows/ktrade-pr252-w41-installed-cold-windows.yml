name: KTRADE UI redesign installed WebView2 cold-reopen acceptance

on:
  push:
    branches:
      - qualification/ktrade-ui-workstation-refresh-20261108
    paths:
      - qualification-harness/ktrade-w41/Installed-Cold-Viewport.ps1
      - .github/workflows/ktrade-pr252-w41-installed-cold-windows.yml

permissions:
  contents: read

concurrency:
  group: ktrade-ui-redesign-installed-cold-20261108
  cancel-in-progress: false

jobs:
  installed-cold:
    if: github.repository == 'spoonman136668-ai/Qualification-Forge' && github.ref == 'refs/heads/qualification/ktrade-ui-workstation-refresh-20261108'
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      GOWORK: 'off'
      GOFLAGS: '-p=2'
      GOMAXPROCS: '2'
      CGO_ENABLED: '1'
      GOTOOLCHAIN: 'local'
      KTRADE_LIVE_TRADING: 'false'
      KTRADE_USE_LEGACY_CDP_CONFIG: '0'
      KTRADE_EXPECTED_SOURCE: '8dff4c2e07bd695b155bcf1aad7e274535ba4cb7'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      KTRADE_SPECTRUM_PREVIEW: '1'
    steps:
      - name: Checkout exact qualification witness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: witness
          persist-credentials: false
      - name: Checkout private exact KTRADE product
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: spoonman136668-ai/ktrade
          ref: 8dff4c2e07bd695b155bcf1aad7e274535ba4cb7
          fetch-depth: 0
          path: product
          persist-credentials: false
          token: ${{ secrets.KTRADE_SOURCE_READ_TOKEN }}
      - name: Pin exact clean product and qualified installed harness
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows' -or
             $env:GITHUB_REPOSITORY -cne 'spoonman136668-ai/Qualification-Forge' -or $env:KTRADE_LIVE_TRADING -cne 'false'){
            throw 'W41_DISARMED_EPHEMERAL_WINDOWS_ONLY'
          }
          $p=Join-Path $env:GITHUB_WORKSPACE 'product'
          $w=Join-Path $env:GITHUB_WORKSPACE 'witness'
          $source=(& git -C $p rev-parse HEAD).Trim()
          $tree=(& git -C $p rev-parse 'HEAD^{tree}').Trim()
          if($source -cne '8dff4c2e07bd695b155bcf1aad7e274535ba4cb7' -or $tree -cne '83460fea48c05181fe3aa2d29dd7c6c0f43ffe67' -or
             @(& git -C $p status --porcelain).Count -ne 0 -or (Test-Path (Join-Path $p '.env'))){
            throw 'W41_INSTALLED_EXACT_CLEAN_SOURCE_REQUIRED'
          }
          & git -C $p merge-base --is-ancestor '3ac5f92aa0416608b12d9ecf66c91024f16cf372' HEAD
          if($LASTEXITCODE -ne 0){throw 'W41_INSTALLED_QUALIFIED_BASE_NOT_ANCESTOR'}
          $delta=@(& git -C $p diff --name-only '5a35dea7822c34ee18cafa5486671a8d72eef87e' '3ac5f92aa0416608b12d9ecf66c91024f16cf372'|Sort-Object)
          if(($delta -join '|') -cne 'static/chart_viewport_state.js|templates/chart.tmpl|tests/rb3_w38_chart_logical_sync.test.cjs|tests/rb3_w41_chart_viewport_persistence.test.cjs'){
            throw 'W41_INSTALLED_FOUR_SOURCE_PATHS_REQUIRED'
          }
          $h=(& git -C $w rev-parse HEAD).Trim()
          if($h -cne $env:GITHUB_SHA -or
             (& git -C $w rev-parse 'HEAD:qualification-harness/ktrade-pine-viewport/Installed-Viewport-Lifecycle.ps1').Trim() -cne '36bb0a7dac5cca866a2fe0bd018faa365fdeeb7c'){
            throw 'W41_QUALIFIED_ORIGINAL_W83_HELPER_IDENTITY_DRIFT'
          }
          $tokens=$null;$errors=$null
          $script=Join-Path $w 'qualification-harness\ktrade-w41\Installed-Cold-Viewport.ps1'
          [void][Management.Automation.Language.Parser]::ParseFile($script,[ref]$tokens,[ref]$errors)
          if($errors.Count -ne 0){throw ('W41_TEST_WITNESS_POWERSHELL_SYNTAX_INVALID '+($errors -join '; '))}
          Write-Host '::notice::W41_INSTALLED_EXACT_SOURCE_W83_NATIVE_WITNESS=PASS'
      - name: Setup pinned Go and build-time-only Node
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: false
      - name: Setup Node for original bundled assets
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Focused chart source regression before installer build
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $p=Join-Path $env:GITHUB_WORKSPACE 'product'
          $log=Join-Path $env:RUNNER_TEMP 'w41-focused-node-private.log'
          Push-Location $p
          try {
            & node --test --test-reporter=tap tests/rb3_w41_chart_viewport_persistence.test.cjs *> $log
            if($LASTEXITCODE -ne 0){
              Write-Host ('W41_FOCUSED_NODE_FAILURE_SHA256='+(Get-FileHash -LiteralPath $log -Algorithm SHA256).Hash.ToLowerInvariant())
              throw 'W41_FOCUSED_NODE_REGRESSION_FAILED_PRIVATE_LOG_WITHHELD'
            }
            Write-Host 'W41_FOCUSED_NODE_REGRESSION=PASS'
          }finally{
            Pop-Location
            Remove-Item -LiteralPath $log -Force -ErrorAction SilentlyContinue
          }
      - name: Build unsigned original Wails installer from exact qualified candidate
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $product=Join-Path $env:GITHUB_WORKSPACE 'product'
          Push-Location $product
          try{
            & npm ci --ignore-scripts --no-audit --no-fund --silent
            if($LASTEXITCODE -ne 0){throw 'W41_NATIVE_ASSETS_NPM_REFUSED'}
            & node scripts/stage_offline_vendor.cjs
            if($LASTEXITCODE -ne 0){throw 'W41_NATIVE_ASSETS_VENDOR_REFUSED'}
            $dest=Join-Path $env:RUNNER_TEMP ('ktrade-setup-package-'+[guid]::NewGuid().ToString('N'))
            & ./windows/Build-KTRADE-FreshInstaller.ps1 -OutputRoot $dest -ExpectedSourceSha '8dff4c2e07bd695b155bcf1aad7e274535ba4cb7'
            if($LASTEXITCODE -ne 0){throw 'W41_REAL_NATIVE_INSTALLER_BUILD_FAILED'}
            $zip=Join-Path $dest 'KTRADE-SetupBundle.zip'
            if(!(Test-Path -LiteralPath $zip -PathType Leaf)){throw 'W41_REAL_NATIVE_INSTALLER_MISSING'}
            Write-Host ('W41_EXACT_UNSIGNED_NATIVE_BUNDLE_SHA256='+(Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant())
            "W41_PACKAGE_PATH=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          }finally{Pop-Location}
      - name: Real installed Wails cold-reopen physical chart acceptance
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if([string]::IsNullOrEmpty($env:W41_PACKAGE_PATH)){throw 'W41_PACKAGE_CUSTODY_LOST'}
          & (Join-Path $env:GITHUB_WORKSPACE 'witness/qualification-harness/ktrade-w41/Installed-Cold-Viewport.ps1') -PackageZip $env:W41_PACKAGE_PATH
          if(!$?){throw 'W41_REAL_INSTALLED_COLD_ACCEPTANCE_FAILED'}
      - name: Retain test-owned native Spectrum Desk image for UX inspection
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ktrade-spectrum-native-ui-8dff4c2e07bd695b155bcf1aad7e274535ba4cb7
          path: ${{ runner.temp }}/ktrade-pr253-spectrum-native-workstation.png
          if-no-files-found: warn
          retention-days: 3
