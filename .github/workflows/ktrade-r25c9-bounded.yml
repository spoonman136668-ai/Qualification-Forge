name: KTRADE R25-C9 exact-parent wire and vet differential
on:
  push:
    branches: [qualification/ktrade-r25c9-bounded-20261018]
    paths: [.github/workflows/ktrade-r25c9-bounded.yml]
permissions:
  contents: read
jobs:
  qualify-parent-and-candidate:
    if: github.repository == 'spoonman136668-ai/Qualification-Forge'
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      GOFLAGS: '-p=2'
      GOMAXPROCS: '2'
      KTRADE_CI_COINBASE_ALLOWED: '0'
      KTRADE_CI_LIVE_AUTHORITY: '0'
      KTRADE_CI_PROMOTION_ALLOWED: '0'
    steps:
      - name: Checkout exact private KTRADE candidate and immutable parent
        uses: actions/checkout@v4
        with:
          repository: spoonman136668-ai/ktrade
          ref: 3f2cb04b28b91b203164b67da0db4de98243578a
          path: source
          persist-credentials: false
          fetch-depth: 2
          token: ${{ secrets.KTRADE_SOURCE_READ_TOKEN }}
      - name: Setup pinned Go version
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Check pre-remediation fingerprints, patched wire, and focused vet
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $original = 'a35fe1188fc24614bd1a1cdd2b11289eb553afb8'
          $candidate = '3f2cb04b28b91b203164b67da0db4de98243578a'
          $originalTree = '7c1026b4ee2e8f57c0923ba75320738f99f9f7c6'
          $candidateTree = '010dd23f979bdb1a7b124b173c98c74366531469'
          $root = Join-Path $env:GITHUB_WORKSPACE 'source'
          $testFile = Join-Path $root 'pkg/r25c9_governance_wire_compat_test.go'
          $frozenTest = Join-Path $env:RUNNER_TEMP 'r25c9_exact_test.go'
          $log = Join-Path $env:RUNNER_TEMP 'r25c9_focused.log'
          try {
            if ($env:RUNNER_OS -cne 'Windows' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted') { throw 'R25C9_HOST_INVALID' }
            if ($env:KTRADE_CI_COINBASE_ALLOWED -cne '0' -or $env:KTRADE_CI_LIVE_AUTHORITY -cne '0' -or $env:KTRADE_CI_PROMOTION_ALLOWED -cne '0') { throw 'R25C9_UNSAFE_AUTHORITY' }
            $gotHead = (& git -C $root rev-parse HEAD).Trim()
            $gotParent = (& git -C $root rev-parse HEAD^).Trim()
            $gotTree = (& git -C $root rev-parse 'HEAD^{tree}').Trim()
            if ($gotHead -cne $candidate -or $gotParent -cne $original -or $gotTree -cne $candidateTree) { throw 'R25C9_SOURCE_IDENTITY_DRIFT' }
            $expectedFiles = @(
              'pkg/p11b_t434_explicit_new_repro_only_release_readiness_governance_closeout_hearth_pin.go',
              'pkg/p11b_t435_explicit_new_repro_only_release_readiness_governance_closeout_fireside_pin.go',
              'pkg/p11b_t436_explicit_new_repro_only_release_readiness_governance_closeout_homestead_pin.go',
              'pkg/p11b_t437_explicit_new_repro_only_release_readiness_governance_closeout_roost_pin.go',
              'pkg/p11b_t438_explicit_new_repro_only_release_readiness_governance_closeout_perch_pin.go',
              'pkg/p11b_t439_explicit_new_repro_only_release_readiness_governance_closeout_nesting_pin.go',
              'pkg/p11b_t440_explicit_new_repro_only_release_readiness_governance_closeout_rootedness_pin.go',
              'pkg/p11b_t441_explicit_new_repro_only_release_readiness_governance_closeout_dwelling_pin.go',
              'pkg/p11b_t442_explicit_new_repro_only_release_readiness_governance_closeout_abode_pin.go',
              'pkg/p11b_t443_explicit_new_repro_only_release_readiness_governance_closeout_restingplace_pin.go',
              'pkg/r25c9_governance_wire_compat_test.go'
            )
            $changed = @(& git -C $root diff --name-only HEAD^ HEAD | Sort-Object)
            if ($LASTEXITCODE -ne 0 -or (Compare-Object $changed ($expectedFiles | Sort-Object))) { throw 'R25C9_SCOPE_DRIFT' }
            $expectedBlobs = @('0a7fdff40a696f88396d4858ec3f643ba7e6f9d1','897b8ca68e8166493afbd79f39db0037c0dff1fb','0db84f0f4a5eed5b9df7ac3248ce1013b7862ffe','1071f87b4085a6d643360eb1f01737715a538437','e5e75ef7488994be4f57c5ffa96e055fe5037b52','313a169ceefd70fedc4672e09db123aab768daa0','7fc9bdcf9f1a894d0313a1ca09b893b81a25fed4','5e44bf59b950547d73e40b45e98f596f96a6103e','47b6e13bac5cdc33c66e9ddc55f41866ba81b555','01f1b9dd9819d77e5b3cf9f589fa0831d18293d7')
            for ($i=0; $i -lt 10; $i++) {
              $got = (& git -C $root rev-parse "HEAD^:$($expectedFiles[$i])").Trim()
              if ($LASTEXITCODE -ne 0 -or $got -cne $expectedBlobs[$i]) { throw "R25C9_PARENT_BLOB_DRIFT_$i" }
            }
            Copy-Item -LiteralPath $testFile -Destination $frozenTest
            Push-Location $root
            try {
              & go mod download *> $log
              if ($LASTEXITCODE -ne 0) { throw 'R25C9_MODULE_DOWNLOAD_FAILED' }
              & git checkout --detach $original *> $log
              if ($LASTEXITCODE -ne 0 -or (& git rev-parse 'HEAD^{tree}').Trim() -cne $originalTree) { throw 'R25C9_ORIGINAL_CHECKOUT_FAILED' }
              Copy-Item -LiteralPath $frozenTest -Destination $testFile
              $env:R25C9_ORIGINAL_MODE = '1'
              & go test -vet=off -mod=readonly -count=1 -timeout=300s -v -run '^TestR25C9HistoricalGovernanceJSONWire$' ./pkg *> $log
              if ($LASTEXITCODE -ne 0) {
                Write-Output ('R25C9_PARENT_DIAGNOSTICS='+(Get-Content $log -Tail 30 | Out-String))
                throw 'R25C9_PARENT_WIRE_BASELINE_FAILED'
              }
              $baseline = [string](Get-Content -LiteralPath $log -Raw)
              foreach ($part in @('T434','T435','T436','T437','T438','T439','T440','T441','T442','T443')) {
                $match = [regex]::Match($baseline, ('R25C9_WIRE_'+$part+'_SHA256=([0-9a-f]{64})'))
                if (-not $match.Success) { throw ('R25C9_BASELINE_FINGERPRINT_MISSING_'+$part) }
                [Environment]::SetEnvironmentVariable(('R25C9_EXPECTED_'+$part+'_SHA256'), $match.Groups[1].Value)
                Write-Output ('R25C9_BASELINE_'+$part+'_SHA256='+$match.Groups[1].Value)
              }
              Remove-Item -LiteralPath $testFile -Force
              & git checkout --detach $candidate *> $log
              if ($LASTEXITCODE -ne 0 -or (& git rev-parse 'HEAD^{tree}').Trim() -cne $candidateTree) { throw 'R25C9_RESTORE_FAILED' }
              $env:R25C9_ORIGINAL_MODE = '0'
              & go test -vet=off -mod=readonly -count=1 -timeout=300s -v -run '^TestR25C9HistoricalGovernanceJSONWire$' ./pkg *> $log
              if ($LASTEXITCODE -ne 0) {
                Write-Output ('R25C9_CANDIDATE_DIAGNOSTICS='+(Get-Content $log -Tail 30 | Out-String))
                throw 'R25C9_CANDIDATE_WIRE_FAILED'
              }
              Write-Output 'R25C9_JSON_WIRE_IDENTITY_AND_INBOUND_IGNORE=PASS'
              & go vet -mod=readonly -unsafeptr ./pkg *> $log
              if ($LASTEXITCODE -ne 0) { throw 'R25C9_UNSAFEPTR_FAILED' }
              Write-Output 'R25C9_UNSAFEPTR_ANALYZER=PASS'
              & go vet -mod=readonly -structtag ./pkg *> $log
              $vetExit = $LASTEXITCODE
              $remaining = @(Get-Content -LiteralPath $log -ErrorAction SilentlyContinue | Where-Object {$_ -match '\.go:\d+:\d+:'}).Count
              Write-Output "R25C9_REMAINING_STRUCTTAG_DIAGNOSTICS=$remaining"
              if ($vetExit -eq 0 -or $remaining -ne 2746) { throw 'R25C9_STRUCTTAG_DIFFERENTIAL_MISMATCH' }
              Write-Output 'R25C9_STRUCTTAG_REDUCED_BY=390'
              Write-Output 'R25C9_FOCUSED_WINDOWS_QUALIFICATION=PASS'
              Write-Output 'R25C9_FULL_VET_NOT_PASSED=TRUE'
              Write-Output 'R25C9_FINAL_REGRESSION_NOT_RUN=TRUE'
              $global:LASTEXITCODE = 0
            } finally { Pop-Location }
          } finally {
            Remove-Item -LiteralPath $frozenTest -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $log -Force -ErrorAction SilentlyContinue
          }
      - name: Delete private checkout
        if: always()
        shell: pwsh
        run: |
          Remove-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'source') -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'r25c9_focused.log') -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'r25c9_exact_test.go') -Force -ErrorAction SilentlyContinue
          Write-Output 'R25C9_PRIVATE_CHECKOUT_REMOVED=TRUE'
