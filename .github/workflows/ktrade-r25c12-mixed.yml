name: KTRADE R25-C12 mixed collision original-wire and complete vet
on:
  push:
    branches: [qualification/ktrade-r25c12-mixed-20261018]
    paths: [.github/workflows/ktrade-r25c12-mixed.yml]
permissions:
  contents: read
jobs:
  mixed-wire:
    if: github.repository == 'spoonman136668-ai/Qualification-Forge'
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      GOFLAGS: '-p=2'
      GOMAXPROCS: '2'
      KTRADE_CI_COINBASE_ALLOWED: '0'
      KTRADE_CI_LIVE_AUTHORITY: '0'
      KTRADE_CI_PROMOTION_ALLOWED: '0'
    steps:
      - name: Checkout private exact second delta
        uses: actions/checkout@v4
        with:
          repository: spoonman136668-ai/ktrade
          ref: 3d934a0f2c3bae555395ca2e09a72632af172aa7
          path: source
          persist-credentials: false
          fetch-depth: 2
          token: ${{ secrets.KTRADE_SOURCE_READ_TOKEN }}
      - name: Install Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Original mixed-wire compatibility, bounded diff and complete package vet
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $parent='2af730f8a7bed15370d86d2ce0ced060c56beed2'
          $parentTree='89cc720ff3d6da6cec12d583a23682584f473ac6'
          $head='3d934a0f2c3bae555395ca2e09a72632af172aa7'
          $headTree='fd2e4230255e47e3dbd409480c3ea0937fe5427e'
          $root=Join-Path $env:GITHUB_WORKSPACE 'source'
          $log=Join-Path $env:RUNNER_TEMP 'r25c12mixed.log'
          $test=Join-Path $root 'pkg/r25c12_mixed_phase9_wire_compat_test.go'
          $frozen=Join-Path $env:RUNNER_TEMP 'r25c12mixed_frozen.go'
          try {
            if ($env:RUNNER_OS -cne 'Windows' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted') {throw 'R25C12_MIXED_HOST_DRIFT'}
            if ($env:KTRADE_CI_COINBASE_ALLOWED -cne '0' -or $env:KTRADE_CI_LIVE_AUTHORITY -cne '0' -or $env:KTRADE_CI_PROMOTION_ALLOWED -cne '0') {throw 'R25C12_UNSAFE_AUTHORITY'}
            if ((& git -C $root rev-parse HEAD).Trim() -cne $head -or (& git -C $root rev-parse HEAD^).Trim() -cne $parent -or
                (& git -C $root rev-parse 'HEAD^{tree}').Trim() -cne $headTree -or
                (& git -C $root rev-parse ($parent+'^{tree}')).Trim() -cne $parentTree) {throw 'R25C12_MIXED_SOURCE_IDENTITY_DRIFT'}
            $changed=@(& git -C $root diff --name-only $parent $head)
            if ($LASTEXITCODE -ne 0 -or @($changed).Count -ne 18) {throw 'R25C12_MIXED_PATH_COUNT_DRIFT'}
            $sources=@($changed | Where-Object {$_ -ne 'pkg/r25c12_mixed_phase9_wire_compat_test.go'})
            if (@($sources).Count -ne 17) {throw 'R25C12_MIXED_FILE_INVENTORY_DRIFT'}
            $seen=@{}
            foreach ($path in $sources) {
              if ($path -cnotmatch '^pkg/p9t_t(\d+)_reg([a-z]+)\.go$') {throw ('R25C12_MIXED_UNEXPECTED_PATH='+$path)}
              $n=[int]$Matches[1]
              $tag=[string]$Matches[2]
              if ($n -lt 24 -or $n -gt 40 -or $seen.ContainsKey($n)) {throw ('R25C12_MIXED_RECORD_DRIFT='+$n)}
              $seen[$n]=$true
              $old=@(& git -C $root show "$($parent):$path")
              $new=@(& git -C $root show "$($head):$path")
              if (@($old).Count -ne @($new).Count) {throw ('R25C12_MIXED_LINE_DRIFT='+$path)}
              $edits=0;$bools=0;$slices=0
              for ($i=0; $i -lt @($old).Count; $i++) {
                if ($old[$i] -cne $new[$i]) {
                  if ($old[$i] -cnotmatch ('`json:"'+[regex]::Escape($tag)+'"')) {throw ('R25C12_MIXED_WRONG_ORIGINAL_TAG='+$path)}
                  if ($old[$i] -match '\bbool\s+`json:') {$bools++}
                  elseif ($old[$i] -match '\[\][A-Za-z0-9_]+\s+`json:') {$slices++}
                  else {throw ('R25C12_MIXED_UNEXPECTED_FIELD_KIND='+$path)}
                  $expect=[regex]::Replace($old[$i],'`json:"[^"]+"`','`json:"-"`')
                  if ($expect -cne $new[$i]) {throw ('R25C12_MIXED_NON_TAG_CHANGE='+$path)}
                  $edits++
                }
              }
              if ($edits -ne 2 -or $bools -ne 1 -or $slices -ne 1) {throw ('R25C12_MIXED_FIELD_COUNT_DRIFT='+$path)}
            }
            foreach ($n in 24..40) {if (!$seen.ContainsKey($n)) {throw "R25C12_MIXED_MISSING_T$n"}}
            Write-Output 'R25C12_MIXED_17_TAG_ONLY_DIFFS=PASS'
            Copy-Item -LiteralPath $test -Destination $frozen
            Push-Location $root
            try {
              & go mod download *> $log
              if ($LASTEXITCODE -ne 0) {Get-Content $log -Tail 25;throw 'R25C12_MIXED_MODULE_DOWNLOAD_FAILED'}
              & git checkout --detach $parent *> $log
              if ($LASTEXITCODE -ne 0 -or (& git rev-parse 'HEAD^{tree}').Trim() -cne $parentTree) {throw 'R25C12_MIXED_PARENT_CHECKOUT_DRIFT'}
              Copy-Item -LiteralPath $frozen -Destination $test
              $env:R25C12_MIXED_PARENT_MODE='1'
              & go test -vet=off -mod=readonly -count=1 -timeout=600s -v -run '^TestR25C12MixedPhase9HistoricalJSONWire$' ./pkg *> $log
              if ($LASTEXITCODE -ne 0) {Get-Content $log -Tail 80;throw 'R25C12_MIXED_PARENT_WIRE_FAILED'}
              $parentOutput=[string](Get-Content -LiteralPath $log -Raw)
              foreach ($n in 24..40) {
                $k='T'+$n
                $inv=[regex]::Match($parentOutput,('R25C12_MIXED_PARENT_'+$k+'_FIELDS_B64=([A-Za-z0-9+/=]+)'))
                $sha=[regex]::Match($parentOutput,('R25C12_MIXED_PARENT_'+$k+'_SHA256=([a-f0-9]{64})'))
                if (!$inv.Success -or !$sha.Success) {throw ('R25C12_MIXED_MISSING_PARENT_FINGERPRINT='+$k)}
                [Environment]::SetEnvironmentVariable(('R25C12_MIXED_'+$k+'_FIELDS_B64'),$inv.Groups[1].Value)
                [Environment]::SetEnvironmentVariable(('R25C12_MIXED_'+$k+'_SHA256'),$sha.Groups[1].Value)
              }
              Write-Output 'R25C12_MIXED_17_PARENT_JSON_WIRE_FINGERPRINTS=PASS'
              Remove-Item -LiteralPath $test -Force
              & git checkout --detach $head *> $log
              if ($LASTEXITCODE -ne 0 -or (& git rev-parse 'HEAD^{tree}').Trim() -cne $headTree) {throw 'R25C12_MIXED_HEAD_RESTORE_DRIFT'}
              $env:R25C12_MIXED_PARENT_MODE='0'
              & go test -vet=off -mod=readonly -count=1 -timeout=600s -v -run '^TestR25C12MixedPhase9HistoricalJSONWire$' ./pkg *> $log
              if ($LASTEXITCODE -ne 0) {Get-Content $log -Tail 80;throw 'R25C12_MIXED_CANDIDATE_WIRE_FAILED'}
              Write-Output 'R25C12_MIXED_17_JSON_WIRE_BYTE_IDENTICAL=PASS'
              & go vet -mod=readonly -structtag ./pkg *> $log
              if ($LASTEXITCODE -ne 0) {Get-Content $log -Tail 40;throw 'R25C12_STRUCTTAG_NOT_CLEARED'}
              Write-Output 'R25C12_STRUCTTAG_ALL_CLEAR=PASS'
              & go vet -mod=readonly ./pkg *> $log
              if ($LASTEXITCODE -ne 0) {Get-Content $log -Tail 40;throw 'R25C12_FULL_PACKAGE_VET_FAILED'}
              Write-Output 'R25C12_COMPLETE_PACKAGE_VET=PASS'
              Write-Output 'R25C12_ALL_1081_INHERITED_STRUCTTAG_DIAGNOSTICS_CLEARED=PASS'
              Write-Output 'R25C12_FINAL_FULL_REGRESSION=NOT_RUN'
              $global:LASTEXITCODE=0
            } finally {Pop-Location}
          } finally {Remove-Item -LiteralPath $log,$frozen -Force -ErrorAction SilentlyContinue}
      - name: Cleanup private source
        if: always()
        shell: pwsh
        run: |
          Remove-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'source') -Force -Recurse -ErrorAction SilentlyContinue
          Write-Output 'R25C12_MIXED_PRIVATE_CHECKOUT_CLEANUP=PASS'
