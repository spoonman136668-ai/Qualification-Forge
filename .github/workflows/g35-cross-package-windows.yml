name: G35 recursive local cross-package Go call acceptance
on:
  push:
    branches: [qualification/g35-cross-package-20261019]
    paths: [.github/workflows/g35-cross-package-windows.yml]
permissions:
  contents: read
concurrency:
  group: g35-local-import-bound-20261019
  cancel-in-progress: false
jobs:
  qualification:
    if: github.repository == 'spoonman136668-ai/Qualification-Forge'
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      G35_SOURCE: 'df9f083e84af8cd6d0599d10560484e4b1ffdec1'
      G35_TREE: '757f317904fc20b098e4f0de5db2660b476634d4'
      G35_BASE: '7880474e507854eed74832adbce578d246b749ab'
      GOFLAGS: '-p=2'
      GOMAXPROCS: '2'
      CGO_ENABLED: '1'
      KTRADE_CI_PAPER_ONLY: '1'
      KTRADE_CI_LIVE_AUTHORITY: '0'
      KTRADE_CI_COINBASE_ALLOWED: '0'
      KTRADE_CI_PROMOTION_ALLOWED: '0'
    steps:
      - name: Checkout private exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: spoonman136668-ai/KTRADE
          ref: df9f083e84af8cd6d0599d10560484e4b1ffdec1
          fetch-depth: 0
          path: source
          persist-credentials: false
          token: ${{ secrets.KTRADE_SOURCE_READ_TOKEN }}
      - name: Verify immutable source and scope
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_OS -cne 'Windows' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or
             $env:KTRADE_CI_PAPER_ONLY -cne '1' -or $env:KTRADE_CI_LIVE_AUTHORITY -cne '0' -or
             $env:KTRADE_CI_COINBASE_ALLOWED -cne '0' -or $env:KTRADE_CI_PROMOTION_ALLOWED -cne '0'){
            throw 'G35_UNSAFE_PLATFORM_OR_AUTHORITY'
          }
          if((git rev-parse HEAD).Trim() -cne $env:G35_SOURCE -or
             (git rev-parse 'HEAD^{tree}').Trim() -cne $env:G35_TREE){throw 'G35_SOURCE_DRIFT'}
          $expected=@('tools/graphify/g35_typecalls/README.md','tools/graphify/g35_typecalls/main.go','tools/graphify/g35_typecalls/main_test.go')|Sort-Object
          $actual=@(git diff --name-only $env:G35_BASE $env:G35_SOURCE)|Sort-Object
          if($actual.Count -ne 3 -or @(Compare-Object $expected $actual).Count -ne 0){throw 'G35_DELTA_SCOPE_DRIFT'}
          if(@(git status --porcelain).Count -ne 0){throw 'G35_CHECKOUT_DIRTY'}

          # Exact immutable source identities of all 12 app Go files; fail closed on identity drift.
          $sourceWitnesses=@(
            @{p='internal/durableupgrade/durable_upgrade.go';sha='0b5d77438af932cee56082aab320ef8d1378d0b5'},
            @{p='internal/durableupgrade/installed_inventory_hash.go';sha='33a2682a3113b1ceb1cb21453c36f9d2f6c10715'},
            @{p='internal/durableupgrade/installed_inventory_readonly.go';sha='d96cb0d82fc107751c9c7a47320cde0dd1627e0a'},
            @{p='internal/durableupgrade/installed_inventory_review.go';sha='ee91b19a810c248376628489f6b398107806f339'},
            @{p='internal/paperproposal/proposal.go';sha='b0c41b3bb69a51ef1528b52aa33245a11c4d0d3e'},
            @{p='internal/paperreconcile/commit_protocol_shadow.go';sha='b3cd213be821779aac321044cd706874b2e5397c'},
            @{p='internal/paperreconcile/original_risk_custody.go';sha='c9d47d8024f63d3502dbb58b9ecfc4ebdb9c6036'},
            @{p='internal/paperreconcile/reconcile.go';sha='fccbbc574dd4a308e9ea2a30dc8b9237af4abced'},
            @{p='internal/paperreconcile/risk_replay.go';sha='5c0b07ace7dc7789d4aa8d20f0661dd9eee92dac'},
            @{p='internal/paperreconcile/settlement_review.go';sha='09de943e8a95834790bc8f7803bdf261a9dce844'},
            @{p='internal/paperreconcile/windows_fs_capability_shadow_windows.go';sha='503f4af107eadcd1fce3abbbd7d7ac011c216b77'},
            @{p='internal/papertrading/ledger.go';sha='d44341253e7d4b51d31b03cea26a77cbbb534f7b'}
          )
          foreach($src in $sourceWitnesses){
            $found=(& git hash-object -- $src.p).Trim()
            if($LASTEXITCODE -ne 0 -or $found -cne $src.sha){throw ('G35_APP_GIT_BLOB_DRIFT_'+$src.p)}
          }
          Write-Host 'G35_TWELVE_SOURCE_BLOBS_EXACT=PASS'
          Write-Host 'G35_EXACT_THREE_TOOLING_FILES_ONLY=PASS'
      - name: Install existing Go toolchain
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Qualify typed and adversarial synthetic controls
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference='Stop'
          & go test -mod=readonly -count=1 -v ./tools/graphify/g35_typecalls
          if($LASTEXITCODE -ne 0){throw 'G35_FOCUSED_TEST_FAILED'}
          & go vet -mod=readonly ./tools/graphify/g35_typecalls
          if($LASTEXITCODE -ne 0){throw 'G35_FOCUSED_VET_FAILED'}
          & go build -mod=readonly -o (Join-Path $env:RUNNER_TEMP 'g34.exe') ./tools/graphify/g35_typecalls
          if($LASTEXITCODE -ne 0){throw 'G35_BUILD_FAILED'}
          Write-Host 'G35_SEVEN_POSITIVE_NEGATIVE_TESTS_VET_BUILD=PASS'
      - name: Run frozen G34-B control and prospective G35 source-bound closure
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference='Stop'
          $exe=Join-Path $env:RUNNER_TEMP 'g35.exe'
          function Invoke-Bounded {
            param([string]$Group,[string]$Packages)
            $raw=Join-Path $env:RUNNER_TEMP ('g35-private-'+$Group+'-'+$env:GITHUB_RUN_ID+'.json')
            if(Test-Path -LiteralPath $raw){throw 'G35_RAW_REPORT_COLLISION'}
            $psi=[System.Diagnostics.ProcessStartInfo]::new($exe)
            $psi.WorkingDirectory=(Get-Location).Path
            $psi.UseShellExecute=$false
            $psi.RedirectStandardOutput=$true
            $psi.RedirectStandardError=$true
            [void]$psi.ArgumentList.Add('--repo=.')
            [void]$psi.ArgumentList.Add(('--base='+$env:G35_BASE))
            [void]$psi.ArgumentList.Add(('--source='+$env:G35_SOURCE))
            [void]$psi.ArgumentList.Add(('--packages='+$Packages))
            [void]$psi.ArgumentList.Add(('--out='+$raw))
            if($psi.ArgumentList.Count -ne 5){throw 'G35_ARGUMENT_VECTOR_FAILED'}
            $watch=[System.Diagnostics.Stopwatch]::StartNew()
            $proc=[System.Diagnostics.Process]::Start($psi)
            if($null -eq $proc){throw 'G35_START_FAILED'}
            $stdoutTask=$proc.StandardOutput.ReadToEndAsync()
            $stderrTask=$proc.StandardError.ReadToEndAsync()
            $peak=[long]0
            while(-not $proc.HasExited){
              try{
                $m=[long]$proc.PeakWorkingSet64
                if($m -le 0){$m=[long]$proc.WorkingSet64}
                if($m -gt $peak){$peak=$m}
              }catch{}
              Start-Sleep -Milliseconds 50
            }
            $proc.WaitForExit()
            $std=$stdoutTask.GetAwaiter().GetResult()
            $err=$stderrTask.GetAwaiter().GetResult()
            $watch.Stop()
            if($proc.ExitCode -ne 0){
              if($err){Write-Host $err}
              throw ('G35_'+$Group+'_CHECK_FAILED_'+$proc.ExitCode)
            }
            if(-not(Test-Path -LiteralPath $raw)){throw 'G35_RAW_OUTPUT_ABSENT'}
            if($peak -le 0 -or $peak -gt 536870912){throw ('G35_RSS_CAP_'+$Group+'_'+$peak)}
            if($watch.Elapsed.TotalSeconds -gt 120){throw ('G35_WALL_TIME_CAP_'+$Group)}
            $d=Get-Content -LiteralPath $raw -Raw|ConvertFrom-Json
            if($d.Schema -cne 'graphify.g35.type-checked-cross-package.v1' -or
               $d.SourceCommit -cne $env:G35_SOURCE -or $d.SourceTree -cne $env:G35_TREE -or
               $d.BaseCommit -cne $env:G35_BASE){throw ('G35_INVALID_REPORT_ID_'+$Group)}
            if($d.CallSites -le 0 -or $d.CallSites -gt 20000 -or
               $d.SourceFileCount -gt 36 -or $d.SelectedSourceBytes -gt 3145728 -or
               $d.CallSites -ne ($d.ResolvedDirect+$d.ResolvedConcreteMethods+$d.ResolvedExternal+$d.Unresolved) -or
               @($d.TypeCheckedEdges).Count -ne ($d.CallSites-$d.Unresolved)){
              throw ('G35_NONCONSERVATIVE_COUNTS_'+$Group)
            }
            foreach($edge in $d.TypeCheckedEdges){
              if($edge.Confidence -cne 'go_types_static_object'){throw 'G35_UNJUSTIFIED_EDGE_CONFIDENCE'}
            }
            Write-Host ('G35_'+$Group+'_REPORT_SHA256='+(Get-FileHash -LiteralPath $raw -Algorithm SHA256).Hash.ToLowerInvariant())
            Write-Host ('G35_'+$Group+'_PEAK_RSS_BYTES='+$peak)
            Write-Host ('G35_'+$Group+'_WALL_MS='+([long]$watch.Elapsed.TotalMilliseconds))
            Write-Host ('G35_'+$Group+'_CALL_SITES='+$d.CallSites)
            Write-Host ('G35_'+$Group+'_CROSS_PACKAGE='+$d.CrossPackageStaticEdges)
            return [pscustomobject]@{d=$d;raw=$raw;peak=$peak;wall=[long]$watch.Elapsed.TotalMilliseconds}
          }
          $control=Invoke-Bounded -Group 'CONTROL' -Packages 'internal/papertrading,internal/durableupgrade'
          $f=$control.d
          if(@($f.SelectedPackages).Count -ne 2 -or $f.SourceFileCount -ne 5 -or
             $f.SelectedSourceBytes -ne 53729 -or $f.CallSites -ne 637 -or
             $f.G33SyntacticCandidates -ne 93 -or $f.ResolvedDirect -ne 93 -or
             $f.ResolvedConcreteMethods -ne 84 -or $f.ResolvedExternal -ne 350 -or
             $f.Unresolved -ne 110 -or $f.CrossPackageStaticEdges -ne 0){
             throw 'G35_FROZEN_G34B_BASELINE_IDENTITY_OR_RESULT_DRIFT'
          }
          Write-Host 'G35_FROZEN_G34B_SAME_INPUT_CONTROL=PASS'
          $expanded=Invoke-Bounded -Group 'EXPANDED' -Packages 'internal/papertrading,internal/paperproposal,internal/paperreconcile,internal/durableupgrade'
          $x=$expanded.d
          if(@($x.SelectedPackages).Count -ne 4 -or @($x.Packages).Count -ne 4 -or
             $x.SourceFileCount -ne 12 -or $x.CallSites -le $f.CallSites -or
             $x.CrossPackageStaticEdges -le 0 -or $x.Unresolved -le 0){
            throw 'G35_CROSS_PACKAGE_PROGRESS_OR_CLOSURE_NOT_PROVEN'
          }
          if($expanded.wall -gt 3*$control.wall -or $expanded.peak -gt 2*$control.peak){
            throw 'G35_PROPORTIONAL_CPU_RSS_REGRESSION'
          }
          Write-Host ('G35_CROSS_PACKAGE_STATIC_EDGES='+$x.CrossPackageStaticEdges)
          Write-Host ('G35_EXPLICIT_UNRESOLVED='+$x.Unresolved)
          Write-Host 'G35_FOUR_APP_PACKAGES_FROZEN_COST_ACCEPTANCE=PASS'
      - name: Seal source-bound sanitized G34-B comparison and G35 coverage
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $d=Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP ('g35-private-EXPANDED-'+$env:GITHUB_RUN_ID+'.json')) -Raw|ConvertFrom-Json
          $f=Get-Content -LiteralPath (Join-Path $env:RUNNER_TEMP ('g35-private-CONTROL-'+$env:GITHUB_RUN_ID+'.json')) -Raw|ConvertFrom-Json
          $rExpanded=Join-Path $env:RUNNER_TEMP ('g35-private-EXPANDED-'+$env:GITHUB_RUN_ID+'.json')
          $rControl=Join-Path $env:RUNNER_TEMP ('g35-private-CONTROL-'+$env:GITHUB_RUN_ID+'.json')
          $receipt=[ordered]@{
            schema='graphify.g35.cross-package-qualification.v1'
            source_sha=$env:G35_SOURCE
            source_tree=$env:G35_TREE
            base_sha=$env:G35_BASE
            qualification_workflow_commit=$env:GITHUB_SHA
            qualification_run_id=$env:GITHUB_RUN_ID
            application_blobs=@(
              '0b5d77438af932cee56082aab320ef8d1378d0b5','33a2682a3113b1ceb1cb21453c36f9d2f6c10715',
              'd96cb0d82fc107751c9c7a47320cde0dd1627e0a','ee91b19a810c248376628489f6b398107806f339',
              'b0c41b3bb69a51ef1528b52aa33245a11c4d0d3e','b3cd213be821779aac321044cd706874b2e5397c',
              'c9d47d8024f63d3502dbb58b9ecfc4ebdb9c6036','fccbbc574dd4a308e9ea2a30dc8b9237af4abced',
              '5c0b07ace7dc7789d4aa8d20f0661dd9eee92dac','09de943e8a95834790bc8f7803bdf261a9dce844',
              '503f4af107eadcd1fce3abbbd7d7ac011c216b77','d44341253e7d4b51d31b03cea26a77cbbb534f7b'
            )
            matched_g34b_control=[ordered]@{
              packages=$f.SelectedPackages
              source_files=$f.SourceFileCount
              total_calls=$f.CallSites
              direct=$f.ResolvedDirect
              concrete_methods=$f.ResolvedConcreteMethods
              external=$f.ResolvedExternal
              unresolved=$f.Unresolved
              raw_sha256=(Get-FileHash -LiteralPath $rControl -Algorithm SHA256).Hash.ToLowerInvariant()
            }
            prospective_four_packages=[ordered]@{
              packages=$d.SelectedPackages
              source_files=$d.SourceFileCount
              source_bytes=$d.SelectedSourceBytes
              total_calls=$d.CallSites
              same_scope_syntax_candidates=$d.G33SyntacticCandidates
              direct=$d.ResolvedDirect
              concrete_methods=$d.ResolvedConcreteMethods
              external=$d.ResolvedExternal
              unresolved=$d.Unresolved
              cross_package_static_calls=$d.CrossPackageStaticEdges
              allocator_sys_bytes=$d.PeakGoAllocSysBytes
              elapsed_generator_ms=$d.ElapsedMillis
              raw_sha256=(Get-FileHash -LiteralPath $rExpanded -Algorithm SHA256).Hash.ToLowerInvariant()
            }
            private_source_or_call_edges_uploaded=$false
            live_trading_authorized=$false
            full_application_regression_replayed=$false
          }
          $dir=Join-Path $env:GITHUB_WORKSPACE 'evidence'
          New-Item -ItemType Directory -Path $dir -Force|Out-Null
          $file=Join-Path $dir 'g35-sanitized-receipt.json'
          $receipt|ConvertTo-Json -Depth 8|Set-Content -LiteralPath $file -Encoding utf8
          $hash=(Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
          ($hash+'  g35-sanitized-receipt.json')|Set-Content -LiteralPath (Join-Path $dir 'g35-sanitized-receipt.sha256') -Encoding ascii
          Write-Host ('G35_SANITIZED_RECEIPT_SHA256='+$hash)
          Write-Host 'G35_FROZEN_BASELINE_AND_TYPE_RESOLUTION_RECEIPT=PASS'
      - name: Verify checkout remained immutable
        shell: pwsh
        working-directory: source
        run: |
          $ErrorActionPreference='Stop'
          if((git rev-parse HEAD).Trim() -cne $env:G35_SOURCE -or
             (git rev-parse 'HEAD^{tree}').Trim() -cne $env:G35_TREE -or
             @(git status --porcelain).Count -ne 0){throw 'G35_POST_CHECK_SOURCE_MUTATED'}
          Write-Host 'G35B_APP_SOURCE_UNMODIFIED=PASS'
      - name: Upload sanitized proof only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g35-application-typeaware-sanitized
          path: |
            evidence/g35-sanitized-receipt.json
            evidence/g35-sanitized-receipt.sha256
          retention-days: 90
          if-no-files-found: error
      - name: Remove private checkout and raw type report
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:GITHUB_WORKSPACE 'source'
          Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem -LiteralPath $env:RUNNER_TEMP -File -Filter 'g35-*' -ErrorAction SilentlyContinue|Remove-Item -Force
          Remove-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'g34.exe') -Force -ErrorAction SilentlyContinue
          if(Test-Path -LiteralPath $root){throw 'G35_SOURCE_CLEANUP_FAILED'}
          Write-Host 'G35_PRIVATE_SOURCE_AND_RAW_REPORT_CLEAN=PASS'
