name: KTRADE DIC-08 synthetic updater continuity
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ktrade-dic08-upgrade-continuity.yml

permissions:
  contents: read

jobs:
  qualify:
    if: github.repository == 'spoonman136668-ai/Qualification-Forge'
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      KTRADE_EXPECTED_SOURCE_SHA: '594b923a70cef8d224060075544934d4b9ad63a5'
      KTRADE_CI_SOURCE_ONLY: '1'
      KTRADE_CI_PAPER_ONLY: '1'
      KTRADE_CI_LIVE_AUTHORITY: '0'
      KTRADE_CI_COINBASE_ALLOWED: '0'
      KTRADE_CI_PROMOTION_ALLOWED: '0'
      GOFLAGS: '-p=2'
      GOMAXPROCS: '2'
    steps:
      - name: Require disposable hosted Windows
        shell: pwsh
        run: |
          if($env:RUNNER_OS -cne 'Windows' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted'){throw 'DIC08_UNSAFE_RUNNER'}
          Write-Host 'DIC08_HOSTED_WINDOWS=PASS'
      - name: Checkout immutable private KTRADE source without token persistence
        uses: actions/checkout@v4
        with:
          repository: spoonman136668-ai/ckb
          ref: ${{ env.KTRADE_EXPECTED_SOURCE_SHA }}
          path: checked-private
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.KTRADE_CKB_READ_TOKEN_TEMP }}
      - name: Isolated Go environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Exact source focused and full regression
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $private=Join-Path $env:RUNNER_TEMP 'dic08-private-go.log'
          Push-Location (Join-Path $env:GITHUB_WORKSPACE 'checked-private')
          try{
            $sha=(& git rev-parse HEAD).Trim()
            if($LASTEXITCODE -ne 0 -or $sha -cne $env:KTRADE_EXPECTED_SOURCE_SHA){throw 'DIC08_SOURCE_PIN_MISMATCH'}
            Write-Host 'DIC08_SOURCE_PIN=PASS'
            function Invoke-PrivateCheck([string]$label,[string]$cmd,[string[]]$args){
              try{& $cmd @args *> $private; if($LASTEXITCODE -ne 0){throw 'nonzero'}}
              catch{throw ('DIC08_'+$label+'_PRIVATE_FAILURE')}
              Write-Host ('DIC08_'+$label+'=PASS')
            }
            Invoke-PrivateCheck 'FOCUSED_UPGRADE' 'go' @('test','-count=1','-timeout=150s','./internal/durableupgrade','-run','^TestDIC08')
            Invoke-PrivateCheck 'FULL_REGRESSION' 'go' @('test','-count=1','-timeout=420s','./...')
            Invoke-PrivateCheck 'VET' 'go' @('vet','./...')
            Invoke-PrivateCheck 'GO_BUILD' 'go' @('build','./...')
            Write-Host 'DIC08_SOURCE_REGRESSION=PASS'
          }finally{
            Pop-Location
            Remove-Item -LiteralPath $private -Force -ErrorAction SilentlyContinue
          }
      - name: Actual packaged updater synthetic continuity acceptance
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $private=Join-Path $env:RUNNER_TEMP 'dic08-private-windows-upgrade.log'
          $scratch=Join-Path $env:RUNNER_TEMP 'dic08-isolated'
          Push-Location (Join-Path $env:GITHUB_WORKSPACE 'checked-private')
          try{
            & pwsh -NoProfile -File 'windows/ktrade-dic08-synthetic-upgrade.ps1' -ScratchRoot $scratch *> $private
            $exit=$LASTEXITCODE
            $allowed=@(
              'PACKAGED_UPDATER_IDENTITY',
              'SEALED_SYNTHETIC_INCIDENT_CREATED',
              'INCIDENT_INCLUDED_IN_VERIFIED_UPGRADE',
              'UPDATER_PRESERVED_INCIDENT_SETTINGS_PNL_HISTORY',
              'UPGRADE_OVERWRITE_REJECTED',
              'PENDING_INCIDENT_MIGRATION_FAILS_CLOSED',
              'NO_PRODUCTION_USER_PROFILE_OR_BROKER_ACCESS',
              'DIC08_SYNTHETIC_ACTUAL_UPDATER_ACCEPTANCE'
            )
            $lines=@(Get-Content -LiteralPath $private -ErrorAction SilentlyContinue)
            foreach($name in $allowed){
              if(@($lines|Where-Object{$_ -ceq ('DIC08_'+$name+'=PASS')}).Count -eq 1){
                Write-Host ('DIC08_'+$name+'=PASS')
              }
            }
            if($exit -ne 0){throw 'DIC08_PACKAGED_UPDATER_PRIVATE_FAILURE'}
            Write-Host 'DIC08_OFFLINE_UPDATER=PASS'
          }finally{
            Pop-Location
            Remove-Item -LiteralPath $private -Force -ErrorAction SilentlyContinue
            if(Test-Path -LiteralPath $scratch){Remove-Item -LiteralPath $scratch -Recurse -Force -ErrorAction SilentlyContinue}
          }
      - name: Assert private checkout identity unchanged
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Push-Location (Join-Path $env:GITHUB_WORKSPACE 'checked-private')
          try{
            if((& git rev-parse HEAD).Trim() -cne $env:KTRADE_EXPECTED_SOURCE_SHA){throw 'DIC08_HEAD_DRIFT'}
            if(@(& git status --porcelain=v1 --untracked-files=no).Count -ne 0){throw 'DIC08_TRACKED_CHANGE'}
            Write-Host 'DIC08_SOURCE_UNCHANGED=PASS'
          }finally{Pop-Location}
      - name: Purge private source and do not publish artifacts
        if: always()
        shell: pwsh
        run: |
          $path=Join-Path $env:GITHUB_WORKSPACE 'checked-private'
          if(Test-Path -LiteralPath $path){Remove-Item -LiteralPath $path -Force -Recurse -ErrorAction SilentlyContinue}
          Write-Host 'DIC08_PUBLIC_PRIVATE_ARTIFACT_UPLOAD=DISABLED'
