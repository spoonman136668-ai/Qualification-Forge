name: DIC-45D isolated read-only verifier Windows qualification
on:
  push:
    branches: [qualification/dic45d-windows-one-shot-20261015-r1]
    paths: [.github/workflows/ktrade-dic45d-one-shot.yml]

permissions:
  contents: write

concurrency:
  group: dic45d-readonly-windows-qualification
  cancel-in-progress: false

jobs:
  dic45d-independent-windows:
    if: github.repository == 'spoonman136668-ai/Qualification-Forge' && github.ref == 'refs/heads/qualification/dic45d-windows-one-shot-20261015-r1' && github.run_attempt == 1
    runs-on: windows-2022
    timeout-minutes: 65
    env:
      PLANE_SOURCE_SHA: '8f4046174191898850b59b136e230303fd73a3ac'
      KTRADE_SOURCE_SHA: '3cabbdb30fd772e7c730e0089f82ed71168f46b9'
      KTRADE_CI_SOURCE_ONLY: '1'
      KTRADE_CI_PAPER_ONLY: '1'
      KTRADE_CI_LIVE_AUTHORITY: '0'
      KTRADE_CI_COINBASE_ALLOWED: '0'
      KTRADE_CI_PROMOTION_ALLOWED: '0'
      CKB_PLANE_ACCEPTED_REF_MUTATION: '0'
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
      GOWORK: 'off'
    steps:
      - name: Validate hosted zero-authority Windows environment
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_OS -cne 'Windows' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted'){throw 'DIC45D_REQUIRES_EPHEMERAL_HOSTED_WINDOWS'}
          if($env:KTRADE_CI_LIVE_AUTHORITY -cne '0' -or $env:KTRADE_CI_COINBASE_ALLOWED -cne '0' -or $env:KTRADE_CI_PROMOTION_ALLOWED -cne '0'){throw 'DIC45D_AUTHORITY_POLICY_INVALID'}
          if($env:GITHUB_RUN_ATTEMPT -cne '1'){throw 'DIC45D_RETRY_NOT_AUTHORIZED'}
          Write-Host 'DIC45D_HOSTED_WINDOWS_ISOLATION=PASS'
      - name: Checkout exact private frozen CKB-plane verifier source
        uses: actions/checkout@v4
        with:
          repository: spoonman136668-ai/ckb-plane
          ref: 8f4046174191898850b59b136e230303fd73a3ac
          path: plane-private
          persist-credentials: false
          fetch-depth: 0
          token: ${{ secrets.KTRADE_CKB_READ_TOKEN_TEMP }}
      - name: Checkout exact private KTRADE verification subject
        uses: actions/checkout@v4
        with:
          repository: spoonman136668-ai/ckb
          ref: 3cabbdb30fd772e7c730e0089f82ed71168f46b9
          path: ktrade-private
          persist-credentials: false
          fetch-depth: 0
          token: ${{ secrets.KTRADE_CKB_READ_TOKEN_TEMP }}
      - name: Set up clean Go compiler
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false
      - name: Bind exact source, Windows qualification scope and immutable receipt
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          $plane=Join-Path $env:GITHUB_WORKSPACE 'plane-private'
          $ktrade=Join-Path $env:GITHUB_WORKSPACE 'ktrade-private'
          if((& git -C $plane rev-parse HEAD).Trim() -cne $env:PLANE_SOURCE_SHA -or $LASTEXITCODE -ne 0){throw 'DIC45D_PLANE_SOURCE_IDENTITY_DRIFT'}
          if((& git -C $ktrade rev-parse HEAD).Trim() -cne $env:KTRADE_SOURCE_SHA -or $LASTEXITCODE -ne 0){throw 'DIC45D_KTRADE_SOURCE_IDENTITY_DRIFT'}
          $v=Join-Path $plane 'proposals/ktrade-dic45-readonly-r1'
          foreach($path in @('verifier.go','verifier_test.go','go.mod','testdata/38827824609.json')){
            if(-not(Test-Path -LiteralPath (Join-Path $v $path) -PathType Leaf)){throw 'DIC45D_SOURCE_FILE_MISSING'}
          }
          $receipt=(Get-Content -LiteralPath (Join-Path $v 'testdata/38827824609.json') -Raw)
          if([string]::IsNullOrWhiteSpace($receipt)){throw 'DIC45D_RECEIPT_MISSING'}
          Write-Host 'DIC45D_EXACT_PRIVATE_SOURCE_BOUND=PASS'
      - name: Real Git subject integration and focused fail-closed tests
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $src=Join-Path $env:GITHUB_WORKSPACE 'plane-private/proposals/ktrade-dic45-readonly-r1'
          $env:DIC45_KTRADE_CLONE=Join-Path $env:GITHUB_WORKSPACE 'ktrade-private'
          $test=Join-Path $src 'hosted_identity_test.go'
          $log=Join-Path $env:RUNNER_TEMP 'dic45d-private-focused.log'
          try {
            @'
          package dic45
          import ("context"; "os"; "testing")
          func TestDIC45HostedExactRealGitEvidence(t *testing.T) {
            raw,e:=os.ReadFile("testdata/38827824609.json");if e!=nil{t.Fatal(e)}
            report,e:=Verify(context.Background(),LocalGit("git",os.Getenv("DIC45_KTRADE_CLONE")),raw)
            if e!=nil{t.Fatal(e)}
            if report.Disposition!=PendingAuthority||report.ControllerAdmission||report.RefMutation||len(report.CheckedPaths)!=3{t.Fatalf("invalid disposition: %+v",report)}
          }
          '@ | Set-Content -LiteralPath $test -Encoding utf8
            Push-Location $src
            try {
              & go test -count=1 -timeout=240s ./... *> $log
              if($LASTEXITCODE -ne 0){throw 'DIC45D_FOCUSED_TESTS_FAILED_PRIVATE_OUTPUT_WITHHELD'}
              Write-Host 'DIC45D_FOCUSED_NEGATIVE_AND_REAL_GIT_TESTS=PASS'
              & go vet ./... *> $log
              if($LASTEXITCODE -ne 0){throw 'DIC45D_FOCUSED_VET_FAILED_PRIVATE_OUTPUT_WITHHELD'}
              Write-Host 'DIC45D_FOCUSED_VET=PASS'
              & go build ./... *> $log
              if($LASTEXITCODE -ne 0){throw 'DIC45D_FOCUSED_BUILD_FAILED_PRIVATE_OUTPUT_WITHHELD'}
              Write-Host 'DIC45D_FOCUSED_BUILD=PASS'
            }finally{Pop-Location}
          }finally{
            Remove-Item -LiteralPath $test,$log -Force -ErrorAction SilentlyContinue
            Remove-Item Env:DIC45_KTRADE_CLONE -ErrorAction SilentlyContinue
          }
      - name: ONE full frozen controller Go regression vet and build
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $root=Join-Path $env:GITHUB_WORKSPACE 'plane-private/snapshot/source'
          $log=Join-Path $env:RUNNER_TEMP 'dic45d-private-full.log'
          Push-Location $root
          try {
            & go test -count=1 -timeout=420s ./... *> $log
            if($LASTEXITCODE -ne 0){throw 'DIC45D_FULL_CONTROLLER_GO_REGRESSION_FAILED_PRIVATE_OUTPUT_WITHHELD'}
            Write-Host 'DIC45D_ONE_FULL_CONTROLLER_GO_REGRESSION=PASS'
            & go vet ./... *> $log
            if($LASTEXITCODE -ne 0){throw 'DIC45D_CONTROLLER_VET_FAILED_PRIVATE_OUTPUT_WITHHELD'}
            Write-Host 'DIC45D_CONTROLLER_VET=PASS'
            & go build ./... *> $log
            if($LASTEXITCODE -ne 0){throw 'DIC45D_CONTROLLER_BUILD_FAILED_PRIVATE_OUTPUT_WITHHELD'}
            Write-Host 'DIC45D_CONTROLLER_BUILD=PASS'
          }finally{
            Pop-Location
            Remove-Item -LiteralPath $log -Force -ErrorAction SilentlyContinue
          }
      - name: Fail closed on tracked-source mutation
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $plane=Join-Path $env:GITHUB_WORKSPACE 'plane-private'
          $ktrade=Join-Path $env:GITHUB_WORKSPACE 'ktrade-private'
          if(@(& git -C $plane status --porcelain=v1 --untracked-files=no).Count -ne 0){throw 'DIC45D_PLANE_SOURCE_MUTATED'}
          if(@(& git -C $ktrade status --porcelain=v1 --untracked-files=no).Count -ne 0){throw 'DIC45D_KTRADE_SOURCE_MUTATED'}
          Write-Host 'DIC45D_PRIVATE_REPOS_UNCHANGED=PASS'
          Write-Host 'DIC45D_CONTROLLER_DISPATCH=FALSE'
          Write-Host 'DIC45D_CONTROLLER_ACCEPTANCE=FALSE'
          Write-Host 'DIC45D_REF_MUTATION=FALSE'
          Write-Host 'DIC45D_LIVE_BROKER=FALSE'
      - name: Remove private source and suppress artifact publication
        if: always()
        shell: pwsh
        run: |
          foreach($p in @('plane-private','ktrade-private')){
            $dir=Join-Path $env:GITHUB_WORKSPACE $p
            Remove-Item -LiteralPath $dir -Force -Recurse -ErrorAction SilentlyContinue
          }
          Write-Host 'DIC45D_PRIVATE_ARTIFACT_UPLOAD=DISABLED'
      - name: Publish sanitized identity-bound receipt without private artifacts
        if: success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $doc=[ordered]@{
            schema='ktrade.dic45d.readonly-verifier-windows-qualification.v1'
            run_id=$env:GITHUB_RUN_ID
            workflow_sha=$env:GITHUB_SHA
            plane_source_sha=$env:PLANE_SOURCE_SHA
            ktrade_source_sha=$env:KTRADE_SOURCE_SHA
            origin_receipt_blob_sha='fd449b16f753492758da705d9f037e5879288662'
            hosted_windows=$true
            real_git_identity_integrated=$true
            focused_negative_tests=$true
            one_full_frozen_controller_go_regression=$true
            vet_and_build=$true
            source_only=$true
            controller_admitted=$false
            accepted_ref_mutated=$false
            production_promotion=$false
            live_broker_authorized=$false
            private_artifacts=0
          }|ConvertTo-Json -Compress
          $body=@{message='evidence: DIC45D read-only exact-source hosted Windows qualification';content=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($doc+"`n"));branch='main'}|ConvertTo-Json
          $uri='https://api.github.com/repos/spoonman136668-ai/Qualification-Forge/contents/qualification-evidence/dic45d-runs/'+$env:GITHUB_RUN_ID+'.json'
          Invoke-RestMethod -Uri $uri -Method Put -ContentType 'application/json' -Headers @{
            Authorization=('Bearer '+$env:GH_TOKEN)
            Accept='application/vnd.github+json'
            'X-GitHub-Api-Version'='2022-11-28'
          } -Body $body -TimeoutSec 30|Out-Null
          Write-Host 'DIC45D_SANITIZED_RECEIPT_PUBLISHED=PASS'
