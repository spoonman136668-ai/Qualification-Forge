# Exact-source KTRADE chart-first UI redesign full regression and genuine Wails acceptance.
# Retain old accepted UI/Pine/TradeGuard negative controls; LIVE disarmed; no installation.
on:
  push:
    branches:
      - qualification/ktrade-ui-workstation-refresh-20261108
    paths:
      - .github/workflows/ktrade-pr252-current-exact-windows.yml
permissions:
  contents: read
concurrency:
  group: ktrade-ui-redesign-exact-windows-20261108
  cancel-in-progress: false
jobs:
  native-regression:
    # This follow-up only classifies W41's cold-reopen failure. Preserve the
    # independent native regression running on its prior exact source.
    if: github.repository == 'spoonman136668-ai/Qualification-Forge' && github.ref == 'refs/heads/qualification/ktrade-ui-workstation-refresh-20261108' && !contains(github.event.head_commit.message, 'wails-only') && !contains(github.event.head_commit.message, 'W116_NATIVE_ONLY') && !contains(github.event.head_commit.message, 'W118_PUBLIC_FEED_ONESHOT') && !contains(github.event.head_commit.message, 'W118B_PUBLIC_DIAG_ONLY') && !contains(github.event.head_commit.message, 'W120_PUBLIC_MATCHES_ONLY') && !contains(github.event.head_commit.message, 'W122_PUBLIC_100T_ONESHOT') && !contains(github.event.head_commit.message, 'W123_REAL_NATIVE_UI_ONLY') && !contains(github.event.head_commit.message, 'W124_REAL_MULTI_TICK_UI_ONLY') && !contains(github.event.head_commit.message, 'W127_REAL_STALE_UI_ONLY') && !contains(github.event.head_commit.message, 'W128_NATIVE_RESELECT_ONLY') && !contains(github.event.head_commit.message, 'W130_NATIVE_CHART_GESTURES_ONLY') && !contains(github.event.head_commit.message, 'W132_NATIVE_KEYBOARD_ONLY') && !contains(github.event.head_commit.message, 'W134_NATIVE_SMA20_ONLY') && !contains(github.event.head_commit.message, 'W136_NATIVE_EMA20_ONLY') && !contains(github.event.head_commit.message, 'W138_NATIVE_RSI14_ONLY') && !contains(github.event.head_commit.message, 'W140_NATIVE_BB20_ONLY') && !contains(github.event.head_commit.message, 'W142_NATIVE_MACD_ONLY') && !contains(github.event.head_commit.message, 'W144_NATIVE_PANE_STACK_ONLY') && !contains(github.event.head_commit.message, 'W146_NATIVE_10T50T_ONLY') && !contains(github.event.head_commit.message, 'W147_NATIVE_LARGE_COUNTS_ONLY')
    runs-on: windows-2022
    timeout-minutes: 65
    env:
      KTRADE_EXPECTED_SOURCE: 'c37a60eb785edb57de3206f3841347e369929bc9'
      QFORGE_TARGETED_PKG_ONLY: '0'
      QFORGE_NODE_FIRST_BATCH_DIAG_ONLY: '0'
      QFORGE_NODE_BATCH_25_DIAG_ONLY: '1'
      KTRADE_EXPECTED_TREE: 'd8f0d499ef3e6b94880305e37c7e9b68f2c1c05e'
      KTRADE_LIVE_TRADING: 'false'
      KTRADE_CI_LIVE_AUTHORITY: '0'
      KTRADE_CI_PROMOTION_ALLOWED: '0'
      KTRADE_CI_COINBASE_ALLOWED: '0'
      KTRADE_PAPER_SESSION_ROOT: ''
      KTRADE_PAPER_CUSTODY_REVIEW_ROOT: ''
      CGO_ENABLED: '1'
      GOWORK: 'off'
      GOTOOLCHAIN: 'local'
      KTRADE_USE_LEGACY_CDP_CONFIG: '0'
      KTRADE_HEAD_REPOSITORY: 'spoonman136668-ai/ktrade'
      KTRADE_REPOSITORY_PRIVATE: 'true'
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
    steps:
      - name: Checkout immutable original KTRADE source, read only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: spoonman136668-ai/ktrade
          ref: c37a60eb785edb57de3206f3841347e369929bc9
          fetch-depth: 0
          path: product
          persist-credentials: false
          token: ${{ secrets.KTRADE_SOURCE_READ_TOKEN }}
      - name: Checkout immutable four-reader browser baseline for genuine cross-version regression
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: spoonman136668-ai/ktrade
          ref: 5a35dea7822c34ee18cafa5486671a8d72eef87e
          path: browser-baseline
          persist-credentials: false
          token: ${{ secrets.KTRADE_SOURCE_READ_TOKEN }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /static/watchlist_manager.js
            /static/layout_manager.js
            /static/indicator_library.js
            /static/indicator_browser.js
      - name: Setup pinned supported Go and Node
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact product custody, full native regressions, Wails builds, and Node suites
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';Set-StrictMode -Version Latest
          $p=Join-Path $env:GITHUB_WORKSPACE 'product'
          $log=Join-Path $env:RUNNER_TEMP 'ktrade-current-private-qualification.log'
          function Require([bool]$v,[string]$m){if(!$v){throw $m}}
          Require ($env:RUNNER_OS -ceq 'Windows' -and $env:RUNNER_ENVIRONMENT -ceq 'github-hosted' -and
            $env:GITHUB_REPOSITORY -ceq 'spoonman136668-ai/Qualification-Forge' -and
            $env:GITHUB_REF -ceq 'refs/heads/qualification/ktrade-ui-workstation-refresh-20261108' -and
            $env:GITHUB_EVENT_NAME -ceq 'push') 'QFORGE_WRONG_RUNNER_OR_SCOPE'
          Require ((& git -C $p rev-parse HEAD).Trim() -ceq $env:KTRADE_EXPECTED_SOURCE -and
            (& git -C $p rev-parse 'HEAD^{tree}').Trim() -ceq $env:KTRADE_EXPECTED_TREE -and
            @(& git -C $p status --porcelain).Count -eq 0 -and
            !(Test-Path -LiteralPath (Join-Path $p '.env'))) 'QFORGE_EXACT_PRIVATE_SOURCE_REFUSED'
          function Checked([string]$label,[string]$command,[string[]]$argv){
            Require ($argv.Count -gt 0) ('QFORGE_'+$label+'_EMPTY_COMMAND_ARGS')
            & $command @argv *> $log
            if($LASTEXITCODE -ne 0){
              # Public qualifier never prints private test output, names,
              # source, paths, credentials or build artifacts. Return only a
              # bounded failure-class fingerprint so Go test vs build vs
              # timeout can be distinguished without exposing KTRADE code.
              $bytes=(Get-Item -LiteralPath $log -ErrorAction SilentlyContinue).Length
              $sha=if(Test-Path -LiteralPath $log){(Get-FileHash -LiteralPath $log -Algorithm SHA256).Hash.ToLowerInvariant()}else{'none'}
              $failureCases=0;$failurePkgs=0;$compileUnits=0;$timedOut=$false;$outOfMemory=$false
              if($null -ne $bytes -and $bytes -ge 0 -and $bytes -le 10000000){
                $private=[IO.File]::ReadAllText($log)
                $failureCases=([regex]::Matches($private,'(?m)^\s*--- FAIL:')).Count
                $failurePkgs=([regex]::Matches($private,'(?m)^FAIL\s+\S+')).Count
                $compileUnits=([regex]::Matches($private,'(?m)^#\s+\S+')).Count
                $timedOut=$private.Contains('panic: test timed out')
                $outOfMemory=$private.Contains('fatal error: out of memory')
                # Source-private, identity-free diagnosis. Publish only
                # numeric positions of failing packages in the stable
                # go-list output and numeric parent Test positions. No
                # package/test names, source, raw log or credentials leave VM.
                if($label -eq 'PKG_TARGETED_REPRO'){
                  $failed=@([regex]::Matches($private,'(?m)^\s*--- FAIL:\s+(\S+)')|
                    ForEach-Object {$_.Groups[1].Value.Split('/')[0]}|
                    Select-Object -Unique)
                  $need=[Collections.Generic.HashSet[string]]::new([StringComparer]::Ordinal)
                  foreach($name in $failed){[void]$need.Add($name)}
                  $files=@(Get-ChildItem -LiteralPath (Join-Path $p 'pkg') -Filter '*_test.go' -File|
                    Sort-Object Name)
                  $filePositions=@()
                  for($fi=0;$fi -lt $files.Count;$fi++){
                    $textBody=[IO.File]::ReadAllText($files[$fi].FullName)
                    $ms=[regex]::Matches($textBody,'(?m)^func\s+(Test[A-Za-z0-9_]+)\s*\(')
                    foreach($m in $ms){
                      if($need.Contains($m.Groups[1].Value)){
                        $filePositions+= $fi
                        [void]$need.Remove($m.Groups[1].Value)
                      }
                    }
                    Remove-Variable textBody -ErrorAction SilentlyContinue
                  }
                  $filePositions=@($filePositions|Sort-Object -Unique)
                  Write-Host ('QFORGE_GO_PKG_PRIVATE_FILE_ORDINALS='+($filePositions -join ',')+
                    ';unmatched_failure_count='+$need.Count+';candidate_test_files='+$files.Count)
                  Remove-Variable failed,need,files,filePositions -ErrorAction SilentlyContinue
                }
                if($label -eq 'GO_FULL_DEFAULT'){
                  $packageOrder=@(& go list -mod=readonly ./... 2>$null)
                  $failedPkgs=@([regex]::Matches($private,'(?m)^FAIL\s+(ktrade/\S+)')|
                    ForEach-Object {$_.Groups[1].Value}|Select-Object -Unique)
                  $bins=@()
                  foreach($packageName in $failedPkgs){
                    $pkgIndex=[array]::IndexOf($packageOrder,$packageName)
                    if($pkgIndex -lt 0){continue}
                    $relative=$packageName.Substring(7)
                    $pkgSource=Join-Path (Get-Location).Path ($relative.Replace('/','\'))
                    $tests=@(Get-ChildItem -LiteralPath $pkgSource -Filter '*_test.go' -File -ErrorAction SilentlyContinue|
                      Sort-Object Name|ForEach-Object {
                        $fileText=[IO.File]::ReadAllText($_.FullName)
                        [regex]::Matches($fileText,'(?m)^func\s+(Test[A-Za-z0-9_]+)\s*\(')|
                          ForEach-Object {$_.Groups[1].Value}
                      })
                    $tests=@($tests|Sort-Object -Unique)
                    $cases=@([regex]::Matches($private,'(?m)^\s*--- FAIL:\s+(\S+)')|
                      ForEach-Object {$_.Groups[1].Value.Split('/')[0]}|
                      Select-Object -Unique)
                    $positions=@($cases|ForEach-Object {[array]::IndexOf($tests,$_)}|
                      Where-Object {$_ -ge 0}|Sort-Object -Unique)
                    $bins+=($pkgIndex.ToString()+':'+($positions -join ','))
                    Remove-Variable pkgSource,tests,cases,positions -ErrorAction SilentlyContinue
                  }
                  Write-Host ('QFORGE_GO_DEFAULT_PRIVATE_ORDINAL_BINS='+($bins -join ';'))
                  Remove-Variable packageOrder,failedPkgs,bins,packageName,relative -ErrorAction SilentlyContinue
                }
                Remove-Variable private -ErrorAction SilentlyContinue
              }
              Write-Host ('QFORGE_'+$label+'_PRIVATE_CLASS: cases='+$failureCases+
                ';packages='+$failurePkgs+';compile_units='+$compileUnits+
                ';timeout='+$timedOut+';oom='+$outOfMemory+
                ';log_sha256='+$sha+';raw_bytes='+$bytes)
              throw ('QFORGE_'+$label+'_FAIL_PRIVATE_OUTPUT_WITHHELD')
            }
            Write-Host ('QFORGE_'+$label+'=PASS')
          }
          # Match the qualified original KTRADE Windows native CI environment.
          # This is a controlled environment correction, not a product patch.
          $env:TEMP=$env:RUNNER_TEMP
          $env:TMP=$env:RUNNER_TEMP
          Require (([IO.Path]::GetFullPath([IO.Path]::GetTempPath())).TrimEnd('\') -ceq
            ([IO.Path]::GetFullPath($env:RUNNER_TEMP)).TrimEnd('\')) 'QFORGE_TEMP_IDENTITY_DRIFT'
          Push-Location $p
          try{
            Require ((& go env GOVERSION).Trim() -ceq 'go1.26.10') 'QFORGE_UNEXPECTED_GO_TOOLCHAIN'
            Write-Host 'QFORGE_PROVEN_NATIVE_RUNNER_ENV_PARITY=PASS'
            if($env:QFORGE_NODE_BATCH_25_DIAG_ONLY -ceq '1'){
              # Diagnose the previously failing second Node batch alone.
              # Only ordinal file positions and counts leave this private runner.
              Checked 'NPM_LOCKED_ASSETS' 'npm.cmd' @('ci','--ignore-scripts','--no-audit','--no-fund','--silent')
              Checked 'OFFLINE_VENDOR' 'node' @('scripts/stage_offline_vendor.cjs')
              $specs=@(Get-ChildItem -LiteralPath (Join-Path $p 'tests') -File -Filter '*.test.cjs' |
                Sort-Object FullName | ForEach-Object {$_.FullName})
              Require ($specs.Count -ge 50) 'QFORGE_NODE_DIAG_SCOPE_UNQUALIFIED'
              $fail=[Collections.Generic.List[int]]::new()
              for($i=25;$i -lt 50;$i++){
                & node --test --test-reporter=tap $specs[$i] *> $log
                if($LASTEXITCODE -ne 0){$fail.Add($i)}
              }
              Write-Host ('QFORGE_NODE_BATCH_25_DIAG='+(@{
                checked=25;source=$env:KTRADE_EXPECTED_SOURCE;
                failed_ordinals=($fail -join ',');failures=$fail.Count;
                raw_private_output_exported=$false
              } | ConvertTo-Json -Compress))
              Require ($fail.Count -eq 0) 'QFORGE_NODE_BATCH_25_DIAGNOSTIC_FAILURES_NOT_FINAL'
              Write-Host 'QFORGE_NODE_BATCH_25_DIAGNOSTIC=PASS_NOT_FINAL'
              return
            }

            Checked 'W32A_W41_DIAGNOSTIC_NONBLOCKING_FOCUSED' 'node' @('--test','--test-reporter=tap','tests/rb3_w32a_original_chart_candles.test.cjs','tests/rb3_w41_chart_viewport_persistence.test.cjs')
            if($env:QFORGE_TARGETED_PKG_ONLY -ceq '1'){
              Checked 'PKG_TARGETED_REPRO' 'go' @('test','-mod=readonly','-count=1','./pkg')
              Write-Host 'QFORGE_PKG_TARGETED_ONLY=PASS;NOT_FINAL_REGRESSION'
              return
            }
            if($env:QFORGE_NODE_FIRST_BATCH_DIAG_ONLY -ceq '1'){
              # Prior full native run on this exact SHA passed every Go gate
              # and stopped at the first Node batch. Diagnose only that
              # failure set; no duplicate full Go/Wails regression.
              Checked 'NPM_LOCKED_ASSETS' 'npm.cmd' @('ci','--ignore-scripts','--no-audit','--no-fund','--silent')
              Checked 'OFFLINE_VENDOR' 'node' @('scripts/stage_offline_vendor.cjs')
              $all=@(Get-ChildItem -LiteralPath (Join-Path $p 'tests') -Filter '*.test.cjs' -File |
                Sort-Object FullName | ForEach-Object {$_.FullName})
              $special=Join-Path $p 'tests/rb3_w28f_original_browser_state.test.cjs'
              Require ($all -ccontains $special) 'QFORGE_NODE_FIRST_BATCH_TWO_ROOT_REQUIRED'
              $all=@($all | Where-Object {$_ -cne $special})
              Require ($all.Count -ge 25) 'QFORGE_NODE_FIRST_BATCH_TOO_SMALL'
              $failed=[Collections.Generic.List[int]]::new()
              $invalid=0
              for($i=0;$i -lt 25;$i++){
                & node --test --test-reporter=tap $all[$i] *> $log
                if($LASTEXITCODE -ne 0){
                  $failed.Add($i)
                  $txt=[IO.File]::ReadAllText($log)
                  if($txt.Length -gt 1000000){$invalid++}
                  Remove-Variable txt -ErrorAction SilentlyContinue
                }
              }
              Write-Host ('QFORGE_NODE_FIRST_BATCH_FILE_COUNT=25;failed_ordinals='+
                ($failed -join ',')+';oversized_reports='+$invalid)
              Write-Host 'QFORGE_NODE_FIRST_BATCH_DIAG=COMPLETE_NOT_FULL_REGRESSION'
              return
            }
            # First validate the new tagged-only fixture and Go interface,
            # then run the mandatory untagged full suite. Avoid hiding a
            # fast W41-specific code defect behind the expensive baseline.
            # Surgical repair: confirm six legacy P18C source contract
            # callers and the ten new authority negative controls first.
            # W109: isolate the tick-candle engine and refuse invented ticker bars.
            & git merge-base --is-ancestor '4b0bb1cf12d72d09ba16142a8334884b7655df6c' HEAD
            Require ($LASTEXITCODE -eq 0) 'W109_W106_CANDIDATE_ANCESTRY_LOST'
            # Exact parent and content-blob identity are stronger than an
            # OS-dependent path sort or string-comparison diagnostic.
            if($env:KTRADE_EXPECTED_SOURCE -ceq '3bfdfac9152575dd47092b345145ed585780764c'){
              # W159 currently-scoped chart-only descendant of the last full
              # QForge-qualified W148 source. Source/tree checked at checkout.
              & git merge-base --is-ancestor 'bdc6e5a8a54a3ed6b4183af95e54c047311ad1c2' HEAD
              Require ($LASTEXITCODE -eq 0) 'W159_LAST_FULL_QUALIFIED_ANCESTOR_REQUIRED'
              Require ((& git rev-parse 'bdc6e5a8a54a3ed6b4183af95e54c047311ad1c2^{tree}').Trim() -ceq 'f4658bb1e1c5cf485ac7bba02b3e489d090f2182') 'W159_ACCEPTED_PARENT_TREE_DRIFT'
              $w159Paths=@(& git diff --name-only 'bdc6e5a8a54a3ed6b4183af95e54c047311ad1c2' HEAD)
              $w159Allowed=@('static/w149_advanced_drawings.js','static/w151_parallel_channels.js','static/w153_magnet_snap.js','static/w156_chart_notes.js','static/w157_freehand_brush.js','static/w159_drawing_trash.js','templates/chart.tmpl','tests/w149_advanced_drawings.test.cjs','tests/w150_advanced_drawing_history.test.cjs','tests/w151_parallel_channel.test.cjs','tests/w153_magnet_snap.test.cjs','tests/w156_chart_notes.test.cjs','tests/w157_freehand_brush.test.cjs','tests/w158_drawing_lock.test.cjs','tests/w159_drawing_trash.test.cjs','tests/w100_vertical_lines.test.cjs','tests/w17d7_original_trendlines.test.cjs','tests/w17d8_chart_shapes.test.cjs','tests/w17d8_trendline_geometry.test.cjs')
              $w159Missing=@($w159Allowed | Where-Object {-not ($w159Paths -ccontains $_)})
              $w159Unknown=@($w159Paths | Where-Object {-not ($w159Allowed -ccontains $_)})
              Require ($w159Paths.Count -eq $w159Allowed.Count -and
                $w159Missing.Count -eq 0 -and $w159Unknown.Count -eq 0) 'W159_CHART_ONLY_DELTA_REFUSED'
              Write-Host 'QFORGE_W159_EXACT_ACCEPTED_ANCESTOR_AND_CHART_ONLY_19_PATHS=PASS'
            }elseif($env:KTRADE_EXPECTED_SOURCE -ceq 'bdc6e5a8a54a3ed6b4183af95e54c047311ad1c2'){
              # Exact W148 two-file source continuity patch; all previous
              # W145 certified feed/UI and frozen financial controls remain.
              $w148Changed=@(& git diff --name-only 'HEAD^' 'HEAD')
              $w148PathsPass=($w148Changed.Count -eq 2 -and
                $w148Changed -ccontains 'static/w114_tick_chart.js' -and
                $w148Changed -ccontains 'tests/w148_sma20_continuity.test.cjs')
              Require ((& git rev-parse 'HEAD^').Trim() -ceq 'd10d312b4319eb81e9d313fb28f1355802c69f87' -and
                (& git rev-parse 'HEAD^^').Trim() -ceq 'cf5b636f5256995875afdde2027098faaf6e3c83' -and
                (& git rev-parse 'HEAD^{tree}').Trim() -ceq 'f4658bb1e1c5cf485ac7bba02b3e489d090f2182' -and
                (& git rev-parse 'HEAD^:static/w114_tick_chart.js').Trim() -ceq '75ae8642d9661b57fb488d28fff05fea8540f39f' -and
                (& git rev-parse 'HEAD:static/w114_tick_chart.js').Trim() -ceq 'b1fc847b708d4872e079ed7307e006ba636d8633' -and
                (& git rev-parse 'HEAD:tests/w148_sma20_continuity.test.cjs').Trim() -ceq 'b41fc4ea441d32fe37022185639c3c8cb69a0af0' -and
                (& git rev-parse 'HEAD:templates/chart.tmpl').Trim() -ceq 'b89c1f048c996c7a6c3a6e57b96a36613acc8562' -and
                $w148PathsPass) 'W148_EXACT_W145_PARENT_AND_TWO_FILE_SMA_CONTINUITY_REQUIRED'
              Write-Host 'QFORGE_W148_EXACT_W145_PARENT_AND_TWO_FILE_SMA_CONTINUITY=PASS'
            }elseif($env:KTRADE_EXPECTED_SOURCE -ceq 'd10d312b4319eb81e9d313fb28f1355802c69f87'){
              # W145: strict certified source/client count allowlist change.
              # Only 12 designated chart/Go/test files, no owner or financial
              # authority. Preserve earlier W143 full regression controls.
              $w145Changed=@(& git diff --name-only 'HEAD^' 'HEAD' | Sort-Object)
              # Windows Sort-Object uses a culture order, unlike Git tree order.
              # Enforce case-sensitive exact path set plus cardinality.
              $w145ExpectedPaths='cmd/ktrade/w114_tickchart_full_test.go;internal/tickchart/exchange_full_sequence_test.go;internal/tickchart/exchange_full_transport.go;internal/tickchart/exchange_matches_heartbeat_test.go;internal/tickchart/stream.go;internal/tickchart/stream_test.go;internal/tickchart/tickchart.go;internal/tickchart/tickchart_test.go;static/w114_tick_chart.js;templates/chart.tmpl;tests/w114_tick_chart.test.cjs;tests/w145_tick_intervals.test.cjs'.Split(';')
              $w145Missing=@($w145ExpectedPaths|Where-Object{-not ($w145Changed -ccontains $_)})
              $w145Unknown=@($w145Changed|Where-Object{-not ($w145ExpectedPaths -ccontains $_)})
              $w145PathSetValid=($w145Changed.Count -eq $w145ExpectedPaths.Count -and
                $w145Missing.Count -eq 0 -and $w145Unknown.Count -eq 0)

              # Non-sensitive probe: names of failing exact-source checks only.
              # Does not read owner data, invoke the application, or relax
              # the historical hard Require below.
              $w145Probes=[ordered]@{
                parent=((& git rev-parse 'HEAD^').Trim() -ceq 'cf5b636f5256995875afdde2027098faaf6e3c83')
                grandparent=((& git rev-parse 'HEAD^^').Trim() -ceq '05bc773d39874eb31e96b897a4c530ce3456c9cc')
                tree=((& git rev-parse 'HEAD^{tree}').Trim() -ceq '302e05759d07693795426e3d4c1a6847d59bcb0e')
                base_html=((& git rev-parse 'HEAD^:templates/chart.tmpl').Trim() -ceq '2ca9f2d18472f365037caa9fe0037c702af9697a')
                base_js=((& git rev-parse 'HEAD^:static/w114_tick_chart.js').Trim() -ceq 'eb5c410bf5bde7f0d1e6ec81258be5a5543049de')
                cmd_test=((& git rev-parse 'HEAD:cmd/ktrade/w114_tickchart_full_test.go').Trim() -ceq 'a9deacfdf74ae74ddd4fbed0992a3d730d6fd8ee')
                full_sequence_test=((& git rev-parse 'HEAD:internal/tickchart/exchange_full_sequence_test.go').Trim() -ceq 'bde2f6b0f4b5895083730fc6670b22a9e404ff5a')
                full_transport=((& git rev-parse 'HEAD:internal/tickchart/exchange_full_transport.go').Trim() -ceq '64792ddb2e10467f9944d9955ecda18c8b037cbb')
                heartbeat_test=((& git rev-parse 'HEAD:internal/tickchart/exchange_matches_heartbeat_test.go').Trim() -ceq '264c3e3d430746bab15a83e9b49ba43cfdccb1d2')
                stream=((& git rev-parse 'HEAD:internal/tickchart/stream.go').Trim() -ceq '6061078f033b36cbc5bade7347fab8000222ee5d')
                stream_test=((& git rev-parse 'HEAD:internal/tickchart/stream_test.go').Trim() -ceq 'cf39d18f5733b8ac5cb5aca4fecb98b9daa9dab3')
                aggregate=((& git rev-parse 'HEAD:internal/tickchart/tickchart.go').Trim() -ceq '7da5e4f38542f85c58b1ef7f902aa107f5bc0db9')
                aggregate_test=((& git rev-parse 'HEAD:internal/tickchart/tickchart_test.go').Trim() -ceq '8479533fcfae5a85feae697bd2e0f7d98386e83d')
                client=((& git rev-parse 'HEAD:static/w114_tick_chart.js').Trim() -ceq '75ae8642d9661b57fb488d28fff05fea8540f39f')
                markup=((& git rev-parse 'HEAD:templates/chart.tmpl').Trim() -ceq 'b89c1f048c996c7a6c3a6e57b96a36613acc8562')
                ui_test=((& git rev-parse 'HEAD:tests/w114_tick_chart.test.cjs').Trim() -ceq 'd3a1da719106756f9c33a95d3e113bd9072371c9')
                new_test=((& git rev-parse 'HEAD:tests/w145_tick_intervals.test.cjs').Trim() -ceq '779070e022fdbf3feef41864081a15b78d52c78f')
                paths=($w145PathSetValid)
              }
