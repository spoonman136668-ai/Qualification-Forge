      KTRADE_PAPER_CUSTODY_REVIEW_ROOT: ''
      CGO_ENABLED: '1'
      GOMAXPROCS: '2'
      GOFLAGS: '-p=2'
    steps:
      - name: Checkout immutable original KTRADE source, read only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: spoonman136668-ai/ktrade
          ref: 9022ed7d7173160bbbb87f1bc55549c068f98888
          fetch-depth: 0
          path: product
          persist-credentials: false
          token: ${{ secrets.KTRADE_SOURCE_READ_TOKEN }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.10'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Checkout immutable QForge native-only acceptance harness
        if: contains(github.event.head_commit.message, 'W116_NATIVE_ONLY')
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: qualifier
          persist-credentials: false
      - name: Real Windows mouse through WebView2 — W115 tick controls (synthetic offline bars only)
        if: contains(github.event.head_commit.message, 'W116_NATIVE_ONLY')
        shell: pwsh
        env:
          KTRADE_CI_LIVE_AUTHORITY: '0'
          KTRADE_CI_COINBASE_ALLOWED: '0'
        run: |
          $ErrorActionPreference='Stop';Set-StrictMode -Version Latest
          $h=Join-Path $env:GITHUB_WORKSPACE 'qualifier/qualification-harness/ktrade-w115-native-tick/NativeAcceptance.ps1'
          if(!(Test-Path -LiteralPath $h -PathType Leaf)){throw 'W116_NATIVE_HARNESS_MISSING'}
          & $h -ExpectedSourceSha $env:KTRADE_EXPECTED_SOURCE -ExpectedTreeSha $env:KTRADE_EXPECTED_TREE
          if($LASTEXITCODE -ne 0 -or !$?){throw 'W116_NATIVE_TICK_CONTROLS_NOT_QUALIFIED'}
      - name: Real two-launch native WebView2 W03 acceptance, no trading or installed data
        if: "!contains(github.event.head_commit.message, 'W116_NATIVE_ONLY')"
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop';Set-StrictMode -Version Latest
          $p=Join-Path $env:GITHUB_WORKSPACE 'product'
          $log=Join-Path $env:RUNNER_TEMP 'ktrade-current-wails-private.log'
          function Require([bool]$v,[string]$m){if(!$v){throw $m}}
          Require ($env:RUNNER_OS -ceq 'Windows' -and $env:RUNNER_ENVIRONMENT -ceq 'github-hosted' -and
            $env:GITHUB_REPOSITORY -ceq 'spoonman136668-ai/Qualification-Forge' -and
            $env:GITHUB_REF -ceq 'refs/heads/qualification/ktrade-ui-workstation-refresh-20261108' -and
            $env:GITHUB_EVENT_NAME -ceq 'push') 'QFORGE_WAILS_WRONG_RUNNER_OR_SCOPE'
          Require ((& git -C $p rev-parse HEAD).Trim() -ceq $env:KTRADE_EXPECTED_SOURCE -and
            (& git -C $p rev-parse 'HEAD^{tree}').Trim() -ceq $env:KTRADE_EXPECTED_TREE -and
            @(& git -C $p status --porcelain).Count -eq 0 -and
            !(Test-Path -LiteralPath (Join-Path $p '.env'))) 'QFORGE_WAILS_EXACT_SOURCE_REQUIRED'
          $env:TEMP=$env:RUNNER_TEMP
          $env:TMP=$env:RUNNER_TEMP
          Push-Location $p
          try{
            & npm.cmd ci --ignore-scripts --no-audit --no-fund --silent *> $log
            if($LASTEXITCODE -ne 0){throw 'QFORGE_WAILS_LOCKED_VENDOR_FAILED'}
            & node scripts/stage_offline_vendor.cjs *> $log
            if($LASTEXITCODE -ne 0){throw 'QFORGE_WAILS_VENDOR_STAGE_FAILED'}
            & node --test tests/rb3_w41_chart_viewport_persistence.test.cjs tests/rb3_w41_cold_bridge_pane_visibility.test.cjs tests/rb3_w41_cold_bridge_diagnostic.test.cjs tests/rb3_w41_cold_parent_late_iframe.test.cjs tests/rb3_w41_cold_restart_harness.test.cjs *> $log
            if($LASTEXITCODE -ne 0){throw 'QFORGE_WAILS_CHART_FOCUSED_TEST_FAILED'}
            # Repair witness-scope mismatch only. Preserve the immutable product
            # source and full original test semantics; adapt one frozen branch
            # allowlist in an untracked, ephemeral witness beside its builder.
            $original=Join-Path $p 'windows/Test-KTRADE-W41-ColdReopen.ps1'
            $adapter=Join-Path $p 'windows/Test-KTRADE-W41-QForge-Adapter.ps1'
            $blob=(& git rev-parse 'HEAD:windows/Test-KTRADE-W41-ColdReopen.ps1').Trim()
            $checkoutBlob=(& git hash-object -- $original).Trim()
            Require ($blob -ceq 'ce5e41b2afcd073d238e96e45c98333dddba0a35' -and
              $checkoutBlob -ceq $blob -and !(Test-Path -LiteralPath $adapter)) 'QFORGE_W41_ORIGINAL_FROZEN_SOURCE_REQUIRED'
            $text=[IO.File]::ReadAllText($original)
            $from='refs/heads/qualification/ktrade-pr252-w41-cold-viewport-20261107'
            $to='refs/heads/qualification/ktrade-ui-workstation-refresh-20261108'
            Require ($text.Split([string[]]@($from),[StringSplitOptions]::None).Count -eq 2 -and
              !$text.Contains($to)) 'QFORGE_W41_SINGLE_ALLOWLIST_REWRITE_REQUIRED'
            $adapted=$text.Replace($from,$to)
            Require ($adapted -cne $text -and
              $adapted.Replace($to,$from) -ceq $text) 'QFORGE_W41_ONLY_SCOPE_CHANGE_ALLOWED'
            try{
              [IO.File]::WriteAllText($adapter,$adapted,[Text.UTF8Encoding]::new($false))
              $tokens=$null;$parseErrors=$null
              [void][Management.Automation.Language.Parser]::ParseFile($adapter,[ref]$tokens,[ref]$parseErrors)
              Require ($parseErrors.Count -eq 0) 'QFORGE_W41_ADAPTER_POWERSHELL_INVALID'
              Write-Host 'QFORGE_W41_FROZEN_ONE_BRANCH_SCOPE_ADAPTER=PASS'
              & $adapter -ExpectedSourceSha $env:KTRADE_EXPECTED_SOURCE
              if($LASTEXITCODE -ne 0 -or !$?){throw 'QFORGE_WAILS_REAL_TWO_LAUNCH_ACCEPTANCE_FAILED'}
            }finally{
              Remove-Item -LiteralPath $adapter -Force -ErrorAction SilentlyContinue
            }
            Require (!(Test-Path -LiteralPath $adapter) -and
              (& git hash-object -- $original).Trim() -ceq $blob) 'QFORGE_W41_ADAPTER_CLEANUP_OR_SOURCE_DRIFT'
            Write-Host 'QFORGE_W41_REAL_TWO_LAUNCH_EXACT_PR253=PASS'
            Require ((& git rev-parse HEAD).Trim() -ceq $env:KTRADE_EXPECTED_SOURCE -and
              @(& git status --porcelain --untracked-files=no).Count -eq 0) 'QFORGE_WAILS_SOURCE_CHANGED'
            Write-Host ('QFORGE_KTRADE_UI_REAL_WEBVIEW2_TWO_LAUNCHES=PASS;sha='+$env:KTRADE_EXPECTED_SOURCE)
          }finally{
            Pop-Location
            Remove-Item -LiteralPath $log -Force -ErrorAction SilentlyContinue
          }

