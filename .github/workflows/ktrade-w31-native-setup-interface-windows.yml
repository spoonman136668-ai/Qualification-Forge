          Click-SetupDialog $setupWindow 'No'
          $null=Wait-Visible $setupWindow.window 'Cancelled. No operation was started.'
          if(!(Test-Path -LiteralPath (Join-Path $receipt.candidate_directory 'ktrade.exe')) -or (Test-Path -LiteralPath (Join-Path $guiRoot '.ktrade-w29b-uninstall-started.json'))){throw 'W31_GUI_UNINSTALL_CANCEL_MUTATED_INSTALL'}
          Click-Verified $setupWindow.window 'Uninstall'
          Click-SetupDialog $setupWindow 'Yes'
