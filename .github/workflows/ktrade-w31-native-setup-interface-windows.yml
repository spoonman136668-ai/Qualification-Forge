          [IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'w31-gui-shortcut.txt'),(Join-Path $programs ('KTRADE-'+$receipt.selection_digest.Substring(0,16))))
          Click-Verified $setupWindow.window 'Check installation'
          $null=Wait-Visible $setupWindow.window 'Installation checked. Trading is stopped.'
