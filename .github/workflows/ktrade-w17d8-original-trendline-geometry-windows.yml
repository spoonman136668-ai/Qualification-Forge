name: KTRADE W20 normal candidate native PAPER lifecycle
on:
  push:
    branches: [qualification/ktrade-w17d8-original-trendline-geometry-20261025]
    paths: [.github/workflows/ktrade-w17d8-original-trendline-geometry-windows.yml]
permissions:
  contents: read
concurrency:
  group: ktrade-w17d8-chart-native-geometry-windows
  cancel-in-progress: false
jobs:
  wails-paper:
    runs-on: windows-2022
    timeout-minutes: 38
    if: github.repository == 'spoonman136668-ai/Qualification-Forge'
    env:
      CGO_ENABLED: '1'
      GOWORK: 'off'
      GOFLAGS: '-p=2'
      GOMAXPROCS: '2'
      KTRADE_RECOVERY_ISOLATED: '0'
      KTRADE_PORTABLE_DISARMED: '0'
      KTRADE_WAILS_OWNED: '0'
      KTRADE_USE_LEGACY_CDP_CONFIG: '0'
      KTRADE_PAPER_SESSION_ROOT: ''
      KTRADE_PAPER_CUSTODY_REVIEW_ROOT: ''
    steps:
      - name: Checkout pinned qualification witness
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: witness
          persist-credentials: false
      - name: Checkout immutable private W20 source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: spoonman136668-ai/ktrade
          ref: 8f879fe6e98c3eef2a4ca6b0893897cd29493459
          path: checked-private
          fetch-depth: 2
          persist-credentials: false
          token: ${{ secrets.KTRADE_SOURCE_READ_TOKEN }}
      - name: Authenticate Windows source parent tree witness
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_OS -cne 'Windows' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted'){throw 'W20_HOSTED_WINDOWS_REQUIRED'}
          $root=Join-Path $env:GITHUB_WORKSPACE 'checked-private'
          $witness=Join-Path $env:GITHUB_WORKSPACE 'witness'
          if((& git -C $root rev-parse HEAD).Trim() -cne '8f879fe6e98c3eef2a4ca6b0893897cd29493459' -or
             (& git -C $root rev-parse HEAD^).Trim() -cne 'ba72465c606216d985122ae1d2b8f33938fc9eca' -or
             (& git -C $root rev-parse 'HEAD^{tree}').Trim() -cne 'e0fcf59bbe94e6c60ee6d5f2587c2be0765671cb' -or
             (& git -C $witness rev-parse HEAD).Trim() -cne $env:GITHUB_SHA){
            throw 'W20_EXACT_SOURCE_IDENTITY_DRIFT'
          }
          if(@(& git -C $root status --porcelain=v1 --untracked-files=no).Count -ne 0){throw 'W20_SOURCE_DIRTY'}
          Write-Output '::notice::W20_EXACT_SOURCE_PARENT_TREE_AND_WITNESS=PASS'
      - name: Require exact completed W19A full regression foundation
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $r=Invoke-RestMethod -Uri 'https://api.github.com/repos/spoonman136668-ai/Qualification-Forge/actions/runs/40364848729' -Headers @{
            Authorization='Bearer '+$env:GITHUB_TOKEN;Accept='application/vnd.github+json'
          }
          if($r.status -cne 'completed' -or $r.conclusion -cne 'success' -or $r.head_sha -cne '82c05628145f0a38d63c22e9420853eb702cf233'){throw 'W20_EXACT_W19A_FINAL_FOUNDATION_NOT_QUALIFIED'}
      - name: Windows Go and locked node toolchains
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache: true
          cache-dependency-path: |
            checked-private/go.sum
            checked-private/tools/wails-pilot/go.sum
      - name: Node for immutable offline Monaco and chart assets
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build normal-feed fresh candidate and exercise genuine native PAPER controls
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          $env:TMP=$env:RUNNER_TEMP
          $env:TEMP=$env:RUNNER_TEMP
          $env:KTRADE_W13_QUALIFICATION_ONLY='0'
          $src=Join-Path $env:GITHUB_WORKSPACE 'checked-private'
          $pkg=Join-Path $env:GITHUB_WORKSPACE ('ktrade-rc-package-'+[guid]::NewGuid().ToString('N').ToLowerInvariant())
          $capture=Join-Path $env:RUNNER_TEMP 'w13b-private.log'
          $wailsErr=Join-Path $env:RUNNER_TEMP 'w13b-wails-private.log'
          $app=$null;$child=$null
          try{
            Push-Location $src
            try{
              & npm ci --ignore-scripts --no-audit --no-fund --silent *> $capture
              if($LASTEXITCODE -ne 0){throw 'W20_LOCKED_NPM_INSTALL_FAILED'}
              & node scripts/stage_offline_vendor.cjs *> $capture
              if($LASTEXITCODE -ne 0){throw 'W20_OFFLINE_VENDOR_STAGE_FAILED'}
              if(@(& git status --porcelain=v1 --untracked-files=no).Count -ne 0){throw 'W20_SOURCE_MODIFIED'}
              $builder=Join-Path $src 'windows/Build-KTRADE-WailsPortable.ps1'
              $proof=@(& $builder -OutputRoot $pkg -ExpectedSourceSha '8f879fe6e98c3eef2a4ca6b0893897cd29493459' -ReleaseCandidate)
              if($proof -notcontains 'W03_FRESH_PAIRED_PORTABLE_PACKAGE=PASS;NO_APP_START=TRUE;LIVE_DISARMED=TRUE'){throw 'W20_PAIRED_DISPOSABLE_BUILD_FAILED'}
            }finally{Pop-Location}
            $receipt=Get-Content -LiteralPath (Join-Path $pkg 'source-manifest.json') -Raw | ConvertFrom-Json
            if($receipt.source_sha -cne '8f879fe6e98c3eef2a4ca6b0893897cd29493459' -or
               $receipt.fixture_mode -cne 'none' -or $receipt.release_candidate -ne $true -or
               $receipt.live_armed -ne $false -or $receipt.paper_started -ne $false){
              throw 'W20_TAGGED_ENGINE_MANIFEST_IDENTITY_INVALID'
            }
            Write-Output '::notice::W20_NORMAL_ENGINE_PAIRED_PROOFS_AND_FRESH_DATA=PASS'
            $stage=Join-Path $pkg 'KTRADE-WailsPortable'
            $exe=Join-Path $stage 'ktrade.exe'
            $engine=Join-Path $stage 'ktrade-engine.exe'
            function Start-W20App(){
              $script:app=Start-Process -FilePath $exe -WorkingDirectory $stage -RedirectStandardError $wailsErr -PassThru
              $null=$script:app.Handle
              $deadline=(Get-Date).AddSeconds(55)
              while((Get-Date) -lt $deadline){
                Start-Sleep -Milliseconds 400
                $script:app.Refresh()
                if($script:app.HasExited){throw 'W20_GENUINE_WAILS_EXITED'}
                if($script:app.MainWindowHandle -ne [IntPtr]::Zero){break}
              }
              if($script:app.MainWindowHandle -eq [IntPtr]::Zero){throw 'W20_NATIVE_WINDOW_MISSING'}
              $deadline=(Get-Date).AddSeconds(22)
              $script:child=$null
              while((Get-Date) -lt $deadline){
                $matches=@(Get-CimInstance Win32_Process -Filter "name='ktrade-engine.exe'" | Where-Object {
                  $_.ExecutablePath -ieq $engine -and $_.ParentProcessId -eq $script:app.Id})
                if($matches.Count -eq 1){$script:child=$matches[0];break}
                Start-Sleep -Milliseconds 300
              }
              if(!$script:child){throw 'W20_ORIGINAL_GO_CHILD_MISSING'}
              $listener=@(Get-NetTCPConnection -State Listen -OwningProcess $script:child.ProcessId -ErrorAction SilentlyContinue |
                Where-Object {$_.LocalAddress -eq '127.0.0.1'})
              if($listener.Count -ne 1){throw 'W20_ONE_LOCAL_GO_LISTENER_REQUIRED'}
              return 'http://127.0.0.1:'+$listener[0].LocalPort
            }
            $base=Start-W20App
            Write-Output '::notice::W20_GENUINE_WAILS_CHILD_AND_LOOPBACK=PASS'
            $before=Invoke-RestMethod -Uri ($base+'/api/paper/session') -TimeoutSec 10
            if($before.mode -cne 'PAPER_NOT_FUNDED' -or $before.live_armed -ne $false -or
               $before.paper_orders_enabled -ne $false){throw 'W20_FRESH_PAPER_UNVERIFIED'}
            $cap=Invoke-RestMethod -Uri ($base+'/api/operator/capabilities') -TimeoutSec 10
            if($cap.live_orders_enabled -ne $false){throw 'W20_LIVE_OPERATOR_AUTHORITY_DETECTED'}
            Write-Output '::notice::W20_GENUINE_WAILS_PAPER_FRESH_AND_LIVE_DISARMED=PASS'
            # Store a disposable user-owned strategy via the application's
            # ORIGINAL same-origin revisioned Pine library (no forged ID).
            $scriptSource='//@version=5'+[Environment]::NewLine+
              'strategy("W20 normal candidate paper")'+[Environment]::NewLine+
              'if barstate.islast'+[Environment]::NewLine+
              '    strategy.entry("L", strategy.long, qty=0.0001)'+[Environment]::NewLine
            $json=@{display_name='W20 Candidate Strategy';kind='strategy';source=$scriptSource} | ConvertTo-Json -Compress
            $saved=Invoke-RestMethod -Uri ($base+'/api/pine-library') -Method Post -Headers @{Origin=$base} -ContentType 'application/json' -Body $json -TimeoutSec 10
            if($saved.metadata.ownership -cne 'user' -or $saved.metadata.kind -cne 'strategy' -or
               $saved.metadata.id -cnotmatch '^[a-f0-9]{32}$'){
              throw 'W20_ORIGINAL_CANONICAL_SAVED_PINE_ID_MISSING'
            }
            $scriptID=$saved.metadata.id
            Write-Output '::notice::W20_ORIGINAL_DURABLE_PINE_SOURCE_SAVED=PASS'
            # The fixture must satisfy ORIGINAL preview validation, including
            # finality, SHA identity, canonical script ownership and no orders.
            $previewJson=@{script_id=$scriptID;product_id='BTC-USDC';timeframe='1m'} | ConvertTo-Json -Compress
            $preview=Invoke-RestMethod -Uri ($base+'/api/paper/strategy/preview') -Method Post -Headers @{Origin=$base} -ContentType 'application/json' -Body $previewJson -TimeoutSec 12
            if($preview.schema -cne 'ktrade.paper.strategy-preview.review.v1' -or
               $preview.source_sha256 -cnotmatch '^[a-f0-9]{64}$' -or
               $preview.orders_enabled -ne $false -or $preview.live_armed -ne $false){
              throw 'W20_ORIGINAL_PREVIEW_UNQUALIFIED_OR_AUTHORITY_LEAK'
            }
            if($preview.status -cne 'REVIEW_ONLY' -or $null -eq $preview.review_proposal -or
               $preview.final_bar_sha256 -cnotmatch '^[a-f0-9]{64}$' -or $preview.final_bar_at -eq ''){throw 'W20_NORMAL_MARKET_FINAL_BAR_INTENT_NOT_VERIFIED'}
            Write-Output '::notice::W20_NORMAL_SERVER_FINAL_CANDLE_PINE_PREVIEW=PASS'
            # Windows UI Automation acts on the ORIGINAL embedded WebView2
            # without CDP or privileged browser injection.
            Add-Type -AssemblyName UIAutomationClient
            Add-Type -AssemblyName UIAutomationTypes
            Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public class W20Mouse{
            [DllImport("user32.dll")] public static extern bool SetCursorPos(int x,int y);
            [DllImport("user32.dll")] public static extern void mouse_event(uint flags,uint dx,uint dy,uint data,UIntPtr extra);
          }
          '@
            $ui=[System.Windows.Automation.AutomationElement]::FromHandle([IntPtr]$app.MainWindowHandle)
            if(!$ui){throw 'W20_UIA_WAILS_ROOT_MISSING'}
            function Find-W20([string]$name){
              $prop=[System.Windows.Automation.PropertyCondition]::new(
               [System.Windows.Automation.AutomationElement]::NameProperty,$name)
              return $ui.FindFirst([System.Windows.Automation.TreeScope]::Descendants,$prop)
            }
            function Click-W20($element){
              if(!$element){throw 'W20_REQUIRED_WEBVIEW2_CONTROL_NOT_FOUND'}
              if(!$element.Current.IsEnabled){throw 'W20_REQUIRED_WEBVIEW2_CONTROL_DISABLED'}
              $pattern=$null
              if($element.TryGetCurrentPattern([System.Windows.Automation.InvokePattern]::Pattern,[ref]$pattern)){
                ([System.Windows.Automation.InvokePattern]$pattern).Invoke()
                return
              }
              $rect=$element.Current.BoundingRectangle
              if($rect.Width -lt 3 -or $rect.Height -lt 3){throw 'W20_UIA_CONTROL_NOT_VISIBLE'}
              $x=[int]($rect.Left+$rect.Width/2)
              $y=[int]($rect.Top+$rect.Height/2)
              if(![W20Mouse]::SetCursorPos($x,$y)){throw 'W20_OS_POINTER_REFUSED'}
              [W20Mouse]::mouse_event(0x0002,0,0,0,[UIntPtr]::Zero)
              [W20Mouse]::mouse_event(0x0004,0,0,0,[UIntPtr]::Zero)
            }
            $end=(Get-Date).AddSeconds(20)
            $startCtrl=$null
            while((Get-Date) -lt $end){
              $startCtrl=Find-W20 'Start isolated paper'
              if($startCtrl){break}
              Start-Sleep -Milliseconds 400
            }
            if(!$startCtrl){throw 'W20_EMBEDDED_PAPER_START_NOT_ACCESSIBLE'}
            if(!(Find-W20 'Trade unavailable')){throw 'W20_EMBEDDED_LEGACY_BROKER_VETO_NOT_ACCESSIBLE'}
            Write-Output '::notice::W20_ACTUAL_EMBEDDED_WEBVIEW2_PAPER_CONTROLS=PASS'
            # UIA operator selection of ORIGINAL saved strategy, chart symbol,
            # and fee consent. No direct API Start or synthetic fill injection.
            function Find-W20Like([string]$fragment){
              $nodes=$ui.FindAll([System.Windows.Automation.TreeScope]::Descendants,
                [System.Windows.Automation.Condition]::TrueCondition)
              foreach($element in $nodes){
                if($element.Current.Name -like ('*'+$fragment+'*') -and
                   !$element.Current.IsOffscreen){return $element}
              }
              return $null
            }
            $library=Find-W20 'Open saved Pine library'
            if(!$library){throw 'W20_DURABLE_PINE_LIBRARY_UI_CONTROL_MISSING'}
            if($library.Current.IsOffscreen){
              $pineToggle=Find-W20 'Pine Editor'
              if(!$pineToggle){throw 'W20_ORIGINAL_PINE_TOGGLE_UNAVAILABLE'}
              Click-W20 $pineToggle
              Start-Sleep -Milliseconds 500
              $library=Find-W20 'Open saved Pine library'
            }
            if(!$library -or $library.Current.IsOffscreen){
              throw 'W20_ORIGINAL_PINE_LIBRARY_NOT_VISIBLE'
            }
            Click-W20 $library
            $stored=$null;$limit=(Get-Date).AddSeconds(12)
            while((Get-Date) -lt $limit){
              $stored=Find-W20Like 'W20 Candidate Strategy'
              if($stored){break}
              Start-Sleep -Milliseconds 400
            }
            if(!$stored){
              $samples=@()
              $nodes=$ui.FindAll([System.Windows.Automation.TreeScope]::Descendants,
                [System.Windows.Automation.Condition]::TrueCondition)
              foreach($element in $nodes){
                $label=$element.Current.Name
                if($label -match 'W13|Stored Pine|saved Pine library'){
                  $samples+=('[UIA]'+$label+';offscreen='+$element.Current.IsOffscreen)
                  if($samples.Count -ge 8){break}
                }
              }
              Write-Output ('::warning::W20_SAVED_LIBRARY_UIA_DIAGNOSTIC='+($samples -join '|'))
              throw 'W20_CANONICAL_SAVED_STRATEGY_NOT_IN_REAL_WEBVIEW2'
            }
            Click-W20 $stored
            $savedUI=Find-W20Like 'W20 Candidate Strategy'
            if(!$savedUI){throw 'W20_SAVED_STRATEGY_NOT_REFLECTED_IN_EMBEDDED_EDITOR'}
            Write-Output '::notice::W20_REAL_EMBEDDED_SAVED_PINE_LIBRARY_SELECTED=PASS'
            $header=Find-W20Like 'BTCUSD'
            if(!$header){$header=Find-W20Like 'BTC-USD'}
            if(!$header){throw 'W20_ORIGINAL_SYMBOL_PICKER_NOT_ACCESSIBLE'}
            Click-W20 $header
            $usdc=$null;$limit=(Get-Date).AddSeconds(12)
            while((Get-Date) -lt $limit){
              # Choose the exact accessible market TEXT node, not a modal
              # container whose descendant name happens to include BTC-USDC.
              $usdc=Find-W20 'BTC-USDC'
              if($usdc -and !$usdc.Current.IsOffscreen){break}
              $usdc=$null
              Start-Sleep -Milliseconds 300
            }
            if(!$usdc){throw 'W20_ORIGINAL_USDC_MARKET_NOT_ACCESSIBLE'}
            $rect=$usdc.Current.BoundingRectangle
            if($rect.Width -lt 3 -or $rect.Height -lt 3){throw 'W20_USDC_SYMBOL_UIA_TEXT_HAS_NO_RECTANGLE'}
            $ux=[int]($rect.Left+[math]::Min(15,$rect.Width/2))
            $uy=[int]($rect.Top+$rect.Height/2)
            if(![W20Mouse]::SetCursorPos($ux,$uy)){throw 'W20_SYMBOL_OS_POINTER_REFUSED'}
            [W20Mouse]::mouse_event(0x0002,0,0,0,[UIntPtr]::Zero)
            [W20Mouse]::mouse_event(0x0004,0,0,0,[UIntPtr]::Zero)
            $usdcSelected=$null;$limit=(Get-Date).AddSeconds(5)
            while((Get-Date) -lt $limit){
              $usdcSelected=Find-W20Like 'BTCUSDC'
              if($usdcSelected){break}
              Start-Sleep -Milliseconds 200
            }
            if(!$usdcSelected){
              $marketNames=@()
              $buttons=$ui.FindAll([System.Windows.Automation.TreeScope]::Descendants,
                [System.Windows.Automation.PropertyCondition]::new(
                 [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
                 [System.Windows.Automation.ControlType]::Button))
              foreach($button in $buttons){
                $name=$button.Current.Name
                if($name -match 'BTC|USDC|Coinbase'){
                  $marketNames+=($name+';offscreen='+$button.Current.IsOffscreen)
                  if($marketNames.Count -ge 8){break}
                }
              }
              Write-Output ('::warning::W20_USDC_PICKER_UIA_READBACK='+($marketNames -join '|'))
              throw 'W20_ORIGINAL_CHART_USDC_SELECTION_NOT_REFLECTED'
            }
            Write-Output '::notice::W20_REAL_WEBVIEW2_USDC_MARKET_SELECTED=PASS'
            $feeAck=$null
            $checkboxes=$ui.FindAll([System.Windows.Automation.TreeScope]::Descendants,
              [System.Windows.Automation.PropertyCondition]::new(
               [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
               [System.Windows.Automation.ControlType]::CheckBox))
            foreach($check in $checkboxes){
              if($check.Current.Name -match 'Fee estimate|exchange quote'){$feeAck=$check;break}
            }
            if(!$feeAck){throw 'W20_SIMULATED_FEE_ACK_CHECKBOX_MISSING'}
            $toggleCheck=$null
            if(!$feeAck.TryGetCurrentPattern([System.Windows.Automation.TogglePattern]::Pattern,[ref]$toggleCheck)){
              throw 'W20_REAL_EMBEDDED_FEE_CHECKBOX_NOT_TOGGLEABLE'
            }
            $toggle=[System.Windows.Automation.TogglePattern]$toggleCheck
            if($toggle.Current.ToggleState -ne [System.Windows.Automation.ToggleState]::On){
              # WebView2's UIA TogglePattern can report an operation without
              # producing the DOM click event. Use real Windows pointer input
              # once on the exact accessible <input type=checkbox> rectangle.
              $rect=$feeAck.Current.BoundingRectangle
              if($feeAck.Current.IsOffscreen -or $rect.Width -lt 2 -or $rect.Height -lt 2){
                throw 'W20_REAL_FEE_CHECKBOX_NOT_VISIBLE'
              }
              $x=[int]($rect.Left+$rect.Width/2)
              $y=[int]($rect.Top+$rect.Height/2)
              if(![W20Mouse]::SetCursorPos($x,$y)){throw 'W20_FEE_ACK_OS_POINTER_REFUSED'}
              [W20Mouse]::mouse_event(0x0002,0,0,0,[UIntPtr]::Zero)
              [W20Mouse]::mouse_event(0x0004,0,0,0,[UIntPtr]::Zero)
              Start-Sleep -Milliseconds 450
            }
            $refreshed=$ui.FindAll([System.Windows.Automation.TreeScope]::Descendants,
              [System.Windows.Automation.PropertyCondition]::new(
               [System.Windows.Automation.AutomationElement]::ControlTypeProperty,
               [System.Windows.Automation.ControlType]::CheckBox))
            $verified=$false
            foreach($box in $refreshed){
              if($box.Current.Name -match 'Fee estimate|exchange quote'){
                $pattern=$null
                if($box.TryGetCurrentPattern([System.Windows.Automation.TogglePattern]::Pattern,[ref]$pattern)){
                  $verified=([System.Windows.Automation.TogglePattern]$pattern).Current.ToggleState -eq
                    [System.Windows.Automation.ToggleState]::On
                }
                break
              }
            }
            if(!$verified){throw 'W20_REAL_EMBEDDED_SIMULATED_FEE_ACK_NOT_SET'}
            Write-Output '::notice::W20_REAL_WEBVIEW2_FEE_ACK_TOGGLE_ON=PASS'
            if(!$startCtrl.Current.IsEnabled){throw 'W20_PAPER_START_DISABLED_AFTER_CANONICAL_SETUP'}
            Click-W20 $startCtrl
            $running=$false;$limit=(Get-Date).AddSeconds(16)
            while((Get-Date) -lt $limit){
              Start-Sleep -Milliseconds 450
              $s=Invoke-RestMethod -Uri ($base+'/api/paper/session') -TimeoutSec 10
              if($s.mode -ceq 'PAPER_ISOLATED_RUNNING'){
                if($s.paper_orders_enabled -ne $true -or $s.live_armed -ne $false -or
                   $s.durable_custody_enabled -ne $true){throw 'W20_RUNNING_WITHOUT_TRADEGUARD_CUSTODY'}
                $running=$true;break
              }
            }
            if(!$running){
              $statusNodes=$ui.FindAll([System.Windows.Automation.TreeScope]::Descendants,
                [System.Windows.Automation.Condition]::TrueCondition)
              $messages=@()
              foreach($node in $statusNodes){
                $name=$node.Current.Name
                if($name -match 'Paper operation|Save a user|PAPER_|Fresh isolated|Select a Coinbase|Explicitly acknowledge|source or market|fee|TradeGuard'){
                  $safe=[regex]::Replace($name,'(?i)[A-Za-z]:\\[^\s]+','[REDACTED]')
                  if($safe.Length -gt 180){$safe=$safe.Substring(0,180)}
                  $messages+= $safe
                  if($messages.Count -ge 6){break}
                }
              }
              Write-Output ('::warning::W20_EMBEDDED_START_STATUS_DIAGNOSTIC='+($messages -join ' | '))
              Write-Output ('::warning::W20_START_STATE_MODE='+$s.mode+';custody='+$s.durable_custody_enabled+';fills='+$s.fill_count)
              throw 'W20_ACTUAL_WEBVIEW2_OPERATOR_PAPER_START_NOT_ADMITTED'
            }
            Write-Output '::notice::W20_GUI_START_ESTABLISHED_ORIGINAL_DURABLE_PAPER_OWNER=PASS'
            $evaluateCtrl=Find-W20 'Evaluate final bar'
            if(!$evaluateCtrl){throw 'W20_NATIVE_EVALUATION_CONTROL_MISSING'}
            if($evaluateCtrl.Current.IsEnabled){Click-W20 $evaluateCtrl}
            $limit=(Get-Date).AddSeconds(14);$filled=$null
            while((Get-Date) -lt $limit){
              Start-Sleep -Milliseconds 400
              $s=Invoke-RestMethod -Uri ($base+'/api/paper/session') -TimeoutSec 10
              if($s.fill_count -ge 1){$filled=$s;break}
            }
            if(!$filled -or $filled.fill_count -ne 1 -or $filled.last_ledger_hash -cnotmatch '^[a-f0-9]{64}$' -or
               $filled.live_armed -ne $false){throw 'W20_SINGLE_ORIGINAL_LEDGER_FILL_NOT_VERIFIED'}
            Write-Output '::notice::W20_GUI_PINE_TRADEGUARD_SINGLE_NORMAL_SOURCE_PAPER_FILL=PASS'
            $stopCtrl=Find-W20 'Stop paper'
            if(!$stopCtrl){throw 'W20_OPERATOR_STOP_CONTROL_MISSING'}
            Click-W20 $stopCtrl
            $limit=(Get-Date).AddSeconds(15);$stopped=$null
            while((Get-Date) -lt $limit){
              Start-Sleep -Milliseconds 450
              $s=Invoke-RestMethod -Uri ($base+'/api/paper/session') -TimeoutSec 10
              if($s.mode -ceq 'PAPER_STOPPED' -and $s.stopped -eq $true){$stopped=$s;break}
            }
            if(!$stopped -or $stopped.paper_orders_enabled -ne $false -or $stopped.live_armed -ne $false){
              throw 'W20_ORIGINAL_OPERATOR_STOP_NOT_SEALED'
            }
            Write-Output '::notice::W20_GUI_STOP_ORIGINAL_PAPER_WRITER_SEALED=PASS'
            $archive=Invoke-RestMethod -Uri ($base+'/api/paper/session/archive') -TimeoutSec 10
            if($archive.schema -cne 'ktrade.paper.cold-archive.read-only.v1' -or
               $archive.snapshot_seal -cnotmatch '^[a-f0-9]{64}$' -or
               $archive.live_armed -ne $false -or $archive.orders_enabled -ne $false -or
               $archive.account.schema -cne 'ktrade.paper.account.read-only.v1'){
              throw 'W20_COLD_LEDGER_ACCOUNT_ARCHIVE_UNVERIFIED'
            }
            $product=@($archive.account.products|Where-Object {$_.product_id -ceq 'BTC-USDC'})
            if($product.Count -ne 1 -or $product[0].fill_count -ne 1 -or
               $null -eq $product[0].realized_pnl -or $null -eq $product[0].fees_paid){
              throw 'W20_COLD_ACCOUNT_PNL_OR_FEE_UNVERIFIED'
            }
            Write-Output '::notice::W20_COLD_FEE_PNL_SINGLE_LEDGER_REPLAY=PASS'
            if(!$app.CloseMainWindow() -or !$app.WaitForExit(20000)){throw 'W20_WAILS_SHUTDOWN_FAILED'}
            $app=$null
            if($child){Start-Sleep -Milliseconds 700; if(Get-Process -Id $child.ProcessId -ErrorAction SilentlyContinue){throw 'W20_ORIGINAL_GO_CHILD_LEAK'};$child=$null}
            $base=Start-W20App
            $cold=Invoke-RestMethod -Uri ($base+'/api/paper/session') -TimeoutSec 10
            if($cold.mode -ceq 'PAPER_ISOLATED_RUNNING' -or $cold.live_armed -ne $false -or
               $cold.paper_orders_enabled -ne $false){throw 'W20_COLD_RESTART_AUTO_REARMED'}
            $reopen=Invoke-RestMethod -Uri ($base+'/api/paper/session/archive') -TimeoutSec 10
            if($reopen.snapshot_seal -cne $archive.snapshot_seal -or
               $reopen.account.schema -cne 'ktrade.paper.account.read-only.v1'){
              throw 'W20_COLD_RESTART_ORIGINAL_PNL_REPLAY_CHANGED'
            }
            Write-Output '::notice::W20_GENUINE_WAILS_COLD_RESTART_READ_ONLY_NO_REARM=PASS'
            Write-Output '::notice::W20_NO_BROKER_NO_LIVE_NO_INSTALLED_USER_DATA=PASS'
          }finally{
            if($app){try{if(-not $app.HasExited){Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue}}catch{}}
            if($child){try{Stop-Process -Id $child.ProcessId -Force -ErrorAction SilentlyContinue}catch{}}
            if(Test-Path -LiteralPath $pkg){Remove-Item -LiteralPath $pkg -Force -Recurse -ErrorAction SilentlyContinue}
            Remove-Item -LiteralPath $capture -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath $wailsErr -Force -ErrorAction SilentlyContinue
          }
      - name: Purge private source
        if: always()
        shell: pwsh
        run: |
          $private=Join-Path $env:GITHUB_WORKSPACE 'checked-private'
          if(Test-Path -LiteralPath $private){Remove-Item -LiteralPath $private -Recurse -Force -ErrorAction SilentlyContinue}
