name: KTRADE W11 native PAPER lifecycle and Wails operator admission

on:
  push:
    branches: [qualification/rb2-wails-w01-hosted-20261024]
    paths: [.github/workflows/ktrade-w11-native-paper-operator-windows.yml]

permissions:
  contents: read

concurrency:
  group: ktrade-w11-exact-source-windows
  cancel-in-progress: false

jobs:
  operator-smoke:
    name: Real Wails window plus original Go/Monaco browser interactions
    if: github.repository == 'spoonman136668-ai/Qualification-Forge'
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      GOWORK: 'off'
      CGO_ENABLED: '1'
      GOFLAGS: '-p=2'
      GOMAXPROCS: '2'
      KTRADE_RECOVERY_ISOLATED: '1'
      KTRADE_PORTABLE_DISARMED: '0'
      KTRADE_USE_LEGACY_CDP_CONFIG: '0'
      KTRADE_PAPER_SESSION_ROOT: ''
      KTRADE_PAPER_CUSTODY_REVIEW_ROOT: ''
    steps:
      - name: Checkout immutable qualification workflow
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: witness
          persist-credentials: false
      - name: Checkout immutable private KTRADE source read-only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: spoonman136668-ai/ktrade
          ref: 4fa71a347090648ce219a278ae54af3c943b22fa
          path: checked-private
          fetch-depth: 2
          persist-credentials: false
          token: ${{ secrets.KTRADE_SOURCE_READ_TOKEN }}
      - name: Authenticate original KTRADE commit parent tree and witness
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          if($env:RUNNER_OS -cne 'Windows' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted'){throw 'W11_AUTHENTIC_WINDOWS_HOST_REQUIRED'}
          $src=Join-Path $env:GITHUB_WORKSPACE 'checked-private'
          $witness=Join-Path $env:GITHUB_WORKSPACE 'witness'
          $head=(& git -C $src rev-parse HEAD).Trim()
          $parent=(& git -C $src rev-parse HEAD^).Trim()
          $tree=(& git -C $src rev-parse 'HEAD^{tree}').Trim()
          $witnessHead=(& git -C $witness rev-parse HEAD).Trim()
          if($LASTEXITCODE -ne 0 -or $head -cne '4fa71a347090648ce219a278ae54af3c943b22fa' -or
             $parent -cne '76bdd11a8bb71b7e20ffed2eb2686b5e60204f97' -or
             $tree -cne '63c69c0f71682b653c3d541cec874a2f903f190c' -or
             $witnessHead -cne $env:GITHUB_SHA){throw 'W11_SOURCE_OR_WITNESS_IDENTITY_DRIFT'}
          if(@(& git -C $src status --porcelain=v1 --untracked-files=no).Count -ne 0){throw 'W11_DIRTY_PRIVATE_SOURCE'}
          Write-Output '::notice::W11_SOURCE_PARENT_TREE_AND_WITNESS=PASS'
      - name: Set up native Windows Go for original engine and Wails
        uses: actions/setup-go@v5
        with:
          go-version-file: checked-private/tools/wails-pilot/go.mod
          cache: false
      - name: Set up Node 24 for real Chromium CDP pipe and locked assets
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: checked-private/package-lock.json
      - name: Source-identical native Wails PAPER Pine TradeGuard ledger cold replay
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $src=Join-Path $env:GITHUB_WORKSPACE 'checked-private'
          $env:TMP=$env:RUNNER_TEMP
          $env:TEMP=$env:RUNNER_TEMP
          $log=Join-Path $env:RUNNER_TEMP 'w11-paper-cold-private.log'
          Push-Location $src
          try {
            & go test -mod=readonly -tags=ktrade_full -count=1 -timeout=12m -run TestRB3WailsPairedPaperLifecycleStartFillStopColdReadOnly ./cmd/ktrade *> $log
            if($LASTEXITCODE -ne 0){throw 'W11_FROZEN_WAILS_PAPER_LIFECYCLE_FAILED'}
            if(!(Select-String -LiteralPath $log -SimpleMatch 'ok' -Quiet)){throw 'W11_NATIVE_PAPER_RESULT_MISSING'}
            Write-Output '::notice::W11_NATIVE_PINE_TRADEGUARD_LEDGER_FILL_STOP_COLD_ARCHIVE=PASS'
          }finally{
            Pop-Location
            Remove-Item -LiteralPath $log -Force -ErrorAction SilentlyContinue
          }
      - name: Genuine Wails GUI and original Pine editor browser interaction
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          $src=Join-Path $env:GITHUB_WORKSPACE 'checked-private'
          # One canonical disposable path for .NET, Go os.TempDir and both binaries.
          $env:TMP=$env:RUNNER_TEMP
          $env:TEMP=$env:RUNNER_TEMP
          $tmp=[IO.Path]::GetFullPath([IO.Path]::GetTempPath()).TrimEnd('\')
          $pkg=Join-Path $tmp ('ktrade-w03-package-'+[guid]::NewGuid().ToString('N').ToLowerInvariant())
          $privateLog=Join-Path $env:RUNNER_TEMP 'w11-private-output.log'
          $browserProfile=Join-Path $env:RUNNER_TEMP ('w11-cdp-'+[guid]::NewGuid().ToString('N'))
          $app=$null;$child=$null;$w11Driver=$null
          try{
            Push-Location $src
            try{
              & npm ci --ignore-scripts --no-audit --no-fund --silent *> $privateLog
              if($LASTEXITCODE -ne 0){throw 'W11_LOCKED_FRONTEND_INSTALL_FAILED'}
              & node scripts/stage_offline_vendor.cjs *> $privateLog
              if($LASTEXITCODE -ne 0){throw 'W11_LOCKED_OFFLINE_VENDOR_FAILED'}
              if(@(& git status --porcelain=v1 --untracked-files=no).Count -ne 0){throw 'W11_TRACKED_SOURCE_CHANGED'}
            }finally{Pop-Location}
            $builder=Join-Path $src 'windows/Build-KTRADE-WailsPortable.ps1'
            $built=@(& $builder -OutputRoot $pkg -ExpectedSourceSha '4fa71a347090648ce219a278ae54af3c943b22fa')
            if($built -notcontains 'W03_FRESH_PAIRED_PORTABLE_PACKAGE=PASS;NO_APP_START=TRUE;LIVE_DISARMED=TRUE'){throw 'W11_AUTHENTIC_PAIRED_WAILS_BUILD_FAILED'}
            $release=Join-Path $pkg 'KTRADE-WailsPortable'
            $exe=Join-Path $release 'ktrade.exe'
            $engine=Join-Path $release 'ktrade-engine.exe'
            $wailsLog=Join-Path $env:RUNNER_TEMP 'w11-private-wails-stderr.log'
          $app=Start-Process -FilePath $exe -WorkingDirectory $release -RedirectStandardError $wailsLog -PassThru
            $null=$app.Handle
            $until=(Get-Date).AddSeconds(55)
            $window=$false
            while((Get-Date) -lt $until){
              Start-Sleep -Milliseconds 500
              $app.Refresh()
              if($app.HasExited){
                if(Test-Path -LiteralPath $wailsLog){
                  foreach($line in @(Get-Content -LiteralPath $wailsLog -ErrorAction SilentlyContinue | Where-Object {
                    $_ -match '(?i)(wails|ktrade|loopback|proof|refused|profile|disarmed|timeout|panic)'
                  } | Select-Object -Last 5)){
                    $safe=[regex]::Replace([string]$line,'(?i)[A-Za-z]:\\[^\s]+','[REDACTED_PATH]')
                    $safe=[regex]::Replace($safe,'(?i)(token|secret|api[_-]?key)=[^\s]+','$1=[REDACTED]')
                    if($safe.Length -gt 240){$safe=$safe.Substring(0,240)}
                    Write-Output ('::warning::W11_WAILS_START_DIAGNOSTIC='+$safe)
                  }
                }
                throw 'W11_WAILS_WINDOW_EXITED_BEFORE_READY'
              }
              if($app.MainWindowHandle -ne [IntPtr]::Zero){$window=$true;break}
            }
            if(-not $window){throw 'W11_NATIVE_WAILS_WINDOW_MISSING'}
            Write-Output '::notice::W11_GENUINE_WAILS_WEBVIEW2_WINDOW=PASS'
            $until=(Get-Date).AddSeconds(20)
            while((Get-Date) -lt $until){
              $children=@(Get-CimInstance Win32_Process -Filter "name='ktrade-engine.exe'" | Where-Object {
                $_.ExecutablePath -ieq $engine -and $_.ParentProcessId -eq $app.Id
              })
              if($children.Count -eq 1){$child=$children[0];break}
              Start-Sleep -Milliseconds 400
            }
            if(!$child){throw 'W11_WAILS_OWNED_ORIGINAL_GO_CHILD_MISSING'}
            $listeners=@(Get-NetTCPConnection -State Listen -OwningProcess $child.ProcessId -ErrorAction SilentlyContinue |
              Where-Object {$_.LocalAddress -eq '127.0.0.1'})
            if($listeners.Count -ne 1){throw 'W11_EXACT_ONE_GO_LOOPBACK_REQUIRED'}
            $base='http://127.0.0.1:'+$listeners[0].LocalPort
            $cap=Invoke-RestMethod -Uri ($base+'/api/operator/capabilities') -TimeoutSec 10
            if($cap.live_orders_enabled -ne $false -or $cap.mode -cne 'PAPER_STOPPED' -or
               $cap.paper_orders_enabled -ne $false -or $cap.requires_review -ne $true){throw 'W11_OPERATOR_NOT_STOPPED_DISARMED'}
            Write-Output '::notice::W11_GO_NATIVE_CAPABILITIES_LIVE_DISARMED=PASS'
            $browser=@(
              'C:\Program Files\Google\Chrome\Application\chrome.exe',
              'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe',
              'C:\Program Files\Microsoft\Edge\Application\msedge.exe'
            ) | Where-Object {Test-Path -LiteralPath $_ -PathType Leaf} | Select-Object -First 1
            if(!$browser){throw 'W11_AUTHENTIC_INSTALLED_CHROMIUM_REQUIRED'}
            $test=Join-Path $src 'tests/ktrade_real_browser_chart_cdp.cjs'
            # This original private test still expects a once-clickable broker
            # panel. Pin its Git blob and adapt ONLY that obsolete assertion in
            # a disposable driver, never editing or publishing private source.
            $driverSHA=(& git -C $src hash-object -- tests/ktrade_real_browser_chart_cdp.cjs).Trim()
            if($LASTEXITCODE -ne 0 -or $driverSHA -cne 'c3a5f896dee5aba1ac2b6af8ea94f93d12143ec7'){throw 'W11_ORIGINAL_TEST_DRIVER_IDENTITY_DRIFT'}
            $driver=[IO.File]::ReadAllText($test)
            $start='  // Click ACTUAL original trading controls, not a reconstructed test page.'
            $end=' }finally{c.close()}'
            $at=$driver.IndexOf($start,[StringComparison]::Ordinal)
            if($at -lt 0){throw 'W11_HISTORICAL_TEST_START_MISSING'}
            $tail=$driver.IndexOf($end,$at+$start.Length,[StringComparison]::Ordinal)
            if($tail -le $at -or $driver.IndexOf($start,$at+1,[StringComparison]::Ordinal) -ge 0){throw 'W11_HISTORICAL_TEST_END_AMBIGUOUS'}
            $negative=@'
            // Independent true browser interaction with original Wails-owned
            // Go child. Negative admission; no funded strategy is created.
            await until("W11_REAL_PAPER_CONTROLS_NOT_RENDERED",()=>c.eval(
              'Boolean(document.querySelector("#paperSessionStart")&&document.querySelector("#paperSessionStop")&&document.querySelector("#paperSessionEvaluate"))'
            ),50);
            const initial=await c.eval('(async()=>{const r=await fetch("/api/paper/session",{cache:"no-store",credentials:"same-origin"});return {http:r.status,...await r.json()}})()');
            assert.equal(initial.http,200);
            assert.equal(initial.schema,"ktrade.paper.isolated-session.v1");
            assert.equal(initial.mode,"PAPER_NOT_FUNDED");
            assert.equal(initial.live_armed,false);
            assert.equal(initial.paper_orders_enabled,false);
            assert.equal(initial.requires_review,true);
            const buttons=await c.eval('({start:document.querySelector("#paperSessionStart").disabled,evaluate:document.querySelector("#paperSessionEvaluate").disabled,stop:document.querySelector("#paperSessionStop").disabled,legacy:document.querySelector("#tradeBtn").disabled})');
            assert.equal(buttons.start,false,"qualified fresh PAPER UI unavailable");
            assert.equal(buttons.evaluate,true,"unfunded evaluation unexpectedly enabled");
            assert.equal(buttons.stop,true,"unfunded Stop unexpectedly enabled");
            assert.equal(buttons.legacy,true,"legacy brokerage control armed");
            console.log("W11_REAL_WAILS_OWNED_FRESH_PAPER_STATUS_AND_OPERATOR_CONTROLS=PASS");
            const bad=await c.eval('(async()=>{const r=await fetch("/api/paper/session/start",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:"{}"});return r.status})()');
            assert.equal(bad,400,"unsaved paper execution admitted");
            const after=await c.eval('(async()=>await (await fetch("/api/paper/session")).json())()');
            assert.equal(after.mode,"PAPER_NOT_FUNDED");
            assert.equal(after.paper_orders_enabled,false);
            assert.equal(after.live_armed,false);
            console.log("W11_UNSAVED_PAPER_START_REFUSED_NO_FINANCIAL_MUTATION=PASS");
            await until("W11_OPERATOR_DISARMED_BANNER_MISSING",()=>c.eval(
            'document.querySelector("#operatorModeStatus")?.textContent.includes("PAPER STOPPED")'
            ),40);
            const locked=await c.eval('(function(){const trade=document.getElementById("tradeBtn");const submit=document.getElementById("orderSubmit");trade.click();submit.click();return {tradeDisabled:trade.disabled,submitDisabled:submit.disabled,panelOpen:document.getElementById("orderPanel").classList.contains("open"),status:document.getElementById("operatorModeStatus").textContent}})()');
            assert.equal(locked.tradeDisabled,true,"unqualified Trade button active");
            assert.equal(locked.submitDisabled,true,"unqualified Order button active");
            assert.equal(locked.panelOpen,false,"disabled Trade button opened brokerage panel");
            assert.match(locked.status,/PAPER STOPPED.*LIVE DISARMED/);
            assert.equal(c.orderRequests.length,0,"disabled UI dispatched order");
            console.log("W11_DISARMED_BROWSER_BUTTONS_NO_ORDER_DISPATCH=PASS");
            const route=await c.eval('(async()=>{const r=await fetch("/api/orders/place",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"});return r.status})()');
            assert.equal(route,423,"original Go broker route did not refuse order");
            assert.equal(c.orderRequests.length,1,"explicit negative route probe count mismatch");
            console.log("W11_ORIGINAL_LEGACY_ORDER_HTTP_423=PASS");
          '@
            $w11Driver=Join-Path $env:RUNNER_TEMP 'ktrade-w11-source-pinned-browser-negative.cjs'
            [IO.File]::WriteAllText($w11Driver,($driver.Substring(0,$at)+$negative+[Environment]::NewLine+$driver.Substring($tail)),[Text.UTF8Encoding]::new($false))
            & node $w11Driver $base 'pipe' $browser $browserProfile *> $privateLog
            if($LASTEXITCODE -ne 0){
              $names=@(Get-Content -LiteralPath $privateLog | Where-Object {
                $_ -match '^(KTRADE_REAL_BROWSER_|Error: |AssertionError|REAL_BROWSER_)'
              } | Select-Object -Last 12)
              foreach($n in $names){
                $safe=[regex]::Replace([string]$n,'(?i)[A-Za-z]:\\[^\s]+','[REDACTED]')
                if($safe.Length -gt 220){$safe=$safe.Substring(0,220)}
                Write-Output ('::warning::W11_ORIGINAL_BROWSER_FAILURE='+$safe)
              }
              throw 'W11_AUTHENTIC_ORIGINAL_PINE_BROWSER_WORKFLOW_FAILED'
            }
            foreach($receipt in @(
              'KTRADE_REAL_BROWSER_MONACO_EDITOR_INITIALIZED=PASS',
              'KTRADE_REAL_BROWSER_SAVE_FAVORITE_RELOAD_REOPEN=PASS',
              'KTRADE_REAL_BROWSER_HISTORICAL_KEYS_PRESERVED=PASS',
              'KTRADE_REAL_BROWSER_NO_ORDER_DISPATCH=PASS',
              'W11_REAL_WAILS_OWNED_FRESH_PAPER_STATUS_AND_OPERATOR_CONTROLS=PASS',
              'W11_UNSAVED_PAPER_START_REFUSED_NO_FINANCIAL_MUTATION=PASS',
              'W11_DISARMED_BROWSER_BUTTONS_NO_ORDER_DISPATCH=PASS',
              'W11_ORIGINAL_LEGACY_ORDER_HTTP_423=PASS'
            )){
              if(-not (Select-String -LiteralPath $privateLog -SimpleMatch $receipt -Quiet)){throw ('W11_REQUIRED_BROWSER_RECEIPT_MISSING_'+$receipt)}
            }
            Write-Output '::notice::W11_ORIGINAL_MONACO_PINE_SAVE_FAVORITE_REOPEN=PASS'
            Write-Output '::notice::W11_ORIGINAL_TRADING_CONTROLS_REFUSE_ORDERS=PASS'
            Write-Output '::notice::W11_GUI_UNFUNDED_PAPER_ADMISSION_VETO=PASS'
            Write-Output '::notice::W11_REAL_BROWSER_ON_WAILS_GO_CHILD=PASS'
            if(-not $app.CloseMainWindow()){throw 'W11_WAILS_GUI_CLOSE_REFUSED'}
            if(-not $app.WaitForExit(20000) -or $app.ExitCode -ne 0){throw 'W11_WAILS_PARENT_SHUTDOWN_FAILED'}
            $remaining=Get-Process -Id $child.ProcessId -ErrorAction SilentlyContinue
            if($remaining -and -not $remaining.WaitForExit(5000)){throw 'W11_GO_CHILD_SHUTDOWN_FAILED'}
            Write-Output '::notice::W11_WAILS_GO_CHILD_STOPPED=PASS'
            Write-Output '::notice::W11_NO_INSTALLED_OWNER_DATA_NO_LIVE_ACTIVATION=PASS'
          }finally{
            if($app){try{if(-not $app.HasExited){Stop-Process -Id $app.Id -Force -ErrorAction SilentlyContinue}}catch{}}
            if($child){try{Stop-Process -Id $child.ProcessId -Force -ErrorAction SilentlyContinue}catch{}}
            if(Test-Path -LiteralPath $browserProfile){Remove-Item -LiteralPath $browserProfile -Recurse -Force -ErrorAction SilentlyContinue}
            if(Test-Path -LiteralPath $pkg){Remove-Item -LiteralPath $pkg -Recurse -Force -ErrorAction SilentlyContinue}
            Remove-Item -LiteralPath $privateLog -Force -ErrorAction SilentlyContinue
            if($w11Driver -and (Test-Path -LiteralPath $w11Driver)){Remove-Item -LiteralPath $w11Driver -Force -ErrorAction SilentlyContinue}
            Remove-Item -LiteralPath $wailsLog -Force -ErrorAction SilentlyContinue
          }
 ./cmd/ktrade *> $log
            if($LASTEXITCODE -ne 0){throw 'W11_FROZEN_WAILS_PAPER_LIFECYCLE_FAILED'}
            if(!(Select-String -LiteralPath $log -SimpleMatch 'ok' -Quiet)){throw 'W11_NATIVE_PAPER_RESULT_MISSING'}
            Write-Output '::notice::W11_NATIVE_PINE_TRADEGUARD_LEDGER_FILL_STOP_COLD_ARCHIVE=PASS'
          }finally{
            Pop-Location
            Remove-Item -LiteralPath $log -Force -ErrorAction SilentlyContinue
          }
